式を譲渡する手法であり、手続は比較的シンプルである。", "株式譲渡は法人格に変動がないため簿外債務・偶発債務のリスクが高くなりやすく、より詳細なDDが行われる傾向にある。", "中小M&Aでは会社や事業の全部を譲渡することが必須であり、一部のみの譲渡は認められない。", "個人事業主が行う中小M&Aでは、株式譲渡の手法が用いられるのが通常である。"], "a": 1, "k": null, "ex": "GLは、株式譲渡は法人格に変動がないため簿外債務（未払残業代等）や偶発債務（紛争の損害賠償等）のリスクが高くなりやすく、より詳細なDDが行われる傾向にあるとする。事業譲渡は承継対象を選択でき、これらのリスクを比較的遮断しやすい。", "cn": ["誤り。株主が株式を譲渡し手続が比較的シンプルなのは株式譲渡である。", "正しい。法人格に変動がないため簿外・偶発債務リスクが高く、詳細なDDの傾向にある（GL p.48-49）。", "誤り。全部譲渡は必須でなく、一部譲渡もあるとされている。", "誤り。個人事業主の中小M&Aは事業譲渡（営業譲渡）が通常である。"], "src": "GL p.48-49", "ref": "n2-35", "lv": 1}, {"id": "PRB-002", "sub": "M&A実務", "top": "最終契約", "typ": "誤り", "stem": "中小M&Aガイドラインが株式譲渡・事業譲渡に共通する最終契約の主要な契約事項として例示するものに該当しないものはどれか。", "ch": ["競業避止義務", "経営者保証の扱い", "クロージングの前提条件", "仲介者・FAに支払う成功報酬の算定方法"], "a": 3, "k": null, "ex": "GLが例示する最終契約の主要契約事項は、譲渡対象、譲渡時期、譲渡対価、支払時期・方法、経営者・役職員の処遇、経営者保証の扱い、表明保証条項、補償条項、クロージングの前提条件、競業避止義務、契約の解除事由等の11項目である。仲介者・FAの報酬はアドバイザリー契約で定める事項である。", "cn": ["該当する。主要契約事項11項目の一つである。", "該当する。解除・引継ぎ義務、なされなかった場合の解除・補償等を定める。", "該当する。主要契約事項11項目の一つである。", "該当しない。成功報酬は仲介契約・FA契約で定める事項であり、最終契約の主要契約事項11項目には含まれない。"], "src": "GL p.49", "ref": "n2-35", "lv": 1}, {"id": "PRB-003", "sub": "M&A実務", "top": "最終契約", "typ": "正しい", "stem": "最終契約の締結とその後の流れに関する記述として、中小M&Aガイドラインに照らし正しいものはどれか。", "ch": ["譲渡対価は最終契約の締結時に全額支払われるのが通常であるため、最終契約締結後は秘密保持に配慮する必要はない。", "譲渡対価はクロージングを迎えて初めて支払われるのが通常であり、中小M&Aは最終契約の締結によって全て完了するものではない。", "最終契約の内容は仲介者・FAが確認するため、当事者が自ら内容を確認する必要性は乏しいとされる。", "最終契約について不安がある場合のセカンド・オピニオンは、調印後に求めるのが有効とされる。"], "a": 1, "k": null, "ex": "GLは、譲渡対価はクロージングで初めて支払われるのが通常であり、公表まで秘密保持を貫く必要があること、中小M&Aは最終契約締結によって全て完了するものではないことを示している。当事者自らが十分確認し、不安があれば調印前にセカンド・オピニオンを求めることも有効である。", "cn": ["誤り。対価はクロージングで支払われるのが通常で、公表まで秘密保持を貫く必要がある。", "正しい。GL p.49の記載どおりである。", "誤り。当事者が自らでも十分に確認することが重要とされる。", "誤り。セカンド・オピニオンは調印前に求めることが有効とされる。"], "src": "GL p.48-50", "ref": "n2-34", "lv": 1}, {"id": "PRB-004", "sub": "M&A実務", "top": "最終契約", "typ": "最も適切", "stem": "仲介者Xが支援した株式譲渡のクロージングから半年後、表明保証違反をめぐって譲り受け側と紛争になった譲り渡し側経営者から、Xに「相手方との交渉を代わりにやってほしい」と依頼があった。Xの対応として最も適切なものはどれか。", "ch": ["仲介者として両当事者の事情を熟知しているため、代理人として相手方と交渉し和解契約書を作成する。", "仲介者の役務提供は基本的にクロージング時点で終了し、紛争解決への関与は非弁行為に当たる可能性があるため、弁護士への相談を勧める。", "仲介者は中立・公平な立場にあるため、双方の主張を聴取して損害額を裁定し、双方に通知する。", "紛争はクロージング後の事象であり自らとは無関係であるため、弁護士への相談も含め一切の案内をせずに断る。"], "a": 1, "k": null, "ex": "GLは、仲介者・FAの役務提供は基本的にクロージング時点で終了すること、紛争解決への関与は非弁行為（弁護士法第72条）に該当する可能性があることを限界として挙げ、紛争が生じた場合は弁護士に支援を求めることを検討する必要があるとしている。", "cn": ["不適切。紛争解決への関与は非弁行為（弁護士法第72条）となる可能性がある。", "適切。GLは仲介者・FAの限界を示し、紛争時は弁護士に支援を求めることを検討する必要があるとする。", "不適切。紛争の解決に関与することは非弁行為となる可能性がある。", "不適切。GLは紛争時に弁護士に支援を求めることの検討を示しており、案内すらしないのは適切とはいえない。"], "src": "GL p.50", "ref": "n2-35", "lv": 2}, {"id": "PRB-005", "sub": "M&A実務", "top": "最終契約", "typ": "正しい", "stem": "譲り渡し側の経営者保証の扱いに関する記述として、中小M&Aガイドラインに照らし正しいものはどれか。", "ch": ["経営者保証の解除・移行は最終的には金融機関等の判断であり、クロージングを経て登記簿上の代表者が変更された後に行う必要がある。", "金融機関等への事前相談は情報漏洩のおそれがあるため、相談先を秘密保持条項の対象から除外すべきではない。", "譲り渡し側から金融機関等への事前相談を求められた場合、譲り受け側は交渉上の判断で実施を拒むことができるとされる。", "経営者保証は、最終契約の締結日に譲り受け側が金融機関に通知することで当然に解除される。"], "a": 0, "k": null, "ex": "GLは、経営者保証の解除・移行は最終的には金融機関等の判断であり、クロージングを経て登記簿上の代表者が変更された後に行う必要があるとする。金融機関等への事前相談は秘密保持契約を締結の上で行うことが望ましく、相談先は秘密保持条項の対象から除外し、譲り受け側は実施を拒むべきではない。", "cn": ["正しい。GL p.51の記載どおりである。", "誤り。相談先は秘密保持条項の対象から除外することが求められる。", "誤り。譲り受け側は実施を拒むべきではなく、誠実に対応することが求められる。", "誤り。解除・移行は最終的に金融機関等の判断で、代表者変更後に行う必要がある。"], "src": "GL p.50-52", "ref": "n2-36", "lv": 2}, {"id": "PRB-006", "sub": "M&A実務", "top": "最終契約", "typ": "組合せ", "stem": "経営者保証の解除・移行を確実に行うための最終契約上の定めについて、次の文章の空欄A〜Cに入る語句の組合せとして正しいものはどれか。\n「保証の解除・移行を譲り受け側の（A）として位置付け、（B）として設定するとともに、解除条項・補償条項等を盛り込む。万全を期すなら（C）に代表者の変更登記と解除・移行手続を同時に実施する。」", "ch": ["A：努力義務　B：クロージング後の誓約事項　C：クロージング日", "A：義務　B：クロージング条件　C：クロージング日", "A：義務　B：クロージング条件　C：最終契約締結日", "A：努力義務　B：表明保証事項　C：最終契約締結日"], "a": 1, "k": null, "ex": "GLは、最終契約で保証の解除・移行を譲り受け側の義務と明確に位置付け、①クロージング条件として設定し、②解除条項・補償条項等を盛り込むことを検討すべきとする。万全を期すならクロージング日に変更登記と解除・移行手続を同時に実施する。", "cn": ["誤り。GLは努力義務ではなく義務とし、クロージング条件として設定することを示す。", "正しい。GLの記載どおりの組合せである。", "誤り。代表者の変更はクロージングを経て行われるため、同時実施はクロージング日である。", "誤り。A〜Cのいずれも資料の記載と異なる。"], "src": "GL p.51-52", "ref": "n2-36", "lv": 2}, {"id": "PRB-007", "sub": "M&A実務", "top": "最終契約", "typ": "全て選べ", "stem": "M&A実施前に経営者保証の解除を金融機関に相談するにあたり、中小M&Aガイドラインが経営者保証ガイドラインに基づき実施すべきとする取組として挙げるものを全て選んだ組合せはどれか。\nア　法人と経営者との関係の明確な区分・分離\nイ　財務基盤の強化\nウ　財務状況の正確な把握と適時適切な情報開示\nエ　後継者候補による新たな個人保証の差入れ", "ch": ["ア、イ", "ア、ウ、エ", "ア、イ、ウ", "イ、ウ、エ"], "a": 2, "k": null, "ex": "GLは、M&A前の解除について、経営者保証ガイドラインの3点（ⅰ法人と経営者の区分・分離、ⅱ財務基盤の強化、ⅲ財務状況の正確な把握・適時適切な情報開示）を実施して解除を相談することを示し、中小企業活性化協議会への相談も有用としている。新たな個人保証の差入れは挙げられていない。", "cn": ["誤り。ウ（財務状況の把握・適時適切な開示）も含まれる。", "誤り。イが漏れており、エは解除のための取組ではない。", "正しい。経営者保証ガイドラインの3点はア〜ウである。", "誤り。アが漏れており、エは含まれない。"], "src": "GL p.50-51", "ref": "n2-36", "lv": 2}, {"id": "PRB-008", "sub": "M&A実務", "top": "最終契約", "typ": "最も適切", "stem": "譲り渡し側経営者の個人保証を確実に外す手段として、中小M&Aガイドラインが示すものとして最も適切なものはどれか。", "ch": ["最終契約において、保証解除を譲り受け側の努力義務として定めるにとどめる。", "表明保証条項に「クロージング後に経営者保証は解除される」旨を記載する。", "クロージング前に譲り渡し側経営者が単独で金融機関に保証解除を通知する。", "クロージング時に保証対象債務を譲り受け側の資力で返済し、別途借り換える。"], "a": 3, "k": null, "ex": "GLは、経営者保証の解除・移行が最終的に金融機関等の判断であることを踏まえ、確実な手段として、クロージング時に保証対象債務を譲り受け側の資力で返済し、別途借り換える方法を挙げている。", "cn": ["不適切。努力義務にとどめると解除が確実にならない。GLは義務化・クロージング条件化等を示す。", "不適切。解除・移行は最終的に金融機関等の判断であり、表明保証の記載で確実になるものではない。", "不適切。解除は金融機関等の判断で、代表者変更後に行う必要がある。", "適切。GL p.52が確実な手段として示す方法である。"], "src": "GL p.52", "ref": "n2-36", "lv": 2}, {"id": "PRB-009", "sub": "M&A実務", "top": "最終契約", "typ": "正しい", "stem": "DDを実施しない中小M&Aに関する記述として、中小M&Aガイドラインに照らし正しいものはどれか。", "ch": ["DDを実施しない場合は表明保証条項が不要となるため、譲り渡し側の責任は軽減される。", "中小M&Aでは経営者ヒアリングで十分なリスク評価ができるため、DDの非実施が推奨されている。", "経営者へのヒアリングのみによるリスク評価には限界があり、不十分な場合には譲り渡し側の表明保証・補償の負担が増加するおそれがある。", "DDを実施しないことによるリスクは譲り受け側のみが負い、譲り渡し側に影響はない。"], "a": 2, "k": null, "ex": "GLはトラブルリスク②として、DDを実施せず経営者ヒアリングのみでリスク評価することには限界があり、それが不十分であると譲り渡し側の表明保証・補償の負担増加につながることを挙げている。", "cn": ["誤り。むしろ表明保証・補償の負担が増加するおそれがある。", "誤り。ヒアリングのみのリスク評価には限界があるとされている。", "正しい。GL p.52の記載どおりである。", "誤り。譲り渡し側の表明保証・補償の負担増加につながる。"], "src": "GL p.52", "ref": "n2-36", "lv": 1}, {"id": "PRB-010", "sub": "M&A実務", "top": "最終契約", "typ": "最も適切", "stem": "あなたは譲り渡し側A社のFAである。譲り受け側B社から、期間や責任上限の定めのない定型的な表明保証条項を含む最終契約案が提示された。A社社長への助言として最も適切なものはどれか。", "ch": ["定型的な条項であり交渉の余地はないため、そのまま受け入れるよう助言する。", "B社が当該条項を求める理由を確認して議論し、DD結果を踏まえて認識を擦り合わせたうえで、期間・上限の設定や表明保証保険の活用を検討するよう助言する。", "責任上限を設けない方が紛争になりにくいため、無制限のまま受け入れるよう助言する。", "表明保証の範囲を広げる代わりに、DDを省略するようB社に提案するよう助言する。"], "a": 1, "k": null, "ex": "GLは、表明保証に期間や責任上限がない、適用場面が一義的でない等の場合は過大な責任のリスクがあり、関係悪化時に紛争化しやすいとする。DD結果を踏まえた認識の擦り合わせ、求める理由の確認と議論が望ましく、定型的な無期限・無制限の条項は慎重に検討すべきで、表明保証保険の活用も考えられる。", "cn": ["不適切。定型的な無期限・無制限の表明保証条項は慎重に検討すべきとされている。", "適切。GLは理由の確認・議論とDD結果を踏まえた擦り合わせを求め、表明保証保険の活用も挙げる。", "不適切。期間や上限がないと過大な責任のリスクがあり、紛争化しやすい。", "不適切。DD非実施は譲り渡し側の表明保証・補償の負担増につながる。"], "src": "GL p.52-53", "ref": "n2-36", "lv": 2}, {"id": "PRB-011", "sub": "M&A実務", "top": "最終契約", "typ": "誤り", "stem": "クロージング後の支払・手続に関する記述として、中小M&Aガイドラインに照らし誤っているものはどれか。", "ch": ["支払・手続はクロージング時に実行することが基本であり、後になる場合は慎重な検討が求められる。", "役員退職慰労金の後払いは、経営者・役員が引継ぎのため残留する際のインセンティブとして活用される。", "株式の段階的取得は、ノウハウ引継ぎのため段階的に経営権を移転するもので、意向の変化により不履行となるリスクがある。", "譲渡対価の分割払いは、支払期間が長期にわたるほど譲り受け側の負担が平準化されるため、不履行のリスクは低くなる。"], "a": 3, "k": null, "ex": "GLは、支払・手続はクロージング時に実行することが基本とし、クロージング後となる場合の手法として譲渡対価の分割払い、役員退職慰労金の後払い、株式の段階的取得を挙げる。分割払いは不履行リスクがあり、支払期間が長期にわたる場合は特に高いとされる。", "cn": ["正しい。GL p.53の記載どおりである。", "正しい。ただし不履行リスクがある。", "正しい。GL p.54の記載どおりである。", "誤り。支払期間が長期にわたる場合は不履行リスクが特に高いとされる。"], "src": "GL p.53-54", "ref": "n2-36", "lv": 2}, {"id": "PRB-012", "sub": "M&A実務", "top": "最終契約", "typ": "正しい", "stem": "アーンアウト条項の説明として、中小M&Aガイドラインに照らし正しいものはどれか。", "ch": ["クロージング後の一定期間（5年以上が多い）に目標が達成されなかった場合に、譲り渡し側が対価の一部を返還する条項", "クロージング後の一定期間（3年以内が多い）に財務・非財務の目標が達成された場合に、譲り受け側が追加対価を支払う条項", "最終契約締結からクロージングまでの企業価値の変動に応じて譲渡額を調整する条項", "過年度決算の修正等が生じた場合に、譲り渡し側から譲り受け側に支払金を払い戻す条項"], "a": 1, "k": null, "ex": "アーンアウト条項は、クロージング後の一定期間（3年以内が多い）における特定時点で財務・非財務目標の達成に応じて追加対価を支払うもので、ベンチャー企業で多く用いられる。株価調整条項、支払金の返還に関する条項とは区別する。", "cn": ["誤り。期間は3年以内が多く、目標達成時に追加対価を支払うものである。", "正しい。GL p.54の説明どおりである。", "誤り。これは株価調整条項の説明である。", "誤り。これは支払金の返還に関する条項の説明である。"], "src": "GL p.54", "ref": "n2-36", "lv": 1}, {"id": "PRB-013", "sub": "M&A実務", "top": "最終契約", "typ": "誤り", "stem": "最終契約後の状況に応じて支払を変動させる条項に関する記述として、中小M&Aガイドラインに照らし誤っているものはどれか。", "ch": ["株価調整条項は、中小M&Aでは最終契約からクロージングまでの期間が長いことが多いため、積極的に設定すべきとされる。", "アーンアウト条項は、バリュエーションの差を埋める目的で設けるかどうかは慎重に検討すべきとされる。", "支払金の返還に関する条項は、発動事象が曖昧であると当事者間の争いにつながり得る。", "これらの条項を設ける場合は、発生条件・方法の妥当性を確認し、明確かつ詳細な内容とする必要がある。"], "a": 0, "k": null, "ex": "GLは、支払の変動に関する条項を設ける場合は明確かつ詳細な内容とする必要があるとする。株価調整条項は最終契約からクロージングまでの企業価値変動で譲渡額を調整するものだが、中小M&Aではその期間が短いことが多いため慎重に検討すべきとされる。", "cn": ["誤り。中小M&Aではその期間が短いことが多いため、慎重に検討すべきとされる。", "正しい。DD・調整を十分実施した上で具体的リスクに対応して設定されるべきとされる。", "正しい。GL p.55の記載どおりである。", "正しい。GL p.54の記載どおりである。"], "src": "GL p.54-55", "ref": "n2-36", "lv": 2}, {"id": "PRB-014", "sub": "M&A実務", "top": "最終契約", "typ": "組合せ", "stem": "経営者に関連する資産の整理について、次の文章の空欄A〜Cに入る語句の組合せとして、中小M&Aガイドラインに照らし正しいものはどれか。\n「貸借対照表に計上されていない経営者個人名義の土地を事業に使用している場合は（A）。会社の貸借対照表に計上されている経営者の自家用車は（B）。これらは可能な限り（C）に整理することが望ましい。」", "ch": ["A：会社から経営者個人に売却する　B：譲り受け側に売却又は引き継ぐ　C：最終契約前", "A：譲り受け側に売却又は引き継ぐ　B：会社から経営者個人に売却する　C：最終契約前", "A：譲り受け側に売却又は引き継ぐ　B：会社から経営者個人に売却する　C：クロージング後", "A：会社から経営者個人に売却する　B：譲り受け側に売却又は引き継ぐ　C：クロージング後"], "a": 1, "k": null, "ex": "GLは、BS外の経営者個人資産で事業に使用しているもの（個人名義の土地等）は譲り受け側に売却又は引継ぎ、BS上だが個人用のもの（自家用車等）は会社から経営者個人に売却するとし、可能な限り最終契約前に整理することが望ましいとする。残る場合は対象資産・移転方法・譲渡額を契約に明記することが重要である。", "cn": ["誤り。AとBが逆である。", "正しい。GL p.55の記載どおりの組合せである。", "誤り。可能な限り最終契約前に整理することが望ましいとされる。", "誤り。A・B・Cのいずれも資料と異なる。"], "src": "GL p.55", "ref": "n2-36", "lv": 2}, {"id": "PRB-015", "sub": "M&A実務", "top": "最終契約", "typ": "正しい", "stem": "最終契約からクロージングまでの期間に関する記述として、中小M&Aガイドラインに照らし正しいものはどれか。", "ch": ["6ヶ月以上等の期間が特段の事情なく設けられると、最終契約の修正が必要となるリスクがあるが、それより短い期間であれば問題はないとされる。", "期間を長く設けるほど準備が整うため、最終契約の修正や不履行のリスクは低減するとされる。", "2ヶ月以上等の期間が特段の事情なく設けられると、業績等の変化により最終契約の修正が必要となるリスクや不履行のリスクがある。", "期間を長く設ければ企業価値の変動は株価調整条項で必ず吸収されるため、期間の長さはトラブルリスクとされていない。"], "a": 2, "k": null, "ex": "GLはトラブルリスク⑦として、最終契約からクロージングまでに2ヶ月以上等の期間が特段の事情なく設けられると、その間の業績等の変化により最終契約の修正が必要となるリスクや不履行のリスクがあることを挙げている。", "cn": ["誤り。GLが例示する目安は2ヶ月以上である。", "誤り。期間が長いと業績変化等による修正・不履行のリスクがある。", "正しい。GL p.55-56の記載どおりである。", "誤り。期間の長さ自体がトラブルリスク⑦として挙げられている。"], "src": "GL p.55-56", "ref": "n2-36", "lv": 1}, {"id": "PRB-016", "sub": "M&A実務", "top": "クロージング", "typ": "誤り", "stem": "クロージングに関する記述として、中小M&Aガイドラインに照らし誤っているものはどれか。", "ch": ["クロージングでは、譲渡対価の全部又は一部が確実に入金されたことを確認することが必要である。", "事業譲渡の対象に不動産が含まれる場合でも、登記はクロージング後に相当期間をおいて行えばよいため、クロージング時に登記必要書類を授受する必要はない。", "不動産の登記手続については、司法書士等と日程を調整しておく。", "担保権の解除（抹消登記）については、取引金融機関との事前調整が必要となることがある。"], "a": 1, "k": null, "ex": "GLは、クロージングでは株式等の譲渡と譲渡対価の支払が行われ、譲渡対価の確実な入金を確認することが必要とする。事業譲渡で不動産が含まれる場合はクロージング後速やかに登記手続を行う必要があるため、登記必要書類を授受するのが通常である。", "cn": ["正しい。GL p.56の記載どおりである。", "誤り。クロージング後速やかに登記を行う必要があるため、登記必要書類を授受するのが通常である。", "正しい。GL p.56の記載どおりである。", "正しい。GL p.56の記載どおりである。"], "src": "GL p.56", "ref": "n2-37", "lv": 1}, {"id": "PRB-017", "sub": "M&A実務", "top": "最終契約", "typ": "最も適切", "stem": "仲介者として最終契約の調整を支援している。最終契約書の作成・調整に関する対応として、スキルマップに照らし最も適切なものはどれか。", "ch": ["法的拘束力を有する最終契約書の完成版を仲介者が作成し、双方に押印を求める。", "最終契約書は草案の提示に留め、完成版は双方が弁護士の助言を得ながら当事者同士で作成するよう促す。", "成約を優先し、双方に条件面での妥協を促して早期に合意をまとめる。", "完全合意条項を設けたうえで、細かな重要事項は口頭で確認しておけば足りると説明する。"], "a": 1, "k": null, "ex": "SMは、最終契約は成立のための妥協を前提とせず依頼者の意向に沿って交渉し、結果を忠実に契約へ落とし込むこと、支援者が法的拘束力のある最終契約書を作成すると非弁行為の可能性があるため草案提示に留めることを示す。完全合意条項を設ける場合は重要事項を全て記載する。", "cn": ["不適切。非弁行為に当たる可能性がある。", "適切。支援者が法的拘束力を有する最終契約書を作成すると非弁行為の可能性がある。", "不適切。成立のための妥協前提ではなく、依頼者の意向に沿って交渉し結果を忠実に落とし込む。", "不適切。完全合意条項があると書面外・口頭の合意は担保されないため、重要事項は全て記載する。"], "src": "SM p.136, 147", "ref": "n2-38", "lv": 2}, {"id": "PRB-018", "sub": "M&A実務", "top": "最終契約", "typ": "最も適切", "stem": "譲り受け側B社のFAとして関与している。DDの結果、譲り渡し側A社に未払残業代等の簿外債務の懸念があり、金額の定量化も難しい。B社は、A社の主力事業と関連資産に限定して引き継げるなら取引を続けたい意向である。スキルマップが示すリスク対応の方向性として最も適切なものはどれか。", "ch": ["買収スキームを株式譲渡から事業譲渡に変更し、承継対象を限定する方向で検討する。", "買収スキームを事業譲渡から株式譲渡に変更し、手続の簡便化を図る。", "表明保証保険を活用し、DDで判明した簿外債務の懸念を付保対象とする。", "DCF法による正常収益力の算定に簿外債務を反映させ、株式譲渡のまま進める。"], "a": 0, "k": null, "ex": "SMはリスク対応の方向性として、受入れ、価格調整、スキーム変更、クロージングまでの解消、表明保証・補償（エスクロー）、表明保証保険、買収断念の7つを示す。簿外債務が懸念され、承継対象を限定したい場合は、株式譲渡から事業譲渡へのスキーム変更が挙げられている。", "cn": ["適切。SMは簿外債務が懸念される場合のスキーム変更（株式譲渡→事業譲渡）を挙げる。", "不適切。株式譲渡は法人格ごと承継するため、簿外債務を遮断できない。", "不適切。クロージング以前に知っていた違反等は免責となり付保されない。", "不適切。定量化が難しく、承継対象を限定したいB社の意向にも合わない。"], "src": "SM p.139-141", "ref": "n2-38", "lv": 2}, {"id": "PRB-019", "sub": "M&A実務", "top": "最終契約", "typ": "正しい", "stem": "DD後のリスク対応の手段に関する記述として、スキルマップに照らし正しいものはどれか。", "ch": ["表明保証保険は、譲り受け側のみが加入できる。", "表明保証保険では、クロージング以前に当事者が知っていた違反も補償の対象となる。", "時価純資産法で評価している場合は、リスクを正常収益力に反映させて買収価格を調整する。", "エスクローは、対価の一部を第三者に預託するもので、手数料が発生する。"], "a": 3, "k": null, "ex": "SMは、発現時に譲り渡し側にコストを負担させる方法として表明保証・補償とエスクロー（第三者への預託で手数料が発生）を挙げる。表明保証保険は双方加入可能だが、クロージング以前に知っていた違反等は免責で付保されない。価格調整は、時価純資産法では含み損益・簿外債務、DCF法・マルチプル法では正常収益力に反映する。", "cn": ["誤り。表明保証保険は双方が加入可能とされる。", "誤り。クロージング以前に知っていた違反等は免責となり付保されない。", "誤り。正常収益力への反映はDCF法・マルチプル法の場合で、時価純資産法では含み損益・簿外債務を反映する。", "正しい。SMはエスクロー（第三者への預託）で手数料が発生すると示す。"], "src": "SM p.139-141", "ref": "n2-38", "lv": 2}, {"id": "PRB-020", "sub": "M&A実務", "top": "最終契約", "typ": "計算", "stem": "譲り渡し側の経営者に支給する役員退職金について、スキルマップが示す損金算入限度額の目安（最終月額報酬×役員勤続年数×功績倍率）で計算した場合の金額として正しいものはどれか。\n・最終月額報酬：100万円\n・役員勤続年数：30年\n・功績倍率：3.0倍", "ch": ["3,000万円", "3億6,000万円", "10億8,000万円", "9,000万円"], "a": 3, "k": null, "ex": "SMは役員退職金の損金算入限度額の目安を「最終月額報酬×役員勤続年数×功績倍率」とする。100万円×30年×3.0＝9,000万円となる。税務上の詳細は財務・税務タブを参照。", "cn": ["誤り。功績倍率を乗じていない。", "誤り。年額（1,200万円）で計算し、功績倍率を乗じていない。", "誤り。月額ではなく年額（1,200万円）で計算している。", "正しい。100万円×30年×3.0＝9,000万円。"], "src": "SM p.143", "ref": "n2-38", "lv": 2}, {"id": "PRB-021", "sub": "M&A実務", "top": "最終契約", "typ": "誤り", "stem": "表明保証条項の調整に関する記述として、スキルマップに照らし誤っているものはどれか。", "ch": ["表明保証の主な事項として、税務申告の適正や、未開示の偶発債務・訴訟がないこと等が挙げられる。", "譲り渡し側がDD等で情報を開示していれば、開示情報を表明保証から除外する規定がなくても、開示済みの事項が補償の対象となることはない。", "無制限・過大な表明保証は、譲り渡し側の負担が過大となるおそれがある。", "譲り受け側のみに弁護士がついている場合等の情報格差に配慮し、必要に応じ譲り渡し側に弁護士を紹介する。"], "a": 1, "k": null, "ex": "SMは、譲り渡し側がDD等で情報開示していても、開示した情報を表明保証条項から除外する規定がない場合は補償の対象とされるリスクが残る点に留意するとしている。また、情報格差への配慮や無制限・過大な表明保証の回避も求められる。", "cn": ["正しい。SM p.145が例示する事項である。", "誤り。除外規定がない場合、開示した情報についても補償の対象とされるリスクが残る。", "正しい。SM p.145の記載どおりである。", "正しい。譲り渡し側が適切な助言を受けられるよう配慮することが求められる。"], "src": "SM p.145", "ref": "n2-38", "lv": 2}, {"id": "PRB-022", "sub": "M&A実務", "top": "最終契約", "typ": "全て選べ", "stem": "スキルマップが例示するクロージング条項として設定される主な事項のうち、「譲り受け側の義務」に分類されているものを全て選んだ組合せはどれか。\nア　譲り渡し側の経営者保証の解除又は解除に係る同意取得\nイ　買収代金の資金調達可否の確認\nウ　キーマン・従業員の継続勤務同意\nエ　MAC条項", "ch": ["ア、ウ", "イ、エ", "ア、イ", "ウ、エ"], "a": 2, "k": null, "ex": "SMは、譲り渡し側の義務として取締役会の承認決議、キーマン・従業員の継続勤務同意、MAC条項、COC条項への対応、許認可・契約の移転、株券の交付等を、譲り受け側の義務として経営者保証の解除又は解除に係る同意取得、買収代金の資金調達可否の確認、買い手のファイナンス条項等を例示している。", "cn": ["誤り。ウは譲り渡し側の義務に分類される。", "誤り。エ（MAC条項）は譲り渡し側の義務に分類される。", "正しい。ア・イ（及び買い手のファイナンス条項）が譲り受け側の義務に分類される。", "誤り。いずれも譲り渡し側の義務に分類される。"], "src": "SM p.146", "ref": "n2-38", "lv": 2}, {"id": "PRB-023", "sub": "M&A実務", "top": "最終契約", "typ": "最も適切", "stem": "仲介者Xは、譲り渡し側A社の社長から「経営者保証の解除をクロージングの前提条件にしてほしい」と要望された。一方、X社内では、報酬計上のため期末までにクロージングさせたいとの声がある。Xの対応として最も適切なものはどれか。", "ch": ["期末までのクロージングを優先し、保証解除を前提条件としないようA社社長を説得する。", "保証解除は前提条件とせず、クロージング後の誓約事項として定めることを譲り受け側と取り決め、A社社長には結果のみ伝える。", "A社社長の意向を踏まえて保証解除を前提条件として設定する方向で調整し、充足に必要な最終契約からクロージングまでの期間を慎重に検討する。", "前提条件を設定すると成約できない可能性が高まるため、保証の扱いは最終契約に記載しないよう双方に助言する。"], "a": 2, "k": null, "ex": "SMは、条件によっては充足されない場合にM&Aを実行しない方がよいもの（経営者保証の解除等）があるため、依頼者の意向を踏まえて条件と期間を慎重に検討する必要があるとし、支援者の都合でクロージングを急ぐために依頼者の意向に反して前提条件の設定を回避する対応を決してしてはならないとしている。", "cn": ["不適切。支援者の都合でクロージングを急ぐために前提条件の設定を回避する調整は決してしてはならない。", "不適切。依頼者の意向に反し、支援者の都合で前提条件化を回避する対応である。", "適切。依頼者の意向と充足可能性を踏まえて条件と期間を検討する。", "不適切。経営者保証の扱いは最終契約の主要契約事項であり、記載しないのは依頼者の意向に反する。"], "src": "SM p.146", "ref": "n2-38", "lv": 2}, {"id": "PRB-024", "sub": "M&A実務", "top": "最終契約", "typ": "正しい", "stem": "クロージング後の誓約事項（コベナンツ）に関する記述として、スキルマップに照らし正しいものはどれか。", "ch": ["競業避止義務や従業員の引き抜き禁止は、譲り受け側の誓約事項として定めるのが一般的である。", "従業員の雇用継続や本店・社名の取決めは、譲り渡し側の誓約事項として定めるのが一般的である。", "クロージング後の誓約事項の違反は救済が容易であるため、実現可能性を事前に確認する必要はない。", "経営者保証の正式な移行・解除には通常役員変更登記が必要であり、信用保証協会が保証している場合はその同意も必要となる。"], "a": 3, "k": null, "ex": "SMは、譲り渡し側の誓約事項として競業避止、引き抜き禁止、引継ぎ協力、精算等を、譲り受け側の誓約事項として経営者保証解除、雇用継続、本店・社名の取決め等を例示する。クロージング後の違反は救済が難しいため実現可能性を確認し、保証の移行・解除には通常役員変更登記が必要で、信用保証協会の保証があればその同意も必要となる。", "cn": ["誤り。これらは譲り渡し側の誓約事項として例示されている。", "誤り。これらは譲り受け側の誓約事項として例示されている。", "誤り。クロージング後の違反は救済の難易度が高いため、実現可能性を確認する。", "正しい。SM p.147の記載どおりである。"], "src": "SM p.147", "ref": "n2-38", "lv": 3}, {"id": "PRB-025", "sub": "M&A実務", "top": "クロージング", "typ": "組合せ", "stem": "株式譲渡のクロージング手続について、次の文章の空欄A〜Cに入る語句の組合せとして、スキルマップに照らし正しいものはどれか。\n「譲り渡し側が株式譲渡制限会社であれば、（A）で譲渡の承認が必要となる。株券発行会社では（B）が必要であり、株券不発行会社では（C）で完了する。」", "ch": ["A：株主総会（取締役会設置会社でも常に株主総会）　B：株券の交付　C：株主名簿の名義書換え", "A：取締役会（非設置会社は株主総会）　B：株券の交付　C：株主名簿の名義書換え", "A：取締役会（非設置会社は株主総会）　B：株主名簿の名義書換え　C：株券の交付", "A：株主総会（取締役会設置会社でも常に株主総会）　B：役員変更登記　C：株券の交付"], "a": 1, "k": null, "ex": "SMは、譲り渡し側が株式譲渡制限会社であれば取締役会（非設置の場合は株主総会）で譲渡の承認が必要とし、株券発行会社では株券の交付が必要、株券不発行会社では株主名簿の名義書換えで完了するとしている。", "cn": ["誤り。取締役会設置会社では取締役会で承認する。", "正しい。SM p.156-157の記載どおりである。", "誤り。BとCが逆である。", "誤り。A〜Cのいずれも資料と異なる。"], "src": "SM p.156-157", "ref": "n2-39", "lv": 2}, {"id": "PRB-026", "sub": "M&A実務", "top": "クロージング", "typ": "正しい", "stem": "合併・会社分割のクロージングに関する記述として、スキルマップに照らし正しいものはどれか。", "ch": ["吸収合併は効力発生日に効力を生じ、効力発生日から2週間以内に登記を行う必要がある。", "新設合併は効力発生日に効力を生じ、設立登記は効力発生後に任意で行えばよい。", "吸収分割は登記をした日に効力を生じるため、効力発生日を定める必要はない。", "吸収合併・吸収分割の登記は、効力発生日から1か月以内に行えばよい。"], "a": 0, "k": null, "ex": "SMは、吸収合併・吸収分割は効力発生日に効力を生じ、効力発生日から2週間以内に登記を行う必要があるとする。新設合併・新設分割は、新設会社の設立登記が効力発生に必要である。", "cn": ["正しい。SM p.157の記載どおりである。", "誤り。新設合併は設立登記が効力発生に必要である。", "誤り。吸収分割は効力発生日に効力を生じ、2週間以内に登記する。", "誤り。効力発生日から2週間以内に登記を行う必要がある。"], "src": "SM p.157", "ref": "n2-39", "lv": 2}, {"id": "PRB-027", "sub": "M&A実務", "top": "クロージング", "typ": "誤り", "stem": "事業譲渡のクロージング手続に関する記述として、スキルマップに照らし誤っているものはどれか。", "ch": ["賃貸借・リース契約は借主が変わるため、貸主の承諾書が常に必要となる。", "水道光熱等を含む全ての契約について切替えが必要となる。", "効力発生日を最終契約で定めておけば、資産の譲渡や契約の移管について相手方の同意を得る必要はない。", "クロージングまでに移転が完了しない資産・契約は、移転義務を定めるか価格調整で対応する。"], "a": 2, "k": null, "ex": "SMは、事業譲渡では効力発生日を定めても資産譲渡・契約移管には相手方の同意が必要であり、賃貸借・リースの貸主の承諾書（借主が変わるため常に必要）、従業員の退職・新規雇用の承諾、全契約の切替、許認可の準備等が必要とする。移転未了分は移転義務か価格調整で対応する。", "cn": ["正しい。SM p.158の記載どおりである。", "正しい。SM p.158の記載どおりである。", "誤り。効力発生日を定めても、資産譲渡・契約移管には相手方の同意が必要である。", "正しい。SM p.158の記載どおりである。"], "src": "SM p.158", "ref": "n2-39", "lv": 2}, {"id": "PRB-028", "sub": "M&A実務", "top": "クロージング", "typ": "最も適切", "stem": "最終契約締結後、クロージング前に、最終契約の一部を変更する必要が生じた。また、前提条件の一つであるキーマンの継続勤務同意が得られない可能性も出てきた。支援者の対応として、スキルマップに照らし最も適切なものはどれか。", "ch": ["覚書は形式的な書類であるため、最終契約に関与していない事務担当者に作成させる。", "前提条件が充足されない場合でも、予定日にクロージングを実行することを原則とする。", "変更のための覚書は最終契約に関与した者が作成し、キーマンの同意が得られない場合の対応（延期か妥協か）を事前に当事者と協議しておく。", "条件未達の可能性は当事者を動揺させるため、実際に未達となるまで当事者に伝えない。"], "a": 2, "k": null, "ex": "SMは、最終契約を事後的に変更する覚書は最終契約に関与した者が作成すべきとし、条件未達の場合に備えて事前にシナリオを練り、未達時の対応策（例：キーマンの同意が得られなければ延期か妥協か）を合意しておくことを示している。", "cn": ["不適切。覚書は最終契約に関与した者が作成すべきとされる。", "不適切。未達時は延期か妥協か等の対応策を合意しておく必要がある。", "適切。覚書の作成者と、条件未達時のシナリオ・対応策の事前合意がSMの示すとおりである。", "不適切。条件未達に備え事前にシナリオを練り、対応策を合意しておくことが求められる。"], "src": "SM p.154-155", "ref": "n2-39", "lv": 2}, {"id": "PRB-029", "sub": "M&A実務", "top": "クロージング", "typ": "正しい", "stem": "クロージング当日の運営と決済に関する記述として、スキルマップに照らし正しいものはどれか。", "ch": ["前日までにプレクロージングを行い、当日は形式的な書類と金銭の授受に留めることが望ましい。", "前提条件の充足を確認した場合、譲り受け側は表明保証違反に基づく補償請求権を放棄したものとみなされる。", "前提条件の充足確認は、当事者の負担軽減のため弁護士の立会いを避け、仲介者のみで行うことが望ましい。", "金融機関の窓口が混雑しない日曜や祝日を決済日に設定することが望ましい。"], "a": 0, "k": null, "ex": "SMは、前提条件の充足確認は弁護士立会いの下が望ましく、前日までにプレクロージングを行って当日は形式的な書類と金銭の授受に留めるとする。充足の確認は表明保証違反時の補償請求権の放棄を意味せず、決済日を日曜・祝日にすると入金確認ができない点にも注意する。", "cn": ["正しい。SM p.164の記載どおりである。", "誤り。充足の確認は補償請求権の放棄を意味しない。", "誤り。充足確認は弁護士立会いの下で行うことが望ましい。", "誤り。日曜や祝日にすると入金確認ができない。"], "src": "SM p.162, 164-166", "ref": "n2-39", "lv": 2}, {"id": "PRB-030", "sub": "M&A実務", "top": "クロージング", "typ": "最も適切", "stem": "クロージングに際し、PMIを見据えて譲り渡し側A社の主要取引先に今回のM&Aを説明することになった。説明を行う者として、スキルマップに照らし最も適切なものはどれか。", "ch": ["当該取引先と最も強い関係を持つ譲り渡し側の人物", "中立的な立場にある仲介者の担当者", "譲り受け側の新任代表者のみ（譲り渡し側は関与しない）", "説明者を置かず、書面による通知のみ"], "a": 0, "k": null, "ex": "SMは、PMIを見据えた取組として取引先への説明は最も強い関係を持つ譲り渡し側の人物が実施するとし、PMIの取引先引継ぎでも、成立前の事前説明を怠ると取引縮小・停止の可能性があるため最も強い関係の人物の協力を得ることを示している。", "cn": ["適切。SMは取引先への説明は最も強い関係を持つ譲り渡し側の人物が実施するとする。", "不適切。取引先との関係性が弱く、取引縮小・停止のリスクを高めかねない。", "不適切。最も強い関係を持つ譲り渡し側の人物の協力を得ることが示されている。", "不適切。事前説明を怠ると取引縮小・停止の可能性があるとされる。"], "src": "SM p.163／p.177", "ref": "n2-39", "lv": 1}, {"id": "PRB-031", "sub": "M&A実務", "top": "クロージング後（PMI）", "typ": "正しい", "stem": "クロージング後の譲り渡し側経営者の対応に関する記述として、中小M&Aガイドラインに照らし正しいものはどれか。", "ch": ["引継ぎに要する期間は1か月程度が多いため、譲り渡し側経営者はクロージング後速やかに退任するのが通常である。", "譲り渡し側経営者は、クロージングにより一切の協力義務から解放される。", "経営者保証の移行が円滑に進まない場合は、まず仲介者に相手方との交渉を依頼することが望ましい。", "譲り渡し側経営者は円滑な引継ぎに誠実に対応する必要があり、引継ぎには3か月〜1年程度を要することが多い。"], "a": 3, "k": null, "ex": "GLは、譲り渡し側経営者はクロージング後もPMIとして誠実に対応する必要があり、引継ぎには3か月〜1年程度を要することが多いとする。経営者保証が円滑に移行しない等のトラブルは早急に弁護士へ相談することが望ましい。", "cn": ["誤り。引継ぎには3か月〜1年程度を要することが多い。", "誤り。PMIとして誠実に対応する必要があり、最終契約上の協力義務も果たす。", "誤り。早急に弁護士へ相談することが望ましい。仲介者・FAには限界がある。", "正しい。GL p.56-57の記載どおりである。"], "src": "GL p.56-57", "ref": "n2-40", "lv": 1}, {"id": "PRB-032", "sub": "M&A実務", "top": "クロージング後（PMI）", "typ": "全て選べ", "stem": "中小M&Aガイドラインがクロージング後の引継ぎ作業の例として挙げるもののうち、「事業譲渡」の場合に特有の作業を全て選んだ組合せはどれか。\nア　売掛金の振込先口座の変更\nイ　売掛金・買掛金の清算\nウ　代表者変更のための株主総会・取締役会や登記手続\nエ　給与体系・就業規則等の統一", "ch": ["ア、イ、エ", "ア、ウ", "イ、ウ、エ", "ア、イ、ウ、エ"], "a": 0, "k": null, "ex": "GLは引継ぎ作業の例として、共通（役員・従業員・取引先への報告、各種契約の名義変更・経営者保証解除等、業務フローの引継ぎ）、株式譲渡（代表者変更のための株主総会・取締役会や登記手続）、事業譲渡（売掛金の振込先口座の変更、売掛金・買掛金の清算、給与体系・就業規則等の統一）を挙げる。", "cn": ["正しい。ア・イ・エが事業譲渡の作業例である。", "誤り。ウは株式譲渡の作業例であり、イ・エが漏れている。", "誤り。ウは株式譲渡の作業例で、アが漏れている。", "誤り。ウは株式譲渡の作業例である。"], "src": "GL p.56-57", "ref": "n2-41", "lv": 2}, {"id": "PRB-033", "sub": "M&A実務", "top": "クロージング後（PMI）", "typ": "正しい", "stem": "PMIに関する記述として、スキルマップに照らし正しいものはどれか。", "ch": ["PMIの実施主体は仲介者・FAであり、譲り受け側はその計画に従って統合を進める。", "M&Aの成功はクロージングの成立によって決まるため、PMIは付随的な取組と位置付けられる。", "PMIの検討は、情報管理の観点からクロージング後に開始することが望ましい。", "PMIの実施主体は譲り受け側であり、仲介者・FAは求めに応じてプロセスで取得した情報をPMI支援機関に連携することが求められる。"], "a": 3, "k": null, "ex": "SMは、PMIの目的を譲り受けた事業の円滑な継続とさらなる成長とし、実施主体は譲り受け側でPMI支援機関が支援するとする。M&Aの成功は当初期待した効果の実現によるため、プロセスの段階からPMIを見据えることが望ましく、求めに応じた情報連携も求められる。", "cn": ["誤り。実施主体は譲り受け側で、PMI支援機関が支援する。", "誤り。成功は当初期待した効果を実現できるかによる。", "誤り。プロセスの段階からPMIを見据えた検討を開始することが望ましい。", "正しい。SM p.168・170の記載どおりである。"], "src": "SM p.168-170", "ref": "n2-42", "lv": 1}, {"id": "PRB-034", "sub": "M&A実務", "top": "クロージング後（PMI）", "typ": "最も適切", "stem": "譲り受け側B社のFAとして、M&A成立後の従業員への説明について助言する。スキルマップに照らし最も適切なものはどれか。", "ch": ["混乱を避けるため、部署ごとに時期をずらして数か月かけて順次説明するよう助言する。", "情報管理を徹底するため、キーパーソンにも全従業員への説明会と同時に初めて伝えるよう助言する。", "キーパーソンには先行して伝えて意見を聞き、成立後遅滞なく（例：Day1）全従業員に同時に、等しく、正確に伝える説明会を開くよう助言する。", "労働条件・給与体系は従業員の動揺を招くため、説明会では触れないよう助言する。"], "a": 2, "k": null, "ex": "SMは、キーパーソンに先行して伝え意見を聞いたうえで、成立後遅滞なく（例：Day1）全従業員に同時に、等しく、正確に伝える説明会を行うとする。説明事項は譲り受け側の基本情報、目的、労働条件・給与体系、今後の代表者・勤務場所・商号等で、個別面談で補完する。", "cn": ["不適切。全従業員に同時に、等しく、正確に伝えることが示されている。", "不適切。キーパーソンには先行して伝え意見を聞くことが示されている。", "適切。SM p.174-175の示す手順である。", "不適切。説明会の事項に労働条件・給与体系が含まれている。"], "src": "SM p.174-175", "ref": "n2-42", "lv": 2}, {"id": "PRB-035", "sub": "M&A実務", "top": "クロージング後（PMI）", "typ": "正しい", "stem": "即効性のある就労環境の改善（クイック・ヒット）に関する記述として、スキルマップに照らし正しいものはどれか。", "ch": ["Day.30以内を目途に実行することが望ましく、アンケート等で不便を把握する前に着手することが重要とされる。", "Day.365以内を目途に、人事制度の全面刷新などの大規模施策として実行することが望ましい。", "Day.100以内を目途に実行することが望ましく、例として賃金引上げ、トイレ改修等の設備整備、PC一人1台・個人メールの付与、表彰制度が挙げられる。", "クイック・ヒットは譲り渡し側経営者が主体となり、クロージング前に実施することが望ましい。"], "a": 2, "k": null, "ex": "SMは、Day.100以内を目途に即効性のある就労環境改善策（クイック・ヒット）を実行することが望ましいとし、賃金引上げ、設備・備品整備（トイレ改修、制服新調等）、PC一人1台・個人メール付与、表彰制度等を例示する。アンケート・面談で不便を把握してから行う。", "cn": ["誤り。目途はDay.100以内で、アンケート・面談で不便を把握してから行う。", "誤り。目途はDay.100以内で、即効性のある施策を想定している。", "正しい。SM p.176の記載どおりである。", "誤り。PMIの施策であり、実施主体は譲り受け側である。"], "src": "SM p.176", "ref": "n2-42", "lv": 1}, {"id": "PRB-036", "sub": "M&A実務", "top": "クロージング後（PMI）", "typ": "誤り", "stem": "経営統合と譲り渡し側経営者との信頼関係の構築に関する記述として、スキルマップに照らし誤っているものはどれか。", "ch": ["関係者への説明では、変わる点と変わらない点を明示する。", "譲り受け側の方針を浸透させるため、関係者への説明ではこれまでの経営の問題点を積極的に指摘し、否定する姿勢を示すことが望ましい。", "経営の方針は成立後遅滞なく説明し、明確でないと離職率上昇につながる可能性がある。", "譲り渡し側経営者が留任する場合、抵抗勢力化を防ぐため、役割と在籍期間を成立前に概ね合意しておく。"], "a": 1, "k": null, "ex": "SMは、経営の方針を成立後遅滞なく言語化・説明し、変わる点・変わらない点を明示し、これまでの経営を否定するような発言をしないよう最大限配慮することを示す。留任する譲り渡し側経営者とは役割・在籍期間を成立前に概ね合意し、定期的に対話する。", "cn": ["正しい。SM p.172の記載どおりである。", "誤り。これまでの経営を否定するような発言をしないよう最大限配慮する。", "正しい。SM p.171の記載どおりである。", "正しい。SM p.173の記載どおりである。"], "src": "SM p.171-173", "ref": "n2-42", "lv": 2}, {"id": "PRB-037", "sub": "M&A実務", "top": "クロージング後（PMI）", "typ": "正しい", "stem": "PMIにおける取引先の引継ぎと業務統合に関する記述として、スキルマップに照らし正しいものはどれか。", "ch": ["取引先との不利な取引条件は、成立直後に直ちに是正を依頼することが望ましい。", "統合の行動計画はシナジーごとに「誰が、いつまでに、何を」を定め、目標とKPIを設定し、結果だけでなく実行状況や顧客の反応も検証する。", "DDで十分に調査しているため、業務の属人化や規程・帳簿の不在といった課題はPMIで問題とならない。", "法的リスクや事業停止リスクのある課題は、統合方針の策定後にまとめて対応することが望ましい。"], "a": 1, "k": null, "ex": "SMは、業務統合ではDDで検知できない事項や属人化等に留意し、優先度の高い課題は速やかに対応すること、行動計画はシナジーごとに「誰が、いつまでに、何を」を定め、目標とKPIを設定して実行状況・顧客の反応も検証することを示す。取引先の不利な条件は直ちに是正を依頼しない。", "cn": ["誤り。直ちに是正依頼せず「価格交渉ノウハウ・ハンドブック」を参照するとされる。", "正しい。SM p.178の記載どおりである。", "誤り。DDで検知できないこと、属人化、規程・帳簿の不在・乖離に留意する。", "誤り。優先度の高い課題は速やかに対応する。"], "src": "SM p.177-178", "ref": "n2-42", "lv": 2}, {"id": "PRB-038", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "組合せ", "stem": "次の文章の空欄A～Cに入る語句の組み合わせとして、正しいものはどれか。\n\n非上場企業A社の第三者承継に伴い、譲受候補B社は、「A.契約や許認可の取扱い」、「B.偶発債務の承継」、「C.手続きの煩雑さ」等を考慮した上でスキーム選択（株式譲渡又は事業譲渡）を行うこととした。\n\nA) 契約や許認可の取扱い\n＿＿は、既存の契約・許認可が原則存続する。他方、＿＿は、許認可が譲受側に承継されないことが多く新規取得を要する。\nB) 偶発債務の承継\n＿＿では、偶発債務を含めて会社の負債をそのまま引き継ぐ。他方、＿＿では、対象資産・負債を個別に移転させるためリスク遮断が比較的容易である。\nC) 手続の煩雑さ\n＿＿は、株主総会決議や債権者との契約の個別移転手続が必要であり、手続は比較的複雑となる。", "ch": ["[A] 株式譲渡/事業譲渡 [B] 株式譲渡/事業譲渡 [C] 事業譲渡", "[A] 株式譲渡/事業譲渡 [B] 事業譲渡/株式譲渡 [C] 事業譲渡", "[A] 事業譲渡/株式譲渡 [B] 事業譲渡/株式譲渡 [C] 株式譲渡", "[A] 事業譲渡/株式譲渡 [B] 株式譲渡/事業譲渡 [C] 株式譲渡"], "a": 0, "k": null, "ex": "公式サンプル問題（資料2 p.13、正答①）。株式譲渡は株主が変わるだけで契約・許認可が原則存続する一方、偶発債務を含め負債をそのまま引き継ぐ。事業譲渡は資産・負債を個別に移転するためリスクを遮断しやすいが、許認可の新規取得や株主総会決議・債権者との契約の個別移転手続が必要で複雑となる。", "cn": ["正しい（公式正答）。契約・許認可が存続＝株式譲渡、負債をそのまま承継＝株式譲渡、個別移転手続が複雑＝事業譲渡。", "誤り。偶発債務を含め負債をそのまま引き継ぐのは株式譲渡である。", "誤り。A・B・Cのいずれも逆である。", "誤り。契約・許認可が原則存続するのは株式譲渡、個別移転手続が必要なのは事業譲渡である。"], "src": "資料2 p.13（サンプル問題①）", "ref": "n2-47", "lv": 2}, {"id": "PRB-039", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "正しい", "stem": "会社分割に関する記述として、参考資料1に照らし正しいものはどれか。", "ch": ["資産・負債・契約を個別に移転する手法であり、債権者や従業員の同意を一つ一つ取り付ける必要がある。", "権利義務の全部を包括承継し、譲り渡し側の会社は消滅する。", "債権者が異議を述べることができる期間は、原則として2週間以上設ければ足りる。", "権利義務の全部又は一部を他の会社に包括的に承継させる手法で、労働契約承継法により原則として雇用が確保される。"], "a": 3, "k": null, "ex": "参考資料1は、会社分割を会社法上の組織再編として権利義務の全部又は一部を他の会社に包括的に承継させる手法とし、労働契約承継法により原則雇用が確保され、許認可が引き継がれる場合もあるとする。債権者の異議期間を1か月以上設ける等の手続が必要で、登記も必要となる。", "cn": ["誤り。これは事業譲渡の説明である。会社分割は包括承継である。", "誤り。これは合併の説明である。", "誤り。原則として1か月以上設ける必要がある。", "正しい。参考資料1 p.2の記載どおりである。"], "src": "参考資料1 p.2-3", "ref": "n2-45", "lv": 2}, {"id": "PRB-040", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "最も適切", "stem": "A社は債務超過に陥っているが、一部の事業は収益性が高く、取引先からの評価も高い。A社社長は、優良事業だけでも存続させたいと考えている。参考資料1に照らし、検討すべき手法として最も適切なものはどれか。", "ch": ["A社の全株式を譲り受け側に譲渡し、不採算部門を含めて会社をそのまま引き継いでもらう株式譲渡", "A社を譲り受け側に吸収合併させ、権利義務の全部を包括承継させる合併", "事業譲渡や会社分割で優良事業を第二会社に切り出し、残る不採算部門を特別清算等で整理する第二会社方式（債権者の同意が必要）", "第二会社方式を用いて優良事業を切り出す。債権者の同意は不要であるため迅速に実施できる"], "a": 2, "k": null, "ex": "参考資料1は、第二会社方式を、債務超過企業が事業譲渡や会社分割により優良事業だけを第二会社に切り出し、残る不採算部門を特別清算等で整理する手法として説明し、債権者の同意が必要であるとしている。", "cn": ["不適切。優良事業のみを存続させたいという意向に沿わず、債務超過も解消されない。", "不適切。合併は権利義務の全部を承継するため、不採算部門の負債も引き継ぐことになる。", "適切。参考資料1が債務超過企業の手法として示す第二会社方式である。", "不適切。第二会社方式では債権者の同意が必要である。"], "src": "参考資料1 p.3", "ref": "n2-44", "lv": 2}, {"id": "PRB-041", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "誤り", "stem": "中小M&Aの手法に関する記述として、参考資料1に照らし誤っているものはどれか。", "ch": ["事業譲渡では、事業の一部を譲り渡し側の手元に残すことができる。", "業務提携は、共同物流・共同調達・共同開発等を行うもので、事業承継に向けた第一歩とされる。", "株式譲渡では、賃貸借契約等にCOC条項がある場合、事前に相手方との協議・交渉が必要になることがある。", "株式交付は、平成26年の会社法改正により認められた手法である。"], "a": 3, "k": null, "ex": "参考資料1は、株式譲渡・事業譲渡・会社分割・合併・業務提携／資本提携・第二会社方式のほか、株式交換、株式移転、令和元年12月11日公布の改正会社法で認められた株式交付、及びこれらの組合せもありうるとしている。", "cn": ["正しい。参考資料1 p.2の記載どおりである。", "正しい。参考資料1 p.3の記載どおりである。", "正しい。参考資料1 p.1の記載どおりである。", "誤り。株式交付は令和元年12月11日公布の改正会社法で認められた手法である。"], "src": "参考資料1 p.1-3", "ref": "n2-43", "lv": 2}, {"id": "PRB-042", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "組合せ", "stem": "合併の手続について、次の文章の空欄A・Bに入る語句の組合せとして、スキルマップに照らし正しいものはどれか。\n「簡易合併（交付する財産が存続会社の純資産額の（A）以下である場合）や、略式合併（親会社が子会社の（B）以上の議決権を保有する場合）を除き、双方の会社で株主総会の特別決議が必要となる。」", "ch": ["A：3分の1　B：90%", "A：5分の1　B：3分の2", "A：3分の1　B：3分の2", "A：5分の1　B：90%"], "a": 3, "k": null, "ex": "SMは、合併について、簡易合併（交付財産が純資産額の5分の1以下）や略式合併（親会社が90%以上の議決権を保有）を除き双方で特別決議が必要とし、債権者保護手続（官報公告と知れている債権者への個別催告）も必要としている。", "cn": ["誤り。簡易合併の基準は5分の1である。", "誤り。略式合併の基準は90%以上の議決権である。", "誤り。A・Bのいずれも資料と異なる。", "正しい。SMの記載どおりである。"], "src": "SM p.33", "ref": "n2-46", "lv": 3}, {"id": "PRB-043", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "正しい", "stem": "M&Aスキームの特徴・留意点に関する記述として、スキルマップに照らし正しいものはどれか。", "ch": ["株式譲渡では譲り渡し側の欠損金を引き続き活用でき、経営者個人の税金は譲渡益に対する分離課税となる。", "事業譲渡の譲渡額は経営者個人に帰属し、譲渡益に対する分離課税となる。", "事業譲渡では競業避止義務は法律上定められておらず、当事者の合意がある場合にのみ生じる。", "会社分割は包括承継であるため、株主総会の決議を要しない。"], "a": 0, "k": null, "ex": "SMは、株式譲渡は欠損金を引き続き活用でき経営者個人の税金は譲渡益に対する分離課税、事業譲渡は譲渡額が法人に帰属し法人税等の対象で個人への還流は総合課税、競業避止義務は法律上定められているが合意で免除・縮減・加重可、会社分割は株主総会の特別決議が必要と整理している。", "cn": ["正しい。SMのスキーム比較表の記載どおりである。", "誤り。事業譲渡の譲渡額は法人に帰属し法人税等の対象、個人への還流は総合課税である。", "誤り。競業避止義務は法律上定められており、合意で免除・縮減・加重できる。", "誤り。会社分割には株主総会の特別決議が必要とされる。"], "src": "SM p.31-33", "ref": "n2-46", "lv": 3}, {"id": "PRB-044", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "全て選べ", "stem": "中小M&Aガイドラインが「成立しなかった事例」の要因として分類しているものを全て選んだ組合せはどれか。\nア　着手の遅れ\nイ　情報漏洩\nウ　従業員の反対\nエ　譲り渡し側の不誠実", "ch": ["ア、ウ、エ", "イ、ウ", "ア、イ、ウ、エ", "ア、イ、エ"], "a": 3, "k": null, "ex": "GLは事例を8分類し、成立しなかった事例の要因として①着手の遅れ、②情報漏洩、③一族間の不和、④譲り渡し側の不誠実を挙げる。「従業員の反対にもかかわらず成立」は成立事例の分類である。", "cn": ["誤り。ウ（従業員の反対）は、反対にもかかわらず成立した事例の分類であり、イが漏れている。", "誤り。ウは成立事例の分類で、ア・エが漏れている。", "誤り。ウは不成立事例の要因ではない。", "正しい。不成立事例の要因は着手の遅れ・情報漏洩・一族間の不和・譲り渡し側の不誠実である。"], "src": "GL p.27-28", "ref": "n2-49", "lv": 1}, {"id": "PRB-045", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "正しい", "stem": "参考資料4の成立事例で選ばれたスキームに関する記述として、正しいものはどれか。", "ch": ["家業的経営の寿司・懐石店の事例では、家族経営の維持を条件とした業務提携が選ばれ、譲渡は行われなかった。", "債務超過の卸売業の事例では、全株式の株式譲渡が選ばれた。", "最近3期経常損失の赤字ホテルの事例では、事業譲渡が選ばれた。", "長男が承継を拒否した建設会社の事例では、事業譲渡が選ばれた。"], "a": 0, "k": null, "ex": "参考資料4の成立事例では、個人事業主・債務超過・一部譲渡の事例で事業譲渡が、法人の全株式譲渡の事例（赤字ホテル、親族内承継頓挫の建設会社等）で株式譲渡が選ばれ、家業的経営の寿司・懐石店では業務提携が選ばれている。", "cn": ["正しい。事例(1)③は業務提携であり譲渡ではない。", "誤り。事例(2)②は全事業の事業譲渡である。", "誤り。事例(2)①は全株式の株式譲渡である。", "誤り。事例(3)は全株式の株式譲渡である。"], "src": "参考資料4 p.1-14", "ref": "n2-52", "lv": 2}, {"id": "PRB-046", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "最も適切", "stem": "参考資料4の事例(4)（ギフト用品小売、90歳の会長が実権を持ち、2期連続経常赤字）から得られる教訓として最も適切なものはどれか。", "ch": ["業績が悪化するほど譲り受け側の買収意欲が高まるため、決断を遅らせて譲渡額を引き上げることができた。", "実権を持つ会長の判断を待たずに社長が単独で進めたことで、早期に高値で成約できた。", "決断が遅れ業績が急悪化したため、当初オファーより相当低額での譲渡となった。意思決定は早期に行うことが重要である。", "赤字企業はM&Aが成立しないため、廃業を選択すべきである。"], "a": 2, "k": null, "ex": "事例(4)では、90歳の会長が実権を持つなか業績が急悪化し、早急な支払を条件として当初オファーより相当低額で事業譲渡した。GLはこれを「意思決定のタイミングが成立内容に影響」した事例に分類しており、決断の遅れが譲渡額を下げることを示している。", "cn": ["不適切。決断の遅れにより当初オファーより相当低額となった。", "不適切。資料にそのような記載はなく、教訓は決断の遅れによる低額化である。", "適切。事例(4)は意思決定のタイミングが成立内容に影響した例である。", "不適切。事例(4)は譲渡が成立しており、赤字でも成立し得る。"], "src": "参考資料4 p.9（事例(4)）", "ref": "n2-50", "lv": 2}, {"id": "PRB-047", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "最も適切", "stem": "仲介者Xの支援で、A社はB社と基本合意を締結した。最終契約も決済も未了の段階で、A社社長から「従業員や主要取引先を安心させたいので、B社の名前を出して事情を話してもよいか」と相談を受けた。Xの助言として最も適切なものはどれか。", "ch": ["最終契約・クロージングを経て公表するまでは秘密保持を貫くよう助言する。相手方の名を出すと信頼関係の破壊を理由に交渉が打ち切られるおそれがある。", "基本合意を締結しているため、B社の名前を出して従業員や取引先に説明して差し支えないと助言する。", "従業員に限ってはB社の名前を伝えても問題はないと助言する。", "取引先への説明は早いほどよいため、B社に知らせずに先行して伝えるよう助言する。"], "a": 0, "k": null, "ex": "参考資料4の不成立事例(8)②では、4か月でマッチングし基本合意したが、専門業者の忠告に反して最終契約・決済未了の段階で従業員や取引先にB社名を出して伝え、B社が信頼関係の破壊を理由に打ち切った。教訓は情報管理（秘密保持）の徹底である。", "cn": ["適切。不成立事例(8)②の教訓（情報管理）に沿う。", "不適切。事例(8)②では、この段階でB社名を伝えたことで打ち切られた。", "不適切。公表まで秘密保持を貫く必要がある。", "不適切。情報漏洩は信頼関係の破壊につながる。"], "src": "参考資料4 p.16（事例(8)②）", "ref": "n2-51", "lv": 2}, {"id": "PRB-048", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "誤り", "stem": "参考資料4の不成立事例に関する記述として、誤っているものはどれか。", "ch": ["着手が遅れた設備工事業の事例では、A社は破産したが、経営者保証をしていた経営者は破産を免れた。", "譲り渡し側の不誠実の事例では、基本合意後にDDにほとんど協力せず、条件が固まった後に自らの顧問登用を要求したことで譲り受け側が断念した。", "一族間の不和の事例では、副社長（次男）が社長（長男）に相談せずにスポンサー探しを進め、社長の反発により打ち切られた。", "情報漏洩の事例では、マッチングから基本合意までは順調に進んでいた。"], "a": 0, "k": null, "ex": "不成立事例(8)①では、資金繰りが2〜3か月以内に尽きる見込みとなってから弁護士に相談したがスポンサーが現れず、A社が破産し、経営者保証をしていた経営者も同時に破産した。教訓は早期着手の重要性である。", "cn": ["誤り。A社の破産と同時に、経営者保証をしていた経営者も破産した。", "正しい。事例(8)④の記載どおりである。", "正しい。事例(8)③の記載どおりである。", "正しい。事例(8)②は4か月でマッチングし基本合意に至っていた。"], "src": "参考資料4 p.15-18", "ref": "n2-51", "lv": 2}, {"id": "PRB-049", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "正しい", "stem": "参考資料4の小規模企業・個人事業主の成立事例に関する記述として、正しいものはどれか。", "ch": ["個別指導学習塾の事例では、M&A専門業者に依頼し、手数料は高額となったが短期間で成約した。", "個人事業主の靴小売店の事例では、同業の大手企業に株式譲渡した。", "コンビニFC店の事例では、センターのDMをきっかけに後継者人材バンクを活用し、約1か月で成約した。", "小規模な計測機器製造業の事例では、センターに有料で相談し、1社のみの紹介で成約した。"], "a": 2, "k": null, "ex": "参考資料4の事例(1)⑤では、センターのDMをきっかけに後継者人材バンクで約1か月で成約し、FC本部も歓迎した。事例(1)④はプラットフォームで低コストに実現、(1)②は創業希望者への事業譲渡、(1)①はセンター（相談無料）が4社紹介・2社面談した。", "cn": ["誤り。専門業者とはコスト面で折り合わず、M&Aプラットフォームで低コストに実現した。", "誤り。譲受側は創業希望者で、スキームは事業譲渡である。", "正しい。事例(1)⑤の記載どおりである。", "誤り。センターは相談無料で、4社を紹介し2社と面談した。"], "src": "参考資料4 p.1-5", "ref": "n2-50", "lv": 2}, {"id": "PRB-050", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "誤り", "stem": "中小M&Aの成立事例に関する記述として、中小M&Aガイドライン及び参考資料4に照らし誤っているものはどれか。", "ch": ["経営への関与を条件とした家具等製造業の事例では、関与の希望をトップ面談では伝えず、最終契約の直前に初めて提示したことで譲渡額が増額された。", "雇用継続を条件としたメッキ加工業の事例では、雇用継続を第一条件とする代わりに譲渡額は譲歩した。", "従業員の反対があった中古厨房機器販売業の事例では、譲り渡し側と譲り受け側が共同で従業員説明会を開催し、全員が納得した。", "製造・小売業の事例では、小売部門のみを一部事業譲渡し、その対価で製造部門の廃業費用を捻出した。"], "a": 0, "k": null, "ex": "GLは、小規模・個人事業主・赤字・債務超過でもM&Aは成立し得るとし、譲り渡し側の条件の明確化が成立に寄与した事例として雇用継続（(5)①）や経営関与（(5)②）を挙げる。(5)②ではトップ面談で正直に希望を伝え、非常勤（週3日）で技術指導を行い、譲渡額は若干減額された。", "cn": ["誤り。トップ面談で正直に希望を伝え、非常勤で技術指導を行う代わりに譲渡額は若干減額された。", "正しい。事例(5)①の記載どおりである。", "正しい。事例(6)の記載どおりである。", "正しい。事例(7)①の記載どおりである。"], "src": "GL p.27-28／参考資料4 p.1-14", "ref": "n2-48", "lv": 2}], "built": "2026-09-30"}</script>
<script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('appdata').textContent);
const BANK = D.bank, OX = D.ox, NOTES = D.notes;
const BYID = Object.fromEntries(BANK.map(q=>[q.id,q]));
const SUBJ = ['倫理・行動規範','M&A実務','市場・政策','財務・税務','法務'];
const OFFICIAL = {'倫理・行動規範':'倫理・行動規範','M&A実務':'M&A実務','市場・政策':'M&A実務','財務・税務':'財務・税務','法務':'法務'};
const OFF_ORDER = ['M&A実務','財務・税務','法務','倫理・行動規範'];
const EXAM_QUOTA = {'倫理・行動規範':15,'M&A実務':20,'市場・政策':3,'財務・税務':12,'法務':10};
const EXAM_MIN = 120;
const MARK = ['①','②','③','④'];
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pct = (c,n)=> n? Math.round(c/n*100) : 0;

/* ---------- progress store: this device + (when available) the viewer's private db doc ---------- */
const LKEY='ma_progress_v1', EKEY='ma_exam_cur_v1', UKEY='ma_ui_v1';
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function blank(){return {v:1,u:0,q:{},ox:{},bm:{},ex:[]}}
let P = Object.assign(blank(), lsGet(LKEY)||{});
let dbRef=null, pushTimer=null, syncState='この端末に保存';
function save(){P.u=Date.now();lsSet(LKEY,P);if(dbRef){clearTimeout(pushTimer);pushTimer=setTimeout(push,1200)}}
async function push(){if(!dbRef)return;try{await dbRef.set(JSON.parse(JSON.stringify(P)));syncState='アカウントに同期済み';}catch(e){syncState='同期できませんでした（この端末には保存済み）'}updateSync()}
function updateSync(){const el=$('#syncline');if(el)el.textContent='進捗：'+syncState}
async function initSync(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id(); if(!uid)return;
    dbRef=db.doc('data/users/'+uid+'/progress');
    const snap=await dbRef.get();
    const remote=snap.exists?snap.data():null;
    if(remote && (remote.u||0)>(P.u||0)){P=Object.assign(blank(),JSON.parse(JSON.stringify(remote)));lsSet(LKEY,P);syncState='アカウントに同期済み';rerender();}
    else if(!remote || (P.u||0)>(remote.u||0)){await push();}
    else syncState='アカウントに同期済み';
    updateSync();
  }catch(e){dbRef=null}
}
function recQ(id,ok){const r=P.q[id]||{n:0,c:0};r.n++;if(ok)r.c++;r.l=ok?1:0;r.t=Date.now();P.q[id]=r}
function recOX(i,ok){const r=P.ox[i]||{n:0,c:0};r.n++;if(ok)r.c++;r.l=ok?1:0;P.ox[i]=r}

/* ---------- UI prefs (per device) ---------- */
const UI = Object.assign({subs:SUBJ.slice(),order:'weak',cnt:20,topic:'',oxs:'',oxo:'weak'}, lsGet(UKEY)||{});
function saveUI(){lsSet(UKEY,UI)}

/* ---------- router ---------- */
let route='home', S=null; // S = active quiz/exam session
const view=$('#view'), nav=$('#nav'), qbar=$('#qbar'), qbarIn=$('#qbarIn');
function setTop(title,{back=null,right=''}={}){
  $('#title').textContent=title; const b=$('#backBtn'); b.hidden=!back; b.onclick=back; $('#topRight').innerHTML=right;
}
function setNav(show,cur){nav.hidden=!show;qbar.hidden=show;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.go===cur?'page':'false'))}
function go(r){route=r;window.scrollTo(0,0);rerender()}
function rerender(){
  stopTimer();
  if(route==='home')return renderHome();
  if(route==='practice')return renderPracticeSetup();
  if(route==='exam')return renderExamSetup();
  if(route==='quiz')return renderQuiz();
  if(route==='result')return renderResult();
  if(route==='ox')return renderOX();
  if(route==='notes')return renderNotes();
  if(route==='stats')return renderStats();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{S=null;go(t.dataset.go)}));
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

/* ---------- stats helpers ---------- */
function subjStats(){
  const o={};SUBJ.forEach(s=>o[s]={total:0,tried:0,c:0,n:0});
  BANK.forEach(q=>{const s=o[q.sub];s.total++;const r=P.q[q.id];if(r){s.tried++;s.c+=r.c;s.n+=r.n}});
  return o;
}
function lastWrong(){return BANK.filter(q=>P.q[q.id]&&P.q[q.id].l===0)}

/* ---------- HOME ---------- */
function renderHome(){
  setTop('中小M&A資格試験 対策',{right:'<button class="iconbtn" id="toStats">記録</button>'});
  setNav(true,'home');
  const st=subjStats(); let tried=0,c=0,n=0; SUBJ.forEach(s=>{tried+=st[s].tried;c+=st[s].c;n+=st[s].n});
  const cur=lsGet(EKEY); const resumable=cur && cur.deadline>Date.now();
  const wrong=lastWrong().length, bm=Object.keys(P.bm).length;
  view.innerHTML=`
  <section class="hero">
    <div class="kicker">学習の現在地</div>
    <div class="big num">${tried}<small>/ ${BANK.length}問 解答済み</small></div>
    <div class="stats">
      <div class="stat"><b class="num">${n?pct(c,n)+'%':'—'}</b><span>4択の正答率</span></div>
      <div class="stat"><b class="num">${wrong}</b><span>直近で間違えた問題</span></div>
      <div class="stat"><b class="num">${P.ex.length}</b><span>模擬試験の受験回数</span></div>
    </div>
  </section>
  ${resumable?`<div class="card resume" style="margin-top:16px"><div class="kicker">模擬試験を中断中</div><p style="margin:4px 0 10px">${Object.keys(cur.ans).length} / ${cur.ids.length}問 解答済み・残り ${fmtTime(cur.deadline-Date.now())}</p><button class="btn navy block" id="resume">続きから再開する</button></div>`:''}
  <h2 class="sec">すぐに始める</h2>
  <div class="actions">
    <button class="act main" data-a="exam"><b>模擬試験（60問・120分）</b><span>本番の科目配分で出題し、合格基準で判定します</span></button>

function pickWeak(pool,n){
  const score=q=>{const r=P.q[q.id];if(!r)return 0;if(r.l===0)return 1;return 2+r.c/r.n};
  return shuffle(pool).sort((a,b)=>score(a)-score(b)).slice(0,n);
}

/* ---------- PRACTICE SETUP ---------- */
function renderPracticeSetup(){
  setTop('4択演習');setNav(true,'practice');
  const topics=[...new Set(BANK.filter(q=>UI.subs.includes(q.sub)).map(q=>q.sub+'｜'+q.top))];
  if(UI.topic && !topics.includes(UI.topic)) UI.topic='';
  const pool=poolFor();
  view.innerHTML=`
  <p class="lead">本番と同じ4択です。1問ずつ解答し、その場で解説と出典を確認できます。</p>
  <div class="field"><span class="lbl">科目</span><div class="chips" id="subs">${SUBJ.map(s=>`<button class="chip" aria-pressed="${UI.subs.includes(s)}" data-s="${esc(s)}">${esc(s)} <span class="num">${BANK.filter(q=>q.sub===s).length}</span></button>`).join('')}</div></div>
  <div class="field"><label for="topicSel">中項目</label><select id="topicSel"><option value="">すべての中項目</option>${topics.map(t=>`<option value="${esc(t)}" ${t===UI.topic?'selected':''}>${esc(t.replace('｜',' ／ '))}（${BANK.filter(q=>q.sub+'｜'+q.top===t).length}）</option>`).join('')}</select></div>
  <div class="field"><span class="lbl">出題順</span><div class="chips" id="ord">
    ${[['weak','未解答・苦手を優先'],['rand','ランダム'],['wrong','間違えた問題のみ'],['seq','番号順']].map(([k,l])=>`<button class="chip" aria-pressed="${UI.order===k}" data-o="${k}">${l}</button>`).join('')}</div></div>
  <div class="field"><span class="lbl">問題数</span><div class="chips" id="cnt">
    ${[10,20,30,0].map(k=>`<button class="chip" aria-pressed="${UI.cnt===k}" data-c="${k}">${k?k+'問':'すべて'}</button>`).join('')}</div></div>
  <p class="count num" style="margin-top:14px">対象 ${pool.length}問</p>
  <button class="btn primary block" id="startP" ${pool.length?'':'disabled'}>演習を始める</button>`;
  view.querySelectorAll('#subs .chip').forEach(b=>b.onclick=()=>{const s=b.dataset.s;UI.subs=UI.subs.includes(s)?UI.subs.filter(x=>x!==s):[...UI.subs,s];if(!UI.subs.length)UI.subs=[s];saveUI();renderPracticeSetup()});
  $('#topicSel').onchange=e=>{UI.topic=e.target.value;saveUI();renderPracticeSetup()};
  view.querySelectorAll('#ord .chip').forEach(b=>b.onclick=()=>{UI.order=b.dataset.o;saveUI();renderPracticeSetup()});
  view.querySelectorAll('#cnt .chip').forEach(b=>b.onclick=()=>{UI.cnt=+b.dataset.c;saveUI();renderPracticeSetup()});
  $('#startP').onclick=()=>{
    let p=poolFor(); const n=UI.cnt||p.length;
    if(UI.order==='weak')p=pickWeak(p,n); else if(UI.order==='seq')p=p.slice(0,n); else p=shuffle(p).slice(0,n);
    startPractice(p,'4択演習');
  };
}
function poolFor(){
  let p=BANK.filter(q=>UI.subs.includes(q.sub));
  if(UI.topic)p=p.filter(q=>q.sub+'｜'+q.top===UI.topic);
  if(UI.order==='wrong')p=p.filter(q=>P.q[q.id]&&P.q[q.id].l===0);
  return p;
}

/* ---------- QUIZ ENGINE ---------- */
function startPractice(qs,label){
  if(!qs.length){toast('対象の問題がありません');return}
  S={mode:'practice',label,ids:qs.map(q=>q.id),i:0,ans:{},shown:{},flags:{}};
  go('quiz');
}
function startExam(){
  const ids=[];
  Object.entries(EXAM_QUOTA).forEach(([s,n])=>{ids.push(...pickWeakMix(BANK.filter(q=>q.sub===s),n).map(q=>q.id))});
  const ordered=[];OFF_ORDER.forEach(o=>ids.forEach(id=>{if(OFFICIAL[BYID[id].sub]===o)ordered.push(id)}));
  S={mode:'exam',label:'模擬試験',ids:ordered,i:0,ans:{},shown:{},flags:{},start:Date.now(),deadline:Date.now()+EXAM_MIN*60000};
  persistExam();go('quiz');
}
function pickWeakMix(pool,n){ // half least-practiced, half random, so repeat exams still cover everything
  const unseen=shuffle(pool.filter(q=>!P.q[q.id]));const rest=shuffle(pool.filter(q=>P.q[q.id]));
  return shuffle(unseen.concat(rest).slice(0,n));
}
function resumeExam(cur){S=Object.assign({mode:'exam',label:'模擬試験',shown:{}},cur);go('quiz')}
function persistExam(){if(S&&S.mode==='exam')lsSet(EKEY,{ids:S.ids,i:S.i,ans:S.ans,flags:S.flags,start:S.start,deadline:S.deadline})}

let timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function fmtTime(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,'0')}`}

function renderQuiz(){
  if(!S){return go('home')}
  if(S.done){return practiceSummary()}
  stopTimer();
  const q=BYID[S.ids[S.i]], exam=S.mode==='exam', review=S.mode==='review';
  const chosen=S.ans[S.i], shown=review||S.shown[S.i];
  setNav(false);
  const leave=()=>{ if(exam){persistExam();toast('中断しました。ホームから再開できます')} S=null;go(exam?'home':'practice') };
  setTop(S.label,{back:review?()=>{go('result')}:leave,right:exam?`<span class="timer num" id="timer">${fmtTime(S.deadline-Date.now())}</span>`:''});
  const bmOn=!!P.bm[q.id];
  view.innerHTML=`
  <div class="qmeta"><span class="qno num">問${S.i+1} / ${S.ids.length}</span><span class="tag">${esc(q.sub)}</span><span>${esc(q.top)}</span>
    <span style="flex:1"></span>
    <button class="iconbtn" id="bm" aria-pressed="${bmOn}" aria-label="ブックマーク">${bmOn?'★ 保存済み':'☆ 保存'}</button></div>
  <p class="stem">${esc(q.stem)}</p>
  <ol class="choices">${q.ch.map((c,i)=>{
    let cls='choice', note='';
    if(shown){ if(i===q.a)cls+=' is-right'; else if(i===chosen)cls+=' is-wrong';
      note=`<span class="cn"><span class="verdict">${i===q.a?'正答':(i===q.k?'<span class="kbadge">禁忌肢</span>':'')}</span>${esc(q.cn[i]||'')}</span>`}
    return `<li><button class="${cls}" data-i="${i}" aria-pressed="${chosen===i}" ${shown?'disabled':''}><span class="mk">${MARK[i]}</span><span class="txt">${esc(c)}</span>${note}</button></li>`}).join('')}</ol>
  ${shown?feedback(q,chosen):''}`;
  if(!shown) view.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    S.ans[S.i]=+b.dataset.i; if(exam)persistExam(); renderQuiz();
  });
  $('#bm').onclick=()=>{if(P.bm[q.id])delete P.bm[q.id];else P.bm[q.id]=1;save();renderQuiz()};
  const nb=$('#toNote'); if(nb) nb.onclick=()=>openReader(q.ref);
  // action bar
  if(exam){
    qbarIn.innerHTML=`<button class="btn small" id="prev" ${S.i?'':'disabled'} aria-label="前の問題">前</button>
      <button class="btn small flagbtn" id="flag" aria-pressed="${!!S.flags[S.i]}">${S.flags[S.i]?'見直し中':'見直す'}</button>
      <button class="btn small" id="grid">一覧</button>
      <button class="btn navy" id="next">${S.i<S.ids.length-1?'次へ':'採点へ'}</button>`;
    $('#prev').onclick=()=>{S.i--;persistExam();renderQuiz();window.scrollTo(0,0)};
    $('#flag').onclick=()=>{S.flags[S.i]=!S.flags[S.i];if(!S.flags[S.i])delete S.flags[S.i];persistExam();renderQuiz()};
    $('#grid').onclick=openGrid;
    $('#next').onclick=()=>{if(S.i<S.ids.length-1){S.i++;persistExam();renderQuiz();window.scrollTo(0,0)}else openGrid(true)};
    timerId=setInterval(()=>{if(!S||S.mode!=='exam'){stopTimer();return}const left=S.deadline-Date.now();const t=$('#timer');if(t){t.textContent=fmtTime(left);t.classList.toggle('low',left<600000)}if(left<=0){stopTimer();finishExam(true)}},1000);
  } else if(review){
    qbarIn.innerHTML=`<button class="btn small" id="prev" ${S.i?'':'disabled'}>前</button><button class="btn" id="back">結果に戻る</button><button class="btn navy" id="next" ${S.i<S.ids.length-1?'':'disabled'}>次へ</button>`;
    $('#prev').onclick=()=>{S.i--;renderQuiz();window.scrollTo(0,0)};
    $('#next').onclick=()=>{S.i++;renderQuiz();window.scrollTo(0,0)};
    $('#back').onclick=()=>go('result');
  } else {
    if(!shown){
      qbarIn.innerHTML=`<button class="btn primary" id="answer" ${chosen===undefined?'disabled':''}>解答する</button>`;
      $('#answer').onclick=()=>{S.shown[S.i]=true;const ok=chosen===q.a;recQ(q.id,ok);save();renderQuiz()};
    } else {
      const last=S.i>=S.ids.length-1;
      qbarIn.innerHTML=`<button class="btn primary" id="next">${last?'結果を見る':'次の問題へ'}</button>`;
      $('#next').onclick=()=>{if(last){practiceSummary()}else{S.i++;renderQuiz();window.scrollTo(0,0)}};
    }
  }
}
function feedback(q,chosen){
  const ok=chosen===q.a, kinki=q.k!==null&&q.k!==undefined&&chosen===q.k;
  return `
  <div class="result-banner ${ok?'ok':'ng'}" role="status">${ok?'正解':(chosen===undefined?'未解答':'不正解')}<small>正解は ${MARK[q.a]}</small></div>
  ${kinki?`<div class="kinki-alert"><b>禁忌肢を選びました</b>中小M&Aガイドラインに明らかに反する対応です。本番では、禁忌肢を一定数選ぶと総得点に関係なく不合格となる設計が検討されています。</div>`:''}
  <div class="explain"><h3>解説</h3>${esc(q.ex)}<p class="src">出典：${esc(q.src)}</p></div>
  ${q.ref?`<button class="linkbtn" id="toNote">ノートの該当箇所を読む</button>`:''}`;
}
function practiceSummary(){
  S.done=true;
  const n=S.ids.length; let c=0; S.ids.forEach((id,i)=>{if(S.ans[i]===BYID[id].a)c++});
  const wrongIds=S.ids.filter((id,i)=>S.ans[i]!==BYID[id].a);
  setTop(S.label);setNav(false);
  view.innerHTML=`<section class="hero"><div class="kicker">演習の結果</div><div class="big num">${c}<small>/ ${n}問 正解（${pct(c,n)}%）</small></div></section>
  <p class="lead">${pct(c,n)>=70?'総得点の合格基準（70%程度）を超えています。':'総得点の合格基準は70%程度です。間違えた問題を解き直しましょう。'}</p>`;
  qbarIn.innerHTML=`<button class="btn" id="home">ホームへ</button><button class="btn primary" id="again" ${wrongIds.length?'':'disabled'}>間違えた${wrongIds.length}問を解き直す</button>`;
  $('#home').onclick=()=>{S=null;go('home')};
  $('#again').onclick=()=>startPractice(wrongIds.map(id=>BYID[id]),'解き直し');
}

function openGrid(finishing){
  const host=$('#sheetHost'); const unans=S.ids.length-Object.keys(S.ans).length; const fl=Object.keys(S.flags).length;

    <div class="confirm">${finishing||unans===0?'':''}<p style="margin:0 0 10px">${unans?`未解答が${unans}問あります。`:'すべて解答しました。'}採点すると、この模擬試験は終了します。</p>

  </div></div>`;

  $('#finish').onclick=()=>{close();finishExam(false)};
}
function finishExam(timeout){
  stopTimer();
  const by={};OFF_ORDER.forEach(o=>by[o]={c:0,n:0});const byS={};SUBJ.forEach(s=>byS[s]={c:0,n:0});
  let c=0,k=0;
  S.ids.forEach((id,i)=>{const q=BYID[id];const ok=S.ans[i]===q.a;const o=OFFICIAL[q.sub];by[o].n++;byS[q.sub].n++;if(ok){c++;by[o].c++;byS[q.sub].c++}
    if(q.k!==null&&q.k!==undefined&&S.ans[i]===q.k)k++;
    recQ(id,ok)});
  const total=pct(c,S.ids.length);
  const subjOK=OFF_ORDER.every(o=>pct(by[o].c,by[o].n)>=50);
  const rec={t:Date.now(),n:S.ids.length,c,total,by,byS,k,pass:total>=70&&subjOK,dur:Math.min(Date.now()-S.start,EXAM_MIN*60000),timeout,ids:S.ids,ans:S.ans};
  P.ex.unshift(rec);P.ex=P.ex.slice(0,30);save();lsDel(EKEY);
  S={mode:'review',label:'模擬試験の見直し',ids:S.ids,ans:S.ans,i:0,shown:{},flags:{},rec};
  go('result');
}

}
function examHistory(n){
  return `<table class="score"><thead><tr><th>日時</th><th class="r">得点</th><th class="r">禁忌</th><th class="r">判定</th></tr></thead><tbody>${P.ex.slice(0,n).map(r=>{const d=new Date(r.t);return `<tr><td class="num">${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</td><td class="r num">${r.total}%</td><td class="r num">${r.k}</td><td class="r ${r.pass?'ok':'ng'}">${r.pass?'到達':'未達'}</td></tr>`}).join('')}</tbody></table>`;
}

/* ---------- OX ---------- */
let OXS=null;
function renderOX(){
  setNav(true,'ox');
  if(!OXS){
    const secs=[...new Set(OX.map(o=>o.s))];
    setTop('○×一問一答');
    const pool=UI.oxs?OX.filter(o=>o.s===UI.oxs):OX;
    const done=pool.filter(o=>P.ox[o.i]).length, c=pool.reduce((a,o)=>a+(P.ox[o.i]?P.ox[o.i].c:0),0), n=pool.reduce((a,o)=>a+(P.ox[o.i]?P.ox[o.i].n:0),0);
    view.innerHTML=`
    <p class="lead">学習ノートの○×問題集（${OX.length}問）です。論点の確認に使い、4択演習と組み合わせてください。</p>
    <div class="field"><span class="lbl">区分</span><div class="chips" id="oxs">
      <button class="chip" aria-pressed="${!UI.oxs}" data-s="">すべて ${OX.length}</button>
      ${secs.map(s=>`<button class="chip" aria-pressed="${UI.oxs===s}" data-s="${esc(s)}">${esc(s)} ${OX.filter(o=>o.s===s).length}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">出題順</span><div class="chips" id="oxo">
      ${[['weak','未解答・間違いを優先'],['rand','ランダム'],['seq','番号順']].map(([k,l])=>`<button class="chip" aria-pressed="${UI.oxo===k}" data-o="${k}">${l}</button>`).join('')}</div></div>
    <p class="count num" style="margin-top:14px">解答済み ${done}/${pool.length}問 ・ 正答率 ${n?pct(c,n)+'%':'—'}</p>
    <button class="btn primary block" id="oxgo">20問 解く</button>
    <button class="btn block" id="oxall" style="margin-top:10px">対象をすべて解く（${pool.length}問）</button>`;
    view.querySelectorAll('#oxs .chip').forEach(b=>b.onclick=()=>{UI.oxs=b.dataset.s;saveUI();renderOX()});
    view.querySelectorAll('#oxo .chip').forEach(b=>b.onclick=()=>{UI.oxo=b.dataset.o;saveUI();renderOX()});
    const start=n=>{let p=pool.slice();if(UI.oxo==='rand')p=shuffle(p);else if(UI.oxo==='weak'){const sc=o=>{const r=P.ox[o.i];return !r?0:(r.l===0?1:2)};p=shuffle(p).sort((a,b)=>sc(a)-sc(b))}
      OXS={items:p.slice(0,n||p.length).map(o=>o.i),i:0,pick:null,c:0};renderOX()};
    $('#oxgo').onclick=()=>start(20);$('#oxall').onclick=()=>start(0);
    return;
  }
  const o=OX[OXS.items[OXS.i]], answered=OXS.pick!==null, ok=answered&&OXS.pick===o.a;
  setTop('○×一問一答',{back:()=>{OXS=null;renderOX()},right:`<span class="num lead">${OXS.i+1} / ${OXS.items.length}</span>`});
  view.innerHTML=`<div class="ox-card">
    <div class="qmeta" style="margin:0"><span class="tag">${esc(o.s)}</span><span>${esc(o.u||'')}</span></div>
    <p class="ox-q">${o.k?'<span class="kbadge">禁忌</span>':''}${esc(o.q)}</p>
    <div class="ox-btns">
      <button class="ox-btn ${answered&&o.a?'right':''} ${answered&&OXS.pick===true&&!o.a?'wrong':''}" data-v="1" ${answered?'disabled':''} aria-label="○ 正しい">○</button>
      <button class="ox-btn ${answered&&!o.a?'right':''} ${answered&&OXS.pick===false&&o.a?'wrong':''}" data-v="0" ${answered?'disabled':''} aria-label="× 誤り">×</button>
    </div>
    ${answered?`<div class="result-banner ${ok?'ok':'ng'}" role="status">${ok?'正解':'不正解'}<small>答えは ${o.a?'○':'×'}</small></div><p class="ox-ans">${esc(o.r)}</p>`:''}
  </div>`;
  view.querySelectorAll('.ox-btn').forEach(b=>b.onclick=()=>{OXS.pick=b.dataset.v==='1';const g=OXS.pick===o.a;if(g)OXS.c++;recOX(o.i,g);save();renderOX()});
  if(answered){
    setNav(false);
    const last=OXS.i>=OXS.items.length-1;
    qbarIn.innerHTML=`<button class="btn primary" id="oxnext">${last?'結果を見る':'次へ'}</button>`;
    $('#oxnext').onclick=()=>{if(last){const c=OXS.c,n=OXS.items.length;OXS=null;toast(`${n}問中 ${c}問 正解（${pct(c,n)}%）`);renderOX()}else{OXS.i++;OXS.pick=null;renderOX();window.scrollTo(0,0)}};
  }
}

/* ---------- NOTES ---------- */
let noteIndex=null;
function buildIndex(){
  if(noteIndex)return noteIndex; noteIndex=[];
  NOTES.forEach(n=>{
    const parts=n.html.split(/(?=<h[23] id=")/);
    parts.forEach(p=>{const m=p.match(/^<h([23]) id="([^"]+)">([\s\S]*?)<\/h\1>/);
      const txt=p.replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/\s+/g,' ');
      noteIndex.push({tab:n.tab,doc:n.title,id:m?m[2]:null,head:m?m[3].replace(/<[^>]+>/g,''):n.title,txt})});
  });
  return noteIndex;
}
function renderNotes(){
  setTop('学習ノート');setNav(true,'notes');
  view.innerHTML=`
  <div class="field" style="margin-top:14px"><label for="nq">ノート全体を検索</label><input type="search" id="nq" placeholder="例：テール条項、レーマン、表明保証" enterkeyhint="search" autocomplete="off"></div>
  <ul class="hits" id="hits"></ul>
  <h2 class="sec" id="listHead">目次</h2>
  <ul class="nlist">${NOTES.map(n=>`<li><button data-t="${n.tab}"><span>${n.tab&&n.tab<7?n.tab+' ':''}${esc(n.title)}</span><span class="num">${n.toc.filter(t=>t.level===2).length}章</span></button></li>`).join('')}</ul>
  <p class="lead" style="margin-top:14px">○×問題集は「○×」タブで解けます。</p>`;
  view.querySelectorAll('.nlist button').forEach(b=>b.onclick=()=>openReader(null,+b.dataset.t));
  const inp=$('#nq');let t;
  inp.oninput=()=>{clearTimeout(t);t=setTimeout(()=>search(inp.value.trim()),180)};
}
function search(qs){
  const hits=$('#hits'); if(!qs){hits.innerHTML='';return}
  const idx=buildIndex(); const terms=qs.split(/\s+/).filter(Boolean);
  const res=idx.filter(x=>terms.every(w=>x.txt.includes(w)||x.head.includes(w))).slice(0,40);
  hits.innerHTML=res.length?res.map(x=>{const pos=x.txt.indexOf(terms[0]);const s=Math.max(0,pos-30);const snip=esc(x.txt.slice(s,s+90));
    return `<li><button data-id="${x.id||''}" data-t="${x.tab}"><b>${esc(x.head)}</b><small>${esc(x.doc)}｜…${terms.reduce((a,w)=>a.split(esc(w)).join('<mark>'+esc(w)+'</mark>'),snip)}…</small></button></li>`}).join('')
    :'<li class="empty">見つかりませんでした。別の言葉で探してください。</li>';
  hits.querySelectorAll('button').forEach(b=>b.onclick=()=>openReader(b.dataset.id||null,+b.dataset.t));
}
const reader=$('#reader');
function openReader(hid,tab){
  let n; if(hid){const t=+hid.split('-')[0].slice(1);n=NOTES.find(x=>x.tab===t)} else n=NOTES.find(x=>x.tab===tab);
  if(!n)return;
  reader.innerHTML=`<header class="top"><button class="iconbtn" id="rclose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>戻る</button><h1>${esc(n.title)}</h1></header>
  <div class="reader-body">
    <details class="toc" ${hid?'':'open'}><summary>目次</summary><ol>${n.toc.map(t=>`<li><a href="#${t.id}" class="l${t.level}" data-id="${t.id}">${esc(t.text)}</a></li>`).join('')}</ol></details>
    <article class="doc">${n.html}</article></div>`;
  reader.hidden=false; document.body.style.overflow='hidden';
  $('#rclose').onclick=closeReader;
  reader.querySelectorAll('.toc a').forEach(a=>a.onclick=e=>{e.preventDefault();jump(a.dataset.id)});
  reader.querySelectorAll('.doc a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener'});
  reader.scrollTop=0;
  if(hid)requestAnimationFrame(()=>jump(hid));
}
function jump(id){const el=reader.querySelector('#'+CSS.escape(id));if(!el)return;reader.scrollTop=el.offsetTop-60;el.classList.remove('hl');void el.offsetWidth;el.classList.add('hl')}
function closeReader(){reader.hidden=true;reader.innerHTML='';document.body.style.overflow=''}

/* ---------- STATS ---------- */
function renderStats(){
  setTop('学習の記録',{back:()=>go('home')});setNav(true,'home');
  const rows={};BANK.forEach(q=>{const k=q.sub+'｜'+q.top;const r=rows[k]||(rows[k]={sub:q.sub,top:q.top,total:0,tried:0,c:0,n:0});r.total++;const p=P.q[q.id];if(p){r.tried++;r.c+=p.c;r.n+=p.n}});
  const list=Object.values(rows).sort((a,b)=>(a.n?a.c/a.n:2)-(b.n?b.c/b.n:2)||a.sub.localeCompare(b.sub));
  view.innerHTML=`
  <h2 class="sec">中項目別（正答率の低い順）</h2>
  <div style="overflow-x:auto"><table class="topics"><thead><tr><th>中項目</th><th class="r">解答</th><th class="r">正答率</th></tr></thead><tbody>
  ${list.map(r=>`<tr><td>${esc(r.top)}<br><small class="lead">${esc(r.sub)}</small></td><td class="r num">${r.tried}/${r.total}</td><td class="r num">${r.n?pct(r.c,r.n)+'%':'—'}</td></tr>`).join('')}
  </tbody></table></div>
  <h2 class="sec">模擬試験の履歴</h2>${P.ex.length?examHistory(30):'<p class="empty">まだ受験していません。</p>'}
  <h2 class="sec">記録の管理</h2>
  <div id="resetBox"><button class="btn block" id="reset">学習記録をすべて消す</button></div>
  <p class="sync" id="syncline">進捗：${esc(syncState)}</p>`;
  $('#reset').onclick=()=>{$('#resetBox').innerHTML=`<div class="confirm"><p style="margin:0 0 10px">解答履歴・模擬試験の結果・ブックマークを消します。元に戻せません。</p><div class="row"><button class="btn" id="rcancel">やめる</button><button class="btn navy" id="rok">消す</button></div></div>`;
    $('#rcancel').onclick=renderStats;$('#rok').onclick=()=>{P=blank();save();lsDel(EKEY);toast('学習記録を消しました');renderStats()}};
}

/* boot */
rerender();
initSync();
})();
</script>
