い<\/strong>。（GL p.63-64）<\/li>\n<li>仲介者は譲り渡し側・譲り受け側の<strong>双方と契約<\/strong>し、<strong>双方に手数料を請求<\/strong>するのが通常。（GL p.39）<\/li>\n<\/ul>\n<h3 id=\"n3-11\"><span class=\"star\" aria-label=\"頻出\">★<\/span>成功報酬の3つの基準価額<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>基準価額<\/th>\n<th>内容<\/th>\n<th>特徴・留意点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>①譲渡額（譲受額）<\/td>\n<td>譲り渡した（譲り受けた）金額そのもの<\/td>\n<td>理解しやすい。譲り受け側は負担感が増すため、<strong>定額<\/strong>等の別方式もある<\/td>\n<\/tr>\n<tr>\n<td>②移動総資産額<\/td>\n<td>主に<strong>譲渡額に負債額を加えた<\/strong>額<\/td>\n<td>同じ譲渡額でも、<strong>負債（特に借入金）が多いほど手数料が高くなる<\/strong><\/td>\n<\/tr>\n<tr>\n<td>③純資産額<\/td>\n<td>資産と負債の差額<\/td>\n<td>簿価は決算書から容易に計算でき明確。小規模企業で使うことがある。<strong>債務超過<\/strong>ならゼロ以下になるため①②を使うことが多い<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.64）<\/p>\n<ul>\n<li>基準の組合せ・修正や、全く異なる方式（例：定額）を採る業者もある。（GL p.63-64）<\/li>\n<\/ul>\n<h4>資料1における「基準となる価額」の4類型<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>方式<\/th>\n<th>基準となる価額<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>株価レーマン<\/td>\n<td>株式価額<\/td>\n<\/tr>\n<tr>\n<td>オーナー受取額レーマン<\/td>\n<td>株式価額＋役員借入金<\/td>\n<\/tr>\n<tr>\n<td>企業価値レーマン<\/td>\n<td>株式価額＋ネット有利子負債（有利子負債−現預金等）<\/td>\n<\/tr>\n<tr>\n<td>移動総資産レーマン<\/td>\n<td>株式価額＋有利子負債＋その他の負債<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料1 p.9）<\/p>\n<ul>\n<li>報酬基準額は<strong>株価<\/strong>が多い。割合（仲介／FA／金融機関）：株価50%／44%／20%、オーナー受取額17%／19%／16%、企業価値10%／14%／9%、<strong>移動総資産19%／18%／45%<\/strong>、その他4%／5%／10%。（資料1 p.9）<\/li>\n<li><span class=\"note-tag\">注<\/span>集計は累計で仲介2,076件、FA1,108件、金融機関576件。（資料1 p.9）<\/li>\n<\/ul>\n<h3 id=\"n3-12\"><span class=\"star\" aria-label=\"頻出\">★<\/span>レーマン方式と最低手数料<\/h3>\n<p><strong>レーマン方式<\/strong>：基準価額に応じて変動する各階層の「乗じる割合」を、各階層に該当する部分にそれぞれ乗じて<strong>合算<\/strong>する手法。特に<strong>M&amp;A専門業者で広く用いられている<\/strong>。（GL p.64）（資料1 p.9）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>基準となる価額<\/th>\n<th>乗じる割合<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5億円以下の部分<\/td>\n<td>5%<\/td>\n<\/tr>\n<tr>\n<td>5億円超10億円以下の部分<\/td>\n<td>4%<\/td>\n<\/tr>\n<tr>\n<td>10億円超50億円以下の部分<\/td>\n<td>3%<\/td>\n<\/tr>\n<tr>\n<td>50億円超100億円以下の部分<\/td>\n<td>2%<\/td>\n<\/tr>\n<tr>\n<td>100億円超の部分<\/td>\n<td>1%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.65）（資料1 p.9）※あくまで一例で、階層・割合は業者により異なる。<\/p>\n<ul>\n<li>割合が同じでも、基準価額の考え方で報酬額は比較的大きく変動しうる。目安を<strong>確認しておくことが重要<\/strong>。（GL p.64）<\/li>\n<li>レーマン方式を採らず、<strong>一律の割合<\/strong>や<strong>定額<\/strong>とするケースもある。（GL p.64）<\/li>\n<li><strong>最低手数料<\/strong>：基準価額が小さく十分な成功報酬を確保できない場合に備えて設ける業者が<strong>多い<\/strong>。算出報酬が下回れば最低手数料が<strong>適用<\/strong>される。（GL p.65）（資料1 p.9）<\/li>\n<li>依頼する中小企業は、<strong>最低手数料を含め、手数料の算出方法を明確に確認しておく必要がある<\/strong>。（GL p.65）<\/li>\n<\/ul>\n<h4>資料1：最低手数料の現状<\/h4>\n<ul>\n<li>最低手数料の設定は<strong>一般的<\/strong>。分布にはばらつきがあるが、<strong>500万円や1,000万円<\/strong>で設定する機関が多い。（資料1 p.8）<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>最低手数料<\/th>\n<th>仲介<\/th>\n<th>FA<\/th>\n<th>金融機関<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>100万円<\/td>\n<td>8%<\/td>\n<td>12%<\/td>\n<td>6%<\/td>\n<\/tr>\n<tr>\n<td>200万円<\/td>\n<td>11%<\/td>\n<td>13%<\/td>\n<td>5%<\/td>\n<\/tr>\n<tr>\n<td>300万円<\/td>\n<td>10%<\/td>\n<td>13%<\/td>\n<td>7%<\/td>\n<\/tr>\n<tr>\n<td><strong>500万円<\/strong><\/td>\n<td><strong>16%<\/strong><\/td>\n<td><strong>15%<\/strong><\/td>\n<td><strong>33%<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>1,000万円<\/strong><\/td>\n<td><strong>15%<\/strong><\/td>\n<td><strong>14%<\/strong><\/td>\n<td><strong>29%<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2,000万円<\/td>\n<td>8%<\/td>\n<td>7%<\/td>\n<td>11%<\/td>\n<\/tr>\n<tr>\n<td>2,500万円<\/td>\n<td>8%<\/td>\n<td>5%<\/td>\n<td>0%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料1 p.8）※累計で仲介2,145件、FA880件、金融機関595件。1機関最大4通りの手数料体系を集計。表は主要な金額区分のみ抜粋（原図には「50万円未満」「100万円超200万円未満」等の中間区分、「2,500万円超」もある）。<\/p>\n<ul>\n<li>GL p.66にも「登録M&amp;A支援機関における最低手数料の分布」グラフがある。<span class=\"note-tag\">注<\/span>数値は画像で読み取れない。（GL p.66）<\/li>\n<li>手数料は業務内容・質に応じ<strong>競争的に設定されるべき<\/strong>で、<strong>比較可能性の高い形<\/strong>で示される必要がある。（資料1 p.9）<\/li>\n<li>登録機関には<strong>標準的な手数料の報告<\/strong>を求め、HPのデータベースで公表。最低手数料の水準や報酬基準額の種類で検索できる。（資料1 p.7）<\/li>\n<\/ul>\n<h3 id=\"n3-13\"><span class=\"star\" aria-label=\"頻出\">★<\/span>具体例：事例1〜4<\/h3>\n<p>前提：M&amp;A専門業者がマッチング支援等を行い、譲り渡し側又はその株主が支払う手数料。<strong>消費税及び地方消費税は合計10%<\/strong>と仮定。（GL p.66）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>事例<\/th>\n<th>依頼先・期間<\/th>\n<th>スキーム・譲渡額<\/th>\n<th>手数料体系（税抜）<\/th>\n<th>手数料総額（税込）<\/th>\n<th>譲渡額−手数料<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>センターの登録機関等・6か月<\/td>\n<td>株式譲渡・1億円<\/td>\n<td>着手金100万円（別途）＋レーマン（譲渡額基準、最低500万円）<\/td>\n<td><strong>660万円<\/strong><\/td>\n<td>9,340万円<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>金融機関の紹介・1年間<\/td>\n<td>株式譲渡・5億円（負債5億円）<\/td>\n<td>中間金50万円（成功報酬に含む）＋レーマン（<strong>移動総資産額10億円<\/strong>基準、最低1,000万円）<\/td>\n<td><strong>4,950万円<\/strong><\/td>\n<td>4億5,050万円<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>顧問税理士の紹介・4か月<\/td>\n<td><strong>事業譲渡<\/strong>・3,000万円<\/td>\n<td>着手金50万円＋月額10万円（いずれも別途）＋<strong>一律4%<\/strong>（最低300万円）<\/td>\n<td><strong>429万円<\/strong><\/td>\n<td>2,571万円<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>営業を受けた業者・10か月<\/td>\n<td>株式譲渡・5,000万円<\/td>\n<td>成功報酬のみ：レーマン（譲渡額基準、最低1,000万円）<\/td>\n<td><strong>1,100万円<\/strong><\/td>\n<td>3,900万円<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.66-68）<\/p>\n<h4>事例1（GL p.66）<\/h4>\n<ol>\n<li>着手金：100万円×110%＝<strong>110万円<\/strong>…(a)<\/li>\n<li>月額報酬・中間金：0円<\/li>\n<li>成功報酬：1億円×5%×110%＝<strong>550万円<\/strong>…(b)（税抜500万円で最低手数料と同額）<\/li>\n<li>総額：(a)＋(b)＝<strong>660万円（税込）<\/strong><\/li>\n<\/ol>\n<ul>\n<li>センターへの相談は<strong>無料<\/strong>だが、登録機関等に依頼する場合は<strong>有料<\/strong>。（GL p.66）<\/li>\n<\/ul>\n<h4>事例2（GL p.67）<\/h4>\n<ol>\n<li>中間金：50万円×110%＝<strong>55万円<\/strong>…(c)<\/li>\n<li>成功報酬（5億円以下の部分）：5億円×5%×110%＝<strong>2,750万円<\/strong><\/li>\n<li>成功報酬（5億円超10億円以下の部分）：5億円×4%×110%＝<strong>2,200万円<\/strong><\/li>\n<li>中間金は成功報酬に含まれるので控除：2,750＋2,200−55＝<strong>4,895万円<\/strong>…(d)<\/li>\n<li>総額：(c)＋(d)＝<strong>4,950万円（税込）<\/strong><\/li>\n<\/ol>\n<ul>\n<li>譲渡額は5億円だが、移動総資産額（譲渡額＋負債）＝10億円が基準になる点がポイント。<\/li>\n<\/ul>\n<h4>事例3（GL p.67）<\/h4>\n<ol>\n<li>着手金：50万円×110%＝<strong>55万円<\/strong>…(e)<\/li>\n<li>月額報酬：10万円×4か月×110%＝<strong>44万円<\/strong>…(f)<\/li>\n<li>成功報酬：3,000万円×4%×110%＝132万円 ＜ 最低手数料300万円×110%＝<strong>330万円<\/strong>…(g)<\/li>\n<li>総額：(e)＋(f)＋(g)＝<strong>429万円（税込）<\/strong><\/li>\n<\/ol>\n<h4>事例4（GL p.68）<\/h4>\n<ol>\n<li>成功報酬：5,000万円×5%×110%＝275万円 ＜ 最低手数料1,000万円×110%＝<strong>1,100万円<\/strong>…(h)<\/li>\n<li>総額：(h)＝<strong>1,100万円（税込）<\/strong><\/li>\n<\/ol>\n<ul>\n<li>小規模案件では最低手数料が適用され、譲渡額に占める手数料の割合が高くなる。<\/li>\n<\/ul>\n<h4>（参考）M&amp;Aプラットフォームの手数料例<\/h4>\n<ul>\n<li>譲渡額2,000万円の株式譲渡。譲り渡し側は<strong>手数料なし<\/strong>。（GL p.60）<\/li>\n<li>譲り受け側：成功報酬3%（譲渡額基準、最低30万円）→2,000万円×3%×110%＝<strong>66万円（税込）<\/strong>。（GL p.60）<\/li>\n<li>マッチング後に専門業者等の支援を受ける場合、その手数料は<strong>別途<\/strong>発生する。（GL p.60）<\/li>\n<\/ul>\n<h3 id=\"n3-14\">契約前の確認と対応（GL第1章Ⅴ 4）<\/h3>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>重要なのは、業務内容と手数料の額が客観的に見合っているか、依頼者が納得できるか<\/strong>。手数料は当事者の合意に委ねられ、業者が異なれば額も多様である。（GL p.69）<\/p>\n<ul>\n<li>仲介者・FAには、<strong>契約前<\/strong>に業務の範囲・内容や手数料等の重要事項を<strong>記載した書面を交付して説明することを求めている<\/strong>（メール等の電磁的方法を含む）。（GL p.69）<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>確認の観点<\/th>\n<th>主な内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>①自らの手数料<\/td>\n<td>算定基準4点（<strong>成功報酬の報酬率／報酬基準額／最低手数料の額／報酬の発生タイミング<\/strong>）を確認し、複数業者を比較<\/td>\n<\/tr>\n<tr>\n<td>②（仲介の場合）相手方の手数料<\/td>\n<td>相手方の手数料の額が<strong>自らの利益に影響する構造<\/strong>。算定基準の説明を求める<\/td>\n<\/tr>\n<tr>\n<td>③提供される業務<\/td>\n<td>ア 必要な業務／イ マッチングの難易度／ウ 業務の質<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.69-75）<\/p>\n<h4>①自らの手数料に関する事項<\/h4>\n<ul>\n<li>同水準の報酬率でも、最低手数料や報酬基準額が違えば支払額に差が出る。（GL p.69）<\/li>\n<li>例：報酬基準額が「<strong>移動総資産<\/strong>」なら、「譲渡額」「純資産」より報酬額は<strong>高くなる<\/strong>。（GL p.69）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>階層ごとの報酬率だけでなく、<strong>成立する譲渡額に応じて最終的に支払う報酬の絶対額を確認することが重要<\/strong>。（GL p.69）<\/li>\n<li>「M&amp;A支援機関登録制度」HPで登録機関の手数料の算定基準が公表され、比較検討に有用。（GL p.69）<\/li>\n<\/ul>\n<h4>②（仲介契約の場合）相手方の手数料に関する事項<\/h4>\n<p>資金の流れの構造（GL p.70）：<\/p>\n<ol>\n<li><strong>①譲り受け側の予算<\/strong>が決まる。<\/li>\n<li>①を上回らない範囲で、<strong>②譲渡額<\/strong>（譲り受け側→譲り渡し側）と<strong>③手数料<\/strong>（譲り受け側→仲介者）が決まる。<\/li>\n<li>シナジーが想定以上の場合や想定外の工程が生じた場合など、①が<strong>増額される場合もある<\/strong>。<\/li>\n<li><strong>④譲り渡し側の受取額<\/strong>＝②−<strong>⑤手数料<\/strong>（譲り渡し側→仲介者）。意思決定には②より<strong>④が直接的に影響<\/strong>する。<\/li>\n<\/ol>\n<ul>\n<li>仲介者は利益相反防止の観点から<strong>DDを直接実施すべきでない<\/strong>。譲り受け側が別の支援機関を使えばその費用もコストとなり、②に影響しうる。（GL p.70）<\/li>\n<li>典型的な問題：譲り受け側が追加手数料を支払う代わりに、仲介者が①譲渡額を不当に低額に誘導、②譲り渡し側の意向に反し優先的にマッチングする行為。（GL p.71）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>このような行為は利益相反にあたり、本ガイドラインでは<strong>禁止行為<\/strong>。→ 倫理タブ参照。（GL p.71）<\/li>\n<li>仲介者には、相手方の手数料について<strong>仲介契約前・契約締結後<\/strong>に説明することを求めている。（GL p.71）<\/li>\n<li>特に譲り渡し側は、相手方の手数料に加え、DD等で使う他の支援機関への支払も意識する必要がある。（GL p.71）<\/li>\n<\/ul>\n<h4>③提供される業務に関する事項<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>観点<\/th>\n<th>確認内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ア 必要となる業務<\/td>\n<td>プロセスごとにどの支援を受けられるか。業者には<strong>書面を交付して具体的に説明することを求めている<\/strong>。仲介者はバリュエーション・DDの<strong>結論を決定しない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>イ マッチングの難易度<\/td>\n<td>将来需要が見込める業種や人手不足が深刻な場合は難易度が相対的に<strong>低い<\/strong>。希望条件やスキームも影響<\/td>\n<\/tr>\n<tr>\n<td>ウ 提供される業務の質<\/td>\n<td>ネットワーク・組織体制、担当者の<strong>経験年数・成約実績・専門的知見（保有資格等）<\/strong>を確認<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.71-75）<\/p>\n<ul>\n<li>DDの調査が十分でないと、最終契約で譲り渡し側が負う義務（表明保証の範囲、補償額・期間等）の<strong>負担増加<\/strong>に繋がりうる。（GL p.74）<\/li>\n<li>プロセスごとの業務例では、法務DD・税務DDは<strong>外部の士業等専門家に委託<\/strong>、登記手続は司法書士等に委託とされる。→ 実務タブ参照。（GL p.73）<\/li>\n<\/ul>\n<h4><span class=\"star\" aria-label=\"頻出\">★<\/span>手数料の妥当性に納得できない場合の対応<\/h4>\n<ol>\n<li>疑問が残る場合は、士業等専門家や事業承継・引継ぎ支援センター等から<strong>セカンド・オピニオンを聴取<\/strong>しておくことも有効。<\/li>\n<li>見合っていないと感じる場合は、業務・手数料の<strong>交渉<\/strong>、または<strong>他の仲介者・FAへの依頼<\/strong>も視野に検討する。<\/li>\n<li>登録制度HP（https://ma-shienkikan.go.jp/）で公表される<strong>手数料の算定基準<\/strong>を参照して他業者を選ぶ。<\/li>\n<\/ol>\n<p>（GL p.75）<\/p>\n<h3 id=\"n3-15\">資料2：手数料の初期的分析<\/h3>\n<p>登録制度のデータを用いた初期的分析。<span class=\"star\" aria-label=\"頻出\">★<\/span>要点は「小規模ほど手数料率が高い」「東京圏が低い」「支援機関間で大差なし」「総資産レーマンが高い」の4点。（資料2 p.23-26）<\/p>\n<ul>\n<li>手数料率＝報酬金額÷<strong>譲渡価額<\/strong>。案件規模が小さいと<strong>最低手数料が適用され、手数料率は高くなる傾向<\/strong>。（資料2 p.24）<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>譲渡側純資産（時価）<\/th>\n<th>手数料率（中央値）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5百万円超〜1千万円以下<\/td>\n<td><strong>30.0%<\/strong><\/td>\n<\/tr>\n<tr>\n<td>1千万円超〜5千万円以下<\/td>\n<td>18.8%<\/td>\n<\/tr>\n<tr>\n<td>5千万円超〜1億円以下<\/td>\n<td>13.6%<\/td>\n<\/tr>\n<tr>\n<td>1億円超〜5億円以下<\/td>\n<td>7.6%<\/td>\n<\/tr>\n<tr>\n<td>5億円超〜<\/td>\n<td><strong>4.3%<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.24）<\/p>\n<h4>東京圏との比較（譲渡価額1千万円超〜5千万円以下）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>区分<\/th>\n<th>最大値<\/th>\n<th>第3四分位<\/th>\n<th>中央値<\/th>\n<th>第1四分位<\/th>\n<th>最小値<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>東京大都市圏<\/td>\n<td>97.5%<\/td>\n<td>45.0%<\/td>\n<td><strong>20.0%<\/strong><\/td>\n<td>10.0%<\/td>\n<td>0.0%<\/td>\n<\/tr>\n<tr>\n<td>東京大都市圏以外<\/td>\n<td>105.1%<\/td>\n<td>50.0%<\/td>\n<td><strong>27.1%<\/strong><\/td>\n<td>12.6%<\/td>\n<td>0.0%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.24）<\/p>\n<ul>\n<li>大きな差分はないが、<strong>東京圏の案件の方が手数料率は低い<\/strong>。東京大都市圏＝東京都・神奈川県・千葉県・埼玉県。（資料2 p.24）<\/li>\n<li><span class=\"note-tag\">注<\/span>箱ひげ図の各点の呼称（四分位等）は図の形状からの読み取り。数値は図に印字されたもの。<\/li>\n<\/ul>\n<h4>支援機関別の手数料率（仲介業務）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>支援機関<\/th>\n<th>仲介<\/th>\n<th>FA<\/th>\n<th>金融機関<\/th>\n<th>経営コンサル<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>手数料率<\/td>\n<td>31.6%<\/td>\n<td>29.1%<\/td>\n<td>31.5%<\/td>\n<td>26.1%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.25）<\/p>\n<ul>\n<li>機関間に<strong>大きな差分は見受けられない<\/strong>。種別ではなく、<strong>業務内容に対する手数料の水準<\/strong>を議論する必要。（資料2 p.25）<\/li>\n<li><span class=\"note-tag\">注<\/span>手数料率は譲渡側・譲受側<strong>両者からの報酬を合算<\/strong>して集計。金融機関＝都市銀行・地方銀行・信金・信組。<\/li>\n<\/ul>\n<h4>算定方式別の手数料率<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>総資産（移動総資産）レーマン方式<\/strong>を採る支援機関の案件は、譲渡価格が同程度でも<strong>手数料が高い傾向<\/strong>。（資料2 p.26）<\/li>\n<li>各算定方式の背景・理由を明らかにし、どの方式が合理的か整理する必要がある。（資料2 p.26）<\/li>\n<li>集計対象：株価／オーナー受取額／企業価値／移動総資産の各レーマン方式採用機関。届出の方式別で、<strong>案件ごとの方式別ではない<\/strong>。（資料2 p.26）<\/li>\n<li>標準的なレーマンテーブルとの差異分析では、<strong>譲渡価額3億円未満は手数料率が跳ね上がるため除外<\/strong>。（資料2 p.26）<\/li>\n<li><span class=\"note-tag\">注<\/span>棒グラフに数値印字なし。目視概算では移動総資産方式は最小規模帯で約55%。要原図確認。<\/li>\n<\/ul>\n<h4>手数料の考え方と寄せられた声<\/h4>\n<ul>\n<li>委員意見：手数料の<strong>透明性を高く<\/strong>することが重要。<strong>金額に焦点を当てすぎると質の低下<\/strong>を起こしかねず、質の高い機関が分かる仕組みが望ましい。（資料2 p.23）<\/li>\n<li>方向性：健全な競争環境の手数料体系や、サービスと見合う適正な手数料を議論。例：<strong>生み出した価値や業務内容・役割を反映した報酬<\/strong>。（資料2 p.27）<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>時期<\/th>\n<th>事業者ヒアリング<\/th>\n<th>情報提供窓口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>M&amp;A実施前<\/td>\n<td>A社：仲介手数料が高いため仲介業者は使わず。大きい買収では手数料と買収資金の借入が必要になる<\/td>\n<td>B社：当初<strong>2,000万円<\/strong>の手数料を提示され、納得できないと言うと<strong>500万円<\/strong>に減額され不信感<\/td>\n<\/tr>\n<tr>\n<td>M&amp;A実施後<\/td>\n<td>C社：手数料が高すぎる。宅建士と比べ品質に差。低くすればM&amp;A活性化につながる<\/td>\n<td>D社：<strong>最低手数料が高額<\/strong>なのに対応が遅い<\/td>\n<\/tr>\n<tr>\n<td>M&amp;A実施後<\/td>\n<td>E社：早く終わらせたい動機が強く、<strong>補助金や税制の話をしてくれる人が少なかった<\/strong><\/td>\n<td>F社：プラットフォーム利用時に仲介／FAと別に支払う<strong>二重請求<\/strong>が分かりにくい<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.27）<\/p>\n<h3 id=\"n3-16\">資料2：仲介・FA手数料の簡易計算ツール<\/h3>\n<p>手数料の可視化と比較性向上のため、手数料の目安を計算できるツール。登録制度HPに<strong>実装予定<\/strong>。（資料2 p.47）<\/p>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>算出できるのは<strong>各レーマン方式の成功報酬のみ<\/strong>（着手金、中間金等を除く）。（資料2 p.48）<\/li>\n<li>算定結果はすべて<strong>税抜き表示<\/strong>（消費税10%を除く）。（資料2 p.48）<\/li>\n<li>一般的なレーマン方式のみ計算可能。<strong>定額方式やその他の方式<\/strong>は各支援機関に問い合わせる。（資料2 p.48）<\/li>\n<li>算定対象は<strong>黒字企業における株式譲渡<\/strong>。赤字・債務超過企業、事業譲渡、その他スキームは<strong>対象外<\/strong>。（資料2 p.48）<\/li>\n<li>必要な財務情報：営業利益、減価償却費、当期純利益、簿価純資産、有利子負債、現預金。（資料2 p.48）<\/li>\n<li>活用シーン：相談前の費用感の把握／手数料の考え方・算定方法の理解／手数料の構成の理解。（資料2 p.48）<\/li>\n<li>自社の財務情報と<strong>レーマンテーブルの基準値<\/strong>を入力する。各方式の<strong>報酬基準額が自動表示<\/strong>され、テーブルは任意入力も可能。（資料2 p.49）<\/li>\n<\/ul>\n<h2 id=\"n3-17\">財務・税務DD<\/h2>\n<p>財務DDは、譲り受け側が譲り渡し側の<strong>収益力や財務リスク<\/strong>を把握するための調査である。結果はバリュエーションに加え、スキーム・最終契約・PMIの検討材料になる。<\/p>\n<h3 id=\"n3-18\">全般に関わる事項<\/h3>\n<p>財務DDの主な調査（5つ）：<\/p>\n<ol>\n<li>バリュエーションに影響のある諸項目（<strong>時価（実態）純資産、正常収益力、運転資本分析、設備投資分析、ネットデット分析<\/strong>）<\/li>\n<li>買収後に顕在化する恐れのある<strong>税務リスク<\/strong>の把握<\/li>\n<li><strong>スタンドアローン・イシュー<\/strong>の把握<\/li>\n<li><strong>PMIに影響を与える事象<\/strong>の把握<\/li>\n<li>一定の目的／項目での検証手続<\/li>\n<\/ol>\n<p>（SM p.102）<\/p>\n<ul>\n<li>ネットデット分析では、<strong>キャッシュライクアイテム・デットライクアイテム<\/strong>等も考慮する。（SM p.102）<\/li>\n<li>書面上だけでなく、<strong>現場へ赴き現物の確認<\/strong>を行うことが肝要。（SM p.102）<\/li>\n<li>中小M&amp;Aでは少ないが、譲り渡し側が事前に問題点を整理する<strong>セラーズDD<\/strong>もある。（SM p.102）（GL p.114）<\/li>\n<\/ul>\n<h4>GL（公認会計士の項）における財務DD<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>目的は、<strong>譲り渡し側の事業実態を調査し、リスク要因を把握する<\/strong>こと。（GL p.114）<\/li>\n<li>具体的には①過去の実績の把握、②現在の財務状態を調査し財務リスクを特定、③将来の事業計画の基礎情報の入手。（GL p.114）<\/li>\n<li>調査範囲・手法は、主に<strong>譲り受け側<\/strong>が前提とするスキーム、許容できるリスク、時間・コストで異なる。（GL p.114）<\/li>\n<li>例：<strong>株式譲渡スキームでは、簿外債務・偶発債務も含めた全般的な調査を要することが多い<\/strong>。（GL p.114）<\/li>\n<li>依頼者と公認会計士が事前に調査範囲・手法を合意して決める（<strong>合意された手続<\/strong>）。（GL p.114）<\/li>\n<li>一般に<strong>基本合意締結後<\/strong>に実施。多大な簿外債務等が見つかれば、<strong>株式譲渡から事業譲渡へスキーム変更<\/strong>もある。（GL p.114）<\/li>\n<li>把握したリスク要因はクロージング後の統合作業（<strong>PMI<\/strong>）でも有用。公認会計士は<strong>慎重かつ効率的な調査を心掛けることが望まれる<\/strong>。（GL p.114）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>仲介者は利益相反防止の観点から<strong>DDを自ら実施すべきでない<\/strong>。開示資料の整理支援やスケジュール管理は可能。→ 倫理タブ参照。（GL p.74）<\/li>\n<\/ul>\n<h3 id=\"n3-19\"><span class=\"star\" aria-label=\"頻出\">★<\/span>主な調査項目の一覧<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>調査項目<\/th>\n<th>目的<\/th>\n<th>主な調査内容・知識<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>①内部統制（SM p.103-104）<\/td>\n<td>レポーティングの実態を調査し、<strong>PMIで改善すべき点<\/strong>を明確化<\/td>\n<td>業務プロセス、資産管理、社内規程、J-SOX対応<\/td>\n<\/tr>\n<tr>\n<td>②会計方針（SM p.105）<\/td>\n<td><strong>正常収益力とPMIへの影響<\/strong>を把握<\/td>\n<td>収益認識基準など12の着眼点<\/td>\n<\/tr>\n<tr>\n<td>③収益力分析（SM p.106）<\/td>\n<td><strong>正常収益力<\/strong>を検討し、バリュエーションの調整に使用<\/td>\n<td>正常化調整、プロフォーマ調整、事業計画への反映<\/td>\n<\/tr>\n<tr>\n<td>④CF分析（SM p.107）<\/td>\n<td>正常な運転資本水準と<strong>必要な設備投資<\/strong>を把握<\/td>\n<td>運転資本分析、固定資産・設備投資分析<\/td>\n<\/tr>\n<tr>\n<td>⑤BSの検証（SM p.108-109）<\/td>\n<td><strong>ネットデット・調整後純資産<\/strong>を分析<\/td>\n<td>資産・負債構造、簿外項目、含み損益<\/td>\n<\/tr>\n<tr>\n<td>⑥カーブアウト財務諸表（SM p.110-111）<\/td>\n<td>切り出し後の前提変化を捉えて検証<\/td>\n<td>スタンドアローン・イシュー6論点、TSA<\/td>\n<\/tr>\n<tr>\n<td>⑦税務リスク・影響（SM p.112）<\/td>\n<td>現在の税務リスクと<strong>スキーム選択に影響する税務<\/strong>を把握<\/td>\n<td>税務DDの一般的調査、諸税の個別検証、役員退職金<\/td>\n<\/tr>\n<tr>\n<td>分析結果のまとめ（SM p.113）<\/td>\n<td>調査報告書に整理し、モデル・最終契約に反映<\/td>\n<td>事業価値の差額の調整方法<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.102-113）<\/p>\n<h3 id=\"n3-20\">①内部統制に係る調査（SM p.103-104）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>区分<\/th>\n<th>確認内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>業務プロセス<\/td>\n<td>決算財務・IT・購買・販売の担当者、決算期、システム、管理承認フロー、データ管理方法等<\/td>\n<\/tr>\n<tr>\n<td>資産管理<\/td>\n<td>現金・預金・有価証券・棚卸資産・固定資産の保管場所、職務分掌等<\/td>\n<\/tr>\n<tr>\n<td>社内規程<\/td>\n<td>就業規則・労使協定、給与規定、退職金規定、出張・旅費規定、育児介護規定、契約社員給与規定等<\/td>\n<\/tr>\n<tr>\n<td>J-SOX（経営者の整備・評価）<\/td>\n<td><strong>業務記述書<\/strong>／<strong>フローチャート<\/strong>／<strong>リスク・コントロール・マトリックス<\/strong><\/td>\n<\/tr>\n<tr>\n<td>J-SOX（監査人の監査）<\/td>\n<td>経営者の内部統制報告書を独立の立場で監査<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.103-104）<\/p>\n<ul>\n<li>譲り受け側が<strong>上場企業<\/strong>の場合、J-SOX法等への対応把握が必要。実施体制整備とリードタイムを考慮する。（SM p.104）<\/li>\n<\/ul>\n<h3 id=\"n3-21\">②会計方針の把握（SM p.105）<\/h3>\n<p>着眼点（12項目）：<\/p>\n<ol>\n<li>収益の認識基準<\/li>\n<li>費用の計上基準<\/li>\n<li>原価計算の方法<\/li>\n<li>外貨建資産及び負債の換算方法<\/li>\n<li>棚卸資産の評価方法<\/li>\n<li>固定資産の減価償却方法<\/li>\n<li>有価証券の評価方法<\/li>\n<li>引当金の計上基準<\/li>\n<li>税効果会計の適用<\/li>\n<li>固定資産の減損会計の適用<\/li>\n<li>資産除去債務会計基準の適用<\/li>\n<li>リース会計基準の適用<\/li>\n<\/ol>\n<p>（SM p.105）<\/p>\n<ul>\n<li>正常収益力への影響：会計方針の変更は各期の<strong>比較可能性<\/strong>に影響。月次と年度で方針が異なると直近月次の試算に影響。（SM p.105）<\/li>\n<li>PMIへの影響：譲り受け側の基準次第で<strong>連結財務諸表<\/strong>の作成が必要になりうる。経理システム統合は大規模になることがある。（SM p.105）<\/li>\n<li>例：<strong>前受金とすべき収入の一括収益計上<\/strong>など、損益が歪められる可能性に留意。（SM p.105）<\/li>\n<\/ul>\n<h3 id=\"n3-22\">③収益力分析（SM p.106）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>調整<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>正常化調整<\/strong><\/td>\n<td>過年度PLの<strong>突発的・一時的な取引<\/strong>を除外し基礎的収益力を計算。営業外・特別損益のうち経常的な事業関連損益を取り込む<\/td>\n<\/tr>\n<tr>\n<td><strong>プロフォーマ調整<\/strong><\/td>\n<td>M&amp;A後に想定される費用・収益の増減を調整。例：廃止事業の除外、カーブアウト時の本社費用の除外、<strong>スタンドアローン・コストの追加<\/strong>、計画為替レートの過去実績への適用<\/td>\n<\/tr>\n<tr>\n<td>事業計画への反映<\/td>\n<td>調整後の収益力を事業計画へ反映<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.106）<\/p>\n<ul>\n<li>EBITDA等の過去の収益力に加え、一時的・偶発的・臨時の損益や廃止事業の損益を把握し、<strong>正常収益力<\/strong>を検討する。（SM p.106）<\/li>\n<li>M&amp;A後に追加・削減される収益・費用を算出し、<strong>バリュエーションでの調整に使用<\/strong>する。（SM p.106）<\/li>\n<\/ul>\n<h3 id=\"n3-23\">④キャッシュフロー分析（SM p.107）<\/h3>\n<ul>\n<li><strong>運転資本分析<\/strong>：過去の季節変動やトレンドを分析し、正常な運転資本水準を導出。売上・生産量と整合しているか確認する。<\/li>\n<li><strong>固定資産・設備投資分析<\/strong>：必要な投資が実施されてきたか、事業計画に織り込まれているかを検討。<\/li>\n<li>設備投資水準と減価償却費の比較で<strong>維持更新投資<\/strong>のタイミング・水準を算出する。<\/li>\n<li>新規事業や規模拡大の設備投資の妥当性は財務DDだけでは困難で、<strong>ビジネスDD等で補完<\/strong>する。<\/li>\n<\/ul>\n<p>（SM p.107）<\/p>\n<h3 id=\"n3-24\"><span class=\"star\" aria-label=\"頻出\">★<\/span>⑤BSの検証（SM p.108-109）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>指標<\/th>\n<th>算式・内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>運転資本<\/td>\n<td><strong>売上債権＋棚卸資産−仕入債務<\/strong>（短期的な資金繰りの評価指標）<\/td>\n<\/tr>\n<tr>\n<td>純資産<\/td>\n<td><strong>総資産−総負債<\/strong><\/td>\n<\/tr>\n<tr>\n<td>調整後純資産<\/td>\n<td><strong>純資産＋含み益−含み損−簿外債務・簿外資産<\/strong>（含み損益は税効果を考慮）<\/td>\n<\/tr>\n<tr>\n<td>ネットデット<\/td>\n<td><strong>有利子負債−現金等の非事業資産<\/strong>（非事業資産が多ければネットキャッシュ）<\/td>\n<\/tr>\n<tr>\n<td>デットライクアイテム<\/td>\n<td>リース債務、退職給付債務、資産除去債務、偶発債務等<\/td>\n<\/tr>\n<tr>\n<td>キャッシュライクアイテム<\/td>\n<td>有価証券、保険積立金、事業外資産等<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.108-109）<\/p>\n<ul>\n<li>ネットデット・純資産の分析結果は、バリュエーションだけでなく<strong>スキーム、最終契約書、買収後ファイナンス、会計上の影響<\/strong>の検討材料となる。（SM p.108）<\/li>\n<li>資産分析の着眼点：<strong>簿外資産の有無<\/strong>／<strong>架空計上等の資産性のない資産の有無<\/strong>。棚卸資産・債券等は<strong>粉飾等の可能性<\/strong>に留意。（SM p.109）<\/li>\n<li>変動しうる項目（未払税金、繰延税金資産・負債、退職給付引当金、リース債務等）やBS未計上項目（偶発債務、資産除去債務等）も確認。（SM p.109）<\/li>\n<li>勘定科目の例：流動資産（現金・預金、受取手形、売掛金、有価証券、棚卸資産、貸倒引当金等）、固定資産（不動産、土地等）。（SM p.108）<\/li>\n<li>負債の例：流動負債（支払手形、買掛金、一年以内返済長期借入金、未払金、未払費用、未払法人税等、未払消費税等、預り金等）、固定負債（長期借入金、預り保証金、預り敷金等）。（SM p.108）<\/li>\n<\/ul>\n<h3 id=\"n3-25\">⑥カーブアウト財務諸表の検証（SM p.110-111）<\/h3>\n<p>スタンドアローン・イシュー（6論点）：<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>論点<\/th>\n<th>検討内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>人員をどう分けるか<\/td>\n<td>分離後の組織体制、想定転籍人員の必要十分性<\/td>\n<\/tr>\n<tr>\n<td>プロセス・業務フローは分離可能か<\/td>\n<td>取引先の抵抗・流出、ブランド・商標変更のコスト・期間、許認可の維持・取得、ボリュームディスカウントの喪失<\/td>\n<\/tr>\n<tr>\n<td>契約関係の移管範囲<\/td>\n<td>どの契約を移管するか、事業部をまたぐ契約は再締結が必要か<\/td>\n<\/tr>\n<tr>\n<td>資産・設備の分離<\/td>\n<td>引越し又は残留時のセキュリティウォール設置と費用負担、新設設備、知的財産の譲渡範囲<\/td>\n<\/tr>\n<tr>\n<td>共通費の配賦<\/td>\n<td>共通費をどう配賦するか<\/td>\n<\/tr>\n<tr>\n<td>システム・インフラの分離<\/td>\n<td>ITアプリの分離や新規ライセンス費用、ITコストが分離後規模と比較して適切か<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.110）<\/p>\n<ul>\n<li>譲り渡し側内部の前提で配賦計算されているため、<strong>切り出し後を想像し前提の変化を捉えて検証<\/strong>する。（SM p.110）<\/li>\n<li>短期間の分離が難しい場合、<strong>移行期間業務委託契約（TSA）<\/strong>を最終契約の付随契約として締結する。（SM p.110）<\/li>\n<li>共通費が精緻に見積もられている例は<strong>稀<\/strong>。提出された諸表と実際のCFに乖離が生じる場合がある。（SM p.110）<\/li>\n<li>製造所・物流センター等の全社共通資産は、運用方法を決めないと諸表に含める範囲・金額を決められない。（SM p.111）<\/li>\n<li>事業譲渡では、個別事情を加味した<strong>カーブアウト財務諸表<\/strong>の作成が必要とされる。（SM p.31）<\/li>\n<\/ul>\n<h3 id=\"n3-26\"><span class=\"star\" aria-label=\"頻出\">★<\/span>⑦税務リスク・影響の把握（税務DD）<\/h3>\n<p>税務DDは、対象会社の企業価値に影響する<strong>潜在的な税務リスク<\/strong>（例：過去の申告誤りによる追徴課税等）の把握等の観点から必要に応じて行う。依頼者と協議し、<strong>調査対象範囲・対象年度・手法<\/strong>を決める。（GL p.119）<\/p>\n<p>一般的な調査手続（5項目）：<\/p>\n<ol>\n<li>対象会社の経営陣、顧問税理士等に対する<strong>インタビュー<\/strong><\/li>\n<li>過去の<strong>税務申告書のレビュー<\/strong><\/li>\n<li>過去の<strong>税務調査・税務訴訟等<\/strong>の把握<\/li>\n<li>過去の<strong>組織再編、資本取引等の税務処理<\/strong>の把握<\/li>\n<li><strong>税務上の欠損金の使用可能性<\/strong>、各種税制の適用状況の把握 等<\/li>\n<\/ol>\n<p>（SM p.112）（GL p.119）<\/p>\n<ul>\n<li>過去に顕在化した税務リスクから現在の税務リスクを理解する（<strong>過年度申告に潜在するリスク、検討スキームが税務に与える影響、その他諸税のリスク<\/strong>）。（SM p.112）<\/li>\n<li>スキーム選択に影響する税務上の影響の把握（SM p.112）：\n  1. 過去の税務調査結果・指導事項・議論点の分析\n  2. 申告書・決算書の分析とヒアリング\n  3. 必要な届出等の提出確認\n  4. 検討スキームにおける譲り受け側・譲り渡し側の<strong>課税関係<\/strong>の検討\n  5. <strong>消費税・源泉所得税・償却資産税・関税等<\/strong>の諸税の個別検証<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>クロージング後に申告漏れ・記載ミスが発覚すると、<strong>譲り受け側が納税を負担<\/strong>する恐れがある。追徴課税が多額なら経営不振に陥る可能性もある。（SM p.112）<\/li>\n<li>役員退職金が不相当に高額な場合の損金不算入 → 次節「税務の論点」参照。（SM p.112）<\/li>\n<li>スキル：<strong>顧問税理士と連携<\/strong>し、必要資料の依頼や過去の会計・税務処理のインタビューを実施できる。（SM p.112）<\/li>\n<li>顧問税理士は、顧問先が対象のDDについて必要資料の提供やインタビュー等に<strong>積極的に協力することが望ましい<\/strong>。（GL p.119）<\/li>\n<\/ul>\n<h3 id=\"n3-27\">分析結果のまとめ（SM p.113）<\/h3>\n<ul>\n<li>BSやPLを大分類とし、勘定科目・実施事項・調査結果・発見されたリスクを<strong>調査報告書<\/strong>で整理。リスクはテーマ別に整理する。<\/li>\n<li>DD終了時点で、クロージング日の事業価値とネットデットを正確に見込めるか。見込めなければ差分調整を双方と協議する。<\/li>\n<li>譲渡額調整を行う場合、最終契約に多くの規定が必要で<strong>時間を要する<\/strong>。<\/li>\n<li>スキル：調査結果を報告書に端的にまとめ、<strong>バリュエーションモデル及び最終契約の調整事項に反映<\/strong>できる。<\/li>\n<\/ul>\n<p>（SM p.113）<\/p>\n<p>最終契約日とクロージング日の間に事業価値の差額が生じた場合の調整方法：<\/p>\n<ol>\n<li>差額の<strong>全額を調整<\/strong>する方法<\/li>\n<li><strong>一定の金額を超えた部分のみ<\/strong>を調整額とする方法<\/li>\n<li><strong>上方又は下方調整のみ<\/strong>を行う方法<\/li>\n<li>調整額に<strong>上限<\/strong>をつける方法 等<\/li>\n<\/ol>\n<p>（SM p.113）<\/p>\n<h3 id=\"n3-28\">DD結果の譲渡額への反映（手法別）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>手法<\/th>\n<th>反映する場面<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>時価純資産法<\/td>\n<td>資産の<strong>含み損益や簿外債務<\/strong>が検出された場合<\/td>\n<\/tr>\n<tr>\n<td>DCF法<\/td>\n<td>収益・費用を修正して<strong>正常収益力<\/strong>が算出された場合（将来CFにも影響）<\/td>\n<\/tr>\n<tr>\n<td>類似会社比較法<\/td>\n<td>EBIT倍率やEBITDA倍率等に影響するため、<strong>正常収益力<\/strong>が算出された場合<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.139）<\/p>\n<ul>\n<li>財務・税務DDでは<strong>含み益、簿外資産、削減可能費用<\/strong>等のポジティブな事項も検出されうる。<strong>リスク要因だけが譲渡額等に反映されないよう調整<\/strong>する。（SM p.138）<\/li>\n<li>簿外債務が懸念される場合は、株式譲渡から<strong>事業譲渡へスキーム変更<\/strong>し、必要な資産・負債のみ引き継ぐ。→ 法務タブ参照。（SM p.139）<\/li>\n<\/ul>\n<h3 id=\"n3-29\">DDで依頼する資料（参考）<\/h3>\n<ul>\n<li>請求すべき資料：<strong>営業報告書／財務諸表／税務申告書／販売費及び一般管理費の明細／販売計画資料／投資実績／投資計画／減価償却費の明細<\/strong> 等。（SM p.87）<\/li>\n<li>認識齟齬を避けるため、<strong>資料名、対象年度、資料形式、原本閲覧の要否<\/strong>を明記する。（SM p.87）<\/li>\n<li>DD実施機関の分担：会計・税務は会計士・税理士等。→ 実務タブ参照。（SM p.84）<\/li>\n<\/ul>\n<h2 id=\"n3-30\">税務の論点<\/h2>\n<p>添付資料には税率や課税関係の詳細な記載がほぼなく（例外はGL p.118の個人課税の税率程度）、試験対策には<strong>法人税・所得税・相続税・贈与税・登録免許税等の基礎<\/strong>の追加学習が必要である。資料内では「スキーム別の課税の違い」「役員退職金の損金算入限度」「印紙税」「税務DD」が中心である。<\/p>\n<h3 id=\"n3-31\">試験科目における税務の位置付け<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>区分<\/th>\n<th>中項目<\/th>\n<th>出題割合<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>財務・税務：財務<\/td>\n<td>財務基礎／スキームの初期的な検討（財務上の留意事項）／バリュエーション／財務DD／最終契約<\/td>\n<td>科目全体20〜23%程度（12〜14問）<\/td>\n<\/tr>\n<tr>\n<td>財務・税務：税務<\/td>\n<td><strong>税務基礎／スキームの初期的な検討（税務上の留意事項）／税務DD／最終契約<\/strong><\/td>\n<td>うち税務3〜5%（2〜3問）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.10-11）<\/p>\n<ul>\n<li>科目目的：財務・税務リスクを理解し、<strong>公認会計士・税理士と適切に連携<\/strong>して依頼者を支援するための基礎知識を判定する。（資料2 p.9）<\/li>\n<li>委員意見：財務・税務の出題は<strong>会計・税務の基礎知識<\/strong>が多い。税務を含むため法務より割合を高くする。（資料2 p.11-12）<\/li>\n<li>合格者像は「<strong>専門家が必要な論点かどうかを判断できる<\/strong>」水準。独占業務（<strong>税理士法第52条<\/strong>等）に抵触しないことが前提。（資料2 p.3, 5, 12）<\/li>\n<li>SMの知識の6観点のうち「会計／税務」は、関連資料の読み取りやスキームから生じる<strong>論点やリスクを認識するための知識<\/strong>。（SM p.17）<\/li>\n<li>SMの業務例（会計／税務）：<strong>ストラクチャリング、会計処理／税務処理、簿外債務／税務リスク<\/strong>。（SM p.5）<\/li>\n<\/ul>\n<h4><span class=\"star\" aria-label=\"頻出\">★<\/span>独占業務との関係<\/h4>\n<ul>\n<li>資格のない支援者が、株式譲渡で株主が支払う税額を「契約外の税務相談」として<strong>無償で試算することも適法に行えない<\/strong>（サンプル問題④の（イ））。→ 倫理タブ参照。（資料2 p.16）<\/li>\n<li><span class=\"note-tag\">注<\/span>資料2に解説文はなく、正答は「ア、イ、ウ、エ」と表示されるのみ。（資料2 p.16）<\/li>\n<\/ul>\n<h3 id=\"n3-32\"><span class=\"star\" aria-label=\"頻出\">★<\/span>スキーム別の税務上の特徴<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>スキーム<\/th>\n<th>法人側の税務<\/th>\n<th>経営者個人の税金<\/th>\n<th>その他の税目・留意点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>株式譲渡<\/td>\n<td><strong>株式取得後に合併等をした場合、一定の要件を満たせば欠損金を引き継ぐことができる<\/strong><\/td>\n<td>譲渡益に対する<strong>分離課税（税率20.315%）<\/strong>で課税関係が終了<\/td>\n<td>簿外債務・偶発債務を引き継ぐ。許認可の再取得や登記手続は<strong>不要<\/strong><\/td>\n<\/tr>\n<tr>\n<td>事業譲渡<\/td>\n<td>税務上の<strong>のれん（資産調整勘定）<\/strong>が生じた場合、<strong>損金算入<\/strong>できる。譲渡対価は<strong>法人に帰属<\/strong>し益金に<strong>法人税等<\/strong>が課税<\/td>\n<td>配当・役員報酬等で還流すると<strong>総合課税（税率15.105%〜55.945%）<\/strong><\/td>\n<td>減価償却資産等は<strong>消費税の課税売上<\/strong>。不動産取得時は<strong>不動産取得税・登録免許税<\/strong><\/td>\n<\/tr>\n<tr>\n<td>会社分割・合併等<\/td>\n<td>添付資料に税務上の記載なし<\/td>\n<td>記載なし<\/td>\n<td>法律上の手続（債権者保護手続等）のみ記載。→ 法務タブ参照<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.117-118）（SM p.31-33）（参考資料1 p.1-3）<\/p>\n<ul>\n<li>中小M&amp;Aは一般に<strong>株式譲渡又は事業譲渡<\/strong>が多く、代表者への<strong>役員退職慰労金<\/strong>の支払と組み合わせることもある。（GL p.117）<\/li>\n<li>事業譲渡では、総合課税を避ける観点から、<strong>分離課税となる役員退職慰労金<\/strong>の支給と併せて検討することもあり得る。（GL p.118）（SM p.31）<\/li>\n<li>経営者個人に所得が生じると、所得税・住民税のほか、（会社の社会保険に未加入のとき）<strong>国民健康保険料又は後期高齢者医療保険料<\/strong>にも影響する。（GL p.117）<\/li>\n<li>事業譲渡は、株式の分散等で株式譲渡が困難でも、<strong>株主総会特別決議が可能な場合には有効<\/strong>。（GL p.118）<\/li>\n<li>税理士は、各スキームのメリット・デメリットを総合的に勘案し、適切な助言やスキーム提案が<strong>期待される<\/strong>。（GL p.117）<\/li>\n<li>サンプル問題①（M&amp;A実務）も株式譲渡と事業譲渡の比較。→ 実務タブ参照。（資料2 p.13）<\/li>\n<\/ul>\n<h3 id=\"n3-33\"><span class=\"star\" aria-label=\"頻出\">★<\/span>役員退職金の損金算入限度額の目安<\/h3>\n<p>役員退職金が<strong>不相当に高額<\/strong>な場合、<strong>超過部分は損金算入されず<\/strong>課税の取扱いが変わる。損金算入可能な実務上の限度額の目安は次のとおり。<\/p>\n<pre class=\"formula\"><code>\\text{役員退職金の限度額} = \\text{最終月額報酬} \\times \\text{役員勤続年数} \\times \\text{功績倍率}\n<\/code><\/pre>\n<p>（SM p.112, 143）<\/p>\n<ul>\n<li>最終契約の「譲渡額」で求められる知識：<strong>損金算入可能な実務上の役員退職金の限度額<\/strong>、役員退職金に関する<strong>退職所得にかかる税額<\/strong>。<span class=\"note-tag\">注<\/span>税額の計算方法は記載なし。（SM p.143）<\/li>\n<li>譲渡額をクロージング時に全額支払わない条項（分割払い、<strong>役員退職金や顧問料での代替<\/strong>等）は、支払不履行等のトラブルの原因となりうる。（SM p.143）<\/li>\n<li>調整不十分な段階で<strong>安易に提案すべきでない<\/strong>。盛り込む場合は<strong>エスクロー取引<\/strong>の検討・提案も行う<strong>べき<\/strong>。（SM p.143）<\/li>\n<li>役員退職慰労金のクロージング後払いは、引継ぎのため残留する場合のインセンティブになるが、<strong>不履行リスク<\/strong>がある。（SM p.165）<\/li>\n<li>時価純資産法の計算例でも、役員退職金（▲50）を負債として減額している。（参考資料2 p.2-3）<\/li>\n<\/ul>\n<h3 id=\"n3-34\"><span class=\"star\" aria-label=\"頻出\">★<\/span>印紙税<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>文書<\/th>\n<th>取扱い<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>株式譲渡契約書等<\/td>\n<td>一般に印紙税の<strong>非課税文書<\/strong><\/td>\n<\/tr>\n<tr>\n<td>代金受領の記載がある場合<\/td>\n<td><strong>課税文書（印紙税法別表第1第17号の1文書）<\/strong>で、収入印紙の貼付が必要<\/td>\n<\/tr>\n<tr>\n<td>株式譲渡代金の領収書<\/td>\n<td><strong>収入印紙が必要<\/strong>（クロージング書類）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.118）（SM p.159）<\/p>\n<h3 id=\"n3-35\">諸税の個別検証とその他の税目<\/h3>\n<ul>\n<li>税務DDでは<strong>消費税・源泉所得税・償却資産税・関税等<\/strong>の諸税を個別に検証する。→ 前節「財務・税務DD」参照。（SM p.112）<\/li>\n<li>事業譲渡契約書サンプル：譲渡代金は<strong>消費税及び地方消費税は別途<\/strong>。（参考資料7 p.39）<\/li>\n<li>同サンプル：固定資産税等の公租公課は<strong>日割計算<\/strong>で、クロージング日前日までは譲渡人、以降は譲受人が負担。移転手続の<strong>登録免許税等は譲受人負担<\/strong>。（参考資料7 p.40）<\/li>\n<li>バリュエーションでは、含み損益の<strong>税効果<\/strong>を考慮する（調整後純資産）。計算例は実効税率34%と仮定。（SM p.108）（参考資料2 p.2）<\/li>\n<\/ul>\n<h3 id=\"n3-36\">税法基準の株価とM&amp;Aの株価<\/h3>\n<ul>\n<li><strong>税法基準で計算した株価<\/strong>（例：<strong>相続税評価<\/strong>）と、当事者が調整して決める<strong>M&amp;Aの株価<\/strong>の違いを理解する。（SM p.41）<\/li>\n<li>「財産評価基本通達」の取引相場のない株式の評価（<strong>純資産価額方式<\/strong>）は<strong>時価純資産法に類似<\/strong>し、税理士の知識でも対応可能とされる。（GL p.119-120）<\/li>\n<li>判断が困難な場合は、M&amp;A専門の公認会計士等や公的機関と連携することが<strong>必要<\/strong>。（GL p.120）<\/li>\n<li>親族内承継に係る<strong>税制や各種法制<\/strong>も、ヒアリングで求められる知識とされる。<span class=\"note-tag\">注<\/span>内容の記載はない。（SM p.28）<\/li>\n<\/ul>\n<h3 id=\"n3-37\">政策上の税制・特例<\/h3>\n<h4><span class=\"star\" aria-label=\"頻出\">★<\/span>中堅・中小グループ化税制（資料1 p.16）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>当初制度<\/th>\n<th>拡充枠（令和6年度税制改正で創設）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>積立率<\/td>\n<td>株式取得価額の<strong>70%まで<\/strong><\/td>\n<td>M&amp;A<strong>2回目90%、3回目以降100%<\/strong><\/td>\n<\/tr>\n<tr>\n<td>据置期間<\/td>\n<td><strong>5年間<\/strong>（その後5年間均等取崩し）<\/td>\n<td><strong>10年<\/strong><\/td>\n<\/tr>\n<tr>\n<td>要件<\/td>\n<td>―<\/td>\n<td><strong>産業競争力強化法<\/strong>で新設する認定。<strong>過去5年以内にM&amp;A実績<\/strong>が必要<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料1 p.16）<\/p>\n<ul>\n<li>正式名称は「中小企業事業再編投資損失準備金の拡充及び延長」。積立時は<strong>損金算入<\/strong>、取崩し時に<strong>益金算入<\/strong>。（資料1 p.16）<\/li>\n<li><strong>中堅企業は2回目以降のM&amp;Aから活用可能<\/strong>。簿外債務発覚で減損処理した場合や株式売却時等は準備金を取崩す。（資料1 p.16）<\/li>\n<\/ul>\n<h4>中小企業等経営強化法の特例（GL p.119）<\/h4>\n<ul>\n<li>経営力向上計画の認定で受けられる<strong>税制措置<\/strong>：設備に係る<strong>法人税等の特例<\/strong>／事業承継等に係る<strong>登録免許税・不動産取得税の特例<\/strong>。<\/li>\n<li>その他の支援：金融支援（公庫の低利融資、信用保証等）、法的支援（許認可承継の特例等）。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>法人税等の特例と登録免許税・不動産取得税の特例には<strong>適用期限がある<\/strong>ため留意。<\/li>\n<\/ul>\n<p>（GL p.119）<\/p>\n<h4>その他の記載<\/h4>\n<ul>\n<li>「大胆な投資促進税制」（産業競争力強化法改正案）：投資利益率15%以上、投資規模35億円（<strong>中小5億円<\/strong>）以上等で、<strong>即時償却又は税額控除7%等<\/strong>。（資料2 p.36）<\/li>\n<li>事業承継・M&amp;A補助金（専門家活用枠等）は手数料・DD費用等が対象。<span class=\"note-tag\">注<\/span>補助金の税務上の取扱いの記載はない。→ 実務タブ参照。（資料1 p.18）<\/li>\n<li>寄せられた声：仲介業者が<strong>補助金や税制の話をしてくれなかった<\/strong>（E社）。（資料2 p.27）<\/li>\n<\/ul>\n<h3 id=\"n3-38\">税理士に関する記載（参考）<\/h3>\n<ul>\n<li>税理士法第41条の3：委嘱者の不正な脱税等を知ったときは、<strong>直ちに、その是正をするよう助言しなければならない<\/strong>。（GL p.116-117）<\/li>\n<li>助言に従わないまま業務を続けると、<strong>不真正税務書類作成禁止違反等（同法第45条）<\/strong>に該当するおそれ。（GL p.117）<\/li>\n<li>DDやバリュエーション等は直接的には税理士の業務に含まれない。顧問業務外なら<strong>事前に説明し業務内容や報酬の了承を得る<\/strong>ことも必要。（GL p.116）<\/li>\n<\/ul>", "toc": [{"id": "n3-1", "level": 2, "text": "バリュエーション"}, {"id": "n3-2", "level": 3, "text": "位置付けと基本ルール"}, {"id": "n3-3", "level": 3, "text": "スキルマップ上の大項目と項目"}, {"id": "n3-4", "level": 3, "text": "手法別の特徴・メリット・デメリット"}, {"id": "n3-5", "level": 3, "text": "算定方法の詳細（SMの計算手順）"}, {"id": "n3-6", "level": 3, "text": "参考資料2「中小M&Aの譲渡額の算定方法」の計算例"}, {"id": "n3-7", "level": 3, "text": "★サンプル問題②：FCFの計算（正答25百万円）"}, {"id": "n3-8", "level": 3, "text": "資料2：株式価値の簡易計算ツール"}, {"id": "n3-9", "level": 2, "text": "仲介者・FAの手数料"}, {"id": "n3-10", "level": 3, "text": "手数料の種類（GL第1章Ⅴ 1）"}, {"id": "n3-11", "level": 3, "text": "★成功報酬の3つの基準価額"}, {"id": "n3-12", "level": 3, "text": "★レーマン方式と最低手数料"}, {"id": "n3-13", "level": 3, "text": "★具体例：事例1〜4"}, {"id": "n3-14", "level": 3, "text": "契約前の確認と対応（GL第1章Ⅴ 4）"}, {"id": "n3-15", "level": 3, "text": "資料2：手数料の初期的分析"}, {"id": "n3-16", "level": 3, "text": "資料2：仲介・FA手数料の簡易計算ツール"}, {"id": "n3-17", "level": 2, "text": "財務・税務DD"}, {"id": "n3-18", "level": 3, "text": "全般に関わる事項"}, {"id": "n3-19", "level": 3, "text": "★主な調査項目の一覧"}, {"id": "n3-20", "level": 3, "text": "①内部統制に係る調査（SM p.103-104）"}, {"id": "n3-21", "level": 3, "text": "②会計方針の把握（SM p.105）"}, {"id": "n3-22", "level": 3, "text": "③収益力分析（SM p.106）"}, {"id": "n3-23", "level": 3, "text": "④キャッシュフロー分析（SM p.107）"}, {"id": "n3-24", "level": 3, "text": "★⑤BSの検証（SM p.108-109）"}, {"id": "n3-25", "level": 3, "text": "⑥カーブアウト財務諸表の検証（SM p.110-111）"}, {"id": "n3-26", "level": 3, "text": "★⑦税務リスク・影響の把握（税務DD）"}, {"id": "n3-27", "level": 3, "text": "分析結果のまとめ（SM p.113）"}, {"id": "n3-28", "level": 3, "text": "DD結果の譲渡額への反映（手法別）"}, {"id": "n3-29", "level": 3, "text": "DDで依頼する資料（参考）"}, {"id": "n3-30", "level": 2, "text": "税務の論点"}, {"id": "n3-31", "level": 3, "text": "試験科目における税務の位置付け"}, {"id": "n3-32", "level": 3, "text": "★スキーム別の税務上の特徴"}, {"id": "n3-33", "level": 3, "text": "★役員退職金の損金算入限度額の目安"}, {"id": "n3-34", "level": 3, "text": "★印紙税"}, {"id": "n3-35", "level": 3, "text": "諸税の個別検証とその他の税目"}, {"id": "n3-36", "level": 3, "text": "税法基準の株価とM&Aの株価"}, {"id": "n3-37", "level": 3, "text": "政策上の税制・特例"}, {"id": "n3-38", "level": 3, "text": "税理士に関する記載（参考）"}]}, {"tab": 4, "title": "法務・契約", "html": "<h2 id=\"n4-1\">法務DD<\/h2>\n<p>法務DDの目的は、M&amp;A実行・事業運営上の法務リスク（係争・紛争等）と契約上のリスクの把握である。株式譲渡では法的リスクをそのまま引き継ぎやすいため、全般的・網羅的に行うことが多い。<\/p>\n<h3 id=\"n4-2\">全般に関わる事項<\/h3>\n<ul>\n<li>スキル：ビジネスモデル・事業構造を理解し、ディールブレイクとなる法務リスクを検証できる。<\/li>\n<li>株式・労務に関する事項は、何らかの事項が検出されることが多い。<\/li>\n<li>観点：株式・会社組織／重要な契約／資産及び負債／人事・労務／訴訟・紛争／許認可・コンプライアンス・環境問題等。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>簿外債務・未払残業等は問題が発覚しやすい論点で、調査事項に含めることが<strong>望ましい<\/strong>。<\/li>\n<\/ul>\n<p>（SM p.114）<\/p>\n<h3 id=\"n4-3\">主な調査項目一覧<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>知識（何を見るか）<\/th>\n<th>ポイント（実務上の着眼点）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>①株主（SM p.115-116）<\/td>\n<td>株主・株主の履歴・株主間契約の有無／株式の適法有効な発行、譲渡制限の有無・内容、株券発行の有無<\/td>\n<td>株券発行会社は、定款上の区分・実際の発行・株券の存在を早期確認。株主名簿にない株主はヒアリングで確認。名簿不存在・瑕疵は会社法上の過料＋正確な株主が不明に。株券裏面・取締役会議事録・税務申告書別表等で異動履歴を確認<\/td>\n<\/tr>\n<tr>\n<td>②組織（SM p.117）<\/td>\n<td>組織図、社員名簿、定款、社内規程、商業登記簿謄本、登記事項、株主総会・取締役会議事録<\/td>\n<td>適法に設立・存続し、会社法・定款どおり運営されているか。役員選任手続の適法性。法令違反を把握したら治癒可能か綿密に討議<\/td>\n<\/tr>\n<tr>\n<td>③契約（SM p.118-119）<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>チェンジ・オブ・コントロール（COC）条項、競業避止条項、定款、特許の専用実施権、最低仕入数量、リベート、債務保証、違約罰、口頭合意・業界慣行<\/td>\n<td>COC条項は成立後に取引先が契約を破棄できるため重要。同意取得の要否と売上影響を確認。短期更新条項も実質COCとして機能しうる。代表者保証の有無も確認<\/td>\n<\/tr>\n<tr>\n<td>④資産（知的財産権含む）・負債（SM p.120）<\/td>\n<td>事業用資産の継続利用可否、COC条項、担保権／借入状況、通知・失効条項、財務制限条項、期限前弁済手数料、社債・保険<\/td>\n<td>不動産・大型設備は現地確認。社用車の個人使用など帰属の混在はM&amp;A成立前に整理。DD前から処理方針を検討しDD実施機関に伝えることが<strong>望ましい<\/strong><\/td>\n<\/tr>\n<tr>\n<td>⑤人事・労務（SM p.121）<\/td>\n<td>労働者・労働組合の状況、就業規則・労働協約・労使協定、労基署の是正勧告、偽装請負、賃金支払、年金制度、未払残業代等の偶発債務<\/td>\n<td>違反例：就業規則・36協定がない、在留資格・就労資格がない外国人従業員。キーマンの把握。年金・退職金の変更は説明と同意取得が必要<\/td>\n<\/tr>\n<tr>\n<td>⑥許認可（SM p.122）<\/td>\n<td>重要な許認可・届出の種類と更新状況<\/td>\n<td>マッチング前が理想。買参権など業界特有の権利は見落とされ得るためDD前に把握。複雑なら行政書士等へ早めに相談<\/td>\n<\/tr>\n<tr>\n<td>⑦コンプライアンス（SM p.123）<\/td>\n<td>関連法令の遵守状況、監督官庁の指導等の有無<\/td>\n<td>重大違反例：個人情報の私的利用、偽装、給付金の不正受給、談合。治癒不能ならスキーム変更・ディール中止も早期に協議<\/td>\n<\/tr>\n<tr>\n<td>⑧環境（SM p.124）<\/td>\n<td>土壌汚染対策法、水質汚濁防止法、大気汚染防止法等、原状回復コストの算出方法<\/td>\n<td>工場・研究開発設備・跡地を保有する場合に調査。リスクが大きければ初期から環境専門家を起用。対象から外す選択も<\/td>\n<\/tr>\n<tr>\n<td>⑨訴訟・紛争（SM p.124）<\/td>\n<td>係属中の訴訟、過去の訴訟、クレーム、民事訴訟法、執行・保全<\/td>\n<td>係属中の訴訟は一方的に取り下げられない。<span class=\"star\" aria-label=\"頻出\">★<\/span>見通し・処理方針の見解表明は非弁行為の可能性が高く、弁護士等に相談<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.115-125）<\/p>\n<h3 id=\"n4-4\">各項目の補足<\/h3>\n<h4>株主<\/h4>\n<ul>\n<li>株券発行会社なのに株券不発行の場合、対応しなければM&amp;A成立は不可能。引渡しのやり直しや株券不発行会社への移行で対応する。<\/li>\n<li>特例有限会社は、特別決議に総株主の半数以上かつ議決権の4分の3以上の賛成が必要。スクイーズ・アウトや定款変更が困難・不可となることがある。<\/li>\n<li>少数株主が旧配偶者やその子など特殊な関係にある場合は、株式整理上留意が必要。<\/li>\n<\/ul>\n<p>（SM p.115-116）<\/p>\n<h4>契約<\/h4>\n<ul>\n<li>相手方が上場企業なら契約管理が厳格になり、同意取得プロセスが変わりうる。<\/li>\n<li>競業避止条項は、過去に他のM&amp;Aを行った場合に特に重要。<\/li>\n<li>特許権者が専用実施権を設定すると、自身も権利行使の制限を受ける。<\/li>\n<li>事業上重要・代替性のない取引先は契約書からは分からないため、Q&amp;A・インタビューで確認する。<\/li>\n<li>商流を構造化してから各契約を確認し、雛形と異なるCOC条項などは事情を聴取する。<\/li>\n<\/ul>\n<p>（SM p.118-119）<\/p>\n<h4>人事・労務<\/h4>\n<ul>\n<li>小規模企業では従業員一人一人の人間関係が重要で、トラブルの有無を確認する。<\/li>\n<li>年金制度の変更は行政手続が必要な場合があり、時間を要すればスケジュール見直しも検討する。<\/li>\n<\/ul>\n<p>（SM p.121）<\/p>\n<h4>許認可・コンプライアンス<\/h4>\n<ul>\n<li>許認可を有さないまま事業を行うことのないよう、取得スケジュールを確認し早急に対応する。<\/li>\n<li>譲り受け側の資料準備が遅れると、スケジュール影響やディール中止の可能性がある。<\/li>\n<li>クロージング前に治癒できない違反は、連帯責任やブランド低下を避けるため子会社化できないリスクがある。<\/li>\n<li>譲り受け側が上場を見据える場合、上場審査で規程の運用と法規制遵守が確認される。<\/li>\n<\/ul>\n<p>（SM p.122-123）<\/p>\n<h4>訴訟・紛争<\/h4>\n<ul>\n<li>潜在リスクはクロージング直前に訴訟化することもあり、早期把握が必要。<\/li>\n<li>解決の目途がない場合、対価の一部後払いや価格調整条項が考えられる。<\/li>\n<li>ただし追加対価の設定が曖昧になり、不履行・深刻なトラブルにつながるリスクがある。<\/li>\n<\/ul>\n<p>（SM p.124）<\/p>\n<h3 id=\"n4-5\">分析結果のまとめ<\/h3>\n<ul>\n<li>知識：会社法・民法・独禁法・知財法等の総合的知識、コスト・スケジュールへの反映箇所。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>報告のみに留めず、どの程度治癒し、どの程度リスクを取って進めるかを依頼者と協議する。<\/li>\n<li>修復コスト・対応スケジュール・修復しない場合のリスクを説明し、依頼者の決定を支援する。<\/li>\n<li>修復しないリスクは譲り受け側の損害となるため、最終契約時に範囲・内容を十分協議できるよう支援する。<\/li>\n<\/ul>\n<p>（SM p.125）<\/p>\n<h2 id=\"n4-6\">仲介契約書サンプル<\/h2>\n<p>仲介契約書サンプルは、譲り渡し側株主（甲）と仲介者（乙）の契約例で、第1〜10条と第4条の2からなる。専任・直接交渉の制限・テール（終了後2年以内）・報酬開示・利益相反禁止5類型が頻出である。<\/p>\n<h3 id=\"n4-7\">前提と位置づけ<\/h3>\n<ul>\n<li>参考資料7は（1）仲介契約書、（2）秘密保持契約書、（3）基本合意書、（4）株式譲渡契約書、（5）事業譲渡契約書を掲載。<\/li>\n<li>いずれも例であり、具体的作成は弁護士等の専門家に相談することが<strong>望ましい<\/strong>。<\/li>\n<li>（1）（3）（4）（5）は日弁連等編「事業承継法務のすべて」（きんざい、平成30年）から抜粋・一部加工。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>FA契約書のサンプルは掲載されていない。FA契約への読替えは仲介契約書の「注」で示される。<\/li>\n<li>前文：「本件取引」＝株式譲渡・事業譲渡・増資引受け・合併・株式交換・会社分割・資本業務提携等。<\/li>\n<\/ul>\n<p>（参考資料7 p.1-2）<\/p>\n<h3 id=\"n4-8\">条文ごとの要旨<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条<\/th>\n<th>見出し<\/th>\n<th>要旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第1条<\/td>\n<td>業務の依頼<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>乙は甲又は対象会社の<strong>代理人として法律行為を行わない<\/strong>。業務：①候補先の紹介・斡旋 ②候補先の業務・財務・経営戦略の情報提供 ③是非の検討・決定の助言・補助 ④候補先又はその親会社・株主への提案 ⑤交渉への立会い ⑥スキーム・価格等の助言 ⑦資料・企業概要書・諸手続・スケジューリングの助言・補助 ⑧付随サービス<\/td>\n<\/tr>\n<tr>\n<td>第2条<\/td>\n<td>専任条項<\/td>\n<td>1項：有効期間中、類似業務を乙以外に依頼せず、対象会社にも依頼させない。2項：特段の理由がない限り、乙に<strong>事前に予告した上で<\/strong>、弁護士・公認会計士等のアドバイザーや公的機関（事業承継・引継ぎ支援センターを含む）に一切の相談ができる<\/td>\n<\/tr>\n<tr>\n<td>第3条<\/td>\n<td>直接交渉の制限<\/td>\n<td>甲は<strong>乙の事前の承諾なく<\/strong>、候補先（<strong>乙が関与又は接触し、甲に紹介した者に限る<\/strong>）又はその代理人に接触しない。対象会社にもさせない<\/td>\n<\/tr>\n<tr>\n<td>第4条<\/td>\n<td>秘密保持義務<\/td>\n<td>秘密情報＝(i)開示情報、(ii)契約締結の事実・存在・内容、(iii)交渉の経緯・内容。事前の書面承諾なく開示・目的外使用しない。除外5類型（下記）。例外開示4類型（下記）。<strong>成約に至らなかった場合<\/strong>は請求により返還。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>契約有効期間満了後3年間<\/strong>存続<\/td>\n<\/tr>\n<tr>\n<td>第4条の2<\/td>\n<td>候補先への報酬等の開示<\/td>\n<td>甲は、乙への報酬（本契約に基づかない報酬、締結後の増額変更を含む）を候補先に開示することに同意する<\/td>\n<\/tr>\n<tr>\n<td>第5条<\/td>\n<td>有効期間<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>締結日から1年間<\/strong>。満了<strong>1週間前<\/strong>までに申出がなければ<strong>更に1年間自動延長<\/strong>。検討・交渉終了時点で終了<\/td>\n<\/tr>\n<tr>\n<td>第6条<\/td>\n<td>報酬等<\/td>\n<td>着手金・中間金・成功報酬（下表）。2項テール条項、3項消費税加算、4項費用（甲の事前了解を得た特別の事由による出費：出張、外部委託調査等）<\/td>\n<\/tr>\n<tr>\n<td>第7条<\/td>\n<td>解除<\/td>\n<td>1項：<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>甲は本件取引の実行前に限り、いつでも<\/strong>解除できる。2項：乙は①報酬不払で<strong>相当の期間を定めて催告<\/strong>しても応じない ②甲の虚偽申告・正当理由なき不告知で著しい不都合、の場合に解除可。3項：業務の程度に応じ報酬・費用を<strong>清算<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第8条<\/td>\n<td>乙の責任<\/td>\n<td>1項：採否・契約締結は<strong>甲が自らの判断<\/strong>で行う。2項：乙は<strong>善良な管理者の注意義務<\/strong>を負う。3項：成果・効果の実現を保証しない。4項：利益相反行為の禁止（下記5類型）<\/td>\n<\/tr>\n<tr>\n<td>第9条<\/td>\n<td>準拠法・管轄<\/td>\n<td>日本法。●●地方裁判所を第一審の専属的合意管轄裁判所（調停を含む）<\/td>\n<\/tr>\n<tr>\n<td>第10条<\/td>\n<td>誠実協議<\/td>\n<td>信義誠実の原則に従い協議<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.2-7）<\/p>\n<h3 id=\"n4-9\">秘密保持（第4条）の細目<\/h3>\n<ul>\n<li>秘密情報から除外（(i)のうち）：①開示時点で公知 ②開示時点で既に正当に保有 ③開示後に受領者の責によらず公知 ④正当な権限を有する第三者から秘密保持義務なく入手 ⑤秘密情報を利用せず独自開発。<\/li>\n<li>例外開示：①自己（甲は対象会社を含む）の役員・従業員に合理的に必要な範囲 ②弁護士・公認会計士・税理士・司法書士・FA等の秘密保持義務を負うアドバイザー ③裁判所・政府・規制当局等の公的機関（事業承継・引継ぎ支援センターを含む） ④<span class=\"star\" aria-label=\"頻出\">★<\/span>甲の<strong>個人保証<\/strong>の扱いを提供先の金融機関等に相談する目的（<strong>成立前の相談を含む<\/strong>）。<\/li>\n<\/ul>\n<p>（参考資料7 p.3-4）<\/p>\n<h3 id=\"n4-10\">報酬（第6条）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>種類<\/th>\n<th>発生時期・条件<\/th>\n<th>返還<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>着手金<\/td>\n<td>(i)当事者面談で検討を進めることを確認、又は(ii)候補先とNDAを締結 → その後●日以内<\/td>\n<td>成就しなくても<strong>返還されない<\/strong>（第7条3項の清算を除く）<\/td>\n<\/tr>\n<tr>\n<td>中間金<\/td>\n<td>候補先との「基本的な合意」後●日以内<\/td>\n<td>同上<\/td>\n<\/tr>\n<tr>\n<td>成功報酬<\/td>\n<td>本件取引の実行後●日以内。階層ごとの額を<strong>合算<\/strong>。最低報酬未満なら最低報酬<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>既払の着手金・中間金は差し引く<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>「基本的な合意」＝名称を問わない基本合意の締結や、意向表明書の差入れを含む、<strong>DD前<\/strong>になされる合意。<\/li>\n<\/ul>\n<p>（参考資料7 p.4-5）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>譲渡価額の階層（レーマン方式の例）<\/th>\n<th>乗じる割合<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5億円以下の部分<\/td>\n<td>5％<\/td>\n<\/tr>\n<tr>\n<td>5億円超10億円以下の部分<\/td>\n<td>4％<\/td>\n<\/tr>\n<tr>\n<td>10億円超50億円以下の部分<\/td>\n<td>3％<\/td>\n<\/tr>\n<tr>\n<td>50億円超100億円以下の部分<\/td>\n<td>2％<\/td>\n<\/tr>\n<tr>\n<td>100億円超の部分<\/td>\n<td>1％<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.5）<\/p>\n<ul>\n<li>注：どの報酬体系を採るかは<strong>各仲介者の個別判断<\/strong>。着手金＋成功報酬、成功報酬のみ、最低報酬の設定、定額制など様々。表の価額・割合もあくまで一例。（参考資料7 p.5-6）<\/li>\n<\/ul>\n<h3 id=\"n4-11\">テール条項（第6条2項）<\/h3>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>取引不成立のまま契約終了後、<strong>終了後2年以内<\/strong>に、乙が関与・接触し紹介した候補先との取引が実行されたら、甲は成功報酬を支払う。<\/li>\n<li>注：仲介者の紹介案件が一旦不成立となり、後に仲介者の介在なしに復活・成立した場合、一定期間内は報酬が発生する趣旨。<\/li>\n<li>GL上はテール期間<strong>最長でも2年〜3年以内を目安<\/strong>（→ 重要事項説明書サンプル(10)参照）。<\/li>\n<\/ul>\n<p>（参考資料7 p.6）<\/p>\n<h3 id=\"n4-12\">利益相反行為の禁止（第8条4項・5類型）<\/h3>\n<p>乙は次の行為を<strong>行わない<\/strong>。<\/p>\n<ol>\n<li>候補先から追加で手数料を取得し、候補先に便宜を図る行為（甲のニーズに反するマッチングの優先実施、不当に低額（※）な譲渡価額への誘導等）<\/li>\n<li>リピーターとなる候補先を優遇し、便宜を図る行為（同上）<\/li>\n<li>甲の希望額より高額（※）で成立した場合、正規手数料とは別に差分の一定割合を報酬として要求する行為<\/li>\n<li>伝達を求められた事項を相手方に伝達しない行為、告げていない事項を偽って伝達する行為<\/li>\n<li>甲にとってのみ有利又は不利な情報を認識したのに、甲に伝達せず秘匿する行為<\/li>\n<\/ol>\n<p>（参考資料7 p.6-7）<\/p>\n<h3 id=\"n4-13\">各条の「注」の要旨（全部）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>対象<\/th>\n<th>注の要旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第2条（専任）<\/td>\n<td>実務上多いが、2項の相談先の範囲はセカンド・オピニオンを想定し、当事者間で<strong>認識を共有する必要がある<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第3条（直接交渉の制限）<\/td>\n<td>目的・候補先の範囲を限定しないと、通常の事業活動の交渉や依頼者自身の候補先発見が妨げられるおそれ。範囲等を共有し、契約書への反映を<strong>確認する必要がある<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第4条（秘密保持）<\/td>\n<td>譲り受け側との契約なら、2項④（個人保証の相談）は<strong>不要<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第4条の2（報酬開示）<\/td>\n<td>仲介者には構造的な利益相反のおそれがあり、GLは一方当事者からの報酬を他方に開示することを<strong>求めている<\/strong>。その同意条項。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>FA契約なら本条は不要<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第6条（報酬）<\/td>\n<td>報酬体系・価額・割合は各仲介者の個別判断。上記は一例<\/td>\n<\/tr>\n<tr>\n<td>第6条2項（テール）<\/td>\n<td>不成立後に仲介者抜きで復活・成立した取引も、一定期間内は報酬が発生<\/td>\n<\/tr>\n<tr>\n<td>第8条（責任）<\/td>\n<td>譲り渡し側との仲介契約が前提。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>FA契約なら4項は不要<\/strong>。譲り受け側との仲介契約なら（※）部分の<strong>高低を逆<\/strong>にする<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.2-7）<\/p>\n<h3 id=\"n4-14\">サンプル問題③（免責条項）<\/h3>\n<p>問：アドバイザリー契約の免責事項に関する記述として、正しいものはどれか。（資料2 p.15）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>選択肢<\/th>\n<th>内容<\/th>\n<th>正誤<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>①<\/td>\n<td>免責が明記されていれば検証義務を負わず、重大過失でも免責が優先し、説明責任は基本的に問題とならない<\/td>\n<td>誤<\/td>\n<\/tr>\n<tr>\n<td>②<\/td>\n<td>相手方が専門家でない場合は常に無効で、アドバイザーは全面的な保証を負う<\/td>\n<td>誤<\/td>\n<\/tr>\n<tr>\n<td>③<\/td>\n<td>免責条項があっても、当然負うべき正確かつ適切な情報提供（必要な検証を含む）義務が直ちに消えるわけではない。義務の範囲は文言・事案の性質・関与状況等で判断される<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>正<\/strong><\/td>\n<\/tr>\n<tr>\n<td>④<\/td>\n<td>有効性は個別判断。ただし免責条項がある限り善管注意義務は課されない<\/td>\n<td>誤<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.15）<\/p>\n<ul>\n<li>資料に解説文はない（正答表示のみ）。（資料2 p.15）<\/li>\n<li>関連：重要事項説明書(13)は、責任修正条項を<strong>説明することと法的効力の有無は別問題<\/strong>としている。（参考資料11 p.10）<\/li>\n<li>関連：仲介契約書第8条2項は、乙が<strong>善良な管理者の注意義務<\/strong>を負うと定める。（参考資料7 p.6）<\/li>\n<\/ul>\n<h2 id=\"n4-15\">秘密保持契約書・基本合意書サンプル<\/h2>\n<p>NDAサンプルは譲り渡し側と譲り受け側が直接結ぶ契約で、有効期間2年（自動延長1年ずつ）、義務は満了後3年間存続する。基本合意書は第1〜3条（目的・承継対象財産・譲渡価額）だけ法的拘束力がないと定める（第8条）。独占的交渉権など他の条項は、拘束力の排除対象に含まれていない。<\/p>\n<h3 id=\"n4-16\">秘密保持契約書（参考資料7(2)）<\/h3>\n<p>前提：譲り渡し側（甲）と譲り受け側（乙）が直接締結する。（参考資料7 p.1, p.9）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条<\/th>\n<th>見出し<\/th>\n<th>要旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第1条<\/td>\n<td>秘密保持義務<\/td>\n<td>1項：仲介契約第4条1項と同構造（(i)開示情報 (ii)締結の事実・存在・内容 (iii)交渉の経緯・内容。除外5類型：公知／既保有／受領者の責によらず公知／第三者から正当入手／独自開発）。2項：例外開示（下記）。3項：返還請求があれば写しを含め速やかに返還。4項：<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>有効期間満了後3年間<\/strong>存続<\/td>\n<\/tr>\n<tr>\n<td>第2条<\/td>\n<td>損害賠償<\/td>\n<td>義務違反の損害を、<strong>合理的な範囲の弁護士費用を含めて<\/strong>賠償<\/td>\n<\/tr>\n<tr>\n<td>第3条<\/td>\n<td>有効期間<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>締結日より2年間<\/strong>。解約の申出がなければ<strong>更に1年間<\/strong>延長し、以後も同様<\/td>\n<\/tr>\n<tr>\n<td>第4条<\/td>\n<td>準拠法及び管轄裁判所<\/td>\n<td>日本法。●●地方裁判所を第一審の専属的合意管轄（調停を含む）<\/td>\n<\/tr>\n<tr>\n<td>第5条<\/td>\n<td>誠実協議<\/td>\n<td>信義誠実の原則に従い協議<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.9-10）<\/p>\n<h4>第1条2項の例外開示（3類型）<\/h4>\n<ol>\n<li>役員・従業員、弁護士・公認会計士・税理士・司法書士・FA等に合理的に必要な範囲で開示。ただし<strong>同様の秘密保持義務を法令又は契約で負う者に限る<\/strong>。その違反は<strong>開示した当事者が自ら責任を負う<\/strong>。<\/li>\n<li>法令等に基づき裁判所・政府・公的機関（事業承継・引継ぎ支援センターを含む）から要請された場合。相手方に<strong>事前に<\/strong>（困難なら開示後可能な限り速やかに）通知。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>甲の経営者等が負う<strong>個人保証<\/strong>について、金融機関等に扱いを相談する目的（成立前の相談を含む）。<\/li>\n<\/ol>\n<p>（参考資料7 p.9-10）<\/p>\n<h4>仲介契約の秘密保持条項との違い<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>観点<\/th>\n<th>仲介契約第4条<\/th>\n<th>NDA第1条<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>返還<\/td>\n<td><strong>成約に至らなかった場合<\/strong>に請求で返還<\/td>\n<td>限定なし（請求があれば返還）<\/td>\n<\/tr>\n<tr>\n<td>アドバイザーへの開示<\/td>\n<td>秘密保持義務を負うアドバイザー<\/td>\n<td>同等の義務を負う者に限る＋違反は開示者の責任<\/td>\n<\/tr>\n<tr>\n<td>公的機関への開示<\/td>\n<td>単に例外<\/td>\n<td>事前通知が必要<\/td>\n<\/tr>\n<tr>\n<td>有効期間<\/td>\n<td>1年（自動延長1年）<\/td>\n<td>2年（自動延長1年ずつ）<\/td>\n<\/tr>\n<tr>\n<td>満了後の存続<\/td>\n<td>3年間<\/td>\n<td>3年間<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.3-4, p.9-10）<\/p>\n<h3 id=\"n4-17\">基本合意書（参考資料7(3)）<\/h3>\n<ul>\n<li>前提：乙が対象会社の<strong>発行済株式の全部<\/strong>を甲（株主1名）から譲り受ける株式譲渡。<\/li>\n<li>冒頭注：あくまで例で、当事者の意向を制約しない。具体的内容は当事者間で調整し、必要に応じ弁護士等に相談することが<strong>望ましい<\/strong>。<\/li>\n<\/ul>\n<p>（参考資料7 p.12）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条<\/th>\n<th>見出し<\/th>\n<th>要旨<\/th>\n<th>法的拘束力<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第1条<\/td>\n<td>目的<\/td>\n<td>乙は期限（●年●月●日）までに全株式を譲り受ける意向。改めて株式譲渡契約（最終契約）を締結<\/td>\n<td><strong>なし<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第2条<\/td>\n<td>承継対象財産及び個人保証解除<\/td>\n<td>1項：普通株式●株。2項：<span class=\"star\" aria-label=\"頻出\">★<\/span>対象会社の債務を役職員が保証している契約につき、乙は解除に<strong>最大限努力<\/strong>する<\/td>\n<td><strong>なし<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第3条<\/td>\n<td>譲渡価額<\/td>\n<td>金●円を<strong>目途<\/strong>とし、正式な価額は<strong>最終契約締結時<\/strong>に協議で合意<\/td>\n<td><strong>なし<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第4条<\/td>\n<td>デュー・ディリジェンス<\/td>\n<td>締結日から<strong>1か月間を目処<\/strong>に、B/S等の正確性・妥当性を検証するDDを実施でき、甲は協力<\/td>\n<td>あり<\/td>\n<\/tr>\n<tr>\n<td>第5条<\/td>\n<td>独占的交渉権<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>甲は<strong>本合意の有効期間中<\/strong>、他のいかなる者ともM&amp;A取引（株式譲渡・事業譲渡・増資引受け・合併・株式交換・会社分割・資本業務提携等）の交渉を<strong>行ってはならない<\/strong><\/td>\n<td>あり<\/td>\n<\/tr>\n<tr>\n<td>第6条<\/td>\n<td>善良な管理者の注意義務<\/td>\n<td>最終契約まで善管注意で業務執行。<strong>乙の事前の同意なく<\/strong>7類型（下記）を<strong>してはならない<\/strong><\/td>\n<td>あり<\/td>\n<\/tr>\n<tr>\n<td>第7条<\/td>\n<td>秘密保持義務<\/td>\n<td>NDAと同構造。ただし返還は<strong>成約に至らなかった場合<\/strong>。第9条の有効期間満了後<strong>3年間<\/strong>存続<\/td>\n<td>あり<\/td>\n<\/tr>\n<tr>\n<td>第8条<\/td>\n<td>法的拘束力<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>第1条ないし第3条<\/strong>は了解事項の確認が目的で、<strong>何らの法的拘束力を有しない<\/strong><\/td>\n<td>―<\/td>\n<\/tr>\n<tr>\n<td>第9条<\/td>\n<td>有効期間<\/td>\n<td>締結日から発効。解除・最終契約の履行完了の場合を除き●年●月●日まで存続<\/td>\n<td>あり<\/td>\n<\/tr>\n<tr>\n<td>第10条<\/td>\n<td>準拠法・合意管轄<\/td>\n<td>日本法、●●地方裁判所<\/td>\n<td>あり<\/td>\n<\/tr>\n<tr>\n<td>第11条<\/td>\n<td>誠実協議<\/td>\n<td>信義誠実の原則に従い協議<\/td>\n<td>あり<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.12-15）<\/p>\n<ul>\n<li>「法的拘束力」列の「あり」は、第8条が拘束力を排除するのが第1〜3条のみであることの裏返し。（参考資料7 p.14）<\/li>\n<\/ul>\n<h4>第6条：乙の事前同意が必要な行為（7類型）<\/h4>\n<ol>\n<li>重大な資産の譲渡・処分・賃借権設定等<\/li>\n<li>新たな借入れその他の債務負担行為、保証・担保設定<\/li>\n<li>非経常的な設備投資及び仕入行為<\/li>\n<li>非経常的な契約の締結及び解約・解除<\/li>\n<li>非経常的な従業員の新規採用<\/li>\n<li>増資・減資<\/li>\n<li>前各号の他、日常業務に属さない事項<\/li>\n<\/ol>\n<p>（参考資料7 p.13）<\/p>\n<h4>基本合意書の要点<\/h4>\n<ul>\n<li>譲渡価額は「目途」であり、正式決定は最終契約締結時。<\/li>\n<li>個人保証解除の努力義務（第2条2項）も、第8条により法的拘束力はない。最終契約での義務化が必要（→ 経営者保証の節参照）。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>独占的交渉権（第5条）・善管注意義務（第6条）・秘密保持（第7条）は、第8条の拘束力排除の対象外（第8条が排除するのは第1〜3条のみ）。<\/li>\n<\/ul>\n<p>（参考資料7 p.12-14）<\/p>\n<h2 id=\"n4-18\">株式譲渡契約書・事業譲渡契約書サンプル<\/h2>\n<p>株式譲渡契約書は第1〜27条（第15条の2・第17条の2を含む）と8章構成で、経営者保証の解除を譲り受け側の義務とし、未解除時の解除・買戻し（クロージング日から1年以内）を定めるのが最大の特徴である。事業譲渡契約書は第1〜22条で、承継対象財産の特定と免責的債務引受けには債権者の承諾が必要な点が要である。<\/p>\n<h3 id=\"n4-19\">株式譲渡契約書（参考資料7(4)）<\/h3>\n<ul>\n<li>前提：譲り渡し側株主（甲・1名）が、対象会社の発行済株式全て（普通株式●株）を乙に譲渡。<\/li>\n<li>冒頭注：例であり当事者の意向を制約しない。必要に応じ弁護士等に相談。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>簡易な株式譲渡契約書として設ける条項の例：第1条（目的）、第2条（譲渡）、第3条（譲渡価格）、第4条（実行）、第13条（甲の義務）、第14条（乙の義務）、第15条（解除）、第15条の2（解除の特則・買戻し）、第18条（秘密保持）、第27条（誠実協議）。<\/li>\n<\/ul>\n<p>（参考資料7 p.16）<\/p>\n<h4>第1章 本株式の譲渡（第1〜4条）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条<\/th>\n<th>見出し<\/th>\n<th>要旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第1条<\/td>\n<td>目的<\/td>\n<td>株式譲渡により<strong>対象会社の経営権を乙に移転<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第2条<\/td>\n<td>本株式の譲渡<\/td>\n<td>●年●月●日又は書面合意日（<strong>クロージング日<\/strong>）に譲渡<\/td>\n<\/tr>\n<tr>\n<td>第3条<\/td>\n<td>譲渡価格<\/td>\n<td>金●円（1株あたり金●円）<\/td>\n<\/tr>\n<tr>\n<td>第4条<\/td>\n<td>本株式譲渡の実行<\/td>\n<td>1項：支払と<strong>引換えに<\/strong>書類交付（①甲の印鑑証明書 ②株券 ③譲渡承認の取締役会議事録の原本証明付写し ④全取締役・全監査役の辞任届 ⑤株主名簿（前日時点）の原本証明付写し）。2項：乙は引換えに支払。3項：銀行振込、<strong>振込手数料は乙負担<\/strong>。4項：<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>効力は株券の交付時に生じる<\/strong>。5項：クロージング後直ちに株主名簿の名義書換<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.16-17）<\/p>\n<p>第4条の注：<\/p>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>多くの中小企業は全株式が譲渡制限株式（非公開会社）。譲渡には会社の承認が必要。原則、取締役会設置会社は取締役会決議、非設置会社は株主総会決議（定款で別段の定めも可）。<\/li>\n<li>本サンプルは株券発行会社が前提。株券発行会社では原則株券の交付が必要。<\/li>\n<li>株券発行会社か否かにかかわらず、譲渡後には名義書換が必要。<\/li>\n<\/ul>\n<p>（参考資料7 p.17）<\/p>\n<h4>第2章 前提条件（第5・6条）と第3章 表明及び保証（第7・8条）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条<\/th>\n<th>見出し<\/th>\n<th>要旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第5条<\/td>\n<td>乙のクロージングの前提条件<\/td>\n<td>①甲の表明保証がクロージング日に真実かつ正確（<strong>軽微な点の誤りは除く<\/strong>）②甲の義務（第9条）が全て履行。不充足なら履行拒絶可。任意に放棄可だが、<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>放棄しても充足とみなされず、甲の表明保証違反責任は減免されない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第6条<\/td>\n<td>甲のクロージングの前提条件<\/td>\n<td>対称構造（乙の表明保証・第10条の義務履行）。放棄しても乙の責任は減免されない<\/td>\n<\/tr>\n<tr>\n<td>第7条<\/td>\n<td>甲の表明及び保証<\/td>\n<td><strong>契約締結日及びクロージング日<\/strong>において別紙1の事項が真実かつ正確<\/td>\n<\/tr>\n<tr>\n<td>第8条<\/td>\n<td>乙の表明及び保証<\/td>\n<td>同じく別紙2の事項<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.18-19）<\/p>\n<h4>第4章 クロージング前の取扱い（第9・10条）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条<\/th>\n<th>見出し<\/th>\n<th>要旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第9条<\/td>\n<td>甲の義務<\/td>\n<td>①取締役会に譲渡承認決議をさせる ②対象会社を<strong>通常の事業活動の範囲内<\/strong>で運営させ、範囲外は乙の事前同意 ③表明保証違反行為をせず、違反の事実・おそれは<strong>直ちに<\/strong>通知<\/td>\n<\/tr>\n<tr>\n<td>第10条<\/td>\n<td>乙の義務<\/td>\n<td>①<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>経営者保証等<\/strong>（株主・役職員が対象会社の債務を保証。物上保証を含む）につき、金融機関等と交渉し、解除又は新規差入れの<strong>意向表明を得て結果を甲に通知<\/strong> ②手続を進められる場合は必要書面を差し入れる ③クロージング後直ちに変更登記できるよう、役員変更登記の必要書類を作成し提出 ④表明保証違反行為をせず、直ちに通知<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.19-20）<\/p>\n<ul>\n<li>第10条の注：①〜③は、クロージング時に対象債務を乙の資力で返済し、別途乙が借り換える場合は不要。その場合は<span class=\"star\" aria-label=\"頻出\">★<\/span>乙に<strong>クロージングと同時に借入金の返済を行う義務を課すことが望ましい<\/strong>。（参考資料7 p.20）<\/li>\n<\/ul>\n<h4>第5章 クロージング後の取扱い（第11〜14条）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条<\/th>\n<th>見出し<\/th>\n<th>要旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第11条<\/td>\n<td>役員退職慰労金の支払<\/td>\n<td>乙は対象会社をして、辞任する甲に退職慰労金を承認決議・支払させる。振込手数料は<strong>対象会社負担<\/strong>。<strong>源泉徴収<\/strong>を行わせる<\/td>\n<\/tr>\n<tr>\n<td>第12条<\/td>\n<td>対象会社の役員<\/td>\n<td>甲は辞任届を提出し辞任。他の全取締役・全監査役も辞任させる。乙がクロージング後直ちに対象会社の株主総会を開催して定款変更・役員選任できるよう協力<\/td>\n<\/tr>\n<tr>\n<td>第13条<\/td>\n<td>甲の義務<\/td>\n<td>1項：引継ぎ（決算・税務申告を含む）に協力。2項：<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>競業避止<\/strong>（締結後●年間、書面承諾なく競業しない）。3項：<strong>従業員の勧誘禁止<\/strong>（●年間）。4項：第三者からの請求対応への協力。5項：株式に権利主張する第三者は甲の費用と責任で消滅。6項：税務調査への相互協力<\/td>\n<\/tr>\n<tr>\n<td>第14条<\/td>\n<td>乙の義務<\/td>\n<td>1項：原則として従業員を<strong>全員継続雇用<\/strong>。2項：税務調査への協力。3項：<span class=\"star\" aria-label=\"頻出\">★<\/span>クロージング後すみやかに経営者保証等の<strong>解除を合意させなければならない<\/strong>。合意書類の交付に最大限努力。保証債務履行等で甲に生じた損害は<strong>乙が補償<\/strong>。4項：3項の履行まで本株式を<strong>譲渡・担保提供等してはならない<\/strong>。5項：違反して処分しても3項の義務を免れない<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.20-21）<\/p>\n<h4>第6章 解除（第15条・第15条の2）<\/h4>\n<ul>\n<li>第15条1項：表明保証・義務違反があり、<strong>相当期間を定めて催告<\/strong>しても是正されないときは、<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>クロージング前に限り<\/strong>解除可。<\/li>\n<li>第15条2項：反社会的勢力の表明保証（別紙1（1）⑤・（2）⑦、別紙2⑤）違反は、<strong>書面通知<\/strong>で（<strong>催告不要<\/strong>）解除可。<\/li>\n<li>第15条3項：解除後も第7章（補償）の請求は妨げられない。<\/li>\n<\/ul>\n<p>（参考資料7 p.22）<\/p>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>第15条の2（解除に係る特則及び買戻し条項）：甲は次の事由があれば、<strong>クロージング日から1年を経過するまで<\/strong>、書面通知で直ちに「解除」又は「買戻し」ができる。買戻し価額は通知到達時の「相当な価額」。<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>事由<\/th>\n<th>期限<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>①<\/td>\n<td>クロージング日から<strong>3か月<\/strong><\/td>\n<td>経営者保証等が解除されない<\/td>\n<\/tr>\n<tr>\n<td>②<\/td>\n<td>クロージング日から<strong>14日以内<\/strong><\/td>\n<td>乙が金融機関等に具体的な相談を始めない（<strong>単なる挨拶・日程調整は含まない<\/strong>）<\/td>\n<\/tr>\n<tr>\n<td>③<\/td>\n<td>金融機関等の見解から<strong>1か月以内<\/strong><\/td>\n<td>解除不可・条件付きとされたのに、乙が借り換え・一括弁済・条件充足等の自己負担による解除をしない<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>2項：乙は通知受領後直ちに株券を交付。3項：通知到達で株券交付があったものとみなす。<\/li>\n<li>4項：乙はクロージング日から<strong>6か月<\/strong>経過し、かつ事由に該当する場合、解除・買戻しするか<strong>書面で催告<\/strong>できる。<\/li>\n<li>5項：催告後<strong>1か月<\/strong>経過しても甲が行使しなければ、解除・買戻しはできなくなる。<\/li>\n<\/ul>\n<p>（参考資料7 p.22）<\/p>\n<p>第15条の2の注：<\/p>\n<ul>\n<li>①経営者保証等が解除されない場合の<strong>甲の救済手段<\/strong>。企業価値が毀損した場合は買戻し株価に織り込むことが考えられる。<\/li>\n<li>「相当な価額」は抽象的なので、紛争化しないよう<strong>確定額や計算方法を具体的に定める<\/strong>ことも考えられる。<\/li>\n<li>クロージング後は乙が経営権・預金口座・印鑑を保有し、実際の対応は<strong>困難を極める<\/strong>。甲は早期に弁護士等に相談し、経営権の取り戻し等を検討する<strong>必要がある<\/strong>。<\/li>\n<li>本条項の発動は<strong>例外的事態<\/strong>で交渉も難航が予想される。<span class=\"star\" aria-label=\"頻出\">★<\/span>あくまで<strong>クロージング前の早期段階から金融機関等への相談を開始する等の対応が求められる<\/strong>。<\/li>\n<li>②第3号の「1か月以内」は甲乙間の合意で金融機関を拘束しない。審査が期限に間に合わないこともあり得る。<\/li>\n<\/ul>\n<p>（参考資料7 p.22-23）<\/p>\n<h4>第7章 補償等（第16条・第17条・第17条の2）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条<\/th>\n<th>見出し<\/th>\n<th>要旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第16条<\/td>\n<td>甲による補償<\/td>\n<td>1項：甲の表明保証違反・義務違反による乙の損害等（<strong>合理的な弁護士費用を含む<\/strong>）を補償。2項：<span class=\"star\" aria-label=\"頻出\">★<\/span>表明保証違反の補償総額は<strong>本譲渡価額の●％を超えない<\/strong>（上限）。3項：<strong>一つの事由<\/strong>による損害が●円を超過するものの合計が●円を超過した場合にのみ補償（二段の閾値）。4項：<strong>クロージング日から●か月<\/strong>以内に書面請求した場合に限る（請求期間の限定）。5項：<strong>拡大防止措置を執らなかったことによる拡大損害<\/strong>は免責。6項：<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>商法第526条は適用しない<\/strong>（買主の検査・通知義務の排除）<\/td>\n<\/tr>\n<tr>\n<td>第17条<\/td>\n<td>乙による補償<\/td>\n<td>第16条1〜5項と対称（上限●％、閾値、●か月以内の請求、拡大損害の免責）。<strong>商法526条排除に相当する規定はない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第17条の2<\/td>\n<td>回復請求<\/td>\n<td>1項：第15条の2の<strong>買戻し<\/strong>が行われ、クロージング日から買戻し日までに対象会社の<strong>純資産の減少<\/strong>（債務超過額の増加を含む）等の損害があれば、甲は乙に<strong>回復を請求<\/strong>できる。2項：この債権を買戻し代金債務と<strong>相殺<\/strong>できる<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.24-26）<\/p>\n<p>第16条・第17条の2の注：<\/p>\n<ul>\n<li>補償上限：個別事例で変動しうるが、上限を高く設定するなら相応の理由が求められる。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>100％に近い上限はその妥当性を慎重に吟味する必要がある<\/strong>。<\/li>\n<li>請求期間：クロージング日から数えて<strong>1〜n回目の決算日＋1か月程度<\/strong>を目安にする考え方がある。<\/li>\n<li>第17条の2：本来、クロージング後の対象会社の損害は乙の役員等の任務懈怠責任等で整理される。本条は、<strong>債務超過企業等で譲渡価額が備忘価格程度<\/strong>のM&amp;Aで、買手が現預金等を不当流出させた場合を想定し、甲から乙への<strong>直接請求<\/strong>を特別に認める趣旨。<\/li>\n<li>損害額の認定例：①クロージング日と買戻し日の純資産価額の比較 ②クロージング日のB/Sがなければ直前の直近B/Sで代用 ③より簡便に現預金の減少を基準とする。<\/li>\n<li>第15条の2で<strong>解除<\/strong>した場合は、甲乙が<strong>民法上の原状回復義務<\/strong>を負い、これで精算する。<\/li>\n<\/ul>\n<p>（参考資料7 p.24-27）<\/p>\n<h4>アンチ・サンドバッギングとプロ・サンドバッギング（第16条の注）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条項<\/th>\n<th>内容<\/th>\n<th>条項例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>アンチ・サンドバッギング<\/td>\n<td>DD結果等を踏まえた<strong>乙の主観に応じて甲の免責を認める<\/strong><\/td>\n<td>(1)乙が締結時点で<strong>認識し又は認識し得た事実<\/strong> (2)乙がDDで提供を受けた情報に含まれる事実、は表明保証違反とならない<\/td>\n<\/tr>\n<tr>\n<td>プロ・サンドバッギング<\/td>\n<td><strong>乙の認識にかかわらず甲の免責を認めない<\/strong><\/td>\n<td>乙が違反を知り又は知り得た場合でも、表明保証の効果や甲の責任に影響しない<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.24-25）<\/p>\n<ul>\n<li>本契約書では規定していない（注で紹介）。<\/li>\n<li>乙はプロ・サンドバッギング条項を希望することが多い。甲がDDで積極開示し乙がリスクを認識していても、<strong>甲は責任を免れない<\/strong>。意味を理解していないと紛争化しやすい。<\/li>\n<li>例：許認可未取得で事業停止、未払残業代の請求。DD資料やマネジメントインタビューで乙が認識していても甲は免責されない。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>甲は意味内容を吟味し、<strong>削除や修文を求めることを検討する必要がある<\/strong>。乙が特に認識したリスクは<strong>特別補償<\/strong>として別途規定することもあり得る。<\/li>\n<li>一方、中小M&amp;AではDD期間が限られ、口頭では伝わったか不明確なこともあるため、<strong>プロ・サンドバッギング条項そのものに合理性がないわけではない<\/strong>。<\/li>\n<\/ul>\n<p>（参考資料7 p.25）<\/p>\n<h4>第8章 一般条項（第18〜27条）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条<\/th>\n<th>見出し<\/th>\n<th>要旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第18条<\/td>\n<td>秘密保持義務<\/td>\n<td>締結日から●年間。除外5類型は他契約と同じ。例外開示：①役員・従業員・アドバイザー（同等の義務を負う者に限る）②公的機関（事前通知）③<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>中小M&amp;Aガイドラインが求める「情報共有の仕組み」の登録事由に該当する事実が生じ、運営主体に開示する場合<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第19条<\/td>\n<td>第三者への公表日<\/td>\n<td>公表日（●年●月●日）・方法は協議。公表日まで秘密保持に努める<\/td>\n<\/tr>\n<tr>\n<td>第20条<\/td>\n<td>公租公課及び費用<\/td>\n<td>原則として公租公課・<strong>アドバイザーへの費用・報酬<\/strong>等は<strong>各自負担<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第21条<\/td>\n<td>通知等<\/td>\n<td>当事者欄の住所宛。延着・未着でも<strong>通常到達すべき日に到達したものとみなす<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第22条<\/td>\n<td>残存効<\/td>\n<td>終了後も<strong>第7章<\/strong>（補償）及び<strong>第8章<\/strong>（第19条を除く）は効力を有する<\/td>\n<\/tr>\n<tr>\n<td>第23条<\/td>\n<td>完全合意<\/td>\n<td>本契約が完全な合意で、それ以前の取決め（<strong>秘密保持に関する契約を含む<\/strong>）は全て失効<\/td>\n<\/tr>\n<tr>\n<td>第24条<\/td>\n<td>地位・権利義務の譲渡等<\/td>\n<td>相手方の書面による事前承諾なく処分しない<\/td>\n<\/tr>\n<tr>\n<td>第25条<\/td>\n<td>条項の可分性<\/td>\n<td>一部が無効等でも他の条項は影響を受けない<\/td>\n<\/tr>\n<tr>\n<td>第26条<\/td>\n<td>準拠法・管轄<\/td>\n<td>日本法、●●地方裁判所を第一審の専属的合意管轄<\/td>\n<\/tr>\n<tr>\n<td>第27条<\/td>\n<td>誠実協議<\/td>\n<td>信義誠実の原則に従い協議<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.27-29）<\/p>\n<h4>別紙1 甲が表明及び保証する事項<\/h4>\n<p>冒頭注：どの項目が必要か、どの程度の表明保証を行うかは個別事案で異なる。<span class=\"star\" aria-label=\"頻出\">★<\/span>雛形やレビューの応酬の中で、<strong>甲が知らず知らずのうちに過剰な範囲で表明保証を行い、事後に紛争化する例も見受けられる<\/strong>。甲自身も確認し、必要に応じ弁護士等のレビューを受けることが<strong>望ましい<\/strong>。（参考資料7 p.31）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>区分<\/th>\n<th>項目<\/th>\n<th>要旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>（1）甲に関する事項<\/td>\n<td>①自然人<\/td>\n<td>日本国籍を有し日本国に居住<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>②締結及び履行<\/td>\n<td>必要な権限・権能を有し、法令等の制限を受けない<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>③強制執行可能性<\/td>\n<td>適法・有効・執行可能な義務<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>④法令等との抵触の不存在<\/td>\n<td>法令・判断等に違反せず、重大な訴訟等もない<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>⑤反社会的勢力との関係の不存在<\/td>\n<td>反社でなく一切の関係・交流なし。定義：暴力団、暴力団員、暴力団準構成員、暴力団関係企業、総会屋等、社会運動等標ぼうゴロ、特殊知能暴力集団等、これらに準ずる者<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>⑥倒産手続等の不存在<\/td>\n<td>支払停止・手形不渡・銀行取引停止等なし、破産・民事再生等の申立てなし、私的整理なし<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>⑦対象会社との取引の不存在<\/td>\n<td>役員としての役務・報酬を除き取引なし<\/td>\n<\/tr>\n<tr>\n<td>（2）対象会社に関する事項<\/td>\n<td>①設立及び存続<\/td>\n<td>日本法に基づき適法有効に設立・存続<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>②対象会社の株式<\/td>\n<td>全額払込済の普通株式、負担のない所有、訴訟等なし、新株予約権等の発行なし<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>③子会社・関連会社の不存在<\/td>\n<td>―<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>④倒産手続等の不存在<\/td>\n<td>破産・民事再生・会社更生・特別清算等<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>⑤計算書類等<\/td>\n<td>準拠基準（企業会計基準／中小企業の会計に関する指針／基本要領／法人税法上の処理）に従い、<strong>重要な点において正確<\/strong>。準拠基準は自社に合わせ記載<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>⑥法令遵守<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>【甲の知る限り／知りうる限り】<\/strong>、過去●年間、重要な点で法令遵守、行政処分なし<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>⑦反社会的勢力との関係の不存在<\/td>\n<td>会社・役員は関係なし。<strong>従業員は「甲の知る限り」<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.31-34）<\/p>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>⑥の注：主観による限定もあり得る。「<strong>知る限り<\/strong>」（現に認識）より「<strong>知り得る限り<\/strong>」（認識できたであろう場合を含む）の方が広く、<strong>保証の範囲は広がる<\/strong>。誰の主観を対象にどの程度限定するかは個別事案で異なる。（参考資料7 p.33）<\/li>\n<li>注：表明保証条項は、乙から「事実と異なる点があれば予め教えてほしい」趣旨で提案されることがある。中小企業では<strong>計算書類に誤りが含まれていること<\/strong>等が多く、事実と異なる点は<strong>表明保証の対象から除外する事項を別途明記する必要がある<\/strong>。（参考資料7 p.34）<\/li>\n<\/ul>\n<p>その他、甲が対象会社について表明保証する事項の例（注）：<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>要旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>資産<\/td>\n<td>対抗要件を具備した所有権・賃借権等を保有。他人の債権のための担保権なし。不動産は良好に維持<\/td>\n<\/tr>\n<tr>\n<td>知的財産権<\/td>\n<td>必要な権利を保有又は使用権あり。第三者の権利を侵害せず、侵害もされていない<\/td>\n<\/tr>\n<tr>\n<td>負債<\/td>\n<td>保証契約・経営指導念書・損失補填契約等の当事者でない。通常業務の債務・計算書類記載の負債・退職慰労金債務以外の債務なし<\/td>\n<\/tr>\n<tr>\n<td>重要な契約<\/td>\n<td>有効に存続し、締結・履行が解除事由等を構成せず、理由なき解除規定もない<\/td>\n<\/tr>\n<tr>\n<td>競業避止義務の不存在<\/td>\n<td>取引先との契約で重大な競業避止義務を負わない<\/td>\n<\/tr>\n<tr>\n<td>労働関係<\/td>\n<td>賃金を全て支払い、労働紛争なし、退職金等の提供義務なし<\/td>\n<\/tr>\n<tr>\n<td>税務申告等の適正<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>過去7年間<\/strong>、法人税等の公租公課・社会保険料等を適法適正に申告・納付<\/td>\n<\/tr>\n<tr>\n<td>情報開示<\/td>\n<td>乙に開示した一切の情報（書面・口頭を問わない）は重要な点で真実かつ正確<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.34-36）<\/p>\n<h4>別紙2 乙が表明及び保証する事項<\/h4>\n<p>①設立及び存続 ②締結及び履行（法令・定款・内部規則上の手続を全て履践） ③強制執行可能性 ④法令等との抵触の不存在（<strong>定款その他内部規則<\/strong>を含む） ⑤反社会的勢力との関係の不存在（<strong>従業員は乙の知る限り<\/strong>） ⑥倒産手続等の不存在。（参考資料7 p.37）<\/p>\n<h3 id=\"n4-20\">事業譲渡契約書（参考資料7(5)）<\/h3>\n<ul>\n<li>前提：甲（譲り渡し側）が営む事業のうち●●事業（承継対象事業）を乙（譲り受け側）に譲渡。<\/li>\n<li>冒頭注：あくまで例で当事者の意向を制約せず、専門家への相談が<strong>望ましい<\/strong>。<\/li>\n<\/ul>\n<p>（参考資料7 p.38）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条<\/th>\n<th>見出し<\/th>\n<th>要旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第1条<\/td>\n<td>事業譲渡<\/td>\n<td>甲は承継対象事業を乙に譲渡<\/td>\n<\/tr>\n<tr>\n<td>第2条<\/td>\n<td>クロージング日<\/td>\n<td>●年●月●日。必要があれば協議のうえ変更可<\/td>\n<\/tr>\n<tr>\n<td>第3条<\/td>\n<td>承継対象財産<\/td>\n<td>1項：別紙1の資産を譲渡し、別紙2の契約上の<strong>甲の地位の一切を移転<\/strong>。2項：乙は別紙3の債務を<strong>免責的に引き受け<\/strong>、債権者の承諾取得等に協力。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>承継対象債務以外の債務は承継しない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第4条<\/td>\n<td>取引先の承継<\/td>\n<td>甲は<strong>公表日以降クロージング日の前日まで<\/strong>に取引先に説明し、<strong>承諾を得る<\/strong>。承継できない場合は協議<\/td>\n<\/tr>\n<tr>\n<td>第5条<\/td>\n<td>従業員の取扱い<\/td>\n<td>1項：従業員は乙へ<strong>転籍<\/strong>。2項：クロージング日までの賃金・退職金等の債務は<strong>甲が履行し、乙は承継しない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第6条<\/td>\n<td>譲渡代金<\/td>\n<td>金●円（<strong>消費税・地方消費税は別途<\/strong>）。クロージング日までに振込、<strong>振込手数料は乙負担<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第7条<\/td>\n<td>株主総会決議<\/td>\n<td>甲はクロージング日までに承認の株主総会決議を得る<\/td>\n<\/tr>\n<tr>\n<td>第8条<\/td>\n<td>許認可<\/td>\n<td>協力して取得・登録・届出。<strong>手続費用は乙負担<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第9条<\/td>\n<td>移転手続<\/td>\n<td>1項：引継書を作成し、財産・証憑・帳簿・取引先リストを引渡し。2項：登記・登録・通知等は<strong>クロージング日後30日以内<\/strong>に完了<\/td>\n<\/tr>\n<tr>\n<td>第10条<\/td>\n<td>表明及び保証<\/td>\n<td>甲乙とも<strong>締結日及びクロージング日<\/strong>に別紙4-1・4-2の事項を表明保証（別紙は空欄）<\/td>\n<\/tr>\n<tr>\n<td>第11条<\/td>\n<td>公租公課等の負担<\/td>\n<td>固定資産税・保険料・光熱費等は<strong>日割計算<\/strong>。<strong>クロージング日前日まで甲、クロージング日以降乙<\/strong>。移転の登録免許税等は<strong>乙負担<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第12条<\/td>\n<td>善管注意義務<\/td>\n<td>締結時からクロージング日まで善管注意で管理。重大な影響を及ぼす行為は<strong>予め乙の書面承諾<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第13条<\/td>\n<td>競業避止義務<\/td>\n<td>甲は<strong>クロージング日以後●年間<\/strong>、競合事業を自ら行わず他人にも行わせない<\/td>\n<\/tr>\n<tr>\n<td>第14条<\/td>\n<td>実行の前提条件<\/td>\n<td>相手方の表明保証が<strong>重要な点において<\/strong>真実かつ正確、義務を全ての重要な点で履行。乙側はさらに<strong>甲の株主総会議事録の原本証明付写し<\/strong>の提出。各当事者は裁量で放棄可<\/td>\n<\/tr>\n<tr>\n<td>第15条<\/td>\n<td>条件変更及び解除<\/td>\n<td>下記4事由で<strong>クロージング日までに限り<\/strong>解除可。ただし<strong>事前に協議<\/strong>。解除に代えて協議のうえ契約変更も可<\/td>\n<\/tr>\n<tr>\n<td>第16条<\/td>\n<td>甲による補償<\/td>\n<td>表明保証違反・義務違反の損害を補償。<span class=\"star\" aria-label=\"頻出\">★<\/span>請求は<strong>クロージング日から●年<\/strong>以内の書面請求に限り、<strong>合計損害額●●円が上限<\/strong>。拡大損害の免責。<strong>商法第526条不適用<\/strong><\/td>\n<\/tr>\n<tr>\n<td>第17条<\/td>\n<td>乙による補償<\/td>\n<td>第16条と対称（請求期間●年、上限●●円、拡大損害の免責）<\/td>\n<\/tr>\n<tr>\n<td>第18条<\/td>\n<td>秘密保持義務<\/td>\n<td>締結日から●年間。例外開示は役員・従業員・アドバイザー、公的機関（事前通知）のみ<\/td>\n<\/tr>\n<tr>\n<td>第19条<\/td>\n<td>第三者への公表日<\/td>\n<td>公表日・方法は協議<\/td>\n<\/tr>\n<tr>\n<td>第20条<\/td>\n<td>地位・権利義務の譲渡等<\/td>\n<td>書面による事前承諾なく処分しない<\/td>\n<\/tr>\n<tr>\n<td>第21条<\/td>\n<td>準拠法・管轄<\/td>\n<td>日本法、●●地方裁判所<\/td>\n<\/tr>\n<tr>\n<td>第22条<\/td>\n<td>誠実協議<\/td>\n<td>信義誠実の原則<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.38-44）<\/p>\n<p>第15条の解除事由（4つ）：<\/p>\n<ol>\n<li>天災地変その他により資産状態・経営状態に重大な変動<\/li>\n<li>義務の重大な違反<\/li>\n<li>甲が通常の業務の範囲を超えて事業価値を減少させ、又は実行を困難にするおそれのある行為を新たに行った場合（甲乙合意の場合を除く）<\/li>\n<li>その他実行に重大な支障となる事態（第14条の前提条件不充足を含む）又は困難にする事態<\/li>\n<\/ol>\n<p>（参考資料7 p.41-42）<\/p>\n<h4>事業譲渡契約書の注<\/h4>\n<ul>\n<li>第3条1項：<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>承継対象財産の特定が重要<\/strong>。個別動産まで厳密に特定する必要はないが、B/Sの表示科目に沿って可能な限り具体的に特定することが<strong>望まれる<\/strong>。登記を伴う不動産は地番・面積まで厳密に特定。<\/li>\n<li>第3条2項：<span class=\"star\" aria-label=\"頻出\">★<\/span>債務の承継を<strong>免責的債務引受<\/strong>とするには<strong>債権者の承諾が必要<\/strong>。承諾がなければ原則として<strong>連帯債務<\/strong>（併存的債務引受）となる。<\/li>\n<li>第7条：<span class=\"star\" aria-label=\"頻出\">★<\/span>株式会社が<strong>全事業の事業譲渡<\/strong>を行う場合等は、原則として<strong>出席株主の議決権の3分の2以上<\/strong>による株主総会決議（<strong>特別決議<\/strong>）が必要。<\/li>\n<\/ul>\n<p>（参考資料7 p.38-39）<\/p>\n<h4>別紙<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>別紙<\/th>\n<th>例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>別紙1 承継対象資産<\/td>\n<td>不動産、附属設備、機械装置、工具器具備品、車両運搬具、在庫、電話加入権、ソフトウエア、その他必要な一切の資産。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>ただし現預金・売掛金を除く<\/strong><\/td>\n<\/tr>\n<tr>\n<td>別紙2 承継対象契約<\/td>\n<td>取引基本契約、建物賃貸借契約<\/td>\n<\/tr>\n<tr>\n<td>別紙3 承継対象債務<\/td>\n<td>取引基本契約に基づく保証金返還債務<\/td>\n<\/tr>\n<tr>\n<td>別紙4-1・4-2<\/td>\n<td>表明保証（空欄）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.46-47）<\/p>\n<h3 id=\"n4-21\">株式譲渡契約と事業譲渡契約の比較<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>観点<\/th>\n<th>株式譲渡契約書<\/th>\n<th>事業譲渡契約書<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>前提条件の表現<\/td>\n<td>表明保証が真実かつ正確（<strong>軽微な点における誤りは除く<\/strong>）<\/td>\n<td>表明保証が<strong>重要な点において<\/strong>真実かつ正確<\/td>\n<\/tr>\n<tr>\n<td>解除<\/td>\n<td>催告のうえ<strong>クロージング前に限り<\/strong>。反社違反は書面通知で解除。クロージング後1年は経営者保証未解除で解除・買戻し（第15条の2）<\/td>\n<td><strong>クロージング日までに限り<\/strong>、事前協議のうえ。契約変更で代替も可<\/td>\n<\/tr>\n<tr>\n<td>補償の上限<\/td>\n<td><strong>本譲渡価額の●％<\/strong><\/td>\n<td><strong>合計損害額●●円<\/strong><\/td>\n<\/tr>\n<tr>\n<td>補償の請求期間<\/td>\n<td>クロージング日から●<strong>か月<\/strong><\/td>\n<td>クロージング日から●<strong>年<\/strong><\/td>\n<\/tr>\n<tr>\n<td>商法526条の排除<\/td>\n<td>甲の補償（第16条）のみ<\/td>\n<td>甲の補償（第16条）のみ<\/td>\n<\/tr>\n<tr>\n<td>秘密保持の例外<\/td>\n<td>「情報共有の仕組み」への開示を含む<\/td>\n<td>情報共有の仕組みの例外は<strong>ない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>競業避止の起算<\/td>\n<td><strong>締結後<\/strong>●年間<\/td>\n<td><strong>クロージング日以後<\/strong>●年間<\/td>\n<\/tr>\n<tr>\n<td>従業員<\/td>\n<td>原則<strong>全員継続雇用<\/strong><\/td>\n<td><strong>転籍<\/strong>。クロージング日までの労働債務は甲<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料7 p.18-44）<\/p>\n<h3 id=\"n4-22\"><span class=\"note-tag\">注<\/span>参考資料7の2つの版（007_01と007_02）の差異<\/h3>\n<p>大半は改行・ページ位置の違いで、実質的な文言差は次の5点。007_02は修正履歴が残った校正途中版に見える（どちらが正式版かは資料に記載なし）。<\/p>\n<ol>\n<li>株式譲渡契約書第10条①：007_02は「以下<strong>本条において<\/strong>『経営者保証等』という」。<\/li>\n<li>第12条2項：007_02は「取締役<strong>ないし<\/strong>及び監査役」と誤記。<\/li>\n<li>第15条2項：007_02は「（２）<strong>⑭<\/strong>⑦」と誤字混入。<\/li>\n<li>第16条2項：007_02は事業譲渡契約書風の「●年以内の請求・合計損害額●●円上限」が挿入され不整合。項番号も「３５」「４６」と重複表記。<\/li>\n<li>第17条2項：4と同様の挿入と「３５」表記。<\/li>\n<\/ol>\n<p>試験対策上は007_01（上限＝本譲渡価額の●％、請求期間＝クロージング日から●か月）を基準とする。（参考資料7 p.19-26、007_01／007_02比較）<\/p>\n<h2 id=\"n4-23\">重要事項説明書とリスク説明書のサンプル<\/h2>\n<p>重要事項説明書は、仲介契約・FA契約の締結前に中小M&amp;Aガイドラインに基づき説明する書面で、説明項目は(1)〜(17)の17項目である。リスク事項説明書は最終契約前に説明する書面で、リスクは(1)〜(7)の7項目をチェック式で示す。<\/p>\n<h3 id=\"n4-24\">重要事項説明書（参考資料11）<\/h3>\n<ul>\n<li>冒頭：乙（商号又は名称・代表者・住所・連絡先）が甲に、仲介契約又はFA契約の内容等を<strong>中小M&amp;Aガイドラインに基づき<\/strong>説明する書面。☐仲介契約／☐FA契約を選ぶ。（参考資料11 p.1）<\/li>\n<\/ul>\n<h4>説明項目(1)〜(8)<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>項目<\/th>\n<th>要旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>(1)<\/td>\n<td>仲介契約とFA契約の違い・特徴と、締結する契約<\/td>\n<td>仲介：<strong>双方<\/strong>から依頼を受け、相手方からも手数料を受けるのが通常。一方の利益のみを優先できないが、双方の意向を一元的に把握し成立を目指す。FA：<strong>一方のみ<\/strong>から依頼を受け、相手方から手数料を受けない。<strong>依頼者に有利な条件<\/strong>での成立を目指す。仲介者が最低限講じるべき措置3つ（下記）<\/td>\n<\/tr>\n<tr>\n<td>(2)<\/td>\n<td>業務の範囲・内容<\/td>\n<td>プロセス別の提供業務（下表）。<span class=\"star\" aria-label=\"頻出\">★<\/span>仲介者は<strong>バリュエーション・DD<\/strong>の結論を決定できない。確定的なバリュエーションを<strong>実施すべきでない<\/strong>。DDを自ら実施せず、DD報告書の結論を<strong>決定すべきでない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>(3)<\/td>\n<td>担当者の保有資格、経験年数・成約実績<\/td>\n<td>資格例：公認会計士、税理士、中小企業診断士、弁護士、行政書士、司法書士、社会保険労務士、簿記検定・ビジネス会計検定等。経験年数（〇年〇か月）・成約実績<\/td>\n<\/tr>\n<tr>\n<td>(4)<\/td>\n<td>依頼者が支払う手数料と支払条件・時期・方法<\/td>\n<td>着手金／月額報酬／中間金／成功報酬ごとに有無・金額・算定方法・返還。成功報酬は定額／<strong>レーマン方式<\/strong>／その他。報酬基準額の選択肢（下記）。最低手数料。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>最低手数料の設定や既払手数料の控除を行う場合はその旨の説明が求められる<\/strong><\/td>\n<\/tr>\n<tr>\n<td>(5)<\/td>\n<td>（仲介の場合）相手方の手数料<\/td>\n<td>相手方の手数料は依頼者の利益に影響し得る。仲介者には<strong>中立・公平<\/strong>な支援が求められる。<strong>相手方の手数料が増額する変更<\/strong>を行う場合は<strong>増額の内容を開示<\/strong>する<\/td>\n<\/tr>\n<tr>\n<td>(6)<\/td>\n<td>手数料に含まれない実費等<\/td>\n<td>有無。例：交通費等<\/td>\n<\/tr>\n<tr>\n<td>(7)<\/td>\n<td>秘密保持<\/td>\n<td>有無（枠内に記載）<\/td>\n<\/tr>\n<tr>\n<td>(8)<\/td>\n<td>専任条項<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>①<strong>対象範囲を可能な限り限定すべき<\/strong>。妨げる合理的理由がなければ<strong>セカンド・オピニオン<\/strong>を許容すべき ②契約期間は<strong>最長でも6か月〜1年以内を目安とすべき<\/strong>。任意の中途解約を明記する条項等も<strong>望ましい<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料11 p.2-9）<\/p>\n<h4>説明項目(9)〜(17)<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>項目<\/th>\n<th>要旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>(9)<\/td>\n<td>直接交渉の制限<\/td>\n<td>①対象は、依頼者が明示的に了解した場合を除き、<strong>仲介者・FAが関与・接触し紹介した候補先のみ<\/strong>に限定すべき ②交渉の目的を<strong>M&amp;A取引に関するものに限定<\/strong>すべき ③有効期間は<strong>契約終了まで<\/strong>と限定すべき<\/td>\n<\/tr>\n<tr>\n<td>(10)<\/td>\n<td>テール条項<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>①テール期間は<strong>最長でも2年〜3年以内を目安<\/strong>とすることが望ましい ②対象は<strong>関与・接触し紹介した譲り受け側のみ<\/strong>に限定すべき<\/td>\n<\/tr>\n<tr>\n<td>(11)<\/td>\n<td>契約期間・更新<\/td>\n<td>契約期間は<strong>最長でも6か月〜1年以内を目安として定めるべき<\/strong>【注：原文の注記冒頭は「専任条項を定める場合の留意点として」】<\/td>\n<\/tr>\n<tr>\n<td>(12)<\/td>\n<td>解除（解約を含む）<\/td>\n<td>依頼者が<strong>任意の時点で中途解約できる<\/strong>ことを明記する条項等も設けることが<strong>望ましい<\/strong>【注：同上、原文冒頭は「専任条項を定める場合の留意点」】<\/td>\n<\/tr>\n<tr>\n<td>(13)<\/td>\n<td>責任（免責）<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>損害賠償責任を修正する条項を<strong>説明することと、その法的効力の有無は別の問題<\/strong>。説明したからといって効力が認められる関係にはない<\/td>\n<\/tr>\n<tr>\n<td>(14)<\/td>\n<td>契約終了後も存続する条項と有効期間<\/td>\n<td>直接交渉の制限は契約終了までに限定すべき。テール期間は最長でも2年〜3年以内を目安とすることが望ましい<\/td>\n<\/tr>\n<tr>\n<td>(15)<\/td>\n<td>（仲介の場合）利益相反のおそれがある事項<\/td>\n<td>例文：譲り渡し側は譲渡対価が高いほど、譲り受け側は安いほど望ましく、利益が相反するおそれ。追記欄あり<\/td>\n<\/tr>\n<tr>\n<td>(16)<\/td>\n<td>（譲り渡し側への説明）譲り受け側に対する調査の概要<\/td>\n<td>実施主体・財務状況・コンプライアンス・事業実態・最終契約の実行可能性・その他の6区分（→ 経営者保証の節の表参照）<\/td>\n<\/tr>\n<tr>\n<td>(17)<\/td>\n<td>（譲り渡し側への説明）業界内での情報共有の仕組みへの参加有無<\/td>\n<td>あり（枠内に記載）／なし<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料11 p.9-12）<\/p>\n<h4>(1)の「仲介者が利益相反リスクを最小限とするため最低限講じるべき措置」<\/h4>\n<ol>\n<li>両当事者と仲介契約を締結する仲介者であること（特に双方から手数料を受領する定めがあればその旨）を両当事者に伝える。<\/li>\n<li>バリュエーション・DDなど一方当事者の意向を踏まえた内容となりやすい工程の<strong>結論を決定しない<\/strong>。必要に応じ士業等専門家等の意見を求めるよう伝える。<\/li>\n<li>利益相反のおそれがある事項を予め各当事者に<strong>明示的に説明<\/strong>する。別途認識した事項（一方にのみ有利・不利な情報を含む）は<strong>適時に明示的に開示<\/strong>する。<\/li>\n<\/ol>\n<p>（参考資料11 p.2）<\/p>\n<h4>(4)の報酬基準額の選択肢<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>基準<\/th>\n<th>定義<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>株式価額<\/td>\n<td>株式の価額<\/td>\n<\/tr>\n<tr>\n<td>オーナー受取額<\/td>\n<td>株式価額＋役員借入金<\/td>\n<\/tr>\n<tr>\n<td>企業価値<\/td>\n<td>株式価額＋ネット有利子負債（有利子負債−現預金等）<\/td>\n<\/tr>\n<tr>\n<td>移動総資産<\/td>\n<td>株式価額＋有利子負債＋その他の負債<\/td>\n<\/tr>\n<tr>\n<td>その他<\/td>\n<td>―<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料11 p.5-6）<\/p>\n<ul>\n<li>返還：M&amp;A不成立でも既払の着手金・月額報酬・中間金を返還しない合意がある場合は、その旨を記載する。（参考資料11 p.5）<\/li>\n<li>(5)の典型的問題例：譲り受け側が追加手数料を払う代わりに、仲介者が譲渡額を不当に低額に誘導したり意向に反して優先マッチングする行為。追加手数料は本来<strong>譲り渡し側への譲渡額に含まれる可能性<\/strong>があり、利益相反として<strong>仲介者の禁止行為<\/strong>。（参考資料11 p.7）<\/li>\n<\/ul>\n<h4>プロセス別に提供する主な業務<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>プロセス<\/th>\n<th>主な業務<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>バリュエーション<\/td>\n<td>財務状況の分析、複数アプローチ（時価純資産法、マルチプル法、DCF法等）による評価。仲介者は確定的評価ができない旨も明示が必要<\/td>\n<\/tr>\n<tr>\n<td>マッチング<\/td>\n<td>提案（希望の丁寧な聴取）、候補者の選定・報告（遅滞なく報告）、企業概要書の作成・提供（譲り渡し側の<strong>提案許可の承諾を取得<\/strong>、NDA締結支援）、意向表明書の作成支援<\/td>\n<\/tr>\n<tr>\n<td>基本合意の交渉・締結<\/td>\n<td>論点整理、条件交渉・調整支援、スキーム提案、トップ面談の調整、基本合意書の作成支援<\/td>\n<\/tr>\n<tr>\n<td>DD<\/td>\n<td>開示資料の整理・作成支援、スケジュール調整・管理、各種DDの実施又は支援（<strong>法務DD・税務DDは外部の士業等専門家に委託<\/strong>）。仲介者はDDの評価・判断に影響しない範囲の支援に限る<\/td>\n<\/tr>\n<tr>\n<td>最終契約の交渉・締結<\/td>\n<td>論点整理・条件交渉、<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>譲り渡し側の経営者保証扱いの調整<\/strong>、条件の盛り込み確認（最終的には双方が<strong>弁護士等への確認を依頼することを推奨<\/strong>）、<strong>最終契約締結前のリスク事項の説明<\/strong><\/td>\n<\/tr>\n<tr>\n<td>クロージング<\/td>\n<td>入金確認、株式譲渡手続、登記手続等の実行支援（登記は司法書士等に委託）<\/td>\n<\/tr>\n<tr>\n<td>クロージング後<\/td>\n<td>（必要に応じて）クロージング状況確認の事務的連絡<\/td>\n<\/tr>\n<tr>\n<td>その他（共通）<\/td>\n<td>情報提供・助言・質疑対応、スケジューリング・進捗管理、事務的連絡を含む調整、会議・調印・決済への立会い<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料11 p.3-4）<\/p>\n<h3 id=\"n4-25\">最終契約におけるリスク事項説明書（参考資料12）<\/h3>\n<ul>\n<li>冒頭：最終契約（株式譲渡契約書／事業譲渡契約書）のリスク事項を<strong>中小M&amp;Aガイドラインに基づき<\/strong>説明する書面。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>掲載リスクは<strong>あくまで代表的なもの<\/strong>。M&amp;A支援機関は<strong>善管注意義務の履行の観点<\/strong>から、その他のリスクも必要に応じ説明することが<strong>望まれる<\/strong>。<\/li>\n<\/ul>\n<p>（参考資料12 p.1）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>項目【対象】<\/th>\n<th>概要<\/th>\n<th>チェック項目<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>(1)<\/td>\n<td>経営者保証の扱い【譲り渡し側】<\/td>\n<td>支援機関・譲り受け側と十分調整し慎重に検討。不安があれば弁護士等への相談、金融機関等への<strong>実行前相談<\/strong>も選択肢（ただし事前相談後も確定しない可能性、成立前に情報が提供される点に留意）<\/td>\n<td>①解除・移行が譲り受け側の<strong>義務とされていない、又は努力義務にとどまる<\/strong> ②解除・移行されない場合の条項（<strong>契約解除条項・補償条項<\/strong>等）が<strong>ない<\/strong> ③過去に譲り受け側の不誠実な対応・信用力不足で経営者保証のトラブルになった例がある<\/td>\n<\/tr>\n<tr>\n<td>(2)<\/td>\n<td>DDの非実施【双方】<\/td>\n<td>DDで客観的検討ができ、条件・表明保証の調整でトラブルを防止。不十分だと<strong>表明保証の範囲・補償額・補償期間<\/strong>の負担増。PMIにも有益。<strong>予算制約があっても対象を絞る等の工夫<\/strong>で実施を検討することが望まれる<\/td>\n<td>①DDの<strong>非実施<\/strong>又は<strong>譲り渡し側へのヒアリングのみ<\/strong>で最終契約を締結<\/td>\n<\/tr>\n<tr>\n<td>(3)<\/td>\n<td>表明保証の内容【譲り渡し側】<\/td>\n<td>DD結果を踏まえ、譲渡対価への織り込み等を勘案して認識を擦り合わせる。譲り受け側が認識した問題点の確認を求め妥当性を議論。<strong>定型的に無期限・無制限<\/strong>、適用場面が判然としない条項は慎重に<\/td>\n<td>①表明保証の<strong>期間<\/strong>の設定がない ②<strong>責任上限<\/strong>の設定がない ③<strong>適用場面が判然としない<\/strong>規定がある<\/td>\n<\/tr>\n<tr>\n<td>(4)<\/td>\n<td>クロージング後の支払・手続き【双方】<\/td>\n<td>支払・手続はクロージング時が基本。時期がずれると決済遅滞・解釈相違で紛争リスク<\/td>\n<td>①譲渡対価をクロージング後に<strong>分割払い<\/strong> ②経営者等の<strong>退職金<\/strong>をクロージング後払い ③株式をクロージング後に<strong>段階的に取得<\/strong><\/td>\n<\/tr>\n<tr>\n<td>(5)<\/td>\n<td>最終契約後の状況に応じた支払いの変動【双方】<\/td>\n<td>譲渡額の調整・修正条項は解釈相違で紛争リスク<\/td>\n<td>①<strong>アーンアウト条項<\/strong>（クロージング後一定期間（<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>3年以内が多い<\/strong>）の目標達成で<strong>追加対価<\/strong>） ②<strong>株価調整条項<\/strong>（最終契約〜クロージングの企業価値変動を調整） ③<strong>支払金の返還に関する条項<\/strong>（損失や過年度決算修正で<strong>譲り渡し側から払い戻す<\/strong>）<\/td>\n<\/tr>\n<tr>\n<td>(6)<\/td>\n<td>資産・貸付金の最終契約後整理【双方】<\/td>\n<td>会社と個人の財産が未分離なら整理が必要。<strong>可能な限り最終契約前に整理<\/strong>。残る場合も最終契約に<strong>各資産の移転方法・譲渡額を具体的に明記<\/strong><\/td>\n<td>①資産の整理が最終契約前になされず、移転方法・譲渡額が明記されていない<\/td>\n<\/tr>\n<tr>\n<td>(7)<\/td>\n<td>最終契約からクロージングまでの期間【対象明記なし】<\/td>\n<td>インターバルが<strong>2ヶ月以上<\/strong>等の場合、業績変化等で<strong>契約修正が必要となるリスクや不履行リスク<\/strong><\/td>\n<td>①最終契約からクロージングまでの期間が<strong>2ヶ月以上<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料12 p.2-5）<\/p>\n<ul>\n<li>対応するGL上の区分：(1)〜(3)は<strong>認識の有無に関わらず対応するリスク<\/strong>、(4)〜(7)は<strong>認識した段階で対応するリスク<\/strong>。（GL p.96）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>(1)〜(3)は仲介者・FAが説明<strong>しなければならない<\/strong>。(4)〜(7)は認識した段階で可能な限り具体的に説明することが<strong>望ましい<\/strong>。調整不十分な段階でこれらの条項を<strong>安易に提案すべきでなく<\/strong>、提案する場合は<strong>組織的な判断<\/strong>による。（GL p.96-97）<\/li>\n<\/ul>\n<h2 id=\"n4-26\">経営者保証の取扱い<\/h2>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>M&amp;A成立と同時に経営者保証の解除等（借換えを含む）を行うことが最も優先され、金融機関等への相談は少なくとも最終契約後からクロージング前までには開始されるべきである。譲り渡し側が相談を希望すれば、仲介者・FAも譲り受け側も拒むべきでなく、相談先を秘密保持条項の対象から除外する。<\/p>\n<h3 id=\"n4-27\">背景（参考資料13 はじめに）<\/h3>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>譲り渡し側の経営困難に乗じてM&amp;Aを実施した後、<strong>資金を私的に流出<\/strong>させる一方、<strong>経営者保証の解除等を行わず<\/strong>、負債を残したまま連絡を絶つ手口を繰り返す「不適切な譲り受け側」の存在が報告されている。<\/li>\n<li>こうした譲り受け側は市場から<strong>排除していく必要<\/strong>がある。<\/li>\n<li>中小企業庁は<strong>2024年8月<\/strong>に中小M&amp;Aガイドライン（第3版）を改訂し、M&amp;A専門業者に成立前から金融機関等への相談の説明等を求めた。<\/li>\n<li>金融庁は<strong>2024年8月<\/strong>に「中小・地域金融機関向けの総合的な監督指針」等を改訂し、「経営者保証に関するガイドライン」に沿った対応を求めた。<\/li>\n<li>本資料は譲り渡し側・譲り受け側・M&amp;A専門業者・金融機関・保証機関等へのガイダンス。<\/li>\n<\/ul>\n<p>（参考資料13 p.1）<\/p>\n<h3 id=\"n4-28\">基本原則・共通事項<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>論点<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>対応の優先度<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>M&amp;A成
