）を伝える、②バリュエーション・DDの結論を決定しない、③利益の対立が想定される事項の予めの明示的説明と、対立に係る情報の適時の明示的開示の3項目である。相手方の手数料は契約締結前に書面で説明するべきとされる。", "cn": ["誤り。イも措置に含まれる。", "誤り。エは措置ではなく、アが含まれる。", "誤り。エは措置ではなく、ウが含まれる。", "正しい。最低限講じるべき措置はア・イ・ウの3項目。"], "src": "GL p.99, p.91", "ref": "n1-20", "lv": 2}, {"id": "ETH-046", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "最も適切", "stem": "あなたは仲介者である。譲り受け候補H社から「当社を優先的に紹介してくれれば、正規の手数料とは別に追加で手数料を払う」と持ちかけられた。あなたの対応として最も適切なものはどれか。", "ch": ["申出を断り、譲り渡し側のニーズに沿ったマッチングを行う。", "追加手数料を受け取ったことを、成約後に譲り渡し側へ報告すれば問題はない。", "仲介契約書に禁止の定めがなければ、追加手数料の受領は禁止されない。", "追加手数料を受け取り、他の候補先より優先してH社を紹介する。"], "a": 0, "k": 3, "ex": "仲介者は両当事者に中立・公平でなければならず、譲り受け側から追加で手数料を取得し、ニーズに反した優先的マッチング等の便宜を図る行為を決して行ってはならない。これを含む5つの行為は、行わない旨を仲介契約書で義務として定めなければならない。", "cn": ["正しい。追加手数料を得て便宜を図る行為は行ってはならない。", "誤り。事後報告で許容されるものではない。", "誤り。5つの禁止行為は仲介契約書で義務として定めなければならず、定めの有無で許容されるものではない。", "誤り（禁忌肢）。GLが禁止する利益相反行為の典型（譲り受け側から追加手数料を取得し便宜を図る）。"], "src": "GL p.99〜100", "ref": "n1-20", "lv": 1}, {"id": "ETH-047", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "誤り", "stem": "GLが、仲介者が行ってはならず仲介契約書で義務として定めなければならないとする利益相反行為に該当しないものはどれか。", "ch": ["一方から伝達を求められた事項を他方に伝達せず、又は告げていない事項を偽って伝達すること", "両当事者と仲介契約を締結する旨を伝えたうえで、両当事者から手数料を受領すること", "リピーターとなる依頼者を優遇し、便宜を図ること", "希望譲渡額より高い額で成立した場合に、正規の手数料とは別に差分の一定割合を報酬として要求すること"], "a": 1, "k": null, "ex": "禁止される利益相反行為は、①譲り受け側から追加手数料を取得し便宜を図る、②リピーター優遇、③差分の一定割合の報酬要求、④不伝達・虚偽伝達、⑤一方にのみ有利・不利な情報の秘匿の5つ。両当事者からの手数料受領は、その旨を伝えることで仲介の形態として認められている。", "cn": ["該当する。禁止5類型の④。", "該当しない（本問の正答）。双方からの手数料受領自体は禁止されず、その旨を伝えることが措置とされる。", "該当する。禁止5類型の②。", "該当する。禁止5類型の③。"], "src": "GL p.99〜100", "ref": "n1-20", "lv": 2}, {"id": "ETH-048", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "最も適切", "stem": "あなたは仲介者である。譲り渡し側の社長から「従業員の雇用維持を最も重要な条件として、譲り受け側に必ず伝えてほしい」と頼まれた。交渉が難航しそうな条件である。あなたの対応として最も適切なものはどれか。", "ch": ["当該条件を譲り受け側に正確に伝達し、その反応も譲り渡し側に報告する。", "交渉が難航しないよう伝達せず、譲り渡し側には「先方の了承を得た」と伝える。", "伝達は最終契約書のドラフト段階でまとめて行えば足りると判断する。", "仲介者は中立の立場なので、一方の要望は伝達しないと説明する。"], "a": 0, "k": 1, "ex": "一方から伝達を求められた事項を他方に伝達せず、又は告げていない事項を偽って伝達する行為は、GLが禁止する利益相反行為である。仲介者は中立性・公平性をもって両当事者の利益の実現を図る必要がある。", "cn": ["正しい。伝達を求められた事項は他方に伝達する。", "誤り（禁忌肢）。不伝達かつ虚偽の伝達で、禁止される利益相反行為（GL Ⅱ-5④）。", "誤り。重要条件を後回しにすると合理的な意思決定を妨げる。", "誤り。中立は伝達拒否を意味しない。"], "src": "GL p.99〜100, p.94", "ref": "n1-20", "lv": 1}, {"id": "ETH-049", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "正しい", "stem": "仲介契約・FA契約締結時の重要事項説明に関するGLの記述として、正しいものはどれか。", "ch": ["口頭で十分に説明すれば、書面の交付は不要である。", "契約締結後1か月以内に重要事項を記載した書面を交付すれば足りる。", "説明の相手方は、法人の場合、窓口となる従業員であれば誰でもよい。", "契約締結前に、重要事項を記載した書面（メール等の電磁的方法を含む）を交付して説明しなければならない。"], "a": 3, "k": null, "ex": "契約締結前に、重要事項を記載した書面（メール等の電磁的方法を含む）を交付して説明しなければならない。説明の相手方は契約締結権限を有する者で、説明後は依頼者に十分な検討時間を与えるべきとされる。", "cn": ["誤り。書面（電磁的方法を含む）を交付して説明しなければならない。", "誤り。契約締結「前」に説明しなければならない。", "誤り。相手方は契約締結権限を有する者（法人は代表者又は委任を受けた者）。", "正しい。契約締結前の書面交付・説明が必要。"], "src": "GL p.86", "ref": "n1-21", "lv": 1}, {"id": "ETH-050", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "誤り", "stem": "GLが、仲介契約・FA契約の締結前に書面に記載して説明すべきとする重要事項（17項目）に含まれないものはどれか。", "ch": ["（譲り渡し側の場合）業界内での情報共有の仕組みへの参加有無", "譲り受け候補先となり得る企業の社名一覧", "担当者の保有資格、経験年数・成約実績", "（仲介者の場合）相手方の手数料"], "a": 1, "k": null, "ex": "重要事項は、仲介者とFAの違い、業務の範囲・内容、担当者の資格・経験・実績、手数料、手数料以外の費用、相手方の手数料、秘密保持、直接交渉の制限、専任条項、テール条項、契約期間、契約の解除、責任（免責）、契約終了後も効力を有する条項、利益の対立が想定される事項、譲り受け側への調査の概要、情報共有の仕組みへの参加有無の17項目である。", "cn": ["含まれる（No.17）。", "含まれない（本問の正答）。候補先の社名一覧は重要事項ではない。", "含まれる（No.3）。", "含まれる（No.6）。"], "src": "GL p.86〜88", "ref": "n1-21", "lv": 2}, {"id": "ETH-051", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "最も適切", "stem": "あなたは仲介者として譲り渡し側と仲介契約を締結しようとしている。社長から「買い手側はいくら手数料を払うのか」と尋ねられた。あなたの対応として最も適切なものはどれか。", "ch": ["口頭でおおよその水準を伝えれば、書面での説明は不要と判断する。", "相手方の手数料は企業秘密であるとして説明を拒み、秘匿したまま契約を締結する。", "契約締結前に相手方の手数料を書面で説明し、手数料総額が成立や条件に影響し得る旨も伝える。", "相手方の手数料は成約時に確定するため、成約後にまとめて説明すれば足りると伝える。"], "a": 2, "k": 1, "ex": "仲介者は仲介契約締結前に、相手方の手数料（報酬率、報酬基準額、最低手数料、発生タイミング等）を、手数料の総額が成立や条件（譲渡額等）に影響を与える可能性がある旨も含め、書面で説明するべきとされる。相手方の手数料を秘匿することは明らかにGLに反する。", "cn": ["誤り。書面で説明するべきとされる。", "誤り（禁忌肢）。相手方の手数料の秘匿（GL Ⅱ-4(2)②、重要事項No.6）。", "正しい。仲介者は契約締結前に相手方手数料を書面で説明するべき。", "誤り。仲介契約締結前に説明するべき。"], "src": "GL p.91／GL p.86〜88 No.6", "ref": "n1-21", "lv": 1}, {"id": "ETH-052", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "最も適切", "stem": "仲介者が、説明済みの相手方手数料を増額する場合に備え、依頼者と開示基準を予め合意しておくことにした。合意の内容として最も適切なものはどれか。", "ch": ["増額幅が確定しない変更は開示基準の対象外とし、その取扱いは合意しないでおく。", "依頼者が同意すれば、相手方手数料の増額は包括的に開示不要とする合意も望ましい。", "「重要な変更があった場合に開示する」という定性的な基準を合意すれば足りる。", "少なくとも報酬率・報酬基準額・最低手数料のそれぞれについて、具体的かつ定量的な開示基準を合意する。"], "a": 3, "k": null, "ex": "開示基準を予め合意する場合は具体的かつ定量的な基準とし、包括的に開示を不要とするものや定性的な基準にとどまるものとすべきではない。少なくとも報酬率・報酬基準額・最低手数料のそれぞれについて開示基準を合意するべきで、増額幅が確定しない変更についてもその取扱いを合意することが求められる（基準例では必ず開示）。", "cn": ["誤り。増額幅が確定しない変更についても、その取扱いを合意することが求められる（GLの基準例では「必ず開示する」）。", "誤り。包括的に開示不要とするものとすべきではない。", "誤り。定性的基準にとどめるものとすべきではない。", "正しい。具体的・定量的な基準を少なくとも3項目で合意するべき。"], "src": "GL p.92", "ref": "n1-21", "lv": 3}, {"id": "ETH-053", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "最も適切", "stem": "あなたは仲介者として重要事項を説明した。依頼者の社長から「最低手数料が高すぎるので、もう少し下げてもらえないか」と申し入れがあった。あなたの対応として最も適切なものはどれか。", "ch": ["申入れがあった以上、停止意思が示されたものとして営業を打ち切る。", "業務内容に見合っているか納得を得られるよう、申入れに誠実に対応を検討する。", "減額に応じる代わりに、相手方の手数料を増額したことは依頼者に伝えない。", "手数料は交渉の対象外であるとして、申入れを検討せずに断る。"], "a": 1, "k": null, "ex": "手数料について納得が得られず交渉を申し入れられた場合は、誠実に対応を検討しなければならない。依頼者の手数料を減額する場合は相手方手数料を増額していない旨を改めて説明するべきで、相手方手数料を増額する場合は開示するべきとされる。", "cn": ["誤り。手数料の交渉申入れは停止意思ではない。", "正しい。交渉を申し入れられた場合は誠実に対応を検討しなければならない。", "誤り。依頼者の手数料を減額する場合は、相手方手数料を増額していない旨を改めて説明するべきで、増額したなら開示するべき。", "誤り。誠実に対応を検討する必要がある。"], "src": "GL p.91〜92", "ref": "n1-19", "lv": 2}, {"id": "ETH-054", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "正しい", "stem": "重要事項説明における「提供する業務の範囲・内容」等に関するGLの記述として、正しいものはどれか。", "ch": ["DDを自ら実施しない場合でも、その旨を説明する必要はない。", "責任（免責）の条項は、説明すれば法的な効力が認められる。", "役務の範囲がクロージングまでの場合は、クロージング後の役務提供が難しい旨を説明する必要がある。", "提供しない業務については、説明しないのが原則である。"], "a": 2, "k": null, "ex": "業務の範囲・内容は、提供しない業務も明確に説明することが望ましく、少なくともDD・バリュエーションについては説明が求められる。役務の範囲がクロージングまでの場合はクロージング後の役務提供が難しい旨の説明が必要。責任（免責）は説明したからといって法的な効力が認められる関係にはない。", "cn": ["誤り。その旨と、DDは他の支援機関に依頼する必要があることを明確に伝える。", "誤り。説明したからといって法的な効力が認められる関係にはない。", "正しい。クロージング後の役務提供が難しい旨を説明する必要がある。", "誤り。提供しない業務も明確に説明が望ましく、少なくともDD・バリュエーションは説明が求められる。"], "src": "GL p.86〜88", "ref": "n1-21", "lv": 2}, {"id": "ETH-055", "sub": "倫理・行動規範", "top": "情報管理", "typ": "最も適切", "stem": "あなたは仲介者である。譲り渡し側の社長から「早く相手を見つけたいので、候補先への打診は全部任せる」と言われた。ネームクリアに関するあなたの対応として最も適切なものはどれか。", "ch": ["個別同意が通常であることや希望しない先に開示されるリスクを明示的に説明し、具体的な基準を設定し、指示があれば速やかに中止すると確約する。", "一任を受けた以上、途中で中止の指示があっても選定済みの先には開示を続けると説明する。", "社長の同意も候補先との秘密保持契約もないまま、関心のありそうな候補先に社名を伝えていく。", "一任を受けた以上、候補先との秘密保持契約の締結は省略できると説明する。"], "a": 0, "k": 2, "ex": "ネームクリアは譲り渡し側の同意を取得し、候補先と秘密保持契約を締結した上で実施される必要があり、同意は原則候補先ごとに個別に取得する。早期マッチング希望等の例外でも秘密保持契約は必須で包括的に一任すべきでなく、リスクの説明と意向確認、具体的基準の設定、中止の確約を実施しなければならない。", "cn": ["正しい。一定基準の下で選定する場合に実施しなければならない事項。", "誤り。指示があれば速やかにネームクリアを中止する旨を明示的に確約する。", "誤り（禁忌肢）。同意取得とNDA締結を欠くネームクリアで、情報漏えいに直結する。", "誤り。例外の場合も秘密保持契約の締結は必須。"], "src": "GL p.93〜94", "ref": "n1-22", "lv": 2}, {"id": "ETH-056", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "正しい", "stem": "DDおよび交渉段階の仲介者の行動指針に関するGLの記述として、正しいものはどれか。", "ch": ["仲介者はDDを自ら実施すべきでなく、資料整理やスケジュール管理等の評価・判断に影響しない範囲で支援できる。", "小規模企業については、資料の整備はDD開始後に促せば足りる。", "仲介者は中立な立場にあるため、DD報告書の結論を自ら決定することが望ましい。", "時間的余裕の有無にかかわらず、基本合意は締結しないことが望ましい。"], "a": 0, "k": null, "ex": "仲介者はDDを自ら実施すべきでなく、DD報告書の結論を決定すべきでない。資料整理・スケジュール管理等、評価・判断に影響しない範囲の支援は可能で、士業等専門家等の意見を求めるよう伝える必要がある。基本合意は時間的余裕がない場合等を除き、原則として締結することが望ましい。", "cn": ["正しい。評価・判断に影響しない範囲の支援は可能。", "誤り。早い時期から整備を促す必要がある。", "誤り。DD報告書の結論を決定すべきでない。", "誤り。時間的余裕がない場合等を除き、原則として締結することが望ましい。"], "src": "GL p.94〜95", "ref": "n1-22", "lv": 2}, {"id": "ETH-057", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "最も適切", "stem": "あなたは仲介者である。最終契約の交渉中、譲り渡し側の社長から「経営者保証の扱いについて、取引銀行と弁護士に相談したい」と言われた。あなたの対応として最も適切なものはどれか。", "ch": ["経営者保証はクロージング後に当事者間で協議すれば足りると説明する。", "相談を拒まず、相談先を秘密保持条項の対象から除外し、譲り受け側にも除外を働きかける。", "経営者保証の解除は譲り渡し側の義務として最終契約に定めるよう調整する。", "秘密保持契約違反になるとして相談を禁じ、保証の扱いを未定のまま最終契約を締結させる。"], "a": 1, "k": 3, "ex": "経営者保証の扱いは方針を相談の上検討しなければならず、士業等（特に弁護士）・センター・金融機関への事前相談が選択肢である旨を説明しなければならない。相談を拒むべきでなく、秘密保持条項の対象から相談先を除外し、譲り受け側にも働きかけなければならない。解除・移行は譲り受け側の義務とし、クロージング条件化や解除・補償条項を調整するべきとされる。", "cn": ["誤り。経営者保証は認識の有無に関わらず対応し、方針を検討しなければならない。", "正しい。相談を拒むべきでなく、秘密保持の対象から相談先を除外する必要がある。", "誤り。解除・移行は譲り受け側の義務とし、クロージング条件化等を調整するべき。", "誤り（禁忌肢）。相談を妨げ重大リスクを未解決のまま締結させる行為で、トラブルに繋がる確度が相当に高い。"], "src": "GL p.96", "ref": "n1-22", "lv": 2}, {"id": "ETH-058", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "正しい", "stem": "最終契約の交渉・締結における仲介者・FAの対応に関するGLの記述として、正しいものはどれか。", "ch": ["調整が不十分な段階でも、クロージング後の支払に関する条件は積極的に提案すべきである。", "DDを実施しない場合は、DDの重要性について説明する必要はない。", "表明保証に期間・責任上限がない場合等は、過大な責任を負うリスクがある旨を説明しなければならない。", "最終契約締結時には、弁護士の関与は避けることが望ましい。"], "a": 2, "k": null, "ex": "経営者保証、DDの非実施、表明保証の内容は、認識の有無に関わらず対応すべきリスクとされ、表明保証に期間・責任上限がない等の場合は過大な責任を負うリスクを説明しなければならない。クロージング後の支払等は安易に提案すべきでなく、提案する場合は組織的な判断によりリスクを具体的に説明しなければならない。", "cn": ["誤り。調整不十分な段階で安易に提案すべきでなく、提案する場合は組織的な判断による。", "誤り。DDは双方に重要なプロセスである旨を説明しなければならない。", "正しい。認識の有無に関わらず対応すべきリスクの一つ。", "誤り。弁護士の関与の下で締結することが望ましい。"], "src": "GL p.96〜98", "ref": "n1-22", "lv": 3}, {"id": "ETH-059", "sub": "倫理・行動規範", "top": "不適切な個人・組織、反社等との関係", "typ": "正しい", "stem": "不適切な譲り受け側の排除に向けた譲り受け側の調査に関するGLの記述として、正しいものはどれか。", "ch": ["調査は最終契約締結後、クロージングまでの間に一度行えば足りる。", "M&Aプラットフォーマーは、調査の取組の対象外とされている。", "調査方法を変更する場合でも、譲り渡し側への説明は不要である。", "調査は仲介契約・FA契約の締結前（プラットフォーマーは登録前）に加え、進捗過程でも実施し、最終契約の締結までに十分確認する。"], "a": 3, "k": null, "ex": "譲り受け側の調査は、最終契約を履行し事業を引き継ぐ意思・能力の確認を目的に、仲介契約・FA契約締結前（プラットフォーマーは登録前）に加え進捗過程でも実施し、最終契約の締結までに十分確認する。調査方法を変更する場合は内容を理由とともに説明しなければならない。", "cn": ["誤り。遅くとも最終契約の締結前までに調査する。", "誤り。仲介者・FA（M&Aプラットフォーマーを含む）に取組が求められる。", "誤り。変更する場合は内容を理由とともに説明しなければならない。", "正しい。調査のタイミングとして示されている。"], "src": "GL p.100〜102", "ref": "n1-24", "lv": 2}, {"id": "ETH-060", "sub": "倫理・行動規範", "top": "不適切な個人・組織、反社等との関係", "typ": "最も適切", "stem": "あなたは仲介者である。譲り渡し側I社は債務超過の状態で、株式譲渡を予定している。譲り受け候補の調査に関する対応として最も適切なものはどれか。", "ch": ["調査結果にリスクがあっても、譲り渡し側には報告せず取引を進める。", "譲り受け側が提出した会社案内の内容を確認すれば足りる。", "特に慎重に調査を行い、少なくとも譲り受け側の決算公告や税務申告書を確認する。", "債務超過企業の案件では譲り受け側が限られるため、調査は省略する。"], "a": 2, "k": null, "ex": "譲り渡し側が債務超過等の場合は特に慎重に、少なくとも決算公告や税務申告書の確認が求められる（保証債務が移行せず簿外債務を遮断できる事業譲渡等は必要性が低い場合もある）。遅くとも最終契約の締結前までに調査し、リスク検出時は開示可能な範囲で報告し、取引実行の可否や条項内容を協議しなければならない。", "cn": ["誤り。リスク検出時は開示可能な範囲で報告し、取引実行の可否等を協議しなければならない。", "誤り。財務状況・事業実態等を税務申告書や商業登記簿等で確認する。", "正しい。債務超過等の場合は特に慎重に、少なくとも決算公告や税務申告書の確認が求められる。", "誤り。債務超過の場合こそ特に慎重な調査が求められる。"], "src": "GL p.101〜102", "ref": "n1-24", "lv": 2}, {"id": "ETH-061", "sub": "倫理・行動規範", "top": "不適切な個人・組織、反社等との関係", "typ": "誤り", "stem": "譲り受け側の調査項目と確認方法の組合せとして、GLの例示に照らし誤っているものはどれか。", "ch": ["事業実態 ― 商業登記簿、web地図閲覧、事業所訪問", "財務状況 ― 財務諸表の確認（債務超過・赤字でないか、現預金の額等）", "コンプライアンス ― 譲り受け側代表者本人への口頭確認のみ", "最終契約の実行可能性 ― 財務諸表、預金通帳、融資証明書等"], "a": 2, "k": null, "ex": "GLは調査項目として、財務状況（財務諸表）、コンプライアンス（Web上の不芳情報検索、社内DB、業界内情報共有の仕組み、外部DB・調査会社。対象は譲り受け側・経営者・役員・主要株主・関連会社）、事業実態（商業登記簿、web地図、事業所訪問）、最終契約の実行可能性（財務諸表、預金通帳、融資証明書等）等を例示する。", "cn": ["正しい組合せ。", "正しい組合せ。", "誤り（本問の正答）。Web上の不芳情報検索、社内DB、業界内情報共有の仕組み、外部DB・調査会社等で、経営者・役員・主要株主・関連会社も対象とする。", "正しい組合せ。"], "src": "GL p.101〜102", "ref": "n1-23", "lv": 2}, {"id": "ETH-062", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "組合せ", "stem": "GLにおける契約条項の目安について、専任条項を設ける場合の仲介契約・FA契約の契約期間は最長でも（A）以内、テール期間は最長でも（B）以内を目安とし、直接交渉の制限の有効期間は（C）に限定すべきとされる。A〜Cの組合せとして正しいものはどれか。", "ch": ["A 6か月～1年　B 2年～3年　C 仲介契約・FA契約が終了するまで", "A 2年～3年　B 6か月～1年　C 仲介契約・FA契約が終了するまで", "A 6か月～1年　B 2年～3年　C 契約終了後2年～3年が経過するまで", "A 1年～2年　B 3年～5年　C 最終契約の締結まで"], "a": 0, "k": null, "ex": "専任条項の契約期間は最長でも6か月～1年以内を目安に定めるべき、テール期間は最長でも2年～3年以内を目安とすることが望ましい、直接交渉の制限の有効期間は仲介契約・FA契約が終了するまでに限定すべきとされる。", "cn": ["正しい。", "誤り。専任とテールの期間が逆。", "誤り。契約終了後はテール条項で手当てできるため、直接交渉の制限は契約終了までに限定すべき。", "誤り。期間の目安が異なる。"], "src": "GL p.103〜105", "ref": "n1-25", "lv": 1}, {"id": "ETH-063", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "最も適切", "stem": "あなたは仲介会社で、譲り渡し側との専任条項付き仲介契約のひな形を見直している。専任条項の内容として最も適切なものはどれか。", "ch": ["セカンド・オピニオンの相談先は、依頼者が任意に選べ、情報管理上の制限は設けない旨を定める。", "契約期間は3年とし、期間中の中途解約はできない旨を定める。", "専任条項がある以上、依頼者はいかなる場合もセカンド・オピニオンを求められない旨を定める。", "対象範囲を可能な限り限定し、契約期間は最長でも6か月～1年以内を目安とし、任意の時点で中途解約できる旨を明記する。"], "a": 3, "k": null, "ex": "専任条項は対象範囲を可能な限り限定し、妨げる合理的理由がなければセカンド・オピニオンを許容すべきだが、相談先を秘密保持義務のある者や公的機関に限定する等の情報管理に配慮する。契約期間は最長でも6か月～1年以内を目安とし、任意の時点で中途解約できることを明記する条項等を設けることが望ましい。", "cn": ["誤り。相談先を秘密保持義務のある者やセンター等に限定する等、情報管理に配慮する必要がある。", "誤り。最長でも6か月～1年以内が目安。中途解約できる条項が望ましい。", "誤り。妨げる合理的理由がなければセカンド・オピニオンを許容すべき。", "正しい。GL Ⅱ-7の留意点に沿う。"], "src": "GL p.103〜104", "ref": "n1-26", "lv": 2}, {"id": "ETH-064", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "正しい", "stem": "直接交渉の制限に関する条項についてのGLの記述として、正しいものはどれか。", "ch": ["依頼者が自ら発見した候補先についても、依頼者の了解の有無にかかわらず直接交渉を制限できる。", "依頼者が明示的に了解している場合を除き、対象となる候補先は業者が関与・接触し紹介した候補先のみに限定すべきである。", "通常の取引関係の交渉も含め、候補先とのあらゆる交渉を一律に禁止すべきである。", "契約終了後も、業者が紹介した候補先との直接交渉は一定期間制限すべきである。"], "a": 1, "k": null, "ex": "直接交渉の制限の対象候補先は、業者が関与・接触し紹介した候補先のみに限定すべきで、依頼者が「自ら候補先を発見しないこと」等を明示的に了解している場合は例外となる。交渉の目的はM&Aに関するものに限定し、有効期間は仲介契約・FA契約が終了するまでに限定すべきとされる。", "cn": ["誤り。依頼者が明示的に了解している場合に限られる。", "正しい。対象候補先の限定と例外。", "誤り。通常の事業を阻害するため、M&Aに関する目的のものに限定すべき。", "誤り。契約終了後はテール条項で手当てでき、有効期間は契約終了までに限定すべき。"], "src": "GL p.104", "ref": "n1-27", "lv": 2}, {"id": "ETH-065", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "最も適切", "stem": "譲り渡し側J社は、専任条項のない仲介契約を仲介会社X社・Y社の2社と締結していた。両社から同じ候補先K社を紹介され、J社はX社を通じてK社とのM&Aを成立させ、Y社との契約は終了した。Y社の対応として最も適切なものはどれか。", "ch": ["Y社がノンネーム・シートをK社に提示していれば、テール条項に基づき手数料を請求できる。", "成立後2年～3年以内のM&Aであれば、紹介の有無にかかわらずテール条項に基づき請求できる。", "選択されなかった業者として、テール条項を根拠にJ社へ手数料を請求しない。", "Y社もK社を紹介していたため、テール条項を根拠に手数料の全額を請求する。"], "a": 2, "k": null, "ex": "テール条項の対象は業者が関与・接触し紹介した譲り受け側に限定し、リストやノンネーム・シートの提示のみは対象とすべきでなく、少なくともネームクリアが行われた先に限る。専任条項がない場合に複数業者から同一候補先を紹介され、選択されなかった業者は、テール条項を根拠に手数料を請求すべきではない。", "cn": ["誤り。ノンネーム・シートの提示のみはテール条項の対象とすべきでない。", "誤り。対象は業者が関与・接触し紹介した譲り受け側に限定すべき。", "正しい。専任条項がない場合に選択されなかった業者はテール条項を根拠に請求すべきでない。", "誤り。専任条項がなく選択されなかった業者は請求すべきでない。"], "src": "GL p.105", "ref": "n1-28", "lv": 3}, {"id": "ETH-066", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "正しい", "stem": "M&A支援機関登録制度の遵守事項チェックシート（41項目）に関する記述として、正しいものはどれか。", "ch": ["専任条項について、任意の時点で中途解約できることを明記する条項等を設けることとされ、口頭での明言も含むと補足されている。", "重要事項説明は、契約締結権限の有無にかかわらず、窓口担当者に行えば足りるとされる。", "利益相反に関する項目（No.33〜40）は、仲介業務を行わない支援機関にも必要とされる。", "チェックシートは全48項目で、倫理・行動規範の各条文に1対1で対応している。"], "a": 0, "k": null, "ex": "チェックシートはM&A支援機関登録制度の遵守事項を41項目に整理したもので、GL第2章Ⅱの規範と対応する。No.27は任意の時点で中途解約できることを明記する条項等（口頭での明言も含む）を設けるとし、GL本文の「望ましい」より表現が強い。No.33〜40は仲介業務を行わない場合は不要。", "cn": ["正しい。No.27の内容（GL本文では「望ましい」）。", "誤り。契約締結権限を有する者に行う（No.12）。", "誤り。No.33〜40は仲介業務を行わない場合は不要。", "誤り。41項目でGL第2章Ⅱの規範と対応する。"], "src": "SM p.188〜189", "ref": "n1-31", "lv": 3}, {"id": "ETH-067", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "誤り", "stem": "遵守事項チェックシート（No.1〜24）の内容として、誤っているものはどれか。", "ch": ["No.13：重要事項の説明後、依頼者に十分な検討時間を与える。", "No.12：重要事項の説明は、契約締結権限を有する者（法人は代表者又は委任を受けた者）に行う。", "No.15：ネームクリアは、譲り渡し側の同意取得と候補先との秘密保持契約締結の上で実施する。", "No.19：DDでは、譲り受け側が要求する資料の準備は譲り渡し側の責任であり、支援者は関与しない。"], "a": 3, "k": null, "ex": "チェックシートは、重要事項説明の相手方（No.12）、検討時間の付与（No.13）、ネームクリアの要件（No.15）、DDにおける資料準備の促進・サポート（No.19）、クロージング当日の入金確認（No.23）などを遵守事項としている。", "cn": ["正しい。", "正しい。", "正しい。", "誤り（本問の正答）。譲り受け側が要求する資料の準備を促しサポートする。"], "src": "SM p.184〜185", "ref": "n1-30", "lv": 2}, {"id": "ETH-068", "sub": "倫理・行動規範", "top": "支援機関向けの基本姿勢", "typ": "正しい", "stem": "遵守事項チェックシートNo.41（その他）の内容として、正しいものはどれか。", "ch": ["GLの記載のうち、法的拘束力のある部分のみ遵守すればよい。", "M&A専門業者以外の支援機関は、GLの記載を考慮する必要はない。", "GLの「M&A専門業者」に関する記載について、GLの趣旨に則った対応に努める。", "GLの趣旨よりも、各社の業務方針を優先して対応する。"], "a": 2, "k": null, "ex": "チェックシートNo.41は、GLの「M&A専門業者」に関する記載について、GLの趣旨（後継者不在の経営者の背中を押し適切に進める手引きと、支援者の基本事項を示すこと）に則った対応に努めることを求める。", "cn": ["誤り。GLの趣旨に則った対応に努めるとされる。", "誤り。業務の性質が共通する限り他の支援機関も準拠が想定される。", "正しい。No.41の内容。", "誤り。業務方針に委ねるだけでなく指針に沿った対応が求められる。"], "src": "SM p.189", "ref": "n1-29", "lv": 2}, {"id": "ETH-069", "sub": "倫理・行動規範", "top": "基本原則", "typ": "正しい", "stem": "中小M&A資格試験の「倫理・行動規範」科目と禁忌肢に関する記述として、正しいものはどれか。", "ch": ["禁忌肢には、解釈が分かれる曖昧な内容も含めることが想定されている。", "出題割合は25%程度とされ、GLに明らかに違反する行為等を禁忌肢とし、その一定数の誤答で不合格とする設計が想定されている。", "出題割合は10%程度とされ、禁忌肢は設けず他科目と同じ基準で採点される。", "禁忌肢の設定が技術的に難しい場合の代替策は示されていない。"], "a": 1, "k": null, "ex": "倫理・行動規範は出題割合25%程度（60問なら15問程度）で、遵守徹底を最も重視するメッセージとして禁忌肢を設定すべきとされた。GLに明らかに違反する行為やトラブルに繋がる確度が相当に高い行為を禁忌肢とし、一定数の誤答で不合格とする設計が想定される。技術的に難しい場合は科目別最低基準の引き上げ等の代替策を講じる。", "cn": ["誤り。曖昧な内容ではなく明確に問題がある内容とする想定。", "正しい。出題割合と禁忌肢の設計イメージ。", "誤り。出題割合は25%程度（60問なら15問程度）。", "誤り。科目別合格最低基準の引き上げや配点を高くする等の代替策が示されている。"], "src": "資料2 p.6〜7, p.9〜11", "ref": "n1-32", "lv": 1}, {"id": "ETH-070", "sub": "倫理・行動規範", "top": "基本原則", "typ": "誤り", "stem": "資料2に示された「倫理・行動規範」科目の中項目に含まれないものはどれか。", "ch": ["不適切な個人・組織、反社等との関係", "バリュエーション", "仲介者・FAの選定等", "支援機関向けの基本姿勢"], "a": 1, "k": null, "ex": "倫理・行動規範の中項目は、使命／仲介者・FAの選定等／基本原則／善管注意義務・職業倫理／広告・営業／品位／法令等の遵守／不適切な個人・組織、反社等との関係／情報管理／その他禁止行為／支援機関向けの基本姿勢である。", "cn": ["含まれる。", "含まれない（本問の正答）。バリュエーションはM&A実務・財務・税務の中項目。", "含まれる。", "含まれる。"], "src": "資料2 p.10", "ref": "n1-33", "lv": 1}, {"id": "FIN-001", "sub": "財務・税務", "top": "バリュエーション", "typ": "最も適切", "stem": "中小M&Aにおけるバリュエーション（企業価値評価）の位置付けに関する記述として、最も適切なものはどれか。", "ch": ["算定された評価額は、そのまま譲渡額として当事者を拘束する。", "評価額は譲渡額を決める際の目安の一つであり、最終的には当事者同士が合意した金額が譲渡額となる。", "中小M&Aでは、DCF法のみで算定して交渉するケースが大半である。", "純資産に数年分の利益を加算する方法は、中小M&Aでは用いられない。"], "a": 1, "k": null, "ex": "ガイドラインは、バリュエーションの評価額は譲渡額を決める際の目安の一つにすぎず、当事者同士が最終的に合意した金額が譲渡額になるとしている。中小M&Aでは簿価純資産法・時価純資産法・マルチプル法で算定するケースが多く、純資産に数年分の利益を加算する場合もある。", "cn": ["誤り。算出額がそのまま譲渡額になるわけではない。", "正しい。評価額は目安の一つで、合意額が譲渡額となる。", "誤り。中小M&Aでは簿価純資産法・時価純資産法・マルチプル法で算定するケースが多い。", "誤り。純資産に数年分の任意の利益を加算する場合もあるとされる。"], "src": "GL p.22, 44", "ref": "n3-2", "lv": 1}, {"id": "FIN-002", "sub": "財務・税務", "top": "バリュエーション", "typ": "誤り", "stem": "仲介者が簡易評価の結果を両当事者に示す場合に、両当事者に対して明示すべき事項として、ガイドラインに照らし適切でないものはどれか。", "ch": ["確定的なバリュエーションではなく、参考資料として簡易に算定したものであること", "一方当事者の意向・意見等を考慮した場合は、その内容", "必要に応じて士業等専門家等の意見（セカンドオピニオン）を求めることができること", "採用した手法・価格帯が唯一適切なものであり、他の手法による検討は不要であること"], "a": 3, "k": null, "ex": "仲介者が簡易評価を示す場合、①確定的なものではなく参考資料として簡易に算定したこと、②一方当事者の意向等を考慮した場合はその内容、③必要に応じてセカンドオピニオンを求められることの3点を両当事者に明示すべきとされる。また、手法・価格帯は唯一のものではないことを明示する必要がある。", "cn": ["明示すべき3点の1つ目に該当する。", "明示すべき3点の2つ目に該当する。", "明示すべき3点の3つ目に該当する。", "適切でない。手法・価格帯が唯一のものではないことを明示すべきとされており、逆の内容である。"], "src": "GL p.92-93／SM p.40", "ref": "n3-2", "lv": 2}, {"id": "FIN-003", "sub": "財務・税務", "top": "バリュエーション", "typ": "最も適切", "stem": "仲介者Xは、譲り渡し側A社の社長から「確定的な株価を算定して、その金額で買い手と交渉してほしい」と依頼された。Xの対応として、最も適切なものはどれか。", "ch": ["確定的なバリュエーションは実施せず、簡易評価である旨等を両当事者に明示したうえで、必要に応じて士業等専門家等の意見を求めるよう伝える。", "仲介者として確定的なバリュエーションを実施し、その結果を譲り受け側にも確定値として提示する。", "A社の意向を反映して高めに算定し、意向を考慮した事実は譲り受け側に伝えずに提示する。", "評価額は譲渡額に直結しないため、算定手法や前提条件は説明せず結果のみを伝える。"], "a": 0, "k": null, "ex": "両当事者を依頼者とする仲介者は、一方当事者の意向が反映されやすいため確定的なバリュエーションを実施すべきではない。簡易評価を示す場合はその旨等を両当事者に明示し、必要に応じて士業等専門家等の意見を求めるよう依頼者に伝える必要がある。", "cn": ["正しい。確定的なバリュエーションを避け、明示事項とセカンドオピニオンの案内を行う対応である。", "誤り。仲介者は確定的なバリュエーションを実施すべきではない。", "誤り。一方当事者の意向を考慮した場合、その内容を両当事者に明示する必要がある。", "誤り。手法や前提条件は依頼者に事前に説明し、納得を得る必要がある。"], "src": "GL p.92-93／SM p.40, 47", "ref": "n3-2", "lv": 2}, {"id": "FIN-004", "sub": "財務・税務", "top": "バリュエーション", "typ": "正しい", "stem": "スキルマップが示すバリュエーション手法の特徴に関する記述として、正しいものはどれか。", "ch": ["時価純資産法はBSのみで比較的シンプルだが、将来の収益性や営業権が反映されず妥当性を欠く可能性がある。", "DCF法は事業計画書を必要とせず、BSのみで比較的シンプルに算定できる。", "マルチプル法は、類似企業が少ない場合や一時的な減益要因がある場合でも、常に適正な価値が表れる。", "純資産＋数年分の利益の方法は、加算する利益に理論的裏付けがあり恣意性が入らない点が長所である。"], "a": 0, "k": null, "ex": "時価純資産法（コスト・アプローチ）はBSのみで比較的シンプルだが、将来の収益性・営業権が反映されないデメリットがある。マルチプル法は最も客観的とされる一方、類似企業が少ない場合や一時的な減益要因がある場合に価値が表れない可能性がある。", "cn": ["正しい。時価純資産法のメリットとデメリットの記述どおりである。", "誤り。DCF法は事業計画書が必要で、BSのみで算定できるのは時価純資産法である。", "誤り。類似企業・取引が少ない場合や一時的な減益要因がある場合は価値が表れない可能性がある。", "誤り。加算利益に理論的裏付けがなく恣意性があることがデメリットとされる。"], "src": "SM p.42-43", "ref": "n3-4", "lv": 1}, {"id": "FIN-005", "sub": "財務・税務", "top": "バリュエーション", "typ": "正しい", "stem": "ガイドライン（公認会計士の項）が示す三つの評価アプローチの一般的な特徴（◎優れている／○やや優れている／△問題となるケースもある）に関する記述として、正しいものはどれか。", "ch": ["マーケット・アプローチは、「市場での取引環境の反映」が◎、「固有の性質の反映」が△とされる。", "インカム・アプローチは、「客観性」が◎とされる。", "3つのアプローチはいずれも、「客観性」が○とされる。", "コスト・アプローチは、「将来の収益獲得能力の反映」が◎とされる。"], "a": 0, "k": null, "ex": "表では、マーケット・アプローチは客観性◎・市場での取引環境の反映◎・将来の収益獲得能力の反映○・固有の性質の反映△とされる。インカム・アプローチは客観性△だが将来の収益獲得能力と固有の性質の反映が◎、コスト・アプローチは客観性◎だが将来の収益獲得能力の反映は△である。", "cn": ["正しい。マーケット・アプローチは市場取引環境の反映◎、固有の性質の反映△である。", "誤り。インカム・アプローチの客観性は△である。", "誤り。客観性はコスト◎、マーケット◎、インカム△である。", "誤り。コスト・アプローチの将来の収益獲得能力の反映は△である。"], "src": "GL p.113-114", "ref": "n3-4", "lv": 2}, {"id": "FIN-006", "sub": "財務・税務", "top": "バリュエーション", "typ": "誤り", "stem": "時価（簿価）純資産に数年分の利益を加算する方法に関する記述として、誤っているものはどれか。", "ch": ["加算する利益には、税引後利益又は経常利益等が用いられ、通常1〜3年分とされる。", "算出された株式価値は客観的な値であり、交渉の参考にとどまらず譲渡額の基準として確定的に用いられる。", "加算する利益の種類や年数は、交渉で決まるケースが多い。", "低収益企業では、過大評価となる可能性がある。"], "a": 1, "k": null, "ex": "この方法は限られた情報でも比較的シンプルに算定できるが、加算利益に理論的裏付けがなく恣意性があり、低収益企業では過大評価となる可能性がある。算出された株式価値は客観的な値ではなく、あくまで交渉の際の参考とされる。", "cn": ["正しい。税引後利益又は経常利益等を通常1〜3年分加算する。", "誤り。客観的な値ではなく、あくまで交渉の際の参考とされる。", "正しい。利益の種類と年数は交渉で決まることが多い。", "正しい。低収益企業では過大評価の可能性がデメリットとされる。"], "src": "SM p.42-43／参考資料2 p.3", "ref": "n3-4", "lv": 1}, {"id": "FIN-007", "sub": "財務・税務", "top": "バリュエーション", "typ": "組合せ", "stem": "スキルマップが示すDCF法の手順について、次のア〜オを正しい順に並べたものはどれか。\nア 加重平均資本コスト（WACC）を算定する\nイ 予測期間を決めて事業計画を策定し、期間中のFCFを算出する\nウ 非事業用資産を加算して企業価値を出し、有利子負債を控除して株主価値を算出する\nエ 予測期間後の継続価値（ターミナルバリュー）を算定する\nオ FCFと継続価値をWACCで割り引き、事業価値を算定する", "ch": ["ア→イ→オ→エ→ウ", "イ→エ→ア→ウ→オ", "イ→ア→エ→オ→ウ", "ア→エ→イ→オ→ウ"], "a": 2, "k": null, "ex": "DCF法は、(1)予測期間（一般に3〜5年程度）のFCF算出、(2)WACCの算定、(3)継続価値の算定、(4)FCFと継続価値をWACCで割り引いて事業価値を算定、(5)非事業用資産を加算して企業価値とし有利子負債を控除して株主価値を算出、の順で行う。", "cn": ["誤り。最初に行うのは予測期間の設定とFCFの算出である。", "誤り。割引前にWACCと継続価値を求め、株主価値の算出は最後である。", "正しい。SMの手順(1)〜(5)の順序どおりである。", "誤り。FCFの算出が最初であり、WACCから始まるものではない。"], "src": "SM p.47-48", "ref": "n3-5", "lv": 2}, {"id": "FIN-008", "sub": "財務・税務", "top": "バリュエーション", "typ": "組合せ", "stem": "マルチプル法に関する次の文章の空欄A〜Cに入る語句の組合せとして、正しいものはどれか。\n「EV/EBITDA倍率法で算定されるのは（A）である。PER倍率法は業界平均のPERと対象会社の（B）を、PBR倍率法は業界平均のPBRと対象会社の（C）を用いて、株主価値を算定する。」", "ch": ["A 株主価値　B 当期純利益　C 簿価純資産", "A 企業価値（EV）　B 営業利益　C 時価純資産", "A 株主価値　B 営業利益　C 時価純資産", "A 企業価値（EV）　B 当期純利益　C 簿価純資産"], "a": 3, "k": null, "ex": "SMの整理では、EV/EBITDA倍率法は対象会社のEBITDAから企業価値（EV）を算定し、PER倍率法は当期純利益から、PBR倍率法は簿価純資産から株主価値を算定する。", "cn": ["誤り。EV/EBITDA倍率法で算定されるのは企業価値（EV）である。", "誤り。PERは当期純利益、PBRは簿価純資産を用いる。", "誤り。A・B・Cのいずれも誤りである。", "正しい。SM p.47の表のとおりである。"], "src": "SM p.47", "ref": "n3-5", "lv": 2}, {"id": "FIN-009", "sub": "財務・税務", "top": "バリュエーション", "typ": "正しい", "stem": "参考資料2「中小M&Aの譲渡額の算定方法」に示された各手法の特徴として、正しいものはどれか。", "ch": ["時価純資産法（修正簿価純資産法）は、譲り受け側が実態を把握するために有効だが、時価算定等にコストや時間を要する場合がある。", "簿価純資産法は、簿価と時価の乖離や簿外資産・負債があっても、本来の価値を正確に表す。", "類似会社比較法は客観性が高いため、選定する上場会社等が適切かどうかに注意する必要はない。", "修正簿価純資産法とは、全ての資産・負債を例外なく時価評価する方法をいう。"], "a": 0, "k": null, "ex": "時価純資産法は資産・負債と簿外資産・負債を時価評価した純資産を株式価値とし、実態把握に有効だがコスト・時間を要しうる。中小M&Aでは、不動産や有価証券等の一部のみを時価評価する修正簿価純資産法も多い。", "cn": ["正しい。参考資料2のメリット・デメリットのとおりである。", "誤り。乖離や簿外資産・負債があると本来の価値を表さないのがデメリットである。", "誤り。比較的客観性の高い手法だが、選定する上場会社等が適切かに注意が必要とされる。", "誤り。修正簿価純資産法は、不動産や有価証券等の一部のみを時価評価する方法である。"], "src": "参考資料2 p.1-4", "ref": "n3-6", "lv": 1}, {"id": "FIN-010", "sub": "財務・税務", "top": "バリュエーション", "typ": "計算", "stem": "次の資料に基づき、時価純資産法による株式価値を計算した場合、正しいものはどれか（単位は百万円）。\n・資産（簿価）600、負債（簿価）200\n・土地の含み損100\n・保険の解約返戻金（簿外資産）20\n・役員退職金（未計上）50\n・繰延税金資産は、（含み損100＋役員退職金50−解約返戻金20）に実効税率34%を乗じ、1百万円未満を切り捨てて計上する", "ch": ["270", "304", "314", "400"], "a": 2, "k": null, "ex": "600−100＋20−200−50＝270に、繰延税金資産（100＋50−20）×34%＝44.2→44を加えて314となる（参考資料2 p.2の計算例と同じ結果）。簿価純資産400から含み損・簿外項目を反映したものが時価純資産である。", "cn": ["誤り。税効果（繰延税金資産44）を考慮していない額である。", "誤り。繰延税金資産を含み損100分のみ（34）で計算した額である。", "正しい。270＋44＝314。", "誤り。簿価純資産（600−200）であり、時価評価を反映していない。"], "src": "参考資料2 p.2", "ref": "n3-6", "lv": 2}, {"id": "FIN-011", "sub": "財務・税務", "top": "バリュエーション", "typ": "計算", "stem": "譲渡額を「時価純資産＋数年分の利益」で算定する。次の資料に基づく譲渡額として、正しいものはどれか（単位は百万円）。\n・時価純資産（税効果は考慮しない）270\n・直近期の利益20（売上200−費用180）\n・費用には、M&A後に削減される役員保険料5が含まれている\n・加算する利益は、修正後の利益の3年分とする", "ch": ["295", "330", "360", "345"], "a": 3, "k": null, "ex": "修正利益は20＋5＝25で、その3年分75を時価純資産270に加算して譲渡額は345となる（参考資料2 p.3の計算例）。加算する利益の種類や年数（通常1〜3年）は交渉で決まることが多い。", "cn": ["誤り。修正利益25の1年分しか加算していない。", "誤り。修正前の利益20の3年分（60）を加算した額である。", "誤り。役員保険料を2倍（修正利益30）とした誤りである。", "正しい。270＋25×3＝345。"], "src": "参考資料2 p.3", "ref": "n3-6", "lv": 2}, {"id": "FIN-012", "sub": "財務・税務", "top": "バリュエーション", "typ": "計算", "stem": "EV/EBITDA倍率法により対象会社の株式価値を算定する。次の資料に基づく株式価値として、正しいものはどれか（単位は百万円。EBITDAは営業利益＋減価償却費で簡易算定し、非流動性ディスカウントは考慮しない）。\n【類似上場会社】株式時価総額900、有利子負債300、現預金200、EBITDA125\n【対象会社】営業利益60、減価償却費15、有利子負債150、現預金50", "ch": ["400", "500", "480", "600"], "a": 1, "k": null, "ex": "類似上場会社のEV＝900＋300−200＝1,000、倍率＝1,000÷125＝8.0倍。対象会社のEBITDA＝60＋15＝75、EV＝75×8＝600。純有利子負債＝150−50＝100を控除して株式価値は500となる。", "cn": ["誤り。現預金を有利子負債から差し引かず、両方を控除した（600−150−50）額である。", "正しい。75×8.0−（150−50）＝500。", "誤り。減価償却費を足さず営業利益60に倍率を乗じ、純有利子負債も控除していない額である。", "誤り。企業価値（EV）であり、純有利子負債を控除していない。"], "src": "参考資料2 p.4", "ref": "n3-6", "lv": 3}, {"id": "FIN-013", "sub": "財務・税務", "top": "バリュエーション", "typ": "計算", "stem": "以下のデータからフリー・キャッシュ・フローを計算した場合、正しいものはどれか。\n【資料】\n営業利益：100百万円\n減価償却費：10百万円\n売上債権の増加額：15百万円\n棚卸資産の増加額：8百万円\n仕入債務の減少額：2百万円\n設備投資額：20百万円\n実効税率：40％", "ch": ["25百万円", "29百万円", "65百万円", "75百万円"], "a": 0, "k": null, "ex": "公式サンプル問題（資料2 p.14、正答①25百万円）。税引後営業利益100×(1−40%)＝60に減価償却費10を足し戻し、運転資本の増加（売上債権増加15＋棚卸資産増加8＋仕入債務減少2＝25）と設備投資20を差し引いて、60＋10−25−20＝25となる。仕入債務の減少は資金の流出なので差し引く側である（計算手順は資料に解説がなく、数値から検算したもの）。", "cn": ["正しい。100×0.6＋10−(15＋8＋2)−20＝25。", "誤り。仕入債務の減少2を差し引かず加算した（60＋10−15−8＋2−20）額である。", "誤り。税金を考慮せず営業利益100から計算した額（100＋10−25−20）である。", "誤り。税金・減価償却費・設備投資を考慮せず、営業利益100から運転資本の増加25のみを差し引いた額である。"], "src": "資料2 p.14（サンプル問題②）", "ref": "n3-7", "lv": 2}, {"id": "FIN-014", "sub": "財務・税務", "top": "バリュエーション", "typ": "計算", "stem": "次の資料からフリー・キャッシュ・フローを計算した場合、正しいものはどれか（資料2のサンプル問題と同じ方法で計算する）。\n営業利益：200百万円／減価償却費：30百万円\n売上債権の減少額：10百万円／棚卸資産の増加額：20百万円\n仕入債務の増加額：5百万円／設備投資額：50百万円\n実効税率：30％", "ch": ["85百万円", "115百万円", "165百万円", "175百万円"], "a": 1, "k": null, "ex": "税引後営業利益200×(1−30%)＝140に減価償却費30を足し戻す（170）。運転資本＝売上債権＋棚卸資産−仕入債務（SM p.108）なので、運転資本の増減は売上債権−10＋棚卸資産＋20−仕入債務の増加5＝＋5（増加）となり、サンプル問題と同様にこの増加5と設備投資50を差し引いて170−5−50＝115となる。売上債権の減少・仕入債務の増加は運転資本を減らす（資金の流入となる）方向に働く。", "cn": ["誤り。売上債権の減少や仕入債務の増加（資金の流入）まで差し引いた額である。", "正しい。140＋30−(−10＋20−5)−50＝115。", "誤り。設備投資を差し引いていない額である。", "誤り。税金を考慮せず営業利益200から計算した額である。"], "src": "資料2 p.14（サンプル問題②の応用）／SM p.108（運転資本の算式）", "ref": "n3-7", "lv": 3}, {"id": "FIN-015", "sub": "財務・税務", "top": "バリュエーション", "typ": "誤り", "stem": "資料2で示された「株式価値の簡易計算ツール」の免責事項等に関する記述として、誤っているものはどれか。", "ch": ["算定結果は参考値であり、実際の株式価値は双方の合意により決定される。", "算定対象は黒字企業における株式譲渡であり、事業譲渡は対象外である。", "取引事例法における個社別の調整（役員報酬、一時的な損益等）や非流動性ディスカウントは考慮しない。", "債務超過企業であっても、簿価純資産を入力すれば株式譲渡の株式価値を算定できる。"], "a": 3, "k": null, "ex": "ツールの算定対象は黒字企業における株式譲渡であり、赤字企業・債務超過企業の株式譲渡、事業譲渡、その他スキームは対象外である。結果は参考値で第一四分位〜第三四分位のレンジで表示され、個社別の調整・非流動性ディスカウント・非支配株主持分は考慮しない。", "cn": ["正しい。算定結果は参考値で、株式価値は双方の合意で決まる。", "正しい。事業譲渡その他スキームは対象外である。", "正しい。個社別調整や非流動性ディスカウントは考慮しない。", "誤り。債務超過企業の株式譲渡は算定対象外である。"], "src": "資料2 p.43-45", "ref": "n3-8", "lv": 2}, {"id": "FIN-016", "sub": "財務・税務", "top": "バリュエーション", "typ": "最も適切", "stem": "支援者Yは、バリュエーションのための資料収集を進めているが、譲り渡し側から「固定資産台帳は作成しておらず提出できない」と言われた。Yの対応として、スキルマップに照らし最も適切なものはどれか。", "ch": ["必要資料は思いつくたびに個別に追加依頼し、全て揃った段階で算定する。", "資料が揃わない以上バリュエーションは一切実施できないと伝え、手続を中止する。", "収集した範囲で算定する旨を依頼者に明確に伝えたうえで算定する。", "固定資産の金額を支援者の推測で補い、確定値として算定結果を提示する。"], "a": 2, "k": null, "ex": "スキルマップは、必要資料をリスト化し理由を説明のうえまとめて依頼すること、収集不可能な資料がある場合は収集した範囲で算定する旨を明確に伝えることを求めている。五月雨式の依頼は依頼者の負担となる。", "cn": ["誤り。必要資料はリスト化してまとめて依頼すべきで、五月雨の依頼は負担となる。", "誤り。収集不可能な資料があっても、収集した範囲で算定する旨を伝えて算定する。", "正しい。SM p.44の記載どおりである。", "誤り。推測で補った確定値の提示は、範囲を明示して算定する考え方に反する。"], "src": "SM p.44", "ref": "n3-3", "lv": 1}, {"id": "FIN-017", "sub": "財務・税務", "top": "財務基礎", "typ": "組合せ", "stem": "仲介者・FAの手数料に関する次の文章の空欄A〜Cに入る語句の組合せとして、正しいものはどれか。\n「基本合意締結時等、案件完了前の一定時点や一定の成果に対して発生する中間金は（A）とも呼ばれ、成功報酬に（B）ことが多い。主に月ごとに定期的に定額で発生する月額報酬は（C）とも呼ばれる。」", "ch": ["A リテーナーフィー　B 含めない　C マイルストーンフィー", "A マイルストーンフィー　B 含める（内金とする）　C リテーナーフィー", "A マイルストーンフィー　B 含めない　C リテーナーフィー", "A リテーナーフィー　B 含める（内金とする）　C マイルストーンフィー"], "a": 1, "k": null, "ex": "中間金はマイルストーンフィーとも呼ばれ、成功報酬に含める（内金とする）ことが多い。月額報酬は定額顧問料・リテーナーフィーとも呼ばれ、定期的に生じるため契約期間を確認しておくべきとされる。", "cn": ["誤り。中間金と月額報酬の別名が逆で、Bも誤りである。", "正しい。GL p.63-64の記載どおりである。", "誤り。中間金は成功報酬に含めることが多い。", "誤り。中間金と月額報酬の別名が逆である。"], "src": "GL p.63-64", "ref": "n3-10", "lv": 1}, {"id": "FIN-018", "sub": "財務・税務", "top": "財務基礎", "typ": "正しい", "stem": "ガイドラインが示す成功報酬の「基準となる価額」に関する記述として、正しいものはどれか。", "ch": ["純資産額は、債務超過の会社において最もよく用いられる基準価額である。", "譲渡額を基準とする場合でも、譲り受け側の負担感が増すことはない。", "移動総資産額は主に譲渡額に負債額を加えた額であり、同じ譲渡額でも借入金が多いほど手数料が高くなる。", "3つの基準価額のうち、報酬額が最も高くなりやすいのは純資産額である。"], "a": 2, "k": null, "ex": "基準価額には譲渡額・移動総資産額・純資産額がある。移動総資産額は主に譲渡額に負債額を加えた額で、負債（特に借入金）が多いほど手数料が高くなる。純資産額は債務超過ならゼロ以下となるため、その場合は譲渡額や移動総資産額を使うことが多い。", "cn": ["誤り。債務超過ではゼロ以下となるため、譲渡額や移動総資産額を使うことが多い。", "誤り。譲り受け側は負担感が増すため、定額等の別方式もあるとされる。", "正しい。GL p.64の記載どおりである。", "誤り。報酬額が高くなるのは移動総資産を基準とする場合である（GL p.69）。"], "src": "GL p.64, 69", "ref": "n3-11", "lv": 1}, {"id": "FIN-019", "sub": "財務・税務", "top": "財務基礎", "typ": "組合せ", "stem": "資料1が示すレーマン方式の「基準となる価額」の類型について、空欄A〜Cに入る語句の組合せとして正しいものはどれか。\n「オーナー受取額レーマンの基準は株式価額＋（A）、企業価値レーマンの基準は株式価額＋（B）、移動総資産レーマンの基準は株式価額＋（C）である。」", "ch": ["A ネット有利子負債　B 役員借入金　C 有利子負債＋その他の負債", "A 役員借入金　B 有利子負債＋その他の負債　C ネット有利子負債", "A 有利子負債＋その他の負債　B ネット有利子負債　C 役員借入金", "A 役員借入金　B ネット有利子負債　C 有利子負債＋その他の負債"], "a": 3, "k": null, "ex": "資料1は、株価レーマン（株式価額）、オーナー受取額レーマン（株式価額＋役員借入金）、企業価値レーマン（株式価額＋ネット有利子負債）、移動総資産レーマン（株式価額＋有利子負債＋その他の負債）の4類型を示す。報酬基準額は株価が最も多い。", "cn": ["誤り。AとBが逆である。", "誤り。BとCが逆である。", "誤り。AとCが逆である。", "正しい。資料1 p.9の整理どおりである。"], "src": "資料1 p.9", "ref": "n3-12", "lv": 2}, {"id": "FIN-020", "sub": "財務・税務", "top": "財務基礎", "typ": "計算", "stem": "譲渡額（株式価額）を基準とするレーマン方式（5億円以下の部分5%、5億円超10億円以下の部分4%、10億円超50億円以下の部分3%）で、譲渡額が8億円の場合の成功報酬（税抜）として正しいものはどれか。最低手数料は考慮しない。", "ch": ["3,200万円", "3,700万円", "4,000万円", "4,070万円"], "a": 1, "k": null, "ex": "レーマン方式は、各階層に該当する部分にそれぞれの割合を乗じて合算する。5億円×5%＝2,500万円、（8億円−5億円）×4%＝1,200万円で、合計3,700万円となる。", "cn": ["誤り。8億円全体に4%を乗じた額である。", "正しい。2,500万円＋1,200万円＝3,700万円。", "誤り。8億円全体に5%を乗じた額である。", "誤り。3,700万円に消費税10%を加えた税込額である。"], "src": "GL p.64-65／資料1 p.9", "ref": "n3-12", "lv": 2}, {"id": "FIN-021", "sub": "財務・税務", "top": "財務基礎", "typ": "計算", "stem": "ガイドラインに例示されたレーマン方式（5億円以下5%、5億円超10億円以下4%、10億円超50億円以下3%、50億円超100億円以下2%、100億円超1%）で、基準となる価額が60億円の場合の成功報酬（税抜）として正しいものはどれか。", "ch": ["1億2,000万円", "1億8,000万円", "1億8,500万円", "3億円"], "a": 2, "k": null, "ex": "5億円×5%＝2,500万円、5億円×4%＝2,000万円、40億円×3%＝1億2,000万円、10億円×2%＝2,000万円を合算して1億8,500万円となる。", "cn": ["誤り。60億円全体に2%を乗じた額である。", "誤り。60億円全体に3%を乗じた額である。", "正しい。2,500＋2,000＋12,000＋2,000＝18,500万円。", "誤り。60億円全体に5%を乗じた額である。"], "src": "GL p.65", "ref": "n3-12", "lv": 3}, {"id": "FIN-022", "sub": "財務・税務", "top": "財務基礎", "typ": "計算", "stem": "顧問税理士の紹介でM&A専門業者に依頼し、事業譲渡（譲渡額5,000万円）が6か月で成立した。手数料体系は、着手金50万円（別途）、月額報酬10万円（別途）、成功報酬は譲渡額の一律4%（最低手数料300万円）である。消費税等を10%とした場合、譲り渡し側が支払う手数料総額（税込）として正しいものはどれか。", "ch": ["341万円", "385万円", "410万円", "451万円"], "a": 3, "k": null, "ex": "着手金50万円×110%＝55万円、月額報酬10万円×6か月×110%＝66万円。成功報酬は5,000万円×4%＝200万円が最低手数料300万円を下回るため300万円×110%＝330万円。合計55＋66＋330＝451万円（GL事例3と同じ考え方）。", "cn": ["誤り。最低手数料を適用せず、成功報酬を220万円（税込）とした額である。", "誤り。月額報酬を計上していない額である。", "誤り。消費税を加えていない税抜額である。", "正しい。55＋66＋330＝451万円。"], "src": "GL p.66-67（事例3）", "ref": "n3-13", "lv": 2}, {"id": "FIN-023", "sub": "財務・税務", "top": "財務基礎", "typ": "計算", "stem": "営業を受けた業者に依頼し、株式譲渡（譲渡額4,000万円）が成立した。手数料は成功報酬のみで、譲渡額基準のレーマン方式（5億円以下の部分5%）、最低手数料1,000万円である。消費税等を10%とした場合、譲渡額から手数料（税込）を差し引いた額として正しいものはどれか。", "ch": ["2,900万円", "3,000万円", "3,780万円", "3,800万円"], "a": 0, "k": null, "ex": "4,000万円×5%＝200万円は最低手数料1,000万円を下回るため最低手数料が適用され、税込1,100万円となる。譲渡額4,000万円−1,100万円＝2,900万円。小規模案件では最低手数料の適用で手数料の割合が高くなる（GL事例4と同じ考え方）。", "cn": ["正しい。4,000万円−1,100万円＝2,900万円。", "誤り。最低手数料を税抜のまま控除した額である。", "誤り。最低手数料を適用せず220万円（税込）を控除した額である。", "誤り。最低手数料を適用せず、税抜200万円を控除した額である。"], "src": "GL p.68（事例4）", "ref": "n3-13", "lv": 2}, {"id": "FIN-024", "sub": "財務・税務", "top": "財務基礎", "typ": "計算", "stem": "金融機関の紹介でM&A専門業者に依頼し、株式譲渡（譲渡額4億円、負債2億円）が成立した。手数料は、中間金100万円（成功報酬に含む）と、移動総資産額（譲渡額＋負債）を基準とするレーマン方式（5億円以下5%、5億円超10億円以下4%）の成功報酬である。消費税等を10%とした場合、手数料総額（税込）として正しいものはどれか。", "ch": ["2,200万円", "3,080万円", "3,190万円", "3,300万円"], "a": 2, "k": null, "ex": "基準は移動総資産額6億円。成功報酬は5億円×5%＋1億円×4%＝2,900万円、税込3,190万円。中間金110万円（税込）は成功報酬に含まれるので、成功報酬の支払時に控除され（3,190−110＝3,080万円）、総額は110＋3,080＝3,190万円となる（GL事例2と同じ考え方）。", "cn": ["誤り。譲渡額4億円×5%を基準にした税込額である。", "誤り。中間金の支払分を総額に含めていない。", "正しい。中間金110万円＋残額3,080万円＝3,190万円。", "誤り。成功報酬に含まれる中間金を二重に加算した額である。"], "src": "GL p.67（事例2）", "ref": "n3-13", "lv": 3}, {"id": "FIN-025", "sub": "財務・税務", "top": "財務基礎", "typ": "正しい", "stem": "仲介者・FAとの契約前に依頼者が確認すべき手数料に関する事項として、ガイドラインに照らし正しいものはどれか。", "ch": ["報酬率だけでなく、成立する譲渡額に応じて最終的に支払う報酬の絶対額を確認することが重要である。", "報酬基準額が移動総資産の場合、譲渡額や純資産を基準とする場合より報酬額は低くなる。", "仲介契約の場合、相手方の手数料は自らの利益に影響しないため、確認する必要はない。", "階層ごとの報酬率が同じであれば、最低手数料や報酬基準額が異なっても支払額に差は生じない。"], "a": 0, "k": null, "ex": "自らの手数料は、成功報酬の報酬率・報酬基準額・最低手数料の額・報酬の発生タイミングの4点を確認し、最終的に支払う報酬の絶対額を確認することが重要とされる。仲介の場合、相手方の手数料の額は自らの利益に影響する構造にある。", "cn": ["正しい。GL p.69の記載どおりである。", "誤り。移動総資産を基準とすると、報酬額は高くなる。", "誤り。相手方の手数料は自らの利益に影響する構造であり、算定基準の説明を求めるべきである。", "誤り。同水準の報酬率でも最低手数料や報酬基準額が違えば支払額に差が出る。"], "src": "GL p.69-71", "ref": "n3-14", "lv": 2}, {"id": "FIN-026", "sub": "財務・税務", "top": "財務基礎", "typ": "誤り", "stem": "資料2に示された、M&A支援機関登録制度のデータを用いた手数料の初期的分析の結果として、誤っているものはどれか。", "ch": ["案件規模が小さいほど、最低手数料の適用により手数料率が高くなる傾向がある。", "移動総資産レーマン方式を採る支援機関の案件は、譲渡価格が同程度であれば手数料が低い傾向がある。", "譲渡価額1千万円超〜5千万円以下の案件では、東京大都市圏の方が手数料率（中央値）が低い。", "仲介・FA・金融機関・経営コンサルの間で、手数料率に大きな差分は見受けられない。"], "a": 1, "k": null, "ex": "資料2の要点は、小規模ほど手数料率が高い、東京圏の方が低い、支援機関間で大差がない、総資産（移動総資産）レーマン方式を採る機関の案件は譲渡価格が同程度でも手数料が高い傾向、の4点である。手数料率は報酬金額÷譲渡価額で算出される。", "cn": ["正しい。譲渡側純資産5百万円超〜1千万円以下では中央値30.0%、5億円超では4.3%である。", "誤り。移動総資産レーマン方式の案件は手数料が高い傾向とされる。", "正しい。中央値は東京大都市圏20.0%、それ以外27.1%である。", "正しい。機関種別ではなく業務内容に対する水準を議論する必要があるとされる。"], "src": "資料2 p.23-26", "ref": "n3-15", "lv": 2}, {"id": "FIN-027", "sub": "財務・税務", "top": "財務基礎", "typ": "正しい", "stem": "資料2で示された「仲介・FA手数料の簡易計算ツール」に関する記述として、正しいものはどれか。", "ch": ["算出できるのは各レーマン方式の成功報酬のみで、定額方式等は各支援機関に問い合わせる。", "算定結果は、消費税10%を含む税込額で表示される。", "事業譲渡や赤字企業の株式譲渡も算定対象に含まれる。", "着手金・中間金を含めた手数料総額を算出できる。"], "a": 0, "k": null, "ex": "このツールで算出できるのは各レーマン方式の成功報酬のみ（着手金・中間金等を除く）で、結果は税抜で表示される。算定対象は黒字企業における株式譲渡で、定額方式やその他の方式は各支援機関に問い合わせることとされる。", "cn": ["正しい。資料2 p.48の記載どおりである。", "誤り。算定結果は全て税抜表示である。", "誤り。赤字・債務超過企業、事業譲渡、その他スキームは対象外である。", "誤り。着手金・中間金等は除かれ、成功報酬のみを算出する。"], "src": "資料2 p.47-49", "ref": "n3-16", "lv": 1}, {"id": "FIN-028", "sub": "財務・税務", "top": "財務DD", "typ": "誤り", "stem": "スキルマップが挙げる財務DDの主な調査として、誤っているものはどれか。", "ch": ["譲り渡し側従業員の個人別の人事評価の妥当性の判定", "バリュエーションに影響のある諸項目（時価（実態）純資産、正常収益力、運転資本分析、設備投資分析、ネットデット分析）", "買収後に顕在化する恐れのある税務リスクの把握", "スタンドアローン・イシューの把握"], "a": 0, "k": null, "ex": "SMが挙げる財務DDの主な調査は、①バリュエーションに影響のある諸項目、②税務リスクの把握、③スタンドアローン・イシューの把握、④PMIに影響を与える事象の把握、⑤一定の目的／項目での検証手続の5つである。書面上だけでなく現場で現物を確認することが肝要とされる。", "cn": ["誤り。財務DDの主な調査5項目に含まれていない。", "正しい。主な調査の1つ目である。", "正しい。主な調査の2つ目である。", "正しい。主な調査の3つ目である。"], "src": "SM p.102", "ref": "n3-18", "lv": 1}, {"id": "FIN-029", "sub": "財務・税務", "top": "財務DD", "typ": "正しい", "stem": "ガイドライン（公認会計士の項）における財務DDに関する記述として、正しいものはどれか。", "ch": ["株式譲渡スキームでは、簿外債務・偶発債務も含めた全般的な調査を要することが多い。", "調査範囲・手法は、主に譲り渡し側が前提とするスキームや許容できるリスクで決まる。", "多大な簿外債務が見つかった場合でも、スキームを変更することはない。", "財務DDは、一般に基本合意締結前に実施される。"], "a": 0, "k": null, "ex": "財務DDの目的は譲り渡し側の事業実態を調査しリスク要因を把握することで、一般に基本合意締結後に実施される。調査範囲・手法は主に譲り受け側が前提とするスキーム等で異なり、依頼者と公認会計士が事前に合意して決める（合意された手続）。多大な簿外債務等が見つかれば株式譲渡から事業譲渡へスキーム変更することもある。", "cn": ["正しい。GL p.114の記載どおりである。", "誤り。主に譲り受け側が前提とするスキーム、許容できるリスク、時間・コストで異なる。", "誤り。株式譲渡から事業譲渡へスキームを変更することもある。", "誤り。一般に基本合意締結後に実施される。"], "src": "GL p.114", "ref": "n3-18", "lv": 2}, {"id": "FIN-030", "sub": "財務・税務", "top": "財務DD", "typ": "最も適切", "stem": "仲介者Zは、譲り受け側から「費用を節約したいので、財務DDも仲介者の方で実施し結論を出してほしい」と依頼された。Zの対応として、最も適切なものはどれか。", "ch": ["両当事者の同意が得られれば、仲介者自らDDを実施し、その結論を両当事者に通知する。", "利益相反防止の観点からDDは自ら実施せず、外部の専門家等への依頼を勧め、自らは開示資料の整理支援やスケジュール管理にとどめる。", "DDを省略しても最終契約への影響はないため、DDを実施しないよう助言する。", "譲り渡し側に有利な結果となるよう、DDの調査範囲を仲介者が限定して実施する。"], "a": 1, "k": null, "ex": "仲介者は利益相反防止の観点からDDを自ら実施すべきでなく、バリュエーションやDDの結論を決定しない。開示資料の整理支援やスケジュール管理は可能である。DDの調査が十分でないと、最終契約で譲り渡し側が負う義務の負担増加に繋がりうる。", "cn": ["誤り。仲介者はDDを自ら実施すべきでなく、結論も決定しない。", "正しい。GL p.74, 95の考え方に沿った対応である。", "誤り。DDが不十分だと表明保証の範囲や補償額等の負担増加に繋がりうる。", "誤り。一方当事者に偏った調査は利益相反にあたり、不適切である。"], "src": "GL p.70, 74, 95", "ref": "n3-18", "lv": 1}, {"id": "FIN-031", "sub": "財務・税務", "top": "財務DD", "typ": "全て選べ", "stem": "スキルマップが示す財務DDの調査項目とその目的の組合せとして、適切なものを全て選んだものはどれか。\nア 内部統制に係る調査 ― レポーティングの実態を調査し、PMIで改善すべき点を明確化する\nイ 会計方針の把握 ― 正常収益力とPMIへの影響を把握する\nウ キャッシュフロー分析 ― 内部統制上の不備を洗い出し、社内規程を整備する\nエ BSの検証 ― ネットデット・調整後純資産を分析する", "ch": ["ア、イ", "ア、ウ、エ", "ア、イ、エ", "ア、イ、ウ、エ"], "a": 2, "k": null, "ex": "SMでは、内部統制はPMIで改善すべき点の明確化、会計方針は正常収益力とPMIへの影響の把握、CF分析は正常な運転資本水準と必要な設備投資の把握、BSの検証はネットデット・調整後純資産の分析を目的とする。ウは目的が誤りである。", "cn": ["誤り。エも適切である。", "誤り。ウは不適切で、イが適切である。", "正しい。ア・イ・エが適切である。", "誤り。ウのCF分析の目的は正常な運転資本水準と必要な設備投資の把握である。"], "src": "SM p.102-113", "ref": "n3-19", "lv": 2}, {"id": "FIN-032", "sub": "財務・税務", "top": "財務DD", "typ": "正しい", "stem": "内部統制に係る調査において、スキルマップがJ-SOX法（内部統制報告制度）における「経営者による内部統制の整備・評価」の書類として挙げるものの組合せとして、正しいものはどれか。", "ch": ["業務記述書・就業規則・監査報告書", "固定資産台帳・フローチャート・内部統制報告書", "勘定科目内訳明細書・業務記述書・監査報告書", "業務記述書・フローチャート・リスク・コントロール・マトリックス"], "a": 3, "k": null, "ex": "SMは、J-SOX法における経営者による内部統制の整備・評価の書類として、業務記述書・（業務）フローチャート・リスク・コントロール・マトリックスを挙げる。内部統制報告書は、経営者が評価結果をまとめ監査人が監査する報告書である。譲り受け側が上場企業の場合、J-SOX法等への対応の把握が必要で、実施体制整備とリードタイムを考慮する。", "cn": ["誤り。就業規則や監査報告書は挙げられていない。", "誤り。内部統制報告書は経営者が評価結果をまとめ監査人が監査する報告書であり、整備・評価の書類としては挙げられていない。", "誤り。勘定科目内訳明細書や監査報告書は挙げられていない。", "正しい。SM p.103の記載どおりである。"], "src": "SM p.103-104", "ref": "n3-20", "lv": 2}, {"id": "FIN-033", "sub": "財務・税務", "top": "財務DD", "typ": "誤り", "stem": "スキルマップが示す、財務DDにおける会計方針の把握の着眼点（12項目）に含まれないものはどれか。", "ch": ["収益の認識基準", "役員報酬の支給水準", "棚卸資産の評価方法", "税効果会計の適用"], "a": 1, "k": null, "ex": "会計方針の着眼点は、収益の認識基準、費用の計上基準、原価計算の方法、外貨建資産負債の換算方法、棚卸資産の評価方法、固定資産の減価償却方法、有価証券の評価方法、引当金の計上基準、税効果会計、減損会計、資産除去債務会計基準、リース会計基準の12項目である。会計方針の変更は各期の比較可能性に影響する。", "cn": ["含まれる。着眼点の1つ目である。", "含まれない。役員報酬の水準は会計方針の着眼点ではない。", "含まれる。着眼点の5つ目である。", "含まれる。着眼点の9つ目である。"], "src": "SM p.105", "ref": "n3-21", "lv": 2}, {"id": "FIN-034", "sub": "財務・税務", "top": "財務DD", "typ": "組合せ", "stem": "収益力分析に関する次の文章の空欄A〜Cに入る語句の組合せとして、正しいものはどれか。\n「過年度PLの突発的・一時的な取引を除外して基礎的収益力を計算するのが（A）であり、カーブアウト時の本社費用の除外やスタンドアローン・コストの追加など、M&A後に想定される費用・収益の増減を調整するのが（B）である。算出したM&A後の収益・費用の増減は、（C）に使用する。」", "ch": ["A プロフォーマ調整　B 正常化調整　C バリュエーションでの調整", "A 正常化調整　B プロフォーマ調整　C 表明保証の範囲の決定のみ", "A 正常化調整　B プロフォーマ調整　C バリュエーションでの調整", "A プロフォーマ調整　B 正常化調整　C 表明保証の範囲の決定のみ"], "a": 2, "k": null, "ex": "正常化調整は過年度PLの突発的・一時的な取引を除外して基礎的収益力を計算する調整、プロフォーマ調整はM&A後に想定される費用・収益の増減（廃止事業の除外、本社費用の除外、スタンドアローン・コストの追加等）の調整である。これらはバリュエーションでの調整に使用され、事業計画にも反映される。", "cn": ["誤り。AとBが逆である。", "誤り。Cはバリュエーションでの調整に使用する。", "正しい。SM p.106の記載どおりである。", "誤り。A・B・Cのいずれも誤りである。"], "src": "SM p.106", "ref": "n3-22", "lv": 2}, {"id": "FIN-035", "sub": "財務・税務", "top": "財務DD", "typ": "計算", "stem": "財務DDにおけるBSの検証で、次の資料から運転資本とネットデットを計算した場合の組合せとして、正しいものはどれか（単位は百万円。現預金は全額非事業資産とみなす）。\n売上債権120、棚卸資産80、仕入債務70、有利子負債300、現預金100", "ch": ["運転資本270・ネットデット200", "運転資本130・ネットデット200", "運転資本130・ネットデット400", "運転資本270・ネットデット400"], "a": 1, "k": null, "ex": "運転資本＝売上債権＋棚卸資産−仕入債務＝120＋80−70＝130。ネットデット＝有利子負債−現金等の非事業資産＝300−100＝200。ネットデット等の分析結果はバリュエーションだけでなくスキームや最終契約書等の検討材料にもなる。", "cn": ["誤り。仕入債務を加算して運転資本を計算している。", "正しい。130と200である。", "誤り。ネットデットで現預金を加算している。", "誤り。運転資本・ネットデットとも誤りである。"], "src": "SM p.108-109", "ref": "n3-24", "lv": 1}, {"id": "FIN-036", "sub": "財務・税務", "top": "財務DD", "typ": "正しい", "stem": "BSの検証におけるデットライクアイテム・キャッシュライクアイテムの例として、スキルマップの記載に照らし正しいものはどれか。", "ch": ["資産除去債務や退職給付債務は、デットライクアイテムの例である。", "保険積立金は、デットライクアイテムの例である。", "リース債務は、キャッシュライクアイテムの例である。", "有価証券は、デットライクアイテムの例である。"], "a": 0, "k": null, "ex": "SMでは、デットライクアイテムの例としてリース債務・退職給付債務・資産除去債務・偶発債務等を、キャッシュライクアイテムの例として有価証券・保険積立金・事業外資産等を挙げる。ネットデット分析ではこれらも考慮する。", "cn": ["正しい。いずれもデットライクアイテムの例である。", "誤り。保険積立金はキャッシュライクアイテムの例である。", "誤り。リース債務はデットライクアイテムの例である。", "誤り。有価証券はキャッシュライクアイテムの例である。"], "src": "SM p.102, 108-109", "ref": "n3-24", "lv": 2}, {"id": "FIN-037", "sub": "財務・税務", "top": "財務DD", "typ": "誤り", "stem": "財務DDにおけるキャッシュフロー分析に関する記述として、誤っているものはどれか。", "ch": ["運転資本分析では、過去の季節変動やトレンドを分析し、正常な運転資本水準を導出する。", "設備投資水準と減価償却費を比較し、維持更新投資のタイミング・水準を算出する。", "新規事業や規模拡大のための設備投資の妥当性は、財務DDのみで十分に判断できる。", "必要な投資が実施されてきたか、事業計画に織り込まれているかを検討する。"], "a": 2, "k": null, "ex": "CF分析では、運転資本分析で正常な運転資本水準を導出し、固定資産・設備投資分析で必要な投資の実施状況や事業計画への織り込みを検討する。新規事業や規模拡大の設備投資の妥当性は財務DDだけでは判断が困難で、ビジネスDD等で補完する。", "cn": ["正しい。SM p.107の記載どおりである。", "正しい。維持更新投資の算出方法として示されている。", "誤り。財務DDだけでは困難で、ビジネスDD等で補完するとされる。", "正しい。固定資産・設備投資分析の内容である。"], "src": "SM p.107", "ref": "n3-23", "lv": 2}, {"id": "FIN-038", "sub": "財務・税務", "top": "財務DD", "typ": "最も適切", "stem": "A社の一事業部門を切り出して譲渡する案件で、譲受後すぐには基幹システムを分離できない見込みである。カーブアウト財務諸表の検証に関する対応として、最も適切なものはどれか。", "ch": ["短期間での分離が難しい機能について、移行期間業務委託契約（TSA）を最終契約の付随契約として締結することを検討する。", "共通費は通常精緻に見積もられているため、配賦額の検証は不要とする。", "システム分離は財務に影響しないため、ITコストの検討は行わない。", "切り出し対象の財務諸表は譲り渡し側の配賦計算によるものなので、前提を変えずにそのまま採用する。"], "a": 0, "k": null, "ex": "カーブアウト財務諸表は譲り渡し側内部の前提で配賦計算されているため、切り出し後を想像し前提の変化を捉えて検証する。共通費が精緻に見積もられている例は稀で、システム・インフラの分離（新規ライセンス費用等）も論点となる。短期間の分離が難しい場合はTSAを最終契約の付随契約として締結する。", "cn": ["正しい。SM p.110の記載どおりである。", "誤り。共通費が精緻に見積もられている例は稀とされる。", "誤り。ITアプリの分離や新規ライセンス費用はスタンドアローン・イシューの論点である。", "誤り。切り出し後の前提の変化を捉えて検証する必要がある。"], "src": "SM p.110-111", "ref": "n3-25", "lv": 2}, {"id": "FIN-039", "sub": "財務・税務", "top": "最終契約（財務）", "typ": "誤り", "stem": "スキルマップが示す、最終契約日とクロージング日の間に事業価値の差額が生じた場合の調整方法として、誤っているものはどれか。", "ch": ["差額の全額を調整する方法", "一定の金額を超えた部分のみを調整額とする方法", "差額が生じた場合は必ず最終契約を解除し、交渉をやり直す方法", "調整額に上限をつける方法"], "a": 2, "k": null, "ex": "SMは、差額の調整方法として、全額を調整する方法、一定の金額を超えた部分のみを調整する方法、上方又は下方調整のみを行う方法、調整額に上限をつける方法等を挙げる。譲渡額調整を行う場合は最終契約に多くの規定が必要で時間を要する。", "cn": ["正しい。調整方法の1つ目である。", "正しい。調整方法の2つ目である。", "誤り。調整方法として挙げられていない。", "正しい。調整方法の4つ目である。"], "src": "SM p.113", "ref": "n3-27", "lv": 2}, {"id": "FIN-040", "sub": "財務・税務", "top": "財務DD", "typ": "正しい", "stem": "財務・税務DDの結果を譲渡額に反映する場面に関する記述として、正しいものはどれか。", "ch": ["DCF法では、正常収益力の修正は将来CFに影響しないため、譲渡額に反映しない。", "時価純資産法では、資産の含み損益や簿外債務が検出された場合に譲渡額へ反映する。", "財務・税務DDで検出されるのはリスク要因のみであり、含み益や削減可能費用が検出されることはない。", "簿外債務が懸念される場合でも、株式譲渡から事業譲渡へのスキーム変更は選択肢とならない。"], "a": 1, "k": null, "ex": "時価純資産法では含み損益や簿外債務、DCF法や類似会社比較法では正常収益力が算出された場合に譲渡額へ反映する。DDでは含み益・簿外資産・削減可能費用等のポジティブな事項も検出されうるため、リスク要因だけが反映されないよう調整する。", "cn": ["誤り。正常収益力の修正は将来CFにも影響し、反映される。", "正しい。SM p.139の記載どおりである。", "誤り。含み益・簿外資産・削減可能費用等も検出されうる。", "誤り。簿外債務が懸念される場合は事業譲渡へのスキーム変更も検討される。"], "src": "SM p.138-139", "ref": "n3-28", "lv": 2}, {"id": "FIN-041", "sub": "財務・税務", "top": "財務DD", "typ": "全て選べ", "stem": "DDで譲り渡し側に資料を依頼する際、認識の齟齬を避けるため明記すべきとされる事項として、適切なものを全て選んだものはどれか。\nア 資料名\nイ 対象年度\nウ 資料形式\nエ 原本閲覧の要否", "ch": ["ア、イ", "ア、イ、ウ", "イ、ウ、エ", "ア、イ、ウ、エ"], "a": 3, "k": null, "ex": "SMは、資料依頼の際に認識齟齬を避けるため、資料名、対象年度、資料形式、原本閲覧の要否を明記するとしている。請求すべき資料の例には、営業報告書、財務諸表、税務申告書、販管費明細、投資実績・計画、減価償却費の明細等がある。", "cn": ["誤り。ウ・エも明記すべき事項である。", "誤り。エも明記すべき事項である。", "誤り。アも明記すべき事項である。", "正しい。4つ全てが挙げられている。"], "src": "SM p.87", "ref": "n3-29", "lv": 1}, {"id": "FIN-042", "sub": "財務・税務", "top": "税務DD", "typ": "誤り", "stem": "税務DDに関する記述として、誤っているものはどれか。", "ch": ["対象会社の経営陣や顧問税理士等に対するインタビューを行う。", "過去の税務申告書のレビューを行う。", "税務DDは必ず過去10年分を対象年度とし、調査手法も法令で一律に定められている。", "過去の組織再編、資本取引等の税務処理を把握する。"], "a": 2, "k": null, "ex": "税務DDは潜在的な税務リスクの把握等の観点から必要に応じて行い、依頼者と協議して調査対象範囲・対象年度・手法を決める。一般的な手続は、インタビュー、税務申告書のレビュー、税務調査・訴訟等の把握、組織再編・資本取引等の税務処理の把握、欠損金の使用可能性や各種税制の適用状況の把握等である。", "cn": ["正しい。一般的な調査手続の1つ目である。", "正しい。一般的な調査手続の2つ目である。", "誤り。対象範囲・対象年度・手法は依頼者と協議して決める。", "正しい。一般的な調査手続の4つ目である。"], "src": "GL p.119／SM p.112", "ref": "n3-26", "lv": 1}, {"id": "FIN-043", "sub": "財務・税務", "top": "税務DD", "typ": "最も適切", "stem": "株式譲渡による買収を検討している譲り受け側に対し、税務DDの意義を説明する内容として、最も適切なものはどれか。", "ch": ["クロージング後に申告漏れ等が発覚すると譲り受け側が納税を負担する恐れがあるため、消費税・源泉所得税等の諸税も含めて個別に検証する。", "クロージング後に過去の申告漏れが発覚しても、追徴課税は旧株主が当然に負担するため、税務DDの必要性は低い。", "税務DDは法人税のみを対象とし、消費税・源泉所得税・償却資産税・関税等は検証対象外とする。", "顧問税理士は守秘義務があるため、顧問先のDDには協力しないことが望ましいとされる。"], "a": 0, "k": null, "ex": "クロージング後に申告漏れ・記載ミスが発覚すると譲り受け側が納税を負担する恐れがあり、多額の追徴課税は経営不振の原因にもなりうる。税務DDでは消費税・源泉所得税・償却資産税・関税等の諸税も個別に検証する。顧問税理士は必要資料の提供等に積極的に協力することが望ましいとされる。", "cn": ["正しい。SM p.112の記載に沿った説明である。", "誤り。株式譲渡では譲り受け側が納税を負担する恐れがあるとされる。", "誤り。諸税も個別に検証する。", "誤り。顧問税理士はDDに積極的に協力することが望ましいとされる。"], "src": "SM p.112／GL p.119", "ref": "n3-26", "lv": 1}, {"id": "FIN-044", "sub": "財務・税務", "top": "税務基礎", "typ": "正しい", "stem": "資料2に示された試験科目「財務・税務」の位置付けに関する記述として、正しいものはどれか。", "ch": ["財務・税務科目は、財務・税務リスクを理解し、公認会計士・税理士と適切に連携して依頼者を支援するための基礎知識を判定する。", "合格者には、税理士と同等に税務代理・税務相談を行える水準が求められる。", "資格のない支援者でも、契約外の無償の税務相談として株主の譲渡税額を個別に試算することは適法に行える。", "財務・税務科目の出題のうち、税務が過半を占める。"], "a": 0, "k": null, "ex": "財務・税務科目の目的は、公認会計士・税理士と適切に連携して依頼者を支援するための基礎知識の判定であり、合格者像は専門家が必要な論点かどうかを判断できる水準である。独占業務（税理士法第52条等）に抵触しないことが前提で、無償でも税額試算は適法に行えない。税務は科目の一部（3〜5%程度）にとどまる。", "cn": ["正しい。資料2 p.9の科目目的どおりである。", "誤り。専門家が必要な論点かを判断できる水準であり、独占業務に抵触しないことが前提である。", "誤り。無償でも適法に行えない（サンプル問題④の（イ））。", "誤り。財務・税務科目20〜23%程度のうち、税務は3〜5%程度である。"], "src": "資料2 p.3, 9-12, 16", "ref": "n3-31", "lv": 2}, {"id": "FIN-045", "sub": "財務・税務", "top": "スキームの初期的な検討（税務）", "typ": "計算", "stem": "個人株主が保有する非上場株式の全部を株式譲渡し、譲渡益が1億円生じた。ガイドラインに記載された税率に基づく税額（所得税・住民税等）として正しいものはどれか。他の所得や控除は考慮しない。", "ch": ["1,510万5,000円", "2,000万円", "2,031万5,000円", "5,594万5,000円"], "a": 2, "k": null, "ex": "株式譲渡では、経営者個人の譲渡益に対し分離課税（税率20.315%）で課税関係が終了する。1億円×20.315%＝2,031万5,000円となる。事業譲渡の対価を配当や役員報酬で還流する場合の総合課税（15.105%〜55.945%）と区別する。", "cn": ["誤り。総合課税の最低税率15.105%を用いた額である。", "誤り。20%で計算しており、税率20.315%と異なる。", "正しい。1億円×20.315%＝2,031万5,000円。", "誤り。総合課税の最高税率55.945%を用いた額である。"], "src": "GL p.118", "ref": "n3-32", "lv": 1}, {"id": "FIN-046", "sub": "財務・税務", "top": "スキームの初期的な検討（税務）", "typ": "誤り", "stem": "事業譲渡に係る税務上の特徴として、ガイドラインの記載に照らし誤っているものはどれか。", "ch": ["税務上ののれん（資産調整勘定）が生じた場合、損金算入できる。", "譲渡対価は法人に帰属し、益金に法人税等が課税される。", "譲渡対価を配当や役員報酬で経営者に還流する場合、総合課税（税率15.105%〜55.945%）の対象となる。", "減価償却資産等の譲渡は消費税の課税対象とならず、不動産の取得時にも不動産取得税・登録免許税は課されない。"], "a": 3, "k": null, "ex": "事業譲渡では、のれん（資産調整勘定）の損金算入が可能で、譲渡対価は法人に帰属し法人税等が課税される。経営者への還流は総合課税となる。また減価償却資産等は消費税の課税売上となり、不動産取得時には不動産取得税・登録免許税がかかる。", "cn": ["正しい。GL p.118の記載どおりである。", "正しい。対価は法人に帰属する。", "正しい。還流時は総合課税の対象となる。", "誤り。減価償却資産等は消費税の課税売上で、不動産取得税・登録免許税もかかる。"], "src": "GL p.117-118", "ref": "n3-32", "lv": 2}, {"id": "FIN-047", "sub": "財務・税務", "top": "スキームの初期的な検討（税務）", "typ": "組合せ", "stem": "スキーム別の税務に関する次の文章の空欄A〜Cに入る語句の組合せとして、正しいものはどれか。\n「株式譲渡では、株式取得後に合併等をした場合において一定の要件を満たしたときは、対象企業の欠損金を（A）。事業譲渡では、総合課税を避ける観点から、（B）となる役員退職慰労金の支給と併せて検討することもあり得る。また事業譲渡は、株式の分散等で株式譲渡が困難でも、（C）の可決承認が可能な場合には有効である。」", "ch": ["A 引き継ぐことはできない　B 分離課税　C 株主総会の普通決議", "A 引き継ぐことができる　B 分離課税　C 株主総会の特別決議", "A 引き継ぐことができる　B 総合課税　C 株主総会の普通決議", "A 引き継ぐことはできない　B 総合課税　C 株主総会の特別決議"], "a": 1, "k": null, "ex": "株式譲渡は、株式取得後合併等をした場合に一定の要件を満たせば対象企業の欠損金を引き継ぐことができる点がメリットとされる。事業譲渡では、配当・役員報酬での還流が総合課税となるため、分離課税となる役員退職慰労金の支給と併せて検討することもあり、株式の分散等で株式譲渡が困難でも株主総会特別決議の可決承認が可能な場合には有効な手段とされる。", "cn": ["誤り。欠損金は一定の要件で引き継ぐことができ、Cは特別決議である。", "正しい。GL p.118の記載どおりである。", "誤り。役員退職慰労金は分離課税で、Cは特別決議である。", "誤り。欠損金は一定の要件で引き継ぐことができ、役員退職慰労金は分離課税である。"], "src": "GL p.118", "ref": "n3-32", "lv": 2}, {"id": "FIN-048", "sub": "財務・税務", "top": "税務基礎", "typ": "計算", "stem": "代表取締役の役員退職金について、実務上の損金算入限度額の目安（最終月額報酬×役員勤続年数×功績倍率）を計算した場合、正しいものはどれか。\n最終月額報酬：80万円／役員勤続年数：25年／功績倍率：3.0", "ch": ["2,000万円", "2,880万円", "6,000万円", "7億2,000万円"], "a": 2, "k": null, "ex": "限度額の目安＝80万円×25年×3.0＝6,000万円。役員退職金が不相当に高額な場合、超過部分は損金算入されない。SMは、最終契約の譲渡額の論点として損金算入可能な限度額や退職所得にかかる税額の知識を挙げる。", "cn": ["誤り。功績倍率を乗じていない額である。", "誤り。年額報酬960万円に功績倍率のみを乗じ、勤続年数を乗じていない額である。", "正しい。80万円×25年×3.0＝6,000万円。", "誤り。月額ではなく年額報酬（960万円）を用いた額である。"], "src": "SM p.112, 143", "ref": "n3-33", "lv": 1}, {"id": "FIN-049", "sub": "財務・税務", "top": "最終契約（財務）", "typ": "最も適切", "stem": "譲り渡し側のFAであるWは、譲り受け側から「譲渡代金の一部を、クロージング後に役員退職金として分割で支払う形にしたい」との提案を受けた。調整はまだ十分に進んでいない。Wの対応として、最も適切なものはどれか。", "ch": ["役員退職金は金額にかかわらず全額損金算入されるため、できるだけ高額に設定するよう勧める。", "役員退職金で代替する部分は譲渡額に含まれないため、最終契約には何も定めなくてよいと伝える。", "税負担が軽くなるため、調整が不十分な段階でも速やかに受け入れるよう勧める。", "支払不履行等のトラブルの原因となりうることを説明し、盛り込む場合はエスクロー取引の検討・提案も行う。"], "a": 3, "k": null, "ex": "譲渡額をクロージング時に全額支払わない条項（分割払い、役員退職金や顧問料での代替等）は支払不履行等のトラブルの原因となりうるため、調整不十分な段階で安易に提案すべきでなく、盛り込む場合はエスクロー取引の検討・提案も行うべきとされる。役員退職金は不相当に高額だと超過部分が損金不算入となる。", "cn": ["誤り。不相当に高額な場合、超過部分は損金算入されない。", "誤り。トラブル防止のため、盛り込む場合は契約上の手当て（エスクロー等）が必要である。", "誤り。調整不十分な段階で安易に受け入れる・提案すべきでない。", "正しい。SM p.143の記載に沿った対応である。"], "src": "SM p.112, 143, 165", "ref": "n3-33", "lv": 2}, {"id": "FIN-050", "sub": "財務・税務", "top": "税務基礎", "typ": "正しい", "stem": "M&Aに関する文書の印紙税の取扱いとして、ガイドライン・スキルマップの記載に照らし正しいものはどれか。", "ch": ["株式譲渡契約書は、代金受領の記載の有無にかかわらず、常に印紙税の課税文書である。", "株式譲渡代金の領収書には、収入印紙は不要である。", "株式譲渡契約書は一般に非課税文書だが、代金受領の記載がある場合は課税文書（第17号の1文書）となる。", "株式譲渡契約書に代金受領の記載がある場合、第1号文書として課税される。"], "a": 2, "k": null, "ex": "株式譲渡契約書等は一般に印紙税の非課税文書だが、代金受領の記載がある場合は印紙税法別表第1第17号の1文書として課税文書となり、収入印紙の貼付が必要となる。クロージング書類である株式譲渡代金の領収書にも収入印紙が必要である。", "cn": ["誤り。一般には非課税文書である。", "誤り。株式譲渡代金の領収書には収入印紙が必要である。", "正しい。GL p.118の記載どおりである。", "誤り。第17号の1文書である。"], "src": "GL p.118／SM p.159", "ref": "n3-34", "lv": 2}, {"id": "FIN-051", "sub": "財務・税務", "top": "スキームの初期的な検討（税務）", "typ": "正しい", "stem": "参考資料7の事業譲渡契約書サンプルにおける税金・公租公課の取扱いとして、正しいものはどれか。", "ch": ["譲渡代金は、消費税及び地方消費税を含む金額として定められている。", "固定資産税等の公租公課は日割計算し、クロージング日の前日までは譲渡人、以降は譲受人が負担する。", "移転手続に係る登録免許税等は、譲渡人の負担とされている。", "固定資産税は、その年度分の全額を譲受人が負担するとされている。"], "a": 1, "k": null, "ex": "事業譲渡契約書サンプルでは、譲渡代金について消費税及び地方消費税は別途とされる。固定資産税等の公租公課は日割計算でクロージング日前日までは譲渡人、以降は譲受人が負担し、移転手続の登録免許税等は譲受人負担とされる。", "cn": ["誤り。消費税及び地方消費税は別途とされる。", "正しい。参考資料7 p.40の記載どおりである。", "誤り。登録免許税等は譲受人負担である。", "誤り。日割計算で負担を区分する。"], "src": "参考資料7 p.39-40", "ref": "n3-35", "lv": 2}, {"id": "FIN-052", "sub": "財務・税務", "top": "税務基礎", "typ": "正しい", "stem": "税法基準の株価とM&Aで決まる株価に関する記述として、正しいものはどれか。", "ch": ["相続税評価による株価は、M&Aで当事者が調整して決める株価と常に一致する。", "税法基準の株価はM&Aでは参考にならないため、支援者がその違いを理解している必要はない。", "税理士は、中小M&Aのバリュエーションで判断が困難な場合でも、他の専門家や公的機関と連携してはならない。", "財産評価基本通達の取引相場のない株式の評価（純資産価額方式）は、時価純資産法に類似する。"], "a": 3, "k": null, "ex": "SMは、税法基準で計算した株価（例：相続税評価）とM&Aで決まる株価の違いを理解していることを求める。GLは、財産評価基本通達の純資産価額方式は時価純資産法に類似し税理士の知識でも対応可能だが、判断が困難な場合はM&A専門の公認会計士等や公的機関と連携することが必要としている。", "cn": ["誤り。税法基準の株価とM&Aの株価は異なりうる。", "誤り。両者の違いを理解していることが求められる。", "誤り。判断が困難な場合は連携することが必要とされる。", "正しい。GL p.119-120の記載どおりである。"], "src": "SM p.41／GL p.119-120", "ref": "n3-36", "lv": 2}, {"id": "FIN-053", "sub": "財務・税務", "top": "スキームの初期的な検討（税務）", "typ": "組合せ", "stem": "中堅・中小グループ化税制（中小企業事業再編投資損失準備金の拡充及び延長）に関する次の文章の空欄A〜Cに入る語句の組合せとして、正しいものはどれか。\n「当初制度では株式取得価額の（A）までを準備金として積み立て、据置期間は5年間である。令和6年度税制改正で創設された拡充枠では、積立率がM&A2回目（B）、3回目以降100%とされ、据置期間は（C）に長期化された。」", "ch": ["A 50%　B 70%　C 10年", "A 70%　B 100%　C 7年", "A 90%　B 100%　C 5年", "A 70%　B 90%　C 10年"], "a": 3, "k": null, "ex": "当初制度は株式取得価額の70%までを積立（据置5年、その後5年間均等取崩し）。拡充枠は積立率をM&A2回目90%・3回目以降100%に拡大し、据置期間を10年に長期化した。", "cn": ["誤り。当初制度は70%、2回目は90%である。", "誤り。2回目は90%、据置期間は10年である。", "誤り。当初制度は70%、2回目は90%、据置期間は10年である。", "正しい。資料1 p.16の記載どおりである。"], "src": "資料1 p.16", "ref": "n3-37", "lv": 2}, {"id": "FIN-054", "sub": "財務・税務", "top": "スキームの初期的な検討（税務）", "typ": "誤り", "stem": "M&Aに関連する税制上の措置についての記述として、誤っているものはどれか。", "ch": ["中小企業事業再編投資損失準備金は、積立時に損金算入され、取崩し時に益金算入される。", "グループ化税制の拡充枠の適用には産業競争力強化法で新設する認定が要件とされ、過去5年以内のM&A実績が必要である。", "中堅企業は、1回目のM&Aから拡充枠を活用できる。", "経営力向上計画の認定による事業承継等に係る登録免許税・不動産取得税の特例には、適用期限がある。"], "a": 2, "k": null, "ex": "準備金は積立時に損金算入、取崩し時に益金算入される。拡充枠は産業競争力強化法の新たな認定と過去5年以内のM&A実績が要件で、中堅企業は2回目以降のM&Aから活用可能である。中小企業等経営強化法の税制措置には適用期限がある点に留意する。", "cn": ["正しい。資料1 p.16の記載どおりである。", "正しい。拡充枠の要件である。", "誤り。中堅企業は2回目以降のM&Aから活用可能とされる。", "正しい。GL p.119の記載どおりである。"], "src": "資料1 p.16／GL p.119", "ref": "n3-37", "lv": 2}, {"id": "FIN-055", "sub": "財務・税務", "top": "税務基礎", "typ": "最も適切", "stem": "A社の顧問税理士Tは、M&Aの税務DDへの協力の過程で、A社が不正に税を免れていた事実を知った。税理士法の規定に照らし、Tの対応として最も適切なものはどれか。", "ch": ["顧問先の利益を優先し、M&Aが完了するまでは事実に触れずに業務を続ける。", "直ちに、A社に対してその是正をするよう助言する。", "譲り受け側に直接伝えれば、A社への是正の助言は不要となる。", "A社が是正の助言に従わなくても、そのまま申告書の作成業務を続けて問題はない。"], "a": 1, "k": null, "ex": "税理士法第41条の3により、税理士は委嘱者の不正な脱税等を知ったときは、直ちにその是正をするよう助言しなければならない。助言に従わないまま業務を続けると、不真正税務書類作成禁止違反等（同法第45条）に該当するおそれがある。", "cn": ["誤り。直ちに是正を助言しなければならない。", "正しい。税理士法第41条の3の義務である。", "誤り。是正の助言義務は免除されない。", "誤り。同法第45条違反等に該当するおそれがある。"], "src": "GL p.116-117", "ref": "n3-38", "lv": 2}, {"id": "LEG-001", "sub": "法務", "top": "リスク", "typ": "正しい", "stem": "法務DDに関する記述として、正しいものはどれか。", "ch": ["株式・労務に関する事項は問題が検出されることが少ないため、調査の優先度は低いとされる。", "株式譲渡では対象会社の法的リスクをそのまま引き継ぎやすいため、法務DDは全般的・網羅的に行うことが多い。", "簿外債務や未払残業等は発覚しにくい論点であるため、調査事項に含める必要はないとされる。", "法務DDの観点は、株式・会社組織と訴訟・紛争の2点に限定される。"], "a": 1, "k": null, "ex": "法務DDの目的は、M&A実行・事業運営上の法務リスクと契約上のリスクの把握である。株式譲渡では法的リスクをそのまま引き継ぎやすいため、全般的・網羅的に行うことが多い。株式・労務に関する事項は何らかの事項が検出されることが多く、簿外債務・未払残業等は調査事項に含めることが望ましい。", "cn": ["誤り。株式・労務に関する事項は、何らかの事項が検出されることが多いとされる。", "正しい。株式譲渡では法的リスクを引き継ぎやすく、全般的・網羅的に行うことが多い。", "誤り。簿外債務・未払残業等は問題が発覚しやすい論点で、調査事項に含めることが望ましい。", "誤り。観点は株式・会社組織、重要な契約、資産及び負債、人事・労務、訴訟・紛争、許認可・コンプライアンス・環境問題等と幅広い。"], "src": "SM p.114", "ref": "n4-2", "lv": 1}, {"id": "LEG-002", "sub": "法務", "top": "リスク", "typ": "最も適切", "stem": "法務DDにおける契約関係の調査に関する記述として、最も適切なものはどれか。", "ch": ["短期で更新される契約は、チェンジ・オブ・コントロール条項がない限りM&A後の取引継続に影響しないため、確認は不要である。", "事業上重要で代替性のない取引先は契約書の記載から特定できるため、Q&Aやインタビューで確認する必要はない。", "特許権者が第三者に専用実施権を設定しても、特許権者自身は引き続き制限なく権利を行使できる。", "チェンジ・オブ・コントロール条項は、M&A成立後に取引先が契約を破棄できるため重要であり、同意取得の要否と売上への影響を確認する。"], "a": 3, "k": null, "ex": "契約の調査では、チェンジ・オブ・コントロール（COC）条項が特に重要で、同意取得の要否と売上影響を確認する。短期更新条項も実質COCとして機能しうる。重要な取引先は契約書からは分からないため、Q&A・インタビューで確認する。", "cn": ["不適切。短期更新条項も実質的にCOC条項として機能しうるため確認が必要である。", "不適切。重要・代替性のない取引先は契約書からは分からないため、Q&A・インタビューで確認する。", "不適切。専用実施権を設定すると、特許権者自身も権利行使の制限を受ける。", "適切。COC条項は成立後に取引先が契約を破棄できるため重要で、同意取得の要否と売上影響を確認する。"], "src": "SM p.118-119", "ref": "n4-3", "lv": 2}, {"id": "LEG-003", "sub": "法務", "top": "リスク", "typ": "全て選べ", "stem": "法務DDの人事・労務の調査において、違反例として挙げられているものを全て選んだ組合せはどれか。\nア 就業規則や36協定が存在しない\nイ 在留資格・就労資格のない外国人従業員が就労している\nウ 年金・退職金制度の変更について、従業員への説明と同意取得を行っている\nエ キーマンとなる従業員を把握している", "ch": ["ア、イ", "ア、ウ", "イ、エ", "ア、イ、ウ、エ"], "a": 0, "k": null, "ex": "SMは人事・労務の違反例として、就業規則・36協定がないこと、在留資格・就労資格がない外国人従業員を挙げる。年金・退職金の変更には説明と同意取得が必要とされ、キーマンの把握は実務上の着眼点である。", "cn": ["正しい。ア・イがSMで違反例として挙げられている。", "誤り。ウは説明と同意取得を行っており、むしろ必要な対応である。", "誤り。エのキーマンの把握は着眼点であり、違反例ではない。", "誤り。ウ・エは違反例ではない。"], "src": "SM p.121", "ref": "n4-3", "lv": 1}, {"id": "LEG-004", "sub": "法務", "top": "リスク", "typ": "最も適切", "stem": "法務DDにおける許認可・コンプライアンスの調査に関する記述として、最も適切なものはどれか。", "ch": ["クロージング前に治癒できない法令違反があっても、子会社化後に是正すればよいため、子会社化の判断には影響しない。", "給付金の不正受給など重大な違反が治癒不能と判明しても、表明保証で対応すれば足り、スキーム変更やディール中止を協議する必要はない。", "買参権など業界特有の権利は見落とされ得るため、DD前に把握しておき、手続が複雑なら行政書士等へ早めに相談する。", "譲り受け側が上場を見据えていても、上場審査で確認されるのは財務数値のみであり、規程の運用状況は問われない。"], "a": 2, "k": null, "ex": "許認可の確認はマッチング前が理想で、買参権など業界特有の権利は見落とされ得るためDD前に把握する。重大なコンプライアンス違反が治癒不能ならスキーム変更・ディール中止も早期に協議し、クロージング前に治癒できない違反は子会社化できないリスクがある。", "cn": ["不適切。治癒できない違反は、連帯責任やブランド低下を避けるため子会社化できないリスクがある。", "不適切。治癒不能ならスキーム変更・ディール中止も早期に協議する。", "適切。許認可はマッチング前の確認が理想で、業界特有の権利はDD前に把握し、複雑なら行政書士等に早めに相談する。", "不適切。上場審査では規程の運用と法規制遵守が確認される。"], "src": "SM p.122-123", "ref": "n4-4", "lv": 2}, {"id": "LEG-005", "sub": "法務", "top": "係争", "typ": "最も適切", "stem": "法務DDで、対象会社に係属中の訴訟が発見された。M&A支援機関の担当者（弁護士資格なし）の対応として、最も適切なものはどれか。", "ch": ["M&Aのスケジュールに間に合わせるため、対象会社に訴訟を一方的に取り下げさせるよう助言する。", "解決の目途が立たないため対価の一部後払いを提案する。後払いとすれば、追加対価の定めが曖昧でもトラブルは生じない。", "訴訟の勝敗見通しを自ら判断し、その結果に基づいて譲渡価額の調整幅を確定させる。", "訴訟の見通しや処理方針について自ら見解を表明することは非弁行為となる可能性が高いため、弁護士等に相談する。"], "a": 3, "k": null, "ex": "係属中の訴訟は一方的に取り下げられず、見通し・処理方針の見解表明は非弁行為の可能性が高いため弁護士等に相談する。解決の目途がない場合は対価の一部後払いや価格調整条項が考えられるが、追加対価の設定が曖昧になりトラブルにつながるリスクがある。", "cn": ["不適切。係属中の訴訟は一方的に取り下げられない。", "不適切。後払い・価格調整条項は追加対価の設定が曖昧になり、不履行・深刻なトラブルにつながるリスクがある。", "不適切。見通しの判断・表明は非弁行為の可能性が高い。", "適切。見通し・処理方針の見解表明は非弁行為の可能性が高く、弁護士等に相談する。"], "src": "SM p.124", "ref": "n4-3", "lv": 2}, {"id": "LEG-006", "sub": "法務", "top": "リスク", "typ": "最も適切", "stem": "法務DDで複数の問題点が検出された。分析結果のまとめに関する対応として、最も適切なものはどれか。", "ch": ["検出事項は報告書に記載すれば足り、治癒の範囲やリスクの取り方は依頼者が単独で判断する事項なので協議には関与しない。", "検出事項を報告するだけに留めず、どの程度治癒し、どの程度リスクを取って進めるかを依頼者と協議し、依頼者の決定を支援する。", "修復しないリスクは譲り渡し側の損害となるため、最終契約で譲り受け側と範囲・内容を協議する必要はない。", "修復コストや対応スケジュールは依頼者の判断を歪めるため説明を控え、修復しない場合のリスクのみを伝える。"], "a": 1, "k": null, "ex": "SMは、法務DDの結果を報告のみに留めず、どの程度治癒し、どの程度リスクを取って進めるかを依頼者と協議するとする。修復コスト・対応スケジュール・修復しない場合のリスクを説明して依頼者の決定を支援し、修復しないリスクは最終契約時に範囲・内容を十分協議できるよう支援する。", "cn": ["不適切。報告のみに留めず協議し、依頼者の決定を支援することが求められる。", "適切。報告のみに留めず、治癒の程度とリスクの取り方を依頼者と協議する。", "不適切。修復しないリスクは譲り受け側の損害となり、最終契約時に範囲・内容を十分協議できるよう支援する。", "不適切。修復コスト・対応スケジュール・修復しない場合のリスクを説明する。"], "src": "SM p.125", "ref": "n4-5", "lv": 2}, {"id": "LEG-007", "sub": "法務", "top": "アドバイザリー（仲介・FA）契約", "typ": "正しい", "stem": "中小M&Aガイドライン参考資料7（契約書等のサンプル）に関する記述として、正しいものはどれか。", "ch": ["FA契約書のサンプルは掲載されておらず、FA契約への読替えは仲介契約書サンプルの「注」で示されている。", "仲介契約書、秘密保持契約書、意向表明書、株式譲渡契約書、事業譲渡契約書の5種類が掲載されている。", "掲載された5種類のサンプルは、いずれも日弁連等編「事業承継法務のすべて」から抜粋・一部加工したものである。", "サンプルは標準的な内容を示すものであり、弁護士等の専門家に相談せずそのまま用いることが求められている。"], "a": 0, "k": null, "ex": "参考資料7は(1)仲介契約書、(2)秘密保持契約書、(3)基本合意書、(4)株式譲渡契約書、(5)事業譲渡契約書を掲載する。いずれも例で、具体的作成は弁護士等に相談することが望ましい。FA契約書のサンプルはなく、FA契約への読替えは仲介契約書の注で示される。", "cn": ["正しい。FA契約書のサンプルはなく、仲介契約書の「注」で読替えを示す。", "誤り。意向表明書ではなく基本合意書が掲載されている。", "誤り。抜粋・加工とされるのは(1)(3)(4)(5)で、(2)秘密保持契約書は含まれない。", "誤り。いずれも例であり、具体的作成は弁護士等の専門家に相談することが望ましい。"], "src": "参考資料7 p.1-2", "ref": "n4-7", "lv": 1}, {"id": "LEG-008", "sub": "法務", "top": "アドバイザリー（仲介・FA）契約", "typ": "正しい", "stem": "仲介契約書サンプル第1条（業務の依頼）に関する記述として、正しいものはどれか。（甲：譲り渡し側株主、乙：仲介者）", "ch": ["乙は、甲の代理人として候補先との最終契約を締結する権限を有すると定められている。", "乙の業務には候補先の紹介・斡旋が含まれるが、スキームや価格等に関する助言は含まれない。", "乙は、甲又は対象会社の代理人として法律行為を行わないと定められている。", "乙の業務には候補先の紹介・斡旋が含まれるが、交渉への立会いは含まれない。"], "a": 2, "k": null, "ex": "第1条は、乙が甲又は対象会社の代理人として法律行為を行わないことを明記する。業務は候補先の紹介・斡旋、情報提供、是非の検討・決定の助言、提案、交渉への立会い、スキーム・価格等の助言、資料作成等の助言・補助、付随サービスである。", "cn": ["誤り。乙は甲又は対象会社の代理人として法律行為を行わない。", "誤り。スキーム・価格等の助言も業務に含まれる。", "正しい。第1条で乙は代理人として法律行為を行わないとされる。", "誤り。交渉への立会いも業務に含まれる。"], "src": "参考資料7 p.2", "ref": "n4-8", "lv": 1}, {"id": "LEG-009", "sub": "法務", "top": "アドバイザリー（仲介・FA）契約", "typ": "誤り", "stem": "仲介契約書サンプル第4条（秘密保持義務）に関する記述として、誤っているものはどれか。", "ch": ["受領者は、本件取引が成約したか否かにかかわらず、相手方の請求があれば秘密情報を返還しなければならない。", "本契約締結の事実・存在・内容や、交渉の経緯・内容も秘密情報に含まれる。", "秘密保持義務は、本契約の有効期間満了後3年間存続する。", "甲の個人保証の扱いを金融機関等に相談する目的の開示は、M&A成立前の相談を含め例外として認められる。"], "a": 0, "k": null, "ex": "仲介契約書第4条の秘密情報は、開示情報、契約締結の事実・存在・内容、交渉の経緯・内容である。返還は成約に至らなかった場合に請求により行い、義務は有効期間満了後3年間存続する。甲の個人保証の扱いを金融機関等に相談する目的の開示（成立前の相談を含む）は例外とされる。", "cn": ["誤り（正答）。返還は「成約に至らなかった場合」に請求により行うと限定されている。", "正しい。(ii)締結の事実・存在・内容、(iii)交渉の経緯・内容も秘密情報である。", "正しい。有効期間満了後3年間存続する。", "正しい。例外開示④として、成立前の相談を含めて認められる。"], "src": "参考資料7 p.3-4", "ref": "n4-9", "lv": 2}, {"id": "LEG-010", "sub": "法務", "top": "アドバイザリー（仲介・FA）契約", "typ": "正しい", "stem": "仲介契約書サンプルの各条の「注」に関する記述として、正しいものはどれか。", "ch": ["FA契約の場合でも、第8条4項（利益相反行為の禁止）はそのまま必要とされている。", "譲り受け側との仲介契約の場合でも、第4条2項④（個人保証の扱いの相談目的の開示）は必要とされている。", "譲り受け側との仲介契約の場合でも、第8条4項の「不当に低額」「高額」の記載はそのまま用いるとされている。", "FA契約の場合、第4条の2（候補先への報酬等の開示）は不要とされている。"], "a": 3, "k": null, "ex": "第4条の2は、GLが一方当事者からの報酬を他方に開示することを求めていることを受けた同意条項で、FA契約なら不要である。第8条4項もFA契約なら不要で、譲り受け側との仲介契約では（※）の高低を逆にする。第4条2項④は譲り受け側との契約なら不要である。", "cn": ["誤り。FA契約なら第8条4項は不要とされる。", "誤り。譲り受け側との契約なら第4条2項④は不要とされる。", "誤り。譲り受け側との仲介契約なら（※）部分の高低を逆にする。", "正しい。第4条の2は仲介者の構造的利益相反に対応する条項で、FA契約なら不要。"], "src": "参考資料7 p.3-7", "ref": "n4-13", "lv": 3}, {"id": "LEG-011", "sub": "法務", "top": "アドバイザリー（仲介・FA）契約", "typ": "組合せ", "stem": "仲介契約書サンプル第5条（有効期間）に関する次の文の空欄A〜Cに入る語句の組合せとして、正しいものはどれか。\n本契約の有効期間は締結日から（A）とし、期間満了の（B）前までに申出がなければ、更に（C）自動的に延長される。", "ch": ["A：2年間　B：1か月　C：1年間", "A：1年間　B：1週間　C：1年間", "A：1年間　B：1か月　C：6か月間", "A：6か月間　B：1週間　C：6か月間"], "a": 1, "k": null, "ex": "仲介契約書第5条の有効期間は締結日から1年間で、満了1週間前までに申出がなければ更に1年間自動延長され、検討・交渉終了時点で終了する。なお重要事項説明書では、契約期間は最長でも6か月〜1年以内を目安とすべきとされる。", "cn": ["誤り。2年間は秘密保持契約書サンプルの有効期間である。", "正しい。締結日から1年間、満了1週間前までに申出がなければ更に1年間延長。", "誤り。申出期限は1週間前、延長期間は1年間。", "誤り。6か月は重要事項説明書で示す契約期間の目安（6か月〜1年）との混同。"], "src": "参考資料7 p.4", "ref": "n4-8", "lv": 1}, {"id": "LEG-012", "sub": "法務", "top": "アドバイザリー（仲介・FA）契約", "typ": "計算", "stem": "仲介契約書サンプル第6条の成功報酬（レーマン方式の例：5億円以下の部分5％、5億円超10億円以下の部分4％、10億円超50億円以下の部分3％）に基づき、譲渡価額12億円で本件取引が実行された。甲は着手金200万円と中間金300万円を既に支払っている。最低報酬と消費税は考慮しないとき、成功報酬として甲が支払う額はいくらか。", "ch": ["5,100万円", "3,100万円", "4,600万円", "5,500万円"], "a": 2, "k": null, "ex": "5億円×5％＝2,500万円、5億円×4％＝2,000万円、2億円×3％＝600万円の合計5,100万円が成功報酬額となる。サンプルでは既払の着手金・中間金を差し引くため、5,100万円−500万円＝4,600万円を支払う。", "cn": ["誤り。既払の着手金・中間金を差し引いていない。", "誤り。12億円全体に3％を乗じ（3,600万円）既払500万円を差し引いたもので、階層ごとの合算になっていない。", "正しい。5,100万円から既払500万円を差し引く。", "誤り。12億円全体に5％を乗じ（6,000万円）既払500万円を差し引いたもので、階層ごとの合算になっていない。"], "src": "参考資料7 p.4-5", "ref": "n4-10", "lv": 2}, {"id": "LEG-013", "sub": "法務", "top": "アドバイザリー（仲介・FA）契約", "typ": "最も適切", "stem": "甲（譲り渡し側株主）は仲介者乙と仲介契約書サンプルどおりの契約を締結した。乙が関与・接触し紹介したX社との交渉は不成立となり、仲介契約はそのまま終了した。甲が乙に成功報酬を支払う必要がある事象として、最も適切なものはどれか。", "ch": ["契約終了の3年後、乙の介在なしにX社との交渉が復活し、X社への株式譲渡が実行された。", "契約終了の半年後、甲が自ら見つけたY社（乙は関与・接触していない）への株式譲渡が実行された。", "契約終了の1年後、X社との交渉が再開されたが、取引は実行されずに終わった。", "契約終了の1年半後、乙の介在なしにX社との交渉が復活し、X社への株式譲渡が実行された。"], "a": 3, "k": null, "ex": "第6条2項（テール条項）は、取引不成立のまま契約終了後2年以内に、乙が関与・接触し紹介した候補先との取引が実行されたら成功報酬を支払うと定める。仲介者抜きで復活・成立した取引も一定期間内は報酬が発生する趣旨である。GL上もテール期間は最長でも2年〜3年以内が目安とされる。", "cn": ["不適切。テール期間（終了後2年以内）を過ぎている。", "不適切。対象は乙が関与・接触し紹介した候補先に限られる。", "不適切。取引が実行されていない。", "適切。終了後2年以内に、乙が紹介した候補先との取引が実行されている。"], "src": "参考資料7 p.6／参考資料11 p.10", "ref": "n4-11", "lv": 2}, {"id": "LEG-014", "sub": "法務", "top": "アドバイザリー（仲介・FA）契約", "typ": "誤り", "stem": "仲介契約書サンプル第8条4項で、乙（譲り渡し側の仲介者）が行わないと定める利益相反行為に該当しないものはどれか。", "ch": ["候補先の業務・財務・経営戦略に関する情報を収集し、甲に提供する行為", "候補先から追加で手数料を取得し、甲のニーズに反するマッチングを優先するなど候補先に便宜を図る行為", "甲の希望額より高額で成立した場合に、正規の手数料とは別に差分の一定割合を報酬として要求する行為", "甲にとってのみ不利な情報を認識したのに、甲に伝達せず秘匿する行為"], "a": 0, "k": null, "ex": "第8条4項は、①候補先からの追加手数料取得と便宜供与、②リピーター候補先の優遇、③希望額超過分の一定割合の報酬要求、④伝達事項の不伝達・虚偽伝達、⑤甲にのみ有利・不利な情報の秘匿、の5類型を禁止する。候補先の情報提供は第1条の業務である。", "cn": ["該当しない（正答）。第1条の業務②（候補先の業務・財務・経営戦略の情報提供）である。", "該当する。5類型の1つ目（候補先からの追加手数料と便宜供与）。", "該当する。5類型の3つ目（差分の一定割合の要求）。", "該当する。5類型の5つ目（甲にのみ有利・不利な情報の秘匿）。"], "src": "参考資料7 p.2, 6-7", "ref": "n4-12", "lv": 1}, {"id": "LEG-015", "sub": "法務", "top": "アドバイザリー（仲介・FA）契約", "typ": "正しい", "stem": "仲介契約書サンプルの第7条（解除）及び第8条（乙の責任）に関する記述として、正しいものはどれか。", "ch": ["乙は、甲が報酬を支払わない場合、催告をすることなく直ちに本契約を解除することができる。", "本契約が解除された場合、乙は業務の進捗の程度にかかわらず、成功報酬相当額を請求できる。", "甲は、本件取引の実行前に限り、いつでも本契約を解除することができる。", "候補先の採否は、乙が善良な管理者の注意義務に基づいて最終的に決定する。"], "a": 2, "k": null, "ex": "第7条は、甲が本件取引の実行前に限りいつでも解除でき、乙は報酬不払（相当期間を定めた催告後）等の場合に解除でき、解除時は業務の程度に応じて清算すると定める。第8条は、採否・契約締結は甲が自らの判断で行い、乙は善管注意義務を負うが成果を保証しないとする。", "cn": ["誤り。報酬不払では相当の期間を定めて催告しても応じない場合に解除できる。", "誤り。業務の程度に応じて報酬・費用を清算する（第7条3項）。", "正しい。第7条1項のとおり。", "誤り。採否・契約締結は甲が自らの判断で行う（第8条1項）。乙は善管注意義務を負う。"], "src": "参考資料7 p.6-7", "ref": "n4-8", "lv": 2}, {"id": "LEG-016", "sub": "法務", "top": "アドバイザリー（仲介・FA）契約", "typ": "正しい", "stem": "アドバイザリー契約の免責事項に関する記述として、正しいものはどれか。", "ch": ["契約で免責が明記されていれば、アドバイザーは相手方情報の検証義務を負わない。重大過失があっても免責が優先されるため、説明責任は基本的に問題とならない。", "免責条項は相手方が専門家でない場合は常に無効である。よって、アドバイザーは相手方属性に応じて全面的な保証を負うことになる。", "免責条項があっても、アドバイザーが当然に負うべき正確かつ適切な情報提供（必要な検証を含む）義務が直ちに消えるわけではない。義務の範囲は条項の文言や事案の性質、当事者の関与状況等に応じて判断される。", "免責条項の有効性は、契約交渉の実態・条項の文言・過失の程度等を踏まえて個別判断される。ただし、免責条項がある限り、アドバイザーの善管注意義務は課されない。"], "a": 2, "k": null, "ex": "公式サンプル問題（資料2 p.15、小項目：アドバイザリー契約に関する法律知識（免責事項））。正答は③で、資料に解説文はない。関連して、重要事項説明書(13)は責任修正条項を説明することと法的効力の有無は別問題とし、仲介契約書第8条2項は仲介者が善管注意義務を負うと定める。", "cn": ["誤り。免責の明記で検証義務や説明責任が当然に消えるわけではない。", "誤り。「常に無効」「全面的な保証」という断定は誤り。", "正しい（公式サンプルの正答）。情報提供義務は免責条項で直ちに消えず、範囲は個別に判断される。", "誤り。前段は妥当だが、免責条項があっても善管注意義務は課される（仲介契約書第8条2項参照）。"], "src": "資料2 p.15／参考資料11 p.10／参考資料7 p.6", "ref": "n4-14", "lv": 2}, {"id": "LEG-017", "sub": "法務", "top": "秘密保持契約", "typ": "組合せ", "stem": "秘密保持契約書サンプル（譲り渡し側と譲り受け側が直接締結）に関する次の文の空欄A〜Cに入る語句の組合せとして、正しいものはどれか。\n本契約の有効期間は締結日より（A）とし、解約の申出がなければ更に（B）延長され、以後も同様とする。第1条の秘密保持義務は、有効期間満了後（C）存続する。", "ch": ["A：1年間　B：1年間　C：3年間", "A：2年間　B：1年間　C：3年間", "A：2年間　B：2年間　C：1年間", "A：3年間　B：1年間　C：2年間"], "a": 1, "k": null, "ex": "秘密保持契約書サンプル第3条は有効期間を締結日より2年間とし、解約の申出がなければ更に1年間延長（以後同様）する。第1条4項により秘密保持義務は有効期間満了後3年間存続する。仲介契約書は有効期間1年（自動延長1年）・満了後3年間存続である。", "cn": ["誤り。有効期間1年間は仲介契約書サンプルの定めである。", "正しい。2年間、1年間ずつ延長、満了後3年間存続。", "誤り。延長は1年間ずつ、存続は満了後3年間。", "誤り。有効期間は2年間、存続は満了後3年間。"], "src": "参考資料7 p.9-10", "ref": "n4-16", "lv": 1}, {"id": "LEG-018", "sub": "法務", "top": "秘密保持契約", "typ": "誤り", "stem": "秘密保持契約書サンプルと仲介契約書サンプル第4条（秘密保持義務）の比較に関する記述として、誤っているものはどれか。", "ch": ["秘密情報の返還について、仲介契約書は「成約に至らなかった場合」と限定しているが、秘密保持契約書にはこの限定がない。", "秘密保持契約書では、アドバイザー等への開示は同様の秘密保持義務を負う者に限られ、その違反は開示した当事者が責任を負う。", "秘密保持契約書では、義務違反による損害を、合理的な範囲の弁護士費用を含めて賠償すると定めている。", "秘密保持契約書では、法令等に基づき公的機関から要請されて秘密情報を開示する場合、相手方への通知は不要とされている。"], "a": 3, "k": null, "ex": "秘密保持契約書は、公的機関への開示に相手方への事前通知を求め、アドバイザー等への開示を同等の義務を負う者に限り、その違反は開示者の責任とする点で仲介契約書より厳格である。返還は限定なく請求により行い、損害賠償には合理的な範囲の弁護士費用を含む。", "cn": ["正しい。秘密保持契約書は請求があれば返還し、限定はない。", "正しい。同様の義務を負う者に限り、違反は開示者が自ら責任を負う。", "正しい。第2条（損害賠償）のとおり。", "誤り（正答）。事前に（困難なら開示後可能な限り速やかに）相手方に通知する必要がある。"], "src": "参考資料7 p.3-4, 9-10", "ref": "n4-16", "lv": 2}, {"id": "LEG-019", "sub": "法務", "top": "基本合意", "typ": "正しい", "stem": "基本合意書サンプル第8条（法的拘束力）に関する記述として、正しいものはどれか。", "ch": ["法的拘束力を有しないと定められているのは、第1条（目的）、第2条（承継対象財産及び個人保証解除）、第3条（譲渡価額）のみである。", "第5条（独占的交渉権）も、了解事項の確認にすぎないため法的拘束力を有しないと定められている。", "基本合意書は最終契約前の合意であるため、全ての条項が法的拘束力を有しないと定められている。", "第8条は、第7条（秘密保持義務）を除く全ての条項について法的拘束力を有しないと定めている。"], "a": 0, "k": null, "ex": "基本合意書サンプル第8条は、第1条ないし第3条は了解事項の確認が目的で何らの法的拘束力を有しないと定める。したがって独占的交渉権（第5条）、善管注意義務（第6条）、秘密保持義務（第7条）等は拘束力排除の対象に含まれていない。", "cn": ["正しい。第8条が拘束力を排除するのは第1条ないし第3条のみ。", "誤り。第5条（独占的交渉権）は第8条の拘束力排除の対象に含まれていない。", "誤り。排除対象は第1〜3条に限られる。", "誤り。第8条が拘束力を排除するのは第1〜3条のみで、第4〜7条等は排除の対象に含まれていない。"], "src": "参考資料7 p.12-14", "ref": "n4-17", "lv": 2}, {"id": "LEG-020", "sub": "法務", "top": "基本合意", "typ": "最も適切", "stem": "譲り渡し側株主甲は、譲り受け側乙と基本合意書サンプルどおりの基本合意書を締結した。その有効期間中に、第三者Z社から、より高い価額での事業譲渡の打診があった。甲の対応として、最も適切なものはどれか。", "ch": ["基本合意書は第8条により法的拘束力を有しないため、Z社と並行して交渉を進める。", "独占的交渉権の条項は第8条の法的拘束力の排除対象ではないため、有効期間中はZ社と交渉しない。", "独占的交渉権の対象は株式譲渡に限られるため、事業譲渡であればZ社と交渉してよい。", "乙に事後的に通知すれば足りるため、Z社との交渉を開始し、条件がまとまった段階で乙に知らせる。"], "a": 1, "k": null, "ex": "基本合意書サンプル第5条は、甲が本合意の有効期間中、他のいかなる者とも株式譲渡・事業譲渡・増資引受け・合併・株式交換・会社分割・資本業務提携等の交渉を行ってはならないと定める。第8条が法的拘束力を排除するのは第1〜3条のみで、第5条はその排除の対象に含まれていない。", "cn": ["不適切。第8条が拘束力を排除するのは第1〜3条のみである。", "適切。第5条は第8条の拘束力排除の対象外であり、有効期間中は他のいかなる者とも交渉を行ってはならないと定められている。", "不適切。対象は株式譲渡・事業譲渡・合併・会社分割等を含むM&A取引全般である。", "不適切。第5条に通知による例外はなく、交渉自体が禁止される。"], "src": "参考資料7 p.13-14", "ref": "n4-17", "lv": 2}, {"id": "LEG-021", "sub": "法務", "top": "基本合意", "typ": "全て選べ", "stem": "基本合意書サンプル第6条で、最終契約までの間に乙の事前の同意が必要とされる行為として挙げられているものを全て選んだ組合せはどれか。\nア 非経常的な従業員の新規採用\nイ 増資・減資\nウ 日常業務に属する通常の仕入行為\nエ 新たな借入れその他の債務負担行為", "ch": ["ア、イ", "イ、ウ", "ア、イ、エ", "ア、ウ、エ"], "a": 2, "k": null, "ex": "第6条は、最終契約まで善管注意で業務執行し、乙の事前同意なく、重大な資産の処分等、新たな借入れ・保証・担保設定、非経常的な設備投資・仕入、非経常的な契約の締結・解除、非経常的な従業員の新規採用、増資・減資、その他日常業務に属さない事項をしてはならないと定める。", "cn": ["誤り。エ（新たな借入れ等の債務負担行為）も含まれる。", "誤り。ウは対象外（対象は非経常的な仕入行為）で、ア・エが漏れている。", "正しい。ア・イ・エはいずれも7類型に含まれる。", "誤り。ウは日常業務に属するため対象外である。"], "src": "参考資料7 p.13", "ref": "n4-17", "lv": 2}, {"id": "LEG-022", "sub": "法務", "top": "基本合意", "typ": "誤り", "stem": "基本合意書サンプルに関する記述として、誤っているものはどれか。", "ch": ["譲渡価額は金●円を目途とし、正式な価額は最終契約締結時に協議のうえ合意すると定めている。", "第2条2項の個人保証解除の努力義務は法的拘束力を有するため、最終契約で改めて譲り受け側の義務とする必要はない。", "乙は締結日から1か月間を目処にデュー・ディリジェンスを実施でき、甲はこれに協力する。", "乙が対象会社の発行済株式の全部を株主甲から譲り受ける株式譲渡を前提としている。"], "a": 1, "k": null, "ex": "基本合意書サンプル第2条2項は、役職員が保証している契約の解除に乙が最大限努力すると定めるが、第8条により第1〜3条は何らの法的拘束力を有しない。GLも、最終契約において譲り受け側の義務として保証の解除又は移行を明確に位置付けることの検討を求めている。譲渡価額は目途で、DDは1か月間を目処とする。", "cn": ["正しい。第3条のとおり。", "誤り（正答）。第2条は第8条により法的拘束力を有しないとされており、最終契約で譲り受け側の義務として位置付けることを検討する必要がある。", "正しい。第4条のとおり。", "正しい。サンプルの前提である。"], "src": "参考資料7 p.12-14／GL p.97-98", "ref": "n4-17", "lv": 2}, {"id": "LEG-023", "sub": "法務", "top": "クロージング", "typ": "正しい", "stem": "株式譲渡契約書サンプル第4条（本株式譲渡の実行）及びその注に関する記述として、正しいものはどれか。", "ch": ["本株式の譲渡の効力は、クロージング後に株主名簿の名義書換を行った時に生じると定めている。", "譲渡価格の振込手数料は、甲（譲り渡し側）の負担と定めている。", "対象会社が譲渡制限株式を発行する取締役会設置会社であっても、譲渡承認は原則として株主総会決議による。", "株券発行会社を前提としており、本株式の譲渡の効力は株券の交付時に生じると定めている。"], "a": 3, "k": null, "ex": "第4条は、代金支払と引換えに書類を交付し、効力は株券の交付時に生じ、クロージング後直ちに名義書換を行うと定める。注では、多くの中小企業は全株式が譲渡制限株式で、原則として取締役会設置会社は取締役会決議、非設置会社は株主総会決議で承認するとされる。", "cn": ["誤り。名義書換はクロージング後直ちに行うが、効力発生は株券交付時。", "誤り。振込手数料は乙（譲り受け側）負担。", "誤り。原則、取締役会設置会社は取締役会決議、非設置会社は株主総会決議。", "正しい。第4条4項で効力は株券の交付時に生じる。"], "src": "参考資料7 p.16-17", "ref": "n4-19", "lv": 2}, {"id": "LEG-024", "sub": "法務", "top": "クロージング", "typ": "最も適切", "stem": "株式譲渡契約書サンプルにおいて、クロージング日時点で甲の表明保証の一部（軽微な点を超える事項）が真実でないことが判明したが、乙は第5条の前提条件を放棄してクロージングを行った。この場合の記述として、最も適切なものはどれか。", "ch": ["前提条件を放棄しても充足したとはみなされず、甲の表明保証違反の責任は減免されない。", "乙が前提条件を放棄した以上、前提条件は充足したものとみなされ、甲は表明保証違反の責任を負わない。", "前提条件の放棄には甲の同意が必要であり、甲の同意がないクロージングは無効となる。", "表明保証違反の責任はクロージング前に限り追及でき、クロージング後は補償を請求できない。"], "a": 0, "k": null, "ex": "第5条は、甲の表明保証の真実性（軽微な点の誤りを除く）と甲の義務履行を乙のクロージング前提条件とし、乙は任意に放棄できるが、放棄しても充足とはみなされず、甲の表明保証違反の責任は減免されないとする。補償は第16条に基づき請求できる。", "cn": ["適切。第5条のとおり、放棄しても充足とはみなされず責任は減免されない。", "不適切。放棄は充足とみなされない。", "不適切。乙は任意に前提条件を放棄できる。", "不適切。第16条により、クロージング日から●か月以内の書面請求で補償を求められる。"], "src": "参考資料7 p.18, 24", "ref": "n4-19", "lv": 3}, {"id": "LEG-025", "sub": "法務", "top": "最終契約", "typ": "正しい", "stem": "株式譲渡契約書サンプル第10条（クロージング前の乙の義務）及びその注に関する記述として、正しいものはどれか。", "ch": ["経営者保証等の解除に関する金融機関等との交渉は、クロージング後に甲が自ら行うものとされている。", "「経営者保証等」には、株主・役職員による物上保証は含まれないと定義されている。", "乙は、経営者保証等について金融機関等と交渉し、解除又は新規差入れの意向表明を得て、その結果を甲に通知する。", "クロージング時に乙の資力で対象債務を返済する場合でも、第10条①〜③の手続は省略できないとされている。"], "a": 2, "k": null, "ex": "第10条は、乙の義務として、経営者保証等（物上保証を含む）について金融機関等と交渉し解除又は新規差入れの意向表明を得て甲に通知すること等を定める。注では、クロージング時に乙の資力で返済し別途借り換える場合は①〜③は不要で、クロージングと同時に返済する義務を課すことが望ましいとする。", "cn": ["誤り。交渉はクロージング前の乙の義務である。", "誤り。物上保証を含むと定義されている。", "正しい。第10条①のとおり。", "誤り。その場合①〜③は不要で、クロージングと同時に返済する義務を乙に課すことが望ましいとされる。"], "src": "参考資料7 p.19-20", "ref": "n4-19", "lv": 2}, {"id": "LEG-026", "sub": "法務", "top": "最終契約", "typ": "誤り", "stem": "株式譲渡契約書サンプルの第13条（甲の義務）及び第14条（乙の義務）に関する記述として、誤っているものはどれか。", "ch": ["乙は、経営者保証等の解除の合意を得る前であっても、本株式を第三者に譲渡すれば、解除を合意させる義務を免れる。", "甲は、契約締結後一定期間、乙及び対象会社の書面による承諾なく競業行為を行わない義務を負う。", "甲は、一定期間、対象会社の従業員を勧誘しない義務を負う。", "乙は、原則として対象会社の従業員を全員継続雇用する。"], "a": 0, "k": null, "ex": "第13条は甲の引継ぎ協力、競業避止（締結後●年間）、従業員の勧誘禁止等を定める。第14条は乙の従業員の全員継続雇用、クロージング後すみやかな経営者保証等の解除の合意と損害補償を定め、その履行まで本株式の譲渡・担保提供等を禁じ、違反して処分しても義務を免れないとする。", "cn": ["誤り（正答）。3項履行まで譲渡・担保提供は禁止され、違反して処分しても義務を免れない（4項・5項）。", "正しい。第13条2項（締結後●年間の競業避止）。", "正しい。第13条3項（従業員の勧誘禁止）。", "正しい。第14条1項。"], "src": "参考資料7 p.20-21", "ref": "n4-19", "lv": 2}, {"id": "LEG-027", "sub": "法務", "top": "最終契約", "typ": "正しい", "stem": "株式譲渡契約書サンプル第15条（解除）に関する記述として、正しいものはどれか。", "ch": ["表明保証違反があった場合、相当期間を定めて催告すれば、クロージング後であっても解除できる。", "表明保証違反があった場合は、その内容を問わず、催告を要せず直ちに解除できる。", "相手方の反社会的勢力に関する表明保証に違反があった場合は、催告を要せず書面通知により解除できる。", "契約が解除された場合、第7章に基づく補償の請求はできなくなる。"], "a": 2, "k": null, "ex": "第15条1項は、表明保証・義務違反があり相当期間を定めて催告しても是正されないとき、クロージング前に限り解除できるとする。2項は反社会的勢力の表明保証違反につき書面通知による（催告不要の）解除を認め、3項は解除後も補償請求を妨げないとする。", "cn": ["誤り。第15条1項による解除はクロージング前に限られる。", "誤り。原則は相当期間を定めた催告が必要で、催告不要は反社会的勢力の表明保証違反。", "正しい。第15条2項のとおり。", "誤り。解除後も補償の請求は妨げられない（第15条3項）。"], "src": "参考資料7 p.22", "ref": "n4-19", "lv": 2}, {"id": "LEG-028", "sub": "法務", "top": "クロージング", "typ": "組合せ", "stem": "株式譲渡契約書サンプル第15条の2（解除に係る特則及び買戻し条項）に関する次の文の空欄A〜Cに入る語句の組合せとして、正しいものはどれか。\n甲は、クロージング日から1年を経過するまで、次の事由があれば解除又は買戻しができる。①クロージング日から（A）以内に経営者保証等が解除されない。②クロージング日から（B）以内に乙が金融機関等に具体的な相談を始めない。③金融機関等から解除不可・条件付きとの見解が示されてから（C）以内に、乙が借り換え等の自己負担による解除をしない。", "ch": ["A：6か月　B：1か月　C：3か月", "A：3か月　B：30日　C：6か月", "A：1年　B：14日　C：3か月", "A：3か月　B：14日　C：1か月"], "a": 3, "k": null, "ex": "第15条の2は、①クロージング日から3か月で経営者保証等が解除されない、②14日以内に具体的な相談を始めない、③金融機関等の見解から1か月以内に自己負担による解除をしない場合に、甲がクロージング日から1年を経過するまで書面通知で解除又は買戻しをできると定める。", "cn": ["誤り。6か月は乙が催告できるようになる時期（4項）。", "誤り。Bは14日以内、Cは1か月以内。", "誤り。1年は解除・買戻しの行使期限である。", "正しい。3か月・14日以内・1か月以内。"], "src": "参考資料7 p.22", "ref": "n4-19", "lv": 2}, {"id": "LEG-029", "sub": "法務", "top": "クロージング", "typ": "誤り", "stem": "株式譲渡契約書サンプル第15条の2及びその注に関する記述として、誤っているものはどれか。", "ch": ["乙は、クロージング日から6か月経過後に事由に該当する場合、甲に行使するか書面で催告でき、催告後1か月内に甲が行使しなければ解除・買戻しはできなくなる。", "乙が金融機関等に挨拶に出向き、面談の日程調整を行っていれば、「具体的な相談」を開始したものとして扱われる。", "買戻し価額は通知到達時の「相当な価額」とされ、紛争防止のため確定額や計算方法を具体的に定めることも考えられる。", "本条項の発動は例外的事態であり、クロージング前の早期段階から金融機関等への相談を開始する等の対応が求められる。"], "a": 1, "k": null, "ex": "第15条の2第1項②の「具体的な相談」には、単なる挨拶・日程調整は含まれない。乙はクロージング日から6か月経過し事由に該当する場合に書面で催告でき、催告後1か月経過しても甲が行使しなければ解除・買戻しはできなくなる。注は、本条項の発動は例外的事態であり、クロージング前の早期段階からの相談開始等が求められるとする。", "cn": ["正しい。第15条の2第4項・第5項のとおり。", "誤り（正答）。単なる挨拶・日程調整は具体的な相談に含まれない。", "正しい。注で確定額や計算方法を具体的に定めることも考えられるとされる。", "正しい。注のとおり。"], "src": "参考資料7 p.22-23", "ref": "n4-19", "lv": 3}, {"id": "LEG-030", "sub": "法務", "top": "最終契約", "typ": "組合せ", "stem": "参考資料7の株式譲渡契約書サンプル（007_01を基準とする）と事業譲渡契約書サンプルにおける、甲による補償（第16条）の上限と請求期間の組合せとして、正しいものはどれか。", "ch": ["株式譲渡：本譲渡価額の●％が上限、クロージング日から●か月以内に請求／事業譲渡：合計損害額●●円が上限、クロージング日から●年以内に請求", "株式譲渡：合計損害額●●円が上限、クロージング日から●年以内に請求／事業譲渡：本譲渡価額の●％が上限、クロージング日から●か月以内に請求", "株式譲渡：本譲渡価額の●％が上限、クロージング日から●年以内に請求／事業譲渡：合計損害額●●円が上限、クロージング日から●か月以内に請求", "株式譲渡・事業譲渡とも：上限の定めはなく、クロージング日から●年以内に請求"], "a": 0, "k": null, "ex": "試験対策上の基準である007_01では、株式譲渡契約書第16条の甲の補償は、表明保証違反の補償総額が本譲渡価額の●％を上限とし、クロージング日から●か月以内の書面請求に限る。事業譲渡契約書は合計損害額●●円を上限、クロージング日から●年以内の請求とする。007_02は第16条に事業譲渡契約書風の文言が挿入され不整合がある。", "cn": ["正しい。株式譲渡は価額の●％・●か月、事業譲渡は●●円・●年。", "誤り。株式譲渡と事業譲渡が逆になっている。", "誤り。請求期間の「か月」「年」が逆になっている。", "誤り。両契約とも補償の上限が定められている。"], "src": "参考資料7 p.24-26, 42-43（007_01／007_02比較）", "ref": "n4-22", "lv": 3}, {"id": "LEG-031", "sub": "法務", "top": "最終契約", "typ": "正しい", "stem": "参考資料7の株式譲渡契約書サンプルと事業譲渡契約書サンプルの比較に関する記述として、正しいものはどれか。", "ch": ["甲の競業避止義務の期間は、株式譲渡契約書・事業譲渡契約書とも、クロージング日以後●年間と定めている。", "前提条件としての表明保証の正確性について、株式譲渡契約書は「重要な点において」、事業譲渡契約書は「軽微な点の誤りを除き」と定めている。", "商法第526条を適用しない旨は、甲による補償と乙による補償の双方に定められている。", "秘密保持義務の例外として「情報共有の仕組み」の運営主体への開示を定めているのは、株式譲渡契約書のみである。"], "a": 3, "k": null, "ex": "株式譲渡契約書第18条は、GLが求める「情報共有の仕組み」の登録事由に該当する事実が生じ運営主体に開示する場合を秘密保持の例外とするが、事業譲渡契約書にこの例外はない。競業避止の起算点、前提条件の表現は両者で異なり、商法526条の排除はいずれも甲の補償のみである。", "cn": ["誤り。株式譲渡契約書は「締結後」●年間、事業譲渡契約書は「クロージング日以後」●年間。", "誤り。株式譲渡が「軽微な点の誤りを除き」、事業譲渡が「重要な点において」で、逆である。", "誤り。商法526条の排除は両契約とも甲による補償（第16条）のみ。", "正しい。株式譲渡契約書第18条のみにこの例外がある。"], "src": "参考資料7 p.18-44", "ref": "n4-21", "lv": 3}, {"id": "LEG-032", "sub": "法務", "top": "最終契約", "typ": "最も適切", "stem": "株式譲渡のDDで、譲り渡し側甲は未払残業代の存在を資料で開示し、譲り受け側乙もこれを認識した。乙が提示した最終契約案にはプロ・サンドバッギング条項が含まれている。甲側の支援者の助言として、最も適切なものはどれか。", "ch": ["DDで開示し乙が認識した事実は表明保証違反とならない条項であるため、甲に有利であり、そのまま受け入れるよう助言する。", "乙が認識していても甲は表明保証違反の責任を免れないため、条項の意味を吟味し、削除・修文や特別補償としての別途規定を検討するよう助言する。", "プロ・サンドバッギング条項は中小M&Aでは合理性がなく当然に無効となるため、交渉は不要と助言する。", "口頭で伝えた事項は全て免責されるため、残る論点を口頭で乙に伝えれば足りると助言する。"], "a": 1, "k": null, "ex": "プロ・サンドバッギング条項は、乙の認識にかかわらず甲の免責を認めない条項で、甲がDDで開示し乙が認識していても甲は責任を免れない。甲は意味内容を吟味し削除や修文を求めることを検討する必要があり、乙が認識したリスクは特別補償として別途規定することもあり得る。", "cn": ["不適切。それはアンチ・サンドバッギング条項の内容である。", "適切。甲は削除や修文を求めることを検討する必要があり、特別補償とすることもあり得る。", "不適切。中小M&AではDD期間が限られ、プロ・サンドバッギング条項そのものに合理性がないわけではない。", "不適切。口頭では伝わったか不明確なこともあり、プロ条項の下では乙の認識にかかわらず甲は免責されない。"], "src": "参考資料7 p.24-25", "ref": "n4-19", "lv": 3}, {"id": "LEG-033", "sub": "法務", "top": "最終契約", "typ": "正しい", "stem": "株式譲渡契約書サンプル別紙1（甲が表明及び保証する事項）及びその注に関する記述として、正しいものはどれか。", "ch": ["表明保証を「知る限り」と限定する場合は、「知り得る限り」と限定する場合よりも保証の範囲が広くなる。", "税務申告等の適正に関する表明保証の例では、過去3年間の法人税等の適法適正な申告・納付が挙げられている。", "表明保証を「知り得る限り」と限定する場合は、「知る限り」と限定する場合よりも保証の範囲が広くなる。", "対象会社の反社会的勢力との関係の不存在は、役員・従業員を含め、甲の主観による限定なく保証するものとされている。"], "a": 2, "k": null, "ex": "別紙1(2)⑥の注は、「知る限り」（現に認識）より「知り得る限り」（認識できたであろう場合を含む）の方が保証の範囲は広がるとする。税務申告等の適正の例は過去7年間、反社会的勢力の不存在は従業員について甲の知る限りとされる。冒頭注は、甲が過剰な範囲で表明保証を行い事後に紛争化する例があると警告する。", "cn": ["誤り。「知る限り」は現に認識している範囲で、より狭い。", "誤り。例示は過去7年間である。", "正しい。「知り得る限り」は認識できたであろう場合を含み、保証の範囲が広がる。", "誤り。従業員については「甲の知る限り」と限定されている。"], "src": "参考資料7 p.31-36", "ref": "n4-19", "lv": 2}, {"id": "LEG-034", "sub": "法務", "top": "最終契約", "typ": "正しい", "stem": "事業譲渡契約書サンプル第3条（承継対象財産）及びその注に関する記述として、正しいものはどれか。", "ch": ["乙が承継対象債務を免責的に引き受けるには債権者の承諾が必要であり、承諾がなければ原則として連帯債務（併存的債務引受）となる。", "乙は、別紙に記載されていない債務も含め、承継対象事業に関する債務を包括的に承継する。", "承継対象資産は、個別の動産に至るまで全て厳密に特定しなければならないとされている。", "別紙1の承継対象資産の例には、承継対象事業に係る現預金・売掛金が含まれている。"], "a": 0, "k": null, "ex": "事業譲渡契約書第3条は、別紙の資産・契約上の地位を移転し、別紙3の債務を免責的に引き受け、承継対象債務以外は承継しないと定める。注は、承継対象財産の特定が重要であること、免責的債務引受には債権者の承諾が必要で承諾がなければ原則として連帯債務となることを示す。", "cn": ["正しい。第3条2項の注のとおり。", "誤り。承継対象債務以外の債務は承継しない。", "誤り。個別動産まで厳密に特定する必要はなく、B/Sの表示科目に沿って可能な限り具体的に特定することが望まれる（不動産は厳密に特定）。", "誤り。現預金・売掛金は除かれている。"], "src": "参考資料7 p.38-39, 46-47", "ref": "n4-20", "lv": 2}, {"id": "LEG-035", "sub": "法務", "top": "最終契約", "typ": "誤り", "stem": "事業譲渡契約書サンプルに関する記述として、誤っているものはどれか。", "ch": ["甲は、公表日以降クロージング日の前日までに取引先に説明し、承継について承諾を得る。", "従業員のクロージング日までの賃金・退職金等の債務は、転籍に伴い乙が承継する。", "株式会社が全事業の事業譲渡を行う場合等は、原則として出席株主の議決権の3分の2以上による株主総会の特別決議が必要となる。", "許認可の取得・登録・届出は甲乙が協力して行い、その手続費用は乙が負担する。"], "a": 1, "k": null, "ex": "事業譲渡契約書は、従業員を乙へ転籍させるが、クロージング日までの賃金・退職金等の債務は甲が履行し乙は承継しない（第5条）。取引先の承諾取得（第4条）、株主総会決議（全事業譲渡等は原則特別決議。第7条）、許認可は協力して取得し費用は乙負担（第8条）と定める。", "cn": ["正しい。第4条のとおり。", "誤り（正答）。クロージング日までの労働債務は甲が履行し、乙は承継しない。", "正しい。第7条の注のとおり。", "正しい。第8条のとおり。"], "src": "参考資料7 p.38-40", "ref": "n4-20", "lv": 2}, {"id": "LEG-036", "sub": "法務", "top": "最終契約", "typ": "組合せ", "stem": "事業譲渡契約書サンプルに関する次の文の空欄A〜Cに入る語句の組合せとして、正しいものはどれか。\n・承継対象財産の登記・登録・通知等の移転手続は、クロージング日後（A）以内に完了する。\n・固定資産税等は日割計算とし、クロージング日の（B）までは甲、それ以降は乙が負担する。\n・承継対象財産の移転に係る登録免許税等は（C）が負担する。", "ch": ["A：14日　B：当日　C：甲", "A：30日　B：当日　C：甲", "A：3か月　B：前日　C：甲と乙で折半", "A：30日　B：前日　C：乙"], "a": 3, "k": null, "ex": "事業譲渡契約書第9条2項は、登記・登録・通知等をクロージング日後30日以内に完了すると定める。第11条は固定資産税・保険料・光熱費等を日割計算し、クロージング日前日まで甲、クロージング日以降乙が負担し、移転の登録免許税等は乙負担とする。", "cn": ["誤り。A・B・Cいずれも誤り。", "誤り。Bは前日、Cは乙。", "誤り。Aは30日、Cは乙の負担。", "正しい。30日以内、前日まで甲、登録免許税等は乙負担。"], "src": "参考資料7 p.40-41", "ref": "n4-20", "lv": 2}, {"id": "LEG-037", "sub": "法務", "top": "法務基礎", "typ": "誤り", "stem": "株式譲渡と事業譲渡の法的な差異に関する記述として、誤っているものはどれか。", "ch": ["株式譲渡では法人格に変動がないため契約は原則存続するが、チェンジ・オブ・コントロール条項があれば事前の協議・交渉が必要になることがある。", "事業譲渡では、資産・負債・契約等を個別に移転するため、債権者や従業員の同意を一つ一つ取り付ける必要がある。", "株式譲渡では、対象会社の許認可は承継されないことが多く、譲り受け側が新規に取得する必要がある。", "事業譲渡では、承継対象を選択できるため、簿外債務や偶発債務のリスクを比較的遮断しやすい。"], "a": 2, "k": null, "ex": "株式譲渡は株主が変わるだけで資産・負債・従業員・契約・許認可等が原則存続するが、簿外・偶発債務も引き継ぎ、COC条項には注意が必要である。事業譲渡は資産・負債・契約・許認可等を個別に移転し、許認可は承継されないことが多く新規取得が必要となる一方、簿外・偶発債務を遮断しやすい。", "cn": ["正しい。株式譲渡では契約・許認可等は原則存続し、COC条項には注意が必要。", "正しい。事業譲渡は個別に移転し、同意を一つ一つ取り付ける。", "誤り（正答）。許認可が承継されず新規取得が必要となることが多いのは事業譲渡である。", "正しい。事業譲渡は簿外・偶発債務リスクを遮断しやすい。"], "src": "参考資料1 p.1-2／GL p.49-50", "ref": "n2-44", "lv": 1}, {"id": "LEG-038", "sub": "法務", "top": "法務基礎", "typ": "全て選べ", "stem": "株式会社である譲り渡し会社がその全事業を事業譲渡により譲り渡す場合に、一般に必要となる手続として資料に示されているものを全て選んだ組合せはどれか。\nア 承継対象債務を免責的に引き受けるための債権者の承諾\nイ 譲り渡し会社における株主総会の特別決議\nウ 譲り渡し会社の株券の譲り受け側への交付\nエ 取引先との契約を移転するための相手方の承諾", "ch": ["ア、イ、エ", "ア、エ", "イ、ウ、エ", "ア、イ、ウ、エ"], "a": 0, "k": null, "ex": "事業譲渡では、免責的債務引受に債権者の承諾が必要で（承諾がなければ原則連帯債務）、全事業譲渡等は原則として株主総会の特別決議が必要となり、取引先との契約移転には相手方の承諾が必要である。株券の交付は株券発行会社の株式譲渡で必要となる手続である。", "cn": ["正しい。ア・イ・エは事業譲渡で必要となる。", "誤り。イ（全事業譲渡等の株主総会特別決議）が漏れている。", "誤り。ウは株式譲渡の手続で、アが漏れている。", "誤り。ウ（株券の交付）は株式譲渡の手続である。"], "src": "参考資料7 p.17, 38-39", "ref": "n4-20", "lv": 2}, {"id": "LEG-039", "sub": "法務", "top": "アドバイザリー（仲介・FA）契約", "typ": "正しい", "stem": "重要事項説明書サンプル(1)（仲介契約とFA契約の違い・特徴）に関する記述として、正しいものはどれか。", "ch": ["FA契約では、双方から依頼を受け、相手方からも手数料を受けるのが通常とされている。", "仲介者が利益相反リスクを最小限とするため最低限講じるべき措置として、両当事者と仲介契約を締結する仲介者であることを両当事者に伝えることが挙げられている。", "仲介者は、双方の意向を一元的に把握できるため、依頼者に有利な条件での成立を目指すとされている。", "利益相反のおそれがある事項は、各当事者から質問があった場合に限り説明すれば足りるとされている。"], "a": 1, "k": null, "ex": "重要事項説明書(1)は、仲介は双方から依頼を受け双方の意向を一元的に把握して成立を目指し、FAは一方のみから依頼を受け依頼者に有利な条件での成立を目指すとする。仲介者が最低限講じるべき措置は、両当事者と契約する仲介者である旨の伝達、一方の意向に偏りやすい工程の結論を決定しないこと、利益相反事項の明示的説明である。", "cn": ["誤り。これは仲介契約の特徴で、FAは一方のみから依頼を受け相手方から手数料を受けない。", "正しい。最低限講じるべき措置の1つ目である。", "誤り。依頼者に有利な条件での成立を目指すのはFAで、仲介者は一方の利益のみを優先できない。", "誤り。予め各当事者に明示的に説明し、別途認識した事項は適時に明示的に開示する。"], "src": "参考資料11 p.2", "ref": "n4-24", "lv": 1}, {"id": "LEG-040", "sub": "法務", "top": "アドバイザリー（仲介・FA）契約", "typ": "最も適切", "stem": "譲り渡し側・譲り受け側の双方と仲介契約を締結している仲介者の、バリュエーション及びDDへの関与として、重要事項説明書サンプル(2)に照らし最も適切なものはどれか。", "ch": ["仲介者が確定的なバリュエーションを実施し、その評価額を譲渡価額として双方に提示する。", "仲介者自らが法務DDを実施し、DD報告書の結論を決定して双方に報告する。", "DD報告書は士業等専門家が作成するが、仲介者が内容を修正して最終的な結論を決定する。", "複数のアプローチによる評価を示しつつ確定的な評価はできない旨を明示し、法務DD・税務DDは外部の士業等専門家に委託する。"], "a": 3, "k": null, "ex": "重要事項説明書(2)は、仲介者がバリュエーション・DDの結論を決定できず、確定的なバリュエーションを実施すべきでなく、DDを自ら実施せず報告書の結論を決定すべきでないとする。業務表では、確定的評価ができない旨の明示や、法務DD・税務DDの外部士業等専門家への委託が示されている。", "cn": ["不適切。仲介者は確定的なバリュエーションを実施すべきでない。", "不適切。仲介者はDDを自ら実施せず、DD報告書の結論を決定すべきでない。", "不適切。仲介者はDDの評価・判断に影響しない範囲の支援に限られる。", "適切。仲介者は確定的評価ができない旨を明示し、法務・税務DDは外部専門家に委託する。"], "src": "参考資料11 p.2-4", "ref": "n4-24", "lv": 2}, {"id": "LEG-041", "sub": "法務", "top": "アドバイザリー（仲介・FA）契約", "typ": "組合せ", "stem": "重要事項説明書サンプルの専任条項・契約期間に関する次の文の空欄A〜Cに入る語句の組合せとして、正しいものはどれか。\n専任条項は、対象範囲を可能な限り限定すべきであり、妨げる合理的理由がなければ（A）を許容すべきである。契約期間は最長でも（B）以内を目安とすべきであり、依頼者が（C）できることを明記する条項等も設けることが望ましい。", "ch": ["A：セカンド・オピニオン　B：6か月〜1年　C：任意の時点で中途解約", "A：セカンド・オピニオン　B：2年〜3年　C：任意の時点で中途解約", "A：候補先との直接交渉　B：6か月〜1年　C：自動延長を拒絶", "A：候補先との直接交渉　B：2年〜3年　C：自動延長を拒絶"], "a": 0, "k": null, "ex": "重要事項説明書(8)(11)(12)は、専任条項の対象範囲を可能な限り限定し、合理的理由がなければセカンド・オピニオンを許容すべきとし、契約期間は最長でも6か月〜1年以内を目安とし、依頼者が任意の時点で中途解約できることを明記する条項等
