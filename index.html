を設けることが望ましいとする。", "cn": ["正しい。セカンド・オピニオン、6か月〜1年、任意の時点で中途解約。", "誤り。2年〜3年はテール期間の目安である。", "誤り。Aはセカンド・オピニオン、Cは任意の時点での中途解約。", "誤り。A・B・Cいずれも誤り。"], "src": "参考資料11 p.8-10", "ref": "n4-24", "lv": 2}, {"id": "LEG-042", "sub": "法務", "top": "アドバイザリー（仲介・FA）契約", "typ": "誤り", "stem": "重要事項説明書サンプルの直接交渉の制限・テール条項に関する記述として、誤っているものはどれか。", "ch": ["直接交渉の制限の対象は、依頼者が明示的に了解した場合を除き、仲介者・FAが関与・接触し紹介した候補先のみに限定すべきとされている。", "直接交渉の制限の目的は、M&A取引に関するものに限定すべきとされている。", "直接交渉の制限は、契約終了後も最長2年〜3年以内を目安として存続させるべきとされている。", "テール条項の対象は、仲介者・FAが関与・接触し紹介した譲り受け側のみに限定すべきとされている。"], "a": 2, "k": null, "ex": "重要事項説明書(9)は、直接交渉の制限を、紹介した候補先のみ、M&A取引に関する目的のみ、有効期間は契約終了までに限定すべきとする。(10)(14)は、テール期間は最長でも2年〜3年以内を目安とし、対象は関与・接触し紹介した譲り受け側のみに限定すべきとする。", "cn": ["正しい。(9)①のとおり。", "正しい。(9)②のとおり。", "誤り（正答）。直接交渉の制限の有効期間は契約終了までと限定すべき。2年〜3年はテール期間の目安。", "正しい。(10)②のとおり。"], "src": "参考資料11 p.9-10", "ref": "n4-24", "lv": 2}, {"id": "LEG-043", "sub": "法務", "top": "リスク", "typ": "正しい", "stem": "最終契約におけるリスク事項説明書サンプル（参考資料12）とGL上の位置づけに関する記述として、正しいものはどれか。", "ch": ["7項目のリスクはいずれも認識した段階で説明することが望ましいとされ、説明は義務とはされていない。", "経営者保証の扱い、DDの非実施、表明保証の内容の3項目は、仲介者・FAが説明しなければならないリスクとされている。", "掲載されている7項目は網羅的なものであり、これ以外のリスクを説明する必要はないとされている。", "アーンアウト条項や株価調整条項は、調整が不十分な段階でも、トラブル防止のため積極的に提案すべきとされている。"], "a": 1, "k": null, "ex": "リスク事項説明書は最終契約のリスクをGLに基づき説明する書面で、(1)経営者保証、(2)DDの非実施、(3)表明保証は仲介者・FAが説明しなければならず、(4)〜(7)は認識した段階で可能な限り具体的に説明することが望ましい。掲載リスクは代表的なもので、その他のリスクも必要に応じ説明することが望まれる。", "cn": ["誤り。(1)〜(3)は説明義務で、(4)〜(7)が認識した段階で説明することが望ましいとされる。", "正しい。(1)〜(3)は認識の有無に関わらず対応するリスクで、説明しなければならない。", "誤り。掲載リスクは代表的なもので、善管注意義務の観点からその他のリスクも必要に応じ説明することが望まれる。", "誤り。調整不十分な段階で安易に提案すべきでなく、提案する場合は組織的な判断による。"], "src": "参考資料12 p.1／GL p.96-98", "ref": "n4-25", "lv": 2}, {"id": "LEG-044", "sub": "法務", "top": "リスク", "typ": "正しい", "stem": "リスク事項説明書サンプルの項目・チェック項目に関する記述として、正しいものはどれか。", "ch": ["アーンアウト条項は、クロージング後一定期間の目標未達に応じて譲渡対価を減額する条項で、その期間は5年以上が多いとされている。", "予算制約がある場合はDDを実施せず、譲り渡し側へのヒアリングで代替することが望ましいとされている。", "会社と個人の財産が未分離の場合、資産の整理はクロージング後に行うことが原則とされている。", "最終契約からクロージングまでの期間が2ヶ月以上の場合、業績変化等により契約修正が必要となるリスクや不履行リスクがあるとされている。"], "a": 3, "k": null, "ex": "リスク事項説明書(7)は、最終契約からクロージングまでが2ヶ月以上の場合の契約修正・不履行リスクを挙げる。(5)のアーンアウト条項はクロージング後一定期間（3年以内が多い）の目標達成で追加対価を支払う条項である。(2)はDDの非実施、(6)は資産の整理を最終契約前に行うことに関する項目である。", "cn": ["誤り。目標達成で追加対価を支払う条項で、期間は3年以内が多いとされる。", "誤り。DDの非実施やヒアリングのみはチェック項目で、予算制約があっても対象を絞る等の工夫で実施を検討することが望まれる。", "誤り。可能な限り最終契約前に整理し、残る場合も移転方法・譲渡額を具体的に明記する。", "正しい。(7)のとおり。"], "src": "参考資料12 p.2-5", "ref": "n4-25", "lv": 2}, {"id": "LEG-045", "sub": "法務", "top": "リスク", "typ": "正しい", "stem": "「中小M&Aにおける経営者保証の取扱い」（参考資料13）の背景に関する記述として、正しいものはどれか。", "ch": ["中小企業庁は2020年4月に中小M&Aガイドラインを改訂し、M&A専門業者に成立前からの金融機関等への相談の説明等を求めた。", "本資料は、M&A専門業者のみを対象としたガイダンスである。", "譲り渡し側の経営困難に乗じてM&Aを実施した後、資金を私的に流出させる一方で経営者保証の解除等を行わない不適切な譲り受け側の存在が報告されている。", "金融庁は監督指針等を改訂し、経営者保証の解除等の審査はM&A成立後にのみ行うよう金融機関に求めた。"], "a": 2, "k": null, "ex": "参考資料13は、経営困難に乗じたM&A後に資金を私的に流出させ、経営者保証の解除等を行わないまま連絡を絶つ不適切な譲り受け側を市場から排除する必要があるとする。中小企業庁は2024年8月にGL（第3版）を改訂し、金融庁も2024年8月に監督指針等を改訂した。本資料は関係者全体へのガイダンスである。", "cn": ["誤り。中小M&Aガイドライン（第3版）の改訂は2024年8月である。", "誤り。譲り渡し側・譲り受け側・M&A専門業者・金融機関・保証機関等へのガイダンスである。", "正しい。参考資料13「はじめに」のとおり。", "誤り。金融庁は2024年8月に監督指針等を改訂し、経営者保証GLに沿った対応を求めた。"], "src": "参考資料13 p.1", "ref": "n4-27", "lv": 1}, {"id": "LEG-046", "sub": "法務", "top": "最終契約", "typ": "最も適切", "stem": "M&Aにおける経営者保証の取扱いの基本原則に関する記述として、最も適切なものはどれか。", "ch": ["M&A成立と同時の解除等（借換えを含む）が最も優先され、金融機関等への相談は少なくとも最終契約後からクロージング前の間までには開始されるべきである。", "経営者保証の解除等はクロージング後の代表者変更登記を待って検討を開始すれば足り、成立前の相談は不要である。", "信用保証協会等の他機関の保証が付されている場合は審査期間が短くなるため、相談開始を遅らせてもよい。", "譲り受け側の資力による借換えは成立と同時に行う場合に限り有効であり、成立後の借換えは選択肢とならない。"], "a": 0, "k": null, "ex": "参考資料13は、M&A成立と同時の解除等（借換えを含む）を最も優先し、困難なら成立後可能な限り早期に行うとする。相談は可能な限り最終契約締結の一定期間前に開始することが望ましく、少なくとも最終契約後からクロージング前の間までには開始されるべきである。", "cn": ["適切。参考資料13の基本原則のとおり。", "不適切。相談は可能な限り最終契約締結の一定期間前に開始することが望ましい。", "不適切。他機関の保証が付されている場合は時間を要する可能性がある。", "不適切。時間的猶予がない場合は成立後の借換えも有効な選択肢である。"], "src": "参考資料13 p.1-2", "ref": "n4-28", "lv": 2}, {"id": "LEG-047", "sub": "法務", "top": "最終契約", "typ": "最も適切", "stem": "経営者保証の取扱いに関する各ステークホルダーの対応として、参考資料13に照らし最も適切なものはどれか。", "ch": ["譲り受け側は、譲り渡し側から特段の申出がない限り、経営者保証の解除等は希望されていないものと認識してよい。", "金融機関が、「代表者の変更がなされていない」「成立前の段階」といった形式的理由で審査を拒む対応は不適切とされている。", "M&A専門業者は、譲り渡し側から金融機関等への成立前の相談の希望があっても、秘密保持の観点から拒むべきとされている。", "M&A専門業者は、譲り受け側に対する調査の概要を、最終契約の締結前までに説明すれば足りるとされている。"], "a": 1, "k": null, "ex": "参考資料13は、金融機関に形式的理由で審査を拒まないこと、譲り受け側に解除等を当然に譲り渡し側が希望する条件と認識すること、M&A専門業者に成立前相談の希望を拒まず秘密保持条項から相談先を除外すること、譲り受け側に対する調査概要を仲介契約・FA契約締結前に説明することを求める。", "cn": ["不適切。特段の申出がない限り、解除等は当然に譲り渡し側が希望する条件と認識する。", "適切。形式的理由で審査を拒む対応は不適切とされる。", "不適切。希望があれば拒むべきでなく、秘密保持条項から相談先を除外する。", "不適切。仲介契約・FA契約の締結前に調査概要を説明する。"], "src": "参考資料13 p.3-7", "ref": "n4-29", "lv": 2}, {"id": "LEG-048", "sub": "法務", "top": "最終契約", "typ": "組合せ", "stem": "中小M&Aガイドライン第1章で、経営者保証に関するガイドラインが主たる債務者に求めるものとして挙げられている3点の組合せとして、正しいものはどれか。\nア 法人と経営者との関係の明確な区分・分離\nイ 財務基盤の強化\nウ 後継者による新たな個人保証の差入れ\nエ 財務状況の正確な把握、適時適切な情報開示等による経営の透明性確保", "ch": ["ア、イ、ウ", "イ、ウ、エ", "ア、ウ、エ", "ア、イ、エ"], "a": 3, "k": null, "ex": "GL第1章は、経営者保証GLが主たる債務者に求める3点として、法人と経営者との関係の明確な区分・分離、財務基盤の強化、財務状況の正確な把握・適時適切な情報開示等による経営の透明性確保を挙げる。解除・移行は最終的には金融機関等の判断で、正式な解除・移行はクロージングを経て登記簿上の代表者変更後に行う必要がある。", "cn": ["誤り。ウは含まれない。特則は事業承継時の二重徴求を原則禁止している。", "誤り。ウは含まれず、アが漏れている。", "誤り。ウは含まれず、イが漏れている。", "正しい。ア・イ・エが経営者保証GLの求める3点である。"], "src": "GL p.24, 51-52", "ref": "n4-30", "lv": 2}, {"id": "LEG-049", "sub": "法務", "top": "最終契約", "typ": "正しい", "stem": "中小M&Aガイドライン第2章における、経営者保証に関する仲介者・FAの対応として、正しいものはどれか。", "ch": ["成立前の相談希望があれば拒むべきではなく、秘密保持条項から相談先を除外する必要があり、譲り受け側にも除外を働きかけなければならない。", "成立前の相談が選択肢である旨の説明は、譲り渡し側から質問があった場合に行うことが望ましいとされている。", "譲り渡し側の債務超過が背景にある場合でも、M&Aの実行を前提として支援を進めることが求められている。", "最終契約では、経営者保証の解除を譲り受け側の努力義務にとどめ、解除条項・補償条項は盛り込まないよう調整するべきとされている。"], "a": 0, "k": null, "ex": "GL第2章は、仲介者・FAが経営者と方針を相談し、成立前相談が選択肢である旨を説明しなければならず、相談希望は拒むべきでなく秘密保持条項から相談先を除外する必要があるとする。最終契約では譲り受け側の義務、クロージング条件、契約解除条項・補償条項等を盛り込む方向で調整するべきとされる。", "cn": ["正しい。GL p.97のとおり。", "誤り。意向を丁寧に聴取し、成立前相談が選択肢である旨を説明しなければならない。", "誤り。そもそもM&Aを実行すべきかも含めて慎重に検討することが求められる。", "誤り。譲り受け側の義務とし、クロージング条件とし、解除条項・補償条項等を盛り込む方向で調整するべきである。"], "src": "GL p.97-98", "ref": "n4-31", "lv": 2}, {"id": "LEG-050", "sub": "法務", "top": "リスク", "typ": "誤り", "stem": "最終契約で経営者保証等の解除が譲り受け側の義務（努力義務を含む）として合意された場合に、「情報共有の仕組み」の登録事由として示されていないものはどれか。", "ch": ["解除に合理的に要する一定期間を経過しても解除されないとき", "譲り受け側が速やかに金融機関等との相談を開始し、解除に合理的に要する期間内で審査が継続しているとき", "金融機関等との解除に向けた相談をすみやかに開始しないとき", "解除不可・条件付きとされた場合に、借換・一括返済・条件充足等で解除を実現しないとき"], "a": 1, "k": null, "ex": "情報共有の仕組みでは、最終契約で経営者保証等の解除が譲り受け側の義務（努力義務を含む）とされた場合に、合理的期間を経過しても解除されない、相談をすみやかに開始しない、解除不可・条件付きの場合に借換・一括返済・条件充足等で解除を実現しない、の3つを登録事由とする。株式譲渡契約書サンプル第15条の2も、同様の事由を甲の解除・買戻し事由として定めている。", "cn": ["登録事由である（1つ目）。", "登録事由ではない（正答）。相談を速やかに開始し、合理的期間内で審査中であれば登録事由に当たらない。", "登録事由である（2つ目）。", "登録事由である（3つ目）。"], "src": "情報共有 p.2／参考資料7 p.22", "ref": "n4-32", "lv": 2}, {"id": "MKT-001", "sub": "市場・政策", "top": "試験・資格制度", "typ": "正しい", "stem": "資料2（2026年3月）で示された中小M&A資格試験の実施方式の想定として、正しいものはどれか。", "ch": ["設問数は50問程度とし、CBT方式により90分で実施することを想定している。", "設問数は60問程度とし、CBT方式により120分で実施することを想定している。", "CBT方式のため、立ち上げ期から受験者が任意のタイミングで随時受験できる方式を想定している。", "立ち上げ期から、公認会計士・税理士等の有資格者には財務・税務科目の免除を設ける想定である。"], "a": 1, "k": null, "ex": "資料2は、試験全体で60問程度、CBT方式で120分の実施を想定している。問題が出回るリスクを踏まえ、立ち上げ期は年3回程度の受験機会を設けたうえで一斉実施とする。科目免除は少なくとも立ち上げ期には設けない。", "cn": ["誤り。50問程度は資料1時点の構想で、資料2では60問程度・120分とされた。", "正しい。資料2は設問数60問程度、CBT方式・120分を想定している。", "誤り。問題流出リスクから、立ち上げ期は年3回程度の一斉実施を想定している。", "誤り。科目免除は少なくとも立ち上げ期には設けないことで一致している。"], "src": "資料2 p.3, 6, 11", "ref": "n5-7", "lv": 1}, {"id": "MKT-002", "sub": "市場・政策", "top": "試験・資格制度", "typ": "組合せ", "stem": "資料2で示された科目毎の出題割合について、空欄A〜Cに入る語句の組合せとして正しいものはどれか。\n「M&A実務は（A）程度で、そのうち中小M&A市場・中小企業政策は5%（3問）程度とされる。倫理・行動規範は（B）程度、法務は（C）程度とされる。」", "ch": ["A：20〜23%　B：25%　C：17〜18%", "A：35〜40%　B：17〜18%　C：25%", "A：35〜40%　B：25%　C：20〜23%", "A：35〜40%　B：25%　C：17〜18%"], "a": 3, "k": null, "ex": "資料2は、M&A実務と倫理・行動規範の出題割合を他科目より高く設定している。M&A実務35〜40%（うち市場・政策5%）、財務・税務20〜23%、法務17〜18%、倫理・行動規範25%程度で、60問換算では倫理が15問程度となる。", "cn": ["誤り。20〜23%は財務・税務の割合である。", "誤り。倫理・行動規範と法務の割合が入れ替わっている。", "誤り。20〜23%は財務・税務で、法務は17〜18%程度である。", "正しい。M&A実務35〜40%、倫理・行動規範25%、法務17〜18%である。"], "src": "資料2 p.11", "ref": "n5-7", "lv": 1}, {"id": "MKT-003", "sub": "市場・政策", "top": "試験・資格制度", "typ": "誤り", "stem": "資料2で示された中小M&A資格試験の難易度・合格基準等に関する記述として、誤っているものはどれか。", "ch": ["試験に合格すれば、弁護士法第72条や税理士法第52条の独占業務に当たる業務の一部も行えるようになる。", "総得点の70〜80%程度の得点率を合格基準とする想定である。", "特定科目の得点だけで合格することを防ぐため、科目別の最低合格基準（50%程度）を設定する想定である。", "倫理・行動規範の問題について、禁忌肢の設定が検討されている。"], "a": 0, "k": null, "ex": "合格基準は総得点の70〜80%程度で、特定科目のみの得点による合格を防ぐため科目別最低基準（50%程度）を設ける想定である。倫理・行動規範には禁忌肢の設定が検討されている。一方、合格は士業の独占業務の実施を可能とするものではなく、独占業務に抵触しないよう留意を要する。", "cn": ["誤り。合格は既存の業法に基づく独占業務の実施を可能とするものではない。", "正しい。資料2の想定どおりである。", "正しい。網羅的な学習を求めるため科目別最低基準を設ける。", "正しい。倫理・行動規範を最も重視するメッセージとして禁忌肢の設定が検討されている。"], "src": "資料2 p.3, 5, 7", "ref": "n5-7", "lv": 1}, {"id": "MKT-004", "sub": "市場・政策", "top": "試験・資格制度", "typ": "最も適切", "stem": "資料2で示された、試験合格後の合格者登録制度（案）に関する記述として、最も適切なものはどれか。", "ch": ["試験に合格すれば、講習を受けなくても自動的に資格登録者名簿に登録される。", "登録者が倫理規程に違反しても氏名公表は行われず、登録停止のみが想定されている。", "試験合格後、登録講習の受講（又は講習免除要件の充足）を経て名簿に登録され、登録時及び定期的な講習（1〜2年ごと等）の受講が要件とされる。", "登録のメリットは資格証の交付に限られ、データベースでの氏名公表は想定されていない。"], "a": 2, "k": null, "ex": "資料2の登録制度案では、倫理規程の遵守、違反時の処分（氏名公表等）への同意、登録時及び定期的な講習（1〜2年ごと等）の受講が登録要件とされる。登録者はデータベースで氏名公表され資格証が交付される。合格後は登録講習の受講（又は免除要件の充足）を経て名簿に登録する流れが示されている。", "cn": ["不適切。登録講習の受講又は免除要件の充足を経て名簿に登録するイメージである。", "不適切。違反時は氏名公表・取消し等が想定されている。", "適切。資料2の登録要件・プロセスのイメージどおりである。", "不適切。倫理規程を遵守する資格保有者としてデータベースで氏名公表される。"], "src": "資料2 p.3, 17", "ref": "n5-7", "lv": 2}, {"id": "MKT-005", "sub": "市場・政策", "top": "試験・資格制度", "typ": "正しい", "stem": "資料1（2025年6月）で示された、アドバイザー個人の質の向上に向けた資格制度の構想に関する記述として、正しいものはどれか。", "ch": ["試験は、まず国家資格として法律で創設する方向で検討すべきとされている。", "試験の形式は、記述式を中心に合計60問程度とするイメージが示されている。", "「中小M&Aアドバイザー登録制」の要件として、定期的な講習の受講（概ね3〜5年ごと）が挙げられている。", "参考とされた米国IBBAの認定資格は、5年ごとの更新が必要とされている。"], "a": 2, "k": null, "ex": "資料1は、質の高いアドバイザーを可視化するため、まずは民間ベースで「中小M&Aアドバイザー試験」を創設し、登録制も併せて運用開始すべきとした。登録制の要件は倫理規程の遵守、違反時の処分への同意、定期的な講習の受講（概ね3〜5年ごと）である。なお資料2の登録制度案では定期講習は1〜2年ごと等とされている。", "cn": ["誤り。まずは民間ベースでの取組として創設する方向とされた。", "誤り。資料1のイメージは選択式・短答式（CBT想定）で合計50問程度である。", "正しい。資料1は倫理規程遵守、処分への同意、定期講習（概ね3〜5年ごと）を要件としている。", "誤り。IBBAの資格は3年ごとの更新が必要である。"], "src": "資料1 p.5-6", "ref": "n5-1", "lv": 2}, {"id": "MKT-006", "sub": "市場・政策", "top": "中小企業政策", "typ": "正しい", "stem": "資料1に記載された「スキルマップ」に関する記述として、正しいものはどれか。", "ch": ["2025年4月に公表され、使命、倫理・行動規範、知識・スキルマップの3本柱で構成されている。", "倫理・行動規範は、中小M&Aガイドライン第2版のみを踏まえて整理されている。", "資料1は、今後も組織単位の規律遵守のみで市場の健全化を図るべきとしている。", "知識・スキルマップは、財務・税務と法務の2領域に限定して体系化されている。"], "a": 0, "k": null, "ex": "スキルマップは2025年4月に取りまとめ・公表され、使命、倫理・行動規範、知識・スキルマップの3本柱からなる。倫理・行動規範は中小M&Aガイドライン（第3版）等を踏まえて整理された。資料1は、これまでの組織単位の規律に加え、個人レベルの質の向上を両輪で図る必要があるとした。", "cn": ["正しい。有識者との議論を経て2025年4月に公表された。", "誤り。中小M&Aガイドライン（第3版）、既存国家資格の倫理規程、実務等を踏まえて整理された。", "誤り。組織レベルの規律浸透と両輪で個人レベルの質の向上を図る必要があるとしている。", "誤り。企業経営、会計・ファイナンス、税務、法務等を含み、M&Aプロセスごとに体系化されている。"], "src": "資料1 p.3-4", "ref": "n5-2", "lv": 1}, {"id": "MKT-007", "sub": "市場・政策", "top": "中小M&A市場動向", "typ": "誤り", "stem": "資料1に記載された仲介・FAの手数料の状況に関する記述として、誤っているものはどれか。", "ch": ["登録機関には標準的な手数料の報告が求められ、HP上のデータベースで公表されている。", "最低手数料は、500万円や1,000万円で設定する機関が多い。", "手数料は業務内容・質に応じて競争的に設定されるべきで、その前提として比較可能性の高い形で示される必要があるとされる。", "手数料の算定はレーマン方式が多く、報酬基準額は移動総資産とする機関が最も多い。"], "a": 3, "k": null, "ex": "資料1は、登録機関に標準的な手数料の報告を求めデータベースで公表していること、最低手数料は500万円や1,000万円の設定が多いことを示した。算定はレーマン方式が多く、報酬基準額は株価が多い。手数料は業務内容・質に応じ競争的に設定されるべきで、比較可能性の高い形で示される必要があるとした。", "cn": ["正しい。最低手数料の水準や報酬基準額の種類等で検索できる。", "正しい。最低手数料の設定が一般的で、500万円・1,000万円の設定が多い。", "正しい。資料1の問題意識どおりである。", "誤り。報酬基準額は株価とする機関が多い。"], "src": "資料1 p.7-9", "ref": "n5-3", "lv": 2}, {"id": "MKT-008", "sub": "市場・政策", "top": "中小M&A市場動向", "typ": "正しい", "stem": "資料1に示された中小M&Aの成約状況や候補先の探し方に関する記述として、正しいものはどれか。", "ch": ["民間M&A支援機関の成約（2023年度）では、売手の従業員規模「1〜5人」の割合が最も高い。", "事業承継・引継ぎ支援センターの成約（2023年度）では、売手の従業員規模「1〜5人」の割合が最も高い。", "M&A実施意向のある企業の候補先の探し方は、売手・買手とも「専門仲介機関」が最多である。", "候補先の探し方として「事業承継・引継ぎ支援センター」を挙げた割合は、買い手のほうが売り手より高い。"], "a": 1, "k": null, "ex": "民間支援機関の成約は従業員6〜20人、21〜100人の売手が多く、小規模案件は少ない一方、センターは小規模案件を中心に支援している（1〜5人が54%）。候補先の探し方は売手・買手とも「金融機関に探索を依頼」が最多である。資料1は特に小規模事業者のM&Aの拡大が必要としている。", "cn": ["誤り。民間は6〜20人が46%で最も高く、1〜5人は22%にとどまる。", "正しい。センターの成約は1〜5人が54%で最も高い。", "誤り。売手・買手とも「金融機関に探索を依頼」が最多である。", "誤り。買い手9%、売り手14%で売り手のほうが高い。"], "src": "資料1 p.10, 12", "ref": "n5-4", "lv": 2}, {"id": "MKT-009", "sub": "市場・政策", "top": "中小M&A市場動向", "typ": "最も適切", "stem": "資料1に示されたM&Aアドバイザーの地域偏在や支援体制に関する記述として、最も適切なものはどれか。", "ch": ["三大都市圏への集中度は、M&Aアドバイザーのほうが公認会計士（88%）よりも高い。", "最も得意な分野を「事業承継・M&A」とする中小企業診断士は16.3%で、得意分野の中で最多である。", "資料1は、地域・小規模案件の支援のため、センターを地域金融機関や士業から切り離した独自の体制とする方向を示した。", "M&Aアドバイザーは三大都市圏に約85%が集中しており、企業1万社当たりM&A件数（2023年度）は東京都が最多、島根県が最少である。"], "a": 3, "k": null, "ex": "M&Aアドバイザーは三大都市圏に約85%が集中し、地方は約15%にとどまる。企業1万社当たりM&A件数は東京都23.6件が最多、島根県4.1件が最少である。資料1は、金融機関のトレーニー派遣事例や診断士の活動意欲を踏まえ、地域金融機関や士業を巻き込んでセンターの体制を強化すべきとした。", "cn": ["不適切。M&Aアドバイザーは約85%で、公認会計士88%より低い。", "不適切。得意分野とするのは2.4%で、16.3%は今後最も活動したい分野としての割合である。", "不適切。地域金融機関や地域の士業を巻き込んでセンターの体制を強化する方向である。", "適切。東京都23.6件が最多、島根県4.1件が最少である。"], "src": "資料1 p.11, 13-14, 25", "ref": "n5-4", "lv": 2}, {"id": "MKT-010", "sub": "市場・政策", "top": "中小企業政策", "typ": "計算", "stem": "中堅・中小グループ化税制（中小企業事業再編投資損失準備金の拡充）について、過去5年以内にM&A実績のある中小企業が、2回目のM&Aとして株式を3億円で取得し、拡充枠の適用を受けるとする。資料1に基づく準備金の積立上限額と据置期間の組合せとして、正しいものはどれか。", "ch": ["2億1,000万円・5年", "2億7,000万円・10年", "3億円・10年", "2億7,000万円・5年"], "a": 1, "k": null, "ex": "拡充枠では積立率がM&A2回目90%、3回目以降100%に拡大され、据置期間は10年とされた。3億円×90%＝2億7,000万円が積立上限となる。拡充枠の利用には産業競争力強化法で新設する認定と、過去5年以内のM&A実績が必要である。", "cn": ["誤り。70%・5年は当初制度（1回目）の積立率・据置期間である。", "正しい。2回目は取得価額の90%まで積立可能で、据置期間は10年である。", "誤り。積立率100%は3回目以降のM&Aである。", "誤り。拡充枠の据置期間は10年に長期化されている。"], "src": "資料1 p.16", "ref": "n5-5", "lv": 2}, {"id": "MKT-011", "sub": "市場・政策", "top": "中小企業政策", "typ": "誤り", "stem": "資料1に記載された日本政策金融公庫の事業承継・集約・活性化支援資金（M&A関連）に関する記述として、誤っているものはどれか。", "ch": ["2024年2月、融資上限枠が7.2億円から14.4億円へ拡充された。", "対象者は、事業の買手（従業員等の個人を含む）及び売手である。", "融資限度額は、国民生活事業で14億4千万円、中小企業事業で7千2百万円である。", "融資期間は設備資金20年以内、長期運転資金10年以内（いずれも据置5年以内）である。"], "a": 2, "k": null, "ex": "公庫の第三者承継関係の融資実績は2020年度以降大幅に伸長し、2024年2月に融資上限枠が7.2億円から14.4億円へ拡充された。融資限度額は中小企業事業14億4千万円、国民生活事業7千2百万円である。融資期間は設備資金20年以内、長期運転資金10年以内（据置5年以内）である。", "cn": ["正しい。中小企業のグループ化促進に向けて大幅に拡充された。", "正しい。資料1の記載どおりである。", "誤り。中小企業事業が14億4千万円、国民生活事業が7千2百万円で、逆になっている。", "正しい。資料1の記載どおりである。"], "src": "資料1 p.17", "ref": "n5-5", "lv": 2}, {"id": "MKT-012", "sub": "市場・政策", "top": "中小企業政策", "typ": "正しい", "stem": "資料1及び資料2に記載された事業承継・M&A補助金（令和6年度補正予算）に関する記述として、正しいものはどれか。", "ch": ["事業承継促進枠、専門家活用枠、PMI推進枠、廃業・再チャレンジ枠の4つの枠がある。", "事業承継促進枠は、10年以内に予定している第三者承継（M&A）前の設備投資を対象とする。", "専門家活用枠では、M&A支援機関登録制度に登録していない業者のFA・仲介手数料も補助対象となる。", "廃業・再チャレンジ枠の補助上限は800〜1,000万円である。"], "a": 0, "k": null, "ex": "事業承継・M&A補助金には、事業承継促進枠・専門家活用枠・PMI推進枠・廃業・再チャレンジ枠の4つの枠がある。事業承継促進枠は5年以内に予定する親族内・従業員承継前の設備投資が対象で、廃業・再チャレンジ枠の上限は150万円である。専門家活用枠のFA・仲介手数料は登録業者のもののみが補助対象である。", "cn": ["正しい。資料1は4つの枠を示している。", "誤り。5年以内に予定している親族内承継・従業員承継の前の設備投資が対象である。", "誤り。令和3年度当初予算より、登録FA・仲介業者の手数料のみが補助対象である。", "誤り。廃業・再チャレンジ枠の補助上限は150万円である。"], "src": "資料1 p.18／資料2 p.20", "ref": "n5-5", "lv": 2}, {"id": "MKT-013", "sub": "市場・政策", "top": "中小企業政策", "typ": "正しい", "stem": "資料1に記載された事業承継・M&A補助金のPMI推進枠及びPMIに関するデータについて、正しいものはどれか。", "ch": ["PMI専門家活用類型は、PMIを専門家に委託する費用が対象で、補助率1/2、補助上限150万円である。", "事業統合投資類型の補助上限は、賃上げ実施の有無にかかわらず一律800万円である。", "事業統合投資類型の補助率は、小規模事業者を含めて一律1/2である。", "中小企業白書のデータでは、PMIを検討していない企業のほうが、基本合意前から検討を開始した企業よりも満足度が期待以上となった割合が高い。"], "a": 0, "k": null, "ex": "PMI推進枠は12次公募回から新設され、PMI専門家活用類型（上限150万円・補助率1/2）と事業統合投資類型（上限800万円、賃上げ時1,000万円・小規模2/3、それ以外1/2）がある。M&A成立前から早期にPMIの検討を開始した企業ほど、満足度が期待以上となった割合が高い。", "cn": ["正しい。資料1の記載どおりである。", "誤り。賃上げ実施時は1,000万円に引き上げられる。", "誤り。小規模事業者は2/3、それ以外が1/2である。", "誤り。基本合意前に検討開始した企業は74.8%、検討していない企業は48.4%である。"], "src": "資料1 p.19-20", "ref": "n5-5", "lv": 2}, {"id": "MKT-014", "sub": "市場・政策", "top": "中小M&A市場動向", "typ": "最も適切", "stem": "資料1に記載されたファンドによる投資の動向に関する記述として、最も適切なものはどれか。", "ch": ["日本のPE投資市場の拡大は、主に250億円未満の小規模案件への投資増加がけん引している。", "地銀出資の事業承継ファンドは、一般にバイアウトファンドより規模が大きく、200億円超が最多帯である。", "サーチファンドは、経営者を目指す個人（サーチャー）が投資家の支援を受けて中小企業をM&Aし、自ら経営に携わる仕組みで、PEとVCの中間の投資業態とされる。", "対GDP比のPE投資規模（2019〜2023年平均）で、日本は米国・英国を上回っている。"], "a": 2, "k": null, "ex": "PE市場の拡大は500億円超の大規模案件がけん引しており、日本の対GDP比PE投資規模は0.4%と諸外国比で低水準である。地銀出資の事業承継ファンドは規模が小さく、小規模案件も含めて投資する。サーチファンドはPEとVCの中間の投資業態で、日本では成功モデルの創出が課題とされる。", "cn": ["不適切。500億円超の大規模案件がけん引し、250億円未満の増加は限定的である。", "不適切。地銀出資ファンドは規模が小さく、10〜30億円が最多帯である。", "適切。資料1のサーチファンドの説明どおりである。", "不適切。日本は0.4%で、米国1.3%・英国1.9%より低く、未だ低水準である。"], "src": "資料1 p.21-23", "ref": "n5-5", "lv": 2}, {"id": "MKT-015", "sub": "市場・政策", "top": "中小企業政策", "typ": "組合せ", "stem": "資料2に記載されたM&A支援機関登録制度について、空欄A〜Cに入る語句の組合せとして正しいものはどれか。\n「M&A支援機関登録制度は（A）に運用を開始し、2026年3月現在、M&A専門業者（仲介・FA）約（B）者を中心に、約（C）者の支援機関が登録している。」", "ch": ["A：2020年3月　B：1,200　C：3,400", "A：2021年8月　B：1,200　C：3,400", "A：2021年8月　B：2,000　C：3,400", "A：2024年8月　B：1,200　C：3,400"], "a": 1, "k": null, "ex": "M&A支援機関登録制度は、中小M&Aガイドラインの遵守宣言等を要件として2021年8月に運用を開始した。2026年3月現在、M&A専門業者（仲介・FA）約1,200者を中心に約3,400者が登録している。トラブルを抱える中小企業者等からの情報提供受付窓口も設置されている。", "cn": ["誤り。2020年3月（令和2年3月）は中小M&Aガイドラインの策定時期である。", "正しい。資料2の記載どおりである。", "誤り。M&A専門業者は約1,200者である。", "誤り。2024年8月はガイドライン第3版への改訂時期である。"], "src": "資料2 p.20", "ref": "n5-7", "lv": 1}, {"id": "MKT-016", "sub": "市場・政策", "top": "中小企業政策", "typ": "誤り", "stem": "資料2に記載されたM&A支援機関登録制度の対象・登録要件に関する記述として、誤っているものはどれか。", "ch": ["業種を問わず、FA業務又は仲介業務を行う者が対象であり、仲介業務を行う金融機関も対象となる。", "中小M&Aガイドラインの遵守を宣言し、その旨を自社HP等で公表することが登録要件とされている。", "要件を充足しなくなった場合には登録の取消し等が行われ、2023年5月に取消要領が公表されている。", "DD（デュー・ディリジェンス）のみを行う士業等専門家も、登録制度の対象となる。"], "a": 3, "k": null, "ex": "登録制度の対象はFA業務又は仲介業務を行う者で、業種を問わず、仲介業務を行う金融機関も含むが、DDのみを行う士業等専門家などは対象外である。登録要件にはGL遵守の宣言と公表、手数料体系等の提出・公表への同意、契約締結時のGL遵守の事前説明等がある。要件を充足しない場合は登録取消し等が行われ、2023年5月に取消要領が公表された。", "cn": ["正しい。資料2の記載どおりである。", "正しい。主な登録要件の1つである。", "正しい。資料2の記載どおりである。", "誤り。DDのみを行う士業等専門家などは対象としない。"], "src": "資料2 p.20", "ref": "n5-8", "lv": 2}, {"id": "MKT-017", "sub": "市場・政策", "top": "中小M&A市場動向", "typ": "最も適切", "stem": "資料2に記載された、M&A支援機関登録制度の情報提供受付窓口に寄せられた情報の状況に関する記述として、最も適切なものはどれか。", "ch": ["情報提供件数は、窓口設置以降、毎年度減少している。", "ガイドライン改訂の効果により、営業以外に関する事案は明確な減少傾向にある。", "2024年度の情報提供件数は126件で、うち営業に関する事案が91件、営業以外に関する事案が35件であった。", "窓口の情報は統計として集計されるのみで、個別の事業者への注意や指示に用いられることはない。"], "a": 2, "k": null, "ex": "情報提供受付窓口は2021年11月に設置され、2024年度は126件（営業91件・営業以外35件）であった。重要事項説明が実施されるようになった等の変化がある一方、営業以外の事案は減少しておらず、登録制度のあり方の再検討が問題提起されている。窓口情報に基づき注意・指示や登録取消しが行われる。", "cn": ["不適切。2021年度7件、2022年度18件、2023年度32件、2024年度126件と増加し、2025年度は2月現在80件である。", "不適切。より深刻なトラブルに繋がりやすい営業以外の事案は減少していないとされる。", "適切。資料2の件数どおりである。", "不適切。ヒアリング等の上で注意や対策の指示、場合により登録取消しを行う。"], "src": "資料2 p.21", "ref": "n5-9", "lv": 2}, {"id": "MKT-018", "sub": "市場・政策", "top": "中小企業政策", "typ": "正しい", "stem": "資料2に記載された事業承継・引継ぎ支援センターの取組に関する記述として、正しいものはどれか。", "ch": ["センターは第三者承継（M&A）に限って支援を行い、親族内承継は支援の対象外である。", "センターでのトレーニー受入れは、令和8年度から商工団体職員のみを対象として開始される。", "進行中の第三者承継の手続について、センターにセカンドオピニオンとして相談することはできない。", "各都道府県の事業承継ネットワーク参加機関が事業承継診断を実施し、必要な場合にセンターへトスアップする仕組みがある。"], "a": 3, "k": null, "ex": "センターは全国47都道府県に設置され、親族内・従業員・第三者の別を問わずワンストップで支援する。事業承継ネットワーク参加機関の事業承継診断からトスアップする仕組みがあり、進行中の手続のセカンドオピニオンにも対応する。令和8年度より地域金融機関を中心にトレーニーを受け入れ、上期は11行から受入れ予定である。", "cn": ["誤り。親族内・従業員・第三者の別を問わずワンストップで支援する。", "誤り。地域金融機関を中心に受け入れ、令和8年度上期は11行から受入れ予定である。", "誤り。セカンドオピニオンとしての相談も可能である。", "正しい。掘り起こし段階の仕組みとして示されている。"], "src": "資料2 p.29-30", "ref": "n5-11", "lv": 2}, {"id": "MKT-019", "sub": "市場・政策", "top": "中小企業政策", "typ": "正しい", "stem": "資料2に記載された早期経営改善支援（Vアップ事業）に関する記述として、正しいものはどれか。", "ch": ["事業承継の検討にあたり企業概要書（IM）を作成する費用を、最大10万円（補助率2/3）補助する枠が措置された。", "費用は全額を中小企業活性化協議会が負担し、事業者負担はない。", "新制度の計画期間は1年〜5年程度で、伴走支援の期間は1年である。", "民間金融機関による支援は、補助対象から恒久的に除外されている。"], "a": 0, "k": null, "ex": "Vアップ事業は認定経営革新等支援機関の支援による計画策定等の費用の2/3を中小企業活性化協議会が支援する制度である。事業承継の検討にあたりIMを作成する費用を最大10万円（補助率2/3）補助する枠が措置された。2024年2月から2028年1月末までは民間金融機関による支援も時限的に補助対象である。", "cn": ["正しい。資料2の記載どおりである。", "誤り。協議会が費用の2/3を支援し、事業者負担は1/3である。", "誤り。それは旧制度で、新制度は計画期間3年〜5年程度、伴走支援3年である。", "誤り。2024年2月から2028年1月末まで時限的に補助対象とされている。"], "src": "資料2 p.32-33", "ref": "n5-11", "lv": 2}, {"id": "MKT-020", "sub": "市場・政策", "top": "中小企業政策", "typ": "最も適切", "stem": "資料2に記載されたエッセンシャルサービス（ES）への支援強化に関する記述として、最も適切なものはどれか。", "ch": ["ESの供給不足は、大都市圏から先行して生じるとされている。", "ESの採算性向上の手法として、業務効率化・省力化、広域化、多角化の3つが挙げられている。", "2026年3月6日、「認定エッセンシャルサービス制度」の創設を盛り込んだ中小企業等経営強化法改正法案が閣議決定された。", "改正法案では、事業協同組合等の設立要件として発起人数を3人から4人に引き上げるとされている。"], "a": 1, "k": null, "ex": "ESは生活必需品の卸小売、交通、運送、ガソリンスタンド等の生活維持に必要なサービスで、供給不足は過疎化が進む地方で先行する。採算性向上の手法は業務効率化・省力化、広域化、多角化である。2026年3月6日に認定エッセンシャルサービス制度を盛り込んだ産業競争力強化法等改正法案が閣議決定され、組合発起人数の緩和（4人→3人）等が含まれる。", "cn": ["不適切。過疎化が進む地方で先行するとされている。", "適切。事業主体の合理化（事業承継・組織再編等）で実現されることもあるとされる。", "不適切。閣議決定されたのは産業競争力強化法等改正法案である。", "不適切。発起人数を4人から3人に緩和する内容である。"], "src": "資料2 p.35-36", "ref": "n5-11", "lv": 3}, {"id": "MKT-021", "sub": "市場・政策", "top": "中小企業政策", "typ": "正しい", "stem": "資料2に記載された再生M&Aへの支援強化に関する記述として、正しいものはどれか。", "ch": ["中小企業活性化協議会は2013年に発足した。", "2024年度のセンターと中小企業活性化協議会の橋渡し件数は、協議会からセンターへ452件、センターから協議会へ230件である。", "再生M&A（スポンサー型再生支援）はセンターの業務とは無関係とされ、協議会単独で推進する方向が示された。", "事業再生支援の14の具体策には、再生M&Aのガイドライン等の整理は含まれていない。"], "a": 1, "k": null, "ex": "再生M&A（スポンサー型再生支援）が着目され、スポンサー探しのノウハウからセンターへの期待が高まっている。2024年度の橋渡し件数はセンター→協議会230件、協議会→センター452件である。14の具体策には他機関連携の強化や再生M&Aのガイドライン等の整理が含まれる。", "cn": ["誤り。協議会は2003年に発足した。", "正しい。資料2の件数どおりである。", "誤り。スポンサー探しのノウハウからセンターへの期待が高まり、協議会との実践的な連携を検討すべきとされた。", "誤り。再生M&A案件の促進に向けた環境整備としてガイドライン等の整理が含まれる。"], "src": "資料2 p.38-40", "ref": "n5-11", "lv": 3}, {"id": "MKT-022", "sub": "市場・政策", "top": "中小M&A市場動向", "typ": "正しい", "stem": "資料2に記載された手数料の状況及び株式価値・手数料の簡易計算ツールに関する記述として、正しいものはどれか。", "ch": ["案件規模が小さいと最低手数料が適用され、手数料率が高くなる傾向が示されている。", "簡易計算ツールは、赤字企業を含むすべての株式譲渡・事業譲渡を対象とする。", "簡易計算ツールで算出される株式価値・手数料は、確定値として取引に用いることが前提とされている。", "総資産レーマンを採用する機関は、手数料が低い傾向があるとされている。"], "a": 0, "k": null, "ex": "資料2は、案件規模が小さいと最低手数料が適用され手数料率が高くなること、総資産レーマン採用機関は手数料が高い傾向にあることを示した。登録制度の取引データを基に株式価値と仲介・FA手数料を参考値として試算するツールを登録制度HPへ実装予定で、対象は黒字企業の株式譲渡のみである。", "cn": ["正しい。資料2の手数料分析の要点である。", "誤り。対象は黒字企業の株式譲渡のみである。", "誤り。参考値として試算するツールである。", "誤り。総資産レーマン採用機関は手数料が高い傾向にある。"], "src": "資料2 p.23-27, 42-50", "ref": "n5-12", "lv": 2}, {"id": "MKT-023", "sub": "市場・政策", "top": "中小企業政策", "typ": "誤り", "stem": "中小M&Aガイドラインにおける金融機関に関する記述として、誤っているものはどれか。", "ch": ["与信業務を含む固有業務に付随してM&Aの助言等ができ、自らの顧客基盤から候補先を抽出できる。", "比較的小規模な案件の仲介では、公平・中立な第三者として側面支援することが望まれる。", "融資部門と仲介・FA部門の間に情報隔壁（チャイニーズ・ウォール）を設けることは、ガイドライン上「必ず行わなければならない」義務とされている。", "事業再生局面では、有利な債権回収のため早期M&Aを促す動機が構造的に強いことから、譲り渡し側の真意に即した支援が求められる。"], "a": 2, "k": null, "ex": "金融機関は与信先の詳細な財務情報や地域のネットワークを持ち、固有業務に付随してM&A助言ができる。情報管理は銀行法・監督指針等に即し徹底する必要があり、融資部門と仲介・FA部門の間の情報隔壁は「望ましい」とされる。債権者として優越的地位に立ちやすいため、利益相反管理態勢の整備が求められる。", "cn": ["正しい。金融機関の特色として記載されている。", "正しい。実行支援に関する記載どおりである。", "誤り。情報隔壁を設けることは「望ましい」とされている。", "正しい。事業再生局面の留意点として記載されている。"], "src": "GL p.105-109", "ref": "n5-15", "lv": 2}, {"id": "MKT-024", "sub": "市場・政策", "top": "中小企業政策", "typ": "最も適切", "stem": "中小M&Aガイドラインにおける商工団体に関する記述として、最も適切なものはどれか。", "ch": ["適切な支援機関へ橋渡しした後は、利益相反防止のため当該事業者との接点を持たないことが求められる。", "会員同士が顔見知りであることが多いため、情報の取扱いに特段の注意は要しないとされる。", "商工団体には、日本政策金融公庫や中小企業活性化協議会が含まれる。", "中小企業の最も身近な相談窓口であり、特に60歳を超える経営者に気付きの機会を積極的に提供することが期待される。"], "a": 3, "k": null, "ex": "商工団体（商工会議所・商工会等）は中小企業の最も身近な相談窓口で、公的支援制度を最も熟知した支援機関の1つである。特に60歳を超える経営者に気付きの機会を積極的に提供することが期待され、橋渡し後も接点を持ち続けることが求められる。会員同士が顔見知りで情報が特定・伝達されやすいため、情報の取扱いに注意が必要である。", "cn": ["不適切。橋渡し後も経営指導等で接点を持ち続けることが求められる。", "不適切。顔見知りで特定・伝達されやすいため、情報の取扱いに注意が必要とされる。", "不適切。商工会議所、商工会、中小企業団体中央会、商店街振興組合連合会等である。", "適切。GLの記載どおりである。"], "src": "GL p.109-110", "ref": "n5-16", "lv": 1}, {"id": "MKT-025", "sub": "市場・政策", "top": "中小企業政策", "typ": "組合せ", "stem": "中小M&Aガイドラインにおける士業等専門家のM&Aでの中心的役割について、空欄A〜Cに入る語句の組合せとして正しいものはどれか。\n「公認会計士は（A）・バリュエーション、弁護士は契約書作成・（B）、中小企業診断士は磨き上げや（C）、PMI等を中心的な役割とする。」", "ch": ["A：税務DD　B：法務DD　C：財務DD", "A：財務DD　B：ビジネス（事業）DD　C：法務DD", "A：法務DD　B：財務DD　C：ビジネス（事業）DD", "A：財務DD　B：法務DD　C：ビジネス（事業）DD"], "a": 3, "k": null, "ex": "GLは、公認会計士は財務DD・バリュエーション、税理士は顧問税理士として課税関係の助言・税務DD、中小企業診断士は磨き上げ・ビジネス（事業）DD・PMI、弁護士は契約書作成・法務DDを中心的役割として整理している。診断士は財務・税務・法務について各士業と同等の専門知識を有するものではないため、各士業と連携する必要がある。", "cn": ["誤り。税務DDは税理士、財務DDは公認会計士の役割である。", "誤り。弁護士と中小企業診断士の役割が入れ替わっている。", "誤り。公認会計士と弁護士の役割が入れ替わっている。", "正しい。GLの整理どおりである。"], "src": "GL p.111-130", "ref": "n5-17", "lv": 1}, {"id": "MKT-026", "sub": "市場・政策", "top": "中小M&A市場動向", "typ": "計算", "stem": "中小M&Aガイドラインに記載されたM&Aプラットフォームの手数料体系を前提とする。譲渡額800万円の株式譲渡がプラットフォーム上で成約し、譲り受け側の手数料は「成功報酬として譲渡額の3%、最低手数料30万円（税抜）」、消費税率は10%とする。譲り受け側が支払う手数料（税込）として正しいものはどれか。", "ch": ["24万円", "26万4,000円", "33万円", "30万円"], "a": 2, "k": null, "ex": "プラットフォームでは譲り受け側が完全成功報酬型で譲渡額等の数%程度を支払うことが多く、最低手数料の有無は様々である。本問では800万円×3%＝24万円が最低手数料30万円を下回るため、30万円×110%＝33万円（税込）となる。なお譲り渡し側は一切の手数料が発生しないケースが多い。", "cn": ["誤り。最低手数料の適用と消費税を考慮していない。", "誤り。最低手数料30万円を下回っているのに24万円に消費税を乗じている。", "正しい。800万円×3%＝24万円が最低手数料30万円を下回るため30万円となり、税込33万円である。", "誤り。税抜額であり、消費税10%を加算していない。"], "src": "GL p.57-60", "ref": "n5-19", "lv": 2}, {"id": "MKT-027", "sub": "市場・政策", "top": "中小M&A市場動向", "typ": "正しい", "stem": "中小M&AガイドラインにおけるM&Aプラットフォーム及びプラットフォーマーに関する記述として、正しいものはどれか。", "ch": ["M&Aプラットフォームは、真に極秘で進めたい案件にこそ向いているとされる。", "プラットフォーマーは、掲載案件の実在性を法人番号等により確認する仕組みを設けることが望まれる。", "プラットフォームでの支援は、一般にクロージング後のPMIまで一貫して行われる。", "ノンネームで掲載すれば個者特定のリスクはないため、開示範囲を慎重に検討する必要はない。"], "a": 1, "k": null, "ex": "プラットフォーマーには、サービス内容の明確化、掲載案件の実在性（法人番号等）・進捗の確認、他の支援機関との連携が求められる。プラットフォームは低コストだが、ノンネームでも個者特定リスクがあり、ある程度公開されても受忍できる程度の情報しか掲載しない姿勢が望まれる。支援はマッチングまでが一般的で、真に極秘の案件には向かない。", "cn": ["誤り。真に極秘で進めたい案件は向いておらず、仲介者・FAとの使い分けが必要とされる。", "正しい。掲載案件の信頼性確保として記載されている。", "誤り。支援はマッチングまでに留まることが一般的である。", "誤り。ノンネームでも個者特定リスクがあり、開示範囲を慎重に検討する必要がある。"], "src": "GL p.57-60, 130-132", "ref": "n5-18", "lv": 2}, {"id": "MKT-028", "sub": "市場・政策", "top": "中小企業政策", "typ": "最も適切", "stem": "譲渡を漠然と考えているA社の社長は、まだM&Aを行うかどうかを決めていないが、事業承継・引継ぎ支援センターに相談したいと考えている。中小M&Aガイドラインに照らし、センターに関する説明として最も適切なものはどれか。", "ch": ["センターは意思決定前の相談にも対応し、他の仲介者・FAから受けている助言についてセカンド・オピニオンを求めることもできる。", "センターは、M&Aを行うことを意思決定した後でなければ相談を受け付けない。", "センターから登録機関等へ橋渡しされる二次対応では、契約を締結しても手数料は一切発生しない。", "センターは全国に47か所あり、各都道府県に1か所ずつ設置されている。"], "a": 0, "k": null, "ex": "センターは経済産業省の委託を受けた機関が実施し、全国48か所（東京都は2か所）に設置されている。一次対応では意思決定前でも幅広く相談を受け付け、セカンド・オピニオンにも応じる。M&Aを意思決定した場合は登録機関等又は連携プラットフォーマーへ橋渡し（手数料が発生）し、適当な登録機関等がない場合等はセンターが直接支援する。", "cn": ["適切。初期相談対応（一次対応）の内容どおりである。", "不適切。意思決定前でも対応する。", "不適切。登録機関等と契約を締結するため手数料が発生する。", "不適切。全国48か所で、東京都は2か所である。"], "src": "GL p.60-62", "ref": "n5-20", "lv": 1}, {"id": "MKT-029", "sub": "市場・政策", "top": "中小企業政策", "typ": "正しい", "stem": "中小M&Aガイドラインに記載された問い合わせ窓口に関する記述として、正しいものはどれか。", "ch": ["M&A仲介協会の苦情相談窓口は、幹事会員及び正会員の仲介者に関する苦情を受け付け、対象会員に通知して対応の検討を促す。", "どの窓口に相談するか迷う場合は、まず日本弁護士連合会のひまわりほっとダイヤルに相談することとされている。", "M&A支援機関登録制度の情報提供受付窓口は、登録仲介者・FAとの紛争を解決することを目的としている。", "ひまわりほっとダイヤルは、日本弁護士連合会及び全国47の弁護士会が対応している。"], "a": 0, "k": null, "ex": "中小M&A全般の意見・相談はセンターが窓口で、どの窓口か迷う場合はまずセンターに相談する。法的助言を求める場合は日弁連及び全国52の弁護士会のひまわりほっとダイヤルがある。不適切事例・苦情は登録制度の情報提供受付窓口とM&A仲介協会の苦情相談窓口が受け付けるが、紛争の解決や助言を目的とするものではない。", "cn": ["正しい。GLの記載どおりである。", "誤り。迷う場合はまず事業承継・引継ぎ支援センターに相談することとされている。", "誤り。不適切事例・苦情の窓口は紛争の解決や助言を目的とするものではない。", "誤り。全国52の弁護士会である。"], "src": "GL p.75-76", "ref": "n5-21", "lv": 2}, {"id": "MKT-030", "sub": "市場・政策", "top": "中小企業政策", "typ": "正しい", "stem": "日本政策金融公庫の「事業承継マッチング支援」及び日本税理士会連合会の「担い手探しナビ」に関する記述として、正しいものはどれか。", "ch": ["日本公庫の事業承継マッチング支援は、令和2年4月から沖縄県を含む全国で実施されている。", "日本公庫の事業承継マッチング支援は、事業を譲り受けて創業する者も対象とし、譲渡・譲受のいずれも無料で利用できる。", "「担い手探しナビ」は、中小企業の経営者が自ら直接登録して利用するマッチングサイトである。", "「担い手探しナビ」は法人のみを対象とし、個人事業者の案件は登録できない。"], "a": 1, "k": null, "ex": "日本公庫国民生活事業本部の事業承継マッチング支援は令和2年4月から沖縄県を除く全国で実施され、創業者も対象、専任担当者が候補先を探し、譲渡・譲受とも無料である。担い手探しナビは日税連が平成30年10月から運用し、利用申請をした税理士のみが利用できる。法人・個人や規模を問わず、案件はノンネーム情報で掲載される。", "cn": ["誤り。全国規模だが沖縄県を除いて実施されている。", "正しい。参考資料5の特徴どおりである。", "誤り。利用申請をした税理士のみが利用でき、顧問税理士が関与先の窓口となる。", "誤り。法人・個人、規模の大小を問わず登録できる。"], "src": "参考資料5 p.1／参考資料10 p.1", "ref": "n5-22", "lv": 2}, {"id": "MKT-031", "sub": "市場・政策", "top": "中小企業政策", "typ": "最も適切", "stem": "円滑な廃業を支援する施策（参考資料8）に関する記述として、最も適切なものはどれか。", "ch": ["経営安定特別相談室は日本政策金融公庫が設置しており、相談は有料である。", "地域経済活性化支援機構の特定支援業務は、経営者の自己破産を前提として保証債務を整理する制度である。", "経営者保証に関するガイドラインでは、保証債務のうち返済しきれない残額は原則として免除されない。", "経営者保証に関するガイドラインでは、早期決断時に自由財産99万円に加え、年齢等に応じて約100万〜約360万円の生計費を残すことが検討される。"], "a": 3, "k": null, "ex": "参考資料8は、経営安定特別相談室（無料）、経営者保証に関するガイドライン、センターによる経営資源の引継ぎ、地域経済活性化支援機構の特定支援業務、日弁連ひまわりほっとダイヤルの5種を挙げる。経営者保証GLでは早期決断時に自由財産99万円に加え約100万〜約360万円の生計費や華美でない自宅を残すことが検討され、残額は原則免除される。", "cn": ["不適切。商工会議所・都道府県商工会連合会が設置し、相談は無料である。", "不適切。企業債務と保証債務を一体整理し、自己破産を回避して私財を多く残せる。", "不適切。返済しきれない残額は原則免除とされる。", "適切。参考資料8の記載どおりである。"], "src": "参考資料8 p.1-2", "ref": "n5-23", "lv": 2}, {"id": "MKT-032", "sub": "市場・政策", "top": "中小企業政策", "typ": "組合せ", "stem": "サポートツール（参考資料9）について、空欄A〜Cに入る語句の組合せとして正しいものはどれか。\n「（A）は企業の『健康診断』ツールで、事業性評価の『入口』とされる。（B）は事業の将来像を構想し戦略を策定するツールで、内閣府知的財産戦略推進事務局が所管する。（C）は生産性向上のITツールを提供するITベンダー等を認定する制度である。」", "ch": ["A：経営デザインシート　B：ローカルベンチマーク　C：スマートSMEサポーター", "A：ローカルベンチマーク　B：スマートSMEサポーター　C：経営デザインシート", "A：ローカルベンチマーク　B：経営デザインシート　C：スマートSMEサポーター", "A：スマートSMEサポーター　B：経営デザインシート　C：ローカルベンチマーク"], "a": 2, "k": null, "ex": "ローカルベンチマーク（経済産業省）は企業の健康診断ツールで事業性評価の入口とされる。経営デザインシート（内閣府知的財産戦略推進事務局）は事業の将来像を構想するツールで、譲り受け側が統合後の将来を構想する場面等で活用される。スマートSMEサポーターはITベンダー等を認定する制度である。", "cn": ["誤り。健康診断ツールはローカルベンチマーク、将来像の構想は経営デザインシートである。", "誤り。ITベンダー等の認定制度はスマートSMEサポーターである。", "正しい。参考資料9の整理どおりである。", "誤り。健康診断ツールはローカルベンチマークである。"], "src": "参考資料9 p.1", "ref": "n5-24", "lv": 1}, {"id": "MKT-033", "sub": "市場・政策", "top": "中小企業政策", "typ": "最も適切", "stem": "「不適切な譲り受け側に係る情報共有の仕組みについて」（令和7年2月・中小企業庁財務課）に示された基本的なスキームに関する記述として、最も適切なものはどれか。", "ch": ["運営主体は、参加者（仲介者等）のうち最大手の事業者が兼ねることが想定されている。", "運営主体は、登録された譲り受け側から手数料を受け取ることで運営費を賄うことが想定されている。", "共有された譲り受け側と取引するかどうかは、参加者が自らの責任で判断することとする必要がある。", "運営主体は、共有された譲り受け側との取引停止を全参加者に義務付けることで実効性を担保する。"], "a": 2, "k": null, "ex": "情報共有の仕組みは、参加者とは別の法人を中立・公平な運営主体として設置し、契約に基づき構築する。運営主体は譲り受け側から一切の経済的利益の供与を受けないことが必要である。取引停止を参加者に強制すると独占禁止法上違法となる可能性があるため、取引の可否は参加者が自らの責任で判断する。", "cn": ["不適切。参加者とは別の法人を中立・公平な運営主体として設置する。", "不適切。運営主体は譲り受け側から手数料をはじめ一切の経済的利益の供与を受けないことが必要である。", "適切。取引停止を強制すると独占禁止法上違法となる可能性があるためである。", "不適切。取引停止を参加者に強制する場合は独占禁止法上違法となる可能性がある。"], "src": "情報共有 3(1)-(2)", "ref": "n5-29", "lv": 2}, {"id": "MKT-034", "sub": "市場・政策", "top": "中小企業政策", "typ": "誤り", "stem": "「不適切な譲り受け側に係る情報共有の仕組みについて」に示された共有情報や関係者の対応に関する記述として、誤っているものはどれか。", "ch": ["登録事由に該当する譲り受け側の情報は、譲り受け側からの登録状況の問合せや異議申立てには一切応じずに共有される。", "共有される情報には、少なくとも社名、法人番号、代表者名、役員名、登録日、登録事由、備考が含まれる。", "共有範囲には、全国の事業承継・引継ぎ支援センターも含める必要がある。", "参加者は、共有情報をM&Aに係る支援業務の目的に限り利用し、参加者の外部に流出させてはならない。"], "a": 0, "k": null, "ex": "共有情報は社名、法人番号、代表者名、役員名、登録日、登録事由、備考の少なくとも7項目で、共有範囲にはセンターも含める必要がある。参加者は共有情報を支援業務の目的に限り利用し外部に流出させてはならない。運営主体は譲り受け側からの問合せ窓口を設け、異議申立てがあれば再確認し、相当の理由があれば登録を抹消する。", "cn": ["誤り。運営主体は問合せ窓口を設置し、異議申立てがあれば再確認し、相当の理由があれば登録を抹消する。", "正しい。共有情報の7項目である。", "正しい。公的相談窓口であるセンターも含める必要がある。", "正しい。参加者の義務として記載されている。"], "src": "情報共有 3(3)-(5)", "ref": "n5-31", "lv": 2}, {"id": "MKT-035", "sub": "市場・政策", "top": "中小企業政策", "typ": "正しい", "stem": "ガイドライン第3版Q&Aに示された、M&A支援機関登録制度の登録支援機関における第3版の適用スケジュールに関する記述として、正しいものはどれか。", "ch": ["令和6年12月31日までに第3版の遵守宣言をしなかったこと自体が、直ちに登録取消事由となる。", "令和6年8月時点で登録済みの機関が第3版の遵守宣言をした場合、宣言した日の翌営業日から第3版が適用される。", "遵守宣言をしない機関には、令和8年1月まで第2版が適用され続ける。", "令和7年1月以降の新規登録申請者には、登録後1年間の猶予期間を経て第3版が適用される。"], "a": 1, "k": null, "ex": "令和6年8月時点の登録済機関や同年9〜12月の新規登録者は、令和6年12月31日までに対応を完了し遵守宣言することが必要で、宣言日の翌営業日から第3版が適用される。宣言しなくても令和7年1月から適用され、宣言しなかったこと自体は取消事由ではないが、未対応の場合は登録が取り消される場合がある。令和7年1月以降の新規申請は申請時点から適用される。", "cn": ["誤り。宣言しなかったこと自体は登録取消事由にはならないが、令和7年1月以降未対応だと取り消される場合がある。", "正しい。Q&A⑪No.1の記載どおりである。", "誤り。宣言しなくても令和7年1月から第3版が適用される。", "誤り。令和7年1月以降の新規申請は登録申請時点から適用される。"], "src": "Q&A ⑪No.1, No.4", "ref": "n5-46", "lv": 2}, {"id": "MKT-036", "sub": "市場・政策", "top": "中小企業政策", "typ": "正しい", "stem": "ガイドライン第3版Q&Aに示された、M&A支援機関登録制度の登録支援機関による第3版への対応に関する解釈として、正しいものはどれか。", "ch": ["支援の質の確保・向上に関する取組について、取組内容の公表や資料の提出が登録支援機関に必須とされている。", "自社HPを持たない登録機関は、遵守宣言に関する掲載内容の変更は一切不要とされている。", "第3版の遵守宣言をすると、データベース上の自社情報に「第3版対応」マークが表示される。", "遵守宣言は、書面を郵送する方法に限って提出することとされている。"], "a": 2, "k": null, "ex": "ガイドライン第3版Q&Aは全40問で、第3版は手数料・提供業務の説明、広告・営業の規律、利益相反の禁止事項、不適切な譲り受け側の排除を強化した。登録機関が遵守宣言をするとDBに「第3版対応」マークが表示される。HPがない場合はパンフレット等を変更し、遵守宣言は入力フォームで提出する予定とされる。", "cn": ["誤り。特段必要はないとされ、実績報告での報告とDBでの公表（任意）を検討中とされる（Q&A⑪No.6）。", "誤り。HPがない場合は会社概要パンフレット等を第3版対応に変更する。", "正しい。Q&A⑪No.5で示された遵守宣言のメリットである。", "誤り。入力フォームを開設予定とされている。"], "src": "Q&A ⑪No.5-8", "ref": "n5-35", "lv": 2}, {"id": "MKT-037", "sub": "市場・政策", "top": "中小企業政策", "typ": "誤り", "stem": "ガイドライン第3版Q&A（①No.4）に示された、第2版からの主な変更点に関する記述として、誤っているものはどれか。", "ch": ["ネームクリアの前に、譲り受け側候補の同意を取得することとされた。", "特に禁止される利益相反の事項を、仲介契約書に仲介者の義務として定めることとされた。", "不適切な事業者の排除として、譲り受け側に対する調査と結果の報告等が盛り込まれた。", "経営者保証の扱いについて、中小企業向けにM&A成立前の相談の検討が盛り込まれた。"], "a": 0, "k": null, "ex": "Q&A①No.4は第2版からの変更点として、手数料・提供業務、広告・営業の禁止事項、利益相反の禁止事項の具体化、ネームクリア・テール条項の規律、最終契約後のリスク事項、経営者保証の扱い、不適切な事業者の排除の7点を示す。ネームクリアについては、譲り渡し側の同意を取得することとされた。", "cn": ["誤り。ネームクリア前に取得するのは譲り渡し側の同意である。", "正しい。利益相反の禁止事項の具体化として示されている。", "正しい。業界内の情報共有の仕組みの必要性と参加有無の説明も含まれる。", "正しい。金融機関向けには経営者保証GLに基づく対応が示されている。"], "src": "Q&A ①No.4", "ref": "n5-36", "lv": 2}, {"id": "MKT-038", "sub": "市場・政策", "top": "中小企業政策", "typ": "最も適切", "stem": "ガイドライン第3版Q&A（②）に示された、改訂への対応が求められる支援機関に関する解釈として、最も適切なものはどれか。", "ch": ["第3版への対応が求められるのはM&A専門業者に限られ、金融機関や士業等専門家は対象外である。", "第3版で「M&A専門業者」の定義が改められ、FAのみを指すこととされた。", "M&A支援機関登録制度に登録していない士業等専門家は、同様の業務を行っていても一切対応を求められない。", "金融機関、士業等専門家、M&Aプラットフォーマー等も、M&A専門業者と業務の性質・内容が共通する限り、準拠した対応が想定されている。"], "a": 3, "k": null, "ex": "Q&A②は、改訂への対応はM&A専門業者に加え、金融機関、士業等専門家、M&Aプラットフォーマー等が同様の業務を行う場合にも、業務の性質・内容が共通する限り求められると解している。M&A専門業者はマッチング支援や手続進行の総合的な支援を専門に行う民間業者で、主に仲介者・FAに分類され、初版から変更はない。", "cn": ["不適切。業務の性質・内容が共通する限り、他の支援機関にも準拠した対応が想定されている。", "不適切。M&A専門業者は主に仲介者・FAに分類され、初版から変更はない。", "不適切。業務の性質・内容が共通する限り準拠した対応が想定されている。", "適切。Q&A②No.1の解釈どおりである。"], "src": "Q&A ②No.1-2", "ref": "n5-37", "lv": 1}, {"id": "MKT-039", "sub": "市場・政策", "top": "中小企業政策", "typ": "最も適切", "stem": "仲介会社の担当者Xが中小企業の社長に電話営業をしたところ、社長から「M&Aをするつもりはないので、今後の営業は不要です」と告げられた。ガイドライン第3版Q&A（③）の解釈に照らし、Xの対応として最も適切なものはどれか。", "ch": ["電話営業は停止するが、会社概要を記載したダイレクトメールの送付は営業に当たらないため継続する。", "停止意思が表示されたため、これを拒まず、ただちに営業を停止する。", "経営環境は変化するため、3か月程度の期間を空けたうえで別の担当者から改めて架電する。", "M&Aの成立可能性が高い有望な候補先がいることを伝え、今週中に返答するよう求める。"], "a": 1, "k": null, "ex": "Q&A③No.1は、M&Aの実施意向がない、契約しない、営業を希望しない旨の停止意思を表示されたら、拒んではならず、ただちに停止すべきとする。No.2は、名称等を告げない営業、即時の判断を迫る営業、虚偽・誤認を招く営業を行ってはならないとしている。", "cn": ["不適切。営業を希望しない旨の停止意思が表示された以上、営業を停止すべきである。", "適切。停止意思が表示されたら、拒んではならず、ただちに停止すべきとされる。", "不適切。停止意思表示後の再架電は、窓口に寄せられた不適切事例にも当たる。", "不適切。即時の判断を迫る営業は行ってはならない広告・営業に当たる。"], "src": "Q&A ③No.1-2", "ref": "n5-38", "lv": 1}, {"id": "MKT-040", "sub": "市場・政策", "top": "中小企業政策", "typ": "誤り", "stem": "ガイドライン第3版Q&A（④）に示された、契約締結前の書面による重要事項の説明に関する解釈として、誤っているものはどれか。", "ch": ["重要事項説明書は、依頼者との認識の齟齬を防ぐため、契約書の文言をそのまま転記して作成することが推奨されている。", "説明は、契約の締結前に、依頼者が十分検討できる適切なタイミングで行う。", "説明の相手方は契約を締結する権限を有する者で、法人の場合は代表者又は契約締結の委任を受けた者である。", "必要事項が適切に記載されていれば、書面の様式は問われず、サンプルの使用は必須ではない。"], "a": 0, "k": null, "ex": "重要事項説明の対象は仲介契約・FA契約等で、契約締結前の十分検討できるタイミングで、契約締結権限を有する者に行う。書面の様式は問われず、記名・押印欄やチェック項目も設けてよい。記載は契約書の文言の転記ではなく、依頼者が理解しやすいものが推奨されている。", "cn": ["誤り。契約書の文言の転記ではなく、依頼者が理解しやすい記載が推奨されている。", "正しい。Q&A④No.8の解釈どおりである。", "正しい。Q&A④No.9の解釈どおりである。", "正しい。Q&A④No.6の解釈どおりである。"], "src": "Q&A ④No.1, 5-9", "ref": "n5-39", "lv": 2}, {"id": "MKT-041", "sub": "市場・政策", "top": "中小企業政策", "typ": "正しい", "stem": "ガイドライン第3版Q&A（⑤）に示された、ネームクリアの方法に関する解釈として、正しいものはどれか。", "ch": ["候補先がNDAを締結していれば、譲り渡し側の同意がなくても仲介者の判断で実施できる。", "譲り渡し側の同意を取得していれば、候補先とのNDAの締結は不要である。", "ノンネーム・シート等で興味を示した候補先に対し、譲り渡し側の同意を取得し、候補先とNDAを締結した上で実施する。", "ノンネーム・シートに関心を示した候補先であれば、同意やNDAなしで社名を開示してよい。"], "a": 2, "k": null, "ex": "Q&A⑤No.1は、ネームクリアはノンネーム・シート（ティーザー）等で興味を示した候補先に対し、譲り渡し側の同意を取得し、候補先とNDAを締結した上で実施するとしている。第3版では、ネームクリア前に譲り渡し側の同意を取得することが明確化された。", "cn": ["誤り。譲り渡し側の同意の取得が必要である。", "誤り。候補先とNDAを締結した上で実施する。", "正しい。Q&A⑤No.1の解釈どおりである。", "誤り。譲り渡し側の同意取得と候補先とのNDA締結の両方が必要である。"], "src": "Q&A ⑤No.1", "ref": "n5-40", "lv": 1}, {"id": "MKT-042", "sub": "市場・政策", "top": "中小企業政策", "typ": "全て選べ", "stem": "ガイドライン第3版Q&A（⑥No.2）で、最終契約後・クロージング後に争いになり得るリスクのうち「認識の有無に関わらず対応」が必要とされるものを全て選んだ組合せはどれか。\nア 経営者保証の扱い\nイ DDの非実施\nウ 表明保証の内容\nエ 最終契約からクロージングまでの期間", "ch": ["ア、イ", "ア、イ、ウ", "イ、ウ、エ", "ア、イ、ウ、エ"], "a": 1, "k": null, "ex": "Q&A⑥は、最終契約後・クロージング後に争いになり得るリスクについて、最終契約の締結までに調整・説明すべきとする。認識の有無に関わらず対応するのは経営者保証の扱い、DDの非実施、表明保証の内容である。クロージング後の支払・手続や最終契約からクロージングまでの期間等は認識した段階で対応する。", "cn": ["誤り。ウ（表明保証の内容）も認識の有無に関わらず対応が必要である。", "正しい。経営者保証の扱い、DDの非実施、表明保証の内容の3つである。", "誤り。エは認識した段階で対応するリスクで、アが含まれていない。", "誤り。エ（最終契約からクロージングまでの期間）は認識した段階で対応するリスクである。"], "src": "Q&A ⑥No.1-2", "ref": "n5-41", "lv": 3}, {"id": "MKT-043", "sub": "市場・政策", "top": "中小企業政策", "typ": "最も適切", "stem": "ガイドライン第3版Q&A（⑦）に示された、不適切な譲り受け側を排除するための調査に関する解釈として、最も適切なものはどれか。", "ch": ["調査は、最終契約の締結後、クロージングまでの間に一度実施すれば足りる。", "プラットフォーマーは、成約後に譲り受け側の調査を実施すればよい。", "調査の対象は反社会的勢力への該当性に限られ、財務状況や過去のM&Aトラブルは確認対象ではない。", "仲介契約・FA契約の締結前（プラットフォーマーは登録前）に加え、プロセスの進捗中も調査を実施し、最終契約の締結までに十分に確認する。"], "a": 3, "k": null, "ex": "Q&A⑦は、譲り受け側が最終契約を履行し対象事業を引き継ぐ意思・能力を有するか確認するため調査を実施すべきとする。調査内容は税務申告書による財務状況、商業登記簿による事業実態、反社会的勢力への該当性、過去のM&Aトラブル等である。時期は契約締結前（PFは登録前）に加え進捗中も行い、最終契約の締結までに十分確認する。", "cn": ["不適切。最終契約の締結までに十分に確認する必要がある。", "不適切。プラットフォーマーは登録前に調査を実施する。", "不適切。税務申告書による財務状況、商業登記簿による事業実態、過去のM&Aトラブル等も確認する。", "適切。Q&A⑦No.3の解釈どおりである。"], "src": "Q&A ⑦No.1-3", "ref": "n5-42", "lv": 2}, {"id": "MKT-044", "sub": "市場・政策", "top": "中小企業政策", "typ": "誤り", "stem": "ガイドライン第3版Q&A（⑧）に示された、仲介契約・FA契約における直接交渉の制限に関する条項についての解釈として、誤っているものはどれか。", "ch": ["依頼者が明示的に了解している場合を除き、制限の対象は仲介者・FAが関与・接触し紹介した候補先のみに限定すべきとされる。", "直接交渉の制限の有効期間は、契約終了後も2〜3年程度は存続させるよう定めるべきとされる。", "通常の事業上の取引まで阻害しないよう、交渉目的はM&Aに関する目的に限定すべきとされる。", "手数料回避のために契約を終了させて直接交渉するケース等は、テール条項により手数料が発生し得ることも踏まえて整理されている。"], "a": 1, "k": null, "ex": "Q&A⑧は、直接交渉の制限について、対象の候補先は関与・接触し紹介した候補先のみ、目的はM&Aに関する目的、有効期間は契約終了までに限定すべきとする。契約終了後まで禁じると自由な経営判断を損なうおそれがあるためである。手数料回避目的の契約終了後の直接交渉には、テール条項で手数料が発生し得る。", "cn": ["正しい。Q&A⑧No.1の解釈どおりである。", "誤り。有効期間は契約終了までに限定すべきとされる。", "正しい。Q&A⑧No.2の解釈どおりである。", "正しい。Q&A⑧No.3の解釈どおりである。"], "src": "Q&A ⑧No.1-3", "ref": "n5-43", "lv": 2}, {"id": "MKT-045", "sub": "市場・政策", "top": "中小企業政策", "typ": "最も適切", "stem": "ガイドライン第3版Q&A（⑨）に示された、テール条項に関する解釈として、最も適切なものはどれか。", "ch": ["ロングリストやノンネーム・シートを提示した候補先であれば、テール条項の対象としてよい。", "テール期間の目安は、最長で5年程度とされている。", "テール条項の対象となる「紹介された者」は、少なくともネームクリアが行われ紹介された譲り受け側であるが、それを満たせばすべからく有効性が認められるものではない。", "対象となる事業者は、新たなM&Aの機会を確保するため、特に限定しないことが望ましいとされる。"], "a": 2, "k": null, "ex": "Q&A⑨は、テール期間の目安を最長でも2〜3年以内とし、対象は関与・接触した譲り受け側で譲り渡し側に紹介された者のみに限定すべきとする。ロングリスト・ショートリストやノンネーム・シートの提示のみでは対象とすべきでなく、少なくともネームクリアが行われ紹介された者が対象となる。ただし、それを満たせば常に有効となるわけではない。", "cn": ["不適切。ロングリスト等の提示のみでは対象とすべきでない。", "不適切。目安は最長でも2〜3年以内である。", "適切。Q&A⑨No.3の解釈どおりである。", "不適切。無限定だと新たなM&Aの断念につながるおそれがあり、関与・接触し紹介した者のみに限定する。"], "src": "Q&A ⑨No.1-3", "ref": "n5-44", "lv": 2}, {"id": "MKT-046", "sub": "市場・政策", "top": "中小企業政策", "typ": "全て選べ", "stem": "ガイドライン第3版Q&A（⑩No.2）で、仲介者について「特に禁止されるべき利益相反行為」とされているものを全て選んだ組合せはどれか。\nア 譲り受け側から追加で手数料を取得し、当該譲り受け側に便宜を図る行為\nイ リピーターとなる依頼者を優遇し、便宜を図る行為\nウ 譲り渡し側の希望額と成立額の差分の一定割合を報酬として要求する行為\nエ 両当事者と仲介契約を締結し、その旨を説明した上で両当事者から手数料を受領する行為", "ch": ["ア、イ", "ア、ウ、エ", "イ、エ", "ア、イ、ウ"], "a": 3, "k": null, "ex": "Q&A⑩No.2は特に禁止されるべき利益相反行為として、追加手数料による便宜、リピーター優遇による便宜、希望額と成立額の差分の一定割合の報酬要求、伝達事項の不伝達・虚偽伝達、一方に有利・不利な情報の秘匿の5類型を示す。両当事者から手数料を受領すること自体は、No.1のとおり仲介契約締結時に明示的に説明すべき事項である。", "cn": ["誤り。ウも禁止される類型に含まれる。", "誤り。イは禁止類型に含まれ、エは説明を前提に行われる行為で禁止類型ではない。", "誤り。ア・ウが禁止類型に含まれ、エは禁止類型ではない。", "正しい。ア・イ・ウは5類型に含まれ、エは契約締結時に明示的に説明すべき事項である。"], "src": "Q&A ⑩No.1-2", "ref": "n5-45", "lv": 2}, {"id": "MKT-047", "sub": "市場・政策", "top": "中小企業政策", "typ": "最も適切", "stem": "「不適切な譲り受け側に係る情報共有の仕組みについて」に関する記述として、最も適切なものはどれか。", "ch": ["令和7年2月に中小企業庁財務課が示したもので、仕組み・運用の骨子を一例として示したものとされている。", "中小企業庁が自ら運営主体となり、全ての登録仲介者・FAに参加を義務付ける仕組みとされている。", "共有の対象は、不適切な仲介者・FAに関する情報である。", "共有された譲り受け側との取引は、全参加者が一律に停止しなければならない。"], "a": 0, "k": null, "ex": "本書は令和7年2月に中小企業庁財務課が示したもので、仕組み・運用の骨子を一例として示している。参加者とは別法人の中立・公平な運営主体が、登録事由に該当する譲り受け側の情報を参加者に共有する。取引停止を強制すると独占禁止法上違法となる可能性があるため、取引の可否は参加者が自らの責任で判断する。", "cn": ["適切。本書は骨子を一例として示したものである。", "不適切。参加者とは別の法人を中立・公平な運営主体として設置し、契約に基づき構築する。", "不適切。対象は登録事由に該当する譲り受け側の情報である。", "不適切。取引の可否は参加者が自らの責任で判断する。"], "src": "情報共有 1, 3(1)-(2)", "ref": "n5-26", "lv": 1}, {"id": "MKT-048", "sub": "市場・政策", "top": "中小企業政策", "typ": "正しい", "stem": "「不適切な譲り受け側に係る情報共有の仕組みについて」に示された、仕組みの目的・背景に関する記述として、正しいものはどれか。", "ch": ["情報共有の仕組みの構築が期待される旨は、令和2年3月の中小M&Aガイドライン策定時から記載されていた。", "経営者保証を移行させないまま、譲り渡し側の現預金等の資産を回収して資金繰りを悪化させ、倒産に至らせる不適切な譲り受け側の存在が指摘されている。", "本仕組みの目的は、不適切な行為を行った仲介者・FAの情報を中小企業に公開することである。", "情報共有の仕組みの構築は、中小M&Aガイドライン第1章（中小企業向け）に規定されている。"], "a": 1, "k": null, "ex": "中小M&AはGL策定（令和2年3月）以降浸透した一方、経営者保証を移行させないまま譲り渡し側の資産を回収し倒産に至らせる不適切な譲り受け側の存在が指摘された。令和6年8月のGL改訂で、最終契約の不履行等を働く者の情報を業界内で共有する仕組みの構築が期待される旨がGL第2章Ⅱ6（3）に記載された。市場の信頼性確保のためのインフラとしての浸透が期待される。", "cn": ["誤り。令和6年8月のGL改訂で記載された。", "正しい。これを適切に排除する必要があるとされる。", "誤り。最終契約の不履行等を働く譲り受け側の情報を業界内で共有する仕組みである。", "誤り。GL第2章Ⅱ6（3）に記載されている。"], "src": "情報共有 1", "ref": "n5-27", "lv": 2}, {"id": "MKT-049", "sub": "市場・政策", "top": "中小企業政策", "typ": "正しい", "stem": "「不適切な譲り受け側に係る情報共有の仕組みについて」に示された基本原則に関する記述として、正しいものはどれか。", "ch": ["情報共有の仕組みには個人情報保護法の適用が除外されるため、同法への配慮は不要とされている。", "参加者は、共有された情報を組織内の全役職員に周知しなければならない。", "取引判断に必要な情報は、年1回まとめて共有することが原則とされている。", "個人情報保護法、不正競争防止法等の関係法令・ガイドラインの遵守が大前提とされている。"], "a": 3, "k": null, "ex": "基本原則として、個人情報保護法、不正競争防止法等の関係法令・ガイドラインの遵守が大前提とされる。取引の開始・継続の判断に必要な情報を適時適切に共有し、参加者は組織内のM&A部署等の必要範囲に共有して判断に活用する。", "cn": ["誤り。個人情報保護法等の遵守が大前提である。", "誤り。組織内のM&A部署等の必要範囲に共有し判断に活用する。", "誤り。取引の開始・継続の判断に必要な情報を適時適切に共有する。", "正しい。基本原則として示されている。"], "src": "情報共有 2", "ref": "n5-28", "lv": 1}, {"id": "MKT-050", "sub": "市場・政策", "top": "中小企業政策", "typ": "誤り", "stem": "「不適切な譲り受け側に係る情報共有の仕組みについて」に例示された登録事由として、誤っているもの（例示に含まれないもの）はどれか。", "ch": ["譲り受け側が、最終契約の締結前の交渉段階で、当初の意向表明より低い譲渡価額を提示した。", "経営者保証の解除が譲り受け側の義務として合意されたが、解除に合理的に要する一定期間を経過しても解除されない。", "経営者保証の解除が譲り受け側の努力義務として合意されたが、譲り受け側が金融機関等と解除に向けた相談をすみやかに開始しない。", "譲渡対価の分割払いについて、支払要件が期日の到来のみであるのに、期日を過ぎても支払いがない。"], "a": 0, "k": null, "ex": "登録事由の例示は、経営者保証等の解除が義務・努力義務として合意された場合の不解除・相談不開始・解除不実現と、譲渡対価の分割払いや退職慰労金の後払いの期日経過後の不払いである。包括要件を設ける場合は、共有前に弁明の機会の付与等の救済措置を設けることが相当とされる。", "cn": ["誤り。交渉段階での価額提示は登録事由として例示されていない。", "正しい。登録事由①アとして例示されている。", "正しい。登録事由①イとして例示されている。", "正しい。登録事由②として例示されている。"], "src": "情報共有 3(2)", "ref": "n5-30", "lv": 2}, {"id": "MKT-051", "sub": "市場・政策", "top": "中小企業政策", "typ": "最も適切", "stem": "「不適切な譲り受け側に係る情報共有の仕組みについて」に示された、登録に係る譲り受け側等への対応に関する記述として、最も適切なものはどれか。", "ch": ["参加者が譲り渡し側のFAである場合も、譲り受け側との契約を通じて容易に情報共有できる。", "異議申立ての確認で譲り渡し側の情報を確認することはないため、譲り渡し側との契約で秘密保持義務の除外等を行う必要はない。", "参加者は、譲り受け側との契約で情報共有できるよう秘密保持義務からの除外等を行い、事前に登録事由の内容、共有範囲、利用目的を説明する。", "運営主体は、譲り受け側から異議申立てがあり相当の理由が認められても、登録を抹消しない。"], "a": 2, "k": null, "ex": "参加者は譲り受け側との契約で秘密保持義務からの除外等を行い、登録事由の内容、共有範囲、利用目的を事前に説明する。運営主体は登録状況の問合せ窓口を設置し、異議申立てがあれば再確認して相当の理由があれば登録を抹消する。異議確認で譲り渡し側の情報を確認する可能性があるため、譲り渡し側との契約でも同様の対応を行う。", "cn": ["不適切。譲り渡し側のFAは譲り受け側と契約がなく、情報共有は難しいとされる。", "不適切。譲り渡し側の情報を確認する可能性があるため、除外等と事前説明を行う。", "適切。登録に係る譲り受け側への対応として示されている。", "不適切。再確認の上、相当の理由があれば登録を抹消する。"], "src": "情報共有 3(4)", "ref": "n5-32", "lv": 2}, {"id": "MKT-052", "sub": "市場・政策", "top": "中小企業政策", "typ": "誤り", "stem": "「不適切な譲り受け側に係る情報共有の仕組みについて」に示された参加者の義務に関する記述として、誤っているものはどれか。", "ch": ["登録事由に該当する情報を取得したときは、運営主体に速やかに報告する。", "登録された譲り受け側が登録事由に該当しなくなったことを知った場合、参加者が運営主体に報告する必要はない。", "共有情報はM&Aに係る支援業務の目的に限り利用し、組織内で共有範囲を設定して管理する。", "運営主体による義務履行状況のモニタリング調査を受け入れる。"], "a": 1, "k": null, "ex": "参加者は登録事由に該当する情報を取得したとき、また該当しなくなったことを知ったときに運営主体へ速やかに報告する。共有情報はM&A支援業務の目的に限り利用し、組織内で共有範囲を設定・管理して外部に流出させてはならない。運営主体のモニタリング調査も受け入れる。", "cn": ["正しい。参加者の義務として示されている。", "誤り。該当しなくなったことを知ったときも報告する。", "正しい。参加者の義務として示されている。", "正しい。参加者の義務として示されている。"], "src": "情報共有 3(5)", "ref": "n5-33", "lv": 2}, {"id": "MKT-053", "sub": "市場・政策", "top": "中小企業政策", "typ": "正しい", "stem": "「不適切な譲り受け側に係る情報共有の仕組みについて」に示された運営主体の義務に関する記述として、正しいものはどれか。", "ch": ["参加者の義務違反に対しては注意にとどめ、戒告や除名は行わないこととされている。", "捜査機関や裁判所等からの調査依頼には、情報保護のため一切応じないこととされている。", "参加申請者の反社会的勢力との関係、代表者・役員・実質的支配者の犯罪歴、M&A支援業務の事業実態等を事前に確認し、問題があれば参加を拒否する。", "情報共有システムのセキュリティ対策は各参加者に委ねられ、運営主体には特段の基準は示されていない。"], "a": 2, "k": null, "ex": "運営主体は参加申請者の反社会的勢力との関係、役員等の犯罪歴、事業実態等を事前確認し、問題があれば参加を拒否する。参加者の義務違反には重大性に応じ注意・戒告・除名等を行い、捜査機関等からの調査依頼への対応方針をあらかじめ定める。情報共有システムはFISC安全対策基準などに準拠して管理する。", "cn": ["誤り。重大性に応じて注意、戒告、除名等を行い、必要に応じ社名等を公表する。", "誤り。調査依頼への対応方針をあらかじめ定めることとされている。", "正しい。運営主体の義務として示されている。", "誤り。FISC安全対策基準などに準拠したセキュリティ対策等で管理する。"], "src": "情報共有 3(6)", "ref": "n5-34", "lv": 2}, {"id": "MKT-054", "sub": "市場・政策", "top": "中小企業政策", "typ": "最も適切", "stem": "税理士Yは、後継者不在の顧問先（個人事業者）から、事業を引き継いでくれる相手を探したいと相談を受けた。日本税理士会連合会の「担い手探しナビ」（参考資料10）に関する説明として、最も適切なものはどれか。", "ch": ["利用申請をした税理士のみが利用でき、Yが顧問先の窓口となって案件をノンネーム情報で登録し、詳細は税理士を通じて問い合わせを受ける。", "顧問先の事業者自身が直接サイトに登録し、Yを介さずに候補先と直接やり取りする仕組みである。", "担い手探しナビは法人のみを対象としているため、個人事業者である顧問先の案件は登録できない。", "案件は実名で公開され、Yは利用にあたり所定の利用料を負担する。"], "a": 0, "k": null, "ex": "担い手探しナビは日本税理士会連合会が平成30年10月から運用するマッチングサイトで、顧問税理士が関与先の窓口となる。利用申請をした税理士のみが利用でき、譲渡・譲受のいずれも、法人・個人や規模を問わず登録できる。案件はノンネーム情報で掲載され詳細は税理士を通じて問い合わせ、税理士は無料で利用できる。", "cn": ["適切。担い手探しナビの特徴どおりである。", "不適切。利用申請をした税理士のみが利用でき、顧問税理士が関与先の窓口となる。", "不適切。法人・個人、規模の大小を問わず登録できる。", "不適切。案件はノンネーム情報で掲載され、税理士は無料で利用できる。"], "src": "参考資料10 p.1", "ref": "n5-25", "lv": 1}, {"id": "MKT-055", "sub": "市場・政策", "top": "中小M&A市場動向", "typ": "正しい", "stem": "資料2（2026年3月）に示された、登録制度のデータを用いた仲介・FA手数料の初期的分析に関する記述として、正しいものはどれか。", "ch": ["手数料率は、報酬金額を譲渡側の純資産（時価）で除して算出されている。", "仲介業務の手数料率は、金融機関が他の支援機関と比べて突出して低い。", "譲渡側純資産（時価）5億円超の案件の手数料率（中央値）は約30%である。", "譲渡価額1千万円超〜5千万円以下の案件では、東京大都市圏の案件のほうが東京大都市圏以外より手数料率（中央値）が低い。"], "a": 3, "k": null, "ex": "資料2の初期的分析の要点は、小規模ほど手数料率が高い、東京圏が低い、支援機関間で大差なし、総資産レーマンが高いの4点である。手数料率は報酬金額÷譲渡価額で、小規模案件は最低手数料が適用され率が高くなる。サービスの価値や業務内容・役割を反映した報酬とすべきではないかと問題提起されている。", "cn": ["誤り。手数料率は報酬金額÷譲渡価額である。", "誤り。仲介31.6%、FA29.1%、金融機関31.5%、経営コンサル26.1%で、大きな差は見受けられない。", "誤り。5億円超は4.3%で、30.0%は5百万円超〜1千万円以下の区分である。", "正しい。東京大都市圏20.0%、それ以外27.1%である。"], "src": "資料2 p.23-27", "ref": "n5-10", "lv": 3}, {"id": "PRA-001", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "正しい", "stem": "中小M&Aガイドラインにおける「中小M&A」の定義に関する記述として、正しいものはどれか。", "ch": ["後継者不在の中小企業の事業を、親族・従業員・社外の第三者のいずれかが引き継ぐことをいう。", "後継者不在の中小企業の事業を、社外の第三者が引き継ぐことをいい、親族内承継や従業員承継は含めない。", "中小企業の事業を社外の第三者が引き継ぐことをいい、従業員承継（MBO等）も含める。", "中小企業同士の合併・買収をいい、後継者の有無は問わない。"], "a": 1, "k": null, "ex": "GLは中小M&Aを「後継者不在の中小企業の事業を、社外の第三者が引き継ぐこと」とし、親族内承継や従業員承継は含めていない。後継者候補は通常、親族内→役員・従業員の順に探し、いずれも不在なら社外の第三者となる。", "cn": ["誤り。親族・従業員による承継は中小M&Aに含めない。", "正しい。GLは中小M&Aを社外の第三者への引継ぎとし、親族内承継・従業員承継は含めない。", "誤り。従業員承継は中小M&Aに含めない。", "誤り。定義は「後継者不在の中小企業の事業を社外の第三者が引き継ぐこと」である。"], "src": "GL p.16, p.27", "ref": "n2-2", "lv": 1}, {"id": "PRA-002", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "誤り", "stem": "中小M&Aガイドラインが挙げる、大企業のM&Aと比べた中小M&Aの特色に関する記述として、誤っているものはどれか。", "ch": ["事業が組織的に運営されており、経営者個人の信用・人柄等の属人的要素に左右されにくい傾向がある。", "譲り渡し側はM&Aが初めてであることがほとんどで、経験・知見が乏しい傾向がある。", "M&Aに多額のコスト（専門業者・士業等の手数料等）を掛けられない傾向がある。", "後継者候補が親族内・社内にいない場合は社外の第三者しかおらず、実現しなければ廃業となる。"], "a": 0, "k": null, "ex": "GLは大企業M&Aと比べた中小M&Aの特色として、①M&A未経験で知見が乏しい、②事業が属人的要素に大きく左右される、③多額のコストを掛けられない、の3点を挙げている。属人的要素に左右されにくいとする記述は逆である。", "cn": ["誤り。中小企業は事業が経営者個人の信用・人柄等の属人的要素に大きく左右される傾向がある。", "正しい。特色の1つ目として挙げられている。", "正しい。特色の3つ目として挙げられている。", "正しい。GL p.27の記述どおり。"], "src": "GL p.27", "ref": "n2-2", "lv": 1}, {"id": "PRA-003", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "最も適切", "stem": "小規模で赤字、簿価上は債務超過の会社を経営するX社長から「うちのような会社を買う先はないから、M&Aは考えずに廃業の準備をしたい」と相談された。中小M&Aガイドラインの考え方に照らし、支援者の対応として最も適切なものはどれか。", "ch": ["債務超過企業のM&Aは法的に認められないため、まず債務超過を解消するよう助言する。", "譲り受け側は収支・財務状況のみで評価するため、黒字化するまでM&Aの検討を控えるよう助言する。", "小規模・赤字・債務超過でも譲り受けを申し出る者は大いにあり得ること、時価で見直すと資産超過の場合もあることを伝え、早期に支援機関へ相談するよう勧める。", "譲り受け側は通常、譲り渡し側と同程度の規模の企業であるため、同業の小規模事業者に限って打診するよう助言する。"], "a": 2, "k": null, "ex": "GLは、小規模・赤字・債務超過でも譲り受けを申し出る者は大いにあり得ることを認識すべきとし、早期に支援機関へ相談することが望まれるとする。簿価上の債務超過でも時価評価で資産超過となるケースもある。", "cn": ["不適切。債務超過でも譲り受けの申出はあり得るとされ、法的に認められないという記述はない。", "不適切。譲り受け側が評価する要素は収支・財務に限られない（技術力、取引先、従業員、許認可等）。", "適切。GL p.30の記述に沿う対応である。", "不適切。譲り受け側は譲り渡し側の数倍程度の規模の企業であるケースが相当割合ある。"], "src": "GL p.29-30", "ref": "n2-3", "lv": 2}, {"id": "PRA-004", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "正しい", "stem": "中小M&Aガイドラインの「早期判断の重要性」に関する記述として、正しいものはどれか。", "ch": ["マッチングには通常2週間〜1か月程度を要するため、判断は決算確定後で足りる。", "マッチングには通常数か月〜1年程度を要するため、早期に判断し動き出すことが重要である。", "マッチングには通常3年〜5年程度を要するため、引退の10年前から準備を始める必要がある。", "一部の事業のみを譲り渡すことは認められないため、事業全体の譲渡を早期に判断する必要がある。"], "a": 1, "k": null, "ex": "GLは、マッチングには通常数か月〜1年程度を要するため早期判断が重要とする。決断が遅れるほど選択肢が狭まり、資金繰りが尽きて廃業費用すら捻出できなくなるケースもある。", "cn": ["誤り。通常は数か月〜1年程度を要する。", "正しい。GL p.30の記述どおり。", "誤り。GLの目安は数か月〜1年程度である。", "誤り。優良店舗など一部事業のみを早期に譲り渡し、事業の一部を継続できる場合もあるとされる。"], "src": "GL p.30-31", "ref": "n2-4", "lv": 1}, {"id": "PRA-005", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "最も適切", "stem": "中小M&Aを検討中の譲り渡し側経営者が、社内の従業員や主要取引先にM&Aの検討を知らせる時期について相談してきた。中小M&Aガイドラインに照らし、最も適切な助言はどれか。", "ch": ["基本合意を締結した時点で、全従業員と主要取引先に知らせるのが原則である。", "従業員の不安を避けるため、支援機関と仲介契約を締結した時点で全従業員に知らせるべきである。", "ごく一部の親族・幹部役員等を除き、原則として可能な限りクロージング後（早くとも最終契約締結後）に知らせるべきで、時期はまず相手方と協議する。", "DDでは現場の協力が必要となるため、DD開始前に全従業員に知らせなければならない。"], "a": 2, "k": null, "ex": "GLは手続全般での秘密厳守を極めて重要とし、ごく一部以外の関係者には原則として可能な限りクロージング後（早くとも最終契約締結後）に知らせるべきとする。情報が伝わった後に頓挫すると事業継続に支障を来すおそれがある。", "cn": ["不適切。原則として可能な限りクロージング後（早くとも最終契約締結後）とされる。", "不適切。頓挫した場合に取引先喪失・従業員退職等のおそれがある。", "適切。GL p.31の記述どおり。", "不適切。社内に非開示の場合は悟られずにDDを行う工夫が必要とされている。"], "src": "GL p.31, p.47", "ref": "n2-4", "lv": 2}, {"id": "PRA-006", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "正しい", "stem": "中小M&Aガイドラインにおける「手続進行上の留意点」に関する記述として、正しいものはどれか。", "ch": ["GLは基本的な手続を示すものであり、全ての中小M&Aで厳格に全手続を実施することを要請するものではない。", "GLに示す全手続を厳格に実施しない中小M&Aは、無効となる。", "小規模なM&Aであっても、簡易な形で実施することは認められない。", "手続を円滑に進めるうえで、譲り受け側の意向への対応は仲介者・FAに一任し、譲り渡し側は関与しないことが望ましい。"], "a": 0, "k": null, "ex": "GLは基本的な手続を示すものであり、全ての中小M&Aで厳格に全手続を実施することを要請するものではない。特に小規模な案件では簡易な形での実施が現実的な場合も多い。", "cn": ["正しい。GL p.31の記述どおり。", "誤り。そのような記述はなく、全手続の厳格な実施は要請されていない。", "誤り。特に小規模な場合は、より簡易な形で実施するのが現実的なケースも多いとされる。", "誤り。譲り受け側・支援機関との信頼関係を築き、譲り受け側の意向に誠実に対応することが必要とされる。"], "src": "GL p.31-32", "ref": "n2-4", "lv": 1}, {"id": "PRA-007", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "組合せ", "stem": "中小M&Aガイドラインのフロー図に示される手続の流れについて、次の空欄A〜Cに入る語句の組合せとして正しいものはどれか。\n\n意思決定 → 仲介者・FAの選定 → バリュエーション → （A）→ 交渉 → （B）→（C）→ 最終契約の交渉・締結 → クロージング → クロージング後", "ch": ["A：基本合意の締結　B：譲り受け側の選定（マッチング）　C：DD", "A：譲り受け側の選定（マッチング）　B：DD　C：基本合意の締結", "A：譲り受け側の選定（マッチング）　B：基本合意の締結　C：DD", "A：DD　B：譲り受け側の選定（マッチング）　C：基本合意の締結"], "a": 2, "k": null, "ex": "GLのフロー図では、事前準備・意思決定の後、仲介者・FAの選定、バリュエーション、マッチング、交渉、基本合意の締結、DD、最終契約の交渉・締結、クロージング、クロージング後（PMI）と進む。", "cn": ["誤り。基本合意は交渉の後である。", "誤り。基本合意の締結の後にDDが行われる。", "正しい。マッチング→交渉→基本合意→DD→最終契約の順である。", "誤り。DDは基本合意の後である。"], "src": "GL p.32-57", "ref": "n2-5", "lv": 1}, {"id": "PRA-008", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "誤り", "stem": "中小M&Aスキルマップが示す各プロセスの目的に関する記述として、誤っているものはどれか。", "ch": ["クロージングの目的は、前提条件の充足を確認し取引を完遂することである。", "事前相談の目的は、M&Aの目的・ニーズを明確にし、プロセスを円滑に進める準備を行うことである。", "DDの目的は、実行可否・譲渡額・最終契約の内容を検討し、PMIに向けた課題を整理することである。", "基本合意の目的は、条件を明確化し、合意に法的拘束力を持たせることである。"], "a": 3, "k": null, "ex": "SMでは、基本合意の目的を「DDや最終条件交渉の土台となる基本条件の合意形成」、最終契約の目的を「条件を明確化し、合意に法的拘束力を持たせる」としている。両者を取り違えないこと。", "cn": ["正しい。SM p.18の記述どおり。", "正しい。SM p.18の記述どおり。", "正しい。SM p.18、p.79の記述どおり。", "誤り。これは最終契約の目的。基本合意の目的はDD・最終条件交渉の土台となる基本条件の合意形成である。"], "src": "SM p.18", "ref": "n2-6", "lv": 2}, {"id": "PRA-009", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "正しい", "stem": "中小M&Aスキルマップにおける知識・スキルの整理に関する記述として、正しいものはどれか。", "ch": ["知識は6観点、スキルは2観点で整理され、知識の「情報」は当事者情報を管理する情報管理・ITリテラシーを指す。", "知識は5観点（M&A実務・ビジネス・会計・法務・税務）、スキルは3観点で整理されている。", "知識の「M&A実務」はM&Aプロセスの知識に限られ、他取引の相場観は含まれない。", "スキルは「対業務」「対関係者」「対行政」の3観点で整理されている。"], "a": 0, "k": null, "ex": "SMは知識を①M&A実務②ビジネス③会計④法務⑤税務⑥情報の6観点、スキルを①対業務②対関係者の2観点で整理している。", "cn": ["正しい。SM p.17の記述どおり。", "誤り。知識は「情報」を加えた6観点、スキルは2観点である。", "誤り。M&A実務にはM&Aプロセスや他取引の相場観等が含まれる。", "誤り。スキルは「対業務」「対関係者」の2観点である。"], "src": "SM p.17", "ref": "n2-7", "lv": 1}, {"id": "PRA-010", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "誤り", "stem": "中小M&Aガイドラインの用語集に関する記述として、誤っているものはどれか。", "ch": ["バリュエーションは企業・事業価値の定量評価であり、譲渡額決定の目安の一つである。", "ロングリストは候補先（数十社程度）の基礎情報の一覧、ショートリストは関心を示した中から絞った数社程度の一覧である。", "債務超過企業とは、簿価ではなく時価評価後の実態貸借対照表上で債務超過である企業をいう。", "M&A支援機関登録制度は令和3年8月に創設され、登録していない者は仲介・FAの業務を行うことができない。"], "a": 3, "k": null, "ex": "M&A支援機関登録制度は令和3年8月に創設され、GL遵守を宣言した仲介者・FAが登録する制度だが、登録しなくても業務を行うことはできる。", "cn": ["正しい。GL用語集の記述どおり。", "正しい。GL用語集の記述どおり。", "正しい。GL用語集の記述どおり。", "誤り。登録制度は令和3年8月創設だが、未登録でも業務は可能である。"], "src": "GL p.16-23", "ref": "n2-8", "lv": 2}, {"id": "PRA-011", "sub": "M&A実務", "top": "M&A実務の基礎", "typ": "全て選べ", "stem": "中小M&Aガイドラインの用語集に関する次の記述ア〜エのうち、正しいものを全て選んだ組合せはどれか。\n\nア　基本合意書は基本的に法的拘束力を有しないが、独占的交渉権や秘密保持義務等には法的拘束力を認めるのが通常である。\nイ　表明保証条項は、通常、最終契約締結時及びクロージング時の一定の事項の真実性・正確性を表明し保証する条項である。\nウ　PMI実践ツールは令和6年3月に策定され、PMI分析ワークシート、PMIアクションプラン、統合方針書の3つで構成される。\nエ　企業概要書（IM）は、秘密保持契約の締結前に関心の打診のために送付する、譲り渡し側が特定されない資料である。", "ch": ["ア、ウ、エ", "ア、イ", "ア、イ、ウ", "イ、ウ、エ"], "a": 2, "k": null, "ex": "エはノンネーム・シート（ティーザー）の説明であり、IMはNDA締結後に提示する実名入りの具体的資料である。ア・イ・ウはGL用語集の記述どおりである。", "cn": ["誤り。エは誤り（ノンネーム・シートの説明）。", "誤り。ウも正しい。", "正しい。ア・イ・ウが正しく、エは誤り。", "誤り。アが正しく、エは誤り。"], "src": "GL p.16-23", "ref": "n2-8", "lv": 2}, {"id": "PRA-012", "sub": "M&A実務", "top": "事前相談", "typ": "正しい", "stem": "中小M&Aガイドラインにおける、支援機関へ最初に相談する際の準備資料に関する記述として、正しいものはどれか。", "ch": ["直近5年分の税務申告書・決算書のほか、事業計画書と株価算定書の提出が必要である。", "直近3年分の税務申告書・決算書・勘定科目内訳明細書の写しがあれば十分であり、詳細資料は支援機関の指示後で足りる。", "直近1年分の決算書のみで足り、税務申告書は不要である。", "相談の前に、すべての契約書・規程類・不動産登記簿を揃えておく必要がある。"], "a": 1, "k": null, "ex": "GLは、支援機関への相談の際の準備資料は直近3年分の税務申告書・決算書（PL・BS含む）・勘定科目内訳明細書の写しで十分とし、可能なら会社案内・HPの写し等もあるとよいとする。", "cn": ["誤り。直近3年分の資料で十分とされる。", "正しい。GL p.34の記述どおり。", "誤り。税務申告書・勘定科目内訳明細書も含む直近3年分である。", "誤り。詳細資料は支援機関の指示後で足りる。"], "src": "GL p.34", "ref": "n2-10", "lv": 1}, {"id": "PRA-013", "sub": "M&A実務", "top": "事前相談", "typ": "組合せ", "stem": "中小M&Aガイドラインにおける株式の整理・集約に関する次の文章の空欄A〜Cに入る語句の組合せとして、正しいものはどれか。\n\n全事業の譲渡等は株主総会の（A）が必要となり得るため、総議決権の（B）以上を保有しておくことが望ましい。また、確認事項として、株主名簿が正しく整備されているか、（C）がないか、株券発行会社では株券が適切に管理されているかが挙げられる。", "ch": ["A：特別決議　B：4分の3　C：自己株式", "A：普通決議　B：過半数　C：名義株", "A：特別決議　B：3分の2　C：名義株", "A：特殊決議　B：3分の2　C：種類株式"], "a": 2, "k": null, "ex": "過半数で株主総会決議は可決できるが、全事業の譲渡等は特別決議（出席株主の議決権の3分の2以上）が必要となり得るため、総議決権の3分の2以上を保有しておくことが望ましい。確認事項は株主名簿の整備、名義株の有無、株券の管理の3点である。", "cn": ["誤り。目安は3分の2以上、確認事項は名義株である。", "誤り。全事業の譲渡等は特別決議が必要となり得る。", "正しい。GL p.35-36の記述どおり。", "誤り。特別決議であり、確認事項は名義株である。"], "src": "GL p.35-36", "ref": "n2-10", "lv": 2}, {"id": "PRA-014", "sub": "M&A実務", "top": "事前相談", "typ": "正しい", "stem": "中小M&Aガイドラインにおける譲り渡し側の意思決定と進め方に関する記述として、正しいものはどれか。", "ch": ["M&Aプラットフォーム等で自ら譲り受け側を見つけ、ほぼ基本合意できた段階でクロージングまでの手続のみを仲介者・FAに依頼するケースは増えつつある。", "意思決定は、支援機関が譲り渡し側に代わって最終的に行うことが望ましい。", "仲介者・FAを選定する場合と選定しない場合は明確に分かれ、両者が重なり合うことはない。", "仲介者・FAを選定した場合、譲り渡し側が自ら譲り受け側を探すことはGL上認められていない。"], "a": 0, "k": null, "ex": "GLは、支援機関に相談しつつ整理した上で、最終的には自ら明確に意思決定することが必要とする。進め方は仲介者・FAを選定する場合と自ら行う場合があり、実際は重なり合う。", "cn": ["正しい。GL p.36-37の記述どおり。", "誤り。最終的には自ら明確に意思決定することが必要とされる。", "誤り。実際は両者が重なり合うとされる。", "誤り。自ら探し、見つからなければ仲介者・FAを選定する例も示されている。"], "src": "GL p.36-37", "ref": "n2-11", "lv": 2}, {"id": "PRA-015", "sub": "M&A実務", "top": "アドバイザリー（仲介・FA）契約", "typ": "誤り", "stem": "中小M&Aガイドラインが示す、M&A支援機関登録制度のホームページのデータベースで確認できる事項として、挙げられていないものはどれか。", "ch": ["手数料の算定基準（報酬率、報酬基準額、最低手数料の額、発生タイミング）", "登録支援機関の種類", "業務開始時期・専従者数", "過去に成約した個別案件の譲渡額"], "a": 3, "k": null, "ex": "GLは仲介者・FAの選定にあたり、登録制度HPのデータベースで登録支援機関の種類、業務開始時期・専従者数、手数料の算定基準等を確認できるとする。選定は複数の仲介者・FAから比較検討して決定することが重要である。", "cn": ["挙げられている事項である。", "挙げられている事項である。", "挙げられている事項である。", "挙げられていない。データベースで確認できる事項として示されていない。"], "src": "GL p.37-38", "ref": "n2-12", "lv": 2}, {"id": "PRA-016", "sub": "M&A実務", "top": "アドバイザリー（仲介・FA）契約", "typ": "組合せ", "stem": "中小M&Aガイドラインが示す仲介契約・FA契約の留意点について、次の空欄A・Bに入る語句の組合せとして正しいものはどれか。\n\n専任条項を設ける場合の契約期間は、最長でも（A）が目安である。また、テール条項のテール期間は、最長でも（B）が目安である。", "ch": ["A：6か月〜1年以内　B：2年〜3年以内", "A：1年〜2年以内　B：2年〜3年以内", "A：6か月〜1年以内　B：5年以内", "A：3か月以内　B：1年以内"], "a": 0, "k": null, "ex": "GLは、専任条項の契約期間は最長でも6か月〜1年以内、テール期間は最長でも2年〜3年以内を目安とする。テール条項の対象は、その仲介者・FAが関与・紹介した譲り受け側とのM&Aに限定される。", "cn": ["正しい。GL p.39-40の目安どおり。", "誤り。専任条項の契約期間は最長でも6か月〜1年以内が目安。", "誤り。テール期間は最長でも2年〜3年以内が目安。", "誤り。いずれも目安と異なる。"], "src": "GL p.38-41", "ref": "n2-13", "lv": 1}, {"id": "PRA-017", "sub": "M&A実務", "top": "アドバイザリー（仲介・FA）契約", "typ": "組合せ", "stem": "中小M&Aガイドラインが示す「直接交渉の制限に関する条項」の確認事項について、空欄A〜Cに入る語句の組合せとして正しいものはどれか。\n\n・相手方の範囲：（A）\n・目的：（B）\n・有効期間：（C）", "ch": ["A：仲介者・FAが紹介した候補先のみ　B：一切の取引　C：契約終了まで", "A：全ての同業他社　B：M&Aに関するもののみ　C：契約終了後2年間", "A：仲介者・FAが紹介した候補先のみ　B：M&Aに関するもののみ　C：契約終了まで", "A：全ての取引先　B：一切の取引　C：契約終了後3年間"], "a": 2, "k": null, "ex": "GLは直接交渉の制限について、相手方の範囲（紹介した候補先のみ）、目的（M&Aに関するもののみ）、有効期間（契約終了まで）の3点を確認するよう示している。別途のNDAにも同様の条項があり得る。", "cn": ["誤り。目的はM&Aに関するもののみに限定される。", "誤り。範囲は紹介した候補先のみ、有効期間は契約終了までである。", "正しい。GL p.40の記述どおり。", "誤り。範囲・目的・期間のいずれも限定されるべきである。"], "src": "GL p.40", "ref": "n2-13", "lv": 2}, {"id": "PRA-018", "sub": "M&A実務", "top": "アドバイザリー（仲介・FA）契約", "typ": "誤り", "stem": "中小M&Aガイドラインが示す仲介契約・FA契約の手数料等に関する記述として、誤っているものはどれか。", "ch": ["仲介者は譲り渡し側・譲り受け側の一方のみと契約し、その一方からのみ手数料を受け取るのが通常である。", "手数料には着手金、月額報酬、中間金、成功報酬があり、完全成功報酬型もある。", "最低手数料について比較検討することが望ましい。", "交通費等の実費にも留意する必要がある。"], "a": 0, "k": null, "ex": "仲介者は譲り渡し側・譲り受け側の双方と契約し、双方に手数料を請求するのが通常である。一方と契約し一方から手数料を受けるのはFAである。", "cn": ["誤り。仲介者は双方と契約し双方に手数料を請求するのが通常であり、相手方分も説明する。", "正しい。GL p.38-39の記述どおり。", "正しい。GL p.39の記述どおり。", "正しい。GL p.39の記述どおり。"], "src": "GL p.38-39, p.42", "ref": "n2-13", "lv": 1}, {"id": "PRA-019", "sub": "M&A実務", "top": "アドバイザリー（仲介・FA）契約", "typ": "誤り", "stem": "中小M&Aガイドラインが示す、仲介契約・FA契約の締結にあたっての主なポイント（8項目）に含まれないものはどれか。", "ch": ["表明保証条項", "専任条項", "テール条項", "責任（免責）に関する条項"], "a": 0, "k": null, "ex": "GLの8ポイントは、①業務形態、②業務範囲・内容、③手数料の体系等、④秘密保持、⑤専任条項、⑥直接交渉の制限に関する条項、⑦テール条項、⑧責任（免責）に関する条項である。", "cn": ["含まれない。表明保証条項は最終契約の条項であり、8項目には含まれない。", "含まれる（ポイント5）。", "含まれる（ポイント7）。", "含まれる（ポイント8）。"], "src": "GL p.38-41", "ref": "n2-13", "lv": 1}, {"id": "PRA-020", "sub": "M&A実務", "top": "アドバイザリー（仲介・FA）契約", "typ": "最も適切", "stem": "譲り渡し側Z社は、債務整理手続を要する債務超過の状態にあり、債権者との関係で最も有利な条件でのM&Aが求められている。中小M&Aガイドラインの「仲介者とFAの比較」に照らし、Z社の支援機関選定として最も適切なものはどれか。", "ch": ["Z社の一方とのみ契約し、依頼者に有利な条件での成立を目指すFAを選定する。", "双方の意向を一元的に把握し、円滑な手続進行を重視する仲介者を選定する。", "双方から手数料を受け取る仲介者を選定し、Z社に有利な条件での交渉を依頼する。", "仲介者とFAに違いはないため、手数料が安い方を選定する。"], "a": 0, "k": null, "ex": "GLは、FAの活用例として最も有利な条件を重視する場合や、債権者・株主等との関係で最有利条件が必要な場合（厳格な入札方式、債務整理手続を要する債務超過企業のM&A等）を挙げる。仲介者は円滑な手続進行を重視する場合に活用される。", "cn": ["適切。債務整理手続を要する債務超過企業のM&AはFAの活用例に挙げられている。", "不適切。仲介者は円滑な手続進行を重視する場合の活用例である。", "不適切。仲介者は一方の利益のみを優先的に取り扱うことはできない。", "不適切。仲介かFAかどちらが適するか検討すべきとされる。"], "src": "GL p.42", "ref": "n2-14", "lv": 2}, {"id": "PRA-021", "sub": "M&A実務", "top": "アドバイザリー（仲介・FA）契約", "typ": "最も適切", "stem": "仲介者から提示された譲渡対価の水準と最終契約の内容に不安を感じた譲り渡し側経営者が、セカンド・オピニオンを求めたいと考えている。中小M&Aガイドラインに照らし、最も適切な対応はどれか。", "ch": ["セカンド・オピニオンは依頼者の意思決定を妨げるため、求めるべきではない。", "同業の他の仲介会社に相談するのが最も中立的・客観的であるため、同業他社のみに相談する。", "仲介契約を締結した後は、秘密保持条項等の確認をせずに自由に他社へ資料を提供して相談する。", "譲渡対価や最終契約内容等の重要事項については、M&Aに詳しい士業等専門家や事業承継・引継ぎ支援センターに相談する。"], "a": 3, "k": null, "ex": "GLは、セカンド・オピニオンは意思決定を後押しする上で有効だが、同業他社（狭義）は中立性・客観性を欠く可能性があるため、重要事項はM&Aに詳しい士業等専門家やセンターへ相談することが望ましいとする。", "cn": ["不適切。セカンド・オピニオンは意思決定を後押しし安心して進める上で有効とされる。", "不適切。同業他社は営業機会と捉え、中立性・客観性を欠く可能性がある。", "不適切。締結後は秘密保持条項等をよく確認し、元の支援機関と相談されたいとされる。", "適切。GL p.43の記述どおり（広義のセカンド・オピニオン）。"], "src": "GL p.38, p.43", "ref": "n2-15", "lv": 2}, {"id": "PRA-022", "sub": "M&A実務", "top": "マッチング", "typ": "正しい", "stem": "中小M&Aガイドラインにおける、仲介者・FAを選定せずに中小M&Aを進める場合に関する記述として、正しいものはどれか。", "ch": ["当事者間で秘密保持契約を締結する必要はない。", "取引先や地域の同業他社を自ら見つけるケースは、近年減少傾向にある。", "仲介者・FAを選定しない場合、士業等専門家やセンターに相談することはできない。", "M&Aプラットフォームは登録案件数・開示範囲・マッチング後の支援等に差があるため、数社を比較検討することが望ましい。"], "a": 3, "k": null, "ex": "GLは、取引先や同業他社を自ら見つけるケースは近年増加傾向とし、M&Aプラットフォームは数社を比較検討することが望ましいとする。不安があれば士業等専門家やセンター等に相談することが望ましい。", "cn": ["誤り。当事者間NDAは参考資料7(2)のサンプルを参照とされる。", "誤り。近年増加傾向とされる。", "誤り。不安があれば士業等専門家やセンター等に相談することが望ましいとされる。", "正しい。GL p.43の記述どおり。"], "src": "GL p.43", "ref": "n2-16", "lv": 1}, {"id": "PRA-023", "sub": "M&A実務", "top": "アドバイザリー（仲介・FA）契約", "typ": "最も適切", "stem": "参考資料6「仲介契約・FA契約締結時のチェックリスト」の「直接交渉の制限」に関するチェック事項として、最も適切なものはどれか。", "ch": ["直接交渉の制限の有効期間が、契約終了後5年以上に設定されているか。", "「自ら候補先を発見しないこと」等を了解していないのに禁止されていないか、目的がM&A取引に限定され、有効期間が契約期間と一致しているか。", "直接交渉の制限の対象が、全ての取引先に及んでいるか。", "直接交渉の制限に違反した場合の違約金が、譲渡額と同額に設定されているか。"], "a": 1, "k": null, "ex": "参考資料6は、直接交渉の制限について「自ら候補先を発見しないこと」等を了解していないのに禁止されていないか、目的がM&A取引に限定されているか、有効期間が契約期間と一致しているかを確認するよう示している。", "cn": ["不適切。有効期間は契約期間と一致しているかを確認する。", "適切。参考資料6のチェック事項どおり。", "不適切。対象は紹介された候補先に限られるべきである。", "不適切。そのようなチェック事項はない。"], "src": "参考資料6 p.1-2", "ref": "n2-17", "lv": 2}, {"id": "PRA-024", "sub": "M&A実務", "top": "事前相談", "typ": "誤り", "stem": "中小M&Aスキルマップの事前相談「潜在ニーズの掘り起こし」における留意点として、誤っているものはどれか。", "ch": ["虚偽・誤認を招く情報提供を行わず、品位ある言葉遣いを心がける。", "広告・営業を望まない企業へは継続せず、停止の連絡はただちに組織的に記録・共有する。", "社名、氏名、アドバイザリー契約の締結を勧誘する旨を明示し、十分な検討時間を与える。", "譲り受け側の属性（事業会社か投資ファンドか）は、関心を示すまでは明示しないことが求められる。"], "a": 3, "k": null, "ex": "SMは潜在ニーズの掘り起こしにおいて、停止連絡の組織的な記録・共有、社名・氏名・勧誘の旨の明示、虚偽・誤認を招く情報提供の禁止、譲り受け側の属性の明示を求めている。", "cn": ["正しい。SM p.21の記述どおり。", "正しい。SM p.21の記述どおり。", "正しい。SM p.21の記述どおり。", "誤り。譲り受け側の属性（事業会社・投資ファンド）を明示することが求められる。"], "src": "SM p.21", "ref": "n2-18", "lv": 1}, {"id": "PRA-025", "sub": "M&A実務", "top": "事前相談", "typ": "正しい", "stem": "中小M&Aスキルマップの事前相談「譲り渡し側・譲り受け側のスクリーニング」に関する記述として、正しいものはどれか。", "ch": ["反社会的勢力に該当しないことを確認すれば、譲り受け側の過去のトラブル情報まで確認する必要はない。", "スクリーニングは最終契約締結後に1回実施すれば足りる。", "譲り渡し側が債務超過の場合等は特に慎重に、少なくとも決算公告等の確認により譲り受け側の財務状況を確認する。", "譲り受け側のトラブル情報は個人情報であるため、組織内で共有してはならない。"], "a": 2, "k": null, "ex": "SMは、契約締結前にスクリーニングし最終契約締結までを通じて信頼性を確認すること、反社該当性に加え過去のトラブル情報を確認すること、譲り渡し側が債務超過の場合等は少なくとも決算公告等で譲り受け側の財務状況を確認することを求めている。", "cn": ["誤り。過去のトラブル情報も確認し、契約履行・事業引継ぎの意思・能力を確認する。", "誤り。契約締結前にスクリーニングし、最終契約締結までを通じて信頼性を確認する。", "正しい。SM p.24の記述どおり。", "誤り。トラブル情報は組織的に共有するとされる。"], "src": "SM p.24", "ref": "n2-18", "lv": 2}, {"id": "PRA-026", "sub": "M&A実務", "top": "秘密保持契約", "typ": "誤り", "stem": "中小M&Aスキルマップの事前相談における、依頼者と支援機関との間の秘密保持契約書の作成・締結に関する記述として、誤っているものはどれか。", "ch": ["対象情報の定義・範囲、期間、違反時の扱いを明確に提示する。", "士業等専門家や事業承継・引継ぎ支援センターへの情報提供も、秘密保持契約の対象として禁止しておくべきである。", "直接交渉の制限、専任、テール条項が含まれる場合は、重要事項説明に準じた対応が望ましい。", "締結方法（双方押印、差し入れ型）は、情報漏洩防止の観点で選択する。"], "a": 1, "k": null, "ex": "SMは依頼者・支援機関間のNDAについて、士業等専門家、センター、保証担保解除を行う金融機関等を秘密保持契約の対象から除外するよう求めている。依頼者が専門家に相談することを妨げないためである。", "cn": ["正しい。SM p.25の記述どおり。", "誤り。士業等専門家・センター・保証担保解除する金融機関等は秘密保持契約の対象から除外する。", "正しい。SM p.25の記述どおり。", "正しい。SM p.25の記述どおり。"], "src": "SM p.25", "ref": "n2-18", "lv": 2}, {"id": "PRA-027", "sub": "M&A実務", "top": "事前相談", "typ": "最も適切", "stem": "事前相談の初期的調査で、依頼者である譲り渡し側に36協定違反と外国人従業員のビザの不備があることが判明した。中小M&Aスキルマップに照らし、支援者の対応として最も適切なものはどれか。", "ch": ["初期段階で把握した法令違反について治癒可能か検討し、治癒が困難な場合は案件の停止等も検討する。また譲り受け側にはマッチング時に説明する。", "法令違反はDDで譲り受け側が発見すべきものであるため、支援者としては特に対応しない。", "法令違反は譲渡額に影響するため、最終契約締結後まで譲り受け側には伝えない。", "法令違反がある企業のM&Aは一律に禁止されているため、直ちに案件を終了する。"], "a": 0, "k": null, "ex": "SMは、依頼者の法令違反は初期段階で把握し、治癒可能なら方法を検討し、困難なら案件の停止等を行うとする。重大な法令違反例として就業規則違反、36協定違反、労務管理の不備、外国人ビザの不備が挙げられる。", "cn": ["適切。SM p.26、p.28の記述どおり。", "不適切。依頼者の法令違反は初期段階で把握し、対応を検討する。", "不適切。譲り受け側にはマッチング時に説明する必要がある。", "不適切。治癒可能なら方法を検討するとされ、一律禁止ではない。"], "src": "SM p.26, p.28", "ref": "n2-18", "lv": 2}, {"id": "PRA-028", "sub": "M&A実務", "top": "事前相談", "typ": "正しい", "stem": "中小M&Aスキルマップの事前相談「M&Aの提案」「スキームの提案」に関する記述として、正しいものはどれか。", "ch": ["M&Aの提案では、DDは費用がかかるため、その重要性は説明しない方がよい。", "スキームは、支援者の業務効率や報酬を考慮して最も都合の良いものを提案することが望ましい。", "クロスボーダー案件では、外為法（事前届出／事後報告／いずれも不要の3通り）や海外の外資規制に留意する。", "M&Aを提案する際に、親族内承継や役員・従業員承継の可能性に留意する必要はない。"], "a": 2, "k": null, "ex": "SMは、支援者にとって都合の良いスキームの提案は決して行ってはならないとし、上場企業が譲り受け側なら金商法の開示、クロスボーダーなら外為法（3通り）や海外の外資規制に留意するとしている。", "cn": ["誤り。DDの重要性を説明するとされる。", "誤り。支援者にとって都合の良いスキームの提案は決して行ってはならない。", "正しい。SM p.30-33の記述どおり。", "誤り。親族内承継・役員従業員承継もあり得る点に留意する。"], "src": "SM p.29-33", "ref": "n2-18", "lv": 2}, {"id": "PRA-029", "sub": "M&A実務", "top": "アドバイザリー（仲介・FA）契約", "typ": "最も適切", "stem": "仲介者Aは、譲り渡し側B社と仲介契約を締結しようとしている。中小M&Aスキルマップに照らし、契約締結時のAの対応として最も適切なものはどれか。", "ch": ["重要事項の説明は、B社の経理担当者に口頭で行えば足りる。", "契約締結前に、契約締結権限を有する者に対し、重要事項を書面（電磁的方法を含む）で交付し口頭でも説明し、仲介者である旨と相手方の手数料も説明する。", "免責条項を説明しておけば、その条項の法的効力は当然に認められる。", "担当者の保有資格・経験年数・成約実績は個人情報であるため、説明しない。"], "a": 1, "k": null, "ex": "SMは、契約締結前に重要事項を明確に説明し、書面を交付し口頭でも説明すること、説明の相手は契約締結権限を有する者であること、仲介者である旨と相手方の手数料も説明することを求めている。", "cn": ["不適切。説明の相手は契約締結権限を有する者で、書面交付と口頭説明を行う。", "適切。SM p.35-37の記述どおり。", "不適切。説明したから法的効力が認められる関係にはない。", "不適切。担当者の保有資格、経験年数・成約実績も説明するとされる。"], "src": "SM p.35-37", "ref": "n2-18", "lv": 2}, {"id": "PRA-030", "sub": "M&A実務", "top": "アドバイザリー（仲介・FA）契約", "typ": "組合せ", "stem": "中小M&Aスキルマップの事前相談「契約書作成」に関する次の文章の空欄A・Bに入る語句の組合せとして、正しいものはどれか。\n\n契約書では少なくともGLの留意点（専任条項、直接交渉の制限、（A））を遵守する。また、仲介者は（B）を仲介者の義務として盛り込む必要がある。", "ch": ["A：COC条項　B：最低手数料の保証", "A：表明保証条項　B：禁止される利益相反行為", "A：テール条項　B：DD報告書の結論付け", "A：テール条項　B：禁止される利益相反行為"], "a": 3, "k": null, "ex": "SMは契約書作成において、少なくともGLの留意点（①専任条項、②直接交渉の制限、③テール条項）を遵守し、仲介者は禁止される利益相反行為を仲介者の義務として盛り込む必要があるとする。ひな形を硬直的に踏襲しないことも求められる。", "cn": ["誤り。いずれも記述と異なる。", "誤り。GLの留意点はテール条項であり、表明保証条項ではない。", "誤り。仲介者はDDの結論付け等を実施できない。", "正しい。SM p.35の記述どおり。"], "src": "SM p.35", "ref": "n2-18", "lv": 2}, {"id": "PRA-031", "sub": "M&A実務", "top": "マッチング", "typ": "組合せ", "stem": "中小M&Aガイドラインが示すマッチングの流れについて、次の空欄A〜Cに入る語句の組合せとして正しいものはどれか。\n\n譲り渡し側を特定できない（A）を、数十社程度に絞った（B）内の企業に送付して打診し、関心を示した候補先から数社程度を（C）化する。その候補先と秘密保持契約を締結し、企業概要書（IM）を交付する。", "ch": ["A：ノンネーム・シート　B：ロングリスト　C：ショートリスト", "A：企業概要書（IM）　B：ロングリスト　C：ショートリスト", "A：ノンネーム・シート　B：ショートリスト　C：ロングリスト", "A：意向表明書　B：プロセスレター　C：ショートリスト"], "a": 0, "k": null, "ex": "GLは、ノンネーム・シートを数十社程度のロングリスト内企業に送付して打診し、関心を示した数社程度をショートリスト化し、秘密保持契約締結後にIMを交付する流れを示す。", "cn": ["正しい。GL p.44の記述どおり。", "誤り。IMはNDA締結後に交付する実名入りの資料である。", "誤り。数十社程度がロングリスト、数社程度がショートリストである。", "誤り。打診に使うのはノンネーム・シートである。"], "src": "GL p.44", "ref": "n2-20", "lv": 1}, {"id": "PRA-032", "sub": "M&A実務", "top": "マッチング", "typ": "誤り", "stem": "中小M&Aガイドラインにおける、単独の支援機関と複数の支援機関へ依頼する場合の比較に関する記述として、誤っているものはどれか。", "ch": ["専任条項や秘密保持条項があると、重ねて他の支援機関に依頼することは困難となるのが通常である。", "単独の支援機関に依頼すると、紹介される候補先の質・数はその支援機関の力量等に左右される。", "複数の支援機関に依頼すると、各機関のネットワークで幅広な紹介が期待できる場合がある。", "複数の支援機関に依頼すると、秘密保持上の不利益やレピュテーションリスクが低くなる。"], "a": 3, "k": null, "ex": "GLは、単独依頼の利点として秘密保持上の不利益・レピュテーションリスクが低いこと、複数依頼の留意点として同じ譲り受け側に複数から紹介され心証を害する等のリスクが高くなることを挙げる。", "cn": ["正しい。GL p.44の記述どおり。", "正しい。単独依頼の留意点である。", "正しい。複数依頼の利点である。", "誤り。複数依頼では秘密保持上の不利益・レピュテーションリスクが高くなる。"], "src": "GL p.44-45", "ref": "n2-21", "lv": 1}, {"id": "PRA-033", "sub": "M&A実務", "top": "アドバイザリー（仲介・FA）契約", "typ": "最も適切", "stem": "専任条項・テール条項付きの仲介契約を締結した仲介者から、長期間候補先の紹介を受けられない譲り渡し側経営者が、別の支援機関への依頼を考えている。中小M&Aガイドラインに照らし、最も適切な対応はどれか。", "ch": ["候補先の紹介がない以上、元の仲介者に連絡せず直ちに別の支援機関と契約する。", "元の仲介者に相談し了承を得る。了承が得られなければ契約期間満了を待つか解約して終了させてから依頼し、契約終了後もテール条項の適用に留意する。", "契約を解約すれば、テール条項の適用を受けることはない。", "連続して不調である以上、その後成立する可能性はないため、直ちに廃業を決定する。"], "a": 1, "k": null, "ex": "GLは、別の支援機関に依頼する場合、元の仲介者・FAに相談し了承を得る、了承がなければ契約期間満了か解約で終了させてから依頼する、テール条項がある場合は契約終了後もその適用に留意する、という手順を示す。", "cn": ["不適切。まず元の仲介者・FAに相談し了承を得るとされる。", "適切。GL p.46の手順どおり。", "不適切。テール条項がある場合は契約終了後もその適用に留意が必要である。", "不適切。連続して不調でもその後成立する可能性は十分にあるとされる。"], "src": "GL p.46", "ref": "n2-22", "lv": 2}, {"id": "PRA-034", "sub": "M&A実務", "top": "マッチング", "typ": "最も適切", "stem": "トップ面談を控えた譲り渡し側経営者への助言として、中小M&Aガイドラインに照らし最も適切なものはどれか。", "ch": ["交渉は仲介者・FAに一任し、面談後も仲介者・FAとのコミュニケーションは最小限にとどめる。", "トップ面談は形式的な顔合わせにすぎないため、特段の準備は不要である。", "譲り受け側による従業員の一斉解雇は通常行われるため、雇用条件は交渉対象から外す。", "誠意ある態度で真摯に面談に臨み、希望条件に優先順位を付して絶対に譲歩できない点を固めておくとともに、譲り受け側経営者が幹部役員等に高圧的な態度を取らないかを確認する。"], "a": 3, "k": null, "ex": "GLは、トップ面談には誠意ある態度で真摯に臨む必要があり、希望条件に優先順位を付して絶対に譲歩できない点を固めておくことが望ましいとする。譲り受け側経営者の姿勢を確認することも考えられる。", "cn": ["不適切。仲介者・FAと緊密にコミュニケーションすることが重要とされる。", "不適切。トップ面談は経営理念・企業文化・人間性を直接確認する場である。", "不適切。実際には従業員の一斉解雇は多くないと言われる。", "適切。GL p.46-47の記述どおり。"], "src": "GL p.46-47", "ref": "n2-23", "lv": 1}, {"id": "PRA-035", "sub": "M&A実務", "top": "基本合意", "typ": "正しい", "stem": "中小M&Aガイドラインにおける基本合意の締結に関する記述として、正しいものはどれか。", "ch": ["基本合意には譲渡対価の予定額は盛り込まず、スキームのみを定める。", "基本合意は、中小M&Aにおいて必ず締結しなければならない。", "資金繰り等で急ぐ場合は、基本合意を締結せず、最低限の秘密保持契約のみで最終契約に直接進むケースもある。", "基本合意は当事者間のみで調印し、仲介者・FAや士業等の助言を受けるべきではない。"], "a": 2, "k": null, "ex": "GLは、概ね条件合意に達したら、スキーム、DD前時点の譲渡対価の予定額、役員・従業員の処遇、スケジュール等を盛り込んだ基本合意を締結するとする。ただし急ぐ場合は最低限のNDAのみで最終契約に進むケースもある。", "cn": ["誤り。DD前時点の譲渡対価の予定額等も盛り込む。", "誤り。基本合意を締結しないケースもある。", "正しい。GL p.47の記述どおり。", "誤り。仲介者・FAや士業等の助言を受けて調印することが大切とされる。"], "src": "GL p.47", "ref": "n2-24", "lv": 1}, {"id": "PRA-036", "sub": "M&A実務", "top": "マッチング", "typ": "組合せ", "stem": "中小M&Aスキルマップのマッチング「進捗報告」に関する次の文章の空欄A〜Cに入る語句の組合せとして、正しいものはどれか。\n\n専任契約の場合は、依頼者から要望が（A）必要な頻度で報告する。マッチングが長期化した場合、月額報酬の適正な金額への減免等に応じることが望ましい。報告の根拠は民法第（B）条（受任者の報告義務）であり、準委任には第（C）条で準用される。", "ch": ["A：なくとも　B：644　C：645", "A：あった場合に限り　B：645　C：656", "A：なくとも　B：645　C：656", "A：あった場合に限り　B：656　C：645"], "a": 2, "k": null, "ex": "SMは、要望があれば速やかに報告し、専任契約の場合は要望がなくとも必要な頻度で報告するとする。根拠は民法第645条（受任者の報告義務）で、準委任には第656条で準用される。", "cn": ["誤り。報告義務は第645条、準用は第656条である。", "誤り。専任契約の場合は要望がなくとも報告する。", "正しい。SM p.51の記述どおり。", "誤り。いずれも記述と異なる。"], "src": "SM p.51", "ref": "n2-25", "lv": 2}, {"id": "PRA-037", "sub": "M&A実務", "top": "マッチング", "typ": "誤り", "stem": "中小M&Aスキルマップにおけるノンネーム・シートの作成に関する記述として、誤っているものはどれか。", "ch": ["記載する情報については、譲り渡し側の合意を得る。", "NDA締結前の資料であるため、譲り渡し側が特定されない内容とする。", "ニッチな業界では、特定されるリスクが大きい点に留意する。", "財務情報は正確性を期すため、1円単位で記載することが望ましい。"], "a": 3, "k": null, "ex": "SMは、ノンネーム・シートは譲り渡し側が特定されない内容とし、財務情報を1円単位で記載しないこと、記載情報について譲り渡し側の合意を得ることを求める。記載内容は大まかな所在地、業種、事業規模、業績、検討理由等である。", "cn": ["正しい。SM p.52の記述どおり。", "正しい。SM p.52の記述どおり。", "正しい。SM p.52の記述どおり。", "誤り。1円単位で記載すると特定のおそれがあるため、1円単位で記載しない。"], "src": "SM p.52", "ref": "n2-25", "lv": 1}, {"id": "PRA-038", "sub": "M&A実務", "top": "マッチング", "typ": "最も適切", "stem": "譲り渡し側C社に簿外債務と未払賃金の可能性があることが判明したが、C社社長は「条件が固まるまで開示したくない」と言っている。中小M&Aスキルマップに照らし、支援者の対応として最も適切なものはどれか。", "ch": ["社長の意向に従い、最終契約締結後に開示する。", "リスクとその対応策を検討し、開示を躊躇する場合でも、遅くとも基本合意締結前には開示する必要があると説明する。", "企業概要書（IM）には強みのみを記載し、リスクは記載しない。", "譲り受け側がDDで発見しなければ開示の必要はないと説明する。"], "a": 1, "k": null, "ex": "SMは、財務・法務・人事労務リスク（簿外債務、未払賃金、訴訟、許認可等）を予見して対応策を検討し、開示を躊躇しても遅くとも基本合意締結前には開示する必要があるとする。IMには想定リスクと対応策も開示する。", "cn": ["不適切。遅くとも基本合意締結前には開示する必要がある。", "適切。SM p.53-54の記述どおり。", "不適切。IMには強みに加え想定リスクと対応策も開示する。", "不適切。リスクは開示する必要がある。"], "src": "SM p.53-54", "ref": "n2-25", "lv": 2}, {"id": "PRA-039", "sub": "M&A実務", "top": "マッチング", "typ": "正しい", "stem": "中小M&Aスキルマップにおけるロングリスト・ショートリストの作成に関する記述として、正しいものはどれか。", "ch": ["譲り受け側がFA形態での関与を希望しても、仲介形態で進めるよう強く働きかけるべきである。", "ロングリストは、成約実績のあるリピーターの譲り受け側を中心に作成するのが望ましい。", "ショートリストへの記載は公表情報のみとしなければならず、反社会的勢力や過去のトラブル等でスクリーニングを行う。", "ロングリストにおいて、譲り受け側が事業会社か投資ファンドかを明示する必要はない。"], "a": 2, "k": null, "ex": "SMは、ロングリストはシナジー仮説で作成し仲介者・FAの都合を優先してはならないとし、ショートリストは合理的な基準で選定、スクリーニングを行い、記載は公表情報のみとしなければならないとする。", "cn": ["誤り。FA形態を希望したら優先し、強引に進めない。", "誤り。仲介者・FAの都合を優先して（リピーターのみ等）作成してはならない。", "正しい。SM p.56の記述どおり。", "誤り。譲り受け側の属性（事業会社・ファンド）を明示する。"], "src": "SM p.55-56", "ref": "n2-25", "lv": 2}, {"id": "PRA-040", "sub": "M&A実務", "top": "秘密保持契約", "typ": "正しい", "stem": "中小M&Aスキルマップのマッチングにおける秘密保持契約（NDA）の作成・締結に関する記述として、正しいものはどれか。", "ch": ["NDAは原則として仲介者と譲り受け側の間でのみ締結すべきである。", "NDAは原則として譲り渡し側と譲り受け側の間で直接締結すべきであり、弁護士の確認に際しては非弁行為（弁護士法第72条）に留意する。", "NDAには違反時の損害賠償を明文化すべきではない。", "士業等専門家やセンターを情報の共有可能先に含めることは認められない。"], "a": 1, "k": null, "ex": "SMは、NDAは原則として譲り渡し側と譲り受け側の間で直接締結すべきとし、破談時に外部アドバイザー分も回収できる体制、違反時の損害賠償の明文化、士業・センター等の共有可能先への追加を求める。", "cn": ["誤り。原則として譲り渡し側と譲り受け側の間で直接締結すべきとされる。", "正しい。SM p.58の記述どおり。", "誤り。違反時の損害賠償を明文化するとされる。", "誤り。士業・センター、業界団体等を共有可能先とするとされる。"], "src": "SM p.58", "ref": "n2-25", "lv": 2}, {"id": "PRA-041", "sub": "M&A実務", "top": "マッチング", "typ": "最も適切", "stem": "仲介者Dは、譲り渡し側E社の社名を含む情報を複数の候補先に開示（ネームクリア）しようとしている。E社社長から「手間なので、どこに開示するかは全部任せる」と言われた。中小M&Aスキルマップに照らし、Dの対応として最も適切なものはどれか。", "ch": ["一任は希望しない先への開示リスクがあるため、実施先ごとに原則として個別に同意を取得し、指示があれば速やかに中止する旨を確約する。", "社長の一任を得たので、Dの判断で必要な候補先に社名を開示する。", "一任を得た以上、開示後に社長から中止の指示があっても開示を継続する。", "M&Aプラットフォーム経由であれば、IM送付の可否を確認する必要はない。"], "a": 0, "k": null, "ex": "SMは、ネームクリアは依頼者の同意を前提とし、実施先ごとに原則個別に同意を取得するとする。一任は希望しない先への開示リスクがあり、指示があれば速やかに中止する旨を確約する。", "cn": ["適切。SM p.59の記述どおり。", "不適切。一任は希望しない先への開示リスクがある。", "不適切。指示があれば速やかに中止する旨を確約するとされる。", "不適切。プラットフォームではIM送付可否を都度確認するとされる。"], "src": "SM p.59", "ref": "n2-25", "lv": 2}, {"id": "PRA-042", "sub": "M&A実務", "top": "マッチング", "typ": "最も適切", "stem": "仲介者Fは、着手金・中間金を得るため、譲り渡し側に関心の薄い候補先を含む多数の先と順次トップ面談を設定しようとしている。また初回トップ面談で譲渡額の詳細交渉を行うことを計画している。中小M&Aスキルマップに照らし、最も適切なものはどれか。", "ch": ["トップ面談で受けた質問と回答は、依頼者に開示する必要はない。", "トップ面談の数が多いほど成約率が高まるため、Fの計画は適切である。", "初回トップ面談で譲渡額の詳細を詰めることは、ディールブレイクを防ぐため推奨されている。", "着手金や中間金を得ることだけを目的に不必要に複数先とトップ面談を実施してはならず、初回は金額交渉等を行わず相互理解の場とすべきである。"], "a": 3, "k": null, "ex": "SMは、着手金や中間金を得ることだけを目的に不必要に複数先とトップ面談を実施してはならないとし、初回は金額交渉等を行わず相互理解の場とするよう求める。受けた質問・回答は全て依頼者へ開示する。", "cn": ["不適切。受けた質問・回答は全て依頼者へ開示する。", "不適切。心理的に引き返しにくくなるので数・順番を考慮する。回数より納得感が重要。", "不適切。初回の詳細な条件交渉はディールブレイクリスクとされる。", "適切。SM p.63-64の記述どおり。"], "src": "SM p.63-66", "ref": "n2-25", "lv": 2}, {"id": "PRA-043", "sub": "M&A実務", "top": "基本合意", "typ": "正しい", "stem": "中小M&Aスキルマップの「基本合意の調整・締結」全般に関わる事項に関する記述として、正しいものはどれか。", "ch": ["基本合意書の内容はすべて法的拘束力を有しない。", "基本合意は必ず締結されるものではなく、意向表明書への応諾書でほぼ同様の合意と扱うこともある。", "独占交渉権の付与とその期間は、支援者の都合で決定する。", "独占交渉権を付与しても、譲り渡し側が新たな候補先を探索することへの影響はない。"], "a": 1, "k": null, "ex": "SMは、基本合意は必ず締結されるものではなく応諾書で代替することもあるとし、法的拘束力のない内容に加え、秘密保持・独占交渉権の付与等の法的拘束力を認める内容が含まれるとする。独占交渉権は当事者の意思で決定する。", "cn": ["誤り。秘密保持、独占交渉権の付与等、法的拘束力を認める内容も含まれる。", "正しい。SM p.69-70の記述どおり。", "誤り。支援者の都合ではなく当事者の意思で決定する。", "誤り。独占交渉権付与で新たな探索は難しくなる。"], "src": "SM p.69-70", "ref": "n2-26", "lv": 2}, {"id": "PRA-044", "sub": "M&A実務", "top": "意向表明", "typ": "最も適切", "stem": "譲り受け側候補G社のみが意向表明書の提出を検討している。G社から「他に候補先はいるのか」と尋ねられた仲介者の対応として、中小M&Aスキルマップに照らし最も適切なものはどれか（特段の事情はないものとする）。", "ch": ["G社に代わって仲介者が意向表明書を作成し、提出を促す。", "G社との信頼関係を優先し、候補が1社のみであることを直ちに伝える。", "譲り渡し側の利益保護の観点から、意向表明書の提出前に候補が1社のみである旨をG社に伝えるべきでない。", "意向表明書には法的拘束力があることを明記するようG社に助言する。"], "a": 2, "k": null, "ex": "SMは、候補が1社のみの場合、譲り渡し側の利益保護の観点から提出前にその旨を伝えるべきでないとする。例外として、案件特性上有益な場合は譲り渡し側の意向を確認の上で伝えることもあり得る。", "cn": ["不適切。作成は譲り受け側が行うべきで、支援者は過度に介入しない。", "不適切。提出前に1社のみである旨を伝えるべきでない。", "適切。SM p.71の記述どおり（譲り渡し側の意向を確認の上で伝える例外はある）。", "不適切。法的拘束力がないことを明記する。"], "src": "SM p.71", "ref": "n2-26", "lv": 3}, {"id": "PRA-045", "sub": "M&A実務", "top": "意向表明", "typ": "正しい", "stem": "中小M&Aスキルマップにおける意向表明書に関する記述として、正しいものはどれか。", "ch": ["意向表明書は、譲り渡し側が作成して譲り受け側に送付する。", "意向表明書には、法的拘束力がないこと、後続の調査・調整により変更の可能性があることを明記する。", "意向表明書は、譲り渡し側の紹介から概ね1週間以内に提出されるのが通常である。", "複数の意向表明書を受領した場合は、DD受入体制にかかわらず全候補と並行して進めるのが原則である。"], "a": 1, "k": null, "ex": "SMは、意向表明書の作成は譲り受け側が行うべきとし、法的拘束力がないこと、変更の可能性があることを明記するよう求める。提出は紹介から概ね2か月前後が目安である。", "cn": ["誤り。作成は譲り受け側が行う。", "正しい。SM p.71の記述どおり。", "誤り。概ね2か月前後が目安とされる。", "誤り。複数並行はDD受入体制と事務コスト・期間が必要であり、方針検討を支援する。"], "src": "SM p.71-72", "ref": "n2-26", "lv": 1}, {"id": "PRA-046", "sub": "M&A実務", "top": "基本合意", "typ": "誤り", "stem": "中小M&Aスキルマップにおける、基本合意形成に向けた交渉・調整及び基本合意書の作成・締結に関する記述として、誤っているものはどれか。", "ch": ["オファー・カウンターオファーは、すべて依頼者に開示する。", "仲介者は、依頼者のためであればFAと同様に一方に有利となる交渉の支援を行うことができる。", "基本合意書の譲渡額は暫定的なもので、変動し得ることを説明する。", "少数株主を押印者から除外すると争いとなり、スクイーズアウトを要する可能性がある。"], "a": 1, "k": null, "ex": "SMは、オファー・カウンターオファーはすべて依頼者に開示し、仲介者はFAと異なり一方に有利となる交渉の支援はできないとする。基本合意書の譲渡額は暫定的であり、締結時は実印での押印が望ましい。", "cn": ["正しい。SM p.74の記述どおり。", "誤り。仲介者はFAと異なり一方に有利となる交渉の支援はできない。", "正しい。SM p.75-76の記述どおり。", "正しい。SM p.77の記述どおり。"], "src": "SM p.74-77", "ref": "n2-26", "lv": 2}, {"id": "PRA-047", "sub": "M&A実務", "top": "DD", "typ": "正しい", "stem": "中小M&AガイドラインにおけるDDの位置づけに関する記述として、正しいものはどれか。", "ch": ["どの調査を実施するかは譲り受け側の意向に従い、本格的なDDを行わず数年分の税務申告書の確認と経営者へのヒアリング等だけで終える例もある。", "どの調査を実施するかは、譲り渡し側の意向に従う。", "中小M&Aでは、財務・法務・ビジネス・税務の全てのDDを必ず本格的に実施しなければならない。", "予算に制約がある場合は、DDを実施しないことが望ましい。"], "a": 0, "k": null, "ex": "GLは、DDの対象は財務・法務・ビジネス・税務等で、どの調査を実施するかは譲り受け側の意向に従うとする。予算制約があっても検討対象を絞るなどの工夫をして実施する調査の内容を検討することが望ましい。", "cn": ["正しい。GL p.47の記述どおり。", "誤り。譲り受け側の意向に従う。", "誤り。DDの密度は様々で、本格的DDを行わない例もある。", "誤り。検討対象を絞るなどの工夫をして実施する調査の内容を検討することが望ましい。"], "src": "GL p.47-48", "ref": "n2-28", "lv": 1}, {"id": "PRA-048", "sub": "M&A実務", "top": "DD", "typ": "正しい", "stem": "中小M&Aガイドラインの用語集に示されるDDの種類とその関係に関する記述として、正しいものはどれか。", "ch": ["税務DDは財務DDに一部含まれることがあり、人事労務DDは法務DDに一部含まれることがある。", "税務DDは法務DDに一部含まれることがあり、人事労務DDは財務DDに一部含まれることがある。", "DDの種類は財務DDと法務DDの2種類に限られる。", "知財DD、環境DD、不動産DD、ITDDは、ビジネスDDの一部として必ず実施される。"], "a": 0, "k": null, "ex": "GL用語集は、財務DD、法務DDのほか、ビジネス（事業）DD、税務DD（財務DDに一部含むことあり）、人事労務DD（法務DDに一部含むことあり）、知財DD、環境DD、不動産DD、ITDDを挙げる。", "cn": ["正しい。GL p.21の記述どおり。", "誤り。税務は財務DD、人事労務は法務DDに一部含まれることがある。", "誤り。ビジネス、税務、人事労務、知財、環境、不動産、ITDD等もある。", "誤り。それぞれ独立した種類として挙げられている。"], "src": "GL p.21", "ref": "n2-28", "lv": 1}, {"id": "PRA-049", "sub": "M&A実務", "top": "DD", "typ": "最も適切", "stem": "仲介者Iは、譲り受け側J社から「DDを代わりにやってほしい。結論も書いてくれれば知り合いの弁護士を紹介料付きで紹介してほしい」と依頼された。中小M&Aスキルマップに照らし、Iの対応として最も適切なものはどれか。", "ch": ["DD結果は譲り受け側の資料であるため、譲り渡し側への開示を働き掛けることは禁止されている。", "J社の依頼であるため、DDを自ら実施し結論も決定する。", "DDは行わないが、弁護士を指定して紹介し、紹介手数料を受領する。", "仲介者はDDを自ら実施すべきでなく、DD報告書の結論を決定すべきでもないと説明し、弁護士あっせんによる手数料受領は非弁提携に該当しうるため行わない。"], "a": 3, "k": null, "ex": "SMは、仲介者はDDを自ら実施すべきでなく、DD報告書の結論を決定すべきでないとする。また、弁護士あっせんで手数料を受領する行為や弁護士の指定は非弁提携に該当しうるとしている。", "cn": ["不適切。可能な限り開示するよう譲り受け側に働き掛けることが望ましいとされる。", "不適切。仲介者はDDを自ら実施すべきでない。", "不適切。弁護士あっせんで手数料を受領する行為や弁護士の指定は非弁提携に該当しうる。", "適切。SM p.80-81の記述どおり。"], "src": "SM p.80-81", "ref": "n2-29", "lv": 2}, {"id": "PRA-050", "sub": "M&A実務", "top": "DD", "typ": "最も適切", "stem": "譲り受け側K社の取締役会で「コスト削減のため、DDを一切行わずに株式譲渡を実行したい」との意見が出た。仲介者として関与する支援者の説明として、中小M&Aスキルマップに照らし最も適切なものはどれか。", "ch": ["DDは可能な限り広範に実施すべきであり、範囲を絞ることは一切認められないと説明する。", "DDの要否は仲介者が最終決定するものであるため、仲介者がDDを省略すると決定する。", "DDを省略しても、取締役の責任が問題となることはないと説明する。", "DDを行わずに実施して損害が生じた場合、取締役の善管注意義務違反が問題となりうることを説明し、不十分又は過剰なDDとならないよう助言したうえで、最終決定はK社自らが行う。"], "a": 3, "k": null, "ex": "SMは、DDを行わずに実施し損害が生じた場合、取締役の善管注意義務違反が問題となりうるとし、目的・重要性・状況・時間的制約等から不十分又は過剰なDDとならないよう助言するとする。仲介者の場合、最終決定は譲り受け側自らが行う。", "cn": ["不適切。不十分又は過剰なDDとならないよう助言するとされる。", "不適切。仲介者の場合、最終決定は譲り受け側自らが実施する必要がある。", "不適切。善管注意義務違反が問題となりうる。", "適切。SM p.82の記述どおり。"], "src": "SM p.82", "ref": "n2-30", "lv": 2}, {"id": "PRA-051", "sub": "M&A実務", "top": "DD", "typ": "正しい", "stem": "中小M&AスキルマップのDD手順における、個別DDの実施機関の選定・データルームの設置に関する記述として、正しいものはどれか。", "ch": ["データルームはクロージング後も永続的に開設しておかなければならない。", "仲介者は、DD実施機関として自社の提携先1社のみを指定して紹介するのが原則である。", "仲介者は、DD実施機関の選定を譲り受け側が自ら実施するのが原則で、希望がない限り紹介すべきでなく、紹介する場合も複数の選択肢を提示する。", "データルームは、VDRと物理的なデータルームを併用することはできない。"], "a": 2, "k": null, "ex": "SMは、仲介者はDD実施機関の選定を譲り受け側が自ら行うのを原則とし、希望がない限り紹介すべきでなく、紹介時も複数の選択肢を提示するとする。データルームはクロージング後に閉鎖するが、データ保存・バックアップを可能にしておく。", "cn": ["誤り。クロージング後に閉鎖するが、表明保証違反に備えデータ保存・バックアップを可能にする。", "誤り。紹介時も複数の選択肢を提示する。", "正しい。SM p.84の記述どおり。", "誤り。物理的又はVDRで、併用も可とされる。"], "src": "SM p.84-86", "ref": "n2-30", "lv": 2}, {"id": "PRA-052", "sub": "M&A実務", "top": "DD", "typ": "誤り", "stem": "中小M&AスキルマップのDD手順に関する記述として、誤っているものはどれか。", "ch": ["DD実施機関間の情報連携には、リリースレターへのサイン等の相互情報開示手続が必要な場合がある。", "初回の依頼資料リストは、顔合わせ前の早期に送付する。", "仲介者・譲り渡し側FAがいる案件でも、DD実施機関と譲り渡し側が直接資料のやり取りを行うのが通例である。", "マネジメントインタビューでは、タイムスケジュール・質問票を事前送付する。"], "a": 2, "k": null, "ex": "SMは、仲介者・譲り渡し側FAがいる案件ではDD実施機関と譲り渡し側の直接やり取りは原則禁止が通例とし、初回リストは顔合わせ前の早期に送付、重複依頼を排除するよう求める。", "cn": ["正しい。SM p.86の記述どおり。", "正しい。SM p.87の記述どおり。", "誤り。仲介者・譲り渡し側FAがいる案件ではDD実施機関と譲り渡し側の直接やり取りは原則禁止が通例。", "正しい。SM p.88の記述どおり。"], "src": "SM p.86-88", "ref": "n2-30", "lv": 2}, {"id": "PRA-053", "sub": "M&A実務", "top": "DD", "typ": "最も適切", "stem": "ビジネスDDで、譲り渡し側の経営者が作成した強気の事業計画を検証している。中小M&Aスキルマップに照らし、検証の視点として最も適切なものはどれか。", "ch": ["いつ・誰が・どういう状況で作成したかを確認し、譲渡対価が大きい場合や成立後の関与が低い場合は強気に、MBOでは過度に保守的になる傾向に留意する。", "事業計画は経営者が作成したものであるため、そのままDCF法の前提として用いる。", "MBOの場合、事業計画は強気になる傾向があるため下方修正する。", "事業計画が存在しない場合、ビジネスDDでは事業計画の検証を省略する。"], "a": 0, "k": null, "ex": "SMは、事業計画を「いつ・誰が・どういう状況で作成したか」の3観点で検証し、譲渡対価が大きい／成立後の関与が低いと強気、MBOでは過度に保守的になる傾向に留意するとする。", "cn": ["適切。SM p.94の記述どおり。", "不適切。DCF法は事業計画に基づくため慎重に精査する。", "不適切。MBOでは過度に保守的になる傾向がある。", "不適切。なければ作成し検証するとされる。"], "src": "SM p.94", "ref": "n2-32", "lv": 2}, {"id": "PRA-054", "sub": "M&A実務", "top": "DD", "typ": "組合せ", "stem": "中小M&AスキルマップのビジネスDDで用いられる分析手法と、その主な用途の組合せとして正しいものはどれか。\n\nア　PEST分析　　イ　ファイブフォース　　ウ　バリューチェーン\n\n①自社分析（主活動と支援活動の機能分解）\n②市場・業界環境分析（政治・経済・社会・技術）\n③競争環境分析（新規参入の脅威、代替品の脅威等）", "ch": ["ア－③　イ－②　ウ－①", "ア－②　イ－③　ウ－①", "ア－②　イ－①　ウ－③", "ア－①　イ－③　ウ－②"], "a": 1, "k": null, "ex": "SMのビジネスDDでは、市場・業界環境分析にPEST分析、競争環境分析にファイブフォースやKSF、自社分析にバリューチェーンとSWOT分析を用いる。", "cn": ["誤り。PESTは市場・業界環境分析、ファイブフォースは競争環境分析。", "正しい。SM p.95、p.98、p.99の記述どおり。", "誤り。ファイブフォースは競争環境分析、バリューチェーンは自社分析。", "誤り。PESTは市場・業界環境分析、バリューチェーンは自社分析。"], "src": "SM p.95-99", "ref": "n2-32", "lv": 2}, {"id": "PRA-055", "sub": "M&A実務", "top": "DD", "typ": "正しい", "stem": "中小M&Aスキルマップのその他DD（IT・人事・環境・不動産）に関する記述として、正しいものはどれか。", "ch": ["IT DDでは、カーブアウトの場合でもスタンドアローン・コストを考慮する必要はない。", "不動産DDは、経済的・法的・物理的の3観点で行い、法的観点では建築基準法の既存不適格や消防法違反等を確認する。", "人事DDでは、親会社からの出向者は調査対象から除外する。", "環境DDでは、既存の取引先は調査範囲に含めない。"], "a": 1, "k": null, "ex": "SMは、不動産DDを経済的・法的・物理的の3観点で行うとし、IT DDではEOLを迎えるインフラやカーブアウト時のスタンドアローン・コスト、人事DDでは親会社からの出向者の把握、環境DDでは必要に応じて既存の取引先も調査範囲に含める点を示す。", "cn": ["誤り。カーブアウトではスタンドアローン・コストを考慮する。", "正しい。SM p.131の記述どおり。", "誤り。親会社からの出向者を把握するとされる。", "誤り。必要に応じて譲り渡し側だけでなく既存の取引先も調査範囲に含めて調査するとされる（SM p.129）。"], "src": "SM p.127-131", "ref": "n2-33", "lv": 2}, {"id": "PRB-001", "sub": "M&A実務", "top": "最終契約", "typ": "正しい", "stem": "中小M&AガイドラインにおけるM&Aの手法（株式譲渡・事業譲渡）に関する記述として、正しいものはどれか。", "ch": ["事業譲渡は株主が保有株
