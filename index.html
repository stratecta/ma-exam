\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.18）<\/p>\n<h3 id=\"n2-7\">知識6観点・スキル2観点<\/h3>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>知識は6観点、スキルは2観点で整理されている。（SM p.17）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>区分<\/th>\n<th>観点<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>知識<\/td>\n<td>①M&amp;A実務<\/td>\n<td>M&amp;Aプロセスや他取引の<strong>相場観<\/strong>等<\/td>\n<\/tr>\n<tr>\n<td>知識<\/td>\n<td>②ビジネス<\/td>\n<td>当事者のビジネスを理解し、論点・リスクを認識する知識<\/td>\n<\/tr>\n<tr>\n<td>知識<\/td>\n<td>③会計<\/td>\n<td>資料の読み取り、スキームから生じる論点・リスクの認識<\/td>\n<\/tr>\n<tr>\n<td>知識<\/td>\n<td>④法務<\/td>\n<td>同上（法務面）<\/td>\n<\/tr>\n<tr>\n<td>知識<\/td>\n<td>⑤税務<\/td>\n<td>同上（税務面）<\/td>\n<\/tr>\n<tr>\n<td>知識<\/td>\n<td>⑥情報<\/td>\n<td>当事者情報を管理する<strong>情報管理・ITリテラシー<\/strong><\/td>\n<\/tr>\n<tr>\n<td>スキル<\/td>\n<td>①対業務<\/td>\n<td>プロジェクトマネジメント力・リーダーシップ／幅広い視野と柔軟な発想／諦めない忍耐的精神力<\/td>\n<\/tr>\n<tr>\n<td>スキル<\/td>\n<td>②対関係者<\/td>\n<td>情報を引き出し協議するコミュニケーション力／チームの「ハブ」となる力／依頼者に寄り添い励ます力<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.17）<\/p>\n<ul>\n<li>スキルマップは各業務に「業務項目」「ポイント、知識・スキル」を示し、M&amp;A支援機関登録制度の「遵守事項一覧チェックシート」も反映している。（SM p.19）<\/li>\n<\/ul>\n<h3 id=\"n2-8\">GL用語集のうち実務用語<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>用語<\/th>\n<th>意味・ポイント<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>マッチング<\/td>\n<td>当事者となり得る者として接触すること。交渉はマッチング後に開始<\/td>\n<\/tr>\n<tr>\n<td>支援機関<\/td>\n<td>M&amp;A専門業者、金融機関、商工団体、士業等専門家、プラットフォーマー、センター等の公的機関<\/td>\n<\/tr>\n<tr>\n<td>仲介者<\/td>\n<td>譲り渡し側・譲り受け側の<strong>双方<\/strong>と契約しマッチング支援等を行う<\/td>\n<\/tr>\n<tr>\n<td>FA<\/td>\n<td><strong>一方<\/strong>と契約しマッチング支援等を行う<\/td>\n<\/tr>\n<tr>\n<td>M&amp;Aプラットフォーム<\/td>\n<td>オンラインでマッチングの場を提供するウェブサイト。運営者＝プラットフォーマー<\/td>\n<\/tr>\n<tr>\n<td>M&amp;A支援機関登録制度<\/td>\n<td><strong>令和3年8月<\/strong>創設。GL遵守を宣言した仲介・FAが登録。未登録でも業務は可能<\/td>\n<\/tr>\n<tr>\n<td>セカンド・オピニオン<\/td>\n<td>他の支援機関の意見・助言。狭義＝同様の業務の者、広義＝士業・センター等<\/td>\n<\/tr>\n<tr>\n<td>ノンネーム・シート（ティーザー）<\/td>\n<td>譲り渡し側が特定されない企業概要。関心の打診に使う<\/td>\n<\/tr>\n<tr>\n<td>ロングリスト<\/td>\n<td>候補先（<strong>数十社程度<\/strong>）の基礎情報の一覧<\/td>\n<\/tr>\n<tr>\n<td>ショートリスト<\/td>\n<td>関心を示した中から絞った候補先（<strong>数社程度<\/strong>）の一覧<\/td>\n<\/tr>\n<tr>\n<td>秘密保持契約（NDA、CA）<\/td>\n<td>秘密保持を確約する契約<\/td>\n<\/tr>\n<tr>\n<td>企業概要書（IM、IP）<\/td>\n<td>NDA締結後に提示する実名入りの具体的資料<\/td>\n<\/tr>\n<tr>\n<td>意向表明書<\/td>\n<td>希望条件等を表明する書面。基本的に法的拘束力なし。第一次・第二次（最終）がある<\/td>\n<\/tr>\n<tr>\n<td>基本合意書（LOI、MOU）<\/td>\n<td>交渉先を絞った時点の了解事項の確認書面。<strong>基本的に法的拘束力なし<\/strong>。ただし独占的交渉権・秘密保持義務等は拘束力を認めるのが通常<\/td>\n<\/tr>\n<tr>\n<td>DD<\/td>\n<td>主に譲り受け側が実施する各種リスクの調査<\/td>\n<\/tr>\n<tr>\n<td>クロージング<\/td>\n<td>最終契約の決済。株式・財産の譲渡と対価の支払<\/td>\n<\/tr>\n<tr>\n<td>PMI<\/td>\n<td>クロージング後一定期間内の経営統合作業<\/td>\n<\/tr>\n<tr>\n<td>中小PMIガイドライン<\/td>\n<td><strong>令和4年3月<\/strong>策定。「基礎編」「発展編」<\/td>\n<\/tr>\n<tr>\n<td>PMI実践ツール<\/td>\n<td><strong>令和6年3月<\/strong>策定。PMI分析ワークシート、PMIアクションプラン、統合方針書の3つ<\/td>\n<\/tr>\n<tr>\n<td>バリュエーション<\/td>\n<td>企業・事業価値の定量評価。譲渡額決定の<strong>目安の一つ<\/strong><\/td>\n<\/tr>\n<tr>\n<td>COC条項<\/td>\n<td>株主異動・支配権変動で相手方に解除権等が生じる条項<\/td>\n<\/tr>\n<tr>\n<td>表明保証条項<\/td>\n<td>一定時点（通常は最終契約締結時・クロージング時）の事項の真実・正確性を表明し保証する条項<\/td>\n<\/tr>\n<tr>\n<td>表明保証保険（M&amp;A保険）<\/td>\n<td>表明保証違反による損害を填補する保険。通常DDレポート提出と引受審査が必要<\/td>\n<\/tr>\n<tr>\n<td>債務超過企業<\/td>\n<td>簿価ではなく<strong>時価評価後の実態貸借対照表<\/strong>上の債務超過<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.16-23） <span class=\"note-tag\">注<\/span>GL用語集の意向表明書の定義は「譲り渡し側が…提出する書面」と記載（原文ママ）。実務上は譲り受け側が提出する書面（SM p.71）。<\/p>\n<h2 id=\"n2-9\">事前相談・事前準備・意思決定と仲介者／FAの選定<\/h2>\n<p>まず行うべきことは身近な支援機関への相談で、準備資料は直近3年分の税務申告書・決算書・勘定科目内訳明細書で足りる。仲介者／FAは複数を比較検討して選び、契約前に8つのポイント（業務形態・範囲・手数料・秘密保持・専任・直接交渉制限・テール・免責）を確認する。<\/p>\n<h3 id=\"n2-10\">事前準備（GL第1章Ⅱ2）<\/h3>\n<ul>\n<li>意思決定を単独で行うのは容易でない。<strong>まずは早期に身近な支援機関へ相談し、助言の下で事前準備を行うことが望ましい<\/strong>。（GL p.34）<\/li>\n<\/ul>\n<h4>（1）支援機関への相談<\/h4>\n<ul>\n<li>単独検討では日々の業務が優先され進まず、誤った判断のおそれ。<strong>まず行うべきことは身近な支援機関への相談<\/strong>。（GL p.34）<\/li>\n<li>相談先：商工団体、士業等専門家（公認会計士・税理士・中小企業診断士・弁護士等）、金融機関、M&amp;A専門業者、事業承継・引継ぎ支援センター等。まず顧問税理士に相談することも多い。日本政策金融公庫（事業承継マッチング支援）も相談を受ける。（GL p.34）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>準備資料は<strong>直近3年分の税務申告書・決算書（PL・BS含む）・勘定科目内訳明細書の写し<\/strong>で<strong>十分<\/strong>。可能なら会社案内・HPの写し等も。詳細資料は支援機関の指示後で足りる。（GL p.34）<\/li>\n<li>意思決定が済んでいないから控えるのではなく、<strong>済んでいないからこそ相談することが必要<\/strong>。（GL p.34）<\/li>\n<li><strong>マイナスな情報や後ろめたい情報ほど先に伝える真摯な姿勢が望まれる<\/strong>。（GL p.34）<\/li>\n<\/ul>\n<h4>（2）後継者不在であることの確認<\/h4>\n<ul>\n<li>後継者不在を確認しておく<strong>必要がある<\/strong>：①親族内承継を実施しないことにつき身近な親族（特に子や兄弟）の了解を得る、②社内に後継者候補がいない（従業員承継不可）ことを確認する。秘密保持にも注意。（GL p.34-35）<\/li>\n<\/ul>\n<h4>（3）引退後のビジョンや希望条件の検討<\/h4>\n<ul>\n<li>引退後のビジョンを含む希望条件を事前によく考えておく<strong>必要がある<\/strong>（例：事業に関わり続けたいか／別事業に進出したいか／社会貢献や余暇を楽しむか）。（GL p.35）<\/li>\n<li>希望条件は代金や雇用継続に限らない。明確化し、<strong>優先順位を付しておくことが望ましい<\/strong>（譲歩できない点を固める）。（GL p.35）<\/li>\n<\/ul>\n<h4>（4）「見える化」「磨き上げ」（株式・事業用資産等の整理・集約）<\/h4>\n<ul>\n<li>中小M&amp;Aでは<strong>最低限、株式・事業用資産等の整理・集約が必要<\/strong>。まず顧問税理士等に相談することが望ましく、法的論点は<strong>弁護士<\/strong>の助言を得ることが望まれる。（GL p.35）<\/li>\n<li>① 株式の整理・集約（GL p.35-36）<\/li>\n<li>株式分散・株主所在不明はM&amp;Aの重大な障害となるおそれ。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>過半数で株主総会決議は可決できるが、全事業の譲渡等は<strong>特別決議<\/strong>（出席株主の議決権の<strong>3分の2以上<\/strong>）が必要となり得る。<strong>総議決権の3分の2以上を保有しておくことが望ましい<\/strong>。<\/li>\n<li>全株式を譲渡する場合、基本的に経営者が全株式を保有しておく必要。他株主からの買取り（資金調達）が必要なケースもある。<\/li>\n<li>確認事項（3点）：①株主名簿が正しく整備されているか　②<strong>名義株<\/strong>がないか　③（株券発行会社）株券が適切に管理されているか。<\/li>\n<li>② 事業用資産等の整理・集約（GL p.36）<\/li>\n<li>重要な事業用資産（不動産・機械設備等）の確認事項（4点）：①第三者名義　②担保設定　③遺産分割で係争　④第三者と係争中。<\/li>\n<li>会社財産と経営者個人財産が未分離の場合、<strong>明確に区別して整理・集約しておく必要がある<\/strong>。<\/li>\n<\/ul>\n<h3 id=\"n2-11\">意思決定（GL第1章Ⅱ3(1)）<\/h3>\n<ul>\n<li>支援機関に相談しつつ整理した上で、<strong>最終的には自ら明確に意思決定することが必要<\/strong>。（GL p.36）<\/li>\n<li>中小M&amp;Aの課題（2点）：A＝マッチング以前（譲り受け側を見つける方法）、B＝マッチング後（具体的な手続の進め方）。（GL p.36）<\/li>\n<li>進め方は(2)-1 仲介者・FAを選定する場合／(2)-2 選定せず自ら行う場合の2パターン。実際は重なり合う。（GL p.36）<\/li>\n<li>例：Aで自ら探し、見つからなければ仲介者・FAを選定。<\/li>\n<li>例：AはM&amp;Aプラットフォームで自ら見つけ、Bで仲介者・FAを活用。ほぼ基本合意できた段階でクロージングまでの手続のみ依頼するケースは<strong>増えつつある<\/strong>。（GL p.36-37）<\/li>\n<\/ul>\n<h3 id=\"n2-12\">仲介者・FAの選定（GL第1章Ⅱ3(2)-1①ア）<\/h3>\n<ul>\n<li>契約名称は「仲介契約」「FA契約」のほか「業務委託契約」「アドバイザリー契約」等もある。（GL p.37）<\/li>\n<li>確認事項：業務形態／業務範囲・内容／契約期間／報酬（手数料）体系／M&amp;A取引の実績（件数・年数等）／利用者の声等。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>複数の仲介者・FAの中から比較検討して決定することが重要<\/strong>。いわゆる「相性」も重要なことがある。（GL p.37）<\/li>\n<li>仲介かFAか、どちらが適するか<strong>検討すべき<\/strong>。仲介者は利益相反リスクがあるため一部業務を提供しない等の措置を講じる（→倫理タブ参照）。特定工程・業種・地域に特化した者もある。（GL p.37）<\/li>\n<li>M&amp;A支援機関登録制度HPのデータベースで確認できる事項：登録支援機関の種類／業務開始時期・専従者数／手数料の算定基準（報酬率、報酬基準額、最低手数料の額、発生タイミング）。（GL p.37-38）<\/li>\n<li>顧問税理士等の支援で進めるケースもある（顧問料とは別報酬の場合があるので予め確認）。（GL p.38）<\/li>\n<\/ul>\n<h3 id=\"n2-13\">仲介契約・FA契約の締結と主なポイント8項目（GL第1章Ⅱ3(2)-1①イ）<\/h3>\n<ul>\n<li>希望条件を明確に伝えつつ、<strong>締結前に納得がいくまで十分な説明を受けることが必要<\/strong>。業務内容や報酬の妥当性はセカンド・オピニオンも<strong>有効<\/strong>。（GL p.38）<\/li>\n<li>締結<strong>後<\/strong>は元の支援機関がセカンド・オピニオンを許容しないことがある。秘密保持条項等をよく確認し、元の支援機関と相談されたい。（GL p.38）<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>ポイント<\/th>\n<th>確認内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>業務形態<\/td>\n<td>仲介かFAかで留意事項が異なるため、確認しておく<strong>必要がある<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>業務範囲・内容<\/td>\n<td>例：マッチングまで／バリュエーションやDDまで／スキーム策定まで／クロージングまで／PMIまで。手数料に見合うか十分検討が<strong>望ましい<\/strong><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>手数料の体系等<\/td>\n<td>着手金・月額報酬・中間金・成功報酬。<strong>完全成功報酬型<\/strong>もある。<strong>最低手数料<\/strong>の比較検討が望ましい。実費（交通費等）にも留意。仲介者は<strong>双方と契約し双方に手数料を請求<\/strong>するのが通常で、相手方分も説明する<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>秘密保持<\/td>\n<td>双方に秘密保持義務。士業等専門家やセンターへの情報共有が許容されているか確認が<strong>望ましい<\/strong><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>専任条項<\/td>\n<td>他の仲介者・FAへの並行依頼を禁止。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>対象範囲は可能な限り限定されるべき<\/strong>。合理的理由がなければセカンド・オピニオンは<strong>許容される<\/strong>。契約期間は<strong>最長でも6か月〜1年以内が目安<\/strong>。中途解約も確認<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>直接交渉の制限に関する条項<\/td>\n<td>確認3点：相手方の範囲（仲介者・FAが紹介した候補先のみ）／目的（M&amp;Aに関するもののみ）／有効期間（契約終了まで）。別途のNDAにも同条項があり得る<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>テール条項<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>契約終了後の手数料請求。テール期間は<strong>最長でも2年〜3年以内が目安<\/strong>。対象はその仲介者・FAが関与・紹介した譲り受け側とのM&amp;Aのみ<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>責任（免責）に関する条項<\/td>\n<td>損害賠償責任の要件・範囲を修正する条項。適切に負担を求められるか予め確認が<strong>望ましい<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.38-41） → 条項の法的意味は法務タブ、手数料の計算は財務・税務タブ、規範の強さは倫理タブ参照。<\/p>\n<h3 id=\"n2-14\">仲介者とFAの比較（GL p.42）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>形態<\/th>\n<th>契約の相手方等<\/th>\n<th>特徴<\/th>\n<th>活用例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>仲介者<\/td>\n<td><strong>双方<\/strong>と契約。<strong>双方から手数料<\/strong>を受けるのが通常<\/td>\n<td>一方の利益のみを優先的に<strong>取り扱うことはできない<\/strong>が、双方の意向を一元的に把握しM&amp;A成立を目指す<\/td>\n<td>最も有利な条件だけでなく、<strong>円滑な手続進行を重視<\/strong>する場合<\/td>\n<\/tr>\n<tr>\n<td>FA<\/td>\n<td><strong>一方<\/strong>と契約。<strong>その一方から手数料<\/strong><\/td>\n<td>依頼者の意向を踏まえ<strong>依頼者に有利な条件<\/strong>での成立を目指す<\/td>\n<td>①最も有利な条件を重視する場合。②債権者・株主等との関係で最有利条件が必要な場合（厳格な入札方式、債務整理手続を要する債務超過企業のM&amp;A、利益相反のおそれのない機関選定が必要な場合等）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.42）<\/p>\n<h3 id=\"n2-15\">セカンド・オピニオンの利点・留意点（GL p.43）<\/h3>\n<ul>\n<li>利点：依頼者の意思決定を後押しし、安心して進める上で<strong>有効<\/strong>。<\/li>\n<li>留意点：同業他社（狭義）は営業機会と捉え、<strong>中立性・客観性を欠く可能性<\/strong>がある。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>譲渡対価や最終契約内容等の重要事項は、<strong>M&amp;Aに詳しい士業等専門家や事業承継・引継ぎ支援センターへ相談すること（広義）が望ましい<\/strong>。<\/li>\n<\/ul>\n<h3 id=\"n2-16\">仲介者・FAを選定しない場合（GL p.43）<\/h3>\n<ul>\n<li>取引先や地域の同業他社を自ら見つけるケースは近年増加傾向。<\/li>\n<li>M&amp;Aプラットフォーム登録が有効な場合もある。登録案件数・登録情報・開示範囲・マッチング後支援に差があるので<strong>数社を比較検討することが望ましい<\/strong>。<\/li>\n<li>不安があれば士業等専門家やセンター等に<strong>相談することが望ましい<\/strong>。当事者間NDAは参考資料7(2)のサンプル参照。<\/li>\n<li>一部工程で仲介者・FA等を使う場合は、その工程で(2)-1に準じた対応が考えられる。（GL p.43）<\/li>\n<\/ul>\n<h3 id=\"n2-17\">参考資料6 仲介契約・FA契約締結時のチェックリスト（全10項目）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>本文見出し<\/th>\n<th>チェック事項<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>仲介契約・FA契約の締結<\/td>\n<td>希望条件を明確に伝えたか<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>業務形態<\/td>\n<td>双方から受任する仲介者と一方のみのFAの違いを理解し、本件がどちらか確認したか（仲介者は双方に手数料請求が通常）<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>業務範囲・内容<\/td>\n<td>どの工程までか、具体的な業務内容は何か<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>手数料の体系<\/td>\n<td>算定基準、支払タイミング、最低手数料の有無<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>秘密保持<\/td>\n<td>条項の有無、対象情報、士業等専門家やセンターへの共有可否<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>専任条項<\/td>\n<td>並行依頼禁止条項の有無、セカンド・オピニオンの可否<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>（専任条項欄に連続）<\/td>\n<td>契約期間、中途解約条項、専任条項の有効期限<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>直接交渉の制限<\/td>\n<td>「自ら候補先を発見しないこと」等を了解していないのに禁止されていないか。目的がM&amp;A取引に限定、有効期間が契約期間と一致しているか<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>テール条項<\/td>\n<td>期間が<strong>2年〜3年以内<\/strong>か、対象が実際に紹介された譲り受け側に限定されるか<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>責任（免責）<\/td>\n<td>損害賠償責任を修正する条項の有無、適切に負担を求められる内容か<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料6 p.1-2） <span class=\"note-tag\">注<\/span>No.7は原資料で「専任条項」欄に続く行として配置（本文欄の独立表記なし）。チェック項目は計10。<\/p>\n<h3 id=\"n2-18\">SM「事前相談」の全14項目（支援者側の手順）<\/h3>\n<p>目的：M&amp;Aの目的・ニーズを明確にし、プロセスを円滑に進める準備を行う。業務内容：方針・意向に基づき案件の初期検討・事前準備。大項目は顧客へのアプローチ／相談受付／スクリーニング／NDA締結／ヒアリング／提案／契約の締結。（SM p.20）<\/p>\n<h4>1 潜在ニーズの掘り起こし（SM p.21）<\/h4>\n<ul>\n<li>広告・営業を望まない企業へは継続せず、停止連絡は<strong>ただちに組織的に記録・共有<\/strong>。<\/li>\n<li><strong>社名、氏名、アドバイザリー契約締結を勧誘する旨<\/strong>を明示し、十分な検討時間を与える。<\/li>\n<li>虚偽・誤認を招く情報提供を行わない。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>譲り受け側の属性（事業会社・投資ファンド）を明示<\/strong>することが求められる。<\/li>\n<li>品位ある言葉遣い。強引な勧誘は民法上の不法行為責任、独禁法・不正競争防止法の規制の可能性（→倫理タブ参照）。<\/li>\n<\/ul>\n<h4>2 提携先との連携（SM p.21）<\/h4>\n<ul>\n<li>金融機関・士業等の特性を理解し連携。<strong>過度な案件紹介依頼を行わない<\/strong>。紹介顧客への新たな提案は提携先への確認・報告を行う。<\/li>\n<\/ul>\n<h4>3 簡易的なヒアリングの実施（SM p.22-23）<\/h4>\n<ul>\n<li>机上調査で<strong>仮説を構築した上で<\/strong>ヒアリング。課題・ニーズを整理する。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>「M&amp;Aが依頼者の<strong>真の利益<\/strong>に繋がるか」を検討。M&amp;A以外（アライアンス、廃業、経営者保証解除の取組等）が適当な場合もある。<\/li>\n<li>決算書で概算の企業価値を評価。<strong>売上総利益率の推移<\/strong>は付加価値を示し重要。<\/li>\n<li>成約可能性判断の6項目：(1)事業規模 (2)営業利益 (3)EBITDA (4)債務・資産状況 (5)有利子負債 (6)ネットデット。<\/li>\n<li>情報入手時は秘密保持契約を締結。<\/li>\n<li>知識：財務分析の観点（利益・費用内訳、売上、簿価純資産、現預金、有利子負債、業績安定性、株価、融資判断可否等）、事業分析の観点（業法規制、参入障壁、成長性）。例：<strong>農地所有適格法人<\/strong>は法人による支配権取得が極めて困難、<strong>医療法人<\/strong>は基準病床数等の規制、<strong>ガソリンスタンド<\/strong>は土壌汚染リスク。<\/li>\n<li>譲り受け側の与信判断：事業会社＝企業概要、財務健全性（自己資金割合、有利子負債/EBITDA倍率等）、保全。PEファンド＝資金調達状況、投資実績、LBOのエクイティ：デット比率等。<\/li>\n<li>スキル：依頼者に寄り添い認識を確かめながらヒアリング、資料依頼の趣旨を伝えられる。<\/li>\n<\/ul>\n<h4>4 譲り渡し側・譲り受け側のスクリーニング（SM p.24）<\/h4>\n<ul>\n<li>契約締結<strong>前に<\/strong>スクリーニングし、<strong>最終契約締結までを通じて<\/strong>信頼性を確認。<\/li>\n<li>反社該当性に加え<strong>譲り受け側の過去のトラブル情報<\/strong>を確認し、最終契約を履行し事業を引き継ぐ意思・能力を確認。トラブル情報は組織的に共有。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>譲り渡し側が債務超過<\/strong>の場合等は特に慎重に、<strong>少なくとも決算公告等の確認<\/strong>で譲り受け側の財務状況を確認。<\/li>\n<\/ul>\n<h4>5 秘密保持契約書の作成・締結（依頼者・支援機関間）（SM p.25）<\/h4>\n<ul>\n<li>対象情報の定義・範囲、期間、違反時の扱いを明確に提示。<\/li>\n<li>直接交渉制限・専任・テール条項が含まれる場合は、<strong>重要事項説明に準じた対応が望ましい<\/strong>。<\/li>\n<li>士業等専門家・センター・保証担保解除する金融機関等を<strong>秘密保持契約の対象から除外<\/strong>。<\/li>\n<li>締結方法（双方押印、差し入れ型）は情報漏洩防止の観点で選択。<\/li>\n<\/ul>\n<h4>6 初期的調査（SM p.26）<\/h4>\n<ul>\n<li>机上調査でビジネスモデル・課題の仮説を構築。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>依頼者の<strong>法令違反は初期段階で把握<\/strong>。治癒可能なら方法を検討し、困難なら<strong>案件の停止等<\/strong>。<\/li>\n<li>公開情報・有料DBで人物像を把握。資料要求は理由を明確に。収集不能な資料があれば<strong>限定的な算定<\/strong>となる旨を伝える。<\/li>\n<li>知識：<strong>決算書3期分<\/strong>・会社説明資料・HP等。重大な法令違反例＝<strong>就業規則違反、36協定違反、労務管理の不備、外国人ビザの不備<\/strong>。<\/li>\n<\/ul>\n<h4>7 ヒアリングシートの作成（SM p.27）<\/h4>\n<ul>\n<li>質問は負担にならない程度に。<strong>事前送付<\/strong>で効率化。<\/li>\n<li>NDAを締結しない場合、得られる情報は限定的。親族・社内に後継者候補がいないことの確認が重要。<\/li>\n<li>確認事項：企業情報（売上、利益、従業員数、株主構成等）、経営者情報（年齢、家族構成、検討背景）、M&amp;Aの希望（期限、相手候補、経済条件、処遇）。<\/li>\n<\/ul>\n<h4>8 ヒアリングの実施（SM p.28）<\/h4>\n<ul>\n<li>初期調査の情報を提示して引き出す／シートにとらわれず深掘り／分かりやすく説明。「事業への想い」も聞き出す。<\/li>\n<li><strong>M&amp;Aの実施意向の強さ<\/strong>を確認。<strong>少数株主の存在・属性<\/strong>（旧配偶者等）を確認。<\/li>\n<li>財務上の不安・法令違反等は本段階で明確化。法令違反は治癒を早期検討し、<strong>譲り受け側にはマッチング時に説明する必要<\/strong>。<\/li>\n<li><strong>経営者保証の扱い<\/strong>を譲り渡し側経営者と擦り合わせる。<\/li>\n<\/ul>\n<h4>9 M&amp;Aの提案（SM p.29）<\/h4>\n<ul>\n<li>重要なメリット・デメリット、各プロセスの支援内容、<strong>DDの重要性<\/strong>、手数料体系（最低手数料、報酬率、報酬基準額、発生タイミング）、<strong>遅延が発生しうるプロセス<\/strong>を説明。<\/li>\n<li>親族内承継・役員従業員承継もあり得る点に留意。知識：仲介者・FAの違い、自己株式（金庫株）、種類株式、MBO、従業員持株制度。必要なら<strong>弁護士・税理士等を交えて<\/strong>検討。<\/li>\n<\/ul>\n<h4>10 スキームの提案（SM p.30-33）<\/h4>\n<ul>\n<li>優先条件・意向・財務状況から検討。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>支援者にとって都合の良いスキームの提案は決して行ってはならない<\/strong>。<\/li>\n<li>提案理由・メリット・デメリットに答えられるよう準備。M&amp;A以外の手段が適当なら選択肢を提示。<\/li>\n<li>譲り受け側が上場企業等なら<strong>金商法の開示<\/strong>対象の可能性。クロスボーダーは<strong>外為法<\/strong>（事前届出／事後報告／いずれも不要の<strong>3通り<\/strong>）や海外の外資規制に留意。<\/li>\n<li>スキーム比較表は本タブ「中小M&amp;Aの手法と特徴」を参照。<\/li>\n<\/ul>\n<h4>11 初期バリュエーション結果の共有（SM p.34）<\/h4>\n<ul>\n<li>内容は「バリュエーション」プロセスと同様（→財務・税務タブ参照）。<\/li>\n<\/ul>\n<h4>12 初期ロングリスト・ソーシング方法の提案（SM p.34）<\/h4>\n<ul>\n<li>シナジーが期待できる業界・企業の仮説でロングリストを検討。競合・過去取引先等の情報もヒアリング。重視点（譲渡額、雇用、地域性等）で<strong>ソーシング方針は大きく異なる<\/strong>。<\/li>\n<\/ul>\n<h4>13 契約書作成（SM p.35）<\/h4>\n<ul>\n<li>プロセスごとの支援内容を契約書に反映。ひな形を硬直的に踏襲しない。<\/li>\n<li><strong>少なくともGLの留意点（①専任条項、②直接交渉の制限、③テール条項）を遵守<\/strong>。秘密保持は士業・センターへの相談を妨げない内容に。<\/li>\n<li>仲介者は<strong>禁止される利益相反行為を仲介者の義務として盛り込む必要がある<\/strong>。<\/li>\n<\/ul>\n<h4>14 契約締結（SM p.35-37）<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>契約締結前に重要事項を明確に説明<\/strong>。<strong>書面を交付<\/strong>（電磁的方法含む）し<strong>口頭でも説明<\/strong>。説明の相手は<strong>契約締結権限を有する者<\/strong>。<\/li>\n<li>仲介契約は実施できない業務（バリュエーションやDDの結論付け等）があるため、仲介者である旨と<strong>相手方の手数料<\/strong>も説明。<\/li>\n<li>手数料の詳細とプロセスごとの支援を説明し、<strong>十分な検討時間<\/strong>を与える。担当者の<strong>保有資格、経験年数・成約実績<\/strong>も説明。交渉申入れには誠実に対応。<\/li>\n<li>契約期間（専任条項があれば<strong>最長でも6か月〜1年以内が目安<\/strong>）や中途解約も確認が望ましい。<\/li>\n<li>免責条項を説明しても、<strong>説明したから法的効力が認められる関係にはない<\/strong>。<\/li>\n<\/ul>\n<p>（SM p.20-37）→ 重要事項説明の規範面は倫理タブ参照。<\/p>\n<h2 id=\"n2-19\">マッチング・交渉・基本合意<\/h2>\n<p>マッチングは「ノンネーム・シートをロングリスト（数十社）に打診→ショートリスト（数社）→NDA→IM交付」の順で進む。基本合意は基本的に法的拘束力がないが、独占交渉権・秘密保持義務には拘束力を認めるのが通常で、必ず締結するものでもない。<\/p>\n<h3 id=\"n2-20\">GL：マッチングの流れ（GL p.44）<\/h3>\n<p>マッチングは中小M&amp;Aの<strong>重要な工程<\/strong>。<\/p>\n<ol>\n<li>譲り渡し側を特定できない<strong>ノンネーム・シート<\/strong>を、<strong>数十社程度<\/strong>に絞った<strong>ロングリスト<\/strong>内の企業に送付し打診。<\/li>\n<li>関心を示した候補先から<strong>数社程度<\/strong>を<strong>ショートリスト<\/strong>化。<\/li>\n<li>その候補先と秘密保持契約を締結。<\/li>\n<li>企業概要書（IM）を交付し、以後のマッチング支援を行う。<\/li>\n<\/ol>\n<ul>\n<li>希望する候補先・避けたい先は<strong>事前に仲介者・FAに伝えることが望ましい<\/strong>。打診の優先順位も十分話し合う。（GL p.44）<\/li>\n<li>情報拡散防止のため、ロングリストを譲り渡し側と精査して数社に絞り、その先にのみノンネーム・シートを送るケースもある。（GL p.19-20）<\/li>\n<\/ul>\n<h3 id=\"n2-21\">GL：単独の支援機関と複数の支援機関への依頼の比較（GL p.44-45）<\/h3>\n<p>専任条項や秘密保持条項があると、重ねて他の支援機関に依頼することは困難となるのが通常。<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>利点<\/th>\n<th>留意点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>単独に依頼<\/td>\n<td>秘密保持上の不利益・レピュテーションリスクが<strong>低く<\/strong>なる／情報管理が比較的容易／専任だとより積極的に取り組む期待との指摘<\/td>\n<td>紹介される候補先の質・数はその支援機関の力量等に左右される<\/td>\n<\/tr>\n<tr>\n<td>複数に依頼<\/td>\n<td>各機関のネットワークで幅広な紹介が期待できる場合がある／競争でより魅力的な候補先が期待されるとの指摘<\/td>\n<td>秘密保持上の不利益・レピュテーションリスクが<strong>高く<\/strong>なる（同じ譲り受け側に複数から紹介され心証を害する等）／情報管理が煩雑／どの候補先と進むべきか判断が難しい場合がある<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.44-45）<\/p>\n<ul>\n<li>単独依頼でも（特にFA）他機関のネットワークをいかす場合があるとの指摘もあった。（GL p.45）<\/li>\n<\/ul>\n<h3 id=\"n2-22\">GL：候補先の紹介が受けられない場合（GL p.46）<\/h3>\n<ul>\n<li>連続して不調でも、その後成立する可能性は<strong>十分にある<\/strong>。見つからなければM&amp;Aプラットフォームや別の支援機関も検討。<\/li>\n<li>別の支援機関への依頼手順：\n  1. 元の仲介者・FAに相談し了承を得る（専任条項があれば応じないことも）。\n  2. 了承がなければ、契約期間満了を待つか解約して終了させてから依頼。\n  3. <span class=\"star\" aria-label=\"頻出\">★<\/span><strong>テール条項がある場合は契約終了後もその適用に留意が必要<\/strong>。<\/li>\n<li>見つからない理由を支援機関に確認・分析して活動継続を検討。廃業せざるを得ない場合は経営資源の引継ぎの検討開始が<strong>望まれる<\/strong>。探索の打切り時期は仲介者・FAと協議の上決定。（GL p.46）<\/li>\n<\/ul>\n<h3 id=\"n2-23\">GL：交渉（GL p.46-47）<\/h3>\n<ul>\n<li>トップ面談の時期・方法も含め進め方は様々。トップ面談は経営理念・企業文化・人間性を直接確認する場。<strong>誠意ある態度で真摯に面談に臨む必要がある<\/strong>。<\/li>\n<li>希望条件に優先順位を付し、特に<strong>絶対に譲歩できない点を固めておくことが望ましい<\/strong>。仲介者・FAと緊密にコミュニケーションすることが<strong>重要<\/strong>。<\/li>\n<li>実際には従業員の一斉解雇（リストラ）は多くないと言われる。譲り受け側経営者が幹部役員等に<strong>高圧的な態度を取らず同等に接する姿勢<\/strong>か確認することが考えられる。（GL p.46-47）<\/li>\n<\/ul>\n<h3 id=\"n2-24\">GL：基本合意の締結（GL p.47）<\/h3>\n<ul>\n<li>概ね条件合意に達したら、主要な合意事項を盛り込んだ基本合意を締結：スキーム／DD前時点の譲渡対価の予定額／役員・従業員の処遇／最終契約までのスケジュールと実施・遵守事項／条件の最終調整方法等（参考資料7(3)サンプル）。<\/li>\n<li>仲介者・FAや士業等の助言を受けて調印することが<strong>大切<\/strong>。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>資金繰り等で急ぐ場合は、基本合意を締結せず<strong>最低限の秘密保持契約のみ<\/strong>で最終契約に直接進むケースもある。（GL p.47）<\/li>\n<\/ul>\n<h3 id=\"n2-25\">SM「マッチング」の全項目<\/h3>\n<p>目的：ニーズ・条件に合う相手を発見する。業務：ロング／ショートリスト作成、アプローチ、トップ面談。（SM p.50）<\/p>\n<h4>全般：マッチングの進捗報告（SM p.51）<\/h4>\n<ul>\n<li>要望があり次第速やかに報告。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>専任契約の場合は要望がなくとも<\/strong>必要な頻度で報告。<\/li>\n<li>長期化した場合、<strong>月額報酬の適正な金額への減免等に応じることが望ましい<\/strong>。実現が望めないときは<strong>理由とともに速やかに報告<\/strong>。<\/li>\n<li>根拠：<strong>民法第645条<\/strong>（受任者の報告義務）、準委任は<strong>第656条<\/strong>で準用。<\/li>\n<\/ul>\n<h4>マッチングの各項目（全14項目）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>項目（SM頁）<\/th>\n<th>手順・ポイント<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>ノンネーム・シートの作成（p.52）<\/td>\n<td>NDA前なので特定されない内容に。ニッチ業界は特定リスク大。財務情報を<strong>1円単位<\/strong>で記載しない。記載情報は<strong>譲り渡し側の合意<\/strong>を得る。記載内容＝大まかな所在地、業種、事業規模、業績、検討理由<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>企業概要書（IM）の作成（p.53）<\/td>\n<td>強みに加え<strong>想定リスクと対応策も開示<\/strong>。同意を得て最終化。<strong>虚偽・過度な誇張がないよう<\/strong>注意。ディスクレーマーで留保。時間をかけすぎて打診を遅らせない<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>リスク対応策の検討（p.54）<\/td>\n<td>財務・法務・人事労務リスク（簿外債務、未払賃金、訴訟、許認可等）を予見。<span class=\"star\" aria-label=\"頻出\">★<\/span>開示を躊躇しても<strong>遅くとも基本合意締結前には開示する必要がある<\/strong><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>ロングリストの作成・提案（p.55）<\/td>\n<td>シナジー仮説で作成。<strong>仲介者・FAの都合を優先して作成してはならない<\/strong>（リピーターのみ等）。譲り受け側の属性（事業会社・ファンド）を明示。譲り受け側がFA形態を希望したら優先し<strong>強引に進めない<\/strong>。IM送付の了承も得ておく。PEファンドの種類＝VC、バイアウト、再生、ディストレス<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>ショートリストの作成・提案（p.56）<\/td>\n<td>合理的な選定基準を提示。反社・過去のトラブルで<strong>スクリーニング<\/strong>。流出に注意。記載は<strong>公表情報のみとしなければならない<\/strong>。選定過程を記録<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>ノンネーム・シートの送付（p.57）<\/td>\n<td>送付後に適時フォローアップ。口頭補足は事前に伝達可能情報を確認。必要なら本段階でNDA。送付前＝開示範囲・送付先確認、送付後＝送付先管理・反応確認・報告<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>M&amp;Aプラットフォーム登録の提案（p.57）<\/td>\n<td>メリット（<strong>低コスト<\/strong>）・留意点を説明し相談。<strong>ネットに流出した情報は完全消去が困難<\/strong>。譲り渡し側は手数料不要が多く、譲り受け側はクロージング時成功報酬が多い（要確認）<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>秘密保持契約（NDA）の作成・締結（p.58）<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>原則譲り渡し側と譲り受け側の間で直接締結すべき<\/strong>。破談時に外部アドバイザー分も回収できる体制。違反時の損害賠償を明文化。士業・センター、情報共有の仕組みを運営する業界団体等を共有可能先に。弁護士確認（<strong>非弁行為・弁護士法第72条<\/strong>に留意）<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>ネームクリアの実施（p.59）<\/td>\n<td>同意を前提に社名を含む情報を開示。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>実施先ごとに原則個別に同意取得<\/strong>。<strong>一任<\/strong>は希望しない先への開示リスク。指示があれば速やかに中止する旨を確約。プラットフォームではIM送付可否を都度確認。外為法の3通りに留意<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>IMの送付（p.60）<\/td>\n<td>送付先に応じ<strong>カスタマイズ<\/strong>。<strong>候補先名の透かし<\/strong>を入れることが望ましい。適時フォローアップ<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>IMの分析（譲り受け側）（p.61）<\/td>\n<td>シナジー検証、根源的な強みの分析。売上集中先は<strong>COC条項<\/strong>の有無を確認。疑義はDD調査事項として整理。確認点＝事業構造・組織図、財務情報（粉飾・簿外債務）、事業計画。仲介者は確定的バリュエーション等を実施できない<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>選定方針の検討、プロセスレター（p.62）<\/td>\n<td>プロセスレター＝入札の進め方・スケジュール等の書面。小規模では作成されないことも多い。<strong>等しく提供<\/strong>。比較支援＝①回答日を定める②記載内容を統一③比較表に整理<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>初回トップ面談の事前準備（p.63-64）<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>着手金や中間金を得ることだけを目的に不必要に複数先とトップ面談を実施してはならない<\/strong>。心理的に引き返しにくくなるので数・順番を考慮。形式的質疑は事前に。初回は<strong>金額交渉等は行わず相互理解の場<\/strong>（詳細な条件交渉はディールブレイクリスク）。受けた質問・回答は<strong>全て依頼者へ開示<\/strong><\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>トップ面談の実施（p.65-66）<\/td>\n<td>自社紹介・質疑応答・店舗工場見学等。誠意ある態度。回数より<strong>納得感が重要<\/strong>。PMIを見据え経営の方向性の差異把握を促す。意思決定者の同席。<strong>支援者が議事録を作成<\/strong>。訪問は従業員に不審に思われないよう検討。見送った先には丁寧に説明。虚偽情報を提供しない。中立的な場所での面談<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.51-66）<\/p>\n<ul>\n<li>用語：ネームクリアは実務で「ロングリストを確認してもらいショートリスト化すること」を指す場合もあり、関係者で擦り合わせが必要。（SM p.59）<\/li>\n<\/ul>\n<h3 id=\"n2-26\">SM「基本合意の調整・締結」<\/h3>\n<p>目的：DDや最終条件交渉を円滑に進める基本条件の合意形成。業務：意向表明書の作成・送付→調整→基本合意書の作成・確認・締結。（SM p.68）<\/p>\n<h4>全般に関わる事項（SM p.69-70）<\/h4>\n<ul>\n<li>基本合意は<strong>DD及び最終契約の土台<\/strong>。可能な限り具体的・明確に検討。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>基本合意は<strong>必ず締結されるものではなく<\/strong>、意向表明書への<strong>応諾書<\/strong>でほぼ同様の合意と扱うこともある。案件ごとに検討。<\/li>\n<li>開示資料の精度は不十分なことが多いため、譲り受け側との関係で適切に<strong>留保<\/strong>する。<\/li>\n<li>依頼者の希望に沿わない形で<strong>支援者側の都合で安易に成約に向けた調整を実施してはならない<\/strong>。<strong>非弁行為<\/strong>回避のため意思決定に関与しない。<\/li>\n<li>独占交渉権の付与・基本合意で、譲り渡し側は新たな探索が難しくなる。トップ面談等も踏まえ取引の確度を判断。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>法的拘束力なしの内容に加え、<strong>法的拘束力を認める内容（秘密保持、独占交渉権の付与等）<\/strong>が含まれる。<\/li>\n<li>独占交渉権は譲り受け側のDDコストが相応の場合に必要なことが多い。付与とその期間は<strong>支援者の都合ではなく当事者の意思<\/strong>で決定。<\/li>\n<li>基本合意・独占交渉権の検討要素（5つ）：①意向表明書の内容（応諾書形式も）②候補先の数③譲り受け側のDD負担④譲り渡し側の希望⑤スケジュール。<\/li>\n<li><strong>独占禁止法<\/strong>：一定規模以上の企業結合は<strong>事前届出が義務付け<\/strong>。スケジュールに影響。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>譲り受け側が上場企業なら基本合意時に<strong>適時開示<\/strong>が必要な場合。未公開のM&amp;Aは<strong>インサイダー取引規制の「重要事実」<\/strong>となり得るが、適時開示で規制対象から除外される。<\/li>\n<li>仲介者は<strong>中立性・公平性<\/strong>をもって双方の利益の実現を図る。<\/li>\n<li>スキル：基本合意書のうち<strong>法的拘束力を持つ条項と持たない条項を明確に区分<\/strong>できる。（SM p.69-70）<\/li>\n<\/ul>\n<h4>基本合意の全7項目<\/h4>\n<ol>\n<li><strong>意向表明書の作成・送付を支援（譲り受け側が送付）<\/strong>（SM p.71）\n   - <span class=\"star\" aria-label=\"頻出\">★<\/span><strong>作成は譲り受け側が行うべき<\/strong>で、支援者は過度に介入しない。①<strong>法的拘束力がない<\/strong>こと、②<strong>後続の調査・調整で変更の可能性<\/strong>があることを明記。\n   - 紹介から<strong>概ね2か月前後が目安<\/strong>で提出されるのが通常。\n   - 候補が1社のみでも、<strong>提出前にその旨を当該候補へ伝えるべきでない<\/strong>（例外：譲り渡し側の意向を確認の上で伝えることもあり得る）。\n   - 記載事項：候補者概要／M&amp;A後経営戦略／想定スキーム／希望譲渡額・算定前提／DD項目／資金調達／クロージングスケジュール等。<\/li>\n<li><strong>意向表明書の確認・比較検討を支援（譲り渡し側）<\/strong>（SM p.72）\n   - 複数受領時は項目ごとに整理し、単独か複数かの方針検討を支援。複数並行は<strong>DD受入体制と事務コスト・期間<\/strong>が必要。\n   - 論点：目的／スキーム／希望譲渡額／資金調達方法／スケジュール／有効期限／M&amp;A後の経営方針／従業員・役員の処遇。<\/li>\n<li><strong>交渉／調整すべき事項の整理<\/strong>（SM p.73）\n   - 明確化しない事項はDD結果等で<strong>柔軟に対応できる余地を残す<\/strong>。譲り受け側の<strong>稟議<\/strong>で覆らないよう意思決定者への事前説明を助言。\n   - 論点：譲渡額／資金調達／経営者・従業員の処遇／経営者保証／役員構成／リスク事項（株式の状況・変遷、法令違反・訴訟、COC条項）。<\/li>\n<li><strong>基本合意形成に向けた交渉／調整<\/strong>（SM p.74）\n   - <span class=\"star\" aria-label=\"頻出\">★<\/span>オファー・カウンターオファーは<strong>すべて依頼者に開示<\/strong>。仲介者は<strong>FAと異なり一方に有利となる交渉の支援はできない<\/strong>。\n   - 譲れない点と妥協可能な点を整理。クロージング後決済等のリスクが含まれる場合、依頼者が納得しないまま<strong>無理やりに案件を推進させてはならない<\/strong>。\n   - DD日程・最終契約・クロージング時期を合意。ただしスケジュールは<strong>目安で法的拘束力なし<\/strong>と伝える。<\/li>\n<li><strong>基本合意書の作成<\/strong>（SM p.75-76）\n   - 網羅的・具体的・明確に記載。法的拘束力の範囲を明確化。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>譲渡額は暫定的<\/strong>で変動すると説明。作成・アドバイスは非弁行為に注意。\n   - 記載事項：取引条件（スキーム、譲渡額、処遇、<strong>クロージング条項<\/strong>、スケジュール）／権利義務（秘密保持、経営者保証解除、DD協力義務、独占交渉権とその期間、違約金、善管注意義務、企業価値を毀損する行為の禁止）／その他（有効期限、法的拘束力の範囲、準拠法・合意管轄、誠実交渉義務）。<\/li>\n<li><strong>譲り渡し側・譲り受け側への説明・確認<\/strong>（SM p.77）\n   - リスク事項の把握と対応策。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>譲渡額は僅かな差でもブレイクにつながり得る<\/strong>ため忠実に調整。\n   - 独占交渉権付与を拒絶する場合は譲り受け側に<strong>明確に理由を説明<\/strong>。\n   - キーマンへの説明はオーナーと十分協議し、必要に応じ秘密保持の誓約書を取得。説明事項＝背景・目的、変わること・変わらないこと、個別開示の理由、開示範囲。<\/li>\n<li><strong>基本合意の締結<\/strong>（SM p.77）\n   - 上場企業は適時開示の該当性と<strong>東証への事前相談<\/strong>等を合意。\n   - 適切な代表権・組織的決裁を確認。<strong>実印での押印<\/strong>が望ましい。\n   - 少数株主を押印者から除外すると争いとなり、<strong>スクイーズアウト<\/strong>を要する可能性。\n   - 知識：署名捕印、製本、修正方法（差し替え、訂正印）、印鑑証明、謄本。<\/li>\n<\/ol>\n<p>（SM p.68-77）→ 基本合意書の法的効力は法務タブ参照。<\/p>\n<h2 id=\"n2-27\">DD（デュー・ディリジェンス）の全体像とビジネスDD・その他DD<\/h2>\n<p>DDは主に譲り受け側がFAや士業等専門家を使って譲り渡し側の実態を調べる工程で、どの調査を行うかは譲り受け側の意向に従う。予算が限られても対象を絞って実施することが望ましく、仲介者はDDを自ら実施すべきでない。<\/p>\n<h3 id=\"n2-28\">GL：DDの位置づけ（GL p.47-48）<\/h3>\n<ul>\n<li>対象：譲り渡し側の<strong>財務・法務・ビジネス（事業）・税務<\/strong>等。目的：譲渡対価の精査、判明した実態を踏まえた事業改善等。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>どの調査を実施するかは譲り受け側の意向に従う<\/strong>。（GL p.47）<\/li>\n<li>社内に非開示の場合は、悟られずに実施する工夫が必要。双方ともFAや士業等専門家の<strong>指示を守ることが重要<\/strong>。（GL p.47）<\/li>\n<li>密度は様々。本格的DDを行わず、<strong>数年分の税務申告書の確認と経営者へのヒアリング等だけ<\/strong>で終える例もある。（GL p.47）<\/li>\n<li>意義：譲り受け側＝実行可否の検討と最終契約の条件（譲渡額、表明保証、補償等）の調整で<strong>成立後のトラブルを防止<\/strong>、PMIに有益な情報を取得。譲り渡し側＝調査が不十分だと最終契約で負う義務（表明保証の範囲、補償額・期間等）の<strong>負担増加<\/strong>に繋がりうる。（GL p.47-48）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>予算制約があっても<strong>検討対象を絞るなどの工夫をして、実施する調査の内容を検討することが望ましい<\/strong>。（GL p.48）<\/li>\n<li>DDの種類（用語集）：財務DD、法務DDのほか、ビジネス（事業）DD、税務DD（財務DDに一部含むことあり）、人事労務DD（法務DDに一部含むことあり）、知財DD、環境DD、不動産DD、ITDD。（GL p.21）<\/li>\n<\/ul>\n<h3 id=\"n2-29\">SM：DD全般に関わる事項（SM p.79-81）<\/h3>\n<p>目的：M&amp;Aの実行可否や譲渡額、その他最終契約の内容を検討し、PMIに向けた課題を整理する。（SM p.79）<\/p>\n<ul>\n<li>DDの密度は様々。SMのプロセス順序は<strong>あくまで一例<\/strong>で、前後・並行も可。<\/li>\n<li>進め方（コミュニケーション方法、質問受付方法、スケジュール）を双方が理解。スケジュール・水準・トラブルをマネジメント。<\/li>\n<li>従業員等への<strong>情報漏洩防止<\/strong>の体制・ルール設定。譲り渡し側の疲弊に配慮し<strong>心情面のケア<\/strong>も。<\/li>\n<li>仲介者・譲り渡し側FAは、DD結果を譲り渡し側にも可能な限り開示するよう譲り受け側に<strong>働き掛けることが望ましい<\/strong>。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>仲介者はDDを自ら実施すべきでない<\/strong>。<strong>DD報告書の結論を決定すべきでない<\/strong>。<\/li>\n<li>FAが自ら実施する場合は、弁護士資格が必要な報告やDD結果を最終契約へ反映する等の意思決定を行わぬよう留意。<\/li>\n<li>DDの判明事項はPMIへ活用される。キーマンの協力確保、事業の現状・課題の把握。<\/li>\n<li>DD実施機関との契約締結支援は<strong>非弁行為<\/strong>リスク。<strong>弁護士あっせんで手数料を受領する行為や、弁護士の指定は非弁提携<\/strong>に該当しうる。<\/li>\n<li>負担が大きい工程：資料準備、マネジメントインタビュー対応、現場視察（店舗・工場見学）。<\/li>\n<\/ul>\n<p>（SM p.80-81）→ 規範面は倫理タブ参照。<\/p>\n<h3 id=\"n2-30\">SM：DDの全11項目（手順）<\/h3>\n<p>大項目はDD方針の決定→DDの体制構築→調査実施前の準備→調査の実施。（SM p.79）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>項目（SM頁）<\/th>\n<th>手順・ポイント<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>実施するDDの種類の検討（p.82）<\/td>\n<td>DDは双方に重要と説明。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>DDを行わずに実施し損害が生じた場合、取締役の善管注意義務違反<\/strong>が問題となりうる。目的・重要性・状況・時間的制約・物理的制約で検討し、<strong>不十分又は過剰な DDとならないよう<\/strong>助言。仲介者の場合、<strong>最終決定は譲り受け側自らが実施する必要<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>スケジュールの策定（p.82）<\/td>\n<td>工数を見積もり策定。現地調査は早期調整。基本合意の最終契約時期の目途を考慮。DD後に最終契約の<strong>交渉期間が必要<\/strong><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>個別DDの実施範囲の検討・確定（p.83）<\/td>\n<td>目的・範囲・手続・報告方法を<strong>明示的に合意<\/strong>。海外子会社等は費用とリスクで判断。DD実施機関の独断で範囲を狭め重大リスクを見逃すと損害賠償請求の場合も。観点＝事業領域の広さ・粒度、分析手法、重要性、業界特有論点、正常収益力<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>個別DDの実施機関の選定（p.84）<\/td>\n<td><strong>PMI支援が受けられるか<\/strong>もポイント。<span class=\"star\" aria-label=\"頻出\">★<\/span>仲介者は選定を<strong>譲り受け側が自ら実施するのが原則<\/strong>、希望がない限り<strong>紹介すべきでない<\/strong>。紹介時も<strong>複数の選択肢を提示<\/strong>。機関＝会計・税務（会計士、税理士）、法務（弁護士）、ビジネス（診断士、コンサル）、人事労務（弁護士、社労士、コンサル）、IT・環境（コンサル）<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>DDチームの構築（譲り渡し側）（p.85）<\/td>\n<td>キーマンの範囲は経営者と相談。<strong>一元化された窓口<\/strong>を設置。担当者の社内会話が流出源になりうるため秘密保持を説明。メンバー＝財務経理責任者、営業責任者、M&amp;A経験のある専門家<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>DDチームの構築（譲り受け側）（p.85）<\/td>\n<td>窓口と事業部責任者。PMIを見据え経理・法務・人事からもアサインが望ましい。メンバーを他業務から解放する配慮<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>データルームの設置（p.86）<\/td>\n<td>物理的又は<strong>VDR<\/strong>（併用可）。物理的が多い場合＝①資料が多い・老朽化②持ち運び困難③事務所が近い④現場把握が必要⑤対面実施が必要（IT・環境DD等）。VDRはアクセス権限を確保。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>クロージング後に閉鎖<\/strong>するが、表明保証違反時に備えデータ保存・バックアップを可能に。ルール例＝利用時間制限、受付締切、入室の事前届出<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>情報連携のための前準備（p.86）<\/td>\n<td>DD実施機関間の情報連携には<strong>相互情報開示手続（リリースレターへのサイン等）<\/strong>が必要な場合。時間がかかるので早めに調整<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>依頼資料リストの作成・依頼（p.87）<\/td>\n<td>初期資料で分かるものは依頼しない。謙虚な姿勢。<strong>初回リストは顔合わせ前の早期に送付<\/strong>。小規模企業は帳簿・規程の整備を早めに促す。重複依頼を排除。<span class=\"star\" aria-label=\"頻出\">★<\/span>仲介者・譲り渡し側FAがいる案件では<strong>DD実施機関と譲り渡し側の直接やり取りは原則禁止<\/strong>が通例。資料名・対象年度・形式・原本閲覧要否を明記<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>開示情報の確認・Q&amp;Aシートの作成（p.88）<\/td>\n<td>質問の趣旨を分かりやすく記載。意図・目的を補足し、回答内容の確認・助言<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>マネジメントインタビュー（p.88）<\/td>\n<td>リーダーシップ、経営能力、人柄、ビジョン、コミットを確認。タイムスケジュール・質問票を<strong>事前送付<\/strong>。確認内容＝強み・弱み、経緯・歴史、課題、方向性<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.82-88）<\/p>\n<h3 id=\"n2-31\">財務・税務DDと法務DD<\/h3>\n<p>→ 財務・税務DD（SM p.102-113）は財務・税務タブ、法務DD（SM p.114-125）は法務タブ参照。<\/p>\n<h3 id=\"n2-32\">ビジネスDD（SM p.93-101）<\/h3>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>定義：譲り受け側が将来性や<strong>買収によるシナジー効果<\/strong>を分析するため、ビジネスモデルを整理し競争力・競争優位性・収益の源泉を調査・検証するもの。（SM p.93）<\/li>\n<li>全般：個別調査前に事業構造の全体像を把握（例：製造中心なら製造プロセス中心、収益影響大の取引先を重点）。結果はPMI実施者と共有。譲り受け側の事業責任者等の参画が重要。（SM p.93）<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>主な内容・ポイント<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>①事業計画の検証（p.94）<\/td>\n<td>3観点＝いつ・誰が・どういう状況で作成したか。譲渡対価が大きい／成立後の関与が低いと<strong>強気<\/strong>、MBOでは<strong>過度に保守的<\/strong>になる傾向。DCF法は事業計画に基づくため慎重に精査。複数あれば取締役会承認の有無等で選択。なければ作成し検証<\/td>\n<\/tr>\n<tr>\n<td>②市場・業界環境分析（p.95）<\/td>\n<td>市場定義（セグメンテーション）、市場規模算出、顧客属性。<strong>PEST分析<\/strong>（政治・経済・社会・技術）。市場定義で規模は大きく変動。規制の撤廃・強化の影響に留意<\/td>\n<\/tr>\n<tr>\n<td>③顧客・事業別分析（p.96-97）<\/td>\n<td>売上の因数分解（単価×数量）、規模・成長性、優先順位。営業利益率＝営業利益／売上高、粗利率＝粗利／売上高。複数指標で分析。特定顧客への<strong>収益集中<\/strong>は大きなリスク<\/td>\n<\/tr>\n<tr>\n<td>④競争環境分析（p.98）<\/td>\n<td>市場シェア、既存・潜在的競合、事業経済性。<strong>ファイブフォース<\/strong>（新規参入の脅威、業界内の競合、売り手の交渉力、買い手の交渉力、代替品の脅威）、<strong>KSF<\/strong>。参入障壁が高ければ競合の影響は小さい<\/td>\n<\/tr>\n<tr>\n<td>⑤自社分析（p.99）<\/td>\n<td><strong>バリューチェーン<\/strong>（主活動＝開発→調達→製造→出荷→マーケティング・販売→サービス、支援活動）と<strong>SWOT分析<\/strong>。機能分解は同業他社と同じ粒度で<\/td>\n<\/tr>\n<tr>\n<td>⑥シナジーの抽出・検証（p.100）<\/td>\n<td>売上シナジー（クロスセル、販売チャネル拡大、高付加価値化、新製品開発）・コストシナジー（原価＝現場改善・共同調達等、販管費＝広告見直し・共同配送・管理機能集約等）。<span class=\"star\" aria-label=\"頻出\">★<\/span>効果が大きくてもM&amp;A直後に拙速に進めず、<strong>まず従業員等との信頼関係構築<\/strong>が必要<\/td>\n<\/tr>\n<tr>\n<td>⑦事業計画の修正の検討（p.101）<\/td>\n<td>PL：売上＝市場規模×シェア等、原価＝売上×原価率等、販管費＝変動費＋固定費。BS：運転資本を回転日数（<strong>過去3年程度の平均<\/strong>）で予測。定量化可能でインパクト大は計画へ反映、定量化できないものは表明保証等で調整。プラスの検出事項も反映検討<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.94-101）<\/p>\n<h3 id=\"n2-33\">その他DD（SM p.126-131）<\/h3>\n<ul>\n<li>全般：事業計画やバリュエーションへ影響する情報は各DD間で適宜連携。（SM p.126）<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>DD<\/th>\n<th>目的<\/th>\n<th>主な調査内容・ポイント<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>IT DD（p.127）<\/td>\n<td>ITリスクの確認・検証<\/td>\n<td>システムの構造・状態（<strong>EOL<\/strong>を迎えるインフラ、法定セキュリティ要件）、投資（メンテ・新規・統合）、運用組織（外部委託、IT人材）。PMIを見据え統合方針。カーブアウトでは<strong>スタンドアローン・コスト<\/strong>を考慮<\/td>\n<\/tr>\n<tr>\n<td>人事DD（p.128）<\/td>\n<td>組織構造・人事制度変更の必要性把握、労務トラブルの排除<\/td>\n<td>人件費（報酬・給与体系、退職金、割増退職金）、経営陣・従業員、採用基準、教育。機微な個人情報に配慮。親会社からの<strong>出向者<\/strong>の把握<\/td>\n<\/tr>\n<tr>\n<td>環境DD（p.129-130）<\/td>\n<td>環境リスクを可視化し企業価値を正しく判断<\/td>\n<td>土壌汚染対策法・水質汚濁防止法・大気汚染防止法等、原状回復コスト、国際条約8項目（生物多様性条約、ワシントン条約、水俣条約、ストックホルム条約（PoPs）、ロッテルダム条約（PIC）、ウィーン条約・モントリオール議定書、バーゼル条約、パリ協定1.5℃）。優先順位指標＝規模・範囲・是正不能性。既存取引先も範囲に。欧州中心にバリューチェーン全体での義務化の検討が活発<\/td>\n<\/tr>\n<tr>\n<td>不動産DD（p.131）<\/td>\n<td>不動産の経済的価値・リスクの精査<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>経済的・法的・物理的の3観点<\/strong>。経済的＝公示価格・基準地価・相続税路線価・固定資産税路線価から実勢価格。法的＝権利関係、境界、建築基準法の<strong>既存不適格<\/strong>、消防法違反。物理的＝築年数、劣化、アスベスト・PCB・フロン、土壌汚染、災害リスク<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.127-131）<\/p>\n<h2 id=\"n2-34\">最終契約とクロージング<\/h2>\n<p>最終契約はDDで発見された点や基本合意で留保した事項を再交渉して締結するもので、譲渡対価は通常クロージングで初めて支払われる。中小M&amp;Aは最終契約の締結で全て完了するものではなく、トラブルリスク7項目は慎重に検討しなければならない。<\/p>\n<h3 id=\"n2-35\">GL：最終契約の交渉・締結（GL p.48-49）<\/h3>\n<ul>\n<li>仲介者・FAや士業等専門家のアドバイスで網羅性を最終確認して調印。不安があれば<strong>調印前に<\/strong>セカンド・オピニオンも<strong>有効<\/strong>。盛り込む内容は<strong>早い段階から<\/strong>伝える。（GL p.48）<\/li>\n<li>実務では株式譲渡か事業譲渡が多い。全部譲渡は必須でなく一部譲渡もある。（GL p.48）<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>株式譲渡<\/th>\n<th>事業譲渡<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>内容<\/td>\n<td>株主（多くは経営者）が株式を譲渡<\/td>\n<td>譲り渡し側が自社の事業を譲渡<\/td>\n<\/tr>\n<tr>\n<td>手続<\/td>\n<td>比較的シンプル<\/td>\n<td>承継対象財産の特定、<strong>対抗要件具備<\/strong>（不動産登記等）、<strong>許認可の取得<\/strong>等が必要<\/td>\n<\/tr>\n<tr>\n<td>リスク<\/td>\n<td><strong>法人格に変動がない<\/strong>ため簿外債務（未払残業代等）・偶発債務（紛争の損害賠償等）リスクが高くなりやすく、より詳細なDDの傾向<\/td>\n<td>承継対象を選択でき、簿外・偶発債務リスクを比較的<strong>遮断しやすい<\/strong><\/td>\n<\/tr>\n<tr>\n<td>契約書サンプル<\/td>\n<td>参考資料7(4)<\/td>\n<td>参考資料7(5)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.48-49）<\/p>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>個人事業主の中小M&amp;Aは<strong>事業譲渡（営業譲渡）<\/strong>が通常。（GL p.49）<\/li>\n<\/ul>\n<h4>最終契約の主要契約事項（11項目、株式譲渡・事業譲渡共通）<\/h4>\n<ol>\n<li>譲渡対象（何を譲渡するか）<\/li>\n<li>譲渡時期（いつ譲渡するか）<\/li>\n<li>譲渡対価（代金をいくらにするか）<\/li>\n<li>支払時期・方法<\/li>\n<li>経営者・役職員の処遇（引継ぎ期間、雇用継続の努力義務等）<\/li>\n<li>経営者保証の扱い（解除・引継ぎ義務、なされなかった場合の解除・補償等）<\/li>\n<li>表明保証条項<\/li>\n<li>補償条項（いつまで、どの程度）<\/li>\n<li>クロージングの前提条件<\/li>\n<li>競業避止義務<\/li>\n<li>契約の解除事由　等<\/li>\n<\/ol>\n<p>（GL p.49）<\/p>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>譲渡対価は<strong>クロージングを迎えて初めて支払われる<\/strong>のが通常。公表まで秘密保持を貫く必要。<strong>中小M&amp;Aは最終契約締結によって全て完了するものではない<\/strong>。（GL p.49）<\/li>\n<li>当事者が<strong>自らでも十分に確認することが重要<\/strong>。下記①〜⑦はトラブルリスクがあるため<strong>慎重に検討しなければならない<\/strong>。（GL p.49-50）<\/li>\n<li>仲介者・FAの限界：①役務提供は基本的に<strong>クロージング時点で終了<\/strong>、②紛争解決への関与は<strong>非弁行為（弁護士法第72条）<\/strong>の可能性。紛争時は<strong>弁護士に支援を求めることを検討する必要がある<\/strong>。（GL p.50）<\/li>\n<\/ul>\n<h3 id=\"n2-36\">GL：最終契約のトラブルリスク7項目（GL p.50-56）<\/h3>\n<h4>① 譲り渡し側の経営者保証の扱い（GL p.50-52）<\/h4>\n<ul>\n<li>扱いを<strong>慎重に検討する必要がある<\/strong>。<\/li>\n<li>ア M&amp;A前の解除：経営者保証GLの3点（ⅰ法人と経営者の区分・分離　ⅱ財務基盤強化　ⅲ財務把握・適時適切な開示）を実施し解除を相談。<strong>中小企業活性化協議会<\/strong>への相談も有用。<\/li>\n<li>イ 譲り受け側への移行・解除：特則は前経営者の株式保有・代表権・実質的支配権等を勘案し<strong>保証の必要性を慎重に検討することが必要<\/strong>。解除・移行は<strong>最終的には金融機関等の判断<\/strong>で、<strong>クロージングを経て登記簿上の代表者変更後<\/strong>に行う必要。<\/li>\n<li>確実に解除・移行する対応3つ：\n  1. 士業等専門家（特に弁護士）やセンターへの相談。\n  2. 金融機関等への事前相談（譲り受け側とともに、<strong>秘密保持契約を締結の上で相談することが望ましい<\/strong>）。相談先は<strong>秘密保持条項の対象から除外することが求められる<\/strong>。譲り受け側は<strong>実施を拒むべきではなく<\/strong>、誠実に対応することが<strong>求められる<\/strong>。\n  3. 最終契約で明確に位置付けることを<strong>検討すべき<\/strong>。譲り受け側の<strong>義務<\/strong>とし、①<strong>クロージング条件<\/strong>として設定、②解除条項・補償条項等を盛り込む。条件例：(a)金融機関から<strong>組織的な意向表明<\/strong>を取得、(b)必要書面の提出と<strong>代表者の変更登記書類<\/strong>の作成。万全を期すなら<strong>クロージング日に変更登記と解除・移行手続を同時に実施<\/strong>。<\/li>\n<li>確実な手段：クロージング時に保証対象債務を譲り受け側の資力で返済し、別途借り換える方法。（GL p.52）<\/li>\n<\/ul>\n<h4>② DDの非実施（GL p.52）<\/h4>\n<ul>\n<li>経営者ヒアリングのみでのリスク評価には限界。不十分だと譲り渡し側の表明保証・補償の負担増加に。<\/li>\n<\/ul>\n<h4>③ 表明保証の内容（GL p.52-53）<\/h4>\n<ul>\n<li><strong>期間や責任上限がない<\/strong>、<strong>適用場面が一義的でない<\/strong>と過大な責任のリスク。関係が悪化した際（収益未達、DD未検出問題の顕在化）に紛争化しやすい。<\/li>\n<li>DD結果を踏まえ認識を擦り合わせることが<strong>重要<\/strong>。譲り渡し側は求める理由の確認と議論が<strong>望ましい<\/strong>。<span class=\"star\" aria-label=\"頻出\">★<\/span>定型的な<strong>無期限・無制限の表明保証条項は慎重に検討すべき<\/strong>。表明保証保険の活用も考えられる。<\/li>\n<\/ul>\n<h4>④ クロージング後の支払・手続（GL p.53-54）<\/h4>\n<p>支払・手続は<strong>クロージング時に実行することが基本<\/strong>。後になる場合は決済遅滞・解釈相違で争いのリスクがあり、慎重な検討が求められる。<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>手法<\/th>\n<th>内容・活用場面<\/th>\n<th>リスク<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ア 譲渡対価の分割払い<\/td>\n<td>譲り受け側の資金不足時<\/td>\n<td>不履行リスク。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>支払期間が長期にわたる場合は特に高い<\/strong><\/td>\n<\/tr>\n<tr>\n<td>イ 役員退職慰労金の後払い<\/td>\n<td>経営者・役員が引継ぎで残留する際のインセンティブ<\/td>\n<td>不履行リスク<\/td>\n<\/tr>\n<tr>\n<td>ウ 株式の段階的取得<\/td>\n<td>ノウハウ引継ぎのため段階的に経営権を移転<\/td>\n<td>意向が変化し不履行となるリスク<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.53-54）<\/p>\n<h4>⑤ 最終契約後の状況に応じた支払の変動（GL p.54-55）<\/h4>\n<p>設ける場合は発生条件・方法の妥当性を確認し、<strong>明確かつ詳細な内容とする必要がある<\/strong>。<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条項<\/th>\n<th>内容<\/th>\n<th>留意点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ア アーンアウト条項<\/td>\n<td>クロージング後の一定期間（<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>3年以内が多い<\/strong>）に財務・非財務目標の達成で<strong>追加対価<\/strong>を支払う。ベンチャー企業で多い<\/td>\n<td>DD・調整を十分に実施した上で具体的リスクに対応して<strong>設定されるべき<\/strong>。バリュエーション差を埋める目的で設けるかは<strong>慎重に検討すべき<\/strong><\/td>\n<\/tr>\n<tr>\n<td>イ 株価調整条項<\/td>\n<td>最終契約〜クロージングの企業価値変動で譲渡額を調整<\/td>\n<td>中小M&amp;Aはその期間が<strong>短いことが多い<\/strong>ため<strong>慎重に検討すべき<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ウ 支払金の返還に関する条項<\/td>\n<td>過年度決算修正等で<strong>譲り渡し側から譲り受け側に払戻し<\/strong><\/td>\n<td>発動事象が曖昧だと争いに<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.54-55）<\/p>\n<h4>⑥ 経営者に関連する資産・負債等の整理（GL p.55）<\/h4>\n<ul>\n<li>BS外の経営者個人資産で事業に使用（個人名義の土地等）→<strong>譲り受け側に売却又は引継ぎ<\/strong>。<\/li>\n<li>BS上だが個人用（自家用車等）→<strong>会社から経営者個人に売却<\/strong>。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>可能な限り最終契約前に整理することが望ましい<\/strong>。残る場合も対象資産を特定し、移転方法・譲渡額を契約に明記することが<strong>重要<\/strong>。<\/li>\n<\/ul>\n<h4>⑦ 最終契約からクロージングまでの期間（GL p.55-56）<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>2ヶ月以上<\/strong>等の期間が<strong>特段の事情なく<\/strong>設けられると、業績等の変化で<strong>最終契約の修正が必要となるリスク<\/strong>や<strong>不履行のリスク<\/strong>がある。<\/li>\n<\/ul>\n<h3 id=\"n2-37\">GL：クロージング（GL p.56）<\/h3>\n<ul>\n<li>株式等の譲渡と譲渡対価の支払。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>譲渡対価の全部又は一部が確実に入金されたことを確認することが必要<\/strong>。<\/li>\n<li>事業譲渡で不動産が含まれる場合、クロージング後<strong>速やかに登記手続<\/strong>を行う必要があるため、<strong>登記必要書類を授受<\/strong>するのが通常。司法書士等と日程調整。<\/li>\n<li>担保解除（抹消登記）は取引金融機関との事前調整が必要なことがある。（GL p.56）<\/li>\n<\/ul>\n<h3 id=\"n2-38\">SM：最終契約の調整・締結（SM p.135-151）<\/h3>\n<p>目的：クロージングに向け条件を明確にし、合意に法的拘束力を内包させる。（SM p.135）<\/p>\n<h4>全般に関わる事項（SM p.136-137）<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>成立のための妥協前提ではなく、依頼者の意向に沿って交渉し結果を忠実に契約へ落とし込む。双方が弁護士の助言を得て調整することが望ましい。<\/li>\n<li>支援者が法的拘束力を有する最終契約書を作成すると<strong>非弁行為<\/strong>の可能性。<strong>草案提示に留め<\/strong>、完成版は当事者同士で作成。<\/li>\n<li>履行可能性のない条件はトラブルの元。依頼者の利益に反し支援者の利益（成功報酬等）を優先する行為は<strong>決して行ってはならない<\/strong>。<\/li>\n<li><strong>完全合意条項<\/strong>を設ける場合、書面外・口頭の合意は担保されないため重要事項は全て記載。<\/li>\n<li>少数株主の同意は必要に応じ事前調整。融資で買収する場合は締結前に金融機関に調達可否を確認。<\/li>\n<li>知識：金融機関の融資審査の着眼点（事業会社＝企業概要、財務健全性、契約調整状況、DD結果、保全。PEファンド＝DD結果、投資実績、LBO比率、有利子負債/EBITDA倍率）。<\/li>\n<\/ul>\n<h4>リスクの抽出・評価、対応方針（SM p.138）<\/h4>\n<ul>\n<li>対応の選択肢：最終契約前の治癒／譲渡額への反映／表明保証／クロージング条件／クロージング後の誓約事項（コベナンツ）。<\/li>\n<li>許容できず治癒も難しければそもそも実施すべきか慎重に検討。含み益・簿外資産等の<strong>ポジティブな事項<\/strong>も反映されるよう調整。<\/li>\n<\/ul>\n<h4>リスク対応の7方向（SM p.139-141）<\/h4>\n<ol>\n<li>リスクをそのまま受け入れる<\/li>\n<li>買収価格を調整する（時価純資産法＝含み損益・簿外債務、DCF法・マルチプル法＝正常収益力を反映）<\/li>\n<li>買収スキームを変更する（対象資産の限定、簿外債務が懸念されれば株式譲渡から事業譲渡へ）<\/li>\n<li>クロージングまでに譲り渡し側に解消させる（前提条件化）<\/li>\n<li>発現時に譲り渡し側にコスト負担させる（表明保証・補償、<strong>エスクロー<\/strong>＝第三者への預託で手数料が発生）<\/li>\n<li>表明保証保険を活用する（双方加入可。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>クロージング以前に知っていた違反等は免責で付保されない<\/strong>）<\/li>\n<li>買収を断念する<\/li>\n<\/ol>\n<p>（SM p.139-141）<\/p>\n<ul>\n<li>DD後のリスク対応の調整を支援者が行うと非弁行為の可能性があり、基本的に弁護士に相談。<\/li>\n<\/ul>\n<h4>個別論点（SM p.142-147）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>論点<\/th>\n<th>実務の手順・ポイント<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>経営者保証の扱い（p.142）<\/td>\n<td>意向を丁寧に聴取。弁護士・センター・金融機関への事前相談を選択肢として説明。希望されたら<strong>拒むべきではなく<\/strong>、相談先を秘密保持条項から除外。資金繰り悪化時はそもそも実行すべきかも慎重に検討<\/td>\n<\/tr>\n<tr>\n<td>譲渡額（p.143-144）<\/td>\n<td>リスクの定量化可否を検討。価格調整条項は最終契約交渉時に設定し、クロージング数日前のキャッシュで決定。分割払い等は<strong>安易に提案すべきでない<\/strong>、盛り込むなら<strong>エスクローの検討・提案も行うべき<\/strong>。役員退職金の限度額目安＝<strong>最終月額報酬×役員勤続年数×功績倍率<\/strong>。仲介者はリピーターになり得る譲り受け側を優先する構造的利益相反リスクに留意<\/td>\n<\/tr>\n<tr>\n<td>表明保証条項（p.145）<\/td>\n<td>主な事項＝株式関係、税務申告の適正、会社法手続の適法性、所有者であること、開示情報に虚偽がないこと、未開示の偶発債務・訴訟がないこと等。無制限・過大は譲り渡し側の負担過大。譲り受け側のみに弁護士がつく情報格差に配慮。<strong>開示情報を除外する規定がないと補償対象となるリスク<\/strong><\/td>\n<\/tr>\n<tr>\n<td>クロージング条項（p.146）<\/td>\n<td>譲り渡し側＝取締役会承認、キーマン・従業員の継続勤務同意、<strong>MAC条項<\/strong>、COC対応、許認可・契約の移転、株券交付。譲り受け側＝経営者保証解除同意取得、資金調達確認、ファイナンス条項。<span class=\"star\" aria-label=\"頻出\">★<\/span>支援者の都合で前提条件設定を回避する調整は<strong>決してしてはならない<\/strong>。賃貸借のCOCは記載がなくても家主に事前確認<\/td>\n<\/tr>\n<tr>\n<td>クロージング後の誓約事項（p.147）<\/td>\n<td>譲り渡し側＝競業避止、引き抜き禁止、引継ぎ協力、精算等。譲り受け側＝経営者保証解除、雇用継続、本店・社名の取決め等。クロージング後の違反は救済の難易度が高いため実現可能性を確認。信用保証協会が保証していればその同意も必要。正式な移行・解除には通常<strong>役員変更登記<\/strong>が必要<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.142-147）<\/p>\n<h4>ファーストドラフト・調整・締結（SM p.148-151）<\/h4>\n<ol>\n<li><strong>ファーストドラフトの作成支援<\/strong>：記載事項＝譲渡対象、時期、譲渡額、処遇、支払時期・方法、前提条件、表明保証、クロージング前後の義務、解除、補償（10項目）。付随書面＝顧問契約、競業避止誓約書、議事録、<strong>TSA<\/strong>、株主間協定書、辞任届等。最終化は当事者間で（非弁行為）。（SM p.148-149）<\/li>\n<li><strong>最終契約の調整<\/strong>：FAは依頼者の立場、仲介者は中立・公平な立場から助言。弁護士レビューを助言。特に小規模な譲り渡し側は情報格差が生じやすく丁寧に助言。（SM p.150）<\/li>\n<li><strong>最終契約の締結<\/strong>：締結前のリスク説明は改めて<strong>書面で行うことが望ましい<\/strong>。押印方法は各株主個別押印か、委任を受けた経営者の代表押印か（後者は少数株主との齟齬リスク）。付随契約も網羅的に示す。（SM p.151）<\/li>\n<\/ol>\n<p>→ 表明保証・補償・MAC等の法的中身は法務タブ、役員退職金の税務は財務・税務タブ参照。<\/p>\n<h3 id=\"n2-39\">SM：クロージング（SM p.153-166）<\/h3>\n<p>目的：前提条件の充足を確認し、M&amp;A取引を完遂する。大項目は「クロージングに向けた準備」「クロージング実施」。（SM p.153）<\/p>\n<h4>全般に関わる事項（SM p.154-155）<\/h4>\n<ul>\n<li>手続・書類を網羅的に整理し進捗管理。統合方針・行動計画の策定支援も考えられる。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>最終契約を事後変更する<strong>覚書<\/strong>は、最終契約に関与した者が作成<strong>すべき<\/strong>。<\/li>\n<li>連帯保証・経営者保証の解除手続の段取りを事前にスケジューリング。クロージング後の紛争解決への関与には限界（非弁行為）。登記は司法書士等の関与を求める。<\/li>\n<li>条件未達の場合：事前にシナリオを練る（資金調達リスクなら銀行担当者に確認）。未達時は対応策を合意（例：キーマンの同意が得られなければ延期か妥協か）。自然災害等は中止か実行か速やかに判断。<\/li>\n<\/ul>\n<h4>クロージングチェックリストの作成（SM p.156-158）<\/h4>\n<ul>\n<li>手続・書類・重要物品、実施主体、スケジュールを記載。充足判断が難しいものは弁護士と連携。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>譲り渡し側が<strong>株式譲渡制限会社<\/strong>なら、取締役会（非設置なら株主総会）で譲渡の承認が必要。<\/li>\n<\/ul>\n<p>株式譲渡の一般的な流れ：<\/p>\n<ol>\n<li>（前）最終契約書の調印<\/li>\n<li>（前）株主からの譲渡承認請求<\/li>\n<li>（前）取締役会又は株主総会の承認（代表取締役が承認機関の場合も）<\/li>\n<li>（当日）株券の引渡しと売買代金の決済<\/li>\n<li>（当日）株主名簿の書換え<\/li>\n<li>（当日）重要物の授受<\/li>\n<li>（当日）臨時株主総会承認（役員交代・退職慰労金）<\/li>\n<li>（当日）取締役会での代表取締役の選任<\/li>\n<li>（当日）役員変更登記<\/li>\n<\/ol>\n<p>（SM p.156）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>スキーム<\/th>\n<th>クロージング手続の要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>株式譲渡<\/td>\n<td>株式の譲渡と代金支払。譲り渡し側＝株券の確保・株主名簿、他株主の委任状、承認機関の承認、辞任届・退職届、退職金の株主総会決議、COC相手方の承諾書、担保変換準備。譲り受け側＝担保変換、許認可・資格の引継ぎ準備。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>株券発行会社は株券の交付が必要、不発行会社は株主名簿の名義書換えで完了<\/strong>。上場企業は振替法等の手続<\/td>\n<\/tr>\n<tr>\n<td>合併<\/td>\n<td>吸収合併は効力発生日に効力。対価が株式なら存続会社株式を交付。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>効力発生日から2週間以内に登記<\/strong>。新設合併は設立登記が効力発生に必要<\/td>\n<\/tr>\n<tr>\n<td>会社分割<\/td>\n<td>吸収分割は効力発生日に効力、<strong>2週間以内に登記<\/strong>。新設分割は新設会社の設立登記が効力発生に必要<\/td>\n<\/tr>\n<tr>\n<td>事業譲渡<\/td>\n<td>効力発生日を定めても資産譲渡・契約移管には<strong>相手方の同意が必要<\/strong>。株主総会・取締役会決議、賃貸借・リースの貸主の承諾書（借主が変わるため<strong>常に必要<\/strong>）、従業員の退職・新規雇用の承諾、水道光熱等<strong>全契約の切替<\/strong>、許認可準備。譲り受け側の株主総会は簡易譲渡を除く。移転未了分は移転義務か価格調整。対抗要件の具備<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.157-158）<\/p>\n<h4>書類・重要物品の準備、決済方法の確認（SM p.159-163）<\/h4>\n<ul>\n<li>主な書類：取締役会議事録（譲渡承認）、委任状、株式譲渡承認請求書・通知書、株主名簿記載事項書換請求書・証明書、代金の領収書（<strong>収入印紙必要<\/strong>）、株券、辞任届、承諾書。事業譲渡は登記原因証明情報・登記識別情報等。譲り受け側は重要物受領書、印鑑証明、登記簿謄本、新株主名簿、条件充足誓約書等。（SM p.159-161）<\/li>\n<li>重要物品：実印、金庫鍵、印鑑登録カード、銀行印等。登記実務は司法書士に早急に手配。（SM p.159-161）<\/li>\n<li>決済：ネットバンキングの<strong>振込上限額の外し忘れ<\/strong>等を防止。<span class=\"star\" aria-label=\"頻出\">★<\/span>決済日を<strong>日曜や祝日<\/strong>にすると入金確認ができない。（SM p.162）<\/li>\n<li>PMIを見据えた取組：キーマンへの開示・協力要請、取引先対応。取引先への説明は<strong>最も強い関係を持つ譲り渡し側の人物<\/strong>が実施。（SM p.163）<\/li>\n<\/ul>\n<h4>クロージングの前提条件と入金確認（SM p.164-166）<\/h4>\n<ul>\n<li>充足確認は<strong>弁護士立会いの下<\/strong>が望ましい。<span class=\"star\" aria-label=\"頻出\">★<\/span>前日までに<strong>プレクロージング<\/strong>を行い、当日は形式的な書類と金銭の授受に留める。当日に疑義が生じれば覚書や締結し直し。（SM p.164）<\/li>\n<li>クロージング後の支払（分割払い、退職慰労金後払い、段階的取得）は不履行リスク（GLと同旨）。（SM p.165）<\/li>\n<li>充足の確認は<strong>表明保証違反時の補償請求権の放棄を意味しない<\/strong>。譲り渡し側＝迅速な入金確認体制。譲り受け側＝振込予約の事前手配。クロージングまでの一般的対応＝キーマンの継続勤務意思確認、主要取引先の取引継続意思確認、訴訟の解決、組織再編の完了、主要資産の整理。（SM p.166）<\/li>\n<\/ul>\n<h2 id=\"n2-40\">クロージング後（PMI・ポストM&amp;A）<\/h2>\n<p>クロージング後も譲り渡し側経営者は円滑な引継ぎに誠実に対応する必要があり、引継ぎには3か月〜1年程度かかることが多い。M&amp;Aの「成功」は当初の目的の実現で決まるため、成立段階からPMIを見据えることが望ましい。<\/p>\n<h3 id=\"n2-41\">GL：クロージング後の対応（GL p.56-57）<\/h3>\n<ul>\n<li>譲り渡し側経営者はPMIとして<strong>誠実に対応する必要がある<\/strong>（最終契約に協力義務があれば果たす）。（GL p.56）<\/li>\n<li>引継ぎ作業の例：<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>区分<\/th>\n<th>作業例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>共通<\/td>\n<td>①役員・従業員・取引先への報告　②リース・賃貸借・金銭消費貸借契約の名義変更、経営者保証解除、保証人変更（<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>COC条項<\/strong>があれば事前に賃貸人等との協議・交渉が必要なことがある）　③業務フローの引継ぎ・業務管理体制の構築<\/td>\n<\/tr>\n<tr>\n<td>株式譲渡<\/td>\n<td>代表者変更のための株主総会・取締役会や登記手続<\/td>\n<\/tr>\n<tr>\n<td>事業譲渡<\/td>\n<td>売掛金の振込先口座の変更、売掛金・買掛金の清算、給与体系・就業規則等の統一<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.56-57）<\/p>\n<ul>\n<li>譲り受け側の希望に応じ協力することが<strong>望まれる<\/strong>。<span class=\"star\" aria-label=\"頻出\">★<\/span>引継ぎには<strong>3か月〜1年程度<\/strong>を要することが多い。（GL p.57）<\/li>\n<li>経営者保証が円滑に移行しない等のトラブルは、<strong>早急に弁護士への相談を行うことが望ましい<\/strong>。仲介者・FAは役務終了と非弁行為（弁護士法第72条）のため支援に限界。（GL p.57）<\/li>\n<li>「中小PMIガイドライン」「PMI実践ツール」「PMI実践ツール活用ガイドブック」も参照。（GL p.57）<\/li>\n<\/ul>\n<h3 id=\"n2-42\">SM：PMIの全項目（SM p.168-178）<\/h3>\n<p>目的：譲り受けた事業の円滑な継続とさらなる成長。実施主体は<strong>譲り受け側<\/strong>で、PMI支援機関が支援。（SM p.168）<\/p>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>全般：M&amp;Aの「成功」は当初期待した効果を実現できるかによる。「成立（クロージング）」のみを目的とせず、<strong>プロセスの段階からPMIを見据えた検討を開始することが望ましい<\/strong>。（SM p.169）<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>大項目<\/th>\n<th>項目（SM頁）<\/th>\n<th>手順・ポイント<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>（随時）橋渡し<\/td>\n<td>PMI支援機関への橋渡し（p.170）<\/td>\n<td>PMIの重要性を理解し支援を受けられるよう情報提供。求めに応じ、プロセスで取得した情報をPMI支援機関に連携することが<strong>求められる<\/strong><\/td>\n<\/tr>\n<tr>\n<td>経営統合<\/td>\n<td>経営の方針（目的、目標、行動基準等）の言語化（p.171）<\/td>\n<td>成立後<strong>遅滞なく<\/strong>背景・目的・新たな経営の方向性を説明。明確でないと離職率上昇の可能性。新旧の差異を把握し歩み寄りも検討<\/td>\n<\/tr>\n<tr>\n<td>経営統合<\/td>\n<td>関係者への経営の方向性の説明（p.172）<\/td>\n<td>変わる点・変わらない点を明示。<strong>これまでの経営を否定するような発言<\/strong>をしないよう最大限配慮<\/td>\n<\/tr>\n<tr>\n<td>信頼関係の構築<\/td>\n<td>譲り渡し側経営者との継続的コミュニケーション（p.173）<\/td>\n<td>留任時は定期的に対話し役割の遵守を確認。抵抗勢力化を防ぐため、<strong>役割・在籍期間を成立前に概ね合意<\/strong><\/td>\n<\/tr>\n<tr>\n<td>信頼関係の構築<\/td>\n<td>従業員のモチベーション向上施策（p.174-175）<\/td>\n<td>キーパーソンには先行して伝え意見を聞く。<span class=\"star\" aria-label=\"頻出\">★<\/span>成立後遅滞なく（例：<strong>Day1<\/strong>）全従業員に<strong>同時に、等しく、正確に<\/strong>伝える説明会。説明会の事項＝譲り受け側の基本情報、目的、労働条件・給与体系、今後の代表者・勤務場所・商号。個別面談で補完。その他施策＝プレス発表、懇親会、親会社同様の給与・福利厚生、人事制度の弾力運用、刷新感のある施策、自社株式の保有<\/td>\n<\/tr>\n<tr>\n<td>信頼関係の構築<\/td>\n<td>即効性のある就労環境の改善（クイック・ヒット）（p.176）<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>Day.100以内<\/strong>を目途に実行することが望ましい。例＝賃金引上げ、設備・備品整備（トイレ改修、制服新調等）、PC一人1台・個人メール付与、表彰制度。アンケート・面談で不便を把握してから<\/td>\n<\/tr>\n<tr>\n<td>信頼関係の構築<\/td>\n<td>取引先の引継ぎ（p.177）<\/td>\n<td>成立前の事前説明を怠ると取引縮小・停止の可能性。不利な条件を直ちに是正依頼せず「価格交渉ノウハウ・ハンドブック」を参照。最も強い関係の人物の協力を得る。挨拶文＝挨拶、成立日、譲り受け側情報、問合せ先、新役員体制<\/td>\n<\/tr>\n<tr>\n<td>業務統合<\/td>\n<td>事業の詳細把握、改善（p.178）<\/td>\n<td>DDで検知できないこと、属人化、規程・帳簿の不在・乖離に留意。優先度の高い課題（法的リスク・事業停止リスク）は速やかに対応<\/td>\n<\/tr>\n<tr>\n<td>業務統合<\/td>\n<td>統合方針、行動計画の策定（p.178）<\/td>\n<td>シナジーごとに「誰が、いつまでに、何を」を行動計画に。目標と<strong>KPI<\/strong>を設定。結果だけでなく実行状況・顧客の反応も検証。従業員の心情に配慮<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.170-178）<\/p>\n<ul>\n<li>参考図書：中小企業庁『中小PMIガイドライン』『PMI実践ツール活用ガイドブック』。（SM p.179）<\/li>\n<\/ul>\n<h2 id=\"n2-43\">中小M&amp;Aの手法と特徴<\/h2>\n<p>株式譲渡は会社を丸ごと引き継ぐため契約・許認可が原則存続するが簿外・偶発債務も引き継ぐ。事業譲渡は個別移転でリスクを遮断しやすいが、許認可の新規取得や個別同意など手続が煩雑となる。<\/p>\n<h3 id=\"n2-44\">参考資料1：各手法の定義と特徴<\/h3>\n<h4>株式譲渡（参考資料1 p.1）<\/h4>\n<ul>\n<li>定義：譲り渡し側の株主が保有する発行済株式を譲り受け側に譲渡し、譲り渡し側を子会社とする。<\/li>\n<li>メリット：株主が変わるだけで資産・負債・従業員・契約・許認可等は<strong>原則存続<\/strong>。手続は相対的に簡便。<\/li>\n<li>注意：未払残業代等の<strong>簿外債務<\/strong>、損害賠償等の<strong>偶発債務<\/strong>も引き継ぐ。賃貸借契約等に<strong>COC条項<\/strong>があれば事前の協議・交渉が必要になることがある。<\/li>\n<\/ul>\n<h4>事業譲渡（参考資料1 p.1-2）<\/h4>\n<ul>\n<li>定義：事業の全部又は一部（資産・負債に加えノウハウや知的財産権等も含む）を譲渡。<\/li>\n<li>手続：資産・負債・契約・許認可等を<strong>個別に移転<\/strong>。債権者や従業員の同意を一つ一つ取り付け。不動産は登記。<span class=\"star\" aria-label=\"頻出\">★<\/span>許認可等は承継されないことが多く<strong>新規取得<\/strong>が必要。株式譲渡より煩雑。<\/li>\n<li>メリット：<strong>事業の一部を手元に残せる<\/strong>。譲り受け側は簿外・偶発債務リスクを<strong>遮断しやすい<\/strong>。<\/li>\n<\/ul>\n<h4>その他の手法（参考資料1 p.2-3）<\/h4>\n<ul>\n<li><strong>会社分割<\/strong>：会社法の組織再編。権利義務の全部又は一部を他の会社に<strong>包括的に承継<\/strong>。<strong>労働契約承継法<\/strong>で原則雇用確保。許認可が引き継がれる場合も。<span class=\"star\" aria-label=\"頻出\">★<\/span>債権者の異議期間を<strong>1か月以上<\/strong>設ける等の手続で時間・費用。登記が必要で<strong>履歴事項全部証明書<\/strong>に記載。<\/li>\n<li><strong>合併<\/strong>：権利義務の<strong>全部<\/strong>を包括承継し譲り渡し側は<strong>消滅<\/strong>。結合が強い。許認可が引き継がれる場合も。雇用条件調整・事務一本化が必要、簿外・偶発債務に注意。債権者異議期間<strong>1か月以上<\/strong>、登記も必要。<\/li>\n<li><strong>業務提携・資本提携<\/strong>：業務提携＝共同物流・共同調達・共同開発等で、<strong>事業承継に向けた第一歩<\/strong>。資本提携＝株式持ち合い・株式取得・第三者割当増資等。徐々に事業承継を進める場合に活用。<\/li>\n<li><strong>第二会社方式<\/strong>：<strong>債務超過<\/strong>企業が事業譲渡・会社分割で優良事業だけを第二会社に切り出し、残る不採算部門を<strong>特別清算<\/strong>等で整理。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>債権者の同意が必要<\/strong>。<\/li>\n<li>このほか株式交換、株式移転、<strong>令和元年12月11日公布の改正会社法<\/strong>で認められた<strong>株式交付<\/strong>、組合せもありうる。<\/li>\n<\/ul>\n<p>（参考資料1 p.1-3）<\/p>\n<h3 id=\"n2-45\">手法の比較表（参考資料1）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>手法<\/th>\n<th>承継の単位<\/th>\n<th>主なメリット<\/th>\n<th>主なデメリット・留意点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>株式譲渡<\/td>\n<td>会社そのまま（株主変更）<\/td>\n<td>契約・許認可等が原則存続、手続が簡便<\/td>\n<td>簿外・偶発債務を引き継ぐ、COC条項<\/td>\n<\/tr>\n<tr>\n<td>事業譲渡<\/td>\n<td>個別に移転<\/td>\n<td>一部事業を残せる、リスク遮断<\/td>\n<td>個別同意・登記、許認可の新規取得、煩雑<\/td>\n<\/tr>\n<tr>\n<td>会社分割<\/td>\n<td>包括承継（全部又は一部）<\/td>\n<td>雇用確保（労働契約承継法）、許認可が引き継がれる場合あり<\/td>\n<td>債権者保護手続（異議期間1か月以上）、登記<\/td>\n<\/tr>\n<tr>\n<td>合併<\/td>\n<td>包括承継（全部・消滅）<\/td>\n<td>結合が強い<\/td>\n<td>雇用条件調整、簿外・偶発債務、債権者保護手続<\/td>\n<\/tr>\n<tr>\n<td>業務・資本提携<\/td>\n<td>提携<\/td>\n<td>事業承継の第一歩<\/td>\n<td>承継は段階的<\/td>\n<\/tr>\n<tr>\n<td>第二会社方式<\/td>\n<td>優良事業の切出し<\/td>\n<td>債務超過企業の事業存続<\/td>\n<td>債権者の同意が必要、特別清算等<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料1 p.1-3）<\/p>\n<h3 id=\"n2-46\">SM：M&amp;Aスキームの特徴・留意点（事前相談「スキームの提案」）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>スキーム<\/th>\n<th>メリット（○）／デメリット（×）<\/th>\n<th>留意点<\/th>\n<th>活用場面<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>株式譲渡・取得<\/td>\n<td>○手続が比較的簡便。<span class=\"star\" aria-label=\"頻出\">★<\/span>譲り渡し側の<strong>欠損金を引き続き活用できる<\/strong>。×<strong>法人格が承継<\/strong>され偶発・簿外債務を分離できない<\/td>\n<td>株主名簿・名義株・株券の確認。他株主からの買取り。経営者個人の税金は<strong>譲渡益に対する分離課税<\/strong><\/td>\n<td>株主利益の最大化、手続の簡便さ・スピード、ステークホルダーへの影響を最小限にしたい場合<\/td>\n<\/tr>\n<tr>\n<td>事業譲渡・取得<\/td>\n<td>○対象を特定し偶発・簿外債務を分離可能。税務上の<strong>のれん<\/strong>の償却費を損金化。×<strong>株主総会決議や債権者との契約の個別移転手続<\/strong>が必要で複雑<\/td>\n<td><strong>カーブアウト財務諸表<\/strong>の作成。減価償却資産等は<strong>消費税の課税売上<\/strong>。譲渡額は法人に帰属し<strong>法人税等<\/strong>、個人への還流は<strong>総合課税<\/strong>（分離課税の役員退職慰労金と併せ検討）。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>競業避止義務が法律上定められている<\/strong>が合意で免除・縮減・加重可。独禁法上の問題にも留意<\/td>\n<td>特定の事業・資産のみ譲渡したい、簿外債務等を遮断したい場合<\/td>\n<\/tr>\n<tr>\n<td>会社分割<\/td>\n<td>○<strong>包括承継<\/strong>で許認可・契約の再取得が不要。×法人格が承継され偶発・簿外債務を分離できない。<strong>株主総会の特別決議<\/strong>が必要<\/td>\n<td><strong>労働契約承継法<\/strong>に基づく従業員保護手続<\/td>\n<td><strong>吸収分割・新設分割<\/strong>の2種類。権利義務の包括承継が事業譲渡との相違点。カーブアウトでも用いる<\/td>\n<\/tr>\n<tr>\n<td>第三者割当の引受<\/td>\n<td>○対価が<strong>対象会社に交付<\/strong>され資金需要がある場合に有効。×発行手続の費用負担が大きい<\/td>\n<td>資金需要がないのに支配権維持目的で発行すると<strong>不公正発行<\/strong>として<strong>差止め請求<\/strong>のリスク<\/td>\n<td>―<\/td>\n<\/tr>\n<tr>\n<td>合併（吸収・新設）<\/td>\n<td>○スピード感のある統合。株式対価なら<strong>買収資金不要<\/strong>。×特に消滅会社側で抵抗感<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>簡易合併<\/strong>（交付財産が<strong>純資産額の5分の1以下<\/strong>）、<strong>略式合併<\/strong>（親会社が<strong>90%以上の議決権<\/strong>保有）を除き双方で特別決議。債権者保護手続（<strong>官報公告と知れている債権者への個別催告<\/strong>）<\/td>\n<td>統合効果を早期に実現。実務は<strong>吸収合併<\/strong>が多い<\/td>\n<\/tr>\n<tr>\n<td>株式交換・株式移転・株式交付<\/td>\n<td>○完全親子会社を形成、<strong>現金対価が不要<\/strong>。×子会社・兄弟会社関係となるため<strong>事後的な補償請求が困難<\/strong><\/td>\n<td>―<\/td>\n<td>―<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.31-33）→ 税務の詳細は財務・税務タブ、会社法手続の詳細は法務タブ参照。<\/p>\n<h3 id=\"n2-47\">資料2 サンプル問題①（M&amp;A実務／株式譲渡・取得、事業譲渡・取得）<\/h3>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>本試験の公式サンプル。スキーム選択の3観点を問う。（資料2 p.13）<\/p>\n<ul>\n<li>設問：非上場のA社の第三者承継で、譲受候補B社が「A 契約や許認可の取扱い」「B 偶発債務の承継」「C 手続の煩雑さ」を考慮して株式譲渡か事業譲渡かを選ぶ。空欄に入る語句の組合せはどれか。<\/li>\n<li>A：＿＿は既存の契約・許認可が原則存続。＿＿は許認可が承継されないことが多く新規取得を要する。<\/li>\n<li>B：＿＿では偶発債務を含め負債をそのまま引き継ぐ。＿＿では個別に移転させるためリスク遮断が比較的容易。<\/li>\n<li>C：＿＿は株主総会決議や債権者との契約の個別移転手続が必要で、手続は比較的複雑。<\/li>\n<li>選択肢：\n  1. &#91;A] 株式譲渡/事業譲渡 [B] 株式譲渡/事業譲渡 [C] 事業譲渡\n  2. &#91;A] 株式譲渡/事業譲渡 [B] 事業譲渡/株式譲渡 [C] 事業譲渡\n  3. &#91;A] 事業譲渡/株式譲渡 [B] 事業譲渡/株式譲渡 [C] 株式譲渡\n  4. &#91;A] 事業譲渡/株式譲渡 [B] 株式譲渡/事業譲渡 [C] 株式譲渡<\/li>\n<li>正解：<strong>①<\/strong>。<\/li>\n<li>読み解き：契約・許認可が存続＝株式譲渡、新規取得＝事業譲渡。負債をそのまま引き継ぐ＝株式譲渡、個別移転で遮断＝事業譲渡。個別移転手続が複雑＝事業譲渡。上記の参考資料1・SM表と一致。<\/li>\n<\/ul>\n<p>（資料2 p.13）<span class=\"note-tag\">注<\/span>資料には解説文がなく、読み解きは問題文の記述からの整理。<\/p>\n<h2 id=\"n2-48\">中小M&amp;Aの事例<\/h2>\n<p>小規模・個人事業主・赤字・債務超過でもM&amp;Aは成立し得る。不成立の要因は「着手の遅れ」「情報漏洩」「一族の不和」「譲り渡し側の不誠実」の4つ。<\/p>\n<h3 id=\"n2-49\">GL第1章Ⅰ2：事例の分類（GL p.27-28）<\/h3>\n<p>事例は一例であり、網羅的でなく結論を確約するものではない。詳細は参考資料4。<\/p>\n<ol>\n<li>小規模企業・個人事業主で成立：①小規模企業 ②個人事業主 ③家業的経営 ④M&amp;Aプラットフォーム利用 ⑤FC店<\/li>\n<li>経営状況が良好でない企業で成立：①赤字 ②債務超過<\/li>\n<li>親族内承継の頓挫から移行し成立<\/li>\n<li>意思決定のタイミングが成立内容に影響<\/li>\n<li>譲り渡し側の条件の明確化が寄与：①従業員の雇用継続 ②一定期間経営に関与<\/li>\n<li>従業員の反対にもかかわらず成立<\/li>\n<li>廃業予定から成立：①一部譲渡で廃業費用捻出 ②支援機関の提案を機に挑戦<\/li>\n<li>成立しなかった事例：①着手の遅れ ②情報漏洩 ③一族間の不和 ④譲り渡し側の不誠実<\/li>\n<\/ol>\n<p>（GL p.27-28）<\/p>\n<h3 id=\"n2-50\">参考資料4：成立事例（14件）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>分類<\/th>\n<th>業種・規模（譲渡側）<\/th>\n<th>譲受側<\/th>\n<th>支援機関<\/th>\n<th>スキーム<\/th>\n<th>成立要因・ポイント<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>(1)①小規模企業<\/td>\n<td>計測機器製造、売上3,000万円、従業員3名、業歴40年<\/td>\n<td>施工・メンテ、売上5億円<\/td>\n<td>地元信金、センター<\/td>\n<td>事業譲渡<\/td>\n<td>センターは<strong>相談無料<\/strong>。4社紹介、2社面談。技術力・商圏を評価。経営者は顧問で残る<\/td>\n<\/tr>\n<tr>\n<td>(1)②個人事業主<\/td>\n<td>靴小売、売上4,000万円、従業員3名、業歴50年（72歳）<\/td>\n<td><strong>創業希望者<\/strong><\/td>\n<td>信金、日本公庫、センター、弁護士、商工会、商工会議所等<\/td>\n<td>事業譲渡<\/td>\n<td>商工会の説明会がきっかけ。複数金融機関の<strong>協調融資<\/strong>、弁護士の契約支援、<strong>事業承継補助金<\/strong>。譲渡者は従業員として支える<\/td>\n<\/tr>\n<tr>\n<td>(1)③家業的経営<\/td>\n<td>寿司・懐石、売上3,500万円、従業員5名（家族3名）、業歴30年<\/td>\n<td>レジャー業、売上50億円<\/td>\n<td>地元信金<\/td>\n<td><strong>業務提携<\/strong>（譲渡ではない）<\/td>\n<td><strong>家族経営の維持を条件<\/strong>に資金援助とノウハウ提供。設備更新、インバウンド獲得<\/td>\n<\/tr>\n<tr>\n<td>(1)④プラットフォーム<\/td>\n<td>個別指導学習塾、売上5,000万円、従業員5名、業歴25年<\/td>\n<td>創業希望者（塾講師経験の30代）<\/td>\n<td>M&amp;Aプラットフォーマー、顧問税理士<\/td>\n<td>事業譲渡<\/td>\n<td>専門業者とは<strong>コスト面で折り合わず<\/strong>、プラットフォームで<strong>低コスト<\/strong>に実現<\/td>\n<\/tr>\n<tr>\n<td>(1)⑤FC店<\/td>\n<td>コンビニ、売上1億5,000万円、従業員5名、業歴20年<\/td>\n<td>創業希望者（60代）<\/td>\n<td>センター<\/td>\n<td>事業譲渡<\/td>\n<td>センターの<strong>DM<\/strong>がきっかけ。<strong>後継者人材バンク<\/strong>で<strong>約1か月<\/strong>の成約。FC本部も歓迎、離職者なし<\/td>\n<\/tr>\n<tr>\n<td>(2)①赤字<\/td>\n<td>ホテル、売上10億円、従業員20名、業歴45年（最近3期経常損失）<\/td>\n<td>ホテル、売上50億円<\/td>\n<td>顧問税理士、M&amp;A専門業者<\/td>\n<td><strong>株式譲渡<\/strong>（全株式）<\/td>\n<td><strong>約2か月<\/strong>でマッチング。知名度・サービス・人材を評価。譲渡代金と<strong>退職慰労金<\/strong>で老後資金<\/td>\n<\/tr>\n<tr>\n<td>(2)②債務超過<\/td>\n<td>卸売、売上12億円、従業員30名、業歴50年（借入約20億円）<\/td>\n<td>卸売、売上30億円<\/td>\n<td>弁護士、中小企業再生支援協議会、M&amp;A専門業者<\/td>\n<td><strong>全事業の事業譲渡<\/strong><\/td>\n<td>販路・知名度を評価。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>経営者保証ガイドライン<\/strong>で個人保証を外し、生活費と自宅を残せた<\/td>\n<\/tr>\n<tr>\n<td>(3)親族内承継の頓挫<\/td>\n<td>建設、売上1億円、従業員5名、業歴20年<\/td>\n<td>建設、売上10億円<\/td>\n<td>センター、弁護士<\/td>\n<td>株式譲渡（全株式）<\/td>\n<td>長男が<strong>経営者保証への不安<\/strong>で承継拒否。センターのDMで知り<strong>2か月<\/strong>でマッチング。職人の技術力を評価<\/td>\n<\/tr>\n<tr>\n<td>(4)意思決定のタイミング<\/td>\n<td>ギフト用品小売、売上2億円、従業員15名、業歴40年（2期連続経常赤字）<\/td>\n<td>同業、売上9億円<\/td>\n<td>地域銀行、センター<\/td>\n<td>事業譲渡<\/td>\n<td>90歳の会長が実権。業績急悪化で早急な支払を条件とし、<strong>当初オファーより相当低額<\/strong>で譲渡。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>決断の遅れで低額に<\/strong><\/td>\n<\/tr>\n<tr>\n<td>(5)①雇用継続を条件<\/td>\n<td>メッキ加工、売上2億円、従業員10名、業歴45年<\/td>\n<td>溶接加工（他地域）、売上10億円<\/td>\n<td>顧問税理士、プラットフォーム<\/td>\n<td>事業譲渡<\/td>\n<td><strong>雇用継続を第一条件<\/strong>に譲渡額は譲歩。譲受側は全員ヒアリングし待遇改善<\/td>\n<\/tr>\n<tr>\n<td>(5)②経営関与を条件<\/td>\n<td>家具等製造、売上3億円、従業員20名、業歴35年<\/td>\n<td>同業大手、売上60億円<\/td>\n<td>センター、M&amp;A専門業者<\/td>\n<td>株式譲渡（全株式）<\/td>\n<td><strong>トップ面談で正直に希望を伝えた<\/strong>。非常勤（週3日）で技術指導、譲渡額は若干減額<\/td>\n<\/tr>\n<tr>\n<td>(6)従業員の反対<\/td>\n<td>中古厨房機器販売、売上1億円、従業員7名、業歴30年<\/td>\n<td>厨房機器販売（他県）、売上20億円<\/td>\n<td>顧問公認会計士、プラットフォーム<\/td>\n<td>株式譲渡<\/td>\n<td>「全員解雇」と誤解した従業員に<strong>共同で従業員説明会<\/strong>を開催し全員が納得<\/td>\n<\/tr>\n<tr>\n<td>(7)①一部譲渡で廃業費用<\/td>\n<td>製造・小売、売上8億円、従業員30名、業歴30年<\/td>\n<td>製造、売上10億円<\/td>\n<td>顧問税理士<\/td>\n<td><strong>小売部門のみ一部事業譲渡<\/strong><\/td>\n<td>対価で製造部門の<strong>数千万円単位の廃業費用<\/strong>を捻出し解散・清算<\/td>\n<\/tr>\n<tr>\n<td>(7)②支援機関の提案<\/td>\n<td>製造、売上5億円、従業員20名、業歴40年<\/td>\n<td>同地域の製造、売上30億円<\/td>\n<td>M&amp;A専門業者<\/td>\n<td>株式譲渡<\/td>\n<td>廃業検討中に専門業者からM&amp;Aを知る。顧問就任は断り外から見守る<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料4 p.1-14）<\/p>\n<h3 id=\"n2-51\">参考資料4：不成立事例（4件）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>分類<\/th>\n<th>業種・規模（譲渡側）<\/th>\n<th>経緯<\/th>\n<th>結果<\/th>\n<th>教訓<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>(8)①着手の遅れ<\/td>\n<td>設備工事、売上5,000万円（3年前約1億円）、従業員5名、業歴40年<\/td>\n<td>借入約2億円。資金繰りが<strong>2〜3か月以内に尽きる<\/strong>見込みで弁護士に相談したがスポンサー現れず<\/td>\n<td>A社が<strong>破産<\/strong>、経営者保証していた経営者も<strong>同時に破産<\/strong><\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>早期着手<\/strong>が重要<\/td>\n<\/tr>\n<tr>\n<td>(8)②情報漏洩<\/td>\n<td>製造、売上3億円、従業員20名、業歴30年<\/td>\n<td><strong>4か月<\/strong>でマッチングし<strong>基本合意<\/strong>。専門業者の忠告に反し、最終契約も決済も未了なのに従業員や取引先にB社名を出して伝えた<\/td>\n<td>B社が<strong>信頼関係の破壊<\/strong>を理由に打切り。事業縮小の末廃業<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>情報管理（秘密保持）<\/strong><\/td>\n<\/tr>\n<tr>\n<td>(8)③一族間の不和<\/td>\n<td>製造小売、売上5億円、従業員50名、業歴60年<\/td>\n<td>副社長（次男）が社長（長男）に相談せずスポンサー探し。B社は事業譲渡を希望。社長が激怒し副社長を辞任に追い込み打切り<\/td>\n<td>内紛で従業員の退職が急増し廃業<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>親族（経営陣）内の合意形成<\/strong><\/td>\n<\/tr>\n<tr>\n<td>(8)④譲り渡し側の不誠実<\/td>\n<td>運送、売上10億円、従業員30名、業歴30年<\/td>\n<td>全株式譲渡前提で<strong>基本合意<\/strong>。<strong>DDにほとんど協力せず<\/strong>4か月経っても資料が揃わず、条件固まった後に自らの顧問登用を要求<\/td>\n<td>B社が信頼関係の毀損を理由に断念。経営者死亡後、経営権争いを経て廃業<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>DDへの協力、条件の一貫性、誠実な対応<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料4 p.15-18） <span class=\"note-tag\">注<\/span>原資料の不成立事例の項番は「①③③④」の順（②がなく③が重複）。本ノートではGL p.28の順に合わせ①〜④とした。<\/p>\n<h3 id=\"n2-52\">事例から得られるポイント<\/h3>\n<ul>\n<li>支援機関のパターン：センター（小規模・無料）、金融機関（信金・地域銀行）、顧問税理士・公認会計士、弁護士、M&amp;A専門業者、M&amp;Aプラットフォーム、商工会・商工会議所、日本公庫。<\/li>\n<li>成立要因：譲渡側の条件明確化（雇用継続、経営関与）、従業員への丁寧な説明、経営者保証ガイドラインの活用、早期の決断。<\/li>\n<li>不成立要因：着手の遅れ、情報漏洩、一族間の不和、譲渡側の不誠実（DD非協力・後出し要求）。<\/li>\n<li>選ばれたスキーム：事業譲渡が多く（個人事業主・債務超過・一部譲渡）、株式譲渡は法人の全株式譲渡で活用。家業的経営では業務提携も選択肢。<\/li>\n<\/ul>\n<p>（参考資料4の整理）<\/p>", "toc": [{"id": "n2-1", "level": 2, "text": "プロセス全体像と基本姿勢"}, {"id": "n2-2", "level": 3, "text": "中小M&Aの定義と特色"}, {"id": "n2-3", "level": 3, "text": "譲り渡し側の基本姿勢（GL第1章Ⅰ3）"}, {"id": "n2-4", "level": 3, "text": "譲り渡し側の留意点（GL第1章Ⅰ4）"}, {"id": "n2-5", "level": 3, "text": "GLの中小M&Aフロー図（GL p.32-33）"}, {"id": "n2-6", "level": 3, "text": "SMのプロセス全体像（目的・業務内容）"}, {"id": "n2-7", "level": 3, "text": "知識6観点・スキル2観点"}, {"id": "n2-8", "level": 3, "text": "GL用語集のうち実務用語"}, {"id": "n2-9", "level": 2, "text": "事前相談・事前準備・意思決定と仲介者／FAの選定"}, {"id": "n2-10", "level": 3, "text": "事前準備（GL第1章Ⅱ2）"}, {"id": "n2-11", "level": 3, "text": "意思決定（GL第1章Ⅱ3(1)）"}, {"id": "n2-12", "level": 3, "text": "仲介者・FAの選定（GL第1章Ⅱ3(2)-1①ア）"}, {"id": "n2-13", "level": 3, "text": "仲介契約・FA契約の締結と主なポイント8項目（GL第1章Ⅱ3(2)-1①イ）"}, {"id": "n2-14", "level": 3, "text": "仲介者とFAの比較（GL p.42）"}, {"id": "n2-15", "level": 3, "text": "セカンド・オピニオンの利点・留意点（GL p.43）"}, {"id": "n2-16", "level": 3, "text": "仲介者・FAを選定しない場合（GL p.43）"}, {"id": "n2-17", "level": 3, "text": "参考資料6 仲介契約・FA契約締結時のチェックリスト（全10項目）"}, {"id": "n2-18", "level": 3, "text": "SM「事前相談」の全14項目（支援者側の手順）"}, {"id": "n2-19", "level": 2, "text": "マッチング・交渉・基本合意"}, {"id": "n2-20", "level": 3, "text": "GL：マッチングの流れ（GL p.44）"}, {"id": "n2-21", "level": 3, "text": "GL：単独の支援機関と複数の支援機関への依頼の比較（GL p.44-45）"}, {"id": "n2-22", "level": 3, "text": "GL：候補先の紹介が受けられない場合（GL p.46）"}, {"id": "n2-23", "level": 3, "text": "GL：交渉（GL p.46-47）"}, {"id": "n2-24", "level": 3, "text": "GL：基本合意の締結（GL p.47）"}, {"id": "n2-25", "level": 3, "text": "SM「マッチング」の全項目"}, {"id": "n2-26", "level": 3, "text": "SM「基本合意の調整・締結」"}, {"id": "n2-27", "level": 2, "text": "DD（デュー・ディリジェンス）の全体像とビジネスDD・その他DD"}, {"id": "n2-28", "level": 3, "text": "GL：DDの位置づけ（GL p.47-48）"}, {"id": "n2-29", "level": 3, "text": "SM：DD全般に関わる事項（SM p.79-81）"}, {"id": "n2-30", "level": 3, "text": "SM：DDの全11項目（手順）"}, {"id": "n2-31", "level": 3, "text": "財務・税務DDと法務DD"}, {"id": "n2-32", "level": 3, "text": "ビジネスDD（SM p.93-101）"}, {"id": "n2-33", "level": 3, "text": "その他DD（SM p.126-131）"}, {"id": "n2-34", "level": 2, "text": "最終契約とクロージング"}, {"id": "n2-35", "level": 3, "text": "GL：最終契約の交渉・締結（GL p.48-49）"}, {"id": "n2-36", "level": 3, "text": "GL：最終契約のトラブルリスク7項目（GL p.50-56）"}, {"id": "n2-37", "level": 3, "text": "GL：クロージング（GL p.56）"}, {"id": "n2-38", "level": 3, "text": "SM：最終契約の調整・締結（SM p.135-151）"}, {"id": "n2-39", "level": 3, "text": "SM：クロージング（SM p.153-166）"}, {"id": "n2-40", "level": 2, "text": "クロージング後（PMI・ポストM&A）"}, {"id": "n2-41", "level": 3, "text": "GL：クロージング後の対応（GL p.56-57）"}, {"id": "n2-42", "level": 3, "text": "SM：PMIの全項目（SM p.168-178）"}, {"id": "n2-43", "level": 2, "text": "中小M&Aの手法と特徴"}, {"id": "n2-44", "level": 3, "text": "参考資料1：各手法の定義と特徴"}, {"id": "n2-45", "level": 3, "text": "手法の比較表（参考資料1）"}, {"id": "n2-46", "level": 3, "text": "SM：M&Aスキームの特徴・留意点（事前相談「スキームの提案」）"}, {"id": "n2-47", "level": 3, "text": "資料2 サンプル問題①（M&A実務／株式譲渡・取得、事業譲渡・取得）"}, {"id": "n2-48", "level": 2, "text": "中小M&Aの事例"}, {"id": "n2-49", "level": 3, "text": "GL第1章Ⅰ2：事例の分類（GL p.27-28）"}, {"id": "n2-50", "level": 3, "text": "参考資料4：成立事例（14件）"}, {"id": "n2-51", "level": 3, "text": "参考資料4：不成立事例（4件）"}, {"id": "n2-52", "level": 3, "text": "事例から得られるポイント"}]}, {"tab": 3, "title": "財務・税務", "html": "<h2 id=\"n3-1\">バリュエーション<\/h2>\n<p>バリュエーションの算定額は譲渡額の「目安の一つ」にすぎず、<strong>当事者同士が最終的に合意した金額が譲渡額<\/strong>となる。仲介者は<strong>確定的なバリュエーションを実施すべきではなく<\/strong>、簡易評価である旨等を両当事者に<strong>明示すべき<\/strong>である。<\/p>\n<h3 id=\"n3-2\">位置付けと基本ルール<\/h3>\n<ul>\n<li>バリュエーション＝企業又は事業の価値を定量的に評価すること。評価額は譲渡額を決める際の<strong>目安の一つ<\/strong>。（GL p.22）<\/li>\n<li>目的：客観的事実に基づくバリュエーションを行い、交渉の前提とするため。（SM p.39）<\/li>\n<li>業務内容：経営者との面談・提出資料・現地調査等に基づき、企業・事業を評価する。（SM p.39）<\/li>\n<li>中小M&amp;Aでは「<strong>簿価純資産法<\/strong>」「<strong>時価純資産法<\/strong>」「<strong>類似会社比較法（マルチプル法）<\/strong>」で算定し、交渉するケースが多い。（GL p.44）<\/li>\n<li>算出額がそのまま譲渡額になるわけではない。純資産に<strong>数年分の任意の利益（税引後利益又は経常利益等）を加算<\/strong>する場合もある。（GL p.44）<\/li>\n<li>税理士の項では「<strong>中小M&amp;Aの場合、時価純資産法で算定されるケースが多い<\/strong>」とされる。（GL p.119-120）<\/li>\n<\/ul>\n<h4>仲介者・FAが守るべきこと<\/h4>\n<ul>\n<li>評価の手法や前提条件等を依頼者に<strong>事前に説明<\/strong>し、手法・価格帯について依頼者の<strong>納得を得ることが必要<\/strong>。（GL p.92-93）<\/li>\n<li>手法・価格帯が<strong>唯一のものではないことを明示<\/strong>し、適切である理由を<strong>具体的に説明する<\/strong>ことが必要。（GL p.92-93）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>バリュエーションには一方当事者の意向が反映されやすい。<strong>両当事者を依頼者とする仲介者は、確定的なバリュエーションを実施すべきではない<\/strong>。（GL p.93）（SM p.40）<\/li>\n<li>仲介者は、必要に応じて士業等専門家等の意見を求めるよう依頼者に伝える<strong>必要がある<\/strong>。（GL p.93）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>仲介者が簡易評価の結果を両当事者に示す場合、次の3点を<strong>両当事者に対して明示すべき<\/strong>。（GL p.93）（SM p.40）\n  1. 確定的なバリュエーションではなく、<strong>参考資料として簡易に算定<\/strong>したものであること\n  2. 一方当事者の意向・意見等を考慮した場合は、<strong>その内容<\/strong>\n  3. 必要に応じて<strong>士業等専門家等の意見（セカンドオピニオン）を求めることができる<\/strong>こと<\/li>\n<li>SMでは上記の明示を「<strong>明示しなければならない<\/strong>」と表現している。（SM p.40）<\/li>\n<li>セカンドオピニオンはバリュエーション以外のプロセスでも活用されうる。（SM p.40）<\/li>\n<li>譲渡額の水準について<strong>過大なバリュエーションを提示<\/strong>する広告・営業は<strong>行ってはならない<\/strong>。→ 倫理タブ参照。（GL p.85）<\/li>\n<\/ul>\n<h3 id=\"n3-3\">スキルマップ上の大項目と項目<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>大項目<\/th>\n<th>項目<\/th>\n<th>主なポイント<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>実施方針の決定<\/td>\n<td>方法・粒度等の説明・検討（SM p.41〜43）<\/td>\n<td>情報の<strong>粒度<\/strong>・<strong>期間<\/strong>・<strong>手法<\/strong>を依頼者と相談し決定。複数手法の組合せも検討<\/td>\n<\/tr>\n<tr>\n<td>調査・情報収集<\/td>\n<td>資料の収集（SM p.44）<\/td>\n<td>必要資料を<strong>リスト化<\/strong>し理由を説明の上<strong>まとめて依頼<\/strong>。五月雨の依頼は負担<\/td>\n<\/tr>\n<tr>\n<td>調査・情報収集<\/td>\n<td>事業計画書の作成（SM p.45）<\/td>\n<td>開示前に内容を<strong>入念に確認<\/strong>。無い場合は<strong>素案を作成<\/strong>することが<strong>望ましい<\/strong><\/td>\n<\/tr>\n<tr>\n<td>調査・情報収集<\/td>\n<td>ヒアリングシート・面談（SM p.46）<\/td>\n<td>バリュエーションの<strong>目的<\/strong>を聴取。数字の<strong>精度<\/strong>を事前にすり合わせ<\/td>\n<\/tr>\n<tr>\n<td>金額の算定<\/td>\n<td>算定（SM p.47〜48）<\/td>\n<td>手法により結果に差が出る。専門家に依頼しても支援者が内容を理解している状態が必要<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.39〜48）<\/p>\n<h4>実施方針の決定（SM p.41）<\/h4>\n<ul>\n<li>各手法のメリット・デメリットと、算定額の意味を明確かつわかりやすく説明する。<\/li>\n<li>想定される譲り受け側の規模・業態と、後続交渉で求められる手法も考慮する。<\/li>\n<li>初期的なバリュエーションは<strong>DD等を経て変動しうる<\/strong>ことを依頼者に伝える。<\/li>\n<li><strong>仲介者の場合<\/strong>、士業等専門家の意見を求めることが<strong>望ましい<\/strong>旨を依頼者に伝える。<\/li>\n<li>知識：<strong>税法基準の株価<\/strong>（例：<strong>相続税評価<\/strong>）と、<strong>M&amp;Aで決まる株価<\/strong>の違いを理解している。<\/li>\n<\/ul>\n<p>（SM p.41）<\/p>\n<h4>資料の収集・事業計画・面談（SM p.44〜46）<\/h4>\n<ul>\n<li>資料の例：<strong>決算書、勘定科目内訳明細書、減価償却資産台帳、固定資産台帳、税務申告書、事業計画書<\/strong> 等。（SM p.44）<\/li>\n<li>収集不可能な資料がある場合、<strong>収集した範囲で算定する旨<\/strong>を明確に伝える。（SM p.44）<\/li>\n<li>事業計画書の記載事項（11項目）：ビジョン・理念・目的／企業・事業概要／市場環境・競合／自社の強み・弱み／取引先情報／実施体制・人員計画／売上計画／利益計画／資金調達計画／投資計画／実施スケジュール。（SM p.45）<\/li>\n<li>面談で考慮すべき観点（8つ）：財務面／譲り受け側への魅力（一部売却時は残存事業への財務インパクト）／税務面／法務面／オペレーション面／人事面／IT面／知的財産。（SM p.46）<\/li>\n<li>インカムアプローチでは事業計画策定が必要。売上・利益動向や人員体制の見立ても聴取する。（SM p.46）<\/li>\n<\/ul>\n<h3 id=\"n3-4\">手法別の特徴・メリット・デメリット<\/h3>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>3アプローチ＋「その他」の比較は頻出。メリット・デメリットを対で覚える。<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>アプローチ<\/th>\n<th>代表手法<\/th>\n<th>特徴<\/th>\n<th>メリット<\/th>\n<th>デメリット<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>マーケット<\/td>\n<td><strong>マルチプル法<\/strong>（主に<strong>EV/EBITDA倍率法<\/strong>。PER・PBR倍率法も）<\/td>\n<td>類似企業の<strong>時価総額<\/strong>や類似M&amp;Aの取引金額を参考に評価<\/td>\n<td>比較的シンプル。各手法の中で<strong>最も客観的<\/strong><\/td>\n<td>類似企業・取引が少ない場合や、<strong>一時的な減益要因<\/strong>がある場合、価値が表れない可能性<\/td>\n<\/tr>\n<tr>\n<td>インカム<\/td>\n<td><strong>DCF法<\/strong><\/td>\n<td>将来の収益又はキャッシュフローを<strong>現在価値に割り引く<\/strong>。<strong>事業計画書が必要<\/strong><\/td>\n<td><strong>将来の収益の見込みを反映<\/strong>できる<\/td>\n<td>前提条件（<strong>割引率、成長率、リスクプレミアム、残存価値<\/strong>等）次第で結果が大きく異なる<\/td>\n<\/tr>\n<tr>\n<td>コスト<\/td>\n<td><strong>時価純資産法<\/strong><\/td>\n<td>全資産・負債を<strong>時価<\/strong>で評価し、差額の時価純資産を株主価値とする。利益算定が困難な場合に多用<\/td>\n<td><strong>BSのみ<\/strong>で比較的シンプル<\/td>\n<td><strong>将来の収益性・営業権が反映されない<\/strong>ため妥当性を欠く可能性<\/td>\n<\/tr>\n<tr>\n<td>その他<\/td>\n<td>純資産＋数年分の利益<\/td>\n<td>時価（簿価）純資産に<strong>税引後利益又は経常利益等<\/strong>を<strong>通常1〜3年分<\/strong>加算。交渉で決まることが多い<\/td>\n<td>限られた情報でも比較的シンプル<\/td>\n<td>加算利益に<strong>理論的裏付けがなく恣意性<\/strong>。低収益企業では<strong>過大評価<\/strong>の可能性<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.42〜43）<\/p>\n<ul>\n<li>マーケットアプローチで一時的な減益要因が判明している場合、控除した<strong>適切な正常収益<\/strong>を用いることが<strong>望ましい<\/strong>。（SM p.42）<\/li>\n<li>DCF法は事業計画書が無いと初期段階では使いにくい。<strong>楽観シナリオを上限、悲観シナリオを下限<\/strong>とすると目安になる。（SM p.42）<\/li>\n<li>「その他」の方法の株式価値は客観的な値ではなく、<strong>あくまで交渉の際の参考<\/strong>。（SM p.43）<\/li>\n<\/ul>\n<h4>三つの評価アプローチの一般的な特徴（公認会計士の項）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>コスト<\/th>\n<th>マーケット<\/th>\n<th>インカム<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>客観性<\/td>\n<td>◎<\/td>\n<td>◎<\/td>\n<td>△<\/td>\n<\/tr>\n<tr>\n<td>市場での取引環境の反映<\/td>\n<td>△<\/td>\n<td>◎<\/td>\n<td>○<\/td>\n<\/tr>\n<tr>\n<td>将来の収益獲得能力の反映<\/td>\n<td>△<\/td>\n<td>○<\/td>\n<td>◎<\/td>\n<\/tr>\n<tr>\n<td>固有の性質の反映<\/td>\n<td>○<\/td>\n<td>△<\/td>\n<td>◎<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.113-114）※◎優れている／○やや優れている／△問題となるケースもある。出典は日本公認会計士協会「企業価値評価ガイドライン」を一部加工。<\/p>\n<ul>\n<li>コスト（ネットアセット）：代表は「（修正）簿価純資産法」「時価純資産法」。（GL p.113）<\/li>\n<li>マーケット：代表は「<strong>市場株価法<\/strong>」「マルチプル法」。（GL p.113）<\/li>\n<li>インカム：代表は「DCF法」「<strong>収益還元法<\/strong>」。（GL p.113）<\/li>\n<li>公認会計士は企業価値評価ガイドライン（平成25年7月3日改正）を踏まえ適切に実施することが<strong>望まれる<\/strong>。（GL p.113）<\/li>\n<\/ul>\n<h3 id=\"n3-5\">算定方法の詳細（SMの計算手順）<\/h3>\n<h4>マーケットアプローチ（マルチプル法）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>手法<\/th>\n<th>使う指標<\/th>\n<th>算定されるもの<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>EV/EBITDA倍率法<\/td>\n<td>業界平均のEBITDAと株価（時価総額）の関係＋対象会社の<strong>EBITDA<\/strong><\/td>\n<td><strong>企業価値（EV）<\/strong><\/td>\n<\/tr>\n<tr>\n<td>PER倍率法<\/td>\n<td>業界平均のPER＋対象会社の<strong>当期純利益<\/strong><\/td>\n<td><strong>株主価値<\/strong><\/td>\n<\/tr>\n<tr>\n<td>PBR倍率法<\/td>\n<td>業界平均のPBR＋対象会社の<strong>簿価純資産<\/strong><\/td>\n<td><strong>株主価値<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.47）<\/p>\n<h4><span class=\"star\" aria-label=\"頻出\">★<\/span>インカムアプローチ（DCF法）の手順(1)〜(5)<\/h4>\n<ol>\n<li><strong>予測期間（一般に3〜5年程度）<\/strong>を決め、事業計画を策定し、期間中の<strong>FCF<\/strong>を算出する。<\/li>\n<li>割引率である<strong>加重平均資本コスト（WACC）<\/strong>を算定する。<\/li>\n<li>予測期間後の一定成長期間の<strong>継続価値（ターミナルバリュー／TV）<\/strong>を算定する。<\/li>\n<li>FCFと継続価値を<strong>WACCで割り引き<\/strong>、<strong>事業価値<\/strong>を算定する。<\/li>\n<li>事業価値に<strong>非事業用資産（現預金等）を加算<\/strong>して<strong>企業価値<\/strong>を出し、<strong>有利子負債を控除<\/strong>して<strong>株主価値<\/strong>を算出する。<\/li>\n<\/ol>\n<p>（SM p.47〜48）<\/p>\n<ul>\n<li>バリュエーションモデル：前提条件を<strong>1シートに整理<\/strong>し、<strong>別シートで計算<\/strong>する。Excelで組む。（SM p.48）<\/li>\n<li><span class=\"note-tag\">注<\/span>SMにはFCFやWACCの計算式の記載はない。（SM p.47〜48）<\/li>\n<\/ul>\n<h4>コストアプローチ（時価純資産法）<\/h4>\n<ul>\n<li>資産（有価証券・売却金・未収入金・棚卸資産・土地建物・機械設備等）は、<strong>資産内容・回収可能性・換金性・再調達金額<\/strong>等を検討し評価。（SM p.48）<\/li>\n<li>負債は<strong>帳簿金額が要支払額であり時価<\/strong>と考えられる。<strong>網羅性<\/strong>を確認し、<strong>オフバランス債務<\/strong>が未計上なら追加計上。（SM p.48）<\/li>\n<li><strong>引当金<\/strong>も、引当金不足等があれば追加計上する。（SM p.48）<\/li>\n<\/ul>\n<h4>算定時の留意点（SM p.47）<\/h4>\n<ul>\n<li>手法の特性により<strong>算定結果に差が出る<\/strong>ことに留意。<\/li>\n<li><strong>士業等専門家に依頼する場合でも<\/strong>、支援者は内容を理解し、依頼者に説明・調整できる状態が求められる。<\/li>\n<li>仲介者は、一方当事者の意向を考慮した場合、その内容を<strong>両当事者に明示する必要<\/strong>がある。<\/li>\n<\/ul>\n<p>（SM p.47）<\/p>\n<h3 id=\"n3-6\">参考資料2「中小M&amp;Aの譲渡額の算定方法」の計算例<\/h3>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>数値例は計算問題の素材になりやすい。共通の前提は、簿価で<strong>資産600・負債200・純資産400<\/strong>。<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>手法<\/th>\n<th>定義<\/th>\n<th>メリット<\/th>\n<th>デメリット<\/th>\n<th>計算例の結果<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>簿価純資産法<\/td>\n<td>BSの<strong>純資産<\/strong>が株式価値<\/td>\n<td>イメージしやすく<strong>コストをかけず<\/strong>算定できる<\/td>\n<td>簿価と時価の乖離や簿外資産・負債があると本来の価値を表さない<\/td>\n<td><strong>400<\/strong><\/td>\n<\/tr>\n<tr>\n<td>時価純資産法（修正簿価純資産法）<\/td>\n<td>資産・負債を時価評価し、<strong>簿外資産・負債<\/strong>も時価評価した純資産<\/td>\n<td>譲り受け側が<strong>実態を把握するために有効<\/strong><\/td>\n<td>時価算定等に<strong>コストや時間<\/strong>を要する場合がある<\/td>\n<td><strong>314<\/strong><\/td>\n<\/tr>\n<tr>\n<td>純資産＋数年分の利益<\/td>\n<td>純資産に<strong>数年分の任意の利益<\/strong>を加算<\/td>\n<td>（記載なし）<\/td>\n<td>（記載なし）<\/td>\n<td><strong>345<\/strong>（270＋75）<\/td>\n<\/tr>\n<tr>\n<td>類似会社比較法（マルチプル法）<\/td>\n<td>類似上場会社のEVと財務指標の評価倍率から算定<\/td>\n<td><strong>比較的客観性の高い<\/strong>手法<\/td>\n<td>選定する上場会社等が適切かに注意<\/td>\n<td>（数値例なし）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料2 p.1〜4）<\/p>\n<ul>\n<li>中小M&amp;Aでは、株式価値への影響が大きく時価を把握しやすい<strong>不動産や有価証券<\/strong>等の一部のみ時価評価する「<strong>修正簿価純資産法<\/strong>」も多い。（参考資料2 p.2）<\/li>\n<li>簿外資産・負債の例：<strong>保険の解約返戻金、退職給付債務<\/strong>等。棚卸資産は実在性や評価の妥当性を検証して時価評価する。（参考資料2 p.2）<\/li>\n<\/ul>\n<h4>簿価純資産法（株式価値400）<\/h4>\n<ol>\n<li>資産（簿価）600 − 負債（簿価）200 ＝ 簿価純資産<strong>400<\/strong><\/li>\n<li>簿価純資産400 ＝ <strong>株式価値400<\/strong><\/li>\n<\/ol>\n<p>（参考資料2 p.1）<\/p>\n<h4>時価純資産法（株式価値314）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>金額<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>資産（簿価）<\/td>\n<td>600<\/td>\n<\/tr>\n<tr>\n<td>土地の含み損<\/td>\n<td>▲100<\/td>\n<\/tr>\n<tr>\n<td>保険の解約返戻金<\/td>\n<td>＋20<\/td>\n<\/tr>\n<tr>\n<td>負債（簿価）<\/td>\n<td>▲200<\/td>\n<\/tr>\n<tr>\n<td>役員退職金<\/td>\n<td>▲50<\/td>\n<\/tr>\n<tr>\n<td>繰延税金資産（実効税率34%と仮定）<\/td>\n<td>＋44<\/td>\n<\/tr>\n<tr>\n<td><strong>時価純資産＝株式価値<\/strong><\/td>\n<td><strong>314<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料2 p.2）<\/p>\n<ul>\n<li>検算：400−100＋20−50＋44＝314。繰延税金資産は（100＋50−20）×34%≈44。<\/li>\n<li><span class=\"note-tag\">注<\/span>原資料の吹き出しは「繰延税金資産＋39」、表は「＋44」と不一致。314は＋44で計算した結果と一致する。<\/li>\n<\/ul>\n<h4>純資産に数年分の利益を加算（譲渡額345）<\/h4>\n<ol>\n<li>時価純資産：600−100＋20−200−50＝<strong>270<\/strong>（①）。この例では税効果を考慮していない（考慮する場合もある）。<\/li>\n<li>加算する利益：売上200・費用180・利益20。役員保険料の減額＋5で<strong>修正利益25<\/strong>。<\/li>\n<li>修正利益25×<strong>3年分<\/strong>＝<strong>75<\/strong>（②）。<\/li>\n<li>譲渡額＝①270＋②75＝<strong>345<\/strong>。<\/li>\n<\/ol>\n<p>（参考資料2 p.3）<\/p>\n<ul>\n<li>加算する利益の種類（税引後利益又は経常利益等）と年数（<strong>通常1年〜3年<\/strong>）は、<strong>交渉で決まる<\/strong>ケースが多い。（参考資料2 p.3）<\/li>\n<\/ul>\n<h4><span class=\"star\" aria-label=\"頻出\">★<\/span>EV/EBITDA倍率法の算式<\/h4>\n<ul>\n<li>評価倍率の算定指標には「EBIT」「EBITDA」「PER」等があるが、中小M&amp;Aでは<strong>EV/EBITDA倍率法<\/strong>が多用される。<\/li>\n<li><strong>EBITDA＝営業利益＋減価償却費<\/strong>（簡易的な算定。「<strong>償却前利益<\/strong>」とも呼ばれる）。<\/li>\n<li>譲渡代金をEBITDAの<strong>何年分で回収できるか<\/strong>を類似上場会社から算出する手法。<\/li>\n<\/ul>\n<pre class=\"formula\"><code>\\text{① 倍率} = \\frac{\\text{類似上場会社のEV}\\;(=\\text{株式価値}+\\text{有利子負債}-\\text{現預金})}{\\text{類似上場会社のEBITDA}}\n\\\\\n\\text{② 株式価値} = \\text{対象会社のEBITDA} \\times \\text{①} - \\text{純有利子負債}\\;(=\\text{有利子負債}-\\text{現預金})\n<\/code><\/pre>\n<ul>\n<li>中小企業は株式の流動性が低いため、<strong>30%程度ディスカウント（非流動性ディスカウント）<\/strong>するケースもある。<\/li>\n<li><span class=\"note-tag\">注<\/span>参考資料2にマルチプル法の数値例はない（概念図のみ）。<\/li>\n<\/ul>\n<p>（参考資料2 p.4）<\/p>\n<h3 id=\"n3-7\"><span class=\"star\" aria-label=\"頻出\">★<\/span>サンプル問題②：FCFの計算（正答25百万円）<\/h3>\n<p>財務・税務の小項目「バリュエーションに関する財務知識（FCFの計算）」のサンプル。選択肢は①25・②29・③65・④75（百万円）で、正解は①。（資料2 p.14）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>資料の項目<\/th>\n<th>金額（百万円）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>営業利益<\/td>\n<td>100<\/td>\n<\/tr>\n<tr>\n<td>減価償却費<\/td>\n<td>10<\/td>\n<\/tr>\n<tr>\n<td>売上債権の増加額<\/td>\n<td>15<\/td>\n<\/tr>\n<tr>\n<td>棚卸資産の増加額<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>仕入債務の減少額<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>設備投資額<\/td>\n<td>20<\/td>\n<\/tr>\n<tr>\n<td>実効税率<\/td>\n<td>40%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.14）<\/p>\n<p>計算手順（資料に解説はなく、数値のみで検算したもの）：<\/p>\n<ol>\n<li>税引後営業利益：100×（1−40%）＝60<\/li>\n<li>減価償却費を足し戻す：60＋10＝70<\/li>\n<li>運転資本の増加を差し引く：売上債権増加15、棚卸資産増加8、仕入債務減少2 → 70−25＝45<\/li>\n<li>設備投資を差し引く：45−20＝<strong>25<\/strong><\/li>\n<\/ol>\n<pre class=\"formula\"><code>\\text{FCF} = 100\\times(1-0.4) + 10 - (15 + 8 + 2) - 20 = 25\n<\/code><\/pre>\n<ul>\n<li>仕入債務の<strong>減少<\/strong>は資金の流出なので差し引く側。詳細計算式はSM・資料2とも記載がない。<\/li>\n<\/ul>\n<h3 id=\"n3-8\">資料2：株式価値の簡易計算ツール<\/h3>\n<p>M&amp;A支援機関登録制度の取引データ等を基に、自社の株式価値を<strong>参考値<\/strong>として把握できるツール。登録制度HPに<strong>実装予定<\/strong>。（資料2 p.42）<\/p>\n<ol>\n<li>「免責事項」への事前同意（<strong>同意ボタンのチェックが必要<\/strong>）<\/li>\n<li>財務情報等の入力<\/li>\n<li>簡易計算結果の出力（「算定結果はあくまで参考値」と表示）<\/li>\n<\/ol>\n<p>（資料2 p.42-43）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>区分<\/th>\n<th>入力項目<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>簡易計算版（BS）<\/td>\n<td>現預金／有利子負債／簿価純資産<\/td>\n<\/tr>\n<tr>\n<td>簡易計算版（PL）<\/td>\n<td>営業利益／減価償却費／当期純利益<\/td>\n<\/tr>\n<tr>\n<td>詳細計算版の追加（BS）<\/td>\n<td>非事業用資産（有価証券、保険積立金、ゴルフ会員権、遊休不動産等）／負債類似項目（役員・従業員退職給付債務の未計上額、リース債務等）<\/td>\n<\/tr>\n<tr>\n<td>詳細計算版の追加（PL）<\/td>\n<td>一過性の売上・費用（営業内・営業外・特別）／削減可能な費用（退任予定の役員に係る報酬・交際費・保険料、顧問料等）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.44）<\/p>\n<ul>\n<li>必要な財務情報：<strong>営業利益、減価償却費、当期純利益、簿価純資産、有利子負債、現金および現金同等物<\/strong>。（資料2 p.43）<\/li>\n<li>活用シーン：<strong>事業承継の初期検討<\/strong>／<strong>M&amp;Aの事前準備<\/strong>（FA・仲介者への相談前に株式価値を把握）。（資料2 p.43）<\/li>\n<li>算出手法：EV/EBITDA倍率法・PER倍率法・PER倍率法（原文表記）。<span class=\"note-tag\">注<\/span>PERの重複は原文のまま（PBRの誤記の可能性）。（資料2 p.44）<\/li>\n<li>結果は<strong>第一四分位（下限）〜第三四分位（上限）のレンジ<\/strong>で表示。サンプル不足の中分類業種は対象外。（資料2 p.44-45）<\/li>\n<\/ul>\n<h4><span class=\"star\" aria-label=\"頻出\">★<\/span>免責事項（対象外・考慮しないもの）<\/h4>\n<ul>\n<li>算定結果は<strong>参考値<\/strong>で、正確性・妥当性は保証しない。実際の株式価値は<strong>双方の合意により決定<\/strong>される。<\/li>\n<li>算定対象は<strong>黒字企業における株式譲渡<\/strong>。<strong>赤字企業・債務超過企業の株式譲渡、事業譲渡、その他スキームは対象外<\/strong>。<\/li>\n<li>取引事例法における<strong>個社別の調整（役員報酬、一時的な損益等）<\/strong>、<strong>非流動性ディスカウント<\/strong>、<strong>非支配株主持分<\/strong>は<strong>考慮しない<\/strong>。<\/li>\n<li>入力情報は利用目的に限定し、<strong>サイト上に保存されない<\/strong>。個社を特定する機微情報の入力は不要。<\/li>\n<li>利用者自身の責任で判断し、中小企業庁・事務局は責任を負わない。予告なく変更・削除あり。<\/li>\n<\/ul>\n<p>（資料2 p.43）<\/p>\n<h2 id=\"n3-9\">仲介者・FAの手数料<\/h2>\n<p>仲介者・FAの手数料には<strong>一般的な法規制がなく<\/strong>、成功報酬は「基準となる価額」×レーマン方式と<strong>最低手数料<\/strong>の組合せが多い。料率だけでなく、最終的に支払う<strong>報酬の絶対額<\/strong>を契約前に確認することが<strong>重要<\/strong>である。<\/p>\n<h3 id=\"n3-10\">手数料の種類（GL第1章Ⅴ 1）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>種類<\/th>\n<th>別名<\/th>\n<th>発生時期<\/th>\n<th>成功報酬との関係・留意点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>着手金<\/td>\n<td>―<\/td>\n<td>主に仲介契約・FA契約の<strong>締結時<\/strong><\/td>\n<td>成功報酬の<strong>内金<\/strong>とすることもある。請求する業者としない業者がある<\/td>\n<\/tr>\n<tr>\n<td>月額報酬<\/td>\n<td>定額顧問料、リテーナーフィー<\/td>\n<td>主に月ごとに定期的に<strong>定額<\/strong><\/td>\n<td>内金とすることもある。定期的に生じるため<strong>契約期間を確認しておくべき<\/strong><\/td>\n<\/tr>\n<tr>\n<td>中間金<\/td>\n<td>マイルストーンフィー<\/td>\n<td>基本合意締結時等、案件完了前の一定時点や一定の成果に対して<\/td>\n<td>成功報酬に含める（内金）ことが<strong>多い<\/strong><\/td>\n<\/tr>\n<tr>\n<td>成功報酬<\/td>\n<td>―<\/td>\n<td>主に<strong>クロージング時等<\/strong>の案件完了時<\/td>\n<td>3つの基準価額に一定の方式で計算。<strong>最低手数料<\/strong>が設けられるケースも多い<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.63-64）<\/p>\n<ul>\n<li>着手金・月額報酬・中間金を設けず<strong>成功報酬のみ<\/strong>（完全成功報酬型）の業者も相当数ある。（GL p.39, 63）<\/li>\n<li>着手金等が成功報酬に<strong>含まれるか否かの確認<\/strong>も必要。別途、<strong>実費（交通費等）<\/strong>を請求することもある。（GL p.63）<\/li>\n<li>成功報酬の算定方法や水準は業者ごとに異なる。<strong>複数の仲介者・FAを比較検討することが望まし
