立と同時の解除等<\/strong>（借換えを含む）が<strong>最も優先<\/strong>。困難なら成立後<strong>可能な限り早期<\/strong>に。相談は可能な限り<strong>最終契約締結の一定期間前<\/strong>に開始が望ましく、<strong>少なくとも最終契約後からクロージング前の間までには開始されるべき<\/strong><\/td>\n<\/tr>\n<tr>\n<td>審査期間<\/td>\n<td>信用保証協会等<strong>他機関の保証が付されている<\/strong>場合、譲り受け側が<strong>取引先でない・役務提供地域外<\/strong>の場合は時間を要する可能性<\/td>\n<\/tr>\n<tr>\n<td>譲り受け側の資力による借換え<\/td>\n<td>成立と同時の解除等の手段として有効。時間的猶予がない場合は成立後の借換えも有効な選択肢。借換えも早期に相談<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料13 p.1-2）<\/p>\n<h3 id=\"n4-29\">ステークホルダー別の対応<\/h3>\n<h4>譲り渡し側<\/h4>\n<ol>\n<li>M&amp;A検討前の解除等の検討：経営者保証GLが求める3点（下記）を実施。弁護士等にも相談。<\/li>\n<li>成立前に金融機関等から意向を取得することが<strong>望ましい<\/strong>。ただし事前相談後も確定しない可能性に留意。<\/li>\n<li>意向表明を待たずに進める場合：成立後速やかな<strong>借換え<\/strong>を譲り受け側に要請することを検討。最終契約に規定しても解除できない可能性がある。<\/li>\n<li>士業等専門家・センターへの相談：秘密保持条項があれば<strong>相談先を対象から除外<\/strong>した上で行う。<\/li>\n<li>譲り受け側の適格性の精査：<span class=\"star\" aria-label=\"頻出\">★<\/span>金融機関等から解除等が難しいと表明され、借換えによる解消も確認できない限り、<strong>当該譲り受け側とのM&amp;Aを実行することは望ましくない<\/strong>。<\/li>\n<\/ol>\n<p>（参考資料13 p.2-3）<\/p>\n<h4>譲り受け側<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>特段の申出がない限り、解除等は<strong>当然に譲り渡し側が希望する条件<\/strong>と認識し、最大限配慮する。<\/li>\n<li>成立前に扱いを確定させることが第一。譲り渡し側からの相談の申出は<strong>拒むべきでなく<\/strong>、秘密保持条項の対象から除外。金融機関等の要請には<strong>誠実に対応<\/strong>。<\/li>\n<li>意向表明を待たずに進める場合：①原則として<strong>借換えを実施すべき<\/strong> ②借換えしない場合は慎重に。トラブルになれば<strong>業界内の情報共有の仕組み<\/strong>の対象となる等<strong>自身の信用毀損リスク<\/strong> ③最終契約で<strong>譲り受け側の義務<\/strong>とし、<strong>解除や買戻しの条項<\/strong>も検討 ④成立前の相談は実施 ⑤解除が難しくなれば借換えを検討し、損害には<strong>適切な補償<\/strong>。<\/li>\n<li>譲り渡し側・専門業者への情報開示：一方的に調査する立場ではなく、専門業者の調査に協力し情報を開示する。<\/li>\n<\/ul>\n<p>（参考資料13 p.3-4）<\/p>\n<h4>M&amp;A専門業者（仲介者・FA）<\/h4>\n<ol>\n<li>経営者保証のリスクの丁寧な説明：成立後の解除等は、譲り受け側の信用力が著しく低いと円滑に進まないリスク、解除の意思が希薄だと相談が滞るリスク。<\/li>\n<li>成立前の相談の説明：意向を聴取し、弁護士等・センター・金融機関等への相談が選択肢である旨を説明。<span class=\"star\" aria-label=\"頻出\">★<\/span>希望があれば<strong>拒むべきでなく<\/strong>、秘密保持条項から相談先を除外。譲り受け側にも除外を<strong>働きかける<\/strong>。<\/li>\n<li>審査期間の考慮：金融機関等に早期確認を<strong>過度に求めるべきでなく<\/strong>、時間的猶予を確保したスケジューリング。<\/li>\n<li>譲り受け側に対する調査：最終契約を履行し事業を引き継ぐ<strong>意思・能力<\/strong>の調査。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>仲介契約・FA契約締結前<\/strong>（プラットフォーマーは登録前）に調査概要を説明（下表）。<\/li>\n<li>不適切な行為の情報を取得した場合：<strong>担当者レベルに留めず組織的に共有<\/strong>し、支援を慎重に検討する体制を構築。新たな支援は<strong>組織的な判断<\/strong>（組織的に記録され事後検証可能なもの）で行う。<\/li>\n<\/ol>\n<p>（参考資料13 p.5-7）<\/p>\n<h4>譲り受け側に対する調査の項目<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>調査項目<\/th>\n<th>対象・方法<\/th>\n<th>調査内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>実施主体<\/td>\n<td>仲介者・FAの担当者・内部審査部門又は関連会社<\/td>\n<td>―<\/td>\n<\/tr>\n<tr>\n<td>財務状況<\/td>\n<td>譲り受け側の財務諸表の確認<\/td>\n<td>債務超過・赤字でないか、現預金の額等<\/td>\n<\/tr>\n<tr>\n<td>コンプライアンス<\/td>\n<td>対象：譲り受け側、経営者、役員、主要株主、関連会社。方法：Webの不芳情報検索、社内DB、<strong>業界内の情報共有の仕組み<\/strong>、外部DB・調査会社<\/td>\n<td>反社会的勢力への該当性、M&amp;Aトラブルの有無<\/td>\n<\/tr>\n<tr>\n<td>事業実態<\/td>\n<td>商業登記簿、web地図閲覧、事業所訪問<\/td>\n<td>事業実態の有無、契約締結権限を有する者か<\/td>\n<\/tr>\n<tr>\n<td>最終契約の実行可能性<\/td>\n<td>財務諸表、預金通帳、融資証明書等<\/td>\n<td>預貯金額や借入の調整状況から譲渡対価の支払等を実行できるか<\/td>\n<\/tr>\n<tr>\n<td>その他（M&amp;Aに関する調査等）<\/td>\n<td>ヒアリング、過去の譲り渡し側からのクレーム、情報共有の仕組み<\/td>\n<td>M&amp;Aに取り組む背景、過去のM&amp;Aでのトラブル（最終契約の不履行等）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料13 p.5-6、参考資料11 p.11-12）<\/p>\n<ul>\n<li>調査のタイミング：契約締結前に加え、プロセスの進捗過程でも実施し、<strong>最終契約の締結までに<\/strong>十分に確認。<\/li>\n<li>調査方法：<strong>税務申告書や商業登記簿<\/strong>の確認、関係者を含むコンプライアンスチェック。<span class=\"star\" aria-label=\"頻出\">★<\/span>譲り渡し側が<strong>債務超過<\/strong>の場合等は特に慎重に、財務状況は<strong>少なくとも決算公告や税務申告書の確認<\/strong>で実施。<\/li>\n<\/ul>\n<p>（参考資料13 p.6-7）<\/p>\n<h4>金融機関・信用保証協会・その他の支援機関<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>主体<\/th>\n<th>求められる対応<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>金融機関<\/td>\n<td><strong>M&amp;A成立の前後にかかわらず<\/strong>経営者保証GLに基づき対応することが望ましい。<span class=\"star\" aria-label=\"頻出\">★<\/span>「代表者の変更がなされていない」「成立前の段階」といった<strong>形式的理由で審査を拒む対応は不適切<\/strong>。解除できない場合は、どう改善すれば可能性が高まるかを個別具体的に説明。相談情報は利益相反管理の観点から<strong>与信関連業務に限って<\/strong>利用。不適切な譲り受け側と判明したら可能な範囲で相談者に伝達。M&amp;Aを支援する場合は譲り受け側の財務・コンプライアンスを確認して紹介<\/td>\n<\/tr>\n<tr>\n<td>信用保証協会<\/td>\n<td>成立の前後にかかわらず経営者保証GLに基づく対応が望ましい。形式的理由で<strong>相談受付を拒む対応は不適切<\/strong>。金融機関が保証人不要でも協会が必要と判断する場合は<strong>十分に協議<\/strong>し、客観的合理的理由を金融機関を介して説明。納得が得られなければ<strong>協会から直接説明<\/strong><\/td>\n<\/tr>\n<tr>\n<td>その他の支援機関<\/td>\n<td>解除の相談を受けたら、3点（区分・分離／財務基盤強化／透明性確保）を促すことが望ましい。マッチングしない場合も経営者保証に留意が必要な旨を伝え、適切に助言<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料13 p.7-8）<\/p>\n<h3 id=\"n4-30\">GL第1章（譲り渡し側向け）の要点<\/h3>\n<ul>\n<li>譲り渡し側経営者が保証人の場合は、その扱いを<strong>慎重に検討する必要がある<\/strong>。（GL p.50）<\/li>\n<li>ア 譲り渡し側の信用力・ガバナンスによる解除：<span class=\"star\" aria-label=\"頻出\">★<\/span>経営者保証GLが主たる債務者に求める3点＝<strong>（ⅰ）法人と経営者との関係の明確な区分・分離、（ⅱ）財務基盤の強化、（ⅲ）財務状況の正確な把握、適時適切な情報開示等による経営の透明性確保<\/strong>。構築には<strong>中小企業活性化協議会<\/strong>への相談も有用。（GL p.50）<\/li>\n<li>イ 譲り受け側の信用力を踏まえた解除・移行：特則は、前経営者に保証を求める場合、株式保有状況・代表権・実質的経営権・債権保全状況・返済能力等を勘案し<strong>慎重に検討することが必要<\/strong>。（GL p.50-51）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>解除・移行は<strong>最終的には金融機関等の判断<\/strong>。正式な解除・移行は<strong>クロージングを経て登記簿上で代表者が変更された後<\/strong>に行う必要がある。（GL p.51）<\/li>\n<li>確実に解除・移行したい場合の対応3つ：（ⅰ）士業等専門家（特に弁護士）やセンターへの相談 （ⅱ）秘密保持を徹底し、譲り受け側とともに金融機関等へ事前相談（相談先とNDAを締結することが<strong>望ましい<\/strong>） （ⅲ）最終契約で譲り受け側の<strong>義務<\/strong>とし、<strong>クロージング条件<\/strong>と<strong>解除条項・補償条項<\/strong>を盛り込む。（GL p.51-52）<\/li>\n<li>クロージング条件の例：(a)最終契約後・クロージング前に金融機関等の<strong>組織的な意向表明<\/strong>を取得 (b)必要書面の提出と<strong>代表者変更登記の必要書類作成<\/strong>。万全を期すなら<strong>クロージング日に変更登記と解除・移行手続を同時実施<\/strong>。（GL p.52）<\/li>\n<li>確実な手段：クロージング時に対象債務を<strong>譲り受け側の資力で返済し、別途借り換える<\/strong>方法。（GL p.52）<\/li>\n<li>クロージング後に移行しない等のトラブルは、<strong>早急に弁護士へ相談することが望ましい<\/strong>。仲介者・FAの支援は、役務の終了と<strong>非弁行為<\/strong>（弁護士法第72条）の可能性から限界がある。（GL p.57）<\/li>\n<li>関連：特則は事業承継時の<strong>二重徴求を原則禁止<\/strong>（令和元年12月策定、令和2年4月1日適用）。経営者保証GL本体は平成25年12月策定、平成26年2月1日適用。（GL p.23-24）<\/li>\n<\/ul>\n<h3 id=\"n4-31\">GL第2章（支援機関向け）の要点<\/h3>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>仲介者・FAは、経営者と方針を相談の上、対応を検討<strong>しなければならない<\/strong>。意向を丁寧に聴取し、弁護士等・センター・金融機関等への成立前相談が選択肢である旨を説明<strong>しなければならない<\/strong>。成立前の情報提供の留意点も伝え<strong>なければならない<\/strong>。（GL p.96）<\/li>\n<li>キャッシュフロー悪化・債務超過が背景にある場合、<strong>そもそもM&amp;Aを実行すべきかも含めて<\/strong>慎重に検討することが求められる。（GL p.96）<\/li>\n<li>相談希望があれば<strong>拒むべきではなく<\/strong>、秘密保持条項から相談先を<strong>除外する必要<\/strong>がある。譲り受け側にも除外を<strong>働きかけなければならない<\/strong>。（GL p.97）<\/li>\n<li>最終契約では①譲り受け側の義務とし、②クロージング条件として設定し、③契約解除条項・補償条項等を盛り込む方向で調整<strong>するべき<\/strong>。（GL p.97）<\/li>\n<li>金融機関（支援機関として）：実施前の相談や、実施後に「実質的な経営権を有している者」等の変更を把握した場合、経営者保証GL・特則に留意し適切な対応を検討することが<strong>求められる<\/strong>。（GL p.107）<\/li>\n<li>専門家各者（士業等）：経営者保証GL・特則に即した対応を必要に応じ助言することが<strong>望ましい<\/strong>。（GL p.113, 117, 122, 126）<\/li>\n<\/ul>\n<h3 id=\"n4-32\">情報共有の仕組みの登録事由（経営者保証関連）<\/h3>\n<p>最終契約で経営者保証等の解除が譲り受け側の義務（努力義務を含む）として合意された場合で、次のとき。<\/p>\n<ol>\n<li>解除に合理的に要する一定期間を経過しても<strong>解除されない<\/strong>とき<\/li>\n<li>金融機関等との解除に向けた<strong>相談をすみやかに開始しない<\/strong>とき<\/li>\n<li>解除不可・条件付きの場合に、<strong>借換・一括返済・条件充足等で解除を実現しない<\/strong>とき<\/li>\n<\/ol>\n<p>（情報共有 p.2）<\/p>\n<ul>\n<li>株式譲渡契約書サンプルの第10条・第14条・第15条の2・第17条の2は、上記の指針を条文化したもの（→ 株式譲渡契約書サンプルの節参照）。→ 情報共有の仕組み全体は倫理タブ参照。（参考資料7 p.19-26）<\/li>\n<\/ul>", "toc": [{"id": "n4-1", "level": 2, "text": "法務DD"}, {"id": "n4-2", "level": 3, "text": "全般に関わる事項"}, {"id": "n4-3", "level": 3, "text": "主な調査項目一覧"}, {"id": "n4-4", "level": 3, "text": "各項目の補足"}, {"id": "n4-5", "level": 3, "text": "分析結果のまとめ"}, {"id": "n4-6", "level": 2, "text": "仲介契約書サンプル"}, {"id": "n4-7", "level": 3, "text": "前提と位置づけ"}, {"id": "n4-8", "level": 3, "text": "条文ごとの要旨"}, {"id": "n4-9", "level": 3, "text": "秘密保持（第4条）の細目"}, {"id": "n4-10", "level": 3, "text": "報酬（第6条）"}, {"id": "n4-11", "level": 3, "text": "テール条項（第6条2項）"}, {"id": "n4-12", "level": 3, "text": "利益相反行為の禁止（第8条4項・5類型）"}, {"id": "n4-13", "level": 3, "text": "各条の「注」の要旨（全部）"}, {"id": "n4-14", "level": 3, "text": "サンプル問題③（免責条項）"}, {"id": "n4-15", "level": 2, "text": "秘密保持契約書・基本合意書サンプル"}, {"id": "n4-16", "level": 3, "text": "秘密保持契約書（参考資料7(2)）"}, {"id": "n4-17", "level": 3, "text": "基本合意書（参考資料7(3)）"}, {"id": "n4-18", "level": 2, "text": "株式譲渡契約書・事業譲渡契約書サンプル"}, {"id": "n4-19", "level": 3, "text": "株式譲渡契約書（参考資料7(4)）"}, {"id": "n4-20", "level": 3, "text": "事業譲渡契約書（参考資料7(5)）"}, {"id": "n4-21", "level": 3, "text": "株式譲渡契約と事業譲渡契約の比較"}, {"id": "n4-22", "level": 3, "text": "【注】参考資料7の2つの版（007_01と007_02）の差異"}, {"id": "n4-23", "level": 2, "text": "重要事項説明書とリスク説明書のサンプル"}, {"id": "n4-24", "level": 3, "text": "重要事項説明書（参考資料11）"}, {"id": "n4-25", "level": 3, "text": "最終契約におけるリスク事項説明書（参考資料12）"}, {"id": "n4-26", "level": 2, "text": "経営者保証の取扱い"}, {"id": "n4-27", "level": 3, "text": "背景（参考資料13 はじめに）"}, {"id": "n4-28", "level": 3, "text": "基本原則・共通事項"}, {"id": "n4-29", "level": 3, "text": "ステークホルダー別の対応"}, {"id": "n4-30", "level": 3, "text": "GL第1章（譲り渡し側向け）の要点"}, {"id": "n4-31", "level": 3, "text": "GL第2章（支援機関向け）の要点"}, {"id": "n4-32", "level": 3, "text": "情報共有の仕組みの登録事由（経営者保証関連）"}]}, {"tab": 5, "title": "市場・政策", "html": "<h2 id=\"n5-1\">市場改革の方向性（資料1・2025年6月6日）<\/h2>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>市場の健全化は「組織単位の規律（登録制度）」と「個人の質向上（スキルマップ・試験・登録制）」の両輪で進める。売手は小規模・地方、買手は税制・融資・補助金・PMI・ファンドが柱である。<\/p>\n<p>「中小M&amp;A市場動向・中小企業政策」はM&amp;A実務科目の中で<strong>必ず出題<\/strong>を想定し、配分は5%・3問程度。（資料2 p.9, p.11）<\/p>\n<p>資料1の構成は次のとおり。（資料1 p.2）<\/p>\n<ol>\n<li>これまでの施策、事業承継・M&amp;Aの動向<\/li>\n<li>新たな施策の方向性：（1）売手に係る施策／（2）市場に係る施策／（3）買手に係る施策<\/li>\n<li>御議論いただきたい論点<\/li>\n<\/ol>\n<h3 id=\"n5-2\">市場に係る施策①：アドバイザー個人の質の向上<\/h3>\n<h4>M&amp;Aアドバイザーに求められる知識・倫理観<\/h4>\n<ul>\n<li>M&amp;Aは「総合格闘技」とも称され、業務範囲が広く幅広い知識・能力が求められる。<\/li>\n<li>未熟な新規参入のM&amp;A支援機関が多く、知識・能力の向上が課題。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>これまでの施策は支援機関に<strong>組織単位<\/strong>で規律遵守を図ってきた。今後は<strong>組織レベルの規律浸透と両輪で個人レベルの質の向上<\/strong>を図る<strong>必要がある<\/strong>。<\/li>\n<li>領域：ビジネス・戦略（企業戦略・事業戦略、シナジー、経営統合計画、モニタリング等）／会計・税務（ストラクチャリング、会計・税務処理、簿外債務・資産、税務リスク等）／法務（リーガルリスク、各種法令対応、契約、組織再編等）／ファイナンス（企業価値評価、資金調達（株式・借入）等）。<\/li>\n<li>中核は「中小M&amp;A取引遂行力」：交渉・折衝、プロジェクトマネジメント、分析・論点整理、ファシリテーション、コミュニケーション等。<\/li>\n<\/ul>\n<p>（資料1 p.3）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>区分<\/th>\n<th>知識・スキル、倫理観が高い<\/th>\n<th>低い<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>行動<\/td>\n<td>交渉上の論点を把握しトラブル防止（例：経営者保証の扱いや法令違反はクロージング後に問題化しやすい）／最適な候補先を検討・提案／顧客の利益を最優先<\/td>\n<td>論点を把握できない／シナジー・財務税務・ビジネス一般の知見がない／倫理感が欠如し自らの利益を最優先<\/td>\n<\/tr>\n<tr>\n<td>結果<\/td>\n<td>円滑なM&amp;A実現・シナジー発揮等、質の高いマッチング<\/td>\n<td>M&amp;Aが実現しない／実施後トラブル／マッチングの質が低い<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料1 p.3）<\/p>\n<h4>スキルマップの公表（2025年4月）<\/h4>\n<ul>\n<li>有識者（FA・仲介者、金融機関、会計士、弁護士等）との議論を経て、<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>2025年4月<\/strong>に「スキルマップ」を取りまとめ公表。<\/li>\n<li>併せて専門人材の<strong>使命<\/strong>と<strong>倫理・行動規範<\/strong>を、中小M&amp;Aガイドライン等を踏まえ整理。<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>3本柱<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>使命<\/td>\n<td>専門的知見と高い倫理観を基に、依頼者・関係者に質の高いマッチングとプロセスの着実・円滑な実行支援を提供。依頼者の利益実現と、事業・希少な経営資源の引継ぎによる事業の継続・成長に貢献し、もって<strong>国民経済の発展に寄与<\/strong><\/td>\n<\/tr>\n<tr>\n<td>倫理・行動規範<\/td>\n<td><strong>中小M&amp;Aガイドライン（第3版）<\/strong>、既存国家資格の倫理規程、中小M&amp;A実務等を踏まえ整理<\/td>\n<\/tr>\n<tr>\n<td>知識・スキルマップ<\/td>\n<td>M&amp;A一般実務に加え企業経営、会計・ファイナンス、税務、法務等。M&amp;Aプロセス（事前相談、バリュエーション、マッチング、基本合意、DD、最終契約、クロージング、PMI）ごとに体系化<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料1 p.4）<\/p>\n<h4>米国のM&amp;Aブローカー資格制度（IBBA）<\/h4>\n<ul>\n<li>自主規制団体<strong>IBBA<\/strong>（International Business Brokers Association）が認定資格「The Certified Business Intermediary」を運営。<\/li>\n<li>資格保有者は倫理規定等の遵守を要件にIBBAに登録され、所在地等で検索可能な形でHPに掲載。<\/li>\n<li>取得要件：筆記試験＋業務経験（<strong>売り手の主担当として3件以上<\/strong>の取引に関与した証明）＋IBBA運営教育機関での単位取得（職業倫理、財務分析、企業価値評価、法務、税務等）。<\/li>\n<li><strong>3年ごと<\/strong>の更新が必要。協会の定款や倫理規定等への違反が資格剥奪要件。<\/li>\n<\/ul>\n<p>（資料1 p.5）<\/p>\n<h4>資格制度の創設・資格者への規律付け<\/h4>\n<ul>\n<li>質の高いアドバイザーを<strong>可視化<\/strong>する観点から、「中小M&amp;Aアドバイザー試験」を<strong>まずは民間ベースでの取組<\/strong>として創設する方向で検討<strong>すべき<\/strong>。<\/li>\n<li>個人レベルの倫理観浸透のため、「中小M&amp;Aアドバイザー登録制」も併せて運用開始<strong>すべき<\/strong>。登録者はデータベースで氏名公表、倫理規定違反時は<strong>取消し・氏名公表<\/strong>。<\/li>\n<li>将来的にはガイドラインで資格取得を<strong>推奨<\/strong>し、M&amp;A支援機関登録制度の登録機関について<strong>登録資格保有者の割合の公表<\/strong>等を検討。<\/li>\n<\/ul>\n<p>（資料1 p.6）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>中小M&amp;Aアドバイザー試験（仮称）のイメージ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>人材像<\/td>\n<td>依頼者や他の支援機関・士業専門家等と調整・連携しつつ、M&amp;A取引を円滑・適正に遂行し、顧客利益の最大化に貢献できる人材<\/td>\n<\/tr>\n<tr>\n<td>試験範囲<\/td>\n<td>①M&amp;A実務　②財務・税務　③バリュエーション・DD　④法務（民法、会社法、労働法、株式譲渡契約等）　⑤行動規範・倫理<\/td>\n<\/tr>\n<tr>\n<td>士業との関係<\/td>\n<td>士業等が支援する場合も、連携にあたりアドバイザーが習得すべき知識を問う<\/td>\n<\/tr>\n<tr>\n<td>難易度<\/td>\n<td>1担当者として顧客にM&amp;A支援を行う上で把握すべき知識等<\/td>\n<\/tr>\n<tr>\n<td>形式<\/td>\n<td>選択式・短答式（CBT試験を想定）、合計50問程度<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料1 p.6）<span class=\"note-tag\">注<\/span>資料1時点の構想は5科目・50問程度。最新の試験概要は資料2で確認。<\/p>\n<ul>\n<li>登録制の要件：倫理規程の遵守／違反時の処分（氏名公表等）への同意／<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>定期的な講習の受講（概ね3〜5年ごと）<\/strong>。<\/li>\n<li>登録のメリット：データベース（M&amp;A支援機関登録制度DBを想定）で倫理規程を遵守するアドバイザーとして氏名公表／資格証の交付。<\/li>\n<\/ul>\n<p>（資料1 p.6）<\/p>\n<h3 id=\"n5-3\">市場に係る施策②：仲介・FA手数料の公表と競争<\/h3>\n<ul>\n<li>規律浸透の上で、業務の内容・質と対価としての手数料の両面で<strong>公正な競争<\/strong>が促進されることが重要。<\/li>\n<li>登録機関には<strong>標準的な手数料の報告<\/strong>を求め、HP上のデータベース（ma-shienkikan.go.jp/search）で公表。最低手数料の水準や報酬基準額の種類等で検索可能。<\/li>\n<li>業務内容の詳細や質（成約実績等）も可視化し、更なるデータベース改修を予定。<\/li>\n<\/ul>\n<p>（資料1 p.7）<\/p>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>最低手数料の設定が一般的。<strong>500万円や1,000万円<\/strong>で設定する機関が多い。<\/li>\n<li>500万円設定：仲介16%／FA15%／金融機関33%。1,000万円設定：仲介15%／FA14%／金融機関29%。<\/li>\n<li>集計数（累計）：仲介2,145件、FA880件、金融機関595件（1機関最大4通りの手数料体系）。<\/li>\n<\/ul>\n<p>（資料1 p.8）<\/p>\n<ul>\n<li>手数料は業務内容・質に応じ<strong>競争的に設定されるべき<\/strong>。前提として<strong>比較可能性の高い形<\/strong>で示される必要がある。<\/li>\n<li>算定は<strong>レーマン方式<\/strong>が多く、報酬基準額は<strong>株価<\/strong>が多い。料率例は5億円以下5%～100億超1%。<\/li>\n<li>レーマンの4類型（株価／オーナー受取額／企業価値／移動総資産）、料率表、登録機関の採用割合の詳細は → 財務・税務タブ参照。<\/li>\n<\/ul>\n<p>（資料1 p.9）<\/p>\n<h3 id=\"n5-4\">売手に係る施策：小規模案件・地域偏在・支援体制<\/h3>\n<h4>成約案件の規模別内訳<\/h4>\n<ul>\n<li>民間支援機関の成約は<strong>従業員6〜20人、21〜100人<\/strong>の売手が多く、小規模案件は少ない。<span class=\"star\" aria-label=\"頻出\">★<\/span>特に<strong>小規模事業者のM&amp;Aの拡大が必要<\/strong>。<\/li>\n<li><strong>事業承継・引継ぎ支援センターは小規模案件を中心に支援<\/strong>。<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>従業員規模<\/th>\n<th>中小企業全体（経営者60歳未満）<\/th>\n<th>同（60歳以上）<\/th>\n<th>民間M&amp;A支援機関の成約<\/th>\n<th>センターの成約<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1〜5人<\/td>\n<td>60%<\/td>\n<td>70%<\/td>\n<td>22%<\/td>\n<td>54%<\/td>\n<\/tr>\n<tr>\n<td>6〜20人<\/td>\n<td>26%<\/td>\n<td>19%<\/td>\n<td>46%<\/td>\n<td>34%<\/td>\n<\/tr>\n<tr>\n<td>21〜100人<\/td>\n<td>9%<\/td>\n<td>6%<\/td>\n<td>26%<\/td>\n<td>12%<\/td>\n<\/tr>\n<tr>\n<td>101人〜<\/td>\n<td>5%<\/td>\n<td>4%<\/td>\n<td>5%<\/td>\n<td>1%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料1 p.10）全体は2023年6月現在（中小企業実態基本調査）、成約は2023年度。民間は登録制度の実績報告（譲渡側）、センターは事業評価報告書による。<\/p>\n<h4>M&amp;Aアドバイザーの地域偏在<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>三大都市圏に<strong>約85%<\/strong>が集中、地方は<strong>約15%<\/strong>。内訳は東京大都市圏74%、大阪大都市圏8%、中京大都市圏4%。<\/li>\n<li>参考：三大都市圏集中度は弁護士77%、税理士69%、公認会計士88%。<\/li>\n<li>M&amp;A支援専従者10人未満の県もある。<\/li>\n<li>企業1万社当たりM&amp;A件数（2023年度）：最多<strong>東京都23.6<\/strong>、岩手県17.7、神奈川県17.0、大阪府15.1…最少<strong>島根県4.1<\/strong>。<\/li>\n<li>センターは三大都市圏以外も含め<strong>面的な支援<\/strong>を実施。<\/li>\n<\/ul>\n<p>（資料1 p.11）アドバイザー数は登録機関の専従者（2023年度実績報告で稼働のあった機関のみ）。<\/p>\n<h4>M&amp;A実施意向のある企業の相談先<\/h4>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>売手・買手とも「<strong>金融機関に探索を依頼<\/strong>」が最多。<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>候補先の探し方<\/th>\n<th>買い手<\/th>\n<th>売り手<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>金融機関に探索を依頼<\/td>\n<td>77%<\/td>\n<td>60%<\/td>\n<\/tr>\n<tr>\n<td>専門仲介機関<\/td>\n<td>45%<\/td>\n<td>43%<\/td>\n<\/tr>\n<tr>\n<td>自社で独自に探索<\/td>\n<td>38%<\/td>\n<td>33%<\/td>\n<\/tr>\n<tr>\n<td>公認会計士・税理士等<\/td>\n<td>17%<\/td>\n<td>20%<\/td>\n<\/tr>\n<tr>\n<td>取引先等<\/td>\n<td>15%<\/td>\n<td>11%<\/td>\n<\/tr>\n<tr>\n<td>同業他社等<\/td>\n<td>12%<\/td>\n<td>12%<\/td>\n<\/tr>\n<tr>\n<td>事業承継・引継ぎ支援センター<\/td>\n<td>9%<\/td>\n<td>14%<\/td>\n<\/tr>\n<tr>\n<td>オンラインマッチングサイト<\/td>\n<td>7%<\/td>\n<td>3%<\/td>\n<\/tr>\n<tr>\n<td>商工会議所・商工会<\/td>\n<td>7%<\/td>\n<td>10%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料1 p.12）東京商工リサーチ調査（2020年11月）、回答数 売り手147者・買い手693者。出所は2021年度版中小企業白書。<\/p>\n<h4>金融機関のトレーニー派遣事例<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>機関<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>北都信用金庫（京都府）<\/td>\n<td>京都北部の事業者数減少に危機感。<strong>2022年4月<\/strong>事業承継支援課を設立。2022年度に京都府センターへ派遣。帰任後、セミナー・個別相談会・センター連携のM&amp;A、後継者育成（アトツギ甲子園経済産業大臣賞を輩出）。センター等<strong>12機関<\/strong>と連携、M&amp;Aシニアエキスパート資格取得を支援<\/td>\n<\/tr>\n<tr>\n<td>蒲郡信用金庫（愛知県）<\/td>\n<td>東三河の事業者数衰退に危機感。目的は「承継後もその企業が地域で元気に存続してもらう事」。<strong>2022年4月<\/strong>愛知県センターへ派遣。業務規程策定、営業店向け勉強会、センター連携体制を構築<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>方向性：<strong>金融機関を巻き込んだ形でセンターの体制を強化すべき<\/strong>。<\/li>\n<\/ul>\n<p>（資料1 p.13）<\/p>\n<h4>中小企業診断士による事業承継・M&amp;A支援<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>最も得意な分野を「事業承継・M&amp;A」とする診断士は<strong>2.4%<\/strong>と少ないが、今後最も活動したい分野としては<strong>16.3%で最多<\/strong>。<\/li>\n<li>得意分野上位：経営企画・戦略立案23.3%、財務13.3%、販売・マーケティング11.9%。活動希望2位は経営企画・戦略立案15.5%。<\/li>\n<li>方向性：<strong>士業も巻き込んだ形でセンターの体制強化<\/strong>を図るべき。<\/li>\n<\/ul>\n<p>（資料1 p.14）中小企業診断協会調査（令和3年5月、調査時期令和2年11月、回答 得意分野1,848人・活動希望1,770人）。<\/p>\n<h3 id=\"n5-5\">買手に係る施策：税制・融資・補助金・PMI・ファンド<\/h3>\n<h4>中堅・中小グループ化税制<\/h4>\n<ul>\n<li>正式名は中小企業事業再編投資損失準備金の拡充及び延長。<strong>令和6年度税制改正<\/strong>で創設。<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>区分<\/th>\n<th>積立率<\/th>\n<th>据置期間<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>当初制度<\/td>\n<td>株式取得価額の<strong>70%まで<\/strong><\/td>\n<td><strong>5年間<\/strong>（その後5年間均等取崩し）<\/td>\n<\/tr>\n<tr>\n<td>拡充枠（複数回M&amp;A）<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>2回目90%、3回目以降100%<\/strong><\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>10年<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>積立時は損金算入、取崩し時に益金算入。<\/li>\n<li>認定からM&amp;A実施までの期間を短縮できるよう計画認定プロセスを見直し。<\/li>\n<li>簿外債務発覚等で減損処理した場合や取得株式を売却した場合等は準備金を取り崩す。<\/li>\n<li><strong>産業競争力強化法で新設する認定<\/strong>が要件。拡充枠は<strong>過去5年以内のM&amp;A実績<\/strong>が必要。<\/li>\n<li><strong>中堅企業は2回目以降のM&amp;Aから<\/strong>活用可能。<\/li>\n<\/ul>\n<p>（資料1 p.16）<\/p>\n<h4>日本政策金融公庫のM&amp;A資金<\/h4>\n<ul>\n<li>事業承継・集約・活性化支援資金の第三者承継関係（従業員承継・M&amp;A）の融資実績は<strong>2020年度以降大幅に伸長<\/strong>。<\/li>\n<li>実績：2020年度241億円／2021年度352億円／2022年度371億円／2023年度414億円。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>2024年2月<\/strong>、融資上限枠を<strong>7.2億円⇒14.4億円<\/strong>と大幅拡充。<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>対象者<\/td>\n<td>事業の買手（従業員等の個人含む）及び売手<\/td>\n<\/tr>\n<tr>\n<td>資金使途<\/td>\n<td>運転資金（買収後の運転資金等）／設備資金（株式の取得費用、M&amp;A後の設備投資等）<\/td>\n<\/tr>\n<tr>\n<td>融資限度額<\/td>\n<td>中小企業事業 <strong>14億4千万円<\/strong>／国民生活事業 <strong>7千2百万円<\/strong><\/td>\n<\/tr>\n<tr>\n<td>融資期間<\/td>\n<td>設備資金<strong>20年以内<\/strong>／長期運転資金<strong>10年以内<\/strong>（いずれも据置5年以内）<\/td>\n<\/tr>\n<tr>\n<td>適用利率<\/td>\n<td>基準利率（<strong>上限2.5%<\/strong>）〜特利①②<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料1 p.17）貸出類型2,3について記載。<\/p>\n<h4>事業承継・M&amp;A補助金（令和6年度補正予算）<\/h4>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>事業承継促進・専門家活用・PMI推進・廃業・再チャレンジの<strong>4つの枠<\/strong>がある。<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>枠・類型<\/th>\n<th>対象<\/th>\n<th>補助率<\/th>\n<th>補助上限<\/th>\n<th>対象経費の例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>①事業承継促進枠<\/td>\n<td>事業承継前の設備投資。<strong>5年以内に予定している親族内承継、従業員承継<\/strong><\/td>\n<td>1/2 or 2/3<\/td>\n<td>800〜1,000万円<\/td>\n<td>店舗改装工事費用、機械装置の調達費用<\/td>\n<\/tr>\n<tr>\n<td>②専門家活用枠（買い手支援類型）<\/td>\n<td>M&amp;A<\/td>\n<td>1/3・1/2 or 2/3<\/td>\n<td>600万〜800万円、<strong>2,000万円<\/strong>（100億企業要件を満たす場合）<\/td>\n<td>仲介・FA手数料、価値算定費用、DD費用（800万円を上限に、DD費用申請時は200万円加算）<\/td>\n<\/tr>\n<tr>\n<td>②専門家活用枠（売り手支援類型）<\/td>\n<td>M&amp;A<\/td>\n<td>1/2 or 2/3<\/td>\n<td>600万〜800万円<\/td>\n<td>同上<\/td>\n<\/tr>\n<tr>\n<td>③PMI推進枠（PMI専門家活用類型）<\/td>\n<td>M&amp;A<\/td>\n<td>1/2<\/td>\n<td>150万円<\/td>\n<td>PMI専門家への委託費用<\/td>\n<\/tr>\n<tr>\n<td>③PMI推進枠（事業統合投資類型）<\/td>\n<td>M&amp;A<\/td>\n<td>1/2 or 2/3<\/td>\n<td>800〜1,000万円<\/td>\n<td>設備の規格統一など事業統合に係る設備投資費用<\/td>\n<\/tr>\n<tr>\n<td>④廃業・再チャレンジ枠<\/td>\n<td>事業譲渡に伴う廃業（一部譲り受け）／廃業後の再チャレンジ（新規事業）<\/td>\n<td>1/2 or 2/3<\/td>\n<td>150万円<\/td>\n<td>廃業支援費、在庫処分費、解体費、現状回復費<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料1 p.18）<\/p>\n<ul>\n<li>専門家活用枠のFA・仲介手数料は、<strong>登録FA・仲介業者のもののみ<\/strong>が補助対象（令和3年度当初予算より）。（資料2 p.20）<\/li>\n<\/ul>\n<h4>M&amp;Aの満足度とPMI<\/h4>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>M&amp;A成立前から早期にPMIの検討を開始した企業ほど<\/strong>、満足度が期待以上となった割合が高い。<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>PMI検討開始時期<\/th>\n<th>期待以上<\/th>\n<th>期待を下回った<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>基本合意前<\/td>\n<td>74.8%<\/td>\n<td>25.2%<\/td>\n<\/tr>\n<tr>\n<td>基本合意〜クロージング後<\/td>\n<td>61.8%<\/td>\n<td>38.2%<\/td>\n<\/tr>\n<tr>\n<td>検討していない<\/td>\n<td>48.4%<\/td>\n<td>51.6%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>成立前に実施したPMI関連の取組<\/th>\n<th>満足<\/th>\n<th>不満<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>相手方経営者とのコミュニケーション<\/td>\n<td>63.2%<\/td>\n<td>49.6%<\/td>\n<\/tr>\n<tr>\n<td>経営者へのヒアリング等による現状把握<\/td>\n<td>32.9%<\/td>\n<td>33.6%<\/td>\n<\/tr>\n<tr>\n<td>相手方従業員とのコミュニケーション<\/td>\n<td>28.4%<\/td>\n<td>18.9%<\/td>\n<\/tr>\n<tr>\n<td>相手方キーパーソンの把握<\/td>\n<td>26.9%<\/td>\n<td>20.9%<\/td>\n<\/tr>\n<tr>\n<td>相手方重要取引先の把握<\/td>\n<td>23.5%<\/td>\n<td>24.6%<\/td>\n<\/tr>\n<tr>\n<td>相手方との経営方針のすり合わせ<\/td>\n<td>18.6%<\/td>\n<td>15.6%<\/td>\n<\/tr>\n<tr>\n<td>相手方経営者の処遇明確化<\/td>\n<td>17.1%<\/td>\n<td>15.2%<\/td>\n<\/tr>\n<tr>\n<td>特に実施項目なし<\/td>\n<td>9.8%<\/td>\n<td>19.7%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料1 p.19）2023年度版・2024年版中小企業白書。<\/p>\n<h4>PMI推進枠の新設<\/h4>\n<ul>\n<li>M&amp;A成立はスタートライン。補助金に<strong>PMI推進枠を新設（12次公募回から公募予定）<\/strong>。<\/li>\n<li>PMIのイメージ：経営統合（経営の方向性・体制・仕組みの整備）／業務統合（事業機能：売上・コストシナジー／管理機能：人事・労務、会計・財務、法務、IT等）。<\/li>\n<li>流れ：現状把握→方針検討→計画策定→実行。シナジー例：販売チャネル拡大、共同調達、共同配送、販売拠点の統廃合、システム共通化。<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>類型<\/th>\n<th>内容・対象経費<\/th>\n<th>補助上限<\/th>\n<th>補助率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>PMI専門家活用類型<\/td>\n<td>PMIを専門家に委託する費用（委託費、外注費等、PMIに限る）<\/td>\n<td><strong>150万円<\/strong><\/td>\n<td><strong>1/2<\/strong><\/td>\n<\/tr>\n<tr>\n<td>事業統合投資類型<\/td>\n<td>シナジー実現のための設備投資（設備費等）<\/td>\n<td><strong>800万円<\/strong>（賃上げ実施時<strong>1,000万円<\/strong>）<\/td>\n<td>小規模事業者<strong>2/3<\/strong>、それ以外<strong>1/2<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料1 p.20）<\/p>\n<h4>PEファンドによる投資の動向<\/h4>\n<ul>\n<li>買手として事業会社に加え<strong>ファンドも選択肢<\/strong>となりうる。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>PE市場拡大は<strong>500億円超の大規模案件<\/strong>がけん引。<strong>250億円未満<\/strong>の小規模案件への投資増加は限定的。<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>期間（3年平均）<\/th>\n<th>合計<\/th>\n<th>250億円未満<\/th>\n<th>250〜500億円<\/th>\n<th>500億円超<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2012-2015年<\/td>\n<td>0.6兆円<\/td>\n<td>0.18<\/td>\n<td>0.14<\/td>\n<td>0.23<\/td>\n<\/tr>\n<tr>\n<td>2016-2019年<\/td>\n<td>1.3兆円<\/td>\n<td>0.27<\/td>\n<td>0.13<\/td>\n<td>0.91<\/td>\n<\/tr>\n<tr>\n<td>2020-2023年<\/td>\n<td>3.3兆円<\/td>\n<td>0.46<\/td>\n<td>0.21<\/td>\n<td>2.67<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>対GDP比のPE投資規模（2019〜2023年平均）：<strong>日本0.4%<\/strong>、米国1.3%、英国1.9%、フランス0.9%、ドイツ0.7%、韓国0.7%。諸外国比で未だ低水準。<\/li>\n<\/ul>\n<p>（資料1 p.21）資料：日本プライベートエクイティ協会。<\/p>\n<h4>地銀によるファンド出資<\/h4>\n<ul>\n<li>銀行による投資専門会社の株式保有が緩和され、<strong>地銀のファンド出資が増加傾向<\/strong>。<\/li>\n<li>地銀出資の事業承継ファンドはバイアウトファンドより<strong>規模が小さく<\/strong>、与信先等の後継者不在企業を対象に<strong>小規模案件も含めて<\/strong>投資。<\/li>\n<li>出資件数（累積）：2018年以前13／2019年23／2020年34／2021年54／2022年69。<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>ファンド規模<\/th>\n<th>PEファンド（バイアウト、38者）<\/th>\n<th>地銀出資事業承継ファンド（71者）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>最多帯<\/td>\n<td>200億円超55%<\/td>\n<td>10〜30億円37%<\/td>\n<\/tr>\n<tr>\n<td>その他<\/td>\n<td>100〜200億円18%、50〜100億円13%、30〜50億円8%<\/td>\n<td>5億円以下19%、5〜10億円26%、30億円超10%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料1 p.22）中小企業庁「PEファンド等による投資に関する実態調査」（2022年6月）等。<\/p>\n<h4>サーチファンド<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>サーチファンド<\/strong>：経営者を目指す個人（<strong>サーチャー<\/strong>）が投資家の支援を受けながら中小企業をM&amp;Aし、自ら経営に携わる投資の仕組み。<\/li>\n<li>サーチャーがファンドを組成し、①探索資金②承継資金の出資を募る。出資は<strong>ファンド・オブ・サーチファンド<\/strong>（複数のサーチファンドに出資）を通じ投資家から受ける。<\/li>\n<li>承継後に企業価値を向上させ、株式売却益等で利益を得る。アントレプレナー人材を後継者として呼び込む仕組み。<\/li>\n<li><strong>PEとVCの中間<\/strong>の新たな投資業態で、起業と対をなす「アントレプレナーシップ」発揮手法の<strong>第二の柱<\/strong>。日本では事例が出始めたばかりで、<strong>成功モデルの創出が課題<\/strong>。<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>ファンドオブ・サーチファンド<\/th>\n<th>設立<\/th>\n<th>規模<\/th>\n<th>M&amp;A件数<\/th>\n<th>サーチャー<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>YMFG Searchファンド<\/td>\n<td>2019/2<\/td>\n<td>10億円（投資完了）<\/td>\n<td>6件<\/td>\n<td>8名<\/td>\n<\/tr>\n<tr>\n<td>サーチファンド・ジャパン<\/td>\n<td>①2021/12　②2023/3　③2023/11<\/td>\n<td>①約10億円（投資完了）②約30億円③約10億円<\/td>\n<td>6件<\/td>\n<td>9名<\/td>\n<\/tr>\n<tr>\n<td>ジャパン・サーチファンド・プラットフォーム<\/td>\n<td>2021/12<\/td>\n<td>約58億円<\/td>\n<td>4件<\/td>\n<td>7名<\/td>\n<\/tr>\n<tr>\n<td>地域未来共創Searchファンド<\/td>\n<td>2022/2<\/td>\n<td>約55億円<\/td>\n<td>3件<\/td>\n<td>5名<\/td>\n<\/tr>\n<tr>\n<td>M&amp;A BASEサーチファンド<\/td>\n<td>2024/8（予定）<\/td>\n<td>約40億円<\/td>\n<td>1件<\/td>\n<td>2名<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料1 p.23）<\/p>\n<h3 id=\"n5-6\">御議論いただきたい論点<\/h3>\n<p>市場に係る施策：<\/p>\n<ol>\n<li>スキルマップを踏まえ<strong>中小M&amp;Aアドバイザー試験<\/strong>を創設する方向で検討（受験者ターゲット、科目等）。<\/li>\n<li>倫理規程遵守・定期講習受講を要件とする<strong>登録制<\/strong>も運用開始。登録者はDBで氏名公表、違反時は取消し・氏名公表。倫理規程はGLや他資格制度を踏まえ検討。<\/li>\n<li>浸透策：将来的にGLで資格取得を推奨、登録機関の資格保有者割合の公表等。<\/li>\n<li>公正な競争を喚起する手数料のあり方の検討。<\/li>\n<li>地域・小規模案件への支援拡充のため、<strong>地域金融機関や地域の士業を巻き込んでセンターの体制を強化<\/strong>。<\/li>\n<\/ol>\n<p>買手に係る施策：<\/p>\n<ol>\n<li>成長・生産性向上を実現するM&amp;Aの推進策、経営能力に優れた買手を増やす施策。<\/li>\n<li><strong>従業員やサーチャー等の個人によるM&amp;Aを支援するサーチファンド型ファンド<\/strong>や、小規模案件を手掛ける<strong>事業承継ファンド<\/strong>への支援強化。<\/li>\n<\/ol>\n<p>（資料1 p.25）<\/p>\n<h2 id=\"n5-7\">支援機関登録制度・手数料の状況・センター施策（資料2・2026年3月17日）<\/h2>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>M&amp;A支援機関登録制度は<strong>2021年8月<\/strong>開始、登録は<strong>約3,400者（うち専門業者約1,200者）<\/strong>。不適切な支援の情報提供は続き、特に<strong>営業以外の事案は減少していない<\/strong>。<\/p>\n<h3 id=\"n5-8\">M&amp;A支援機関登録制度<\/h3>\n<ul>\n<li><strong>2021年8月<\/strong>、中小M&amp;Aガイドラインの遵守宣言等を要件とする制度の運用を開始。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>2026年3月現在<\/strong>、M&amp;A専門業者（仲介・FA）<strong>約1,200者<\/strong>を中心に、<strong>約3,400者<\/strong>が登録。<\/li>\n<li>トラブルを抱える中小企業者等からの情報を受け付ける「<strong>情報提供受付窓口<\/strong>」も設置。<\/li>\n<\/ul>\n<p>（資料2 p.20）<\/p>\n<h4>登録制度の対象<\/h4>\n<ul>\n<li><strong>FA業務又は仲介業務を行う者<\/strong>。業種は問わず、仲介業務を行う金融機関も対象。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>DDのみを行う士業等専門家などは対象としない<\/strong>。<\/li>\n<li>事業承継・M&amp;A補助金（専門家活用枠）では、FA・仲介の手数料は<strong>登録FA・仲介業者に係るもののみ<\/strong>補助対象（<strong>令和3年度当初予算<\/strong>より）。<\/li>\n<\/ul>\n<p>（資料2 p.20）<\/p>\n<h4>主な登録要件・遵守事項<\/h4>\n<ol>\n<li>中小M&amp;Aガイドラインの遵守を宣言し、その旨を自社HP等で公表すること<\/li>\n<li>支援業務に関する事項や手数料体系、支援業務実績等を提出し、中小企業庁が適切な形で公表することに同意すること<\/li>\n<li>遵守事項の違反等が認められた場合に、事務局からの注意・指示等に対する適切な再発防止策等を講じていること<\/li>\n<li>仲介・FA業務の契約締結に際し、顧客に対しGLの遵守について<strong>事前に説明する<\/strong>こと　等<\/li>\n<\/ol>\n<ul>\n<li>要件を充足しない／しなくなった場合は<strong>登録の取消し<\/strong>等を実施。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>2023年5月に取消要領を公表<\/strong>。<\/li>\n<li>トラブル事例は個別事業者が特定されない形に加工して公表し、他の中小企業者への注意喚起等に用いる。<\/li>\n<\/ul>\n<p>（資料2 p.20）<\/p>\n<h3 id=\"n5-9\">中小M&amp;A市場の現状（情報提供窓口）<\/h3>\n<ul>\n<li>窓口の情報はヒアリング等を行い、内容に応じ<strong>注意や対策の実施等の指示<\/strong>、場合により<strong>登録の取消し<\/strong>。<\/li>\n<li>GL改訂等で一部事業者に実務慣行の変化（<strong>重要事項説明が実施されるようになった<\/strong>等）を確認。<\/li>\n<li>他方、不適切な支援の情報は引き続き寄せられ、<span class=\"star\" aria-label=\"頻出\">★<\/span>より深刻なトラブルに繋がりやすい<strong>営業以外の事案は減少していない<\/strong>。<\/li>\n<li>登録制度のあり方を改めて検討する必要があるのではないか。<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>年度<\/th>\n<th>合計<\/th>\n<th>営業に関する事案<\/th>\n<th>営業以外に関する事案<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2021年度（11月に窓口設置）<\/td>\n<td>7<\/td>\n<td>―<\/td>\n<td>―<\/td>\n<\/tr>\n<tr>\n<td>2022年度<\/td>\n<td>18<\/td>\n<td>―<\/td>\n<td>―<\/td>\n<\/tr>\n<tr>\n<td>2023年度<\/td>\n<td>32<\/td>\n<td>13<\/td>\n<td>19<\/td>\n<\/tr>\n<tr>\n<td>2024年度<\/td>\n<td>126<\/td>\n<td>91<\/td>\n<td>35<\/td>\n<\/tr>\n<tr>\n<td>2025年度（2月現在）<\/td>\n<td>80<\/td>\n<td>48<\/td>\n<td>32<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.21）内訳は2023年度以降のみ記載。<strong>2024年8月にGL改訂（第3版）<\/strong>。GL違反に該当しない情報は除外。未登録機関の情報は計上。複数機関に関する情報は機関数だけ重複計上。<\/p>\n<h4>窓口に寄せられた事例<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>区分<\/th>\n<th>事例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>営業<\/td>\n<td>社長に取り次ぐよう<strong>10分以上<\/strong>執拗に迫り、最終的に一方的に通話を切断<\/td>\n<\/tr>\n<tr>\n<td>営業<\/td>\n<td>停止意思の表明が社内共有されず、別の担当者が再度架電<\/td>\n<\/tr>\n<tr>\n<td>営業<\/td>\n<td>再発防止基準を設けたが同種の苦情が再発し、基準の合理性に疑問<\/td>\n<\/tr>\n<tr>\n<td>営業<\/td>\n<td>個人名義で会社名を出さず、社長の自宅宛てにゆうパックや「重要書類」と明記した郵便物を度々送付<\/td>\n<\/tr>\n<tr>\n<td>営業以外<\/td>\n<td>GLの方式での<strong>重要事項説明を不実施<\/strong>のまま、<strong>専任条項・中途解約違約金条項<\/strong>のある契約を締結<\/td>\n<\/tr>\n<tr>\n<td>営業以外<\/td>\n<td>重要事項説明や契約締結を対面で実施せず<strong>電話で<\/strong>行い、説明不足のクレーム<\/td>\n<\/tr>\n<tr>\n<td>営業以外<\/td>\n<td><strong>専任条項がないにもかかわらず<\/strong>、選ばれなかった機関が<strong>テール条項<\/strong>に基づき請求<\/td>\n<\/tr>\n<tr>\n<td>営業以外<\/td>\n<td>企業概要書からの試算額で<strong>中間金<\/strong>を受領し、後の算定で試算額を下回っても返還されない<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.21）→ 規範の観点は倫理タブ参照。<\/p>\n<h3 id=\"n5-10\">手数料の状況（要点）<\/h3>\n<ul>\n<li>案件規模が小さいと最低手数料が適用され手数料率が高くなる。総資産レーマン採用機関は手数料が高い傾向。<\/li>\n<li>「提供したサービスの価値や業務内容・役割を反映した報酬」とすべきではないかと問題提起。詳細は → 財務・税務タブ。<\/li>\n<\/ul>\n<p>（資料2 p.23〜27）<\/p>\n<h3 id=\"n5-11\">事業承継・引継ぎ支援センター等の施策<\/h3>\n<h4>ワンストップ支援<\/h4>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>全国47都道府県<\/strong>に設置。親族内・従業員・第三者の別を問わず、ニーズの掘り起こしから支援まで<strong>ワンストップ<\/strong>で実施。<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>段階<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>掘り起こし<\/td>\n<td>各都道府県の<strong>事業承継ネットワーク<\/strong>参加機関（自治体、金融機関、商工団体、士業等）が<strong>事業承継診断<\/strong>を実施し、必要な場合センターへ<strong>トスアップ<\/strong>。セミナー・勉強会は<strong>2024年度に全国約1,400回<\/strong><\/td>\n<\/tr>\n<tr>\n<td>相談<\/td>\n<td>窓口や個別相談会で対応。進行中の第三者承継の手続等について<strong>セカンドオピニオン<\/strong>として相談も可能<\/td>\n<\/tr>\n<tr>\n<td>支援（親族内承継）<\/td>\n<td>事業承継計画策定等を支援<\/td>\n<\/tr>\n<tr>\n<td>支援（第三者・従業員承継）<\/td>\n<td>連携する士業、FA、仲介事業者、連携プラットフォーマーへの紹介、センター内マッチング。起業家と後継者不在事業者を結ぶ「<strong>後継者人材バンク<\/strong>」<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.29）<\/p>\n<h4>トレーニー制度<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>センターで<strong>令和8年度より地域金融機関を中心にトレーニーを受入れ<\/strong>。<strong>令和8年度上期は11行<\/strong>から受入れ予定。金融機関以外からの受入れも検討。<\/li>\n<li>流れ：①事業承継診断（商工会・商工会議所、日本公庫、信金・信組、地銀）→②橋渡し（トレーニー→センター）→③支援。<\/li>\n<li>効果：期間中はノウハウ獲得・関係機関との関係構築。帰任後は<strong>専門部署の中心人物<\/strong>として活躍し、ネットワークと連携した支援を推進。<\/li>\n<\/ul>\n<p>（資料2 p.30）<\/p>\n<h4>自治体向け手引き・実証事業<\/h4>\n<ul>\n<li>自治体には域内外の関係機関を束ねる「<strong>ハブ機能<\/strong>」と機運醸成の「<strong>意識啓発機能<\/strong>」が期待される。<\/li>\n<li>中小企業庁は基礎自治体職員向け「地域特性をふまえた事業承継支援体制の構築に向けた手引き」等を<strong>令和7年3月<\/strong>に公表。実証を続けアップデート。<\/li>\n<li>実証例（岩手県釜石市）：「かまいしのミライ」を考える会（釜石市・東北経済産業局）で金・官・士の意識や課題感を確認し、独自パンフレットを作成。<\/li>\n<\/ul>\n<p>（資料2 p.31）<\/p>\n<h4>Vアップ支援事業（IM作成費用の補助）<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>税理士等の認定経営革新等支援機関が行う<strong>早期経営改善支援（Vアップ事業）<\/strong>で、事業承継の検討にあたり<strong>企業概要書（IM）を作成する費用を最大10万円（補助率2/3）補助する枠<\/strong>を措置。<\/li>\n<li>IM費用補助の運用条件（予定）：（1）センターでの窓口相談　（2）センターに出す「相談申込書兼同意書」の写しを活性化協議会へ提出。<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>新<\/th>\n<th>旧<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>金融支援<\/td>\n<td>なし（借換・新規融資は可）<\/td>\n<td>不要<\/td>\n<\/tr>\n<tr>\n<td>同意<\/td>\n<td>同意不要（メイン金融機関に計画提出）<\/td>\n<td>同意不要（メイン金融機関に計画提出）<\/td>\n<\/tr>\n<tr>\n<td>計画書内容<\/td>\n<td>俯瞰図、基本方針、<strong>アクションプラン及びモニタリング計画<\/strong>、<strong>貸借対照表・損益計算書等の計数計画<\/strong>、資金繰表 等<\/td>\n<td>俯瞰図、基本方針、アクションプラン、損益計画、資金繰表 等<\/td>\n<\/tr>\n<tr>\n<td>計画期間<\/td>\n<td><strong>3年〜5年<\/strong>程度<\/td>\n<td>1年〜5年程度<\/td>\n<\/tr>\n<tr>\n<td>計画案事前提出<\/td>\n<td>金融機関提出前に協議会へ提出し確認・助言<\/td>\n<td>なし<\/td>\n<\/tr>\n<tr>\n<td>伴走支援：対象<\/td>\n<td>計画の実行そのものも対象<\/td>\n<td>計画の実行は含まない<\/td>\n<\/tr>\n<tr>\n<td>伴走支援：期間<\/td>\n<td><strong>3年<\/strong>（少なくとも<strong>年2回以上<\/strong>）<\/td>\n<td>1年<\/td>\n<\/tr>\n<tr>\n<td>伴走支援：終了<\/td>\n<td>特段の事情（破産等）がある場合<strong>のみ<\/strong><\/td>\n<td>特段の事情・計画の上振れ（好転）<\/td>\n<\/tr>\n<tr>\n<td>費用補助（2/3）：計画策定<\/td>\n<td><strong>50万円<\/strong><\/td>\n<td>15万円<\/td>\n<\/tr>\n<tr>\n<td>費用補助：伴走支援<\/td>\n<td>期中・決算期合計<strong>30万円<\/strong><\/td>\n<td>期中5万円／決算期5万円<\/td>\n<\/tr>\n<tr>\n<td>費用補助：金融機関交渉（経保）<\/td>\n<td>10万円<\/td>\n<td>10万円<\/td>\n<\/tr>\n<tr>\n<td>費用補助：事業承継（IM作成）<\/td>\n<td><strong>10万円<\/strong><\/td>\n<td>―<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.32）Vアップ【金融機関以外】の新旧比較。計数計画は原図では「実態貸借対照表、損益計算書等の計数計画」。新制度の金融支援はリスケが対象外、同意は借換・新規融資時に債権者側から要請がある場合は任意で実施。<\/p>\n<ul>\n<li>Vアップ事業は、認定支援機関の支援で<strong>資金繰り計画・ビジネスモデル俯瞰図・アクションプラン<\/strong>等の策定を支援。<\/li>\n<li>費用の<strong>2/3<\/strong>を<strong>中小企業活性化協議会<\/strong>が支援（事業者負担1/3）。<\/li>\n<li>2023年4月より「収益力改善支援に関する実務指針」（<strong>2022年12月策定<\/strong>）に沿って支援。<\/li>\n<li><strong>2024年2月から2028年1月末まで<\/strong>、時限的に<strong>民間金融機関による支援も補助対象<\/strong>。<\/li>\n<li>支援決定件数（年度）：2017年度5,949／2018年度4,126／2019年度1,715／2020年度1,405／2021年度1,321／2022年度2,053／2023年度754／2024年度771。累計18,094件（2025年3月末）。2025年度第Ⅱ四半期は225件（速報）。<\/li>\n<li>申請者の年商：1億未満59.6%／1〜3億25.8%／3〜5億7.0%／5〜10億5.0%／10億以上2.6%。<\/li>\n<li>申請者の従業員規模：10名未満63.7%／10〜20名18.4%／20〜50名13.3%／50〜100名3.3%／100名以上1.3%。<\/li>\n<li>経営者保証解除を目指した金融機関交渉は別途補助（上限10万円）。<\/li>\n<\/ul>\n<p>（資料2 p.33）<\/p>\n<h4>M&amp;A広報の強化・M&amp;Aキャラバン<\/h4>\n<ul>\n<li>売手の不安解消には、雇用維持・賃上げ事例や取引関係維持事例等、<strong>成功事例を広く浸透<\/strong>させ心理的ハードルを下げることが重要。<\/li>\n<li>テレビ番組・CM：センターの支援事例を<strong>ドラマ形式<\/strong>で紹介。放送後にセンター相談に繋がった事業者もいる。<\/li>\n<li><strong>M&amp;Aキャラバン<\/strong>：M&amp;Aを経験した譲渡側・譲受側が登壇し実体験を紹介するシンポジウム等を各地で開催（例：那覇市、広島市）。<\/li>\n<\/ul>\n<p>（資料2 p.34）<\/p>\n<h4>エッセンシャルサービス（ES）への支援強化<\/h4>\n<ul>\n<li><strong>ES<\/strong>：食品等の生活必需品の卸小売、交通（バス、タクシー等）、運送、ガソリンスタンド、自動車整備その他の生活維持に必要なサービス。<\/li>\n<li>人口減少・少子高齢化で維持が困難になるおそれ。供給不足は<strong>過疎化が進む地方で先行<\/strong>。<\/li>\n<li>採算性向上の手法：①<strong>業務効率化・省力化<\/strong>②<strong>広域化<\/strong>③<strong>多角化<\/strong>。事業承継・会社設立・合併等の組織再編（事業主体の合理化）で実現されることも。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>2025/12/18<\/strong> 産構審・地域生活維持小委 中間報告 → <strong>2026/3/6<\/strong> 「<strong>認定エッセンシャルサービス制度<\/strong>」の創設を盛り込んだ<strong>産業競争力強化法等改正法案を閣議決定<\/strong>。<\/li>\n<li>センターも新たな支援枠組みと連携し、ESへの支援強化を図る必要があるのではないか。<\/li>\n<li>支援事例：<strong>三重県津市三杉町<\/strong>の後継者不在のSS経営者が商工会に相談。センターが承継先を探し、業界紙掲載を機に<strong>2023年10月<\/strong>、石油製品配送会社がSS運営を承継。株式譲渡契約締結までフォローし、看板も企業名もそのまま残した。<\/li>\n<\/ul>\n<p>（資料2 p.35）<\/p>\n<h4>産業競争力強化法等改正法案の概要（参考）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>柱<\/th>\n<th>主な内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. 設備投資の促進【産競法】<\/td>\n<td>「大胆な投資促進税制」：投資利益率15%以上、投資規模35億円（中小5億円）以上等で<strong>即時償却又は税額控除7%等<\/strong>（令和11年3月31日までに確認、確認日から5年以内に取得等）。国際経済事情激変型は最大3年間の税額控除繰越。公庫ツーステップローン等の金融支援<\/td>\n<\/tr>\n<tr>\n<td>2. 供給網の強靱化【貿易保険法】<\/td>\n<td>特別な引受業務の創設（日米の戦略的投資イニシアティブを想定）、特別勘定・国債交付<\/td>\n<\/tr>\n<tr>\n<td>3. 産業基盤の整備【地域未来投資促進法】<\/td>\n<td>緑地規制の特例緩和、データセンターへの工業用水供給義務付け、産業用地整備の計画承認制度 等<\/td>\n<\/tr>\n<tr>\n<td>4. 生活基盤の維持【産競法】<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>（1）<strong>生活維持役務等供給事業効率化の計画認定制度<\/strong>（合理化・多角化・広域化。金融支援、事業協同組合等の設立要件緩和（発起人数<strong>4人→3人<\/strong>）、<strong>事業譲渡の債権者承認手続の簡素化<\/strong>等）／（2）<strong>支援機関の認定制度<\/strong>（商工団体、地域金融、生協、農協等。市町村等は協議会を組織可）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.36）<\/p>\n<ul>\n<li>ES政策の方向性（中間報告、令和7年12月18日）：①ESの公益性を国が制度的に位置づける②採算性向上支援と多様な主体（協同組合、NPO、地域密着型企業等）の参画促進③商工団体・地域金融機関・郵便局等が参画する支援体制の整備。（資料2 p.37）<\/li>\n<\/ul>\n<h4>再生M&amp;Aへの支援強化<\/h4>\n<ul>\n<li>「中小企業における事業再生支援のあり方検討会」で、<span class=\"star\" aria-label=\"頻出\">★<\/span>再生M&amp;A（スポンサー型再生支援）が着目され、スポンサー探しのノウハウからセンターへの期待が高まる。<\/li>\n<li>センターと活性化協議会の橋渡し件数（2024年度）：<strong>センター→協議会230件、協議会→センター452件<\/strong>。<\/li>\n<li>特に<strong>協議会との実践的な連携のあり方<\/strong>を検討すべきではないか。<\/li>\n<\/ul>\n<p>（資料2 p.38）<\/p>\n<ul>\n<li>協議会は<strong>2003年<\/strong>発足。当初は債権放棄等の抜本再生の金融調整が中心だったが、収益力改善や民間への助言（<strong>405事業<\/strong>）に拡大。<\/li>\n<li>実態と課題（4つ）：①早期着手②再生支援の規律・伴走③協議会支援力④地域の再生支援機能。<\/li>\n<li>対応の方向性：予兆管理と規律を強化し、民間の再生支援を拡大して「<strong>成長型再生<\/strong>」を進めるべき。<\/li>\n<\/ul>\n<p>（資料2 p.39）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>分類<\/th>\n<th>14の具体策（主な施策）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 早期着手に向けた予兆管理強化等<\/td>\n<td>①事業者自身による財務状況の可視化（AX/DX/IT化支援等）／②支援機関・金融機関のモニタリング・予兆管理強化に基づく早期持込み（信用保証制度の創設等）／③協議会事業の認知拡大<\/td>\n<\/tr>\n<tr>\n<td>2 再生支援の規律・伴走強化<\/td>\n<td>④状況に応じた支援メニューの提供（収益力改善支援の金融支援の原則廃止に伴うプレ再生の運用柔軟化等）／⑤出口の明確化（支援回数ルール厳格化、プレDIP等）／⑥再生計画の実効性向上の伴走支援強化<\/td>\n<\/tr>\n<tr>\n<td>3 協議会支援力強化<\/td>\n<td>⑦全国本部による指導・育成機能強化／⑧民間支援拡大に向けた助言機能強化（Vアップ事業等の活用）／⑨協議会のハブ機能強化／⑩利便性向上・業務効率化（WEB面談等）<\/td>\n<\/tr>\n<tr>\n<td>4 地域の再生支援機能強化<\/td>\n<td>⑪金融機関の再生支援への意識・対応強化／⑫地域の再生支援人材育成（<strong>トレーニー制度、補佐人制度<\/strong>等）／<span class=\"star\" aria-label=\"頻出\">★<\/span>⑬<strong>他機関連携の強化<\/strong>（センターやよろず支援拠点との連携）／<span class=\"star\" aria-label=\"頻出\">★<\/span>⑭<strong>再生M&amp;A案件の促進に向けた環境整備<\/strong>（再生M&amp;Aのガイドライン等の整理、インセンティブ付与等の検討）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.39〜40）⑬⑭は図中で赤枠強調。<\/p>\n<h3 id=\"n5-12\">株式価値・手数料の簡易計算ツール（要点）<\/h3>\n<ul>\n<li>登録制度の取引データを基に、株式価値と仲介・FA手数料を<strong>参考値<\/strong>として試算できるツールを<strong>M&amp;A支援機関登録制度HPへ実装予定<\/strong>。<\/li>\n<li>いずれも対象は<strong>黒字企業の株式譲渡<\/strong>のみ。入力項目・計算方法の詳細は → 財務・税務タブ。<\/li>\n<\/ul>\n<p>（資料2 p.42〜50）<\/p>\n<h3 id=\"n5-13\">御議論いただきたい論点<\/h3>\n<ol>\n<li>資格制度の運用、登録・管理制度：①WGの試験コンセプト・内容の留意事項　②登録・管理制度で更に検討すべき事項<\/li>\n<li>M&amp;A支援機関登録制度：①現状の業界を過去や他業界と比較してどう捉えるか　②不適切な事例が続く中で求められる対応<\/li>\n<li>手数料：①初期的分析の受け止めと更なる分析の観点　②<strong>支援の質を重視した競争環境<\/strong>構築のために求められること<\/li>\n<li>センター等の施策：①現在の取組の意義・改善点　②自走・持続可能な支援体制のため自治体に期待すること　③今後のセンターの役割（例：<strong>ES支援、再生M&amp;A、初期的PMI支援<\/strong>）<\/li>\n<\/ol>\n<p>（資料2 p.52）<\/p>\n<h2 id=\"n5-14\">支援機関の種類と支援ツール<\/h2>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>支援機関は種類ごとに特色と役割が異なり、自ら対応が難しい場合は<strong>速やかに他の支援機関につなぐ<\/strong>ことが重要。相談先に迷ったら、まず<strong>事業承継・引継ぎ支援センター<\/strong>に相談する。<\/p>\n<p>M&amp;A専門業者（GL第2章Ⅱ）の行動指針は → 倫理タブ・実務タブ参照。<\/p>\n<h3 id=\"n5-15\">金融機関（GL第2章Ⅲ）<\/h3>\n<h4>特色<\/h4>\n<ul>\n<li>貸付先（与信先）の<strong>詳細な財務情報等<\/strong>を保有し、特に地方で重要なネットワークを持つ。<\/li>\n<li><strong>与信業務を含む固有業務に付随して<\/strong>M&amp;Aの助言等ができ、<strong>自らの顧客基盤から候補先を抽出<\/strong>できる。<\/li>\n<li>業態・規模ごとにノウハウ・体制は全く異なり、取組姿勢もまちまち。<\/li>\n<li>期待：<strong>中長期的な視野<\/strong>で支援し、<strong>地域経済の活性化<\/strong>に貢献すること。<\/li>\n<\/ul>\n<p>（GL p.105-106）<\/p>\n<h4>主な支援内容<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>支援<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>気付き・見える化・磨き上げ<\/td>\n<td>初期相談は通常<strong>営業店<\/strong>。本部専門部署と連携し気付きの機会を提供することが<strong>望まれる<\/strong>。「ローカルベンチマーク」等で見える化・磨き上げを支援することが<strong>望まれる<\/strong><\/td>\n<\/tr>\n<tr>\n<td>実行支援<\/td>\n<td>仲介・FA業務ではGLの行動指針に留意し意思決定を支援することが<strong>求められる<\/strong>。<span class=\"star\" aria-label=\"頻出\">★<\/span>比較的小規模な案件の仲介では<strong>公平・中立な第三者<\/strong>として<strong>側面支援<\/strong>が<strong>望まれる<\/strong>。十分な情報を提供する<strong>必要がある<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ポストM&amp;A支援<\/td>\n<td>譲渡対価を融資で調達するケースが相当数あり、ニーズや見通しを踏まえ融資検討が<strong>望まれる<\/strong>。「経営デザインシート」等の活用も<\/td>\n<\/tr>\n<tr>\n<td>経営者保証<\/td>\n<td>①実施前に解除・移行の相談を受けた場合、②実施後に決算書等で経営者の変更を把握した場合、「経営者保証に関するガイドライン」及び「特則」に留意し適切な対応を検討することが<strong>求められる<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.106-107）<\/p>\n<h4>留意点<\/h4>\n<ul>\n<li>他機関（士業、M&amp;A専門業者、センター、中小企業活性化協議会、信用保証協会等）との連携が<strong>望まれる<\/strong>。<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>支援体制の段階<\/th>\n<th>取組<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>これから本格整備<\/td>\n<td>案件をセンターに<strong>紹介<\/strong>し、顧客の同意を得て面談に極力同席。同意があればセンターから情報のフィードバック<\/td>\n<\/tr>\n<tr>\n<td>構築中<\/td>\n<td>センターの<strong>登録機関等に登録<\/strong>し、センターのデータベース（<strong>NNDB<\/strong>）等を活用<\/td>\n<\/tr>\n<tr>\n<td>運用中<\/td>\n<td>ビジネスベースでの対応が困難なもの等をセンター等と連携<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>情報管理：銀行法、監督指針等に即し<strong>徹底する必要がある<\/strong>。<\/li>\n<li>対外的：秘密保持義務と<strong>ファイア・ウォール<\/strong>。地方はノンネームでも特定されやすく、開示情報をよく吟味し早急にNDAを締結する等が<strong>求められる<\/strong>。<\/li>\n<li>対内的：<strong>融資部門<\/strong>と<strong>仲介・FA部門<\/strong>の間に<strong>情報隔壁（チャイニーズ・ウォール）<\/strong>を設けることが<strong>望ましい<\/strong>。債権者として<strong>構造的に優越的地位<\/strong>に立ちやすいため、利益相反管理態勢の整備が<strong>求められる<\/strong>。<\/li>\n<li>事業再生局面：有利な債権回収のため早期M&amp;Aを促す動機が構造的に強い。<strong>譲り渡し側の真意に即した<\/strong>支援が<strong>求められる<\/strong>。仲介・FAとなるには利益相反管理態勢上の整理が求められる。<\/li>\n<\/ul>\n<p>（GL p.107-109）<\/p>\n<h3 id=\"n5-16\">商工団体（GL第2章Ⅳ）<\/h3>\n<ul>\n<li>商工会議所、商工会、中小企業団体中央会、商店街振興組合連合会等。<span class=\"star\" aria-label=\"頻出\">★<\/span>中小企業の<strong>最も身近な相談窓口<\/strong>で、公的支援制度を<strong>最も熟知した支援機関の1つ<\/strong>。<\/li>\n<li>経営指導員等は一般的な経営相談の過程で事業承継ニーズを認識できる立場。<\/li>\n<li>気付きの機会：研修や巡回指導で課題を認識する<strong>必要がある<\/strong>。特に<strong>60歳を超える経営者<\/strong>に気付きの機会を積極的に提供することが<strong>期待される<\/strong>。<\/li>\n<li>橋渡し：適切な支援機関への橋渡しが<strong>望ましい<\/strong>。橋渡し後も経営指導等で<strong>接点を持ち続けることが求められる<\/strong>。見える化・磨き上げの伴走支援も期待。<\/li>\n<li>留意点：①会員同士が顔見知りで特定・伝達されやすく、情報の取扱いに<strong>注意が必要<\/strong>　②センターや士業等との意思疎通が<strong>望まれる<\/strong>。<\/li>\n<\/ul>\n<p>（GL p.109-110）<\/p>\n<h3 id=\"n5-17\">士業等専門家（GL第2章Ⅴ）<\/h3>\n<p>記載順は<strong>五十音順<\/strong>：公認会計士／税理士／中小企業診断士／弁護士／その他（行政書士・司法書士・社会保険労務士）。職責を果たしつつ士業間での連携が期待される。（GL p.111）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>士業<\/th>\n<th>根拠・使命<\/th>\n<th>M&amp;Aでの中心的役割<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>公認会計士<\/td>\n<td>公認会計士法第1条（監査及び会計の専門家として独立した立場で財務情報の信頼性を確保）<\/td>\n<td>譲り渡し側の財務情報の信頼性向上、社内体制構築助言、譲渡スキーム検討。<strong>財務DD・バリュエーション<\/strong><\/td>\n<\/tr>\n<tr>\n<td>税理士<\/td>\n<td>税理士法第1条（税務の専門家、独立した公正な立場）、第2条（税務代理・税務書類作成・税務相談＋付随業務）<\/td>\n<td><strong>顧問税理士<\/strong>として身近な相談役。課税関係の助言、税務DD<\/td>\n<\/tr>\n<tr>\n<td>中小企業診断士<\/td>\n<td><strong>中小企業支援法第11条<\/strong>、<strong>経済産業大臣<\/strong>が登録<\/td>\n<td>磨き上げ、<strong>ビジネス（事業）DD<\/strong>、ポストM&amp;A（PMI）、精神面のサポート<\/td>\n<\/tr>\n<tr>\n<td>弁護士<\/td>\n<td>弁護士法第1条（基本的人権の擁護、社会正義の実現）、第3条<\/td>\n<td>利害関係の調整・代理交渉、手法選択・スキーム策定、<strong>契約書作成・法務DD<\/strong><\/td>\n<\/tr>\n<tr>\n<td>その他<\/td>\n<td>行政書士（許認可）、司法書士（登記）、社会保険労務士（労働・社会保険）<\/td>\n<td>他機関と連携し職責に応じた<strong>適正な支援が望まれる<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.111, 115-116, 121, 123, 130）<\/p>\n<h4>公認会計士の主な支援内容<\/h4>\n<ol>\n<li><strong>適正な財務書類の作成支援<\/strong>：中小会計指針・中小会計要領等に基づかないと不利な条件や不成立のおそれ。事前の作成支援が<strong>望まれる<\/strong>。<\/li>\n<li><strong>プレM&amp;A支援<\/strong>：ア コーポレート・ガバナンス（株主名簿・議事録等）の整備　イ 株式・事業用資産等の整理（名義株、所在不明株主、簿外債務等）　ウ 内部統制の構築・運営　エ 経営者保証解除の助言。<\/li>\n<li><strong>バリュエーション<\/strong>：企業価値評価ガイドラインを踏まえ事案に応じ実施することが<strong>望まれる<\/strong>（コスト・マーケット・インカムの3アプローチ。詳細は → 財務・税務タブ）。<\/li>\n<li><strong>財務DD<\/strong>：主に<strong>基本合意締結後<\/strong>に実施。調査範囲は依頼者と事前合意（<strong>合意された手続<\/strong>）。簿外債務発見で株式譲渡から<strong>事業譲渡<\/strong>へ変更も。譲り渡し側が行う<strong>セラーズDD<\/strong>もある。<\/li>\n<li><strong>債務超過企業の支援<\/strong>：実態貸借対照表・清算貸借対照表の作成、民事再生の<strong>財産評定<\/strong>等。<strong>早期の支援が重要<\/strong>。<\/li>\n<li><strong>ポストM&amp;A支援<\/strong>：体制整備、シナジー検証、グループ経営計画策定の支援が<strong>望ましい<\/strong>。<\/li>\n<\/ol>\n<ul>\n<li>他機関（センター、活性化協議会等）と連携して業務を進める<strong>必要がある<\/strong>。<\/li>\n<\/ul>\n<p>（GL p.111-115）<\/p>\n<h4>税理士の主な支援内容<\/h4>\n<ul>\n<li>DDやバリュエーションは直接の業務ではなく、積極的な税理士は限られる。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>顧問業務の範囲外なら、<strong>事前に顧問先に説明し、業務内容や報酬等の了承を得ることも必要<\/strong>。<\/li>\n<\/ul>\n<ol>\n<li><strong>適正な税務申告書等の作成<\/strong>：不正会計等を確認した場合の助言義務（善管注意義務）。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>税理士法第41条の3<\/strong>：不正の事実を知ったときは<strong>直ちに是正するよう助言しなければならない<\/strong>。従わないまま業務を継続すると<strong>第45条<\/strong>（不真正税務書類作成禁止）違反のおそれ。ガバナンス整備や資産整理も望まれる。<\/li>\n<li><strong>経営者保証解除の支援<\/strong>：助言が<strong>望ましい<\/strong>。<\/li>\n<li><strong>課税関係を踏まえた助言・提案<\/strong>：株式譲渡は分離課税20.315%、事業譲渡は法人税等、役員退職慰労金の組合せ、印紙税等（詳細は → 財務・税務タブ）。<\/li>\n<li><strong>中小企業等経営強化法の特例<\/strong>：経営力向上計画の認定で、税制措置（登録免許税・不動産取得税の特例等）、金融支援（公庫の低利融資、信用保証等）、法的支援（<strong>許認可の承継の特例<\/strong>、組合発起人数の特例、免責的債務引受の特例）。税の特例には<strong>適用期限がある<\/strong>。<\/li>\n<li><strong>税務DD<\/strong>：潜在的税務リスクの把握。調査手続5項目（①経営陣・顧問税理士へのインタビュー②過去の申告書レビュー③過去の税務調査・訴訟の把握④過去の組織再編・資本取引の処理⑤欠損金の使用可能性・税制適用状況）。顧問税理士はDDに<strong>積極的に協力することが望ましい<\/strong>。<\/li>\n<li><strong>バリュエーション<\/strong>：<span class=\"star\" aria-label=\"頻出\">★<\/span>中小M&amp;Aでは<strong>時価純資産法<\/strong>が多い。財基通の純資産価額方式に類似。判断困難なら公認会計士等との連携が<strong>必要<\/strong>。<\/li>\n<li><strong>マッチングサイト等の活用<\/strong>：M&amp;Aプラットフォームや日税連の「<strong>担い手探しナビ<\/strong>」の活用が期待。<\/li>\n<li><strong>債務超過企業の支援<\/strong>：簿価で債務超過でも時価で資産超過の場合も。廃業相談時にM&amp;Aの可能性も<strong>検討することが期待される<\/strong>。情報開示に<strong>積極的に協力する必要がある<\/strong>。<\/li>\n<\/ol>\n<ul>\n<li>連携：<strong>一人で抱え込まず<\/strong>公的機関や弁護士等と連携。表明保証条項の誤解防止のため弁護士等と連携した助言が期待。<\/li>\n<\/ul>\n<p>（GL p.115-121）<\/p>\n<h4>中小企業診断士の主な支援内容<\/h4>\n<ol>\n<li><strong>気付きの機会の提供<\/strong>：事業計画・事業承継計画策定の働き掛け等が<strong>望まれる<\/strong>。<\/li>\n<li><strong>M&amp;A前後の価値向上<\/strong>：見える化には「<strong>ローカルベンチマーク<\/strong>」（健康診断）、ポストM&amp;Aには「<strong>経営デザインシート<\/strong>」を活用。<\/li>\n<li><strong>企業概要書の作成支援<\/strong>：<strong>正確な企業概要書の作成に留意する必要がある<\/strong>。<\/li>\n<li><strong>経営者保証解除の支援<\/strong>：助言が<strong>望ましい<\/strong>。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>ビジネス（事業）DD<\/strong>：商流・収益構造の整理、外部・内部環境からの<strong>競争力<\/strong>分析、将来性や<strong>シナジーの検討<\/strong>。<\/li>\n<li><strong>債務超過企業の支援<\/strong>：活性化協議会や再生専門弁護士との連携が重要。<\/li>\n<\/ol>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>診断士は財務・税務・法務について各士業と<strong>同等の専門知識を有するものではない<\/strong>ため、公認会計士・税理士・弁護士等と<strong>連携する必要がある<\/strong>。<\/li>\n<\/ul>\n<p>（GL p.121-123）<\/p>\n<h4>弁護士の主な支援内容<\/h4>\n<ol>\n<li><strong>株式・事業用資産等の整理・集約<\/strong>\n   - 名義株：<strong>平成2年（1990年）商法改正前<\/strong>は発起人<strong>7人以上<\/strong>・各1株以上引受けが必要だったため多い。名義書換等を進める<strong>必要がある<\/strong>。\n   - <span class=\"star\" aria-label=\"頻出\">★<\/span>所在不明株主：<strong>5年以上<\/strong>通知が到達しない株主の株式は競売・売却・自社株買い（会社法第197条）。<strong>都道府県知事の認定<\/strong>で期間を<strong>5年→1年<\/strong>に短縮する特例（<strong>令和3年8月<\/strong>施行、経営承継円滑化法）。\n   - 株式集約：全株式譲渡は全株主から買取り又は委任状取得が必要。全事業の事業譲渡は特別決議（出席株主の議決権3分の2以上）が必要な場合があり、総議決権3分の2以上の確保が望まれる。スクイーズ・アウト（会社法第179条以下、第180条）も。\n   - 事業用資産：譲り受け側が利用可能となるよう確認・整理し、会社と経営者の資産を切り分ける。<\/li>\n<li><strong>契約書等の作成・リーガルチェック<\/strong>：支援することが<strong>望ましい<\/strong>（NDA・基本合意書・株式譲渡契約書・事業譲渡契約書）。<\/li>\n<li><strong>経営者保証解除の支援<\/strong>：助言のほか<strong>金融機関との協議・交渉を行うことが望ましい<\/strong>。<\/li>\n<li><strong>法務DD<\/strong>：株式譲渡では全般的・網羅的に実施。観点6項目：<strong>株式・会社組織、重要な契約、資産及び負債、人事・労務、訴訟・紛争、許認可・コンプライアンス・環境問題<\/strong>。<\/li>\n<li><strong>債務超過企業に対する支援<\/strong>（次の表）。<\/li>\n<\/ol>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>観点<\/th>\n<th>要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ア 資金繰りへの配慮<\/td>\n<td>資金繰り表を<strong>月次に留まらず日次<\/strong>まで把握し、資金ショート時期を確認する<strong>必要がある<\/strong>。買掛金・給料の未払や手形の不渡りリスクに注意<\/td>\n<\/tr>\n<tr>\n<td>イ 私的整理手続の検討<\/td>\n<td>リスケジュールを経て債務減免の同意を得る。<strong>官報等で公表されない<\/strong>。活性化協議会や特定調停等の<strong>準則型私的整理<\/strong>を目指すことが<strong>望まれる<\/strong>。<strong>第二会社方式<\/strong>が多い<\/td>\n<\/tr>\n<tr>\n<td>ウ 法的整理手続の検討<\/td>\n<td>民事再生等。毀損が不可避のため<strong>可能な限り私的整理を目指すことが望ましい<\/strong>。やむを得ない場合は<strong>プレパッケージ型<\/strong>を目指す。スポンサー選定の透明性・公正性を説明できる必要<\/td>\n<\/tr>\n<tr>\n<td>エ 適正対価での事業譲渡等<\/td>\n<td>不当廉価は詐害行為取消権（民法第424条）、否認権（民事再生法第127条等）、譲受側も会社法第22条・第23条の2のリスク。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>少なくとも清算価値を相当程度超える金額<\/strong>が要求される<\/td>\n<\/tr>\n<tr>\n<td>オ 一部事業譲渡等の検討<\/td>\n<td>黒字部門のみ譲渡で雇用の受皿確保・対価最大化、廃業費用へ充当。役員・従業員への譲渡も選択肢。最良の選択を検討することが<strong>望ましい<\/strong><\/td>\n<\/tr>\n<tr>\n<td>カ 税務上の注意点<\/td>\n<td><strong>債務免除益<\/strong>への課税。相殺できる欠損金（青色欠損金、場合により期限切れ欠損金）や資産評価損の有無が重要<\/td>\n<\/tr>\n<tr>\n<td>キ 経営者保証に関する処理<\/td>\n<td>経営者保証GLで保証債務を免除され<strong>自由財産以上の資産<\/strong>を残す方策を検討する<strong>必要がある<\/strong>。中小企業庁の整理手順（令和4年4月1日改訂）、日弁連の特定調停手引と1〜3（令和2年2月19日改訂）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>連携：公認会計士・税理士等と<strong>積極的に連携するよう心掛けるべき<\/strong>。不動産を含む場合や会社分割・合併等は、<strong>最終契約締結前の早い時期に司法書士に照会・確認しておくことが望ましい<\/strong>。<\/li>\n<\/ul>\n<p>（GL p.123-130）<\/p>\n<h3 id=\"n5-18\">M&amp;Aプラットフォーマー（GL第2章Ⅵ）<\/h3>\n<ul>\n<li>オンラインでマッチングの場を運営する者。事業者が<strong>自ら登録<\/strong>し候補先を探せ、<strong>簡便かつ低コスト<\/strong>。専門業者への依頼を躊躇する中小企業を<strong>後押しできる立場<\/strong>。<\/li>\n<li>支援内容：①マッチング機会の提供（利便性・安全性の向上が<strong>望まれる<\/strong>）　②成約事例の発信等による意識醸成（コンテンツ・ツールの提供が<strong>望まれる<\/strong>）。<\/li>\n<li>留意点：\n  1. <strong>サービス内容の明確化<\/strong>：仕組み・開示範囲・料金体系を分かりやすく表示するよう<strong>努めるべき<\/strong>。\n  2. <strong>掲載案件の信頼性<\/strong>：①実在性の確認（<strong>法人番号等<\/strong>による確認の仕組み、意思確認）②進捗状況の確認が<strong>望まれる<\/strong>。\n  3. <strong>他の支援機関との連携<\/strong>：複数プラットフォーム間の連携、①専門業者・士業との連携②IT活用による手続支援③センターとの連携が<strong>望まれる<\/strong>。<\/li>\n<\/ul>\n<p>（GL p.130-132）<\/p>\n<h3 id=\"n5-19\">M&amp;Aプラットフォームの利用（GL第1章Ⅲ）<\/h3>\n<ul>\n<li>市場は比較的新しく、仕組み・留意点が今後大きく変わり得る。<\/li>\n<li>特徴：<strong>低コスト<\/strong>。譲り渡し側は<strong>無料登録が相当数<\/strong>。廃業検討中の小規模事業者も活用を積極的に検討することが<strong>望まれる<\/strong>。<\/li>\n<li>情報の取扱い：ノンネームでも個者特定リスクがあり、開示範囲を<strong>慎重に検討しておく必要がある<\/strong>。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>ある程度公開されても受忍できる程度の情報しか掲載しない<\/strong>慎重な姿勢が望まれる（クローズドでも同様）。<\/li>\n<li>選択：法人・個人問わず＝可能性拡大／法人のみ＝安全性向上。FAを介してのみのものもある。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>真に極秘で進めたい案件は向いておらず<\/strong>、仲介者・FAとの使い分けが必要。<\/li>\n<li>支援は<strong>マッチングまでに留まることが一般的<\/strong>。その後はセンターや士業等の支援を受けて進めることが<strong>望ましい<\/strong>。<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>対象<\/th>\n<th>手数料体系<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>譲り渡し側<\/td>\n<td><strong>一切の手数料が発生しないケースが多い<\/strong>（将来は増える可能性）<\/td>\n<\/tr>\n<tr>\n<td>譲り受け側<\/td>\n<td><strong>完全成功報酬型<\/strong>が多い。手数料は<strong>譲渡額等の数％程度<\/strong>（最低手数料の有無は様々）<\/td>\n<\/tr>\n<tr>\n<td>共通<\/td>\n<td>仲介者・FA・士業に依頼する場合の報酬は<strong>別途必要<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>具体例：譲渡額<strong>2,000万円<\/strong>の株式譲渡。譲り渡し側は手数料なし。譲り受け側は成功報酬3%（最低30万円税抜）で、2,000万円×3%×110%＝<strong>66万円（税込）<\/strong>。<\/li>\n<\/ul>\n<p>（GL p.57-60）<\/p>\n<h3 id=\"n5-20\">事業承継・引継ぎ支援センター（GL第1章Ⅳ）<\/h3>\n<ul>\n<li><strong>経済産業省の委託を受けた機関<\/strong>（都道府県商工会議所、県の財団等）が実施。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>全国<strong>48か所<\/strong>（各都道府県1か所、<strong>東京都は2か所<\/strong>）。地域金融機関OBや士業等の専門家が常駐。<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>段階<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>①初期相談対応（一次対応）<\/td>\n<td>親族内・従業員承継・廃業等も含め幅広く受付。<strong>意思決定前でも対応<\/strong>。他の仲介者・FAの助言について<strong>セカンド・オピニオン<\/strong>も可能<\/td>\n<\/tr>\n<tr>\n<td>②登録機関等による支援（二次対応）<\/td>\n<td>M&amp;Aを意思決定した場合、<strong>登録機関等又は連携M&amp;Aプラットフォーマー<\/strong>へ橋渡し。契約を締結するため<strong>手数料が発生<\/strong><\/td>\n<\/tr>\n<tr>\n<td>③センターによる支援（三次対応）<\/td>\n<td>適当な登録機関等がない場合や、相手が決まっている場合に<strong>センターが直接支援<\/strong>。外部専門家の利用は<strong>費用負担が生じる<\/strong>が、必要に応じ活用が<strong>望ましい<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>データベース：許諾範囲に応じ全国のセンター内共有又は登録機関等・連携PFへ開示。掲載は<strong>ノンネーム情報のみ<\/strong>。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>後継者人材バンク<\/strong>：後継者不在の中小企業（主として個人事業者）と創業希望者（事業を営んでいない個人）をマッチング。創業のリスクを抑えられる。<\/li>\n<li><strong>経営資源の引継ぎ<\/strong>：廃業希望者の事業・事業用資産等の引継ぎも支援。<\/li>\n<\/ul>\n<p>（GL p.60-62）<\/p>\n<ul>\n<li>参考資料3（センター連絡先一覧）：全<strong>48センター<\/strong>（47都道府県＋<strong>東京都多摩<\/strong>）を全4ページの表で掲載。多くは商工会議所内等に所在。センターのポータルは中小企業基盤整備機構のサイト（shoukei.smrj.go.jp）。（参考資料3 p.1〜4/4、参考資料8）<\/li>\n<\/ul>\n<h3 id=\"n5-21\">問い合わせ窓口（GL第1章Ⅵ）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>区分<\/th>\n<th>窓口<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>意見・相談<\/td>\n<td>事業承継・引継ぎ支援センター<\/td>\n<td>中小M&amp;A全般。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>どの窓口に相談するか迷う際はまずこちら<\/strong><\/td>\n<\/tr>\n<tr>\n<td>意見・相談<\/td>\n<td>日本弁護士連合会（ひまわりほっとダイヤル）<\/td>\n<td>日弁連及び全国<strong>52<\/strong>の弁護士会。電話で面談予約。法的な助言を求める場合<\/td>\n<\/tr>\n<tr>\n<td>不適切事例・苦情<\/td>\n<td>M&amp;A支援機関登録制度（情報提供受付窓口）<\/td>\n<td>登録仲介者・FAの不適切事例を受付。注意喚起や登録制度の運営に利用<\/td>\n<\/tr>\n<tr>\n<td>不適切事例・苦情<\/td>\n<td>M&amp;A仲介協会（苦情相談窓口）<\/td>\n<td><strong>幹事会員及び正会員の仲介者<\/strong>に関する苦情を受付。対象会員に通知し対応の検討を促す<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>不適切事例・苦情の窓口は<strong>紛争の解決や助言を目的とするものではない<\/strong>。<\/li>\n<\/ul>\n<p>（GL p.75-76）<\/p>\n<h3 id=\"n5-22\">日本公庫「事業承継マッチング支援」（参考資料5）<\/h3>\n<ul>\n<li>実施：日本公庫<strong>国民生活事業本部<\/strong>。<strong>令和2年4月<\/strong>から全国規模（<strong>沖縄県を除く<\/strong>）で実施。<\/li>\n<li>後継者不在の小規模事業者と譲受希望者を<strong>引き合わせ<\/strong>、譲渡手続を支援。<\/li>\n<li>対象：原則として公庫に<strong>借入残高がある企業<\/strong>。残高がなくても商工会議所・商工会、生活衛生同業組合、税理士等からの<strong>紹介<\/strong>があれば利用可。<\/li>\n<li>専門家の支援が必要な場合は<strong>センターへ取次ぎ<\/strong>。<\/li>\n<li>特徴：①事業を譲り受けて<strong>創業する者も対象<\/strong>　②<strong>専任担当者<\/strong>が候補先を探す　③譲渡・譲受とも<strong>無料<\/strong>。<\/li>\n<\/ul>\n<p>（参考資料5 p.1/1）<\/p>\n<h3 id=\"n5-23\">円滑な廃業を支援する施策5種（参考資料8）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>施策<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>①経営安定特別相談室<\/td>\n<td>商工会議所・都道府県商工会連合会が設置。士業等が法的手続を助言。<strong>相談無料<\/strong>。財務分析、手形処理・事業転換の指導、債権者への協力要請、倒産関係法の助言等<\/td>\n<\/tr>\n<tr>\n<td>②経営者保証に関するガイドライン<\/td>\n<td>①法人と経営者が分離されていれば保証を求めない②早期決断時は自由財産<strong>99万円<\/strong>に加え年齢等に応じ<strong>約100万〜約360万円<\/strong>の生計費や「華美でない」自宅を残す検討③返済しきれない残額は<strong>原則免除<\/strong><\/td>\n<\/tr>\n<tr>\n<td>③センター（経営資源の引継ぎ）<\/td>\n<td>廃業希望者の事業・事業用資産等の引継ぎも相談対応。マッチングの相手探しや経営資源の引継ぎを支援（参照先：中小企業基盤整備機構のセンターサイト）<\/td>\n<\/tr>\n<tr>\n<td>④地域経済活性化支援機構（特定支援業務）<\/td>\n<td>経営者保証GLに則り<strong>企業債務と保証債務の一体整理<\/strong>。<strong>自己破産を回避<\/strong>し私財を多く残せる<\/td>\n<\/tr>\n<tr>\n<td>⑤日弁連（ひまわりほっとダイヤル）<\/td>\n<td>全国52の弁護士会。廃業に伴う債務整理や経営資源の引継ぎの法的助言<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料8 p.1〜2/2）<\/p>\n<h3 id=\"n5-24\">サポートツール3種（参考資料9）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>ツール<\/th>\n<th>所管<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>ローカルベンチマーク（ロカベン）<\/td>\n<td>経済産業省<\/td>\n<td>企業の「<strong>健康診断<\/strong>」ツール。<strong>事業性評価の「入口」<\/strong><\/td>\n<\/tr>\n<tr>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>経営デザインシート<\/td>\n<td><strong>内閣府知的財産戦略推進事務局<\/strong><\/td>\n<td>事業の将来像を構想し戦略を策定。譲り受け側が<strong>統合後の将来を構想する場面<\/strong>等で活用<\/td>\n<\/tr>\n<tr>\n<td>スマートSMEサポーター<\/td>\n<td>経済産業省中小企業庁<\/td>\n<td>生産性向上のITツールを提供するITベンダー等を<strong>認定する制度<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（参考資料9 p.1/1）<\/p>\n<h3 id=\"n5-25\">日税連「担い手探しナビ」（参考資料10）<\/h3>\n<ul>\n<li>日本税理士会連合会が<strong>平成30年10月<\/strong>から運用。顧問税理士が関与先の窓口となるマッチングサイト。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>利用申請をした税理士のみ<\/strong>が利用可。<\/li>\n<li>特徴：①譲渡・譲受とも登録可　②法人・個人、規模を問わない　③案件は<strong>ノンネーム情報<\/strong>、詳細は税理士を通じて問合せ　④税理士は<strong>無料<\/strong>。<\/li>\n<\/ul>\n<p>（参考資料10 p.1/1）<\/p>\n<h2 id=\"n5-26\">不適切な譲り受け側に係る情報共有の仕組み<\/h2>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>参加者とは<strong>別法人の中立・公平な運営主体<\/strong>が、登録事由に該当する譲り受け側の情報を参加者に共有する。取引の可否は<strong>参加者が自らの責任で判断<\/strong>し、取引停止を参加者に強制すると独禁法上違法となる可能性がある。<\/p>\n<p>出典：「不適切な譲り受け側に係る情報共有の仕組みについて」（<strong>令和7年2月・中小企業庁財務課<\/strong>）。→ 倫理タブの「不適切な譲り受け側の排除」も参照。<\/p>\n<h3 id=\"n5-27\">目的<\/h3>\n<ul>\n<li>中小M&amp;Aは<strong>令和2年3月<\/strong>のGL策定以降、着実に浸透。<\/li>\n<li>一方、経営者保証を移行させないまま、譲り渡し側の<strong>現預金等の資産を回収し、資金繰りを悪化させ、倒産に至らせる<\/strong>不適切な譲り受け側の存在が指摘され、適切に排除する必要がある。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>令和6年8月<\/strong>のGL改訂で、最終契約の不履行等を働く者の情報を<strong>業界内で共有する仕組み<\/strong>の構築が期待される旨を記載（<strong>GL第2章Ⅱ 6（3）<\/strong>）。市場の<strong>信頼性確保のためのインフラ<\/strong>としての浸透が期待。<\/li>\n<li>本書は仕組み・運用の骨子を<strong>一例として<\/strong>示したもの。<\/li>\n<\/ul>\n<p>（情報共有 1）<\/p>\n<h3 id=\"n5-28\">基本原則<\/h3>\n<ul>\n<li><strong>個人情報保護法、不正競争防止法<\/strong>等の関係法令・ガイドラインの遵守が大前提。<\/li>\n<li>取引の開始・継続の判断に必要な情報を<strong>適時適切<\/strong>に共有。参加者は組織内のM&amp;A部署等の必要範囲に共有し判断に活用。<\/li>\n<\/ul>\n<p>（情報共有 2）<\/p>\n<h3 id=\"n5-29\">基本的なスキーム<\/h3>\n<ul>\n<li>参加者とは<strong>別の法人<\/strong>を<strong>中立・公平な運営主体<\/strong>として設置し、運営主体と参加者の<strong>契約<\/strong>に基づき構築。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>運営主体は<strong>譲り受け側から手数料をはじめ一切の経済的利益の供与を受けないことが必要<\/strong>。<\/li>\n<\/ul>\n<ol>\n<li>運営主体が<strong>登録事由<\/strong>を設定。<\/li>\n<li>参加者は、顧客（元顧客含む）の譲り受け側について登録事由に該当する情報を得たら運営主体に報告。<\/li>\n<li>運営主体は報道等の公表情報や、情報提供窓口に寄せられた情報を収集。<\/li>\n<li>運営主体は2・3の情報を確認の上、<strong>参加者全体に共有<\/strong>。<\/li>\n<\/ol>\n<p>（情報共有 3(1)）<\/p>\n<h3 id=\"n5-30\">登録事由（例示）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>区分<\/th>\n<th>登録事由<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>①経営者保証等（解除が譲り受け側の義務・努力義務として合意された場合）ア<\/td>\n<td>解除に合理的に要する一定期間を経過しても<strong>解除されない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>①イ<\/td>\n<td>譲り受け側が金融機関等と解除に向けた<strong>相談をすみやかに開始しない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>①ウ<\/td>\n<td>金融機関等が解除不可・条件付きとした場合に、<strong>借換・一括返済、解除条件の充足等で解除を実現しない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>②対価等の支払い<\/td>\n<td><strong>譲渡対価の分割払い<\/strong>や<strong>退職慰労金のクロージング日以降の後払い<\/strong>（支払要件が期日の到来のみ）で、<strong>期日を過ぎても支払いがない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>包括要件（設定も考えられる）<\/td>\n<td>「その他譲り渡し側に重大な損害を与えるおそれが<strong>客観的な証拠<\/strong>により認められるとき」。この場合は共有前に<strong>弁明の機会の付与等の救済措置<\/strong>を設け適正手続を担保することが相当<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>独占禁止法<\/strong>：共有された譲り受け側との<strong>取引停止を参加者に強制する場合は違法となる可能性<\/strong>がある。参加者が<strong>自らの責任で取引の可否を判断<\/strong>することとする<strong>必要がある<\/strong>。<\/li>\n<\/ul>\n<p>（情報共有 3(2)）<\/p>\n<h3 id=\"n5-31\">共有情報の内容・範囲<\/h3>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>共有される情報（少なくとも7項目）：\n  1. 社名\n  2. 法人番号\n  3. 代表者名\n  4. 役員名\n  5. 登録日\n  6. 登録事由\n  7. 備考（現在の状況等）<\/li>\n<li>共有範囲には公的相談窓口である全国の「<strong>事業承継・引継ぎ支援センター<\/strong>」も<strong>含める必要がある<\/strong>。<\/li>\n<li>運営主体はこのほか、<strong>報告主体、登録日、事故日、実質的支配者<\/strong>等を記録保存。<\/li>\n<\/ul>\n<p>（情報共有 3(3)）<\/p>\n<h3 id=\"n5-32\">登録に係る譲り受け側等への対応<\/h3>\n<ul>\n<li>参加者は譲り受け側との契約で、情報共有できるよう<strong>秘密保持義務からの除外<\/strong>等を行う。事前に<strong>登録事由の内容、共有範囲、利用目的<\/strong>を説明。<\/li>\n<li>【注意】参加者が譲り渡し側の<strong>FA<\/strong>の場合は譲り受け側と契約がなく、情報共有は難しい。<\/li>\n<li>運営主体は譲り受け側からの<strong>登録状況の問合せ<\/strong>に応じ開示する<strong>窓口を設置<\/strong>。<strong>異議申立て<\/strong>があれば再確認し、相当の理由があれば<strong>登録を抹消<\/strong>。<\/li>\n<li>異議申立ての確認で譲り渡し側の情報を確認する可能性があるため、譲り渡し側との契約でも秘密保持義務の除外等と事前説明を行う。<\/li>\n<\/ul>\n<p>（情報共有 3(4)）<\/p>\n<h3 id=\"n5-33\">参加者の義務<\/h3>\n<ul>\n<li>登録事由に該当する情報を取得したときは運営主体に<strong>速やかに報告<\/strong>。該当しなくなったことを知ったときも報告。<\/li>\n<li>共有情報は<strong>M&amp;Aに係る支援業務の目的に限り<\/strong>利用。組織内で共有範囲を設定し管理し、<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>参加者の外部に流出してはならない<\/strong>。<\/li>\n<li>運営主体による義務履行状況の<strong>モニタリング調査を受け入れる<\/strong>。<\/li>\n<\/ul>\n<p>（情報共有 3(5)）<span class=\"note-tag\">注<\/span>原文は「速やかに報告することが<strong>求められる<\/strong>」「目的に限り利用することが<strong>求められる<\/strong>」という表現。<\/p>\n<h3 id=\"n5-34\">運営主体の義務<\/h3>\n<ul>\n<li>登録事由に該当しなくなったとき（参加者からの報告含む）は参加者に共有。<\/li>\n<li>参加申請者の<strong>反社会的勢力との関係、代表者・役員・実質的支配者の犯罪歴、M&amp;A支援業務の事業実態<\/strong>等を事前確認し、問題があれば参加を拒否。<\/li>\n<li>参加者の義務違反等には重大性に応じ<strong>注意、戒告、除名<\/strong>等。必要に応じ社名等を公表。<\/li>\n<li>捜査機関、裁判所、官公庁、弁護士会等からの調査依頼への対応方針をあらかじめ定める。<\/li>\n<li>情報共有システムは<strong>FISC安全対策基準<\/strong>などに準拠したセキュリティ対策やなりすまし防止措置等で管理。<\/li>\n<li>中小企業庁財務課が必要と認めるときは、設置・運用状況等を同課へ報告。<\/li>\n<\/ul>\n<p>（情報共有 3(6)）<\/p>\n<h2 id=\"n5-35\">ガイドライン第3版Q&amp;A（全40問）<\/h2>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>第3版は手数料・提供業務の説明、広告・営業の規律、利益相反の禁止事項、不適切な譲り受け側の排除を強化した。登録機関は<strong>令和6年12月31日<\/strong>までに第3版の遵守宣言が必要とされ、<strong>令和7年1月<\/strong>からは宣言の有無にかかわらず第3版が適用される。<\/p>\n<p>収録数：①4問、②2問、③2問、④10問、⑤1問、⑥2問、⑦3問、⑧3問、⑨3問、⑩2問、⑪8問＝計40問。規範面の詳細は → 倫理タブ参照。<\/p>\n<h3 id=\"n5-36\">① 概要<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>質問<\/th>\n<th>回答要旨<\/th>\n<th>出典<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>中小M&amp;Aガイドラインとは<\/td>\n<td>後継者不在の中小企業のM&amp;Aの当事者と支援機関の<strong>手引き・行動指針<\/strong>。<strong>令和2年3月<\/strong>に中小企業庁が策定<\/td>\n<td>Q&amp;A ①No.1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>M&amp;A支援機関登録制度とは<\/td>\n<td><strong>令和3年8月<\/strong>創設。<strong>FA業務又は仲介業務<\/strong>を行う者が対象で、<strong>GL遵守の宣言<\/strong>が要件。未登録でも業務は可能だが、<span class=\"star\" aria-label=\"頻出\">★<\/span>補助金（専門家活用型）の仲介・FA手数料は<strong>登録機関の支援のみ<\/strong>補助対象（令和5年9月現在）<\/td>\n<td>Q&amp;A ①No.2<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>第2版を改訂した目的<\/td>\n<td>市場拡大・支援機関増加を踏まえ、質の高い仲介者・FAが選ばれるよう<strong>手数料・提供業務<\/strong>を追記。<strong>営業・広告の規律の明記<\/strong>と<strong>禁止される利益相反事項の具体化<\/strong><\/td>\n<td>Q&amp;A ①No.3<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>第2版からの変更点<\/td>\n<td>次の7点（下記）<\/td>\n<td>Q&amp;A ①No.4<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>①No.4 変更点（7点）：<\/p>\n<ol>\n<li><strong>手数料・提供業務<\/strong>：中小企業向け＝手数料と業務内容・質の確認、手数料の交渉の検討。仲介者・FA向け＝手数料の詳細、プロセスごとの業務説明、担当者の保有資格・経験年数・成約実績の説明。<\/li>\n<li><strong>広告・営業の禁止事項の明記<\/strong>：希望しない場合の停止。<\/li>\n<li><strong>利益相反の禁止事項の具体化<\/strong>：追加手数料を支払う者やリピーターの優遇の禁止、情報の扱いの禁止。<strong>仲介契約書に仲介者の義務として定める<\/strong>。<\/li>\n<li><strong>ネームクリア・テール条項の規律<\/strong>：ネームクリア前に<strong>譲り渡し側の同意を取得<\/strong>。<\/li>\n<li><strong>最終契約後のリスク事項<\/strong>：中小企業向け＝リスク事項の解説。仲介者・FA向け＝最終契約前等に依頼者へ具体的に説明。<\/li>\n<li><strong>経営者保証の扱い<\/strong>：中小企業向け＝<strong>M&amp;A成立前の相談<\/strong>の検討。仲介者・FA向け＝士業への相談が選択肢となる旨の説明、最終契約での調整。金融機関向け＝「経営者保証に関するガイドライン」に基づく対応。<\/li>\n<li><strong>不適切な事業者の排除<\/strong>：<strong>譲り受け側に対する調査<\/strong>と結果の報告、情報取得時の慎重な対応、<strong>業界内の情報共有の仕組み<\/strong>の必要性と参加有無の説明。<\/li>\n<\/ol>\n<p>（Q&amp;A ①No.4）<\/p>\n<h3 id=\"n5-37\">② 対応が求められる支援機関<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>質問<\/th>\n<th>回答要旨<\/th>\n<th>出典<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>改訂対応は誰に求められるか<\/td>\n<td>M&amp;A専門業者に加え、<strong>金融機関、士業等専門家、M&amp;Aプラットフォーマー<\/strong>等が同様の業務を行う場合も、<strong>業務の性質・内容が共通する限り<\/strong>準拠した対応を想定<\/td>\n<td>Q&amp;A ②No.1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>M&amp;A専門業者とは<\/td>\n<td>マッチング支援や手続進行の総合的な支援を<strong>専門に行う民間業者<\/strong>で、主に<strong>仲介者・FA<\/strong>に分類。初版から変更なし<\/td>\n<td>Q&amp;A ②No.2<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"n5-38\">③ 広告・営業<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>質問<\/th>\n<th>回答要旨<\/th>\n<th>出典<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>停止すべきタイミング<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>M&amp;Aの実施意向がない、契約しない、営業を希望しない旨の「停止意思」を表示されたら、<strong>拒んではならず、ただちに停止<\/strong><\/td>\n<td>Q&amp;A ③No.1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>行ってはいけない広告・営業<\/td>\n<td>①名称・勧誘者の氏名・勧誘目的を<strong>告げずに行う<\/strong>もの②意思決定の<strong>時間を与えず即時の判断を迫る<\/strong>もの③成立可能性や条件等について<strong>虚偽・事実相違・誤認を招く<\/strong>もの。これに限らず職業倫理に則った広告・営業が求められる<\/td>\n<td>Q&amp;A ③No.2<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"n5-39\">④ 契約締結前の書面による重要事項の説明<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>質問<\/th>\n<th>回答要旨<\/th>\n<th>出典<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>対象となる契約<\/td>\n<td>マッチング支援等を行う<strong>仲介契約・FA契約等<\/strong>。別途NDA等で説明項目を含む契約を結ぶ場合も準じた対応が<strong>望ましい<\/strong><\/td>\n<td>Q&amp;A ④No.1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>書面等に記載して説明すべき事項<\/td>\n<td>次の17項目（下記）<\/td>\n<td>Q&amp;A ④No.2<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>手数料・提供業務の説明<\/td>\n<td>手数料を明確に説明し、対価としての業務を「<strong>M&amp;Aのプロセス<\/strong>」ごとに説明。担当者の保有資格・経験年数・成約実績も説明<\/td>\n<td>Q&amp;A ④No.3<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>相手方の手数料の説明<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>仲介契約前に、相手方の報酬率・報酬基準額・最低手数料・発生タイミング等を、<strong>手数料の総額が成立や譲渡額等に影響を与える可能性がある旨<\/strong>も含めて説明<\/td>\n<td>Q&amp;A ④No.4<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>重要事項説明書の記載<\/td>\n<td><strong>契約書の文言の転記ではなく<\/strong>、依頼者が理解しやすい記載を推奨<\/td>\n<td>Q&amp;A ④No.5<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>サンプルの使用は必須か<\/td>\n<td>必要事項が適切に記載されていれば<strong>書面の様式は問わない<\/strong>。サンプルは必須でない<\/td>\n<td>Q&amp;A ④No.6<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>記名・押印欄やチェック項目<\/td>\n<td>説明実施を書面上明らかにする趣旨で、<strong>いずれも設けてよい<\/strong><\/td>\n<td>Q&amp;A ④No.7<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>説明のタイミング<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>契約の<strong>締結前<\/strong>。十分検討できる適切なタイミングで<\/td>\n<td>Q&amp;A ④No.8<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>説明の相手方<\/td>\n<td><strong>契約を締結する権限を有する者<\/strong>。法人は<strong>代表者又は契約締結の委任を受けた者<\/strong><\/td>\n<td>Q&amp;A ④No.9<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>説明者<\/td>\n<td>質問・意見に適切に対応できる<strong>十分な経験・能力を有する者<\/strong>が行うことが<strong>望ましい<\/strong><\/td>\n<td>Q&amp;A ④No.10<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>④No.2 書面等に記載して説明すべき重要な事項（17項目）：<\/p>\n<ol>\n<li>仲介者・FAの違いとそれぞれの特徴<\/li>\n<li>提供する業務の範囲・内容<\/li>\n<li>担当者の保有資格、経験年数・成約実績<\/li>\n<li>手数料に関する事項<\/li>\n<li>手数料以外に依頼者が支払うべき費用<\/li>\n<li>（仲介者の場合）相手方の手数料に関する事項<\/li>\n<li>秘密保持に関する事項<\/li>\n<li>直接交渉の制限に関する事項<\/li>\n<li>専任条項<\/li>\n<li>テール条項<\/li>\n<li>契約期間<\/li>\n<li>（契約の解除に関する事項及び中途解約できることを明記する場合）当該中途解約に関する事項<\/li>\n<li>責任（免責）に関する事項<\/li>\n<li>契約終了後も効力を有する条項<\/li>\n<li>（仲介者の場合）両当事者において利益の対立が想定される事項<\/li>\n<li>（譲り渡し側への説明の場合）譲り受け側に実施する調査の概要（実施主体、財務状況・コンプライアンス・事業実態に関する調査等）<\/li>\n<li>（譲り渡し側への説明の場合）業界内での情報共有の仕組みへの参加有無（不参加の場合はその旨）<\/li>\n<\/ol>\n<p>（Q&amp;A ④No.2）<\/p>\n<h3 id=\"n5-40\">⑤ 譲り受け側の選定（マッチング）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>質問<\/th>\n<th>回答要旨<\/th>\n<th>出典<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>ネームクリアの方法<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>ノンネーム・シート（ティーザー）等で興味を示した候補先に対し、<strong>譲り渡し側の同意を取得し、候補先とNDAを締結した上で<\/strong>実施<\/td>\n<td>Q&amp;A ⑤No.1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"n5-41\">⑥ 最終契約の交渉・締結<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>質問<\/th>\n<th>回答要旨<\/th>\n<th>出典<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>リスクの説明のタイミング<\/td>\n<td>最終契約後・クロージング後に争いになり得るリスクについて、<strong>最終契約の締結まで<\/strong>に調整・説明<\/td>\n<td>Q&amp;A ⑥No.1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>説明が必要なリスク<\/td>\n<td>①<strong>認識の有無に関わらず対応<\/strong>：経営者保証の扱い／DDの非実施／表明保証の内容。②<strong>認識した段階で対応<\/strong>：クロージング後の支払・手続／最終契約後の支払の調整・修正／譲り渡し側の資産・貸付金の最終契約後整理／最終契約からクロージングまでの期間。これに限らず説明・調整が望まれる<\/td>\n<td>Q&amp;A ⑥No.2<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"n5-42\">⑦ 不適切な譲り受け側の排除<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>質問<\/th>\n<th>回答要旨<\/th>\n<th>出典<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>排除のために行うこと<\/td>\n<td>譲り受け側が<strong>最終契約を履行し、対象事業を引き継ぐ意思・能力<\/strong>を有するか確認するため<strong>調査を実施<\/strong><\/td>\n<td>Q&amp;A ⑦No.1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>調査内容<\/td>\n<td><strong>税務申告書による財務状況<\/strong>、<strong>商業登記簿による事業実態<\/strong>、関係者を含む<strong>反社会的勢力への該当性<\/strong>や<strong>過去のM&amp;Aトラブル<\/strong>の確認など<\/td>\n<td>Q&amp;A ⑦No.2<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>調査のタイミング<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>仲介契約・FA契約締結前<\/strong>（プラットフォーマーは<strong>登録前<\/strong>）に加え、プロセス進捗中も実施し、<strong>最終契約の締結までに<\/strong>十分に確認<\/td>\n<td>Q&amp;A ⑦No.3<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"n5-43\">⑧ 直接交渉の制限に関する条項<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>質問<\/th>\n<th>回答要旨<\/th>\n<th>出典<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>候補先の範囲を限定する理由<\/td>\n<td>無限定だと自ら候補先を発見することが事実上困難。依頼者が「自ら候補先を発見しないこと」「自ら発見した候補先と直接交渉しないこと」を<strong>明示的に了解している場合を除き<\/strong>、<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>関与・接触し紹介した候補先のみに限定すべき<\/strong><\/td>\n<td>Q&amp;A ⑧No.1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>交渉目的の範囲を限定する理由<\/td>\n<td>一律に禁じると通常の事業の取引まで阻害するおそれ。<strong>M&amp;Aに関する目的に限定すべき<\/strong><\/td>\n<td>Q&amp;A ⑧No.2<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>有効期間を限定する理由<\/td>\n<td>終了後も禁じると自由な経営判断を損なうおそれ。<strong>契約終了までに限定すべき<\/strong>。手数料回避のため契約を終了させ直接交渉するケース等は<strong>テール条項で手数料が発生し得る<\/strong>ことも踏まえた整理<\/td>\n<td>Q&amp;A ⑧No.3<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"n5-44\">⑨ テール条項<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>質問<\/th>\n<th>回答要旨<\/th>\n<th>出典<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>テール期間の目安<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>最長でも2～3年以内<\/strong><\/td>\n<td>Q&amp;A ⑨No.1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>対象となる事業者<\/td>\n<td>無限定だと新たなM&amp;Aの断念につながるおそれ。<strong>関与・接触した譲り受け側であって譲り渡し側に紹介された者のみ<\/strong>に限定<\/td>\n<td>Q&amp;A ⑨No.2<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>「紹介された者」とは<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>ロングリスト／ショートリストやノンネーム・シートの提示<strong>のみでは対象とすべきでない<\/strong>。<strong>少なくともネームクリア<\/strong>（企業概要書を送付し名称を開示）が行われ紹介された譲り受け側。ただし満たせば<strong>すべからく有効性を認めるものではない<\/strong><\/td>\n<td>Q&amp;A ⑨No.3<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"n5-45\">⑩ （仲介者の場合）利益相反のリスク<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>質問<\/th>\n<th>回答要旨<\/th>\n<th>出典<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>仲介者が行うべきこと<\/td>\n<td>仲介契約締結時に明示的に説明：①<strong>両当事者と仲介契約を締結する仲介者であること<\/strong>（両者から手数料を受領する場合はその旨）②<strong>利益の対立が想定される事項<\/strong><\/td>\n<td>Q&amp;A ⑩No.1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>特に禁止されるべき利益相反行為<\/td>\n<td>次の5類型（下記）<\/td>\n<td>Q&amp;A ⑩No.2<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>⑩No.2 特に<strong>禁止<\/strong>されるべき利益相反行為（5類型）：<\/p>\n<ol>\n<li>譲り受け側から<strong>追加で手数料<\/strong>を取得し便宜を図る行為（ニーズに反したマッチングの優先、不当に低額な譲渡価額への誘導等）<\/li>\n<li><strong>リピーター<\/strong>となる依頼者を優遇し便宜を図る行為（同上）<\/li>\n<li>希望額と成立額の<strong>差分の一定割合を報酬として要求<\/strong>する行為<\/li>\n<li>伝達を求められた事項を<strong>伝達せず<\/strong>、又は告げていない事項を<strong>偽って伝達<\/strong>する行為<\/li>\n<li>一方にのみ有利・不利な情報を認識した場合に、当該当事者に<strong>伝達せず秘匿<\/strong>する行為<\/li>\n<\/ol>\n<p>（Q&amp;A ⑩No.2）<\/p>\n<h3 id=\"n5-46\">⑪ M&amp;A支援機関登録制度の登録支援機関に求められる対応<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>質問<\/th>\n<th>回答要旨<\/th>\n<th>出典<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>第3版の適用スケジュール<\/td>\n<td>①<strong>令和6年8月時点で登録済<\/strong>②<strong>令和6年9月～12月<\/strong>に新規登録の者は、<strong>令和6年12月31日<\/strong>までに対応を完了し遵守宣言が必要。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>遵守宣言した日の翌営業日<\/strong>から適用。宣言しなくても<strong>令和7年1月<\/strong>から適用。③<strong>令和7年1月以降<\/strong>の新規申請は<strong>登録申請時点<\/strong>から適用<\/td>\n<td>Q&amp;A ⑪No.1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>令和6年9～12月の新規登録申請時<\/td>\n<td>第2版遵守宣言での申請も可能だが、年末までに第3版の宣言が必要。申請時から第3版前提での申請を<strong>推奨<\/strong><\/td>\n<td>Q&amp;A ⑪No.2<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>第2版対応済み機関の追加対応<\/td>\n<td>①手数料・提供業務②広告・営業の禁止事項③利益相反の禁止事項④ネームクリア・テール条項⑤最終契約後のリスク事項⑥経営者保証⑦不適切な事業者の排除⑧社内周知・運用体制整備⑨HP掲載内容や顧客への事前説明資料の整備<\/td>\n<td>Q&amp;A ⑪No.3<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>年末までに宣言しない場合<\/td>\n<td><span class=\"star\" aria-label=\"頻出\">★<\/span>宣言しなかったこと自体は<strong>登録取消事由にはならない<\/strong>が、<strong>令和7年1月以降<\/strong>は未対応だと<strong>登録が取り消される場合がある<\/strong>。令和7年度の実績報告（6月末頃）に、年末までに宣言しなかった合理的理由の有無を確認し、未完了なら登録継続を認めない予定<\/td>\n<td>Q&amp;A ⑪No.4<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>遵守宣言のメリット<\/td>\n<td>DBで自社情報に「<strong>第3版対応<\/strong>」マークが表示される<\/td>\n<td>Q&amp;A ⑪No.5<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>取組内容の公表・資料提出<\/td>\n<td>特段必要なし。実績報告での報告とDBでの公表（<strong>任意<\/strong>）を検討中<\/td>\n<td>Q&amp;A ⑪No.6<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>HP掲載・顧客説明資料の変更<\/td>\n<td>遵守宣言の掲載内容の変更が必要。HPがない場合は会社概要パンフレット等を第3版対応に変更<\/td>\n<td>Q&amp;A ⑪No.7<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>遵守宣言の提出方法<\/td>\n<td>近日中に<strong>入力フォーム<\/strong>を開設予定<\/td>\n<td>Q&amp;A ⑪No.8<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><span class=\"note-tag\">注<\/span>①No.2の補助金名は「事業承継・引継ぎ補助金（専門家活用型）」（令和5年9月現在）。資料2では「事業承継・M&amp;A補助金（専門家活用枠）」と表記。<\/p>", "toc": [{"id": "n5-1", "level": 2, "text": "市場改革の方向性（資料1・2025年6月6日）"}, {"id": "n5-2", "level": 3, "text": "市場に係る施策①：アドバイザー個人の質の向上"}, {"id": "n5-3", "level": 3, "text": "市場に係る施策②：仲介・FA手数料の公表と競争"}, {"id": "n5-4", "level": 3, "text": "売手に係る施策：小規模案件・地域偏在・支援体制"}, {"id": "n5-5", "level": 3, "text": "買手に係る施策：税制・融資・補助金・PMI・ファンド"}, {"id": "n5-6", "level": 3, "text": "御議論いただきたい論点"}, {"id": "n5-7", "level": 2, "text": "支援機関登録制度・手数料の状況・センター施策（資料2・2026年3月17日）"}, {"id": "n5-8", "level": 3, "text": "M&A支援機関登録制度"}, {"id": "n5-9", "level": 3, "text": "中小M&A市場の現状（情報提供窓口）"}, {"id": "n5-10", "level": 3, "text": "手数料の状況（要点）"}, {"id": "n5-11", "level": 3, "text": "事業承継・引継ぎ支援センター等の施策"}, {"id": "n5-12", "level": 3, "text": "株式価値・手数料の簡易計算ツール（要点）"}, {"id": "n5-13", "level": 3, "text": "御議論いただきたい論点"}, {"id": "n5-14", "level": 2, "text": "支援機関の種類と支援ツール"}, {"id": "n5-15", "level": 3, "text": "金融機関（GL第2章Ⅲ）"}, {"id": "n5-16", "level": 3, "text": "商工団体（GL第2章Ⅳ）"}, {"id": "n5-17", "level": 3, "text": "士業等専門家（GL第2章Ⅴ）"}, {"id": "n5-18", "level": 3, "text": "M&Aプラットフォーマー（GL第2章Ⅵ）"}, {"id": "n5-19", "level": 3, "text": "M&Aプラットフォームの利用（GL第1章Ⅲ）"}, {"id": "n5-20", "level": 3, "text": "事業承継・引継ぎ支援センター（GL第1章Ⅳ）"}, {"id": "n5-21", "level": 3, "text": "問い合わせ窓口（GL第1章Ⅵ）"}, {"id": "n5-22", "level": 3, "text": "日本公庫「事業承継マッチング支援」（参考資料5）"}, {"id": "n5-23", "level": 3, "text": "円滑な廃業を支援する施策5種（参考資料8）"}, {"id": "n5-24", "level": 3, "text": "サポートツール3種（参考資料9）"}, {"id": "n5-25", "level": 3, "text": "日税連「担い手探しナビ」（参考資料10）"}, {"id": "n5-26", "level": 2, "text": "不適切な譲り受け側に係る情報共有の仕組み"}, {"id": "n5-27", "level": 3, "text": "目的"}, {"id": "n5-28", "level": 3, "text": "基本原則"}, {"id": "n5-29", "level": 3, "text": "基本的なスキーム"}, {"id": "n5-30", "level": 3, "text": "登録事由（例示）"}, {"id": "n5-31", "level": 3, "text": "共有情報の内容・範囲"}, {"id": "n5-32", "level": 3, "text": "登録に係る譲り受け側等への対応"}, {"id": "n5-33", "level": 3, "text": "参加者の義務"}, {"id": "n5-34", "level": 3, "text": "運営主体の義務"}, {"id": "n5-35", "level": 2, "text": "ガイドライン第3版Q&A（全40問）"}, {"id": "n5-36", "level": 3, "text": "① 概要"}, {"id": "n5-37", "level": 3, "text": "② 対応が求められる支援機関"}, {"id": "n5-38", "level": 3, "text": "③ 広告・営業"}, {"id": "n5-39", "level": 3, "text": "④ 契約締結前の書面による重要事項の説明"}, {"id": "n5-40", "level": 3, "text": "⑤ 譲り受け側の選定（マッチング）"}, {"id": "n5-41", "level": 3, "text": "⑥ 最終契約の交渉・締結"}, {"id": "n5-42", "level": 3, "text": "⑦ 不適切な譲り受け側の排除"}, {"id": "n5-43", "level": 3, "text": "⑧ 直接交渉の制限に関する条項"}, {"id": "n5-44", "level": 3, "text": "⑨ テール条項"}, {"id": "n5-45", "level": 3, "text": "⑩ （仲介者の場合）利益相反のリスク"}, {"id": "n5-46", "level": 3, "text": "⑪ M&A支援機関登録制度の登録支援機関に求められる対応"}]}, {"tab": 7, "title": "出典と注記", "html": "\n<h2 id=\"n7-1\">出典一覧<\/h2>\n<p>添付の20資料をすべて全文精読しています。ガイドラインが挙げる参考資料1〜12と、後から追加された参考資料13を含め、公表分は漏れなく反映しています（GL p.133）。<\/p>\n<div class=\"tbl\"><table><thead><tr><th>略称<\/th><th>資料名<\/th><th>発行<\/th><th>ページ<\/th><\/tr><\/thead><tbody><tr><td>GL<\/td><td>中小M&amp;Aガイドライン（第3版）―第三者への円滑な事業引継ぎに向けて―<\/td><td>中小企業庁 2024年8月<\/td><td>139<\/td><\/tr><tr><td>SM<\/td><td>【中小M&amp;A専門人材（個人）向け】使命、倫理・行動規範、知識スキルマップ<\/td><td>中小企業庁財務課 2025年4月<\/td><td>190<\/td><\/tr><tr><td>Q&amp;A<\/td><td>中小M&amp;Aガイドライン（第3版）に関するQ&amp;A<\/td><td>中小企業庁<\/td><td>8<\/td><\/tr><tr><td>資料1<\/td><td>中小M&amp;A市場の改革に向けた方向性について（検討会 資料1）<\/td><td>中小企業庁 2025/06/06<\/td><td>25<\/td><\/tr><tr><td>資料2<\/td><td>中小M&amp;A市場の改革に向けた方向性について（検討会 資料2。第4回は公開URLによる）<\/td><td>中小企業庁財務課 2026/03/17<\/td><td>52<\/td><\/tr><tr><td>情報共有<\/td><td>不適切な譲り受け側に係る情報共有の仕組みについて<\/td><td>中小企業庁財務課 2025年2月<\/td><td>4<\/td><\/tr><tr><td>参考資料1<\/td><td>中小M&amp;Aの主な手法と特徴<\/td><td>GL参考資料<\/td><td>3<\/td><\/tr><tr><td>参考資料2<\/td><td>中小M&amp;Aの譲渡額の算定方法<\/td><td>GL参考資料<\/td><td>4<\/td><\/tr><tr><td>参考資料3<\/td><td>事業承継・引継ぎ支援センター連絡先一覧<\/td><td>GL参考資料<\/td><td>4<\/td><\/tr><tr><td>参考資料4<\/td><td>中小M&amp;Aの事例<\/td><td>GL参考資料<\/td><td>18<\/td><\/tr><tr><td>参考資料5<\/td><td>日本政策金融公庫「事業承継マッチング支援」<\/td><td>GL参考資料<\/td><td>1<\/td><\/tr><tr><td>参考資料6<\/td><td>仲介契約・FA契約締結時のチェックリスト<\/td><td>GL参考資料<\/td><td>2<\/td><\/tr><tr><td>参考資料7<\/td><td>各種契約書等サンプル（添付は2版）<\/td><td>GL参考資料<\/td><td>47＋47<\/td><\/tr><tr><td>参考資料8<\/td><td>円滑な廃業を支援する施策<\/td><td>GL参考資料<\/td><td>2<\/td><\/tr><tr><td>参考資料9<\/td><td>各種サポートツール<\/td><td>GL参考資料<\/td><td>1<\/td><\/tr><tr><td>参考資料10<\/td><td>日本税理士会連合会「担い手探しナビ」<\/td><td>GL参考資料<\/td><td>1<\/td><\/tr><tr><td>参考資料11<\/td><td>M&amp;A仲介契約／FA契約 重要事項説明書サンプル<\/td><td>GL参考資料<\/td><td>12<\/td><\/tr><tr><td>参考資料12<\/td><td>最終契約におけるリスク事項についての説明書サンプル<\/td><td>GL参考資料<\/td><td>5<\/td><\/tr><tr><td>参考資料13<\/td><td>中小M&amp;A時の経営者保証の取扱いについて<\/td><td>GL参考資料<\/td><td>8<\/td><\/tr><\/tbody><\/table><\/div>\n<p>公開元：<a href=\"https://www.chusho.meti.go.jp/zaimu/shoukei/m_and_a_guideline.html\">中小M&amp;Aガイドライン（中小企業庁）<\/a>、<a href=\"https://www.chusho.meti.go.jp/zaimu/shoukei/m_and_a_guideline/skills-map.pdf\">スキルマップ<\/a>、<a href=\"https://www.chusho.meti.go.jp/koukai/kenkyukai/ma_shijou/002/001.pdf\">資料1<\/a>、<a href=\"https://www.chusho.meti.go.jp/koukai/kenkyukai/ma_shijou/004/002.pdf\">資料2<\/a><\/p>\n<h2 id=\"n7-2\">資料間の不整合・誤記の注記<\/h2>\n<p>原資料そのものに食い違いがある箇所です。ノートでは原文どおりに記し、該当箇所に<span class=\"note-tag\">注<\/span>を付けています。試験では、数値が食い違う論点は出題されにくいと考えられます（推測）。<\/p>\n<div class=\"tbl\"><table><thead><tr><th>資料<\/th><th>箇所<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>参考資料2<\/td><td>時価純資産法の計算例<\/td><td>繰延税金資産が図で「＋39」、表で「＋44」。時価純資産314は＋44で計算した値と一致<\/td><\/tr><tr><td>参考資料2<\/td><td>マルチプル法<\/td><td>数値入りの計算例はなく、概念図と算式のみ<\/td><\/tr><tr><td>参考資料4<\/td><td>事例(8)<\/td><td>項番が「①③③④」の順（原文どおり）<\/td><\/tr><tr><td>参考資料7<\/td><td>2つの版<\/td><td>版Bに5点の実質差（第10条①「本条において」、第12条2項「ないし」混入、第15条2項「⑭」混入、第16・17条2項に事業譲渡風の文言、項番の二重表記）。版Bは校正途中版と見られる（推測）。ノートは版Aを基準にした<\/td><\/tr><tr><td>資料1<\/td><td>p.11<\/td><td>三大都市圏の内訳合計が86%（74＋8＋4）だが、本文は「約85%」<\/td><\/tr><tr><td>資料1と資料2<\/td><td>合格者の定期講習<\/td><td>資料1は3〜5年ごと、資料2は1〜2年ごと等。新しい資料2が現行の想定<\/td><\/tr><tr><td>資料2<\/td><td>p.3<\/td><td>右上に「検討会第3回 配付資料／検討会・WG等での議論を踏まえた更新版」とある（第3回資料の更新再掲）。表紙には回次の記載がなく、第4回とするのは公開URLによる<\/td><\/tr><tr><td>資料2<\/td><td>p.26<\/td><td>算定方式別手数料率の棒グラフに数値の印字がない（ノートの値は目視の概算）<\/td><\/tr><tr><td>資料2<\/td><td>p.44<\/td><td>「EV/EBITDA倍率法・PER倍率法・PER倍率法」とPERが2回。PBRの誤記の可能性（推測）<\/td><\/tr><tr><td>資料2<\/td><td>p.13〜16<\/td><td>サンプル問題4問に解説文がない。ノートの解説は問題文からの読み取り<\/td><\/tr><tr><td>SM<\/td><td>倫理#44<\/td><td>「善意管理善管注意義務」という誤記<\/td><\/tr><tr><td>SM<\/td><td>用語（意向表明書）<\/td><td>「譲り渡し側が…提出する書面」とある（本来は譲り受け側が提出する書面）<\/td><\/tr><tr><td>SMとGL<\/td><td>チェックシートNo.27<\/td><td>GL本文は「望ましい」、チェックシートは「設ける」と強い表現<\/td><\/tr><tr><td>GL<\/td><td>p.33・p.66<\/td><td>フロー図と最低手数料の分布グラフは画像で、数値を読み取れない<\/td><\/tr><tr><td>情報共有<\/td><td>全体<\/td><td>原資料にページ番号がないため、出典は節番号または改ページから数えたページで表記<\/td><\/tr><\/tbody><\/table><\/div>\n", "toc": [{"id": "n7-1", "level": 2, "text": "出典一覧"}, {"id": "n7-2", "level": 2, "text": "資料間の不整合・誤記の注記"}]}], "ox": [{"i": 0, "s": "倫理・行動規範", "u": "使命・基本姿勢", "q": "本倫理・行動規範は、強制力を持つ規程として定められたものである。", "a": false, "r": "強制力を持つ規程ではなく、M&A専門人材が満たすべき要素を抽出したもの（SM p.10）", "k": false}, {"i": 1, "s": "倫理・行動規範", "u": "使命・基本姿勢", "q": "使命は「依頼者の利益の実現」に加え、「収益性又は社会的意義等を有する事業及び希少な経営資源の引継ぎ」による事業の継続・成長への貢献、もって国民経済の発展への寄与を掲げる。", "a": true, "r": "原文どおり（SM p.7）", "k": false}, {"i": 2, "s": "倫理・行動規範", "u": "使命・基本姿勢", "q": "M&A専門業者は、契約上の義務を負うかにかかわらず、職業倫理として依頼者の意思を尊重し利益を実現するための対応が求められる。", "a": true, "r": "原文どおり（GL p.81）", "k": false}, {"i": 3, "s": "倫理・行動規範", "u": "使命・基本姿勢", "q": "支援者は、M&Aの成立のみを目的として支援を実施してはならず、成立後の事業の成功（成長・継続等）につながる支援を行う（倫理#5）。", "a": true, "r": "原文どおり（SM p.10）", "k": false}, {"i": 4, "s": "倫理・行動規範", "u": "使命・基本姿勢", "q": "顧客が第三者からセカンド・オピニオンを得ることを妨げてはならず、適宜得られることを顧客に伝える（倫理#9）。", "a": true, "r": "原文どおり（SM p.10）", "k": false}, {"i": 5, "s": "倫理・行動規範", "u": "使命・基本姿勢", "q": "顧客からの贈答・接待について、社会通念上許容される範囲を超える金銭・物品等を受け取ってはならない（倫理#21）。", "a": true, "r": "原文どおり（SM p.11）", "k": false}, {"i": 6, "s": "倫理・行動規範", "u": "使命・基本姿勢", "q": "M&A専門業者が業務の一部を第三者に委託した場合、委託業務に係る最終的な責任は委託先が負い、M&A専門業者は免れる。", "a": false, "r": "最終的な責任を免れない（GL p.82-83）", "k": false}, {"i": 7, "s": "倫理・行動規範", "u": "仲介者の利益相反", "q": "仲介者は、双方から依頼を受けているため、いずれか一方の利益のみを優先的に取り扱うことはできない。", "a": true, "r": "原文どおり（GL p.42, 70）", "k": false}, {"i": 8, "s": "倫理・行動規範", "u": "仲介者の利益相反", "q": "仲介者における利益相反は、それだけで直ちに違法となる。", "a": false, "r": "利益相反が直ちに違法となるものではない（GL p.98）", "k": false}, {"i": 9, "s": "倫理・行動規範"
