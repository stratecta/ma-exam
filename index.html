<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中小M&A資格試験 対策</title>
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="M&amp;A試験">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap">
<style>
/* Layout: one-column phone app shell (max 640px), sticky top bar, fixed bottom tab bar; exam screens swap the tab bar for an action bar. */
:root{
  --paper:#ffffff; --ink:#15191c; --muted:#5a625d; --line:#e2e7e3; --wash:#f4f7f5;
  --green:#1f6b47; --green-soft:#e6f1eb; --navy:#1f3864; --navy-soft:#e8ecf5;
  --on-accent:#ffffff; --shadow:0 1px 2px rgba(21,25,28,.06);
  --f-ui:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-read:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111513; --ink:#e7ece9; --muted:#9aa49e; --line:#26302b; --wash:#171d1a;
  --green:#5fb38a; --green-soft:#17281f; --navy:#93a9d9; --navy-soft:#1a2233;
  --on-accent:#0d1210; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111513; --ink:#e7ece9; --muted:#9aa49e; --line:#26302b; --wash:#171d1a;
  --green:#5fb38a; --green-soft:#17281f; --navy:#93a9d9; --navy-soft:#1a2233;
  --on-accent:#0d1210; --shadow:none; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top h1{font-size:16px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.iconbtn{border:0;background:none;padding:8px;margin:-8px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--navy);font-weight:500;font-size:14px}
.iconbtn:focus-visible,.btn:focus-visible,.choice:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--green);font-weight:700}

/* type */
h2.sec{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:500;margin:22px 0 8px}
.lead{color:var(--muted);font-size:13px;margin:4px 0 0}
.kicker{font-size:12px;letter-spacing:.06em;color:var(--navy);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);font-weight:700;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}

/* home */
.hero{padding-block:18px 6px}
.hero .big{font-size:40px;font-weight:700;line-height:1.1}
.hero .big small{font-size:15px;color:var(--muted);font-weight:500;margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{border-top:2px solid var(--ink);padding-top:6px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:14px;margin-top:4px}
.bar-h{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.bar-h span:last-child{color:var(--muted)}
.bar{position:relative;height:10px;background:var(--wash);border:1px solid var(--line);border-radius:6px;margin-top:5px;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:5px}
.bar .tick{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1.5px dashed var(--muted)}
.bar .tick.t70{border-left-color:var(--navy);border-left-style:solid}
.legend{font-size:11px;color:var(--muted);display:flex;gap:14px;margin-top:10px}
.legend i{display:inline-block;width:12px;border-top:1.5px dashed var(--muted);vertical-align:middle;margin-right:4px}
.legend i.t70{border-top:1.5px solid var(--navy)}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--paper);box-shadow:var(--shadow)}
.card.resume{border-color:var(--navy);background:var(--navy-soft)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--paper);cursor:pointer;min-height:84px;display:flex;flex-direction:column;gap:4px}
.act b{font-size:15px}
.act span{font-size:12px;color:var(--muted);line-height:1.5}
.act.main{grid-column:1/-1;background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
.act.main span{color:inherit;opacity:.85}
.sync{font-size:11px;color:var(--muted);margin-top:18px}

/* chips & forms */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
.field{display:grid;gap:8px;margin-top:18px}
.field>label,.field>.lbl{font-size:13px;color:var(--muted);font-weight:500}
select{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:var(--r);padding:0 10px;background:var(--paper);color:var(--ink);width:100%}
input[type=search]:focus-visible,select:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
input[type=search]{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:var(--r);padding:0 12px;background:var(--paper);color:var(--ink);width:100%;-webkit-appearance:none}
.count{font-size:13px;color:var(--muted)}

/* question */
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--navy);background:var(--navy-soft);font-weight:500}
.qno{font-weight:700;color:var(--ink);font-size:13px}
.stem{font-family:var(--f-read);font-size:16.5px;line-height:1.85;margin:10px 0 14px;white-space:pre-wrap}
.choices{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.choice{width:100%;text-align:left;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:13px 12px;min-height:56px;cursor:pointer;font-size:15px;line-height:1.65}
.choice .mk{font-weight:700;color:var(--navy);font-size:17px;line-height:1.5}
.choice[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:var(--navy-soft)}
.choice.is-right{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green);background:var(--green-soft)}
.choice.is-wrong{border-color:var(--ink);border-style:dashed;background:var(--wash)}
.choice.is-wrong .txt{text-decoration:line-through;text-decoration-thickness:1px}
.choice .cn{grid-column:2;font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:4px;text-decoration:none}
.choice .verdict{font-weight:700;margin-right:4px}
.choice.is-right .verdict{color:var(--green)}
.kbadge{display:inline-block;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.result-banner{display:flex;align-items:center;gap:10px;border-radius:var(--r);padding:12px 14px;margin:16px 0 0;font-weight:700;font-size:16px}
.result-banner.ok{background:var(--green-soft);color:var(--green)}
.result-banner.ng{background:var(--wash);border:1px dashed var(--ink)}
.result-banner small{font-weight:500;font-size:12.5px;display:block;color:var(--muted)}
.kinki-alert{border:2px solid var(--ink);border-radius:var(--r);padding:10px 12px;margin-top:10px;font-size:13.5px}
.kinki-alert b{display:block;margin-bottom:2px}
.explain{margin-top:14px;font-family:var(--f-read);font-size:15px;line-height:1.85}
.explain h3{font-family:var(--f-ui);font-size:13px;color:var(--muted);font-weight:500;margin:0 0 4px}
.src{font-size:12px;color:var(--muted);margin-top:8px}
.linkbtn{border:0;background:none;color:var(--navy);font-weight:700;padding:10px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* action bar in quiz */
.qbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.qbar-in{max-width:608px;margin:0 auto;display:flex;gap:10px}
.qbar-in .btn{flex:1}
.qbar-in .btn.small{flex:0 0 auto;padding:0 14px}
.timer{font-weight:700;font-size:15px;color:var(--navy)}
.timer.low{color:var(--ink);text-decoration:underline}
.flagbtn[aria-pressed="true"]{color:var(--ink);font-weight:700}

/* grid navigator */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--paper);width:100%;max-width:640px;max-height:82%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin-top:10px}
.cell{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;font-weight:700;position:relative}
.cell.done{background:var(--navy-soft);border-color:var(--navy);color:var(--navy)}
.cell.flag::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.cell.cur{outline:2px solid var(--green);outline-offset:1px}
.confirm{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px;background:var(--wash)}

/* exam result */
.verdict-big{font-size:34px;font-weight:700;margin:6px 0 0}
.verdict-big.pass{color:var(--green)}
table.score{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
table.score th,table.score td{border-bottom:1px solid var(--line);padding:9px 4px;text-align:left}
table.score td.r,table.score th.r{text-align:right}
.ok{color:var(--green);font-weight:700}
.ng{font-weight:700}

/* OX */
.ox-card{border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:14px}
.ox-q{font-family:var(--f-read);font-size:16.5px;line-height:1.85;margin:6px 0 0}
.ox-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.ox-btn{min-height:76px;font-size:34px;font-weight:700;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;color:var(--navy)}
.ox-btn.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.ox-btn.wrong{border-style:dashed;border-color:var(--ink);color:var(--muted)}
.ox-ans{margin-top:14px;font-size:14.5px;line-height:1.8;font-family:var(--f-read)}

/* notes */
.nlist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.nlist li{border-bottom:1px solid var(--line)}
.nlist button{width:100%;text-align:left;border:0;background:none;padding:14px 0;display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:15px}
.nlist button span:last-child{color:var(--muted);font-size:12px;white-space:nowrap}
.hits{list-style:none;margin:10px 0 0;padding:0}
.hits li{border-bottom:1px solid var(--line)}
.hits button{width:100%;text-align:left;border:0;background:none;padding:12px 0;cursor:pointer}
.hits b{display:block;font-size:14px}
.hits small{display:block;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:2px}
mark{background:var(--green-soft);color:inherit;border-bottom:1.5px solid var(--green)}

/* reader overlay */
.reader{position:fixed;inset:0;z-index:60;background:var(--paper);overflow:auto;-webkit-overflow-scrolling:touch}
.reader .top{margin:0;padding-top:env(safe-area-inset-top,0px);top:0}
.reader-body{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:8px calc(40px + env(safe-area-inset-bottom,0px))}
.toc{border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;margin:12px 0}
.toc summary{cursor:pointer;font-weight:700;font-size:14px;padding:6px 0}
.toc ol{list-style:none;margin:0;padding:0 0 6px}
.toc a{display:block;padding:6px 0;color:var(--navy);text-decoration:none;font-size:13.5px;border-top:1px solid var(--line)}
.toc a.l3{padding-left:14px;font-size:13px;color:var(--muted)}
.doc{font-family:var(--f-read);font-size:15.5px;line-height:1.9}
.doc h2{font-family:var(--f-ui);font-size:19px;line-height:1.45;margin:30px 0 8px;padding-top:10px;border-top:2px solid var(--ink);text-wrap:balance;scroll-margin-top:64px}
.doc h3{font-family:var(--f-ui);font-size:16px;line-height:1.5;margin:22px 0 6px;color:var(--navy);text-wrap:balance;scroll-margin-top:64px}
.doc h4{font-family:var(--f-ui);font-size:14.5px;margin:16px 0 4px}
.doc p{margin:8px 0}
.doc ul,.doc ol{padding-left:1.3em;margin:8px 0}
.doc li{margin:3px 0}
.doc strong{font-weight:600;background:linear-gradient(transparent 62%,var(--green-soft) 62%)}
.doc .tbl{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.doc table{border-collapse:collapse;font-family:var(--f-ui);font-size:13px;line-height:1.6;min-width:100%}
.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.doc th{background:var(--wash);font-weight:700;white-space:nowrap}
.doc td{min-width:6em}
.doc code,.doc pre{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.doc pre{background:var(--wash);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto}
.doc a{color:var(--navy)}
.doc .star{color:var(--green);font-family:var(--f-ui);font-weight:700}
.doc .note-tag{font-family:var(--f-ui);font-size:11px;font-weight:700;border:1px solid var(--muted);border-radius:4px;padding:0 5px;margin-right:4px;color:var(--muted)}
.doc .hl{animation:hl 2.2s ease-out}
@keyframes hl{0%{background:var(--green-soft)}100%{background:transparent}}
@media (prefers-reduced-motion: reduce){.doc .hl{animation:none}}

/* stats */
table.topics{width:100%;border-collapse:collapse;font-size:13px}
table.topics td,table.topics th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left;vertical-align:top}
table.topics td.r,table.topics th.r{text-align:right;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:14px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;z-index:80}
</style>

<div class="app" id="app">
  <header class="top" id="topbar">
    <button class="iconbtn" id="backBtn" hidden aria-label="戻る">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>戻る
    </button>
    <h1 id="title">中小M&amp;A資格試験 対策</h1>
    <span id="topRight"></span>
  </header>
  <main id="view"></main>
</div>

<nav class="nav" id="nav" aria-label="メニュー">
  <div class="nav-in">
    <button class="tab" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
    <button class="tab" data-go="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>4択演習</button>
    <button class="tab" data-go="exam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>模擬試験</button>
    <button class="tab" data-go="ox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7.5" cy="12" r="4.5"/><path d="M14 7.5l7 9M21 7.5l-7 9"/></svg>○×</button>
    <button class="tab" data-go="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/></svg>ノート</button>
  </div>
</nav>

<div class="qbar" id="qbar" hidden><div class="qbar-in" id="qbarIn"></div></div>

<script id="appdata" type="application/json">{"notes": [{"tab": 0, "title": "全体像と学習計画", "html": "\n<p>2026-09-30 · 村上 大輔<\/p>\n<p>添付の公的資料20点を、試験4科目（倫理・行動規範／M&amp;A実務／財務・税務／法務）と市場・政策に沿って再構成したノートです。初回試験は2027年1〜2月の想定（公的資料外の報道・解説記事による）で、出題範囲の土台はスキルマップ（2025年4月）とガイドライン第3版（2024年8月）です。各項目の末尾に原文の出典ページを付けています。<\/p>\n<h2 id=\"n0-1\">試験制度の要点<\/h2>\n<p>60問程度をCBTで120分、総得点の70〜80%程度が合格ラインの想定です。科目ごとに最低50%程度の基準があり、倫理には「選ぶと不合格になり得る」禁忌肢が設けられる方向です（資料2 p.3, 6, 7, 11）。<\/p>\n<div class=\"tbl\"><table><thead><tr><th>項目<\/th><th>内容（2026年3月時点の想定）<\/th><\/tr><\/thead><tbody><tr><td>運営主体<\/td><td>中小企業庁（実施は民間の資格試験実施団体へ委託、毎期公募）<\/td><\/tr><tr><td>実施時期<\/td><td>令和8・9年度に試験実施。初回は2027年1〜2月想定（受託：銀行研修社、2026年5月採択）<\/td><\/tr><tr><td>方式<\/td><td>CBT・一斉実施。立ち上げ期は年3回程度の受験機会<\/td><\/tr><tr><td>設問数・時間<\/td><td>60問程度・120分<\/td><\/tr><tr><td>合格基準<\/td><td>総得点の70〜80%程度＋科目別最低基準50%程度<\/td><\/tr><tr><td>禁忌肢<\/td><td>倫理・行動規範で設定を検討。複数の禁忌肢問題の一定数の誤答で不合格とする設計を想定<\/td><\/tr><tr><td>科目免除<\/td><td>少なくとも立ち上げ期は設けない（士業資格者も全科目受験）<\/td><\/tr><tr><td>難易度<\/td><td>一般的な社会人が一定期間の学習で合格できる水準<\/td><\/tr><tr><td>合格の効果<\/td><td>士業の独占業務（弁護士法72条・税理士法52条等）を行えるようになるわけではない<\/td><\/tr><\/tbody><\/table><\/div>\n<p>（資料2 p.3, 5, 6, 7, 11, 18。受託者と初回時期は公的資料ではなく報道・解説記事による）<\/p>\n<h3 id=\"n0-2\">科目別の出題割合<\/h3>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>倫理とM&amp;A実務で全体の6割以上（60〜65%）を占めます。市場動向・政策はM&amp;A実務の中で必ず出題される想定です（資料2 p.9, 11）。<\/p>\n<div class=\"tbl\"><table><thead><tr><th>科目<\/th><th>割合<\/th><th>60問換算<\/th><th>中項目（資料2 p.10）<\/th><\/tr><\/thead><tbody><tr><td>M&amp;A実務<\/td><td>35〜40%<\/td><td>21〜24問<\/td><td>基礎／事前相談／秘密保持契約／仲介・FA契約／バリュエーション／マッチング／意向表明／基本合意／DD／最終契約／クロージング／PMI／市場動向／中小企業政策<\/td><\/tr><tr><td>（うち市場・政策）<\/td><td>5%<\/td><td>3問<\/td><td>中小M&amp;A市場動向／中小企業政策<\/td><\/tr><tr><td>財務・税務<\/td><td>20〜23%<\/td><td>12〜14問<\/td><td>財務基礎／スキーム検討／バリュエーション／財務DD／最終契約／税務基礎／税務DD<\/td><\/tr><tr><td>（うち税務）<\/td><td>3〜5%<\/td><td>2〜3問<\/td><td>税務基礎／スキームの税務上の留意事項／税務DD／最終契約<\/td><\/tr><tr><td>法務<\/td><td>17〜18%<\/td><td>10〜11問<\/td><td>法務基礎／秘密保持契約／仲介・FA契約／意向表明／基本合意／最終契約／クロージング／リスク／係争<\/td><\/tr><tr><td>倫理・行動規範<\/td><td>25%<\/td><td>15問<\/td><td>使命／仲介者・FAの選定／基本原則／善管注意義務・職業倫理／広告・営業／品位／法令遵守／反社等との関係／情報管理／その他禁止行為／支援機関の基本姿勢<\/td><\/tr><\/tbody><\/table><\/div>\n<p>同じ論点が実務と法務の両方にある場合、手順（オペレーション）は実務、そこで必要な法律知識は法務で出題されます（資料2 p.10）。<\/p>\n<h3 id=\"n0-3\">合格者登録制度<\/h3>\n<p>試験合格後、登録講習を受けて（又は免除要件を満たして）名簿に登録し、定期講習で更新する仕組みが想定されています（資料2 p.3, 17）。<\/p>\n<ol><li><p>試験合格 → 登録講習の受講（または免除要件の充足）<\/p><\/li><li><p>資格登録者名簿に登録 → 登録証の交付、データベースで氏名公表<\/p><\/li><li><p>定期講習で更新（資料2では1〜2年ごと等。資料1では3〜5年ごとの記載）<\/p><\/li><li><p>倫理規程違反の場合は氏名公表・登録停止・取消し<\/p><\/li><\/ol>\n<p>登録要件は、倫理規程の遵守、違反時の処分（氏名公表等）への同意、登録時と定期の講習受講です。支援機関登録制度の登録機関に対し、担当者の資格取得の推奨や、重要事項説明を資格保持者が行うことを求める方向も検討されています（資料2 p.3, 12）。<\/p>\n<h2 id=\"n0-4\">科目×資料マップ<\/h2>\n<p>出題範囲の土台はスキルマップとガイドライン第3版の2つです。残り18点はその補足と、市場・政策問題の出題源になります。◎は主な出題源、○は関連する記載がある科目です。<\/p>\n<div class=\"tbl\"><table><thead><tr><th>資料<\/th><th>内容<\/th><th>倫理<\/th><th>実務<\/th><th>財務・税務<\/th><th>法務<\/th><th>市場・政策<\/th><th>このノートの場所<\/th><\/tr><\/thead><tbody><tr><td>スキルマップ（2025年4月、190p）<\/td><td>使命・倫理行動規範48条・プロセス別の知識スキル・チェックシート41項目<\/td><td>◎<\/td><td>◎<\/td><td>◎<\/td><td>◎<\/td><td><\/td><td>1〜4<\/td><\/tr><tr><td>中小M&amp;Aガイドライン第3版（2024年8月、139p）<\/td><td>第1章 譲渡側向け手引き／第2章 支援機関向け基本事項<\/td><td>◎<\/td><td>◎<\/td><td>○<\/td><td>○<\/td><td>○<\/td><td>1・2・3・5<\/td><\/tr><tr><td>ガイドライン第3版Q&amp;A<\/td><td>全40問<\/td><td>○<\/td><td>○<\/td><td><\/td><td><\/td><td>◎<\/td><td>5<\/td><\/tr><tr><td>参考資料1 手法と特徴<\/td><td>株式譲渡・事業譲渡・会社分割・合併等<\/td><td><\/td><td>◎<\/td><td>○<\/td><td>○<\/td><td><\/td><td>2<\/td><\/tr><tr><td>参考資料2 譲渡額の算定方法<\/td><td>簿価・時価純資産法、利益加算、マルチプル法<\/td><td><\/td><td><\/td><td>◎<\/td><td><\/td><td><\/td><td>3<\/td><\/tr><tr><td>参考資料3 引継ぎ支援センター一覧<\/td><td>全国の所在地<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>○<\/td><td>5<\/td><\/tr><tr><td>参考資料4 中小M&amp;Aの事例<\/td><td>成立・不成立事例<\/td><td><\/td><td>◎<\/td><td><\/td><td><\/td><td><\/td><td>2<\/td><\/tr><tr><td>参考資料5 日本公庫 事業承継マッチング支援<\/td><td>制度概要<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>◎<\/td><td>5<\/td><\/tr><tr><td>参考資料6 仲介・FA契約のチェックリスト<\/td><td>全10項目<\/td><td>○<\/td><td>◎<\/td><td><\/td><td>○<\/td><td><\/td><td>2<\/td><\/tr><tr><td>参考資料7 各種契約書サンプル（2版）<\/td><td>仲介契約・NDA・基本合意・株式譲渡・事業譲渡<\/td><td>○<\/td><td><\/td><td><\/td><td>◎<\/td><td><\/td><td>4<\/td><\/tr><tr><td>参考資料8 廃業支援施策<\/td><td>5種類の支援<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>◎<\/td><td>5<\/td><\/tr><tr><td>参考資料9 サポートツール<\/td><td>ローカルベンチマーク等<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>◎<\/td><td>5<\/td><\/tr><tr><td>参考資料10 担い手探しナビ<\/td><td>日税連のマッチングサイト<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>◎<\/td><td>5<\/td><\/tr><tr><td>参考資料11 重要事項説明書サンプル<\/td><td>説明項目17<\/td><td>◎<\/td><td><\/td><td><\/td><td>○<\/td><td><\/td><td>4（倫理も）<\/td><\/tr><tr><td>参考資料12 リスク説明書サンプル<\/td><td>最終契約のリスク7項目<\/td><td>○<\/td><td><\/td><td><\/td><td>◎<\/td><td><\/td><td>4<\/td><\/tr><tr><td>参考資料13 経営者保証の取扱い<\/td><td>不適切な譲り受け側への対応<\/td><td>○<\/td><td>○<\/td><td><\/td><td>◎<\/td><td><\/td><td>4<\/td><\/tr><tr><td>情報共有の仕組み（2025年2月）<\/td><td>不適切な譲り受け側の情報共有<\/td><td>○<\/td><td><\/td><td><\/td><td><\/td><td>◎<\/td><td>5<\/td><\/tr><tr><td>検討会資料1（2025年6月）<\/td><td>市場改革の方向性・補助金・税制<\/td><td><\/td><td><\/td><td>○<\/td><td><\/td><td>◎<\/td><td>5<\/td><\/tr><tr><td>検討会資料2（2026年3月）<\/td><td>試験概要・サンプル問題4問・登録制度・手数料分析<\/td><td>○<\/td><td>○<\/td><td>○<\/td><td>○<\/td><td>◎<\/td><td>全体像・5<\/td><\/tr><\/tbody><\/table><\/div>\n<p>サンプル問題4問は、各科目タブの該当節に載せています（①スキーム選択→実務、②FCF→財務・税務、③免責条項→法務、④独占業務→倫理）。<\/p>\n<h2 id=\"n0-5\">学習計画<\/h2>\n<p>倫理→実務→財務・税務→法務→市場・政策の順に進め、1月は○×問題集（301問）の反復に充てます。倫理を最初に置くのは、禁忌肢と科目別最低基準で落とせない科目だからです。<\/p>\n<div class=\"tbl\"><table><thead><tr><th>期間<\/th><th>科目（タブ）<\/th><th>重点<\/th><\/tr><\/thead><tbody><tr><td>2026/10/01〜10/14<\/td><td>1 倫理・行動規範<\/td><td>48条、利益相反の禁止行為、重要事項説明17項目、専任・直接交渉・テールの期間、チェックシート41項目<\/td><\/tr><tr><td>10/15〜11/15<\/td><td>2 M&amp;A実務<\/td><td>プロセスの順番と各工程の成果物（NDA・IM・意向表明・基本合意・DD・最終契約）、手法の比較<\/td><\/tr><tr><td>11/16〜12/06<\/td><td>3 財務・税務<\/td><td>純資産法・マルチプル法・DCF、FCF計算、レーマン方式の計算例、財務・税務DD<\/td><\/tr><tr><td>12/07〜12/20<\/td><td>4 法務・契約<\/td><td>契約書サンプルの条文と注、表明保証・補償・クロージング条件、法務DD、経営者保証<\/td><\/tr><tr><td>12/21〜12/31<\/td><td>5 市場・政策<\/td><td>登録制度の数字、補助金の枠と補助率、センターの役割、Q&amp;A40問<\/td><\/tr><tr><td>2027/01〜試験日<\/td><td>6 ○×問題集<\/td><td>301問を3周。間違えた問題は出典ページに戻って確認<\/td><\/tr><\/tbody><\/table><\/div>\n<p>添付資料だけでは足りない領域が2つあります。<\/p>\n<ul><li><p><strong>税務の基礎<\/strong>：法人税・所得税・相続税・贈与税・登録免許税等の税率や課税関係は、添付資料にほぼ記載がありません。事業承継・M&amp;Aエキスパート等の市販テキストで補ってください。<\/p><\/li><li><p><strong>法務基礎<\/strong>：会社法（株主総会・取締役会の決議、譲渡制限株式）・民法・労働法の基本は、契約書サンプルの範囲でしか出てきません。<\/p><\/li><\/ul>\n<ul><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 銀行研修社・中小企業庁の受験案内（試験日・受験料・受験資格・試験会場）の公表を確認する<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 公式テキスト・問題集が出たら、このノートとの差分を確認する<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 試験日に合わせて帰国の予定を組む（CBT会場は国内の可能性が高い）<\/p><\/li><\/ul>\n<h2 id=\"n0-6\">作成メモ<\/h2>\n<p>全タブは添付資料の記載だけで書き、各タブを執筆とは別の担当が原資料と照合しています。照合で見つかった誤記・出典ページのずれ・表示崩れは修正済みです。<\/p>\n<div class=\"tbl\"><table><thead><tr><th>項目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>実測者<\/td><td>Claude（執筆と照合を別のエージェントで実施）<\/td><\/tr><tr><td>実測日<\/td><td>2026/09/30<\/td><\/tr><tr><td>実測手段<\/td><td>添付20ファイルの全文を pdftotext で抽出して全行精読。図表は原本PDFの画像で確認。手数料の事例1〜4、譲渡額の算定例、FCFは再計算で検算<\/td><\/tr><tr><td>確度<\/td><td>確定（添付資料の記載）。例外：受託者と初回試験時期は公的資料外の報道・解説記事、資料2 p.26 の手数料率は目視の概算、<span class=\"note-tag\">注<\/span>の「誤記の可能性」は推測<\/td><\/tr><tr><td>対象外<\/td><td>試験日・受験料・受験資格・公式教材（2026/09/29時点で未公表）、税率など添付資料に記載のない一般知識<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"n0-7\">実体の識別（添付ファイル名・sha256先頭16桁）<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>ファイル<\/th><th>資料<\/th><th>sha256（先頭16桁）<\/th><\/tr><\/thead><tbody><tr><td>m_and_a_guideline.pdf.txt<\/td><td>GL<\/td><td>913cef4d3475a407<\/td><\/tr><tr><td>skills-map.pdf.txt<\/td><td>SM<\/td><td>b9c43dcdf920f031<\/td><\/tr><tr><td>001.pdf<\/td><td>資料1<\/td><td>63be68bbed74cdab<\/td><\/tr><tr><td>002.pdf<\/td><td>資料2<\/td><td>1df430ef888ff62c<\/td><\/tr><tr><td>900016282.pdf<\/td><td>Q&amp;A<\/td><td>185708ce7301944d<\/td><\/tr><tr><td>ver03_s01.pdf<\/td><td>情報共有<\/td><td>bd9c1969e22c6468<\/td><\/tr><tr><td>900016254.pdf<\/td><td>参考資料1<\/td><td>550c88eac7e56395<\/td><\/tr><tr><td>900016261.pdf<\/td><td>参考資料2<\/td><td>989f75b5c2ab6a6d<\/td><\/tr><tr><td>900016262.pdf<\/td><td>参考資料3<\/td><td>384d76a7f8eb2e78<\/td><\/tr><tr><td>900016263.pdf<\/td><td>参考資料4<\/td><td>fb5277a9263b54aa<\/td><\/tr><tr><td>900016264.pdf<\/td><td>参考資料5<\/td><td>5bcee3ca435cef44<\/td><\/tr><tr><td>900016265.pdf<\/td><td>参考資料6<\/td><td>0cccb97cd3de4cd5<\/td><\/tr><tr><td>007_01.pdf<\/td><td>参考資料7（版A）<\/td><td>449d3119242839fc<\/td><\/tr><tr><td>007_02.pdf<\/td><td>参考資料7（版B）<\/td><td>58c211a0d8e1d6a7<\/td><\/tr><tr><td>900016270.pdf<\/td><td>参考資料8<\/td><td>3c3c1e27b5e5f293<\/td><\/tr><tr><td>900016271.pdf<\/td><td>参考資料9<\/td><td>9a710964d3f67431<\/td><\/tr><tr><td>900016255.pdf<\/td><td>参考資料10<\/td><td>7c939c27ef2d7526<\/td><\/tr><tr><td>900016256.pdf<\/td><td>参考資料11<\/td><td>fe00cded5ba6d167<\/td><\/tr><tr><td>900016259.pdf<\/td><td>参考資料12<\/td><td>6301f61edfe67e22<\/td><\/tr><tr><td>013.pdf<\/td><td>参考資料13<\/td><td>03dbdbe45753fe25<\/td><\/tr><\/tbody><\/table><\/div>\n", "toc": [{"id": "n0-1", "level": 2, "text": "試験制度の要点"}, {"id": "n0-2", "level": 3, "text": "科目別の出題割合"}, {"id": "n0-3", "level": 3, "text": "合格者登録制度"}, {"id": "n0-4", "level": 2, "text": "科目×資料マップ"}, {"id": "n0-5", "level": 2, "text": "学習計画"}, {"id": "n0-6", "level": 2, "text": "作成メモ"}, {"id": "n0-7", "level": 3, "text": "実体の識別（添付ファイル名・sha256先頭16桁）"}]}, {"tab": 1, "title": "倫理・行動規範", "html": "<h2 id=\"n1-1\">中小M&amp;A専門人材の使命<\/h2>\n<p>使命は「質の高いマッチング」と「一連のプロセスの着実かつ円滑な実行支援」を通じ、依頼者の利益実現と事業の継続・成長に貢献し、国民経済の発展に寄与することである。倫理・行動規範の前提として、仲介者とFAの違いを明確に理解している必要がある。<\/p>\n<h3 id=\"n1-2\">使命の内容<\/h3>\n<ol>\n<li>M&amp;Aに係る専門的知見および高い倫理観を基に、中小企業をはじめとした依頼者・関係者等に対して、<strong>質の高いマッチングの提供<\/strong>と、<strong>M&amp;Aの一連のプロセスの着実かつ円滑な実行等に向けた支援<\/strong>を提供する。<\/li>\n<li>これにより、<strong>M&amp;Aによる依頼者の利益の実現<\/strong>を図る。<\/li>\n<li>あわせて、<strong>収益性または社会的意義等を有する事業および希少な経営資源の引継ぎ<\/strong>により、<strong>事業の継続および成長の実現に貢献<\/strong>する。<\/li>\n<li>もって<strong>国民経済の発展に寄与する<\/strong>ことを使命とする。<\/li>\n<\/ol>\n<ul>\n<li>出所：中小M&amp;Aガイドライン（第3版）の策定趣旨等を踏まえて作成。（SM p.7）<\/li>\n<li>中小M&amp;A専門人材の定義：「M&amp;A取引の円滑化・適正化・顧客利益の最大化による支援を通じて、中小企業の持続性・競争力向上に貢献し、日本の経済発展・生産性向上に寄与する」。（SM p.3）<\/li>\n<li><span class=\"note-tag\">注<\/span>p.16では「円滑化・適正化、顧客利益の最大化に向けた支援を通じて」と表記がやや異なる。（SM p.3, p.16）<\/li>\n<\/ul>\n<h3 id=\"n1-3\">三概念（使命・倫理行動規範・知識スキル）の関係<\/h3>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>専門人材の要件は「使命」「倫理・行動規範」「知識・スキル」の三概念で整理され、上位・中位・下位の階層構造をとる。（SM p.4）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>概念<\/th>\n<th>位置づけ<\/th>\n<th>検討軸・内容の例<\/th>\n<th>掲載ページ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>使命<\/td>\n<td>上位概念<\/td>\n<td>マクロ観点（社会への寄与）／ミクロ観点（顧客・関係者への寄与）<\/td>\n<td>SM p.6〜7<\/td>\n<\/tr>\n<tr>\n<td>倫理・行動規範<\/td>\n<td>中位概念<\/td>\n<td>基本原則、業務内容/プロセス（仲介者・FA、相談、マッチング、基本合意、最終契約、クロージング等）、関係者（顧客、他事業者、取引先等）、所属等属性（個人/組織、所属法人の種類等）。秘密保持、反社排除、情報管理等<\/td>\n<td>SM p.8〜13<\/td>\n<\/tr>\n<tr>\n<td>知識・スキル<\/td>\n<td>下位概念<\/td>\n<td>マクロ⇔ミクロ観点、M&amp;Aプロセス、知識領域、スキル種別、知識・スキルの定義内容等<\/td>\n<td>SM p.14〜189<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.4）<\/p>\n<ul>\n<li>対象は仲介者・FA等の業態を限定せず、中小M&amp;Aに関わる個人を広く含む。（SM p.5）<\/li>\n<li>M&amp;Aは「総合格闘技」とも称され、幅広い能力が求められる。（SM p.5）<\/li>\n<\/ul>\n<h3 id=\"n1-4\">仲介者とFAの比較<\/h3>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>仲介者は双方と契約し双方から手数料を受けるのが通常で、<strong>いずれか一方の利益のみを優先的に取り扱うことはできない<\/strong>。FAは一方と契約し、依頼者に有利な条件での成立を目指す。（SM p.9）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>仲介者<\/th>\n<th>FA<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>契約の相手方等<\/td>\n<td>譲り渡し側・譲り受け側の<strong>双方<\/strong>と契約。<strong>双方から手数料<\/strong>を受けるのが通常<\/td>\n<td>譲り渡し側・譲り受け側の<strong>一方<\/strong>と契約。<strong>その一方から<\/strong>手数料を受ける<\/td>\n<\/tr>\n<tr>\n<td>特徴<\/td>\n<td>双方から依頼を受けるため、<strong>いずれか一方の利益のみを優先的に取り扱うことはできない<\/strong>。双方の意向を一元的に把握し、共通の目的であるM&amp;A成立を目指し助言・調整する<\/td>\n<td>一方のみから依頼を受けるため、依頼者の意向を踏まえ<strong>依頼者に有利な条件<\/strong>での成立を目指し助言・調整する<\/td>\n<\/tr>\n<tr>\n<td>活用例<\/td>\n<td>最も有利な条件（譲渡額の最大化・最小化等）での成立だけを重視せず、仲介者が双方とやり取りして円滑に手続を進めることを重視する場合<\/td>\n<td>最も有利な条件での成立を重視する場合。債権者・株主等との関係で最も有利な条件を目指す必要がある場合（①厳格な入札方式を希望する場合＝債務整理手続を要する債務超過企業のM&amp;A等、②経営者が株主等に最善のM&amp;Aをしたと合理的に説明できるよう、利益相反のおそれが生じない機関を選定する等の配慮が必要な場合）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.9。GL第3版 第1章3(2)-1 より引用）<\/p>\n<ul>\n<li>依頼者は「業務形態、業務範囲・内容、契約期間、報酬（手数料）体系、M&amp;A取引の実績（件数・年数等）、利用者の声等」をホームページや担当者から確認し、<strong>複数の仲介者・FAから比較検討して決定することが重要<\/strong>である点に留意する。（SM p.9）<\/li>\n<li>依頼者にとって「相性」も重要であることを踏まえ、どちらの形態が適しているかに留意する。（SM p.9）<\/li>\n<li>倫理・行動規範の出題中項目には「使命」「仲介者・FAの選定等」が含まれる。（資料2 p.10）<\/li>\n<\/ul>\n<h2 id=\"n1-5\">倫理・行動規範（全48条）<\/h2>\n<p>倫理・行動規範は全48条で、下の表の大分類に整理されている。強制力を持つ規程ではなく、M&amp;A専門人材が満たすべき要素を抽出したものと位置づけられる。（SM p.10）<\/p>\n<h3 id=\"n1-6\">条文構造の一覧<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>大分類<\/th>\n<th>小分類<\/th>\n<th>条番号<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>基本原則<\/td>\n<td>―<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>善管注意義務・職業倫理<\/td>\n<td>善管注意義務<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>〃<\/td>\n<td>支援の質の向上<\/td>\n<td>3, 4<\/td>\n<\/tr>\n<tr>\n<td>〃<\/td>\n<td>顧客利益の優先<\/td>\n<td>5〜13<\/td>\n<\/tr>\n<tr>\n<td>〃<\/td>\n<td>利益相反の防止（仲介者が対象）<\/td>\n<td>14〜18<\/td>\n<\/tr>\n<tr>\n<td>〃<\/td>\n<td>報告義務<\/td>\n<td>19, 20<\/td>\n<\/tr>\n<tr>\n<td>〃<\/td>\n<td>その他（贈答・接待）<\/td>\n<td>21<\/td>\n<\/tr>\n<tr>\n<td>広告・営業<\/td>\n<td>虚偽・誤解を与える文言使用の禁止<\/td>\n<td>22, 23<\/td>\n<\/tr>\n<tr>\n<td>〃<\/td>\n<td>不適切な営業活動の禁止<\/td>\n<td>24, 25<\/td>\n<\/tr>\n<tr>\n<td>品位<\/td>\n<td>品位の保持<\/td>\n<td>26<\/td>\n<\/tr>\n<tr>\n<td>〃<\/td>\n<td>品位を損なう行為の禁止<\/td>\n<td>27〜31<\/td>\n<\/tr>\n<tr>\n<td>法令等の遵守<\/td>\n<td>法令等の遵守<\/td>\n<td>32〜36<\/td>\n<\/tr>\n<tr>\n<td>不適切な個人・組織、反社等との関係<\/td>\n<td>同左<\/td>\n<td>37〜39<\/td>\n<\/tr>\n<tr>\n<td>情報管理<\/td>\n<td>情報の取り扱い<\/td>\n<td>40〜45<\/td>\n<\/tr>\n<tr>\n<td>〃<\/td>\n<td>関係者の指導・監督<\/td>\n<td>46<\/td>\n<\/tr>\n<tr>\n<td>不適切行為の禁止<\/td>\n<td>―<\/td>\n<td>47<\/td>\n<\/tr>\n<tr>\n<td>その他禁止行為<\/td>\n<td>その他禁止行為<\/td>\n<td>48<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.10〜13）<\/p>\n<h3 id=\"n1-7\">基本原則・善管注意義務・職業倫理（#1〜#21）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条<\/th>\n<th>見出し（小分類）<\/th>\n<th>趣旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>基本原則<\/td>\n<td>常に信義に従い、公正、誠実に業務を遂行すること<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>善管注意義務<\/td>\n<td>職業倫理を遵守し、善管注意義務をもって業務にあたること<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>支援の質の向上<\/td>\n<td>不断の自己研鑽に努める（①実務経験を通じた知識・スキル向上、②適切な助言・指導・援助の能力と人間性の向上、③社会・経済・法律・技術・環境等への関心による幅広い視野と柔軟な発想の深化）<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>支援の質の向上<\/td>\n<td>異なる強み・専門性を持つ支援者や士業等専門家等と積極的に連携すること<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>顧客利益の優先<\/td>\n<td>M&amp;A成立後の成功（成長・継続等）につながる支援を行う。<strong>仮にも、M&amp;Aの成立のみを目的として支援を実施しないこと<\/strong><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>顧客利益の優先<\/td>\n<td>顧客の意思を尊重し、利益実現のための対応をすること<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>顧客利益の優先<\/td>\n<td>顧客や関係者の利益を犠牲にして自ら又は関係者の利益を<strong>追求してはならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>顧客利益の優先<\/td>\n<td>リスクや懸念点が判明した場合、取引の相手側へ適切に開示を行うよう助言すること<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>顧客利益の優先<\/td>\n<td>顧客が第三者から<strong>セカンド・オピニオン<\/strong>を得ることを<strong>妨げてはならない<\/strong>。得られることを顧客へ伝えること<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>顧客利益の優先<\/td>\n<td>資料提供依頼等は目的・意図を説明し、顧客の情報提供の負担に留意すること<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>顧客利益の優先<\/td>\n<td>仲介・アドバイザリー契約の内容を、顧客の理解度に鑑み十分かつ明確に説明すること<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>顧客利益の優先<\/td>\n<td>秘密保持契約・基本合意・最終契約等は顧客の納得のもとで締結する。<strong>無理やりに案件を推進させてはならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>顧客利益の優先<\/td>\n<td>締結する契約について顧客が十分に検討する時間を与えること<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>利益相反の防止<\/td>\n<td>仲介者は、<strong>顧客同意にかかわらず<\/strong>、取引の当事者となり、又は自己の利益関係者の代理人と<strong>なってはならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>利益相反の防止<\/td>\n<td>利益相反事項があると判断されるときは顧客に<strong>開示しなければならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>利益相反の防止<\/td>\n<td>一方に有利な支援で他方の利益を不当に害さぬよう、中立的な立ち位置の確保など適切な利益相反管理を<strong>行わなければならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>利益相反の防止<\/td>\n<td>双方と仲介契約を締結する仲介者であることを双方に<strong>書面で開示し、承諾を取得<\/strong>すること<\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td>利益相反の防止<\/td>\n<td><strong>バリュエーション、DD<\/strong>等、一方の意向を踏まえやすい工程の<strong>結論を決定しない<\/strong>。必要に応じ士業等専門家の意見を求めるよう伝えること<\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td>報告義務<\/td>\n<td>進捗状況を<strong>定期的に報告<\/strong>する。要求があれば滞りなく報告すること<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>報告義務<\/td>\n<td>合理的な意思決定に必要な情報を<strong>積極的に取得し、提供<\/strong>すること<\/td>\n<\/tr>\n<tr>\n<td>21<\/td>\n<td>その他（贈答・接待）<\/td>\n<td>顧客からの贈答・接待等について、公平な支援を妨げるような<strong>社会通念上許容される範囲を超える<\/strong>金銭・物品等を受け取っ<strong>てはならない<\/strong>。支援者から顧客への社会通念上許容される範囲を超えた贈答・接待等も厳に慎むこと<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.10〜11）<\/p>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>#14は「顧客が同意しても」当事者・利益関係者の代理人になれない点が引っかけになりやすい。（SM p.11）<\/p>\n<h3 id=\"n1-8\">広告・営業、品位（#22〜#31）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条<\/th>\n<th>見出し（小分類）<\/th>\n<th>趣旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>22<\/td>\n<td>虚偽・誤解を与える文言使用の禁止<\/td>\n<td>虚偽・誇大・誤解を生じる表示や隠ぺいを<strong>してはならない<\/strong>。誹謗中傷する広告・比較広告も厳に慎むこと<\/td>\n<\/tr>\n<tr>\n<td>23<\/td>\n<td>虚偽・誤解を与える文言使用の禁止<\/td>\n<td>不確実な事項について<strong>断定的判断を提供<\/strong>し、確実と誤認させるおそれのあることを告げる行為を<strong>行ってはならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>24<\/td>\n<td>不適切な営業活動の禁止<\/td>\n<td>不当な目的・品位を損なう広告・宣伝等で顧客を勧誘<strong>してはならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>25<\/td>\n<td>不適切な営業活動の禁止<\/td>\n<td><strong>停止意思<\/strong>（M&amp;A実施意向がない／契約締結しない／引き続き広告・営業を希望しない）を表示されたら、<strong>ただちに広告・営業を停止しなければならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>26<\/td>\n<td>品位の保持<\/td>\n<td>常に見識と品位の保持・向上に努め、業界に対する信頼を高めること<\/td>\n<\/tr>\n<tr>\n<td>27<\/td>\n<td>品位を損なう行為の禁止<\/td>\n<td>品位を損なう事業を営み・参入<strong>してはならない<\/strong>。自己の名義を利用させ<strong>てはならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>28<\/td>\n<td>品位を損なう行為の禁止<\/td>\n<td>誠実性・社会的信頼・品位を損なう行為、公序良俗に反する行為を<strong>してはならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>29<\/td>\n<td>品位を損なう行為の禁止<\/td>\n<td>関係者を誹謗・中傷<strong>してはならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>30<\/td>\n<td>品位を損なう行為の禁止<\/td>\n<td>関係者を欺罔・脅迫する行為、不当な要求をする行為を<strong>してはならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>31<\/td>\n<td>品位を損なう行為の禁止<\/td>\n<td>不当な手段により関係者の業務を妨害<strong>してはならない<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.11〜12）<\/p>\n<h3 id=\"n1-9\">法令等の遵守、反社等との関係（#32〜#39）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条<\/th>\n<th>見出し（小分類）<\/th>\n<th>趣旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>32<\/td>\n<td>法令等の遵守<\/td>\n<td>社会規範および法令を遵守すること<\/td>\n<\/tr>\n<tr>\n<td>33<\/td>\n<td>法令等の遵守<\/td>\n<td>法令上・契約上の自らの義務を<strong>正当な理由なく履行しない<\/strong>行為を<strong>してはならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>34<\/td>\n<td>法令等の遵守<\/td>\n<td>顧客等・関係者の権利、プライバシー、名誉、信用等を侵害<strong>してはならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>35<\/td>\n<td>法令等の遵守<\/td>\n<td>公的機関・所属業界団体等が制定するM&amp;A関連のガイドライン・指針等を遵守すること<\/td>\n<\/tr>\n<tr>\n<td>36<\/td>\n<td>法令等の遵守<\/td>\n<td>顧客の法令違反・不適切な目的・懸念点が判明したら、<strong>自己や顧客の利益を優先するのではなく<\/strong>、専門機関・士業等への相談も含め対応策を検討すること<\/td>\n<\/tr>\n<tr>\n<td>37<\/td>\n<td>反社等との関係<\/td>\n<td>反社会的勢力等となること、利益供与・便益提供・事実上の交流等を<strong>してはならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>38<\/td>\n<td>反社等との関係<\/td>\n<td>反社等不適切な顧客・関係者でないかを<strong>取引開始前に確認<\/strong>すること<\/td>\n<\/tr>\n<tr>\n<td>39<\/td>\n<td>反社等との関係<\/td>\n<td>不適切な個人・組織の情報を取得したら、<strong>所属組織内で共有<\/strong>すること<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.12）<\/p>\n<h3 id=\"n1-10\">情報管理、不適切行為、その他禁止行為（#40〜#48）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条<\/th>\n<th>見出し（小分類）<\/th>\n<th>趣旨<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>40<\/td>\n<td>情報の取り扱い<\/td>\n<td>情報の取得・管理・活用は法令・指針等を遵守して適切に行うこと<\/td>\n<\/tr>\n<tr>\n<td>41<\/td>\n<td>情報の取り扱い<\/td>\n<td>取得した情報の正しさを自ら確認するよう努めること<\/td>\n<\/tr>\n<tr>\n<td>42<\/td>\n<td>情報の取り扱い<\/td>\n<td>顧客情報を厳格に管理し、悪用・承諾なき流用を<strong>してはならない<\/strong>（①業務上知り得た情報を自ら・関係者の利益に利用しない、②<strong>インサイダー取引<\/strong>防止のため未公表の重要事実にあたり得る情報を顧客・関係者以外に一切伝達せず、故意・過失を問わず行わない、③退職時の情報持ち出し等の不正競争行為をしない、④取引記録・書類の保持に十分注意）<\/td>\n<\/tr>\n<tr>\n<td>43<\/td>\n<td>情報の取り扱い<\/td>\n<td>情報開示時は、顧客・関係者と<strong>必ず事前に<\/strong>開示および範囲・期間等を話し合う。NDAがあれば違反がないか確認すること<\/td>\n<\/tr>\n<tr>\n<td>44<\/td>\n<td>情報の取り扱い<\/td>\n<td><strong>仲介者<\/strong>は、一方依頼者の不利益につながるリスクを含む情報を、善管注意義務の観点から一方依頼者に<strong>開示することが求められる<\/strong>。開示が難しい場合も、支援の打ち切り等で善管注意義務の履行を<strong>果たさなければならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>45<\/td>\n<td>情報の取り扱い<\/td>\n<td>取引終了後も書類等の使用停止・適切な管理（一定期間の保存、アクセス制限等）を<strong>行わなければならない<\/strong>。取り決めにより破棄・破棄証明が必要な場合もある<\/td>\n<\/tr>\n<tr>\n<td>46<\/td>\n<td>関係者の指導・監督<\/td>\n<td>職務に関与させた者にも情報の取り扱いについて適切な指導・監督を行うこと<\/td>\n<\/tr>\n<tr>\n<td>47<\/td>\n<td>不適切行為の禁止<\/td>\n<td>第三者作成の書類・情報を<strong>正当な権限なく違法・不当に偽造・変造・改変等<\/strong>を<strong>してはならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>48<\/td>\n<td>その他禁止行為<\/td>\n<td>善管注意義務・職業倫理上不適切な行為を<strong>してはならない<\/strong>。関係者の不適切行為を<strong>予見・認識しながら<\/strong>、停止等の措置を講じない行為を<strong>してはならない<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.12〜13）<\/p>\n<ul>\n<li><span class=\"note-tag\">注<\/span>#44は原文で「善意管理善管注意義務」と表記。誤記と思われ、趣旨は善管注意義務の履行。（SM p.13）<\/li>\n<\/ul>\n<h3 id=\"n1-11\">独占業務（弁護士法72条・税理士法52条）の前提<\/h3>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>仲介・FA業務は、各士業の独占業務（<strong>弁護士法第72条、税理士法第52条<\/strong>等）に抵触しないことが前提である。（資料2 p.3, p.5）<\/p>\n<ul>\n<li>本資格試験の合格は、既存の業法に基づく独占業務の実施を可能とするものではない。（資料2 p.5）<\/li>\n<li>合格者は、業法上の独占業務（特に弁護士・公認会計士・税理士等の士業のみができる業務）に抵触しないよう留意を要する。（資料2 p.5）<\/li>\n<li>想定水準は「士業専門家と連携できる水準」。財務・税務、法務の基礎知識で論点を見極める。（資料2 p.3）<\/li>\n<li>当事者間の紛争解決に向けた支援は非弁行為（弁護士法第72条）に該当しうるおそれがある旨も、契約時に<strong>説明しなければならない<\/strong>。（GL p.87）→ 本タブ「利益相反と重要事項説明」参照<\/li>\n<\/ul>\n<h3 id=\"n1-12\">サンプル問題④（法令遵守行為：独占業務違反）<\/h3>\n<p>設問：A社とアドバイザリー契約を結び報酬を得る支援機関の「私」（弁護士・税理士・弁理士等の資格なし）が、<strong>適法に行えないもの<\/strong>を全て選べ。（資料2 p.16）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>行為<\/th>\n<th>内容<\/th>\n<th>判定<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ア<\/td>\n<td>A社代表者が株主総会決議を経ずに不動産を第三者Xに譲渡。会社法上無効として、私が代わりにXと交渉した<\/td>\n<td>適法に行えない<\/td>\n<\/tr>\n<tr>\n<td>イ<\/td>\n<td>株式譲渡で株主が払う税額を、契約外の税務相談として無償で試算した<\/td>\n<td>適法に行えない<\/td>\n<\/tr>\n<tr>\n<td>ウ<\/td>\n<td>商標登録未了のため、私がA社と契約して報酬を受領し、一部を弁理士に払って私に代わり申請してもらった<\/td>\n<td>適法に行えない<\/td>\n<\/tr>\n<tr>\n<td>エ<\/td>\n<td>問題社員の退職相談に対し、懲戒事由に該当し懲戒処分が可能との見解を伝えた<\/td>\n<td>適法に行えない<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><span class=\"star\" aria-label=\"頻出\">★<\/span>正答は④「ア、イ、ウ、エ」（4つすべて適法に行えない）。「無償」「契約外」でも適法にならない点に注意。（資料2 p.16）<\/p>\n<ul>\n<li><span class=\"note-tag\">注<\/span>資料には解説文がなく、正答表示のみ。（資料2 p.16）<\/li>\n<\/ul>\n<h2 id=\"n1-13\">支援機関の基本姿勢と支援の質の確保<\/h2>\n<p>支援機関は<strong>依頼者の利益に真に忠実に動くことが求められる<\/strong>。M&amp;A専門業者は許可制・免許制がないが、契約に基づく善管注意義務・忠実義務を負い、契約上の義務に限られない職業倫理の遵守が求められる。停止意思を示されたら<strong>ただちに広告・営業を停止しなければならない<\/strong>。<\/p>\n<h3 id=\"n1-14\">Ⅰ 支援機関としての基本姿勢3点<\/h3>\n<h4>1 依頼者（顧客）の利益の最大化<\/h4>\n<ul>\n<li>専門知識を有する支援機関は、意思決定や手続の段階で<strong>適正なサポート<\/strong>を行う役割が期待される。（GL p.78）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>依頼者は業務や手数料の妥当性を適切に判断しにくい。そのため<strong>依頼者の利益に真に忠実に動くことが求められる<\/strong>。（GL p.78）<\/li>\n<li>重要な判断を求める場合は、<strong>十分に説明して納得を得た上で進める必要がある<\/strong>。（GL p.78）<\/li>\n<\/ul>\n<h4>2 それぞれの役割に応じた適切な支援<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>支援機関<\/th>\n<th>期待される役割<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>M&amp;A専門業者<\/td>\n<td>マッチングやその後の手続の進捗管理等、総合的な支援<\/td>\n<\/tr>\n<tr>\n<td>金融機関<\/td>\n<td>融資で把握した経営状況やネットワークを生かした積極的な働き掛け<\/td>\n<\/tr>\n<tr>\n<td>商工団体<\/td>\n<td>身近な相談相手として、適切な支援機関に紹介する等<\/td>\n<\/tr>\n<tr>\n<td>士業等専門家<\/td>\n<td>専門的知見を生かした手続の遂行等の支援<\/td>\n<\/tr>\n<tr>\n<td>M&amp;Aプラットフォーマー<\/td>\n<td>インターネットを活用したM&amp;Aプラットフォームの運営<\/td>\n<\/tr>\n<tr>\n<td>事業承継・引継ぎ支援センター<\/td>\n<td>公的機関としての中小M&amp;A支援<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.78）<\/p>\n<ul>\n<li>基本的な事項を理解・実践することが<strong>強く望まれる<\/strong>。必要な研鑽を重ね質の向上に尽力することが<strong>望まれる<\/strong>。（GL p.78）<\/li>\n<\/ul>\n<h4>3 支援機関間の連携<\/h4>\n<ul>\n<li>円滑なケースでは支援機関同士が連携している例が多い。（GL p.78）<\/li>\n<li>例：商工団体→センターへつなぐ／センター→登録機関等・連携M&amp;Aプラットフォーマーへ橋渡し／プラットフォームで自らマッチングした企業も交渉局面で士業等の力を借りる。（GL p.79）<\/li>\n<li>自ら全てを抱え込まず、他の支援機関と<strong>積極的に連携することが望まれる<\/strong>。（GL p.79）<\/li>\n<\/ul>\n<h3 id=\"n1-15\">Ⅱ-1 M&amp;A専門業者による支援の特色<\/h3>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>M&amp;A専門業者には<strong>許可制・免許制等はなく、業界全体の一般的な法規制もない<\/strong>（宅地建物取引業法のような規制はない）。士業等は法令で資格・業務・善管注意義務・刑罰等が明確。（GL p.79）<\/li>\n<li>ただし契約に基づき、<strong>善管注意義務<\/strong>と<strong>忠実義務<\/strong>（依頼者の利益を犠牲に自己・第三者の利益を図ってはならない義務）を負う。（GL p.79）<\/li>\n<li>次の3点から、<strong>契約上の義務に限られない職業倫理の遵守<\/strong>が求められる。（GL p.79）\n  1. 取扱業務の専門性\n  2. 知識・情報や候補先情報が業者に偏在（<strong>情報の非対称性<\/strong>の問題）\n  3. 仲介業務における<strong>構造的な利益相反のリスク<\/strong><\/li>\n<li>経済的利益と成立が結びつき、<strong>M&amp;Aの成立が目的化<\/strong>するおそれが指摘されている。（GL p.80）<\/li>\n<li>新規参入の増加に伴い経験の乏しい人材もいるため、仲介者・FAは「<strong>支援の質の確保及び向上<\/strong>」を図る<strong>必要がある<\/strong>。（GL p.80）<\/li>\n<\/ul>\n<h3 id=\"n1-16\">Ⅱ-2 行動指針等の策定の必要性<\/h3>\n<ul>\n<li>業務方針に委ねるだけでなく、市場の<strong>透明性・公正性<\/strong>確保のため一定の指針が示される必要がある。（GL p.80）<\/li>\n<li>金融機関・士業等・プラットフォーマー等が仲介・FA業務を行う場合も、業務の性質が共通する限り準拠を想定。（GL p.80）<\/li>\n<\/ul>\n<h3 id=\"n1-17\">Ⅱ-3 支援の質の確保・向上に向けた取組<\/h3>\n<h4>（1）善管注意義務（忠実義務）及び職業倫理<\/h4>\n<ul>\n<li>依頼の本旨に照らし、善良な管理者の注意をもって業務を処理<strong>しなければならない<\/strong>。（GL p.80）<\/li>\n<li>依頼者の利益を犠牲にして自己又は第三者の利益を図って<strong>はならない<\/strong>。（GL p.81）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>仲介者はいずれの依頼者に対しても<strong>公平・公正でなければならず<\/strong>、一方の利益を優先し又は不当に害する対応をして<strong>はならない<\/strong>。（GL p.81）<\/li>\n<li>契約上の義務の有無にかかわらず、職業倫理として依頼者の意思を尊重し利益を実現する対応が求められる。（GL p.81）<\/li>\n<li>質の確保には<strong>①知識・能力の向上、②適正な業務遂行<\/strong>が重要。取組は公表等で依頼者に伝えることが<strong>望ましい<\/strong>。（GL p.81）<\/li>\n<\/ul>\n<h4>（2）経営トップの意識（①②共通）<\/h4>\n<ul>\n<li>代表者は①②が不可欠と認識し、質の高い支援が重要とのメッセージを<strong>社内・外に発信<\/strong>する（経営理念・ビジョンへの反映等）。発信と整合的な取組を実施する<strong>必要がある<\/strong>。（GL p.81）<\/li>\n<\/ul>\n<h4>（3）他の支援機関（特に士業等専門家）との連携（①②共通）<\/h4>\n<ul>\n<li>他の支援機関と<strong>積極的に連携することが望ましい<\/strong>。（GL p.81）\n  1. 助言の前提となる専門的事項を士業等専門家に確認する。\n  2. 知識不足や法律上の制限で自ら支援できない場合、適切な他の支援機関による支援を受けるよう伝える（プラットフォームでのマッチング、バリュエーションやDDを士業等に依頼、<strong>法律事務は弁護士に相談<\/strong>等）。<\/li>\n<\/ul>\n<h4>（4）①知識・能力の向上のための取組<\/h4>\n<ol>\n<li>求める知識・能力の水準を明らかにし、人材育成を行う（育成方針、社内研修、社外研修の受講支援等）。<\/li>\n<li>取組や成果を適切に評価する（人事評価の一項目とし、報酬・給与に反映等）。<\/li>\n<\/ol>\n<p>（GL p.82）<\/p>\n<h4>（5）②適正な業務遂行のための取組<\/h4>\n<p>ア 役員・従業員：<strong>M&amp;A専門業者が最終的な責任を負う<\/strong>ため、次の取組を<strong>行うべき<\/strong>。（GL p.82）<\/p>\n<ol>\n<li>業務規程・マニュアルへのルール記載、書式作成等で仕組みを作る。<\/li>\n<li>経験・知識が十分でない者は十分な者と業務を行わせ、社内規則等に定める。<\/li>\n<li>善管注意義務・職業倫理に抵触する行為を把握・対応する仕組み（社内相談窓口、懲戒事由としての規定等）を整備する。<\/li>\n<li>依頼者からの<strong>苦情等を受け付け、適切に対応する仕組み・体制<\/strong>を整備する。<\/li>\n<\/ol>\n<p>イ 外部委託先：<strong>委託業務に係る最終的な責任を免れない<\/strong>ため、次の取組を<strong>行うべき<\/strong>。例：別の仲介者・FAへの委託、架電の営業専門会社への依頼。依頼者が直接DDを他者に依頼する場合は除く。（GL p.82〜83）<\/p>\n<ol>\n<li>選定基準を定め、適切な委託先を選定する。<\/li>\n<li>情報の取扱いを適切にし、<strong>依頼者に説明した上でその了承を得る<\/strong>（委託先にも同様の秘密保持義務を負わせ、さらに第三者へ提供されないようにする等）。<\/li>\n<li>委託契約で業務を明らかにする。実施状況を合理的に把握する規定を盛り込むことが<strong>望ましい<\/strong>。<\/li>\n<li>責任部署の明確化や定期確認等で、業務・情報管理状況を監督・指導する。<\/li>\n<li>委託業務の苦情等は<strong>委託元のM&amp;A専門業者が受け付け<\/strong>、適切に対応する。<\/li>\n<\/ol>\n<h4>（6）業界の実務の発展に向けた取組<\/h4>\n<ul>\n<li>業界として<strong>統一的なルールを作り、遵守する取組が期待される<\/strong>。（GL p.83）<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>時期<\/th>\n<th>出来事<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>令和3年4月<\/td>\n<td>中小企業庁が『中小企業の経営資源集約化等に関する検討会 取りまとめ～中小M&amp;A推進計画～』を取りまとめ<\/td>\n<\/tr>\n<tr>\n<td>令和3年10月<\/td>\n<td>自主規制団体として<strong>一般社団法人M&amp;A仲介協会<\/strong>が設立<\/td>\n<\/tr>\n<tr>\n<td>令和5年12月<\/td>\n<td>同協会が<strong>4規程<\/strong>（①倫理規程、②コンプライアンス規程、③広告・営業規程、④契約重要事項説明規程）を策定・公表<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.83）<\/p>\n<h3 id=\"n1-18\">Ⅱ-4(1) 意思決定：広告・営業の規律<\/h3>\n<ul>\n<li>想定される重要なメリット・デメリットを<strong>知り得る限り明示的に説明<\/strong>する。相談者の企業情報の取扱いにも<strong>善管注意義務<\/strong>を負うと自覚する。（GL p.84）<\/li>\n<li>過剰な広告・営業は<strong>民法上の不法行為責任を負う可能性<\/strong>がある。（GL p.84）<\/li>\n<\/ul>\n<h4>① 広告・営業の停止<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>「停止意思」＝①M&amp;Aの実施意向がない、②当該仲介者・FAと契約締結しない、③引き続き広告・営業を受けることを希望しない、のいずれかの意思。拒んでは<strong>ならず<\/strong>、<strong>ただちに停止しなければならない<\/strong>。（GL p.84）<\/li>\n<li>再開する場合は、慎重に検討の上<strong>組織的な判断<\/strong>による必要がある。＝明確化された基準の下、一担当者限りでなく組織的プロセスで行い、<strong>組織的に記録され、事後に検証可能<\/strong>な判断。（GL p.84）<\/li>\n<li>将来にわたり又は一定期間、全ての広告・営業を明確に拒否した者への再開は<strong>当然不可<\/strong>。（GL p.84）<\/li>\n<li>再開後に改めて停止意思を示されたら、<strong>ただちに停止しなければならない<\/strong>。（GL p.84）<\/li>\n<li>停止意思の内容は<strong>組織的に記録し、共有しなければならない<\/strong>。（GL p.84〜85）<\/li>\n<\/ul>\n<h4>② 広告・営業の内容・方法（<strong>行ってはならない<\/strong>もの）<\/h4>\n<ol>\n<li>仲介者・FAの<strong>名称<\/strong>、勧誘者の<strong>氏名<\/strong>、契約締結の<strong>勧誘目的である旨<\/strong>を告げずに行うもの。<\/li>\n<li>意思決定に必要な時間を与えず、<strong>即時の判断を迫る<\/strong>もの。<\/li>\n<li>成立の可能性や条件等について、<strong>虚偽、事実に相違、又は誤認を招く<\/strong>もの。例：\n   - 意向のない企業・未確認の企業・実在しない企業について、意向があると偽る・誤認させる\n   - <strong>過大なバリュエーション<\/strong>の提示（仲介者が実施する場合は確定的でない旨、セカンド・オピニオンを求められる旨等を明示する必要）\n   - 財務状況・見通し等を事実と相違、又は実際より優良・有利と誤認させる\n   - 成立可能性や条件について<strong>確定的な判断を下す<\/strong><\/li>\n<\/ol>\n<p>（GL p.85）<\/p>\n<h2 id=\"n1-19\">利益相反と重要事項説明<\/h2>\n<p>仲介者は最低限、3つの措置を講じ、5つの利益相反行為を<strong>行わない旨を仲介契約書で義務として定めなければならない<\/strong>。契約締結前には重要事項17項目を記載した<strong>書面を交付して説明しなければならない<\/strong>。<\/p>\n<h3 id=\"n1-20\">Ⅱ-5 仲介者における利益相反のリスクと現実的な対応策<\/h3>\n<ul>\n<li>仲介者は両当事者から依頼を受け利害を調整するため、一方の利益を優先・害するリスクがある。<span class=\"star\" aria-label=\"頻出\">★<\/span><strong>なお、利益相反が直ちに違法となるものではない<\/strong>。（GL p.98）<\/li>\n<li>譲渡対価は渡し側は高い方、受け側は安い方が望ましく、構造的に対立する。仲介者には、<strong>リピーターになり得る譲り受け側<\/strong>の利益を優先する動機が指摘されている。（GL p.98）<\/li>\n<li>逆に、譲渡額に連動して手数料が増える場合は、譲り渡し側の利益を優先する動機があるとの指摘もある。（GL p.98〜99）<\/li>\n<li>実務では仲介者の方が多く用いられており、仲介者を<strong>不適切と断ずることは現実的ではない<\/strong>。そこで<strong>最低限、以下の措置を講じることが必要<\/strong>。（GL p.99）<\/li>\n<\/ul>\n<h4>最低限講じるべき措置（3項目）<\/h4>\n<ol>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>両当事者と仲介契約を締結する仲介者であること（両当事者から手数料を受領する定めがあればその旨）を、両当事者に伝える。<\/li>\n<li>バリュエーション、DDといった一方の意向を踏まえやすい工程の<strong>結論を決定しない<\/strong>。必要に応じ士業等専門家等の意見を求めるよう伝える。<\/li>\n<li>契約締結時に<strong>予め<\/strong>、利益の対立が想定される事項を各当事者に<strong>明示的に説明<\/strong>する。対立に係る情報（一方にのみ有利・不利な情報を含む）を認識したら、<strong>適時に明示的に開示<\/strong>する。<\/li>\n<\/ol>\n<p>（GL p.99）<\/p>\n<h4>禁止される利益相反行為（5項目）<\/h4>\n<p>仲介者は両当事者に<strong>中立・公平でなければならず<\/strong>、不当な利益相反行為を<strong>行ってはならない<\/strong>。特に自身又は第三者の利益を図る目的で<strong>決して行ってはならない<\/strong>。少なくとも次の行為を行わず、<strong>仲介契約書で義務として定めなければならない<\/strong>。（GL p.99）<\/p>\n<ol>\n<li>譲り受け側から<strong>追加で手数料を取得<\/strong>し、便宜を図る行為（ニーズに反した優先的マッチング、不当に低額な譲渡価額への誘導等）。<\/li>\n<li><strong>リピーターとなる依頼者を優遇<\/strong>し、便宜を図る行為（同上）。<\/li>\n<li>希望譲渡額より高い（低い）額で成立した場合に、<strong>正規の手数料とは別に差分の一定割合を報酬として要求<\/strong>する行為。<\/li>\n<li>一方から伝達を求められた事項を<strong>他方に伝達せず<\/strong>、又は告げていない事項を<strong>偽って伝達<\/strong>する行為。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>一方にのみ有利又は不利な情報を認識した場合に、当該当事者に伝達せず<strong>秘匿する<\/strong>行為。<\/li>\n<\/ol>\n<p>（GL p.99〜100）<\/p>\n<ul>\n<li>禁忌肢サンプル問題（譲り受け側社長の反社交友を確認しながら説明せず進める）は、本GL第2章Ⅱ.5に抵触するとされる。（資料2 p.8）→ 本タブ「遵守事項チェックシートと禁忌肢」参照<\/li>\n<\/ul>\n<h3 id=\"n1-21\">Ⅱ-4(2) 契約締結時の重要事項説明<\/h3>\n<ul>\n<li>業務形態の実態に合致した契約を締結する<strong>必要がある<\/strong>。締結後は依頼者の意向に沿った手続を実施する必要がある。（GL p.85）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>契約締結前<\/strong>に、重要事項を記載した<strong>書面を交付して（メール等の電磁的方法を含む）説明しなければならない<\/strong>。（GL p.86）<\/li>\n<li>説明の相手方は<strong>契約締結権限を有する者<\/strong>（個人はその個人、法人は代表者又は委任を受けた者）。（GL p.86）<\/li>\n<li>説明後、依頼者に<strong>十分な検討時間を与えるべき<\/strong>。説明者は質問に適切に対応できる経験・能力を有する者が<strong>望ましい<\/strong>。（GL p.86）<\/li>\n<li>参考資料11「重要事項説明書サンプル」を適宜活用。秘密保持契約等に説明項目が含まれる場合も、準じた対応が<strong>望ましい<\/strong>。（GL p.86）<\/li>\n<\/ul>\n<h4>書面等に記載して説明すべき重要事項（17項目）<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>項目<\/th>\n<th>主な内容・補足<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>仲介者とFAの違いと特徴<\/td>\n<td>双方と契約する仲介者／一方のみのFA。両当事者から手数料を受領する場合はその旨。利益相反のおそれのある事項は<strong>事前に両当事者に説明し了承を得ておく必要<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>提供する業務の範囲・内容<\/td>\n<td>プロセスごと。提供しない業務も明確に説明が<strong>望ましく<\/strong>、<strong>少なくともDD・バリュエーションは説明が求められる<\/strong>（下記注）<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>担当者の保有資格、経験年数・成約実績<\/td>\n<td>公認会計士、税理士、中小企業診断士、弁護士、行政書士、司法書士、社会保険労務士、簿記検定・ビジネス会計検定等<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>手数料に関する事項<\/td>\n<td>算定基準、金額、最低手数料、既払手数料の控除、支払時期等<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>手数料以外の費用<\/td>\n<td>費用の種類、支払時期等<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>（仲介者）相手方の手数料<\/td>\n<td>算定基準、最低手数料、支払時期等<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>秘密保持<\/td>\n<td>依頼者の秘密保持義務、対象事実、士業等やセンター等へ開示する場合の<strong>秘密保持義務の一部解除<\/strong>等<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>直接交渉の制限<\/td>\n<td>自ら候補先を発見・直接交渉することを禁止する場合はその旨、対象候補先や交渉目的の範囲等<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>専任条項<\/td>\n<td>セカンド・オピニオンの可否等<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>テール条項<\/td>\n<td>テール期間、対象となるM&amp;A等<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>契約期間<\/td>\n<td>更新（期間の延長）等<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>契約の解除<\/td>\n<td>依頼者が<strong>中途解約できること<\/strong>を明記する場合はその事項<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>責任（免責）<\/td>\n<td>損害賠償責任の要件、賠償額の範囲等。<strong>説明したからといって法的な効力が認められる関係にはない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>契約終了後も効力を有する条項<\/td>\n<td>該当条項、有効期間等<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>（仲介者）利益の対立が想定される事項<\/td>\n<td>―<\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>（譲り渡し側）譲り受け側に実施する調査の概要<\/td>\n<td>実施主体、財務状況・コンプライアンス・事業実態に関する調査等<\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>（譲り渡し側）業界内での情報共有の仕組みへの参加有無<\/td>\n<td>参加していない場合はその旨<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.86〜88）<\/p>\n<ul>\n<li>No.2の注（説明が求められる内容）：（GL p.86〜87）<\/li>\n<li>DDは助言・補助に留め自ら実施しない場合、その旨と、DDは他の支援機関に依頼する必要があることを明確に伝える。<\/li>\n<li>仲介者がバリュエーション・DDの結論を決定しない場合、その旨と専門家の意見を求めるよう伝える。<\/li>\n<li>役務の範囲が<strong>クロージングまで<\/strong>の場合、クロージング後の役務提供が難しい旨を説明する<strong>必要がある<\/strong>。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>範囲に関わらず、<strong>紛争解決に向けた支援は非弁行為（弁護士法第72条）に該当しうるおそれがある旨も説明しなければならず<\/strong>、弁護士等の意見を求める必要がある旨の説明が<strong>望ましい<\/strong>。<\/li>\n<\/ul>\n<h4>① 手数料・提供する業務内容の説明<\/h4>\n<ul>\n<li>手数料が業務内容に<strong>見合っているかについて納得を得る<\/strong>ことが重要。（GL p.88）<\/li>\n<li>次を<strong>書面を交付して（電磁的方法を含む）説明しなければならない<\/strong>：①成功報酬の<strong>報酬率<\/strong>、②<strong>報酬基準額<\/strong>（譲渡額／純資産／移動総資産等）、③<strong>最低手数料の額<\/strong>、④<strong>報酬の発生タイミング<\/strong>（着手金／月額報酬／中間金／成功報酬）、⑤提供する具体的な業務内容。（GL p.88）<\/li>\n<li>業務は<strong>プロセスごとに整理<\/strong>（提供しない場合はその旨も含む）して書面で説明<strong>しなければならない<\/strong>。（GL p.88〜90）<\/li>\n<li>担当者の保有資格・経験年数・成約実績を<strong>説明すべき<\/strong>。サポート者がいればその資格等も説明が<strong>望ましい<\/strong>。（GL p.90〜91）<\/li>\n<li>納得が得られず交渉を申し入れられた場合は、<strong>誠実に対応を検討しなければならない<\/strong>。（GL p.91）<\/li>\n<li>手数料の算定基準を<strong>自社ホームページ等で公表することが望ましい<\/strong>。（GL p.91）<\/li>\n<\/ul>\n<h4>② 相手方の手数料の開示<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>仲介者は<strong>仲介契約締結前<\/strong>に、相手方の手数料（報酬率、報酬基準額、最低手数料、発生タイミング等）を、<strong>手数料の総額が成立や条件（譲渡額等）に影響を与える可能性がある旨も含め<\/strong>、書面で<strong>説明するべき<\/strong>。（GL p.91）<\/li>\n<li>説明した相手方手数料を<strong>増額する場合<\/strong>は、増額の内容を依頼者に<strong>開示するべき<\/strong>。（GL p.91）<\/li>\n<li>開示基準を予め合意する場合、<strong>具体的かつ定量的な基準<\/strong>とし、包括的に開示不要とするものや定性的基準にとどめるものと<strong>すべきではない<\/strong>。少なくとも報酬率・報酬基準額・最低手数料それぞれについて<strong>合意するべき<\/strong>。（GL p.92）<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>変更が生じる項目<\/th>\n<th>開示基準の例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>報酬率<\/td>\n<td>当初から●％以上上昇する場合に開示<\/td>\n<\/tr>\n<tr>\n<td>報酬基準額<\/td>\n<td>変更する場合に開示<\/td>\n<\/tr>\n<tr>\n<td>最低手数料<\/td>\n<td>当初から●円以上増加する場合に開示<\/td>\n<\/tr>\n<tr>\n<td>その他<\/td>\n<td>定額：●円以上増加で開示／定率：●％以上上昇で開示／増額幅が確定しない変更：<strong>必ず開示<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.92）<\/p>\n<ul>\n<li><strong>依頼者の手数料を減額する場合<\/strong>：相手方手数料を<strong>増額していない旨を改めて説明するべき<\/strong>。（GL p.92）<\/li>\n<li><strong>FAの場合<\/strong>：相手方を支援するFAから支払を受ける場合は、<strong>支払額、名目、支払時期<\/strong>を依頼者に<strong>説明するべき<\/strong>。（GL p.92）<\/li>\n<\/ul>\n<h3 id=\"n1-22\">Ⅱ-4(3)〜(10) 各工程の行動指針（規範・禁止）<\/h3>\n<p>各工程の手順は実務タブで扱う。ここでは義務・禁止の語を含む規範だけを整理する。→ 実務タブ参照<\/p>\n<h4>（3）バリュエーション<\/h4>\n<ul>\n<li>評価手法・前提条件等を<strong>事前に説明<\/strong>し、手法や価格帯について<strong>納得を得ることが必要<\/strong>。手法・価格帯が<strong>唯一のものではないことを明示<\/strong>し、適切な理由を具体的に説明することが必要。（GL p.92〜93）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>両当事者を依頼者とする仲介者は、<strong>確定的なバリュエーションを実施すべきではない<\/strong>。必要に応じ士業等専門家等の意見を求めるよう伝える<strong>必要がある<\/strong>。（GL p.93）<\/li>\n<li>簡易評価を両当事者に示す場合、次を<strong>明示すべき<\/strong>：①確定的ではなく参考資料として簡易に算定したこと、②一方の意向・意見等を考慮した場合はその内容、③士業等専門家等の意見を求められること。（GL p.93）<\/li>\n<\/ul>\n<h4>（4）譲り受け側の選定（マッチング）<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>ネームクリアは、譲り渡し側の<strong>同意を取得し、候補先と秘密保持契約を締結した上で<\/strong>実施される<strong>必要がある<\/strong>。同意は<strong>原則として候補先ごとに個別に<\/strong>取得する。（GL p.93）<\/li>\n<li>例外（早期マッチング希望等）で一定基準の下に業者が選定する場合も、<strong>秘密保持契約の締結は必須<\/strong>。<strong>包括的に一任すべきでない<\/strong>。（GL p.93）<\/li>\n<li>その場合に<strong>実施しなければならない<\/strong>事項：（GL p.93〜94）\n  1. 個別同意が通常であること、一任で希望しない先に開示されるリスクを明示的に説明し、メリットを優先する意向を確認する。\n  2. 可能な限り具体的な基準（希望業種・所在地、排除する個社等）を設定する。\n  3. 指示があれば<strong>速やかにネームクリアを中止する旨を明示的に確約<\/strong>する。<\/li>\n<li>NDA締結前に詳細情報が漏えいしないよう<strong>注意する必要<\/strong>。進捗は<strong>遅滞なく報告することが望まれる<\/strong>。（GL p.94）<\/li>\n<li>長期化した場合、月額報酬制の業者は<strong>適正な金額への減免等に応じることが望ましい<\/strong>。（GL p.94）<\/li>\n<\/ul>\n<h4>（5）交渉・（6）基本合意<\/h4>\n<ul>\n<li>寄り添う形で交渉をサポートする<strong>ことが必要<\/strong>。トップ面談は丁寧なサポートが<strong>望まれる<\/strong>。（GL p.94）<\/li>\n<li>仲介者は<strong>中立性・公平性をもって、両当事者の利益の実現を図る必要がある<\/strong>。（GL p.94）<\/li>\n<li>時間的余裕がない場合等を除き、<strong>原則として基本合意を締結することが望ましい<\/strong>。（GL p.94）<\/li>\n<\/ul>\n<h4>（7）DD<\/h4>\n<ul>\n<li>譲り渡し側に資料準備を促しサポートする<strong>ことが必要<\/strong>。小規模企業には<strong>早い時期から<\/strong>整備を促す<strong>必要がある<\/strong>。（GL p.95）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>仲介者は<strong>DDを自ら実施すべきでなく、DD報告書の結論を決定すべきでない<\/strong>。資料整理・スケジュール管理等、評価・判断に影響しない範囲の支援は可能。（GL p.95）<\/li>\n<li>士業等専門家等の意見を求めるよう伝える<strong>必要がある<\/strong>。調査対象を適切な範囲とし、結果を譲り渡し側にも開示するよう働き掛けることが<strong>望ましい<\/strong>。（GL p.95）<\/li>\n<\/ul>\n<h4>（8）最終契約の交渉・締結<\/h4>\n<ul>\n<li>双方が可能な限り納得し、トラブルリスクを低減した形（残る場合は<strong>少なくとも当事者が理解した形<\/strong>）で締結されるよう支援する<strong>必要がある<\/strong>。（GL p.95）<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>対応レベル<\/th>\n<th>対象リスク<\/th>\n<th>求められる対応<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>①認識の有無に関わらず対応<\/td>\n<td>ア 経営者保証の扱い<\/td>\n<td>方針を相談の上検討<strong>しなければならない<\/strong>。士業等（特に弁護士）・センター・金融機関への事前相談が選択肢である旨を説明<strong>しなければならない<\/strong>。相談を<strong>拒むべきでなく<\/strong>、秘密保持条項の対象から相談先を<strong>除外する必要<\/strong>。譲り受け側にも除外を<strong>働きかけなければならない<\/strong>。解除・移行は譲り受け側の義務とし、クロージング条件化、解除・補償条項を盛り込むよう<strong>調整するべき<\/strong><\/td>\n<\/tr>\n<tr>\n<td>〃<\/td>\n<td>イ DDの非実施<\/td>\n<td>DDは双方に重要なプロセスである旨を説明<strong>しなければならない<\/strong>。対象を絞ったDDの推奨が<strong>望ましい<\/strong><\/td>\n<\/tr>\n<tr>\n<td>〃<\/td>\n<td>ウ 表明保証の内容<\/td>\n<td>期間・責任上限がない、適用場面が不明確な場合、過大な責任を負うリスクがある旨を説明<strong>しなければならない<\/strong><\/td>\n<\/tr>\n<tr>\n<td>②認識した段階で対応<\/td>\n<td>エ クロージング後の支払・手続／オ 最終契約後の支払の調整・修正／カ 譲り渡し側の資産・貸付金の最終契約後整理／キ 最終契約からクロージングまでの期間<\/td>\n<td>具体的に説明することが<strong>望ましい<\/strong>。調整不十分な段階で<strong>安易に提案すべきでなく<\/strong>、提案する場合は<strong>組織的な判断<\/strong>により、リスクを具体的に<strong>説明しなければならない<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.96〜97）<\/p>\n<ul>\n<li>最終契約締結時は、内容に漏れがないよう<strong>再度の確認を促すことが必要<\/strong>。弁護士の関与の下で締結することが<strong>望ましい<\/strong>。リスク事項が含まれる場合は締結前に改めて説明することが<strong>望ましい<\/strong>（参考資料12）。（GL p.98）<\/li>\n<\/ul>\n<h4>（9）クロージング・（10）クロージング後<\/h4>\n<ul>\n<li>当日は譲渡対価が<strong>確実に入金されたことを確認することが必要<\/strong>。専門的知見を要する場合は司法書士等の<strong>関与を求めることが必要<\/strong>。（GL p.98）<\/li>\n<li>引継ぎが円滑に行われるよう助言し、譲り渡し側経営者の<strong>愛着<\/strong>にも留意し心情面を含めサポートすることが<strong>望まれる<\/strong>。（GL p.98）<\/li>\n<\/ul>\n<h2 id=\"n1-23\">不適切な譲り受け側の排除と契約条項の規律<\/h2>\n<p>譲り受け側の調査概要は<strong>契約締結前に説明しなければならず<\/strong>、リスク検出時は最終契約前に報告・協議する。専任条項の契約期間は<strong>最長でも6か月～1年以内<\/strong>、テール期間は<strong>最長でも2年～3年以内<\/strong>が目安、直接交渉の制限は<strong>契約終了まで<\/strong>に限定すべきである。<\/p>\n<h3 id=\"n1-24\">Ⅱ-6 不適切な譲り受け側の排除に向けた取組<\/h3>\n<ul>\n<li>問題例：成立後に譲り渡し側の資金を個人口座に送金、最終契約の義務不履行、経営者保証を移行させない等。こうした譲り受け側は市場から<strong>排除していく必要<\/strong>がある。（GL p.100）<\/li>\n<li>確認には限界があり信用を保証するレベルは難しいが、仲介者・FA（<strong>M&amp;Aプラットフォーマーを含む<\/strong>）には<strong>少なくとも以下の取組が求められる<\/strong>。（GL p.100）<\/li>\n<\/ul>\n<h4>（1）譲り受け側に対する調査<\/h4>\n<ul>\n<li>目的：最終契約を履行し、対象事業を引き継ぐ<strong>意思・能力<\/strong>の確認。調査の実施が<strong>求められる<\/strong>。（GL p.100）<\/li>\n<li>内容：財務状況・事業実態、反社該当性・過去のM&amp;Aトラブルの有無（代表者・役員・株主等を含む）。財務は<strong>譲渡対価を調達可能か、事業を継続運営できるか<\/strong>の観点。（GL p.100）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>タイミング：<strong>仲介契約・FA契約締結前<\/strong>（プラットフォーマーは<strong>登録前<\/strong>）に加え、進捗過程でも実施し、<strong>最終契約の締結までに<\/strong>十分確認する。（GL p.100）<\/li>\n<li>方法：<strong>税務申告書<\/strong>や<strong>商業登記簿<\/strong>の確認、関係者も含めたコンプライアンスチェック。（GL p.100〜101）<\/li>\n<li>譲り渡し側が<strong>債務超過<\/strong>等の場合は特に慎重に、<strong>少なくとも決算公告や税務申告書の確認<\/strong>が<strong>求められる<\/strong>。保証債務が移行せず簿外債務を遮断できる事業譲渡等は必要性が低い場合もある。（GL p.101）<\/li>\n<li>譲り渡し側には契約締結前に調査概要を<strong>説明しなければならない<\/strong>。依頼があれば<strong>見直しを検討しなければならない<\/strong>。（GL p.101）<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>調査項目<\/th>\n<th>方法<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>財務状況<\/td>\n<td>財務諸表の確認<\/td>\n<td>債務超過・赤字でないか、現預金の額等<\/td>\n<\/tr>\n<tr>\n<td>コンプライアンス<\/td>\n<td>Web上の不芳情報検索、社内DB、業界内情報共有の仕組み、外部DB・調査会社（対象：譲り受け側、経営者、役員、主要株主、関連会社）<\/td>\n<td>反社該当性やM&amp;Aトラブルの有無等<\/td>\n<\/tr>\n<tr>\n<td>事業実態<\/td>\n<td>商業登記簿、web地図閲覧、事業所訪問<\/td>\n<td>事業実態の有無、契約締結権限を有する者か<\/td>\n<\/tr>\n<tr>\n<td>最終契約の実行可能性<\/td>\n<td>財務諸表、預金通帳、融資証明書等<\/td>\n<td>譲渡対価の支払等を実行できる状況か<\/td>\n<\/tr>\n<tr>\n<td>その他<\/td>\n<td>ヒアリング、過去の依頼者からのクレーム、業界内情報共有の仕組み<\/td>\n<td>M&amp;Aの背景、過去のトラブル（最終契約の不履行等）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.101〜102。実施主体＝仲介者・FAの担当者・内部審査部門、又は関連会社）<\/p>\n<ul>\n<li>調査<strong>方法を変更する場合<\/strong>は、内容を<strong>理由とともに説明しなければならない<\/strong>。（GL p.102）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>遅くとも最終契約の締結前までに<\/strong>調査し、リスク検出時は<strong>開示可能な範囲で<\/strong>報告し、取引実行の可否や条項内容を<strong>協議しなければならない<\/strong>。（GL p.102）<\/li>\n<\/ul>\n<h4>（2）不適切な行為に係る情報を取得した場合の対応<\/h4>\n<ul>\n<li>情報を<strong>担当者レベルに留めず、組織的に共有<\/strong>し、支援を慎重に検討する<strong>体制を構築しなければならない<\/strong>。（GL p.102）<\/li>\n<li>新たな支援を行う場合は、<strong>組織的な判断<\/strong>（明確な基準の下、組織的プロセスで、記録され事後検証可能）に<strong>よらなければならない<\/strong>。（GL p.102）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>仲介者は、譲り受け側の不適切行為の情報を<strong>譲り渡し側に開示することが求められる<\/strong>（Ⅱ-5の適時開示の要請）。（GL p.102〜103）<\/li>\n<\/ul>\n<h4>（3）業界内での情報共有の仕組みの構築<\/h4>\n<ul>\n<li>不適切な譲り受け側の情報を業界内で共有する仕組みの構築が<strong>期待される<\/strong>。情報管理を前提に、可能な限り多くが参加することが<strong>強く望まれる<\/strong>。（GL p.103）<\/li>\n<li>契約締結前（プラットフォーマーは登録前）に、仕組みへの<strong>参加有無（不参加ならその旨）を説明しなければならない<\/strong>。（GL p.103）<\/li>\n<\/ul>\n<h3 id=\"n1-25\">契約条項の規律（専任・直接交渉の制限・テール）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>条項<\/th>\n<th>定義<\/th>\n<th>期間の目安<\/th>\n<th>範囲の限定<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>専任条項<\/td>\n<td>並行して他のM&amp;A専門業者へ依頼することを禁止<\/td>\n<td>契約期間を<strong>最長でも6か月～1年以内<\/strong>を目安に<strong>定めるべき<\/strong><\/td>\n<td>対象範囲を<strong>可能な限り限定すべき<\/strong>。妨げる合理的理由がなければセカンド・オピニオンを<strong>許容すべき<\/strong><\/td>\n<\/tr>\n<tr>\n<td>直接交渉の制限<\/td>\n<td>業者を介さず候補先と直接交渉・接触することを禁止<\/td>\n<td>有効期間は<strong>契約が終了するまでに限定すべき<\/strong><\/td>\n<td>候補先は<strong>業者が関与・接触し紹介した先のみ<\/strong>、交渉は<strong>M&amp;Aに関する目的のものに限定すべき<\/strong><\/td>\n<\/tr>\n<tr>\n<td>テール条項<\/td>\n<td>契約終了後一定期間内のM&amp;Aについて手数料を取得<\/td>\n<td>テール期間は<strong>最長でも2年～3年以内<\/strong>を目安とすることが<strong>望ましい<\/strong><\/td>\n<td><strong>業者が関与・接触し、紹介された譲り受け側のみに限定すべき<\/strong>（少なくともネームクリア済み）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（GL p.103〜105）<\/p>\n<h3 id=\"n1-26\">Ⅱ-7 専任条項の留意点<\/h3>\n<ul>\n<li>合理性：同一候補先への重複打診による心証悪化や、情報拡散を抑止する点で一定の合理性がある。（GL p.103）<\/li>\n<li>問題点：セカンド・オピニオンを求められないと、助言の妥当性を判断できなくなるおそれ。（GL p.103）<\/li>\n<\/ul>\n<ol>\n<li>対象範囲を<strong>可能な限り限定すべき<\/strong>。<\/li>\n<li>意見を求めたい部分を明確にし、妨げる合理的理由がなければ、<strong>セカンド・オピニオンを求めることを許容すべき<\/strong>。<\/li>\n<li>ただし情報漏えいリスクに備え、相手方情報の開示禁止や、相談先を<strong>秘密保持義務がある者やセンター等の公的機関に限定<\/strong>する等、<strong>情報管理に配慮する必要<\/strong>がある。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>契約期間を<strong>最長でも6か月～1年以内を目安として定めるべき<\/strong>。<\/li>\n<li>任意の時点で<strong>中途解約できることを明記する条項<\/strong>等を設けることが<strong>望ましい<\/strong>。<\/li>\n<\/ol>\n<p>（GL p.103〜104）<\/p>\n<h3 id=\"n1-27\">Ⅱ-8 直接交渉の制限に関する条項の留意点<\/h3>\n<ul>\n<li>合理性：交渉窓口の一本化による円滑化。（GL p.104）<\/li>\n<\/ul>\n<ol>\n<li><strong>対象候補先<\/strong>：業者が<strong>関与・接触し、紹介した候補先のみに限定すべき<\/strong>。例外＝依頼者が「自ら候補先を発見しないこと」「自ら発見した候補先と直接交渉しないこと」を<strong>明示的に了解している場合<\/strong>。<\/li>\n<li><strong>交渉の目的<\/strong>：一律に禁じると通常の事業を阻害するため、<strong>M&amp;Aに関する目的のものに限定すべき<\/strong>。<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>有効期間<\/strong>：契約終了後の対応はテール条項で手当て得るため、<strong>仲介契約・FA契約が終了するまでに限定すべき<\/strong>。<\/li>\n<\/ol>\n<p>（GL p.104）<\/p>\n<h3 id=\"n1-28\">Ⅱ-9 テール条項の留意点<\/h3>\n<ul>\n<li>合理性：成立直前で手数料回避のために契約を終了させるケース等を念頭に置く。業者の<strong>相当程度の貢献<\/strong>がある場合に合理性が認められる。（GL p.105）<\/li>\n<\/ul>\n<ol>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span><strong>テール期間<\/strong>：<strong>最長でも2年～3年以内を目安とすることが望ましい<\/strong>。<\/li>\n<li><strong>対象事業者<\/strong>：業者が関与・接触し、紹介された譲り受け側のみに<strong>限定すべき<\/strong>。ロングリスト／ショートリストやノンネーム・シートの提示のみは<strong>対象とすべきでなく<\/strong>、<strong>少なくともネームクリア<\/strong>（企業概要書を送付し名称を開示）が行われた先に限る。<\/li>\n<li><strong>専任条項がない場合<\/strong>：複数業者から同一候補先を紹介され、選択されなかった業者は、<strong>テール条項を根拠に手数料を請求すべきではない<\/strong>。<\/li>\n<\/ol>\n<p>（GL p.105）<\/p>\n<ul>\n<li>結論：テール条項は<strong>譲り渡し側の自由な経営判断を損なわない限度で活用されるべき<\/strong>。（GL p.105）<\/li>\n<li><span class=\"note-tag\">注<\/span>チェックシートでは、ネームクリアの要件を満たせばテール条項の有効性が全て認められるものではないと補足されている。（SM p.188）<\/li>\n<\/ul>\n<h2 id=\"n1-29\">遵守事項チェックシート（41項目）と禁忌肢<\/h2>\n<p>チェックシートはM&amp;A支援機関登録制度の遵守事項を41項目に整理したもので、GL第2章Ⅱの規範と対応する。倫理科目は<strong>出題割合25%程度・15問程度<\/strong>で、GLに明らかに違反する行為を正しいとする選択肢は<strong>禁忌肢<\/strong>とされ、一定数の誤答で不合格となる設計が想定されている。<\/p>\n<h3 id=\"n1-30\">遵守事項一覧チェックシート（1〜24）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>区分<\/th>\n<th>遵守事項（要旨）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>善管注意義務（忠実義務）及び職業倫理<\/td>\n<td>契約に基づく義務の履行：⑴善管注意義務をもって業務を行う／⑵依頼者の利益を犠牲に自己・第三者の利益を図らない／⑶（仲介者）公平・公正で、一方の利益の優先や不当に害する対応をしない<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>同上<\/td>\n<td>契約上の義務の有無にかかわらず、職業倫理として依頼者の意思を尊重し利益を実現する<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>経営トップの意識<\/td>\n<td>代表者が①知識・能力向上②適正な業務遂行を不可欠と認識し、社内外にメッセージを発信し、整合的な取組を実施<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>知識・能力の向上<\/td>\n<td>水準の明確化と人材育成（育成方針、社内研修、社外研修の受講支援等）、取組・成果の適切な評価（人事評価・報酬への反映等）<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>適正な業務遂行<\/td>\n<td>役員・従業員：規程・マニュアル・書式、経験不足者は十分な者と業務、抵触行為の把握・対応の仕組み（相談窓口、懲戒事由等）、苦情受付体制<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>同上（外部委託）<\/td>\n<td>選定基準による選定／情報取扱いを適切にし依頼者に説明し了承（委託先にも秘密保持義務）／委託業務の明確化（実施状況把握規定は<strong>望ましい<\/strong>）／監督・指導／苦情は委託元が受付<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>意思決定<\/td>\n<td>⑴重要なメリット・デメリットを知り得る限り明示的に説明／⑵相談者の企業情報にも善管注意義務を負うと自覚<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>意思決定（広告・営業）<\/td>\n<td>⑴停止意思で<strong>ただちに停止<\/strong>／⑵再開は組織的な判断／⑶停止意思を組織的に記録・共有／⑷名称等を告げない、即時判断を迫る、虚偽・誤認を招く広告・営業を行わない。過剰な営業は民法上の不法行為責任の可能性<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>仲介契約・FA契約の締結<\/td>\n<td>業務形態の実態に合致した契約を締結<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>同上<\/td>\n<td>契約締結前に重要事項を記載した書面（電磁的方法を含む）を交付して説明し納得を得る。説明すべき点＝⑴〜⑰の17項目（→本タブ「利益相反と重要事項説明」の表）<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>同上<\/td>\n<td>手数料・業務・相手方手数料：⑴報酬率・報酬基準額・最低手数料・発生タイミングと業務内容を書面で／⑵プロセスごとの提供業務（提供しない旨も）／⑶担当者の資格・年数・実績／⑷交渉申入れに誠実に対応検討／⑸（仲介者）相手方手数料と総額が条件に影響し得る旨を書面で／⑹相手方手数料の増額は開示（基準は具体的・定量的。少なくとも報酬率・報酬基準額・最低手数料で合意）／⑺依頼者手数料減額時は相手方を増額していない旨を説明／⑻（FA）相手方FAからの支払は額・名目・時期を説明<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>同上<\/td>\n<td>10・11の説明は契約締結権限を有する者（個人は本人、法人は代表者又は委任を受けた者）に行う<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>同上<\/td>\n<td>説明後、依頼者に十分な検討時間を与える<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>バリュエーション<\/td>\n<td>手法・前提条件等を事前に説明し、手法や価格帯についても納得を得る<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>マッチング<\/td>\n<td>ネームクリアは譲り渡し側の同意取得と候補先との秘密保持契約締結の上で実施<\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>同上<\/td>\n<td>同意は原則候補先ごとに個別取得。一定基準で選定する場合は①リスクの明示的説明と意向確認／②具体的基準の設定／③指示で速やかに中止する確約<\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>同上<\/td>\n<td>NDA締結前に詳細情報が流出・漏えいしないよう注意<\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td>交渉<\/td>\n<td>全体像や流れを分かりやすく説明し、寄り添う形でサポート<\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td>DD<\/td>\n<td>譲り受け側が要求する資料の準備を促しサポート<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>最終契約の交渉・締結<\/td>\n<td>双方が可能な限り納得し、リスクを低減した形（残る場合は当事者が理解した形）で締結されるよう支援<\/td>\n<\/tr>\n<tr>\n<td>21<\/td>\n<td>同上<\/td>\n<td>争いに発展し得るリスクの調整・説明：⑴経営者保証（意向聴取、弁護士・センター・金融機関への事前相談の選択肢、相談を拒まず秘密保持対象から除外、譲り受け側の義務化・クロージング条件化・解除／補償条項）／⑵DD非実施（重要性を説明）／⑶表明保証（過大な責任のリスクを説明）／⑷認識した段階で対応するリスク（安易に提案せず、組織的判断で具体的に説明）<\/td>\n<\/tr>\n<tr>\n<td>22<\/td>\n<td>同上<\/td>\n<td>締結時に漏れがないよう再度の確認を促す。リスク事項があれば締結前に改めて説明することが望ましい<\/td>\n<\/tr>\n<tr>\n<td>23<\/td>\n<td>クロージング<\/td>\n<td>段取りを整え、当日に譲渡対価が確実に入金されたことを確認<\/td>\n<\/tr>\n<tr>\n<td>24<\/td>\n<td>不適切な譲り受け側の排除<\/td>\n<td>⑴履行・引継ぎの意思・能力の調査と契約前（PFは登録前）の調査概要説明（内容・タイミング・方法。債務超過時は少なくとも決算公告・税務申告書）／⑵不適切情報は組織的に共有し慎重検討の体制／⑶新たな支援は組織的判断／⑷（仲介者）不適切行為の情報を譲り渡し側に開示<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.181〜187）<\/p>\n<h3 id=\"n1-31\">遵守事項一覧チェックシート（25〜41）<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>区分<\/th>\n<th>遵守事項（要旨）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>25<\/td>\n<td>専任条項<\/td>\n<td>対象範囲を可能な限り限定。妨げる合理的理由がなければセカンド・オピニオンを許容。情報管理に配慮（相手方情報の開示禁止、相談先を秘密保持義務者・公的機関に限定等）<\/td>\n<\/tr>\n<tr>\n<td>26<\/td>\n<td>同上<\/td>\n<td>契約期間は<strong>最長でも6か月～1年以内<\/strong>を目安<\/td>\n<\/tr>\n<tr>\n<td>27<\/td>\n<td>同上<\/td>\n<td>任意の時点で中途解約できることを明記する条項等（<strong>口頭での明言も含む<\/strong>）を設ける<\/td>\n<\/tr>\n<tr>\n<td>28<\/td>\n<td>直接交渉の制限<\/td>\n<td>対象は業者が関与・接触し紹介した候補先のみ（依頼者が明示的に了解している場合を除く）<\/td>\n<\/tr>\n<tr>\n<td>29<\/td>\n<td>同上<\/td>\n<td>制限される交渉は依頼者と候補先のM&amp;Aに関する目的のものに限定<\/td>\n<\/tr>\n<tr>\n<td>30<\/td>\n<td>同上<\/td>\n<td>有効期間は<strong>仲介契約・FA契約が終了するまで<\/strong>に限定<\/td>\n<\/tr>\n<tr>\n<td>31<\/td>\n<td>テール条項<\/td>\n<td>テール期間は<strong>最長でも2年～3年以内<\/strong>を目安<\/td>\n<\/tr>\n<tr>\n<td>32<\/td>\n<td>同上<\/td>\n<td>対象は業者が関与・接触した譲り受け側で、譲り渡し側に紹介された者のみに限定。⑴リストやノンネーム・シートの提示のみは対象外、少なくともネームクリア済みに限る／⑵専任条項がなく選択されなかった業者はテール条項を根拠に請求しない<\/td>\n<\/tr>\n<tr>\n<td>33<\/td>\n<td>利益相反（仲介者のみ）<\/td>\n<td>契約締結前に、両当事者と契約する仲介者であること（双方から手数料を受領する場合はその旨）を伝える<\/td>\n<\/tr>\n<tr>\n<td>34<\/td>\n<td>同上<\/td>\n<td>予め利益の対立が想定される事項を明示的に説明。対立に係る情報を認識したら適時に明示的に開示<\/td>\n<\/tr>\n<tr>\n<td>35<\/td>\n<td>同上<\/td>\n<td>両当事者に中立・公平で、不当な利益相反行為を行わない<\/td>\n<\/tr>\n<tr>\n<td>36<\/td>\n<td>同上<\/td>\n<td>自己・第三者の利益目的で決して行わず、仲介契約書で義務として定める5行為：⑴追加手数料での便宜／⑵リピーター優遇／⑶差分の一定割合の報酬要求／⑷不伝達・虚偽伝達／⑸有利・不利情報の秘匿<\/td>\n<\/tr>\n<tr>\n<td>37<\/td>\n<td>同上<\/td>\n<td>確定的なバリュエーションを実施せず、必要に応じ専門家の意見を求めるよう伝える<\/td>\n<\/tr>\n<tr>\n<td>38<\/td>\n<td>同上<\/td>\n<td>簡易評価を示す場合、⑴参考資料として簡易算定したもの／⑵一方の意向等を考慮した場合はその内容／⑶専門家の意見を求められること、を両当事者に明示<\/td>\n<\/tr>\n<tr>\n<td>39<\/td>\n<td>同上<\/td>\n<td>交渉で一方の利益のみを図らず、中立性・公平性をもって両当事者の利益実現を図る<\/td>\n<\/tr>\n<tr>\n<td>40<\/td>\n<td>同上<\/td>\n<td>DDを自ら実施せず、DD報告書の結論を決定せず、専門家の意見を求めるよう伝える<\/td>\n<\/tr>\n<tr>\n<td>41<\/td>\n<td>その他<\/td>\n<td>GLの「M&amp;A専門業者」に関する記載について、GLの趣旨（後継者不在の経営者の背中を押し適切に進める手引きと、支援者の基本事項を示すこと）に則った対応に努める<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（SM p.188〜189。33〜40は仲介業務を行わない場合は不要）<\/p>\n<ul>\n<li><span class=\"note-tag\">注<\/span>No.27はGL本文では「設けることが<strong>望ましい<\/strong>」（GL p.104）だが、チェックシートでは「設ける」とされ「口頭での明言も含む」と補足されている。（SM p.188）<\/li>\n<\/ul>\n<h3 id=\"n1-32\">禁忌肢の方針<\/h3>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>倫理・行動規範の遵守徹底を最も重視するメッセージとして、<strong>禁忌肢を設定すべき<\/strong>とされた。（資料2 p.7）<\/li>\n<li>設定対象：倫理に著しく反する支援者を排除する目的で、正しいと理解することに大いに問題がある誤答肢。（資料2 p.7）<\/li>\n<li>設計イメージ：禁忌肢を設定した設問を複数設け、<strong>それらの一定数の誤答を以て不合格<\/strong>とする。（資料2 p.7）<\/li>\n<li>具体的イメージ：実際のトラブル事例も参考に、<strong>GLに明らかに違反する行為や、トラブルに繋がる確度が相当に高い行為<\/strong>。曖昧な内容ではなく<strong>明確に問題がある内容<\/strong>とする想定。（資料2 p.7）<\/li>\n<li>代替策：作問技術やCBTシステム上難しい場合は、<strong>倫理科目の科目別合格最低基準の引き上げ<\/strong>や<strong>禁忌肢設定予定設問の配点を高くする<\/strong>等。（資料2 p.7）<\/li>\n<li>検討会での発言例：設問ごとの配点差、職業倫理の設問に限った最低合格基準、医師国家試験のような禁忌肢など。（資料2 p.7）<\/li>\n<\/ul>\n<h3 id=\"n1-33\">倫理科目の位置づけと出題割合<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>出題割合<\/td>\n<td><strong>25%程度<\/strong>（60問なら<strong>15問程度<\/strong>）。M&amp;A実務と並び他科目より高い<\/td>\n<\/tr>\n<tr>\n<td>合格基準<\/td>\n<td>総得点の70〜80%程度＋科目別最低基準50%程度<\/td>\n<\/tr>\n<tr>\n<td>中項目<\/td>\n<td>使命／仲介者・FAの選定等／基本原則／善管注意義務・職業倫理／広告・営業／品位／法令等の遵守／不適切な個人・組織、反社等との関係／情報管理／その他禁止行為／支援機関向けの基本姿勢<\/td>\n<\/tr>\n<tr>\n<td>科目設置目的<\/td>\n<td>善管注意義務や職業倫理、利益相反の防止、情報管理、法令遵守等の基本原則、広告・営業・品位保持、反社排除。基本的な考え方から禁止事項・望ましい対応の知識を判定<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.6, p.9〜11）<\/p>\n<h3 id=\"n1-34\">禁忌肢サンプル問題（善管注意義務）<\/h3>\n<p>設問：仲介業者として、後継者不在のA社社長を支援。譲り受け候補のB社は前向きな発言をするが、社内では同種の買い手のトラブルも見聞きしている。A社社長は不安を感じている。善管注意義務の観点から最も適切なものはどれか。（資料2 p.8）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>選択肢<\/th>\n<th>内容<\/th>\n<th>判定<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>①<\/td>\n<td>B社の調査結果をA社へ報告し、最終契約締結前にトラブルとなり得るリスクを説明する<\/td>\n<td><strong>正答<\/strong><\/td>\n<\/tr>\n<tr>\n<td>②<\/td>\n<td>B社社長と反社会組織の交友関係を確認したが、成約を優先しA社社長に説明せず進める<\/td>\n<td><strong>誤答（禁忌肢）<\/strong><\/td>\n<\/tr>\n<tr>\n<td>③<\/td>\n<td>適格性はB社の提供情報や会社案内で判断すれば足りるとし、追加調査を行わない<\/td>\n<td>誤答<\/td>\n<\/tr>\n<tr>\n<td>④<\/td>\n<td>説明は手数料の算定方法・金額を中心とし、プロセスごとの業務やリスクは詳細説明しない<\/td>\n<td>誤答<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>（資料2 p.8）<\/p>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>②は「中小M&amp;Aガイドラインに明らかに抵触する内容」として禁忌肢。<strong>GL第2章Ⅱ.5「仲介者における利益相反のリスクと現実的な対応策」に抵触<\/strong>。（資料2 p.8）<\/li>\n<li><span class=\"note-tag\">注<\/span>③④に個別の解説文はなく、誤答の表示のみ。（資料2 p.8）<\/li>\n<\/ul>", "toc": [{"id": "n1-1", "level": 2, "text": "中小M&A専門人材の使命"}, {"id": "n1-2", "level": 3, "text": "使命の内容"}, {"id": "n1-3", "level": 3, "text": "三概念（使命・倫理行動規範・知識スキル）の関係"}, {"id": "n1-4", "level": 3, "text": "仲介者とFAの比較"}, {"id": "n1-5", "level": 2, "text": "倫理・行動規範（全48条）"}, {"id": "n1-6", "level": 3, "text": "条文構造の一覧"}, {"id": "n1-7", "level": 3, "text": "基本原則・善管注意義務・職業倫理（#1〜#21）"}, {"id": "n1-8", "level": 3, "text": "広告・営業、品位（#22〜#31）"}, {"id": "n1-9", "level": 3, "text": "法令等の遵守、反社等との関係（#32〜#39）"}, {"id": "n1-10", "level": 3, "text": "情報管理、不適切行為、その他禁止行為（#40〜#48）"}, {"id": "n1-11", "level": 3, "text": "独占業務（弁護士法72条・税理士法52条）の前提"}, {"id": "n1-12", "level": 3, "text": "サンプル問題④（法令遵守行為：独占業務違反）"}, {"id": "n1-13", "level": 2, "text": "支援機関の基本姿勢と支援の質の確保"}, {"id": "n1-14", "level": 3, "text": "Ⅰ 支援機関としての基本姿勢3点"}, {"id": "n1-15", "level": 3, "text": "Ⅱ-1 M&A専門業者による支援の特色"}, {"id": "n1-16", "level": 3, "text": "Ⅱ-2 行動指針等の策定の必要性"}, {"id": "n1-17", "level": 3, "text": "Ⅱ-3 支援の質の確保・向上に向けた取組"}, {"id": "n1-18", "level": 3, "text": "Ⅱ-4(1) 意思決定：広告・営業の規律"}, {"id": "n1-19", "level": 2, "text": "利益相反と重要事項説明"}, {"id": "n1-20", "level": 3, "text": "Ⅱ-5 仲介者における利益相反のリスクと現実的な対応策"}, {"id": "n1-21", "level": 3, "text": "Ⅱ-4(2) 契約締結時の重要事項説明"}, {"id": "n1-22", "level": 3, "text": "Ⅱ-4(3)〜(10) 各工程の行動指針（規範・禁止）"}, {"id": "n1-23", "level": 2, "text": "不適切な譲り受け側の排除と契約条項の規律"}, {"id": "n1-24", "level": 3, "text": "Ⅱ-6 不適切な譲り受け側の排除に向けた取組"}, {"id": "n1-25", "level": 3, "text": "契約条項の規律（専任・直接交渉の制限・テール）"}, {"id": "n1-26", "level": 3, "text": "Ⅱ-7 専任条項の留意点"}, {"id": "n1-27", "level": 3, "text": "Ⅱ-8 直接交渉の制限に関する条項の留意点"}, {"id": "n1-28", "level": 3, "text": "Ⅱ-9 テール条項の留意点"}, {"id": "n1-29", "level": 2, "text": "遵守事項チェックシート（41項目）と禁忌肢"}, {"id": "n1-30", "level": 3, "text": "遵守事項一覧チェックシート（1〜24）"}, {"id": "n1-31", "level": 3, "text": "遵守事項一覧チェックシート（25〜41）"}, {"id": "n1-32", "level": 3, "text": "禁忌肢の方針"}, {"id": "n1-33", "level": 3, "text": "倫理科目の位置づけと出題割合"}, {"id": "n1-34", "level": 3, "text": "禁忌肢サンプル問題（善管注意義務）"}]}, {"tab": 2, "title": "M&A実務", "html": "<h2 id=\"n2-1\">プロセス全体像と基本姿勢<\/h2>\n<p>中小M&amp;Aは「意思決定→仲介者・FA選定→バリュエーション→マッチング→交渉→基本合意→DD→最終契約→クロージング→ポストM&amp;A」の順に進むことが多い。譲り渡し側は早期判断と秘密保持の徹底が最重要で、全手続を厳格に踏むことまでは要請されていない。<\/p>\n<h3 id=\"n2-2\">中小M&amp;Aの定義と特色<\/h3>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>中小M&amp;A＝後継者不在の中小企業の事業を、社外の第三者が引き継ぐこと。<strong>親族内承継・従業員承継は含めない<\/strong>。（GL p.16）<\/li>\n<li>後継者候補は通常、①親族内→②自社の役員・従業員の順に探す。いずれも不在なら社外の第三者しかなく、実現しなければ廃業となる。（GL p.27）<\/li>\n<li>大企業M&amp;Aと比べた特色（3点）（GL p.27）\n  1. 譲り渡し側はM&amp;A未経験がほとんどで、経験・知見が乏しい傾向。\n  2. 事業が経営者個人の信用・人柄等の<strong>属人的要素<\/strong>に大きく左右される傾向。\n  3. M&amp;Aに<strong>多額のコスト<\/strong>（専門業者・士業の手数料等）を掛けられない傾向。<\/li>\n<\/ul>\n<h3 id=\"n2-3\">譲り渡し側の基本姿勢（GL第1章Ⅰ3）<\/h3>\n<ul>\n<li>「後ろめたい」「ハゲタカ」という感覚は時代に合わない。中小M&amp;Aは<strong>後ろめたいことではなくむしろ誇らしい<\/strong>。譲り受け側にとっても通常は信頼関係に基づく<strong>友好的な取引<\/strong>。（GL p.29）<\/li>\n<li><strong>譲り渡し側経営者は、積極的に中小M&amp;Aを検討することが望まれる。<\/strong>（GL p.29）<\/li>\n<li>従業員の雇用の受皿、取引先との関係（地域サプライチェーン）を守れる。<strong>影響緩和の観点でも意義がある点を認識することが望まれる。<\/strong>（GL p.29）<\/li>\n<li>譲り受け側が評価する要素は収支・財務に限られない。例：高い技術力／優良な取引先との人脈・商流／優秀な従業員／地域・業界内の知名度・ブランド・信用／業歴／業界内シェア／店舗網／知的財産権・ノウハウ／事業分野の将来性／許認可等。（GL p.30）<\/li>\n<li>小規模・赤字・債務超過でも譲り受けを申し出る者は大いにあり得ることを<strong>認識すべきである<\/strong>。<strong>早期に支援機関へ相談してみることが望まれる<\/strong>。（GL p.30）<\/li>\n<li>簿価上は債務超過でも、時価評価し直すと実態は資産超過のケースもある。（GL p.30）<\/li>\n<li>譲り受け側は譲り渡し側の<strong>数倍程度<\/strong>の規模の企業であるケースが相当割合あり、一大決心であることが多い。譲り渡し側は<strong>真摯に対応することが必要<\/strong>。（GL p.30）<\/li>\n<\/ul>\n<h3 id=\"n2-4\">譲り渡し側の留意点（GL第1章Ⅰ4）<\/h3>\n<h4>（1）早期判断の重要性<\/h4>\n<ul>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>マッチングには通常<strong>数か月〜1年程度<\/strong>を要する。早期に判断し動き出すことが重要。（GL p.30）<\/li>\n<li>早期実現で雇用確保・サプライチェーン維持が可能になり、手元に残る譲渡対価が多くなるケースもある。優良店舗など一部事業のみ早期に譲り渡し、事業の一部を継続できる場合もある。（GL p.30）<\/li>\n<li>決断が遅れるほど選択肢は狭まる。資金繰りが尽き、廃業費用すら捻出できなくなるケースもある。（GL p.31）<\/li>\n<\/ul>\n<h4>（2）秘密保持の徹底<\/h4>\n<ul>\n<li>手続全般での秘密厳守は<strong>極めて重要<\/strong>。親戚・友人・社内の役員・従業員にも、知らせる時期・内容に十分注意する。（GL p.31）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>ごく一部（親族・幹部役員等）以外の関係者には、<strong>原則として可能な限りクロージング後（早くとも最終契約締結後）に知らせるべき<\/strong>。（GL p.31）<\/li>\n<li>情報が伝わった後に頓挫すると、取引先喪失・従業員退職等で事業継続に支障を来すおそれ。自ら取引先・同業者に打診する際も同様。知らせる時期はまず双方で協議されたい。（GL p.31）<\/li>\n<li>複数の支援機関がマッチングを試みると情報が必要以上に流出し、むしろリスクとなり得る。そのため単独の支援機関に依頼することが多い。単独か複数かは利点・留意点を把握して選ぶことが<strong>望ましい<\/strong>（→本タブ「マッチング・交渉・基本合意」参照）。（GL p.31）<\/li>\n<\/ul>\n<h4>（3）手続進行上の留意点<\/h4>\n<ul>\n<li>特に小規模な場合は、より簡易な形で実施するのが現実的なケースも多い。（GL p.31）<\/li>\n<li><span class=\"star\" aria-label=\"頻出\">★<\/span>本ガイドラインは基本的な手続を示すもので、<strong>全ての中小M&amp;Aで厳格に全手続を実施することを要請するものではない<\/strong>。（GL p.31）<\/li>\n<li>譲り受け側・支援機関との信頼関係を築き、譲り受け側の意向に誠実に対応することが円滑な進行に必要。（GL p.31-32）<\/li>\n<\/ul>\n<h3 id=\"n2-5\">GLの中小M&amp;Aフロー図（GL p.32-33）<\/h3>\n<p>一般に、フロー図の「中小企業の動き」に沿って進み、各工程で「主な支援機関」が支援することが多い（実際は他の支援機関が支援するケースもある）。（GL p.32）<\/p>\n<ol>\n<li>事前準備（支援機関への相談、後継者不在の確認、引退後ビジョン、株式・事業用資産の整理）<\/li>\n<li>意思決定<\/li>\n<li>仲介者・FAの選定・契約（又は選定せず自ら行う）<\/li>\n<li>バリュエーション（企業価値評価・事業価値評価）<\/li>\n<li>譲り受け側の選定（マッチング）<\/li>\n<li>交渉<\/li>\n<li>基本合意の締結<\/li>\n<li>デュー・ディリジェンス（DD）<\/li>\n<li>最終契約の交渉・締結<\/li>\n<li>クロージング<\/li>\n<li>クロージング後（ポストM&amp;A、PMI）<\/li>\n<\/ol>\n<p>（GL p.33-57） <span class=\"note-tag\">注<\/span>GL p.33のフロー図は画像で本文テキストがない。工程名は目次・本文の見出しから再構成。<\/p>\n<h3 id=\"n2-6\">SMのプロセス全体像（目的・業務内容）<\/h3>\n<p>スキルマップはGL第3版を基に、プロセスを8段階（DDは全般・ビジネス・法務・財務税務・その他に細分）に分解している。（SM p.18）<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>プロセス<\/th>\n<th>目的<\/th>\n<th>業務内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>事前相談<\/td>\n<td>M&amp;Aの目的・ニーズを明確にし、円滑に進める準備を行う<\/td>\n<td>方針・意向に基づき案件の初期検討・事前準備<\/td>\n<\/tr>\n<tr>\n<td>バリュエーション<\/td>\n<td>客観的事実に基づく評価を交渉の前提とする<\/td>\n<td>面談・提出資料・現地調査等で企業・事業を評価<\/td>\n<\/tr>\n<tr>\n<td>マッチング<\/td>\n<td>ニーズ・条件に合う相手を発見する<\/td>\n<td>ロング／ショートリスト作成、候補先へのアプローチ、トップ面談<\/td>\n<\/tr>\n<tr>\n<td>基本合意<\/td>\n<td>DD・最終条件交渉の土台となる基本条件の合意形成<\/td>\n<td>意向表明書の作成・送付、調整、基本合意書の作成・締結<\/td>\n<\/tr>\n<tr>\n<td>DD<\/td>\n<td>実行可否・譲渡額・最終契約内容の検討、PMI課題の整理<\/td>\n<td>譲り受け側がFA・士業を活用しビジネス・財務・税務・法務等を調査<\/td>\n<\/tr>\n<tr>\n<td>最終契約<\/td>\n<td>条件を明確化し、合意に法的拘束力を持たせる<\/td>\n<td>DD発見事項・留保事項を再交渉し最終契約を締結<\/td>\n<\/tr>\n<tr>\n<td>クロージング<\/td>\n<td>前提条件の充足を確認し取引を完遂する<\/td>\n<td>株式等の譲渡と譲渡対価の支払<\/td>\n<\/tr>\n<tr>\n<td>クロージング後（PMI）<\/td>\n<td>譲り受けた事業の円滑な継続と成長<\/td>\n<td>一定期間内に経営統合作業を行う<\/td>\n<\/tr>
