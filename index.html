, "u": "仲介者の利益相反", "q": "中小M&Aの実務ではFAよりも仲介者という形態の方が多く用いられており、仲介者という業態を不適切と断ずることは現実的ではない。", "a": true, "r": "原文どおり（GL p.99）", "k": false}, {"i": 10, "s": "倫理・行動規範", "u": "仲介者の利益相反", "q": "仲介者は、双方と仲介契約を締結する仲介者であること（双方から手数料を受領する場合はその旨）を双方に伝える必要があり、倫理・行動規範では双方に書面で開示し承諾を取得するとされる（倫理#17）。", "a": true, "r": "GLは最低限講じるべき措置として明示を求める（GL p.99）（SM p.11）", "k": false}, {"i": 11, "s": "倫理・行動規範", "u": "仲介者の利益相反", "q": "仲介者は、顧客が同意すれば、その取引において当事者となることができる。", "a": false, "r": "顧客同意にかかわらず、当事者となり又は自己の利益関係者の代理人となってはならない（倫理#14）（SM p.11）", "k": true}, {"i": 12, "s": "倫理・行動規範", "u": "仲介者の利益相反", "q": "仲介者は、FAと同様に、一方当事者に有利となる交渉の支援を行うことができる。", "a": false, "r": "仲介者は中立性・公平性が求められ、一方に有利となる交渉支援はできない（SM p.74）", "k": true}, {"i": 13, "s": "倫理・行動規範", "u": "仲介者の利益相反", "q": "両当事者を依頼者とする仲介者でも、依頼者の意向を踏まえてバリュエーションやDDの結論を自ら決定してよい。", "a": false, "r": "確定的なバリュエーションは実施せず（簡易評価の概算額・暫定額である旨を明示）、DDも自ら実施せず、それらの結論を決定しない（倫理#18）（GL p.93, 95）（SM p.11, 40）（参考資料11 p.3）", "k": true}, {"i": 14, "s": "倫理・行動規範", "u": "仲介者の利益相反", "q": "仲介者が簡易評価を両当事者に示す場合、確定的なバリュエーションではない旨、一方当事者の意向を考慮した場合はその内容、士業等専門家等の意見を求められる旨を明示すべきである。", "a": true, "r": "原文どおり（GL p.93）", "k": false}, {"i": 15, "s": "倫理・行動規範", "u": "仲介者の利益相反", "q": "仲介者は、DDの実施者の下であっても、開示資料の整理・作成のサポートやDDスケジュールの調整・管理を一切行ってはならない。", "a": false, "r": "調査内容の検討や評価・判断に影響しない範囲での支援は可能（GL p.95）", "k": false}, {"i": 16, "s": "倫理・行動規範", "u": "仲介者の利益相反", "q": "仲介者はDDを自ら実施することができ、DD実施機関を積極的に紹介すべきである。", "a": false, "r": "DDは自ら実施すべきでない。DD実施機関の選定は譲り受け側が自ら行うのが原則で、希望しない限り紹介すべきでない（SM p.80, 84）", "k": false}, {"i": 17, "s": "倫理・行動規範", "u": "仲介者の利益相反", "q": "仲介者に特に禁止される利益相反行為は、①譲り受け側から追加手数料を取得して便宜を図る ②リピーターとなる依頼者の優遇 ③希望譲渡額と成立譲渡額の差分の一定割合を正規手数料とは別に要求 ④伝達を求められた事項の不伝達・偽伝達 ⑤一方にのみ有利・不利な情報の秘匿、の5類型である。", "a": true, "r": "原文どおり（GL p.99-100）（Q&A ⑩No.2）（参考資料7 p.7）", "k": false}, {"i": 18, "s": "倫理・行動規範", "u": "仲介者の利益相反", "q": "仲介者は、利益相反行為を行わない旨を、仲介者の義務として仲介契約書に定めなければならない。", "a": true, "r": "原文どおり（GL p.99）", "k": false}, {"i": 19, "s": "倫理・行動規範", "u": "仲介者の利益相反", "q": "金融機関が仲介・FA業務を行う場合、内部の融資部門と仲介・FA部門との間に情報隔壁（チャイニーズ・ウォール）を設けることが望ましい。", "a": true, "r": "原文どおり（GL p.109）", "k": false}, {"i": 20, "s": "倫理・行動規範", "u": "仲介者の利益相反", "q": "金融機関は、事業再生局面にある融資先の中小M&A支援においても、譲り渡し側の真意に即した支援を行うことが求められる。", "a": true, "r": "原文どおり（GL p.109）", "k": false}, {"i": 21, "s": "倫理・行動規範", "u": "広告・営業", "q": "広告・営業先から停止意思を表示された場合、仲介者・FAはただちに広告・営業を停止しなければならない（倫理#25）。", "a": true, "r": "原文どおり（GL p.84）（SM p.11）（Q&A ③No.1）", "k": false}, {"i": 22, "s": "倫理・行動規範", "u": "広告・営業", "q": "停止意思を表示した者への広告・営業の再開は、担当者個人の判断で行うことができる。", "a": false, "r": "組織的な判断による必要がある（GL p.84）", "k": true}, {"i": 23, "s": "倫理・行動規範", "u": "広告・営業", "q": "停止意思を表示した者が全ての広告・営業を受けることを明確に拒否した場合でも、慎重に検討すれば再開は可能である。", "a": false, "r": "再開は当然不可（GL p.84）", "k": true}, {"i": 24, "s": "倫理・行動規範", "u": "広告・営業", "q": "広告・営業の再開後に改めて停止意思を表示された場合は、直ちに停止しなければならない。", "a": true, "r": "原文どおり（GL p.84）", "k": false}, {"i": 25, "s": "倫理・行動規範", "u": "広告・営業", "q": "停止意思の表示があった場合、その内容は組織的に記録し共有しなければならない。", "a": true, "r": "原文どおり（GL p.84-85）", "k": false}, {"i": 26, "s": "倫理・行動規範", "u": "広告・営業", "q": "「組織的な判断」とは、明確化された基準の下での組織的なプロセスによる判断で、組織的に記録され事後に検証可能なものをいう。", "a": true, "r": "原文どおり（GL p.84）", "k": false}, {"i": 27, "s": "倫理・行動規範", "u": "広告・営業", "q": "仲介者・FAの名称や勧誘目的を告げずに行う広告・営業、および即時の判断を迫る広告・営業は行ってはならない。", "a": true, "r": "原文どおり（GL p.85）", "k": false}, {"i": 28, "s": "倫理・行動規範", "u": "広告・営業", "q": "過大なバリュエーションを提示して譲渡額の水準を誤認させる広告・営業は、確定的な旨を明示すれば許容される。", "a": false, "r": "過大なバリュエーションの提示自体が、虚偽・誤認を招く広告・営業として行ってはならない例（GL p.85）", "k": true}, {"i": 29, "s": "倫理・行動規範", "u": "広告・営業", "q": "不確実な事項であっても、顧客の関心を引くため断定的判断を提供することは許容される。", "a": false, "r": "不確実な事項について断定的判断を提供する行為は禁止（倫理#23）（SM p.11）", "k": true}, {"i": 30, "s": "倫理・行動規範", "u": "情報管理", "q": "インサイダー取引は、故意に行った場合のみ禁止される。", "a": false, "r": "故意・過失を問わず行ってはならない（倫理#42）（SM p.13）", "k": true}, {"i": 31, "s": "倫理・行動規範", "u": "情報管理", "q": "取得した情報を開示する場合は、顧客又は関係者と事前に開示範囲・期間等について話し合う（倫理#43）。", "a": true, "r": "原文どおり（SM p.13）", "k": false}, {"i": 32, "s": "倫理・行動規範", "u": "情報管理", "q": "仲介者は、依頼者の情報が他方の依頼者の不利益につながるリスクを含む場合、秘密保持契約があっても善管注意義務の観点から開示すべきか判断が求められ、開示が難しい場合でも支援の打ち切り等により他方の利益保護を図らなければならない（倫理#44）。", "a": true, "r": "原文どおり（SM p.13）", "k": false}, {"i": 33, "s": "倫理・行動規範", "u": "情報管理", "q": "取引終了後は、取引で使用した書類等の使用停止・適切な管理が必要で、顧客との取り決めに応じて情報の破棄・破棄証明が必要な場合もある（倫理#45）。", "a": true, "r": "原文どおり（SM p.13）", "k": false}, {"i": 34, "s": "倫理・行動規範", "u": "反社・法令違反・不適切な譲り受け側", "q": "反社等不適切な顧客・関係者であるかは、取引開始前に確認する（倫理#38）。", "a": true, "r": "原文どおり（SM p.12）", "k": false}, {"i": 35, "s": "倫理・行動規範", "u": "反社・法令違反・不適切な譲り受け側", "q": "顧客の法令違反等が判明した場合は、自己や顧客の利益を優先し、対応策を検討する。", "a": false, "r": "自己や顧客の利益を優先せず、専門機関や士業等専門家への相談も含めて対応策を検討する（倫理#36）（SM p.12）", "k": true}, {"i": 36, "s": "倫理・行動規範", "u": "反社・法令違反・不適切な譲り受け側", "q": "仲介者・FAは、不適切な譲り受け側に係る情報を取得した場合、担当者レベルにとどめず組織的に共有し、当該譲り受け側への新たな支援は組織的な判断によらなければならない。", "a": true, "r": "原文どおり（GL p.102）", "k": false}, {"i": 37, "s": "倫理・行動規範", "u": "善管注意義務と免責（サンプル問題）", "q": "免責条項があれば、アドバイザーは相手方情報の検証義務を負わず、重大過失があっても免責が優先される。", "a": false, "r": "免責条項があっても、正確かつ適切な情報提供（必要な検証を含む）義務が直ちに消えるわけではない（資料2 p.15）", "k": false}, {"i": 38, "s": "倫理・行動規範", "u": "善管注意義務と免責（サンプル問題）", "q": "免責条項がある限り、アドバイザーの善管注意義務は課されない。", "a": false, "r": "サンプル問題で誤答とされる選択肢（資料2 p.15）", "k": false}, {"i": 39, "s": "倫理・行動規範", "u": "善管注意義務と免責（サンプル問題）", "q": "サンプル問題（善管注意義務）では、譲り受け側社長と反社会組織との交友関係を確認しながら、成約を優先して依頼者に説明せず取引を進める選択肢が禁忌肢とされ、GL第2章Ⅱ.5「仲介者における利益相反のリスクと現実的な対応策」に抵触するとされている。", "a": true, "r": "原文どおり（資料2 p.8）", "k": false}, {"i": 40, "s": "M&A実務", "u": "中小M&Aの基本・支援機関の選び方", "q": "中小M&Aには、親族内承継及び従業員承継は含まれない。", "a": true, "r": "GLは両者を中小M&Aに含めないものとする（GL p.16）", "k": false}, {"i": 41, "s": "M&A実務", "u": "中小M&Aの基本・支援機関の選び方", "q": "仲介者は譲り渡し側・譲り受け側の一方のみと契約し、FAは双方と契約する。", "a": false, "r": "逆。仲介者は双方と契約し双方から手数料を受け取るのが通常、FAは一方とのみ契約しその一方から手数料を受け取る（GL p.17-18）（SM p.9）（参考資料11 p.2）（参考資料6 p.1）", "k": false}, {"i": 42, "s": "M&A実務", "u": "中小M&Aの基本・支援機関の選び方", "q": "セカンド・オピニオンには、同様の業務を提供する者の意見（狭義）と、士業等専門家や事業承継・引継ぎ支援センター等異なる業務を提供する者の意見（広義）があり、いずれも含まれる。", "a": true, "r": "原文どおり（GL p.19）", "k": false}, {"i": 43, "s": "M&A実務", "u": "中小M&Aの基本・支援機関の選び方", "q": "中小M&Aに関する基本的な認識や取り巻く環境が近年大きく変化する中で、譲り渡し側経営者は、積極的に中小M&Aを検討することが望まれる。", "a": true, "r": "原文どおり（GL p.29）", "k": false}, {"i": 44, "s": "M&A実務", "u": "中小M&Aの基本・支援機関の選び方", "q": "譲り受け側は、赤字や債務超過の事業であれば譲り受けを申し出ることはない。", "a": false, "r": "赤字・債務超過でも価値を認めて申し出ることは大いにあり得る（GL p.30）", "k": false}, {"i": 45, "s": "M&A実務", "u": "中小M&Aの基本・支援機関の選び方", "q": "中小M&Aに関する情報は、最終契約締結前でも従業員・取引先等に広く知らせておくべきである。", "a": false, "r": "親族や幹部役員等のごく一部を除き、原則として可能な限りクロージング後（早くとも最終契約締結後）に知らせる（GL p.31）", "k": false}, {"i": 46, "s": "M&A実務", "u": "事前相談", "q": "中小M&Aの意思決定がまだ済んでいない段階では、支援機関への相談は控えるべきである。", "a": false, "r": "済んでいないからこそ相談することが必要（GL p.34）", "k": false}, {"i": 47, "s": "M&A実務", "u": "事前相談", "q": "支援機関への初回相談には、直近3年分の税務申告書・決算書・勘定科目内訳明細書の写しを用意すれば十分である。", "a": true, "r": "原文どおり（GL p.34）", "k": false}, {"i": 48, "s": "M&A実務", "u": "事前相談", "q": "株主総会の特別決議を確実に可決するため、総議決権の3分の2以上の株式を保有しておくことが望ましい。", "a": true, "r": "原文どおり（GL p.35-36）", "k": false}, {"i": 49, "s": "M&A実務", "u": "事前相談", "q": "依頼者の状況によっては、M&A以外の手段（アライアンス、廃業、経営者保証解除に向けた取組等）が適当な場合もあり、M&Aの実施が依頼者の真の利益に繋がるかの観点で検討する。", "a": true, "r": "原文どおり（SM p.22, 30）", "k": false}, {"i": 50, "s": "M&A実務", "u": "事前相談", "q": "簡易ヒアリング段階で成約可能性を判断するために確認する項目には、事業規模、営業利益、EBITDA、債務・資産状況、有利子負債、ネットデットが含まれる。", "a": true, "r": "原文どおり（SM p.22〜23）", "k": false}, {"i": 51, "s": "M&A実務", "u": "事前相談", "q": "譲り受け側の属性（事業会社・投資ファンド）は、譲り渡し側の意思決定において重要であるため明示が求められる。", "a": true, "r": "原文どおり（SM p.21）", "k": false}, {"i": 52, "s": "M&A実務", "u": "事前相談", "q": "債務整理手続を要する債務超過企業などで、譲渡額の最大化を特に重視し厳格な入札方式による譲り渡しを希望する場合は、FAの活用例として挙げられている。", "a": true, "r": "原文どおり（GL p.42）（SM p.9）", "k": false}, {"i": 53, "s": "M&A実務", "u": "事前相談", "q": "譲渡額の決定や最終契約内容等の重要事項について中立的・客観的な意見を求める場合は、同業他社への相談（狭義のセカンド・オピニオン）が望ましい。", "a": false, "r": "M&Aに詳しい士業等専門家や事業承継・引継ぎ支援センター（広義のセカンド・オピニオン）が望ましい（GL p.43）", "k": false}, {"i": 54, "s": "M&A実務", "u": "契約前の重要事項説明", "q": "重要事項の説明は、仲介契約・FA契約の締結後、遅滞なく行えばよい。", "a": false, "r": "契約締結前に、業務範囲・内容や手数料等を記載した書面（電磁的方法を含む）を交付して説明する（GL p.69, 86）（Q&A ④No.8）", "k": false}, {"i": 55, "s": "M&A実務", "u": "契約前の重要事項説明", "q": "重要事項の説明は、契約を締結する権限を有する者（個人は当該個人、法人は代表者又は契約締結について委任を受けた者）に対して行う。", "a": true, "r": "原文どおり（GL p.86）（Q&A ④No.9）", "k": false}, {"i": 56, "s": "M&A実務", "u": "契約前の重要事項説明", "q": "アドバイザリー契約の重要事項説明は、書面を交付すれば足り、口頭での説明は不要である。", "a": false, "r": "書面交付に加え口頭で説明が必要で、契約締結権限を有する者に対し行う（SM p.35）", "k": false}, {"i": 57, "s": "M&A実務", "u": "契約前の重要事項説明", "q": "仲介者・FAは、契約に係る重要事項の説明後、依頼者に十分な検討時間を与えるべきである。", "a": true, "r": "原文どおり（GL p.86）", "k": false}, {"i": 58, "s": "M&A実務", "u": "契約前の重要事項説明", "q": "重要事項説明書は、参考資料11のサンプルを必ず使用しなければならない。", "a": false, "r": "必要な重要事項が適切に記載されていれば様式は問わない（Q&A ④No.6）", "k": false}, {"i": 59, "s": "M&A実務", "u": "契約前の重要事項説明", "q": "重要事項説明書に依頼者の記名・押印又は署名欄やチェック項目を設けてはならない。", "a": false, "r": "設けてよい（Q&A ④No.7）", "k": false}, {"i": 60, "s": "M&A実務", "u": "契約前の重要事項説明", "q": "中小M&Aガイドラインが留意点を定める契約条項は、専任条項、直接交渉の制限に関する条項、テール条項である。", "a": true, "r": "原文どおり（SM p.35）", "k": false}, {"i": 61, "s": "M&A実務", "u": "手数料", "q": "仲介者・FAの手数料には一般的な法規制がなく、料金体系は各仲介者・FAによる。", "a": true, "r": "原文どおり（GL p.63）", "k": false}, {"i": 62, "s": "M&A実務", "u": "手数料", "q": "成功報酬の基準として移動総資産額を用いる場合、同じ譲渡額なら負債（借入金）が高いほど手数料は高くなる。", "a": true, "r": "原文どおり（GL p.64）", "k": false}, {"i": 63, "s": "M&A実務", "u": "手数料", "q": "レーマン方式は、各階層の「基準となる価額」に該当する部分に各「乗じる割合」を乗じた金額を合算して報酬を算定する手法で、割合の一例は5億円以下5%、5億円超10億円以下4%、10億円超50億円以下3%、50億円超100億円以下2%、100億円超1%である。", "a": true, "r": "いずれもあくまで一例（資料1 p.9）（参考資料7 p.5）", "k": false}, {"i": 64, "s": "M&A実務", "u": "手数料", "q": "譲渡額1億円・レーマン方式（5億円以下の部分5%）・消費税10%の場合の成功報酬は550万円（税込）である。", "a": true, "r": "1億円×5%＝500万円、税込550万円（GL p.66）", "k": false}, {"i": 65, "s": "M&A実務", "u": "手数料", "q": "レーマン方式で算出した報酬が最低手数料を下回る場合は、算出された報酬額が適用される。", "a": false, "r": "最低手数料が適用される（資料1 p.9）", "k": false}, {"i": 66, "s": "M&A実務", "u": "手数料", "q": "事例4（譲渡額5000万円、最低手数料1000万円（税抜））では、成功報酬は5000万円×5%×110%＝275万円となり、最低手数料の適用はない。", "a": false, "r": "最低手数料1100万円（税込）が適用され、手数料総額は1100万円（GL p.68）", "k": false}, {"i": 67, "s": "M&A実務", "u": "手数料", "q": "成功報酬について最低手数料を設定している場合や既払手数料を控除して算定する場合は、重要事項説明でその旨の説明が求められる。", "a": true, "r": "原文どおり（参考資料11 p.5〜6）", "k": false}, {"i": 68, "s": "M&A実務", "u": "手数料", "q": "重要事項説明書サンプルの報酬基準額の選択肢には、株式価額、オーナー受取額（株式価額＋役員借入金）、企業価値（株式価額＋ネット有利子負債）、移動総資産（株式価額＋有利子負債＋その他の負債）が含まれる。", "a": true, "r": "原文どおり（参考資料11 p.5〜6）", "k": false}, {"i": 69, "s": "M&A実務", "u": "手数料", "q": "仲介者の場合、相手方の手数料の額は自らの利益に影響しないため、意識する必要はない。", "a": false, "r": "相手方の手数料の額が自らの利益に影響する構造にあり、意識する必要がある（GL p.70）", "k": false}, {"i": 70, "s": "M&A実務", "u": "手数料", "q": "譲り渡し側にとって意思決定に直接影響するのは、譲渡額ではなく、譲り渡し側の受取額（譲渡額−仲介者への手数料）である。", "a": true, "r": "原文どおり（GL p.70）", "k": false}, {"i": 71, "s": "M&A実務", "u": "手数料", "q": "仲介者は、仲介契約締結前に、相手方の手数料（報酬率・報酬基準額・最低手数料の額・報酬の発生タイミング等）も書面で説明するべきで、相手方を含めた手数料の総額がM&Aの成立や条件に影響を与える可能性がある旨も含める。", "a": true, "r": "原文どおり（GL p.91）", "k": false}, {"i": 72, "s": "M&A実務", "u": "手数料", "q": "相手方の手数料を増額する場合の開示基準を依頼者と予め合意する際、包括的に開示を不要とする基準や定性的な基準としてもよい。", "a": false, "r": "具体的かつ定量的な基準とすべきで、包括的に開示不要とするものや定性的な基準にとどまるものとすべきではない（GL p.92）", "k": false}, {"i": 73, "s": "M&A実務", "u": "手数料", "q": "依頼者の手数料を減額する場合は、当初説明した相手方の手数料を増額していない旨を改めて説明するべきである。", "a": true, "r": "原文どおり（GL p.92）", "k": false}, {"i": 74, "s": "M&A実務", "u": "手数料", "q": "契約締結前の説明で依頼者から納得が得られず、手数料・業務に関する交渉を申し入れられた場合、仲介者・FAは誠実に対応を検討しなければならない。", "a": true, "r": "原文どおり（GL p.91）", "k": false}, {"i": 75, "s": "M&A実務", "u": "専任・直接交渉の制限・テール条項", "q": "専任条項を設ける場合、契約期間は最長でも6か月〜1年以内を目安として定めるべきであり、加えて、依頼者が任意の時点で中途解約できることを明記する条項等も設けることが望ましい。", "a": true, "r": "原文どおり（GL p.40-41, 104）（SM p.36, 188）（参考資料11 p.9）", "k": false}, {"i": 76, "s": "M&A実務", "u": "専任・直接交渉の制限・テール条項", "q": "専任条項を設ける場合でも、依頼者が意見を求めたい部分が明確で、妨げる合理的理由がなければ、セカンド・オピニオンを求めることを許容すべきである。", "a": true, "r": "原文どおり（GL p.103）", "k": false}, {"i": 77, "s": "M&A実務", "u": "専任・直接交渉の制限・テール条項", "q": "直接交渉の制限に関する条項の対象は、基本的に仲介者・FAが関与・接触し紹介した候補先のみに限定され、有効期間は仲介契約・FA契約が終了するまでに限定すべきである（契約終了後も継続させるべきではない）。", "a": true, "r": "原文どおり。期間の限定はテール条項の存在も踏まえた整理（GL p.40, 104）（SM p.188）（参考資料7 p.3）（Q&A ⑧No.3）", "k": false}, {"i": 78, "s": "M&A実務", "u": "専任・直接交渉の制限・テール条項", "q": "直接交渉が制限される交渉は、依頼者と候補先のM&Aに関する目的で行われるものに限定すべきである。", "a": true, "r": "原文どおり（GL p.104）", "k": false}, {"i": 79, "s": "M&A実務", "u": "専任・直接交渉の制限・テール条項", "q": "テール期間は最長でも2年〜3年以内を目安とし、対象は仲介者・FAが関与・接触し譲り渡し側に紹介した（実際に紹介してきた）譲り受け側とのM&Aに限定すべきである。", "a": true, "r": "原文どおり（GL p.40-41, 105）（SM p.188）（参考資料11 p.9〜10）（参考資料6 p.2）（Q&A ⑨No.1）", "k": false}, {"i": 80, "s": "M&A実務", "u": "専任・直接交渉の制限・テール条項", "q": "ロングリスト/ショートリストやノンネーム・シート（ティーザー）の提示のみにとどまる場合も、テール条項の対象とすべきである。", "a": false, "r": "対象とすべきでなく、少なくともネームクリアが行われ紹介された譲り受け側に限定すべき（GL p.105）（Q&A ⑨No.3）", "k": false}, {"i": 81, "s": "M&A実務", "u": "専任・直接交渉の制限・テール条項", "q": "ガイドラインがテール条項の対象を「少なくともネームクリア後に紹介された譲り受け側」に限定すべきとしていることは、それを満たす場合にすべからくテール条項の有効性を認める趣旨である。", "a": false, "r": "有効性を認めるものではない（Q&A ⑨No.3）", "k": false}, {"i": 82, "s": "M&A実務", "u": "専任・直接交渉の制限・テール条項", "q": "専任条項がない場合に複数業者から同一候補先を紹介されたとき、選択されなかったM&A専門業者はテール条項を根拠に手数料を請求すべきではない。", "a": true, "r": "原文どおり（GL p.105）", "k": false}, {"i": 83, "s": "M&A実務", "u": "マッチング", "q": "複数の支援機関にマッチング支援を依頼すると、秘密保持上の不利益やレピュテーションリスクが生じる可能性は、単独依頼より高くなる。", "a": true, "r": "原文どおり（GL p.45）", "k": false}, {"i": 84, "s": "M&A実務", "u": "マッチング", "q": "ノンネーム・シートは、譲り受け側候補先との秘密保持契約の締結前に送付されるため、譲り渡し側が特定されない内容とする。", "a": true, "r": "原文どおり（SM p.52）", "k": false}, {"i": 85, "s": "M&A実務", "u": "マッチング", "q": "ショートリストに記載する譲り受け側候補先の情報は、秘密保持契約締結前の段階であるため、公表情報のみとしなければならない。", "a": true, "r": "原文どおり（SM p.56）", "k": false}, {"i": 86, "s": "M&A実務", "u": "マッチング", "q": "ネームクリアは、ノンネーム・シート等で興味を示した候補先に対し、譲り渡し側の同意を取得し、秘密保持契約を締結した上で実施し、同意は原則として開示先となる候補先ごとに個別に取得する。", "a": true, "r": "原文どおり（GL p.93）（Q&A ⑤No.1）", "k": false}, {"i": 87, "s": "M&A実務", "u": "マッチング", "q": "ネームクリア先の選定を包括的に仲介者・FAに一任することは許容され、その場合は秘密保持契約の締結を省略できる。", "a": false, "r": "包括的に一任すべきでなく、秘密保持契約の締結は必須（GL p.93）", "k": false}, {"i": 88, "s": "M&A実務", "u": "マッチング", "q": "初回トップ面談では、譲渡額等の詳細な条件交渉を行うことが理想である。", "a": false, "r": "金額交渉等は行わず相互理解の場とするのが理想。詳細交渉はディールブレイクのリスクがある（SM p.63〜64）", "k": false}, {"i": 89, "s": "M&A実務", "u": "マッチング", "q": "意向表明書を提出しようとする譲り受け側候補が1社のみの場合、提出前に「候補が1社のみ」である旨を当該候補に伝えるべきでない（原則）。", "a": true, "r": "譲り渡し側の利益保護の観点（SM p.71）", "k": false}, {"i": 90, "s": "M&A実務", "u": "基本合意・DD", "q": "基本合意書は基本的に法的拘束力がないが、独占的交渉権や秘密保持義務等については法的拘束力を認めることが通常である。", "a": true, "r": "原文どおり（GL p.21）（SM p.69〜70）", "k": false}, {"i": 91, "s": "M&A実務", "u": "基本合意・DD", "q": "上場企業が譲り受け側の場合は基本合意時に適時開示が必要となる場合があり、未公開のM&Aの実施の事実はインサイダー取引規制の「重要事実」となりうるが、適時開示により規制対象から除外される。", "a": true, "r": "原文どおり（SM p.69〜70）", "k": false}, {"i": 92, "s": "M&A実務", "u": "基本合意・DD", "q": "データルームをVDRで設置する場合、クロージング後に閉鎖するが、表明保証違反の発覚時等に備えデータの保存・バックアップが取得可能な仕組みを構築する。", "a": true, "r": "原文どおり（SM p.86）", "k": false}, {"i": 93, "s": "M&A実務", "u": "基本合意・DD", "q": "仲介者・譲り渡し側FAが存在する案件では、DD実施機関と譲り渡し側が直接やり取りを行うことは原則禁止されるのが通例である。", "a": true, "r": "原文どおり（SM p.87）", "k": false}, {"i": 94, "s": "M&A実務", "u": "基本合意・DD", "q": "ビジネスDDでは、収益への影響が大きい取引先については重点的に調査を行うことが重要である。", "a": true, "r": "原文どおり（SM p.93）", "k": false}, {"i": 95, "s": "M&A実務", "u": "基本合意・DD", "q": "事業計画の検証では、譲り渡し側経営者の譲渡対価が大きい場合や成立後の関与度合いが低い場合は、強気の事業計画になる傾向がある。", "a": true, "r": "原文どおり（SM p.94）", "k": false}, {"i": 96, "s": "M&A実務", "u": "基本合意・DD", "q": "MBOの場合、成立後は自らが株主兼経営者となるため、過度に強気な事業計画になる傾向がある。", "a": false, "r": "過度に保守的になる傾向（SM p.94）", "k": false}, {"i": 97, "s": "M&A実務", "u": "基本合意・DD", "q": "PEST分析のEはEconomy（経済）であり、インフレ・デフレ、為替、金利、GDP成長率等の動向を調査する。", "a": true, "r": "原文どおり（SM p.95）", "k": false}, {"i": 98, "s": "M&A実務", "u": "基本合意・DD", "q": "ファイブフォース分析の5要因には「代替品の脅威」が含まれる。", "a": true, "r": "原文どおり（SM p.98）", "k": false}, {"i": 99, "s": "M&A実務", "u": "基本合意・DD", "q": "売上高が大きい事業であれば、利益の額・率が低くても撤退又は縮小の対象にはならない。", "a": false, "r": "売上高が大きくても、利益の額・率が低ければ撤退又は縮小の対象になりうる（SM p.96）", "k": false}, {"i": 100, "s": "M&A実務", "u": "最終契約前のリスク説明", "q": "経営者保証の扱い・DDの非実施・表明保証の内容は、リスクを認識しているか否かにかかわらず、仲介者・FAが調整・説明すべきリスクである。", "a": true, "r": "「認識の有無に関わらず対応するリスク」の3つ（GL p.96）（Q&A ⑥No.2）", "k": false}, {"i": 101, "s": "M&A実務", "u": "最終契約前のリスク説明", "q": "最終契約のリスク説明書サンプルは、経営者保証の扱い、DDの非実施、表明保証の内容、クロージング後の支払・手続、最終契約後の状況に応じた支払いの変動、資産・貸付金の最終契約後整理、最終契約からクロージングまでの期間の7項目である。", "a": true, "r": "原文どおり（参考資料12 p.1〜5）", "k": false}, {"i": 102, "s": "M&A実務", "u": "最終契約前のリスク説明", "q": "期間や責任上限が設定されていない表明保証は、譲り渡し側が過大な責任を負担し、当事者間で争いが生じるリスクがある旨を説明しなければならない。", "a": true, "r": "原文どおり（GL p.97）", "k": false}, {"i": 103, "s": "M&A実務", "u": "最終契約前のリスク説明", "q": "最終契約からクロージングまでの期間について、特段の事情なく2ヶ月以上の一定期間を設けると、最終契約の修正が必要となるリスクや不履行が生じるリスクがある。", "a": true, "r": "原文どおり（GL p.55-56）（参考資料12 p.5）", "k": false}, {"i": 104, "s": "M&A実務", "u": "最終契約前のリスク説明", "q": "譲り渡し側経営者に関連する資産・負債（事業用資産が経営者に帰属、非事業用資産が会社に帰属する場合等）は、可能な限り最終契約前（M&A成立前）に適切に整理することが望ましい。", "a": true, "r": "原文どおり（GL p.55）（SM p.120）", "k": false}, {"i": 105, "s": "M&A実務", "u": "最終契約前のリスク説明", "q": "最終契約は、可能な限り、中小M&Aに関する知見と実務経験を有する弁護士の関与の下で締結することが望ましい。", "a": true, "r": "原文どおり（GL p.98）", "k": false}, {"i": 106, "s": "M&A実務", "u": "経営者保証の扱い", "q": "「経営者保証に関するガイドラインの特則」は、事業承継時に先代経営者と後継者の双方から二重に保証を求めること（二重徴求）を原則として禁止している。", "a": true, "r": "原文どおり（GL p.23）", "k": false}, {"i": 107, "s": "M&A実務", "u": "経営者保証の扱い", "q": "経営者保証の扱いに関し、M&A成立と同時に解除等（借換えによる対応を含む）を行うことが最も優先される対応である。", "a": true, "r": "原文どおり（参考資料13 p.1）", "k": false}, {"i": 108, "s": "M&A実務", "u": "経営者保証の扱い", "q": "金融機関等への経営者保証の相談は、クロージング後に開始すれば足りる。", "a": false, "r": "可能な限り最終契約の一定期間前が望ましく、少なくとも最終契約後からクロージング前の間までには開始されるべき（参考資料13 p.1）", "k": false}, {"i": 109, "s": "M&A実務", "u": "経営者保証の扱い", "q": "譲り渡し側が経営者保証について士業等専門家や金融機関等への事前相談を希望する場合、仲介者・FAはその実施を拒むべきではなく、秘密保持条項の対象から相談先を除外する必要がある。譲り受け側も相談の申し出を拒むべきではない。", "a": true, "r": "原文どおり（GL p.51-52, 97）（SM p.142, 186）", "k": false}, {"i": 110, "s": "M&A実務", "u": "経営者保証の扱い", "q": "経営者保証について、最終契約前に金融機関に事前相談をすれば、経営者保証の扱いは確定的になる。", "a": false, "r": "事前相談後も確定的とならない可能性があり、M&A成立前に情報が金融機関等に提供される点にも留意（参考資料12 p.2）", "k": false}, {"i": 111, "s": "M&A実務", "u": "経営者保証の扱い", "q": "経営者保証の正式な解除・移行は、クロージングを経て登記簿上で代表者が変更された後に行う必要がある。", "a": true, "r": "原文どおり（GL p.51）", "k": false}, {"i": 112, "s": "M&A実務", "u": "経営者保証の扱い", "q": "最終契約で保証の解除・移行を想定する場合は、譲り受け側の義務として明確に位置付け、クロージング条件の設定や不履行時の契約解除条項・補償条項等を盛り込むことが重要である。", "a": true, "r": "原文どおり（GL p.52）（SM p.142, 146, 147, 186）", "k": false}, {"i": 113, "s": "M&A実務", "u": "経営者保証の扱い", "q": "金融機関は「M&A成立前の段階である」ことを理由に審査を拒むことが適切とされている。", "a": false, "r": "こうした形式的な理由で審査を拒む対応は不適切（参考資料13 p.7）", "k": false}, {"i": 114, "s": "M&A実務", "u": "経営者保証の扱い", "q": "経営者保証ガイドラインが主たる債務者に求める3点は、法人と経営者の明確な区分・分離、財務基盤の強化、財務状況の正確な把握・適時適切な情報開示等による経営の透明性確保である。", "a": true, "r": "原文どおり（参考資料13 p.2）", "k": false}, {"i": 115, "s": "M&A実務", "u": "譲り受け側の調査", "q": "譲り受け側への調査の概要は、仲介契約・FA契約の締結後に説明すればよい。", "a": false, "r": "締結前（M&Aプラットフォーマーは登録前）に説明する。進捗過程でも調査し最終契約締結までに十分確認、リスク事項を検出したら最終契約締結前までに開示可能な範囲で報告・協議する（GL p.101-102）（参考資料13 p.5）（Q&A ⑦No.3）", "k": false}, {"i": 116, "s": "M&A実務", "u": "譲り受け側の調査", "q": "譲り渡し側が債務超過の場合等、譲り受け側の信用が特に重要となるケースでは、譲り受け側の財務状況を少なくとも決算公告や税務申告書の確認により確認する。", "a": true, "r": "原文どおり（SM p.24）（参考資料13 p.7）", "k": false}, {"i": 117, "s": "M&A実務", "u": "クロージング・PMI", "q": "プレクロージングとは、クロージング前日までにクロージング書類や当日の手順等を関係者も交えて一通り確認することで、当日は形式的な書類と金銭の授受に留められる。", "a": true, "r": "原文どおり（SM p.164）", "k": false}, {"i": 118, "s": "M&A実務", "u": "クロージング・PMI", "q": "クロージング条項が全て満たされているかを両当事者と確認することは、表明保証違反時の補償請求権の放棄を意味する。", "a": false, "r": "補償請求権の放棄を意味しない（SM p.166）", "k": false}, {"i": 119, "s": "M&A実務", "u": "クロージング・PMI", "q": "PMIにおける即効性のある就労環境の改善（クイック・ヒット）は、Day.100以内を目途に実行することが望ましい。", "a": true, "r": "原文どおり（SM p.176）", "k": false}, {"i": 120, "s": "M&A実務", "u": "M&Aプラットフォーム・公的支援機関", "q": "M&Aプラットフォームは、真に極秘で進めたい案件に適しており、閉じられた（クローズド）ものであれば情報流出を心配する必要はない。", "a": false, "r": "極秘案件には向かず仲介者・FAとの使い分けが必要。クローズドでも同様に慎重な姿勢が望まれる（GL p.58-59）", "k": false}, {"i": 121, "s": "M&A実務", "u": "M&Aプラットフォーム・公的支援機関", "q": "M&Aプラットフォームの手数料は、譲り渡し側は無料のケースが多く、譲り受け側は完全成功報酬型で譲渡額等の数％程度とされることが多い。", "a": true, "r": "原文どおり（GL p.59）", "k": false}, {"i": 122, "s": "M&A実務", "u": "M&Aプラットフォーム・公的支援機関", "q": "事業承継・引継ぎ支援センターの三次対応は、二次対応で適当な登録機関等・連携M&Aプラットフォーマーが存在しない場合等に、センターが直接支援するものである。", "a": true, "r": "原文どおり（GL p.61）", "k": false}, {"i": 123, "s": "M&A実務", "u": "M&Aプラットフォーム・公的支援機関", "q": "日本公庫の「事業承継マッチング支援」は令和2年4月から、沖縄県を除く各都道府県で実施され、譲渡・譲受希望者とも無料で利用できる。", "a": true, "r": "原文どおり（参考資料5 p.1）", "k": false}, {"i": 124, "s": "M&A実務", "u": "M&Aプラットフォーム・公的支援機関", "q": "日本公庫の同支援は、日本公庫に借入残高がある企業に限られ、紹介があっても借入残高がない企業は利用できない。", "a": false, "r": "商工会議所・商工会、税理士等の紹介があれば借入残高がなくても利用可能（参考資料5 p.1）", "k": false}, {"i": 125, "s": "財務・税務", "u": "バリュエーション", "q": "「債務超過」は、GLでは特に説明がない限り、貸借対照表の簿価上の債務超過を意味する。", "a": false, "r": "資産・負債の時価評価を踏まえた実態貸借対照表上の債務超過（GL p.23）", "k": false}, {"i": 126, "s": "財務・税務", "u": "バリュエーション", "q": "中小M&Aの譲渡額は、簿価純資産法等で算出された金額がそのまま譲渡額となり、交渉で変わることはない。", "a": false, "r": "当事者が最終的に合意した金額が譲渡額。数年分の任意の利益を加算する場合等もある（GL p.44）", "k": false}, {"i": 127, "s": "財務・税務", "u": "バリュエーション", "q": "三つの評価アプローチのうち、客観性が◎とされるのはコストアプローチとマーケットアプローチで、インカムアプローチは△である。", "a": true, "r": "原文どおり（GL p.113-114）", "k": false}, {"i": 128, "s": "財務・税務", "u": "バリュエーション", "q": "マーケットアプローチは各手法の中で最も客観的な算定が可能で、中小M&Aでは主にEV/EBITDA倍率法が使用される（PER・PBR倍率法も用いられることがある）。", "a": true, "r": "原文どおり（SM p.42）", "k": false}, {"i": 129, "s": "財務・税務", "u": "バリュエーション", "q": "PBR倍率法は、対象会社の当期純利益から株主価値を算定する手法である。", "a": false, "r": "PBR倍率法は簿価純資産から算定。当期純利益から算定するのはPER倍率法（SM p.47）", "k": false}, {"i": 130, "s": "財務・税務", "u": "バリュエーション", "q": "DCF法は、予測期間（一般に3〜5年程度）のFCFと継続価値（ターミナルバリュー）をWACCで割り引いて事業価値を算定し、非事業用資産を加算して企業価値、有利子負債を控除して株主価値を算出する。", "a": true, "r": "原文どおり（SM p.47〜48）", "k": false}, {"i": 131, "s": "財務・税務", "u": "バリュエーション", "q": "時価純資産法で、負債は帳簿金額が要支払額であり時価と考えられるが、網羅性を確認し、オフバランス債務や引当金不足があれば追加計上する。", "a": true, "r": "原文どおり（SM p.48）", "k": false}, {"i": 132, "s": "財務・税務", "u": "バリュエーション", "q": "時価純資産法に数年分の利益を加算する方法では、加算する年数は通常1年〜3年で、交渉により決まるケースが多く、あくまで交渉の際の参考として参照されるべきである。", "a": true, "r": "原文どおり（SM p.43）", "k": false}, {"i": 133, "s": "財務・税務", "u": "バリュエーション", "q": "簿価純資産法（資産600、負債200）では、株式価値は400となる。", "a": true, "r": "600−200＝400（参考資料2 p.1）", "k": false}, {"i": 134, "s": "財務・税務", "u": "バリュエーション", "q": "時価純資産法の例（土地の含み損▲100、保険解約返戻金＋20、役員退職金▲50、繰延税金資産＋44（実効税率34%））では、時価純資産は314となる。", "a": true, "r": "400−100＋20−50＋44＝314。【注】原資料は図中「＋39」、表中「＋44」で不一致。314は＋44に対応（参考資料2 p.2）", "k": false}, {"i": 135, "s": "財務・税務", "u": "バリュエーション", "q": "時価純資産270に修正利益25の3年分（75）を加算した譲渡額は345である。", "a": true, "r": "270＋75＝345（参考資料2 p.3）", "k": false}, {"i": 136, "s": "財務・税務", "u": "バリュエーション", "q": "EV/EBITDA倍率法の算式は「株式価値＝EBITDA×EV/EBITDA倍率－純有利子負債（有利子負債－現預金）」で、EBITDAは簡易的に営業利益＋減価償却費で算定する。", "a": true, "r": "原文どおり（参考資料2 p.4）", "k": false}, {"i": 137, "s": "財務・税務", "u": "バリュエーション", "q": "中小企業は上場会社より株式の流動性が低いため、30%程度の非流動性ディスカウントをするケースもある。", "a": true, "r": "原文どおり（参考資料2 p.4）", "k": false}, {"i": 138, "s": "財務・税務", "u": "バリュエーション", "q": "FCFのサンプル問題（営業利益100、減価償却費10、売上債権増加15、棚卸資産増加8、仕入債務減少2、設備投資20、実効税率40%、単位百万円）の正答は25百万円である。", "a": true, "r": "100×(1−40%)＋10−15−8−2−20＝25（資料2 p.14）", "k": false}, {"i": 139, "s": "財務・税務", "u": "財務DD", "q": "営業利益率＝粗利÷売上高である。", "a": false, "r": "営業利益÷売上高。粗利÷売上高は粗利率（SM p.97）", "k": false}, {"i": 140, "s": "財務・税務", "u": "財務DD", "q": "事業計画の運転資本予測では、回転日数/率は過去3年程度の平均値を使用する。", "a": true, "r": "原文どおり（SM p.101）", "k": false}, {"i": 141, "s": "財務・税務", "u": "財務DD", "q": "運転資本＝売上債権＋棚卸資産－仕入債務である。", "a": true, "r": "原文どおり（SM p.108）", "k": false}, {"i": 142, "s": "財務・税務", "u": "財務DD", "q": "調整後純資産＝純資産＋含み益－含み損－簿外債務・簿外資産である。", "a": true, "r": "原文どおり（SM p.108）", "k": false}, {"i": 143, "s": "財務・税務", "u": "財務DD", "q": "ネットデット＝有利子負債－現金等の非事業資産であり、非事業資産が有利子負債を上回る場合はネットキャッシュとなる。", "a": true, "r": "原文どおり（SM p.108）", "k": false}, {"i": 144, "s": "財務・税務", "u": "財務DD", "q": "退職給付債務や資産除去債務はデットライクアイテムの例であり、有価証券や保険積立金はキャッシュライクアイテムの例である。", "a": true, "r": "原文どおり（SM p.108）", "k": false}, {"i": 145, "s": "財務・税務", "u": "財務DD", "q": "正常化調整とは、M&A後に想定される費用や収益の増減を調整するものであり、プロフォーマ調整とは、突発的・一時的な取引の影響を除外するものである。", "a": false, "r": "両者の内容が逆（SM p.106）", "k": false}, {"i": 146, "s": "財務・税務", "u": "財務DD", "q": "カーブアウトでは、事業の分離が短期間で困難な場合に、移行期間業務委託契約（TSA）を締結して対処することがある。", "a": true, "r": "原文どおり（SM p.110）", "k": false}, {"i": 147, "s": "財務・税務", "u": "財務DD", "q": "財務DDの検出事項を基に最終契約日とクロージング日の間で譲渡額の調整を行う場合、最終契約に多くの規定が必要となり、調整に時間を要する。", "a": true, "r": "原文どおり（SM p.113）", "k": false}, {"i": 148, "s": "財務・税務", "u": "財務DD", "q": "債務超過企業の事業譲渡では、少なくとも破産したと仮定した場合の清算価値を相当程度超える金額が要求される。", "a": true, "r": "原文どおり（GL p.128）", "k": false}, {"i": 149, "s": "財務・税務", "u": "税務", "q": "役員退職金の損金算入可能な実務上の限度額の目安は、最終月額報酬×役員勤続年数×功績倍率で計算される。", "a": true, "r": "原文どおり（SM p.112, 143）", "k": false}, {"i": 150, "s": "財務・税務", "u": "税務", "q": "役員退職金が不相当に高額な場合でも、超過部分を含めて全額が損金算入される。", "a": false, "r": "超過部分は損金算入されない（SM p.112）", "k": false}, {"i": 151, "s": "財務・税務", "u": "税務", "q": "株式譲渡における経営者個人の譲渡益は分離課税（税率20.315%）で課税関係が終了し、事業譲渡では譲渡対価が法人に帰属するため法人税等が課され、株主への還流は総合課税（15.105%〜55.945%）の対象となる。", "a": true, "r": "原文どおり（GL p.118）", "k": false}, {"i": 152, "s": "財務・税務", "u": "税務", "q": "株式譲渡契約書等は原則として印紙税の非課税文書だが、代金受領の記載がある場合は課税文書（印紙税法別表第1第17号の1文書）となる。", "a": true, "r": "原文どおり（GL p.118）", "k": false}, {"i": 153, "s": "財務・税務", "u": "税務", "q": "株式譲渡代金の領収書には収入印紙が必要である。", "a": true, "r": "原文どおり（SM p.159）", "k": false}, {"i": 154, "s": "財務・税務", "u": "税務", "q": "税理士法第41条の3により、税理士は委嘱者の不正（脱税・仮装隠蔽等）を知ったときは、直ちにその是正を助言しなければならない。", "a": true, "r": "原文どおり（GL p.116-117）", "k": false}, {"i": 155, "s": "財務・税務", "u": "税務", "q": "中堅・中小グループ化税制では、積立率がM&A2回目90%、3回目以降100%に拡大された。", "a": true, "r": "原文どおり（資料1 p.16）", "k": false}, {"i": 156, "s": "財務・税務", "u": "税務", "q": "中小企業事業再編投資損失準備金の当初制度の積立は株式取得価額の70%までで、据置期間は5年間である。", "a": true, "r": "原文どおり（資料1 p.16）", "k": false}, {"i": 157, "s": "財務・税務", "u": "税務", "q": "グループ化税制の拡充枠を使うには、産業競争力強化法において新設する認定を受けることが要件で、過去5年以内にM&Aの実績が必要である。", "a": true, "r": "原文どおり（資料1 p.16）", "k": false}, {"i": 158, "s": "財務・税務", "u": "税務", "q": "中堅企業は、グループ化税制を1回目のM&Aから活用できる。", "a": false, "r": "2回目以降のM&Aから（資料1 p.16）", "k": false}, {"i": 159, "s": "法務・契約", "u": "スキーム選択", "q": "株式譲渡では法人格が承継されるため、資産・負債・契約・許認可等は原則存続するが、偶発債務・簿外債務も引き継ぐ。事業譲渡では対象資産・負債を特定して偶発債務・簿外債務を分離できる。", "a": true, "r": "原文どおり（SM p.31）（参考資料1 p.1）", "k": false}, {"i": 160, "s": "法務・契約", "u": "スキーム選択", "q": "株式譲渡は譲り渡し側の法人格に変動がないため、事業譲渡に比べ簿外債務・偶発債務リスクが比較的高くなりやすく、より詳細なDDが実施される傾向にある。", "a": true, "r": "原文どおり（GL p.48）", "k": false}, {"i": 161, "s": "法務・契約", "u": "スキーム選択", "q": "事業譲渡では、許認可等は原則として譲り受け側に当然に承継されるため、新規取得は不要である。", "a": false, "r": "承継されないことが多く新規取得が必要。既存の契約・許認可が原則存続するのは株式譲渡（参考資料1 p.2）（資料2 p.13）", "k": false}, {"i": 162, "s": "法務・契約", "u": "スキーム選択", "q": "個人事業主の中小M&Aは、株式譲渡の手法を用いるのが通常である。", "a": false, "r": "事業譲渡（営業譲渡）の手法を用いるのが通常（GL p.49）", "k": false}, {"i": 163, "s": "法務・契約", "u": "スキーム選択", "q": "会社分割は包括承継のため許認可や契約の再取得が不要だが、労働契約承継法に基づく従業員の雇用条件保護手続が必要である。", "a": true, "r": "原文どおり（SM p.32）", "k": false}, {"i": 164, "s": "法務・契約", "u": "スキーム選択", "q": "事業譲渡では、競業避止義務を負うことが法律上定められているが、当事者間の合意により免除・縮減・加重できる。", "a": true, "r": "原文どおり（SM p.32）", "k": false}, {"i": 165, "s": "法務・契約", "u": "スキーム選択", "q": "簡易合併は、存続会社の交付する財産の金額が純資産額の5分の1以下の場合で、略式合併は親会社が子会社の議決権の90%以上を保有する場合の親子間合併である。", "a": true, "r": "原文どおり（SM p.33）", "k": false}, {"i": 166, "s": "法務・契約", "u": "スキーム選択", "q": "合併では、簡易合併・略式合併を除き、存続会社・消滅会社それぞれで株主総会の特別決議が必要で、債権者保護手続（官報公告および知れている債権者への個別催告）が必要である。", "a": true, "r": "原文どおり（SM p.33）", "k": false}, {"i": 167, "s": "法務・契約", "u": "スキーム選択", "q": "債務超過企業で優良事業のみ別会社に切り出し、不採算部門を特別清算等で整理する第二会社方式には、譲り渡し側の債権者の同意が必要である。", "a": true, "r": "原文どおり（参考資料1 p.3）", "k": false}, {"i": 168, "s": "法務・契約", "u": "スキーム選択", "q": "対象会社が農地所有適格法人の場合、譲り受け側が法人として支配権を取得することは容易である。", "a": false, "r": "極めて困難（SM p.22）", "k": false}, {"i": 169, "s": "法務・契約", "u": "スキーム選択", "q": "外為法では、事前届出の対象業種と事後報告の対象業種の2通りのみが存在する。", "a": false, "r": "事前届出／事後報告／事前届出・事後報告とも不要の3通り（SM p.30, 59）", "k": false}, {"i": 170, "s": "法務・契約", "u": "スキーム選択", "q": "簿外債務が懸念される場合に、株式譲渡から事業譲渡へスキームを変更し、必要な資産・負債のみを引き継ぐ方法がある。", "a": true, "r": "リスクへの対応方針の一つ（SM p.139）", "k": false}, {"i": 171, "s": "法務・契約", "u": "会社法・株式", "q": "株券発行会社の場合、株式譲渡の効力発生には株券の交付が必要であり、株券不発行会社の場合は株主名簿の名義書換えで完了する。", "a": true, "r": "原文どおり。株式譲渡契約書サンプルも株券発行会社を前提に、効力は株券の交付時に生じるとする（SM p.157）（参考資料7 p.17）", "k": false}, {"i": 172, "s": "法務・契約", "u": "会社法・株式", "q": "特例有限会社では、株主総会の特別決議に総株主の半数以上かつ総株主の議決権の4分の3以上の賛成が必要である。", "a": true, "r": "原文どおり（SM p.115）", "k": false}, {"i": 173, "s": "法務・契約", "u": "会社法・株式", "q": "株主名簿が存在しない場合や内容に瑕疵がある場合、会社法に基づき過料が課されることがある。", "a": true, "r": "原文どおり（SM p.115）", "k": false}, {"i": 174, "s": "法務・契約", "u": "会社法・株式", "q": "所在不明株主からの株式買取り等に要する期間は原則5年だが、認定を受けた事業承継ニーズの高い非上場の中小企業者の株式会社に限り、令和3年8月施行の特例で1年に短縮される。", "a": true, "r": "原文どおり（GL p.124）", "k": false}, {"i": 175, "s": "法務・契約", "u": "会社法・株式", "q": "株式会社が全事業の事業譲渡を行う場合等には、原則として出席株主の議決権の3分の2以上による株主総会決議（特別決議）が必要である。", "a": true, "r": "原文どおり（参考資料7 p.39）", "k": false}, {"i": 176, "s": "法務・契約", "u": "会社法・株式", "q": "吸収合併・吸収分割では、効力発生日から2週間以内に登記を行う必要がある。", "a": true, "r": "原文どおり（SM p.157）", "k": false}, {"i": 177, "s": "法務・契約", "u": "会社法・株式", "q": "事業譲渡では、最終契約で効力発生日を定めれば、譲渡対象資産の譲渡や契約移管に契約相手方の同意は不要となる。", "a": false, "r": "効力発生日を定めても、資産の譲渡や契約の移管には契約の相手方の同意が必要（SM p.158）", "k": false}, {"i": 178, "s": "法務・契約", "u": "会社法・株式", "q": "事業譲渡の場合、不動産賃貸借契約・リース契約等は契約当事者（借主）が変わるため、貸主からの承諾書が常に必要となる。", "a": true, "r": "原文どおり（SM p.158）", "k": false}, {"i": 179, "s": "法務・契約", "u": "法務DD", "q": "COC条項が明示的に定められていなければ、契約に短期の更新条項があっても、実質的にCOC条項として機能することはない。", "a": false, "r": "明示的なCOC条項がなくても、短期の更新条項があれば実質的にCOC条項のように機能する可能性がある（SM p.118）", "k": false}, {"i": 180, "s": "法務・契約", "u": "法務DD", "q": "特許権者が専用実施権を設定した場合、権利者自身も権利行使の制限を受けることとなる。", "a": true, "r": "原文どおり（SM p.118）", "k": false}, {"i": 181, "s": "法務・契約", "u": "法務DD", "q": "人事・労務の調査では、就業規則や36協定がない場合、外国人従業員の在留資格・就労資格がない場合などが法令違反となる問題の例として挙げられる。", "a": true, "r": "原文どおり（SM p.121）", "k": false}, {"i": 182, "s": "法務・契約", "u": "法務DD", "q": "法務DDで検出された法令違反は、治癒が可能かどうかを譲り渡し側と綿密に討議することが求められる。", "a": true, "r": "原文どおり（SM p.117, 121）", "k": false}, {"i": 183, "s": "法務・契約", "u": "法務DD", "q": "環境DDの国際条約の例として、ワシントン条約、水俣条約、バーゼル条約、パリ協定に基づく1.5℃の地球温暖化への抑制などが挙げられる。", "a": true, "r": "原文どおり（SM p.129）", "k": false}, {"i": 184, "s": "法務・契約", "u": "法務DD", "q": "不動産DDは、経済的側面・法的側面・物理的側面の3つの観点から実施する。", "a": true, "r": "原文どおり（SM p.131）", "k": false}, {"i": 185, "s": "法務・契約", "u": "士業の独占業務との関係", "q": "クロージング後の両当事者間の紛争解決への関与・支援は、非弁行為（弁護士法第72条）に該当する可能性があり、仲介者・FAによる支援には限界がある（役務提供は基本的にクロージング時点で終了）。仲介者・FAはこれらの旨を依頼者に説明しなければならない。", "a": true, "r": "原文どおり（GL p.50, 57, 87）（SM p.154）", "k": false}, {"i": 186, "s": "法務・契約", "u": "士業の独占業務との関係", "q": "個別の訴訟・紛争の見通しや処理方針に係る見解を述べることは、非弁行為に該当する可能性が高い。", "a": true, "r": "原文どおり（SM p.124）", "k": false}, {"i": 187, "s": "法務・契約", "u": "士業の独占業務との関係", "q": "最終契約の作成支援では、最終的な契約書面の作成は非弁行為となりうるため、ドラフト作成に留め、最終化は当事者間で実施する。", "a": true, "r": "原文どおり（SM p.148）", "k": false}, {"i": 188, "s": "法務・契約", "u": "士業の独占業務との関係", "q": "弁護士をあっせんして手数料を受領する行為や、利用する弁護士を指定することは、非弁提携に該当しうる。", "a": true, "r": "原文どおり（SM p.81）", "k": false}, {"i": 189, "s": "法務・契約", "u": "士業の独占業務との関係", "q": "非弁護士・非税理士の支援者が、アドバイザリー契約外で無償で株主の税額を試算する行為は、独占業務との関係で適法に行える。", "a": false, "r": "サンプル問題で適法に行えないものに含まれる（正答は「ア、イ、ウ、エ」）（資料2 p.16）", "k": false}, {"i": 190, "s": "法務・契約", "u": "最終契約の条項", "q": "表明保証条項は、定型的に無期限・無制限とすることが望ましい。", "a": false, "r": "定型的な無期限・無制限の表明保証条項や、適用場面が判然としない条項の設定は慎重に検討すべき（GL p.53）", "k": false}, {"i": 191, "s": "法務・契約", "u": "最終契約の条項", "q": "譲り渡し側がDDで情報開示していれば、表明保証条項に開示情報の除外規定がなくても補償の対象外となる。", "a": false, "r": "除外規定がなければ補償対象となるリスクが残る（SM p.145）", "k": false}, {"i": 192, "s": "法務・契約", "u": "最終契約の条項", "q": "エスクローとは第三者（金融機関、エスクロー事業者）への預託を指し、M&Aでは譲り受け側が買収代金の一部を預託して支払いを一部保留する形で行われ、第三者への手数料は発生しない。", "a": false, "r": "手数料が発生する（SM p.140）", "k": false}, {"i": 193, "s": "法務・契約", "u": "最終契約の条項", "q": "表明保証保険では、クロージング以前に知っていた表明保証違反は免責事由に該当し、保険が付保されない。", "a": true, "r": "原文どおり（SM p.141）", "k": false}, {"i": 194, "s": "法務・契約", "u": "最終契約の条項", "q": "表明保証保険は、譲り受け側のみが加入できる。", "a": false, "r": "譲り受け側・譲り渡し側どちらでも加入可（SM p.141）", "k": false}, {"i": 195, "s": "法務・契約", "u": "最終契約の条項", "q": "アーンアウト条項は、クロージング後の一定期間（3年以内が多い）に目標が達成された場合に譲り受け側から譲り渡し側に追加対価を支払う条項で、DDや当事者間の調整が十分でない段階でバリュエーションの差を埋める目的で設けるべきかは慎重に検討すべきである。株価調整条項は、最終契約からクロージングまでの企業価値の変動を踏まえ譲渡額を調整する条項である。", "a": true, "r": "原文どおり（GL p.54-55）（参考資料12 p.4）", "k": false}, {"i": 196, "s": "法務・契約", "u": "最終契約の条項", "q": "MAC条項とは、最終契約締結からクロージングまでに対象会社に重大な悪影響が生じた場合に、契約解除又は条件修正の権利を定める条項である。", "a": true, "r": "原文どおり（SM p.146）", "k": false}, {"i": 197, "s": "法務・契約", "u": "最終契約の条項", "q": "完全合意条項を設ける場合でも、書面外の取決めや口頭合意は法的に担保される。", "a": false, "r": "法的に担保されず、重要な合意事項は全て契約書に記載する必要がある（SM p.136, 147）", "k": false}, {"i": 198, "s": "法務・契約", "u": "最終契約の条項", "q": "最終契約書の押印方法のうち、譲り渡し経営者が各株主から委任を受けて代表して押印する形式は、少数株主との認識齟齬によるトラブルのリスクがある。", "a": true, "r": "原文どおり（SM p.151）", "k": false}, {"i": 199, "s": "法務・契約", "u": "最終契約の条項", "q": "クロージング後の誓約事項の違反は、クロージング前の誓約事項違反よりも対応の難易度が高い。", "a": true, "r": "原文どおり（SM p.147）", "k": false}, {"i": 200, "s": "法務・契約", "u": "契約書サンプル：仲介契約書・秘密保持契約書", "q": "仲介契約書サンプルでは、乙（仲介者）は甲の代理人として法律行為を行う。", "a": false, "r": "甲又は対象会社の代理人として法律行為を行うことはない（参考資料7 p.2）", "k": false}, {"i": 201, "s": "法務・契約", "u": "契約書サンプル：仲介契約書・秘密保持契約書", "q": "仲介契約書サンプルの専任条項は、契約の有効期間中、甲が本件サービス及び類似業務を乙以外の第三者に依頼しないことを定める。", "a": true, "r": "原文どおり（参考資料7 p.2）", "k": false}, {"i": 202, "s": "法務・契約", "u": "契約書サンプル：仲介契約書・秘密保持契約書", "q": "専任条項の例外として、甲は特段の理由がない限り、事前予告なしで弁護士等のアドバイザーに本件取引の相談ができる。", "a": false, "r": "乙に事前に予告した上で相談できる（参考資料7 p.2〜3）", "k": false}, {"i": 203, "s": "法務・契約", "u": "契約書サンプル：仲介契約書・秘密保持契約書", "q": "仲介契約書サンプルの秘密保持義務は、契約有効期間満了後3年間存続する。", "a": true, "r": "原文どおり（参考資料7 p.4, p.10）", "k": false}, {"i": 204, "s": "法務・契約", "u": "契約書サンプル：仲介契約書・秘密保持契約書", "q": "仲介契約書サンプル第4条の2（候補先に対する報酬等の開示）は、FA契約の場合にも必要である。", "a": false, "r": "FA契約の場合は不要（参考資料7 p.4）", "k": false}, {"i": 205, "s": "法務・契約", "u": "契約書サンプル：仲介契約書・秘密保持契約書", "q": "仲介契約書サンプルの有効期間は締結日から1年間で、満了日の1週間前までに特段の申出がなければ同条件で1年間自動延長される。", "a": true, "r": "原文どおり（参考資料7 p.4）", "k": false}, {"i": 206, "s": "法務・契約", "u": "契約書サンプル：仲介契約書・秘密保持契約書", "q": "仲介契約書サンプルの着手金・中間金は、本件取引が成就しなかった場合でも、清算を行う場合を除き返還されない。", "a": true, "r": "原文どおり（参考資料7 p.5）", "k": false}, {"i": 207, "s": "法務・契約", "u": "契約書サンプル：仲介契約書・秘密保持契約書", "q": "仲介契約書サンプルの「中間金」の基準となる基本的な合意は、デュー・ディリジェンス後になされる合意をいう。", "a": false, "r": "DD前になされる合意（基本合意の締結及び意向表明書の差入れを含む）（参考資料7 p.5）", "k": false}, {"i": 208, "s": "法務・契約", "u": "契約書サンプル：仲介契約書・秘密保持契約書", "q": "仲介契約書サンプルの成功報酬は、譲渡価額に応じ階層ごとに乗じる割合を合算して算出し、既払の着手金・中間金は成功報酬から差し引く。", "a": true, "r": "原文どおり（参考資料7 p.5）", "k": false}, {"i": 209, "s": "法務・契約", "u": "契約書サンプル：仲介契約書・秘密保持契約書", "q": "仲介契約書サンプルのテール条項では、契約終了後2年以内に、乙が関与・接触し甲に紹介した候補先との間で本件取引が実行された場合、成功報酬が発生する。", "a": true, "r": "原文どおり（参考資料7 p.6）", "k": false}, {"i": 210, "s": "法務・契約", "u": "契約書サンプル：仲介契約書・秘密保持契約書", "q": "仲介契約書サンプルでは、甲は本件取引の実行前であればいつでも契約を解除できる。", "a": true, "r": "原文どおり（参考資料7 p.6）", "k": false}, {"i": 211, "s": "法務・契約", "u": "契約書サンプル：仲介契約書・秘密保持契約書", "q": "仲介契約書サンプル第8条4項（利益相反行為の禁止）は、FA契約の場合は不要である。", "a": true, "r": "原文どおり（参考資料7 p.6〜7）", "k": false}, {"i": 212, "s": "法務・契約", "u": "契約書サンプル：仲介契約書・秘密保持契約書", "q": "秘密保持契約書サンプルの有効期間は締結日より2年間で、解約申出がなければ更に1年間延長し、以後も同様とする。", "a": true, "r": "原文どおり（参考資料7 p.10）", "k": false}, {"i": 213, "s": "法務・契約", "u": "契約書サンプル：仲介契約書・秘密保持契約書", "q": "秘密保持契約書サンプルは、個人保証の提供先金融機関等への相談目的の開示を、本件取引の成立前の相談も含めて許容している。", "a": true, "r": "原文どおり（参考資料7 p.9〜10）", "k": false}, {"i": 214, "s": "法務・契約", "u": "契約書サンプル：基本合意書", "q": "基本合意書サンプルでは、乙は対象会社の債務を保証している役職員の保証が解除されるよう最大限努力する。", "a": true, "r": "原文どおり（参考資料7 p.12）", "k": false}, {"i": 215, "s": "法務・契約", "u": "契約書サンプル：基本合意書", "q": "基本合意書サンプルでは、譲渡価額は金●●円を目途とし、正式な譲渡価額は最終契約締結時に協議により合意した金額とされる。", "a": true, "r": "原文どおり（参考資料7 p.12）", "k": false}, {"i": 216, "s": "法務・契約", "u": "契約書サンプル：基本合意書", "q": "基本合意書サンプルでは、乙のDDは本合意締結の日から1か月間を目処に行うことができる。", "a": true, "r": "原文どおり（参考資料7 p.12）", "k": false}, {"i": 217, "s": "法務・契約", "u": "契約書サンプル：基本合意書", "q": "基本合意書サンプルでは、甲は本合意の有効期間中、他のいかなる者とも対象会社に係るM&A取引の交渉を行ってはならない（独占的交渉権）。", "a": true, "r": "原文どおり（参考資料7 p.13）", "k": false}, {"i": 218, "s": "法務・契約", "u": "契約書サンプル：基本合意書", "q": "基本合意書サンプルでは、第1条〜第3条（目的・承継対象財産及び個人保証解除・譲渡価額）は法的拘束力を有しない。", "a": true, "r": "原文どおり（参考資料7 p.14）", "k": false}, {"i": 219, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "株式譲渡契約書サンプルの前提条件条項では、条件が一部でも満たされない場合、相手方は履行を拒絶できるが、条件を放棄した場合は表明保証違反の責任も免れる。", "a": false, "r": "放棄しても条件が充足したとみなされず、表明保証違反に基づく責任等は減免されない（参考資料7 p.18）", "k": false}, {"i": 220, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "株式譲渡契約書サンプルの表明保証は、契約締結日及びクロージング日の両時点で真実かつ正確であることを表明保証する。", "a": true, "r": "原文どおり（参考資料7 p.18）", "k": false}, {"i": 221, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "株式譲渡契約書サンプルでは、甲が対象会社のために保証している契約について保証債務の履行等の損害が発生した場合、乙が甲の損害等を補償する。", "a": true, "r": "原文どおり（参考資料7 p.21）", "k": false}, {"i": 222, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "株式譲渡契約書サンプルでは、乙は経営者保証等の解除義務が履行されるまで、本株式を第三者に譲渡・担保提供してはならない。", "a": true, "r": "原文どおり（参考資料7 p.21）", "k": false}, {"i": 223, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "株式譲渡契約書サンプルでは、クロージング日から3か月を経過しても経営者保証等が解除されないときは、甲はクロージング日から1年を経過するまでの間、解除又は買戻しを選択できる。", "a": true, "r": "原文どおり（参考資料7 p.22）", "k": false}, {"i": 224, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "第15条の2の買戻し・解除事由には、クロージング日から14日以内に乙が金融機関等に経営者保証等の解除について具体的な相談（単なる挨拶・日程調整を含む）を始めないとき、が含まれる。", "a": false, "r": "単なる挨拶・日程調整は相談に含まれない（参考資料7 p.22）", "k": false}, {"i": 225, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "第15条の2第1項③は、金融機関が解除できない旨の見解や条件を示したにもかかわらず1か月以内に乙が自らの負担による解除を実施しないときを事由とし、注では金融機関の審査が期限に間に合わないこともあり得る点に留意すべきとされる。", "a": true, "r": "原文どおり（参考資料7 p.22〜23）", "k": false}, {"i": 226, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "株式譲渡契約書サンプルの補償条項では、甲の表明保証違反に基づく補償額の総額の上限は、いかなる場合であっても本譲渡価額の●%とされ、100%に近い上限を設定する場合はその妥当性を慎重に吟味する必要がある。", "a": true, "r": "原文どおり（参考資料7 p.24）", "k": false}, {"i": 227, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "補償条項には、一つの事由に基づく損害が●円を超過するものの合計額が●円を超過した場合にのみ補償義務が発生する旨の定め、及びクロージング日から●か月以内の書面請求に限る旨の定めが置かれている。", "a": true, "r": "原文どおり（参考資料7 p.24）", "k": false}, {"i": 228, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "株式譲渡契約書サンプル第16条6項は、商法第526条の規定が本契約に適用されないものとしている。", "a": true, "r": "原文どおり（参考資料7 p.24）", "k": false}, {"i": 229, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "アンチ・サンドバッギング条項は、乙の認識（認識し又は認識し得た事実）に応じて甲の表明保証違反とならないとするもの、プロ・サンドバッギング条項は乙の認識にかかわらず甲の免責を認めないものである。", "a": true, "r": "原文どおり（参考資料7 p.24〜25）", "k": false}, {"i": 230, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "プロ・サンドバッギング条項が置かれている場合でも、乙がDDでリスクを認識していれば甲は免責される。", "a": false, "r": "免責されない（例：許認可未取得・未払残業代）。甲は削除・修文を求めることを検討し、特別補償で別途規定することもあり得る（参考資料7 p.25）", "k": false}, {"i": 231, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "回復請求条項（第17条の2）は、債務超過企業等で譲渡価額が備忘価格程度の案件で、クロージング後に現預金等が不当に流出した場合に機能することを想定し、甲から乙への直接請求を認める。", "a": true, "r": "原文どおり（参考資料7 p.26〜27）", "k": false}, {"i": 232, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "表明保証の「知る限り」と「知り得る限り」では、「知り得る限り」の方が保証の範囲が広い。", "a": true, "r": "原文どおり（参考資料7 p.33）", "k": false}, {"i": 233, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "表明保証条項が乙側から「事実と異なるところがあれば予め教えてほしい」趣旨で提案される場合、甲は事実と異なる事項を、表明保証の対象から除外する事項として契約書中に別途明記する必要がある。", "a": true, "r": "原文どおり（参考資料7 p.34）", "k": false}, {"i": 234, "s": "法務・契約", "u": "契約書サンプル：株式譲渡契約書", "q": "株式譲渡契約書サンプルの別紙1では、対象会社の税務申告に関し「過去7年間」適法・適正な申告と適時の支払をしていることが表明保証例として挙げられている。", "a": true, "r": "原文どおり（参考資料7 p.34〜36）", "k": false}, {"i": 235, "s": "法務・契約", "u": "契約書サンプル：事業譲渡契約書", "q": "事業譲渡契約書サンプルでは、免責的債務引受には債権者の承諾が必要で、承諾がない場合は原則として譲り渡し側・譲り受け側の連帯債務（併存的債務引受）となる。", "a": true, "r": "原文どおり（参考資料7 p.38〜39）", "k": false}, {"i": 236, "s": "法務・契約", "u": "契約書サンプル：事業譲渡契約書", "q": "事業譲渡契約書サンプルでは、クロージング日までの従業員の賃金・退職金債務を乙が承継する。", "a": false, "r": "甲が履行し、乙は承継しない（参考資料7 p.39）", "k": false}, {"i": 237, "s": "法務・契約", "u": "契約書サンプル：事業譲渡契約書", "q": "事業譲渡契約書サンプルの移転手続は、クロージング日後30日以内に完了する。", "a": true, "r": "原文どおり（参考資料7 p.40）", "k": false}, {"i": 238, "s": "法務・契約", "u": "契約書サンプル：事業譲渡契約書", "q": "事業譲渡契約書サンプルの公租公課等は、日割計算により、クロージング日の前日までは甲、クロージング日以降は乙が負担する。", "a": true, "r": "原文どおり（参考資料7 p.40）", "k": false}, {"i": 239, "s": "法務・契約", "u": "契約書サンプル：事業譲渡契約書", "q": "事業譲渡契約書サンプルの別紙1の承継対象資産の例には、現預金と売掛金が含まれる。", "a": false, "r": "「ただし、現預金、売掛金を除く」とされている（参考資料7 p.46）", "k": false}, {"i": 240, "s": "法務・契約", "u": "重要事項説明書サンプルの責任条項・調査", "q": "仲介者の損害賠償責任を修正する条項を依頼者に説明すれば、その条項には法的効力が認められる。", "a": false, "r": "説明することと法的効力の有無は別の問題（参考資料11 p.10）", "k": false}, {"i": 241, "s": "法務・契約", "u": "重要事項説明書サンプルの責任条項・調査", "q": "重要事項説明書サンプルの「譲り受け側に対する調査」には、財務状況、コンプライアンス、事業実態、最終契約の実行可能性、その他（ヒアリング等）に関する調査が含まれる。", "a": true, "r": "原文どおり（参考資料11 p.11〜12）", "k": false}, {"i": 242, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "中小M&A資格試験は、中小企業庁が運営主体として実施予定である。", "a": true, "r": "原文どおり（資料2 p.3）", "k": false}, {"i": 243, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "試験科目は「M&A実務」「財務・税務」「法務」「倫理・行動規範」の4科目である。", "a": true, "r": "原文どおり（資料2 p.9）", "k": false}, {"i": 244, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "設問数は120問程度で、試験時間は60分を想定している。", "a": false, "r": "設問数60問程度、試験時間120分（資料2 p.3, 11）", "k": false}, {"i": 245, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "少なくとも立ち上げ期は、年3回程度の複数の受験機会を設けて一斉実施を想定している。", "a": true, "r": "原文どおり（資料2 p.11）", "k": false}, {"i": 246, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "初回試験でいつでも受験可能にしない理由は、問題が出回り不正が行われるリスクがあるためである。", "a": true, "r": "原文どおり（資料2 p.11）", "k": false}, {"i": 247, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "合格基準は総得点の70〜80%程度の得点率を想定している。", "a": true, "r": "原文どおり（資料2 p.3, 6）", "k": false}, {"i": 248, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "科目別合格最低基準は50%程度を設定する想定である。", "a": true, "r": "原文どおり（資料2 p.6）", "k": false}, {"i": 249, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "弁護士・公認会計士・税理士等の国家資格保有者には、立ち上げ期から科目免除を設ける。", "a": false, "r": "少なくとも立ち上げ期は免除を設定しない（資料2 p.6）", "k": false}, {"i": 250, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "本資格試験に合格すると、士業の独占業務を行えるようになる。", "a": false, "r": "既存の業法に基づく独占業務の実施を可能とするものではない（資料2 p.5）", "k": false}, {"i": 251, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "想定する水準は士業専門家と連携できる水準であり、独占業務（弁護士法第72条、税理士法第52条等）に抵触しないことが前提である。", "a": true, "r": "原文どおり（資料2 p.3, 5）", "k": false}, {"i": 252, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "出題割合はM&A実務が35〜40%程度、倫理・行動規範が25%程度である。", "a": true, "r": "原文どおり（資料2 p.11）", "k": false}, {"i": 253, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "60問とした場合の出題数イメージは、M&A実務21〜24問程度、財務・税務12〜14問、法務10〜11問、倫理・行動規範15問程度である。", "a": true, "r": "原文どおり（資料2 p.11）", "k": false}, {"i": 254, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "「中小M&A市場動向・中小企業政策」は独立した試験科目である。", "a": false, "r": "「M&A実務」に含まれ、その中で設問を必ず出題する想定（割合5%・3問）（資料2 p.9, 11）", "k": false}, {"i": 255, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "M&A実務におけるオペレーションに関する内容は「法務」で、必要な法律知識は「M&A実務」で出題する。", "a": false, "r": "オペレーションはM&A実務、そのオペレーションに必要な法律知識等は法務（資料2 p.10）", "k": false}, {"i": 256, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "禁忌肢は、倫理・行動規範の遵守徹底を最も重要視しているというメッセージを発信する意味で設定する方針である。", "a": true, "r": "原文どおり（資料2 p.7）", "k": false}, {"i": 257, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "禁忌肢を設定した設問を複数設け、それらの一定数の誤答をもって不合格とする設計が想定されている。", "a": true, "r": "原文どおり（資料2 p.7）", "k": false}, {"i": 258, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "禁忌肢は、誤答を誘導するような曖昧な内容で設定する。", "a": false, "r": "明確に問題があるような内容とする（資料2 p.7）", "k": false}, {"i": 259, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "合格者の登録制度では、定期的な講習は1〜2年ごと等を想定している。", "a": true, "r": "資料2の記載（資料1では「概ね3〜5年ごと」）（資料2 p.3）", "k": false}, {"i": 260, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "倫理規程違反が認められる場合には、資格の取消し・氏名公表を想定している。", "a": true, "r": "原文どおり（資料2 p.3）（資料1 p.6）", "k": false}, {"i": 261, "s": "市場・政策・試験制度", "u": "試験制度（資料2）", "q": "試験は令和8・9年度に実施が想定され、実施は中企庁自身が直接行い外部委託しない。", "a": false, "r": "民間の資格試験実施団体へ委託（毎期、公募により選定）（資料2 p.18）", "k": false}, {"i": 262, "s": "市場・政策・試験制度", "u": "資格制度の検討経緯（資料1）", "q": "「中小M&Aアドバイザー試験（仮称）」は、まず民間ベースの取組として創設する方向で検討すべきとされた。", "a": true, "r": "原文どおり（資料1 p.6）", "k": false}, {"i": 263, "s": "市場・政策・試験制度", "u": "資格制度の検討経緯（資料1）", "q": "資料1では、中小M&Aアドバイザー試験の形式は記述式・論述式で100問程度を想定している。", "a": false, "r": "選択式・短答式（CBT）、合計50問程度（資料1 p.6）", "k": false}, {"i": 264, "s": "市場・政策・試験制度", "u": "資格制度の検討経緯（資料1）", "q": "資料1の登録制度案では、定期的な講習の受講は概ね3〜5年ごととされている。", "a": true, "r": "資料1の記載（資料2では1〜2年ごと等）（資料1 p.6）", "k": false}, {"i": 265, "s": "市場・政策・試験制度", "u": "資格制度の検討経緯（資料1）", "q": "スキルマップはM&Aプロセス（事前相談、バリュエーション、マッチング、基本合意、DD、最終契約、クロージング、PMI）ごとに知識・スキルを整理している。", "a": true, "r": "原文どおり（資料1 p.4）", "k": false}, {"i": 266, "s": "市場・政策・試験制度", "u": "資格制度の検討経緯（資料1）", "q": "米国のM&Aブローカー資格（The Certified Business Intermediary）は自主規制団体IBBAが運営し、更新は3年ごとに必要である。", "a": true, "r": "原文どおり（資料1 p.5）", "k": false}, {"i": 267, "s": "市場・政策・試験制度", "u": "資格制度の検討経緯（資料1）", "q": "米国IBBA資格の取得には、売り手の主担当として3件以上の取引に関与したことの証明が必要とされる。", "a": true, "r": "原文どおり（資料1 p.5）", "k": false}, {"i": 268, "s": "市場・政策・試験制度", "u": "資格制度の検討経緯（資料1）", "q": "将来的にガイドラインで資格取得を推奨し、M&A支援機関登録制度の登録機関について、登録を受けた資格保有者の割合の公表等を検討するとされている。", "a": true, "r": "原文どおり（資料1 p.6, 25）", "k": false}, {"i": 269, "s": "市場・政策・試験制度", "u": "M&A支援機関登録制度・ガイドライン第3版", "q": "中小M&Aガイドラインは令和2年3月に中小企業庁が策定し、M&A支援機関登録制度は令和3年8月に創設された。2026年3月現在、M&A専門業者（仲介・FA）約1,200者を中心に、約3,400者の支援機関が登録している。", "a": true, "r": "原文どおり（Q&A ①No.1・2）（資料2 p.20）", "k": false}, {"i": 270, "s": "市場・政策・試験制度", "u": "M&A支援機関登録制度・ガイドライン第3版", "q": "M&A支援機関登録制度に登録しなければ、仲介業務やFA業務を行うことはできない。", "a": false, "r": "登録しなくても可能。ただし補助金の手数料補助は予め登録した支援機関の支援のみが対象（令和5年9月現在）（GL p.19）（Q&A ①No.2）", "k": false}, {"i": 271, "s": "市場・政策・試験制度", "u": "M&A支援機関登録制度・ガイドライン第3版", "q": "事業承継・M&A補助金（専門家活用枠）で、FA・仲介に係る手数料は登録FA・仲介業者に係るもののみが補助対象である（令和3年度当初予算より）。", "a": true, "r": "原文どおり（資料2 p.20）", "k": false}, {"i": 272, "s": "市場・政策・試験制度", "u": "M&A支援機関登録制度・ガイドライン第3版", "q": "DDのみを行う士業等専門家も登録制度の対象である。", "a": false, "r": "対象としない（資料2 p.20）", "k": false}, {"i": 273, "s": "市場・政策・試験制度", "u": "M&A支援機関登録制度・ガイドライン第3版", "q": "M&A支援機関登録制度の情報提供受付窓口への情報提供数の、2025年度（2月現在）の内訳は、営業に関する事案48件、営業以外に関する事案32件である。", "a": true, "r": "原文どおり（資料2 p.21）", "k": false}, {"i": 274, "s": "市場・政策・試験制度", "u": "M&A支援機関登録制度・ガイドライン第3版", "q": "金融機関、士業等専門家、M&AプラットフォーマーがM&A専門業者に該当しない場合でも、業務の性質・内容が共通する限り、ガイドラインに準拠した対応が想定されている。", "a": true, "r": "原文どおり（Q&A ②No.1・2）", "k": false}, {"i": 275, "s": "市場・政策・試験制度", "u": "M&A支援機関登録制度・ガイドライン第3版", "q": "第3版の主な変更点には、手数料・提供業務、広告・営業の禁止事項、利益相反禁止事項の具体化、ネームクリア・テール条項、最終契約後のリスク事項、経営者保証の扱い、不適切な事業者の排除が含まれる。", "a": true, "r": "原文どおり（Q&A ①No.4）", "k": false}, {"i": 276, "s": "市場・政策・試験制度", "u": "M&A支援機関登録制度・ガイドライン第3版", "q": "令和6年8月時点で既登録の事業者は、令和6年12月31日までに第3版遵守の対応を完了し遵守宣言を行う必要があり、宣言しなくても令和7年1月から第3版が適用される。", "a": true, "r": "原文どおり（Q&A ⑪No.1）", "k": false}, {"i": 277, "s": "市場・政策・試験制度", "u": "M&A支援機関登録制度・ガイドライン第3版", "q": "令和6年12月末までに第3版の遵守宣言をしなかったこと自体が登録取消事由となる。", "a": false, "r": "それ自体は取消事由にならないが、令和7年1月以降は第3版が適用され、未対応なら取消事由に該当しうる（Q&A ⑪No.4）", "k": false}, {"i": 278, "s": "市場・政策・試験制度", "u": "手数料の実態", "q": "登録M&A支援機関の最低手数料は、500万円や1,000万円に設定する機関が多い。", "a": true, "r": "原文どおり（資料1 p.8）", "k": false}, {"i": 279, "s": "市場・政策・試験制度", "u": "手数料の実態", "q": "登録M&A支援機関の報酬基準額は、仲介・FAとも株価レーマン方式が最も多い（仲介50%、FA44%）。", "a": true, "r": "原文どおり（資料1 p.9）", "k": false}, {"i": 280, "s": "市場・政策・試験制度", "u": "手数料の実態", "q": "手数料率は、案件規模が小さくなると最低手数料が適用されるため高くなる傾向がある。", "a": true, "r": "原文どおり（資料2 p.24）", "k": false}, {"i": 281, "s": "市場・政策・試験制度", "u": "手数料の実態", "q": "譲渡側純資産（時価）別の手数料率（中央値）は、5百万円超〜1千万円以下で30.0%、5億円超で4.3%である。", "a": true, "r": "原文どおり（資料2 p.24）", "k": false}, {"i": 282, "s": "市場・政策・試験制度", "u": "手数料の実態", "q": "規模の小さい案件では、東京圏の案件の方がそれ以外のエリアよりも手数料率が高い。", "a": false, "r": "東京圏の方が低い（資料2 p.24）", "k": false}, {"i": 283, "s": "市場・政策・試験制度", "u": "手数料の実態", "q": "支援機関別の仲介業務から得た手数料率は、仲介31.6%、FA29.1%、金融機関31.5%、経営コンサル26.1%で、大きな差分は見受けられないとされている。", "a": true, "r": "原文どおり（資料2 p.25）", "k": false}, {"i": 284, "s": "市場・政策・試験制度", "u": "手数料の実態", "q": "総資産（移動総資産）レーマン方式を採用する支援機関の案件は、譲渡価格が同程度でも手数料が高い傾向にある。", "a": true, "r": "原文どおり（資料2 p.26）", "k": false}, {"i": 285, "s": "市場・政策・試験制度", "u": "市場動向", "q": "民間M&A支援機関の成約案件は、従業員1〜5人の譲渡側が最多である。", "a": false, "r": "6〜20人が46%で最多。1〜5人は22%（資料1 p.10）", "k": false}, {"i": 286, "s": "市場・政策・試験制度", "u": "市場動向", "q": "事業承継・引継ぎ支援センターの成約案件では、従業員1〜5人の譲渡側が54%を占める。", "a": true, "r": "原文どおり（資料1 p.10）", "k": false}, {"i": 287, "s": "市場・政策・試験制度", "u": "市場動向", "q": "M&A実施意向のある企業の候補先の探し方は、売手・買手とも「金融機関に探索を依頼」が最多である。", "a": true, "r": "買い手77%、売り手60%（資料1 p.12）", "k": false}, {"i": 288, "s": "市場・政策・試験制度", "u": "市場動向", "q": "中小企業診断士のうち「最も得意とする分野」に事業承継・M&Aを挙げた者は2.4%だが、「今後活動してみたい分野」では16.3%で最多である。", "a": true, "r": "原文どおり（資料1 p.14）", "k": false}, {"i": 289, "s": "市場・政策・試験制度", "u": "市場動向", "q": "PMIの検討を基本合意前に開始した企業では、満足度が期待以上となった割合が74.8%で、検討していない企業（48.4%）より高い。", "a": true, "r": "原文どおり（資料1 p.19）", "k": false}, {"i": 290, "s": "市場・政策・試験制度", "u": "市場動向", "q": "サーチファンドとは、経営者を目指す個人（サーチャー）が投資家の支援を受けながら中小企業をM&Aし、自ら承継先の経営に携わる投資の仕組みである。", "a": true, "r": "原文どおり（資料1 p.23）", "k": false}, {"i": 291, "s": "市場・政策・試験制度", "u": "支援施策", "q": "日本公庫の事業承継・集約・活性化支援資金の融資上限枠は、2024年2月に7.2億円から14.4億円に拡充された。", "a": true, "r": "原文どおり（資料1 p.17）", "k": false}, {"i": 292, "s": "市場・政策・試験制度", "u": "支援施策", "q": "令和6年度補正予算の事業承継・M&A補助金は、事業承継促進枠、専門家活用枠、PMI推進枠、廃業・再チャレンジ枠の4つの枠を持つ。", "a": true, "r": "原文どおり（資料1 p.18）", "k": false}, {"i": 293, "s": "市場・政策・試験制度", "u": "支援施策", "q": "専門家活用枠では、対象経費の例としてDD費用（800万円を上限に、DD費用を申請する場合200万円を加算）が挙げられている。PMI専門家活用類型は補助上限150万円・補助率1/2、事業統合投資類型は補助上限800万円（賃上げ実施時1,000万円）である。", "a": true, "r": "原文どおり（資料1 p.18, 20）", "k": false}, {"i": 294, "s": "市場・政策・試験制度", "u": "支援施策", "q": "トレーニー制度は令和8年度から地域金融機関を中心に受け入れ、令和8年度上期は11行の金融機関から受け入れ予定である。", "a": true, "r": "原文どおり（資料2 p.30）", "k": false}, {"i": 295, "s": "市場・政策・試験制度", "u": "支援施策", "q": "VアップのIM作成費用補助は最大10万円（補助率2/3）である。", "a": true, "r": "原文どおり（資料2 p.32）", "k": false}, {"i": 296, "s": "市場・政策・試験制度", "u": "支援施策", "q": "「経営者保証に関するガイドライン」では、保証債務の履行時に返済しきれない債務残額は原則として免除することが定められている。地域経済活性化支援機構の特定支援業務は、企業債務と経営者保証人の保証債務の一体整理をサポートする。", "a": true, "r": "原文どおり（参考資料8 p.1〜2）", "k": false}, {"i": 297, "s": "市場・政策・試験制度", "u": "不適切な譲り受け側の情報共有の仕組み", "q": "情報共有の仕組みの運営主体は参加者とは別の法人とし、譲り受け側から手数料等の経済的利益の供与を受けないことが必要である。また、共有された譲り受け側との取引停止を参加者に強制することは、独占禁止法上違法となる可能性がある。", "a": true, "r": "原文どおり（情報共有 p.2）", "k": false}, {"i": 298, "s": "市場・政策・試験制度", "u": "不適切な譲り受け側の情報共有の仕組み", "q": "共有される情報は、社名、法人番号、代表者名、役員名、登録日、登録事由、備考の7項目で、共有範囲には事業承継・引継ぎ支援センターも含める必要がある。", "a": true, "r": "原文どおり（情報共有 p.3）", "k": false}, {"i": 299, "s": "市場・政策・試験制度", "u": "簡易計算ツール", "q": "株式価値の簡易計算ツールの算定対象は黒字企業における株式譲渡であり、非流動性ディスカウントや個社別の調整、非支配株主持分は考慮しない。赤字・債務超過企業や事業譲渡は対象外である。", "a": true, "r": "原文どおり（資料2 p.43）", "k": false}, {"i": 300, "s": "市場・政策・試験制度", "u": "簡易計算ツール", "q": "仲介・FA手数料の簡易計算ツールは、各レーマン方式の成功報酬（着手金、中間金等を除く）を算出し、結果は税抜き表示である。", "a": true, "r": "原文どおり（資料2 p.48）", "k": false}], "bank": [{"id": "ETH-001", "sub": "倫理・行動規範", "top": "使命", "typ": "最も適切", "stem": "中小M&A専門人材の「使命」の内容として、最も適切なものはどれか。", "ch": ["士業等専門家に代わって法務・税務手続を一括して担い、依頼者の手続負担をなくすこと", "質の高いマッチングと一連のプロセスの着実かつ円滑な実行支援により依頼者の利益を実現し、事業の継続・成長に貢献して国民経済の発展に寄与すること", "譲り受け側の成長戦略の実現を最優先に支援し、業界再編を促進することで生産性向上に寄与すること", "M&Aの成立件数を最大化して中小M&A市場を拡大し、それにより国民経済の発展に寄与すること"], "a": 1, "k": null, "ex": "使命は、専門的知見と高い倫理観を基に「質の高いマッチングの提供」と「M&Aの一連のプロセスの着実かつ円滑な実行等に向けた支援」を提供し、依頼者の利益の実現を図るとともに、事業・希少な経営資源の引継ぎによる事業の継続・成長に貢献し、国民経済の発展に寄与することである。", "cn": ["誤り。士業の独占業務に抵触しないことが前提で、士業に代わることは想定されていない。", "正しい。使命は質の高いマッチング・実行支援→依頼者の利益実現→事業の継続・成長→国民経済の発展という構造。", "誤り。使命は依頼者の利益の実現であり、譲り受け側の優先を掲げていない。", "誤り。成立件数の最大化は使命ではなく、むしろ成立の目的化は戒められている。"], "src": "SM p.7", "ref": "n1-2", "lv": 1}, {"id": "ETH-002", "sub": "倫理・行動規範", "top": "使命", "typ": "組合せ", "stem": "中小M&A専門人材の要件は3つの概念の階層構造で整理されている。「使命」は（A）概念、「倫理・行動規範」は（B）概念、「知識・スキル」は（C）概念である。A〜Cの組合せとして正しいものはどれか。", "ch": ["A 上位　B 下位　C 中位", "A 中位　B 上位　C 下位", "A 上位　B 中位　C 下位", "A 下位　B 中位　C 上位"], "a": 2, "k": null, "ex": "スキルマップでは専門人材の要件を「使命（上位概念）」「倫理・行動規範（中位概念）」「知識・スキル（下位概念）」の三概念の階層構造で整理している。倫理・行動規範は使命を実現するための行動の規範として中位に置かれる。", "cn": ["誤り。倫理・行動規範は中位、知識・スキルは下位。", "誤り。使命が上位概念で、倫理・行動規範は中位。", "正しい。使命＝上位、倫理・行動規範＝中位、知識・スキル＝下位。", "誤り。上下が逆転している。"], "src": "SM p.4", "ref": "n1-3", "lv": 1}, {"id": "ETH-003", "sub": "倫理・行動規範", "top": "仲介者・FAの選定等", "typ": "正しい", "stem": "仲介者とFAの違いに関する記述として、正しいものはどれか。", "ch": ["FAは譲り渡し側・譲り受け側の双方と契約し、双方から手数料を受けるのが通常である。", "仲介者は、依頼者に有利な条件でのM&A成立を目指して助言・調整を行う点に特徴がある。", "仲介者・FAは相性よりも実績件数で選ぶべきで、比較検討は最初の1社で足りるとされる。", "仲介者は双方から依頼を受けるため、いずれか一方の利益のみを優先的に取り扱うことはできない。"], "a": 3, "k": null, "ex": "仲介者は譲り渡し側・譲り受け側の双方と契約し双方から手数料を受けるのが通常で、いずれか一方の利益のみを優先的に取り扱うことはできない。FAは一方とのみ契約し、依頼者に有利な条件での成立を目指す。", "cn": ["誤り。双方と契約し双方から手数料を受けるのは仲介者。FAは一方とのみ契約する。", "誤り。依頼者に有利な条件での成立を目指すのはFAの特徴。", "誤り。複数の仲介者・FAを比較検討して決定すること、相性も重要とされる。", "正しい。仲介者は双方から依頼を受けるため一方の利益のみを優先的に取り扱えない。"], "src": "SM p.9（GL第1章3(2)-1）", "ref": "n1-4", "lv": 1}, {"id": "ETH-004", "sub": "倫理・行動規範", "top": "仲介者・FAの選定等", "typ": "最も適切", "stem": "譲り渡し側X社は債務超過で債務整理手続を要する見込みであり、債権者との関係で最も有利な条件を目指すため、厳格な入札方式を希望している。支援機関の形態について、あなたがX社に行う説明として最も適切なものはどれか。", "ch": ["厳格な入札方式は仲介者でなければ実施できないため、仲介者に依頼するよう説明する。", "一方のみと契約し、依頼者に有利な条件での成立を目指すFAの活用が適している例であると説明する。", "双方とのやり取りで円滑に手続を進めることを重視する場面なので、仲介者を選ぶべきと説明する。", "仲介者もFAも役割は同じなので、手数料が最も安い業者を選べば足りると説明する。"], "a": 1, "k": null, "ex": "最も有利な条件での成立を重視する場合や、債権者・株主等との関係で最も有利な条件を目指す必要がある場合（厳格な入札方式を希望する債務整理手続を要する債務超過企業のM&A等）はFAの活用例とされる。仲介者は、双方とやり取りして円滑に手続を進めることを重視する場合の活用例である。", "cn": ["誤り。入札方式が仲介者に限られるという記載はなく、FAの活用例とされている。", "正しい。厳格な入札方式を希望する債務超過企業のM&A等は、FAの活用例として挙げられている。", "誤り。円滑な手続重視は仲介者の活用例だが、本件は最も有利な条件を重視する場面。", "誤り。仲介者とFAは契約の相手方・特徴が異なり、形態の選択が重要。"], "src": "SM p.9（GL第1章3(2)-1）", "ref": "n1-4", "lv": 2}, {"id": "ETH-005", "sub": "倫理・行動規範", "top": "仲介者・FAの選定等", "typ": "最も適切", "stem": "事業承継を検討中の経営者から「仲介者やFAはどう選べばよいか」と相談された。あなたの助言として最も適切なものはどれか。", "ch": ["実績件数が最も多い業者であれば、業務範囲や相性は確認しなくてよいと助言する。", "報酬体系は案件が進んでから確認すれば足りるので、まずは契約を急ぐよう助言する。", "業務形態・業務範囲・契約期間・報酬体系・実績・利用者の声等を確認し、複数の仲介者・FAを比較検討して決めるよう助言する。", "仲介者・FAの違いは実務上重要でないため、紹介を受けた業者にそのまま依頼するよう助言する。"], "a": 2, "k": null, "ex": "依頼者は業務形態、業務範囲・内容、契約期間、報酬（手数料）体系、M&A取引の実績、利用者の声等をホームページや担当者から確認し、複数の仲介者・FAから比較検討して決定することが重要である。相性や、仲介者とFAのどちらの形態が適するかにも留意する。", "cn": ["誤り。実績だけでなく業務範囲や相性も重要とされる。", "誤り。報酬体系は選定時に確認すべき事項の一つ。", "正しい。複数の仲介者・FAから比較検討して決定することが重要とされる。", "誤り。どちらの形態が適しているかに留意することが求められる。"], "src": "SM p.9", "ref": "n1-4", "lv": 1}, {"id": "ETH-006", "sub": "倫理・行動規範", "top": "基本原則", "typ": "正しい", "stem": "倫理・行動規範の第1条「基本原則」の内容として、正しいものはどれか。", "ch": ["常に受領する報酬に見合った範囲で業務を遂行すること。", "常に信義に従い、公正、誠実に業務を遂行すること。", "常に依頼者の指示に従い、可能な限り迅速にM&Aを成立させること。", "常に所属組織の方針を最優先として業務を遂行すること。"], "a": 1, "k": null, "ex": "倫理・行動規範の第1条（基本原則）は「常に信義に従い、公正、誠実に業務を遂行すること」である。以下の善管注意義務・職業倫理、広告・営業、品位等の各規範の土台となる。", "cn": ["誤り。報酬の範囲で業務を限定する趣旨の基本原則はない。", "正しい。第1条は信義・公正・誠実を基本原則とする。", "誤り。迅速な成立を目的とする規定はなく、成立の目的化は戒められている。", "誤り。所属組織の方針の優先は基本原則ではない。"], "src": "SM p.10 #1", "ref": "n1-7", "lv": 1}, {"id": "ETH-007", "sub": "倫理・行動規範", "top": "基本原則", "typ": "正しい", "stem": "スキルマップに示された「倫理・行動規範」の全体像に関する記述として、正しいものはどれか。", "ch": ["全41条・6つの大分類からなり、違反した場合の罰則が定められている。", "全17項目からなり、契約締結前に書面を交付して説明すべき事項を定めたものである。", "全48条からなり、強制力を持つ規程としてではなく、M&A専門人材が満たすべき要素を抽出したものである。", "全48条からなるが、仲介者にのみ適用され、FAには適用されない。"], "a": 2, "k": null, "ex": "倫理・行動規範は全48条からなり、強制力を持つ規程としてではなく、M&A専門人材が満たすべき要素を抽出したものと位置づけられる。また仲介者・FA等の業態を限定せず、中小M&Aに関わる個人を広く対象とする。41項目は遵守事項チェックシート、17項目は重要事項説明の項目であり混同しないこと。", "cn": ["誤り。41項目は遵守事項チェックシート。罰則の定めもない。", "誤り。17項目はGLの重要事項説明の項目。", "正しい。全48条で、強制力を持つ規程ではないと位置づけられる（SM p.10）。", "誤り。対象は業態を限定せず中小M&Aに関わる個人を広く含む（利益相反の防止等一部は仲介者が対象）。"], "src": "SM p.5, p.10", "ref": "n1-5", "lv": 1}, {"id": "ETH-008", "sub": "倫理・行動規範", "top": "基本原則", "typ": "誤り", "stem": "倫理・行動規範の条文構造（大分類・小分類）に関する記述として、誤っているものはどれか。", "ch": ["「利益相反の防止」（第14〜18条）は、主にFAを対象とした規定である。", "「情報管理」には、「情報の取り扱い」と「関係者の指導・監督」が含まれる。", "「報告義務」（第19・20条）は、「善管注意義務・職業倫理」の小分類に位置づけられる。", "贈答・接待に関する規定（第21条）は、「善管注意義務・職業倫理」の「その他」に置かれている。"], "a": 0, "k": null, "ex": "倫理・行動規範の「善管注意義務・職業倫理」は、善管注意義務・支援の質の向上・顧客利益の優先・利益相反の防止（仲介者が対象、#14〜18）・報告義務・その他（贈答・接待）の小分類からなる。情報管理には情報の取り扱い（#40〜45）と関係者の指導・監督（#46）が含まれる。", "cn": ["誤り（本問の正答）。利益相反の防止は仲介者が対象。", "正しい。情報管理には情報の取り扱い（#40〜45）と関係者の指導・監督（#46）が含まれる。", "正しい。報告義務は善管注意義務・職業倫理の小分類（#19, #20）。", "正しい。#21は善管注意義務・職業倫理の「その他（贈答・接待）」。"], "src": "SM p.10〜13", "ref": "n1-6", "lv": 2}, {"id": "ETH-009", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "最も適切", "stem": "あなたは仲介者である。社内の四半期成約目標の締切が迫る中、譲り受け候補先の事業計画には従業員の雇用維持について懸念が残っており、譲り渡し側の社長も迷っている。あなたの対応として最も適切なものはどれか。", "ch": ["懸念点の評価は依頼者自身の責任であるため、支援者からは言及しない。", "成立後の事業の継続・成長につながるかを重視し、懸念点を整理して説明し、社長が十分に検討できるようにする。", "譲渡価格が十分に高ければ、成立後の事業継続は考慮しなくてよいと助言する。", "社内の成約目標を優先し、懸念点には触れずに最終契約の締結を急がせる。"], "a": 1, "k": 3, "ex": "第5条は、M&A成立後の成功（成長・継続等）につながる支援を行い、仮にもM&Aの成立のみを目的として支援を実施しないことを求める。自らの目標のために懸念点を伏せて締結を急がせる行為は、顧客利益の犠牲（#7）や無理な案件推進（#12）にも当たり、明確に不適切である。", "cn": ["誤り。合理的な意思決定に必要な情報は積極的に提供する（#20）。", "正しい。M&A成立後の成功につながる支援を行い、成立のみを目的としない（#5）。", "誤り。事業の継続・成長への貢献が使命であり、価格だけで判断しない（#5）。", "誤り（禁忌肢）。自らの利益のために顧客利益を犠牲にし、成立のみを目的とする行為（#5, #7, #12）。"], "src": "SM p.10〜11 #5, #7, #12, #20", "ref": "n1-7", "lv": 2}, {"id": "ETH-010", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "最も適切", "stem": "あなたはFAとして譲り渡し側と専任契約を締結している。依頼者から「提示された株価算定について、他の専門家の意見も聞いてみたい」と相談された。あなたの対応として最も適切なものはどれか。", "ch": ["他の専門家に相談するなら契約を解除し違約金を請求すると告げ、相談をやめさせる。", "セカンド・オピニオンは最終契約締結後に限り認められると説明する。", "セカンド・オピニオンを得ることは妨げず、意見を求めたい部分を明確にし、情報管理上の留意点を説明する。", "専任契約を締結している以上、セカンド・オピニオンは一切認められないと説明する。"], "a": 2, "k": 0, "ex": "第9条は、顧客が第三者からセカンド・オピニオンを得ることを妨げてはならず、得られることを顧客へ伝えることを求める。専任条項がある場合も、意見を求めたい部分を明確にし、妨げる合理的理由がなければ許容すべきとされ、相談先を秘密保持義務のある者に限定する等の情報管理に配慮する。", "cn": ["誤り（禁忌肢）。セカンド・オピニオンを妨げ、依頼者を威圧する行為（#9, #30）。", "誤り。時期を最終契約後に限る定めはない。", "正しい。セカンド・オピニオンを妨げてはならず、許容しつつ情報管理に配慮する（#9、GL Ⅱ-7）。", "誤り。専任条項でも、妨げる合理的理由がなければセカンド・オピニオンを許容すべき。"], "src": "SM p.10 #9／GL p.103〜104", "ref": "n1-7", "lv": 2}, {"id": "ETH-011", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "最も適切", "stem": "あなたは仲介者である。最終契約書の案がまとまったが、譲り渡し側の社長は「家族とも相談したいので少し時間がほしい」と言っている。あなたの対応として最も適切なものはどれか。", "ch": ["根拠がないのに「今日署名しなければ相手は撤退する」と告げ、当日中の署名を迫る。", "迷いは一時的な不安にすぎないので、説明を省略して前向きな言葉で励まし署名を促す。", "契約書の細部の説明は締結後に行えば足りるとして、先に署名だけ求める。", "契約内容を理解度に応じて説明したうえで、十分に検討する時間を確保し、納得のもとで締結できるようにする。"], "a": 3, "k": 0, "ex": "秘密保持契約・基本合意・最終契約等は顧客の納得のもとで締結し、無理やりに案件を推進させてはならない（#12）。締結する契約について顧客が十分に検討する時間を与える（#13）。虚偽の事実で即時の判断を迫るのは明らかに不適切である。", "cn": ["誤り（禁忌肢）。虚偽の事実で即時の判断を迫り、無理やり案件を推進する行為（#12, #23, #30）。", "誤り。説明を省略して締結を促すのは納得のもとでの締結に反する（#12）。", "誤り。契約内容は締結前に十分かつ明確に説明する（#11）。", "正しい。顧客の納得のもとで締結し、十分な検討時間を与える（#11, #12, #13）。"], "src": "SM p.10〜11 #11〜#13", "ref": "n1-7", "lv": 1}, {"id": "ETH-012", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "正しい", "stem": "あなたは仲介者として譲り渡し側A社を支援している。あなた自身がA社の事業に魅力を感じ、個人で譲り受けたいと考えた。倫理・行動規範に照らし正しいものはどれか。", "ch": ["A社社長から書面による同意を得れば、あなたが譲り受け側となることができる。", "あなた個人ではなく親族が経営する会社を譲り受け側とし、その代理人となるのであれば制限はない。", "譲渡価格を第三者の専門家が算定すれば、あなたが譲り受け側となることができる。", "仲介者は、顧客の同意の有無にかかわらず、自ら取引の当事者となってはならない。"], "a": 3, "k": null, "ex": "第14条は、仲介者は顧客同意にかかわらず、取引の当事者となり、又は自己の利益関係者の代理人となってはならないと定める。「顧客が同意すれば可能」という選択肢が典型的な引っかけである。", "cn": ["誤り。顧客が同意しても当事者になれない点が#14の要点。", "誤り。自己の利益関係者の代理人となることも禁止される。", "誤り。価格算定の方法にかかわらず当事者になれない。", "正しい。#14は顧客同意にかかわらず当事者・利益関係者の代理人となることを禁じる。"], "src": "SM p.11 #14", "ref": "n1-7", "lv": 2}, {"id": "ETH-013", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "最も適切", "stem": "あなたは仲介者である。譲り受け候補先の社長から、面談のお礼として高級腕時計を贈られそうになった。あなたの対応として最も適切なものはどれか。", "ch": ["成約後に受け取るのであれば、社会通念上の範囲を超えても問題はない。", "受け取ったうえで、交渉では同社の希望価格に近づくよう便宜を図る。", "所属組織に報告さえすれば、金額にかかわらず受け取ってよい。", "公平な支援を妨げるおそれがあり、社会通念上許容される範囲を超えるため、受け取らない。"], "a": 3, "k": 1, "ex": "第21条は、公平な支援を妨げるような社会通念上許容される範囲を超える金銭・物品等を受け取ってはならないとし、支援者から顧客への過度な贈答・接待も厳に慎むとする。受領の見返りに一方に便宜を図るのは、中立・公平義務に明らかに反する。", "cn": ["誤り。時期にかかわらず、公平な支援を妨げる贈答は受け取らない。", "誤り（禁忌肢）。贈答の見返りに一方に便宜を図る明白な利益相反行為（#7, #16, #21）。", "誤り。報告の有無で許容範囲が変わるわけではない。", "正しい。社会通念上許容される範囲を超える贈答は受け取ってはならない（#21）。"], "src": "SM p.11 #21", "ref": "n1-7", "lv": 1}, {"id": "ETH-014", "sub": "倫理・行動規範", "top": "広告・営業", "typ": "最も適切", "stem": "あなたは仲介会社で譲り渡し希望企業向けの営業資料を作成している。表現として最も適切なものはどれか。", "ch": ["成立の可能性や条件は不確実であり、交渉等により変動し得ることを明記する。", "「当社なら成約率100%。希望価格以上で必ず売却できます」と記載する。", "依頼者を安心させる目的であれば、不確実な事項も断定的に表現してよい。", "誇大な表示があっても、問い合わせ時に口頭で訂正すれば問題はない。"], "a": 0, "k": 1, "ex": "第22条は虚偽・誇大・誤解を生じる表示や隠ぺいを禁じ、第23条は不確実な事項について断定的判断を提供し確実と誤認させるおそれのあることを告げる行為を禁じる。GLも成立可能性や条件について確定的な判断を下すことを行ってはならない広告・営業として挙げる。", "cn": ["正しい。不確実な事項について断定的判断を提供しない（#23）。", "誤り（禁忌肢）。虚偽・誇大な表示と断定的判断の提供（#22, #23）。", "誤り。目的にかかわらず断定的判断の提供は禁止（#23）。", "誤り。虚偽・誇大な表示自体が禁止される（#22）。"], "src": "SM p.11 #22, #23／GL p.85", "ref": "n1-8", "lv": 1}, {"id": "ETH-015", "sub": "倫理・行動規範", "top": "広告・営業", "typ": "最も適切", "stem": "あなたは仲介会社の営業担当である。電話で営業した企業の社長から「M&Aは考えていないので、今後連絡しないでほしい」と言われた。あなたの対応として最も適切なものはどれか。", "ch": ["3か月後に自分の判断で営業を再開する予定として、個人のメモに残す。", "担当者を変えれば問題ないと考え、翌週から別の担当者が営業電話を続ける。", "書面で停止の申出を受けるまでは、営業を継続してよいと判断する。", "ただちに広告・営業を停止し、停止意思の内容を組織的に記録・共有する。"], "a": 3, "k": 1, "ex": "停止意思（M&Aの実施意向がない、契約を締結しない、引き続き広告・営業を希望しない）を示された場合は、拒んではならず、ただちに停止しなければならない。停止意思の内容は組織的に記録し共有しなければならず、再開は組織的な判断による。", "cn": ["誤り。再開は一担当者限りでなく組織的な判断による必要がある。", "誤り（禁忌肢）。停止意思を示された営業を継続する行為（#25、GL Ⅱ-4(1)）。", "誤り。停止意思の表示方法を書面に限る定めはなく、ただちに停止しなければならない。", "正しい。停止意思を示されたらただちに停止し、組織的に記録・共有する。"], "src": "SM p.11 #25／GL p.84〜85", "ref": "n1-18", "lv": 1}, {"id": "ETH-016", "sub": "倫理・行動規範", "top": "広告・営業", "typ": "全て選べ", "stem": "GLにおいて、仲介者・FAが広告・営業を停止しなければならない「停止意思」に該当するものを全て選べ。\nア M&Aの実施意向がない旨の意思\nイ 当該仲介者・FAと契約を締結しない旨の意思\nウ 引き続き広告・営業を受けることを希望しない旨の意思\nエ 提示された手数料の減額を求める旨の意思", "ch": ["ア、イ", "ア、ウ", "イ、ウ、エ", "ア、イ、ウ"], "a": 3, "k": null, "ex": "停止意思とは、①M&Aの実施意向がない、②当該仲介者・FAと契約締結しない、③引き続き広告・営業を受けることを希望しない、のいずれかの意思をいう。手数料の交渉申入れは停止意思ではなく、誠実に対応を検討すべき事項である。", "cn": ["誤り。ウも停止意思に含まれる。", "誤り。イも停止意思に含まれる。", "誤り。アは含まれ、エ（手数料の減額要求）は停止意思ではない。", "正しい。停止意思はア・イ・ウのいずれかの意思。"], "src": "GL p.84, p.91", "ref": "n1-18", "lv": 1}, {"id": "ETH-017", "sub": "倫理・行動規範", "top": "広告・営業", "typ": "正しい", "stem": "停止意思を示された者に対する広告・営業の再開に関する記述として、正しいものはどれか。", "ch": ["再開後に改めて停止意思を示された場合でも、再開時に定めた期間内は継続できる。", "将来にわたり全ての広告・営業を明確に拒否した者であっても、1年経過後は再開できる。", "再開する場合は、明確化された基準の下で組織的プロセスにより行い、組織的に記録され事後に検証可能な判断による。", "一定期間が経過すれば、担当者個人の判断で再開してよい。"], "a": 2, "k": null, "ex": "再開は慎重に検討の上、明確化された基準の下、一担当者限りでなく組織的プロセスで行い、組織的に記録され事後に検証可能な「組織的な判断」による必要がある。全ての広告・営業を明確に拒否した者への再開は当然不可で、再開後に改めて停止意思を示されたらただちに停止する。", "cn": ["誤り。改めて停止意思を示されたらただちに停止しなければならない。", "誤り。将来にわたり又は一定期間明確に拒否した者への再開は当然不可。", "正しい。再開は慎重な検討の上、組織的な判断による。", "誤り。一担当者限りの判断は不可。"], "src": "GL p.84", "ref": "n1-18", "lv": 2}, {"id": "ETH-018", "sub": "倫理・行動規範", "top": "広告・営業", "typ": "全て選べ", "stem": "GLにおいて、仲介者・FAが行ってはならない広告・営業として示されているものを全て選べ。\nア 仲介者・FAの名称、勧誘者の氏名、契約締結の勧誘目的である旨を告げずに行うもの\nイ 意思決定に必要な時間を与えず、即時の判断を迫るもの\nウ 譲受意向を確認していない企業について、意向があると誤認させるもの\nエ 想定される重要なメリット・デメリットを知り得る限り明示的に説明するもの", "ch": ["ア、イ", "ア、イ、ウ", "イ、ウ、エ", "ア、イ、ウ、エ"], "a": 1, "k": null, "ex": "行ってはならない広告・営業は、①名称・氏名・勧誘目的を告げずに行うもの、②即時の判断を迫るもの、③成立の可能性や条件等について虚偽・事実と相違・誤認を招くもの（意向のない・未確認の企業に意向があると偽る等）である。重要なメリット・デメリットを知り得る限り明示的に説明することはGLが求める対応である。", "cn": ["誤り。ウも行ってはならないものに含まれる。", "正しい。ア・イ・ウは行ってはならない広告・営業。", "誤り。アは含まれ、エはむしろ求められる対応。", "誤り。エは求められる対応であり禁止ではない。"], "src": "GL p.84〜85", "ref": "n1-18", "lv": 2}, {"id": "ETH-019", "sub": "倫理・行動規範", "top": "広告・営業", "typ": "最も適切", "stem": "あなたは仲介会社の営業担当である。訪問先の社長から「うちの会社はいくらで売れるのか」と尋ねられ、簡易的な評価額を示すことにした。あなたの対応として最も適切なものはどれか。", "ch": ["確定的な評価ではなく参考として簡易に算定したものであること、セカンド・オピニオンを求められることを明示する。", "仲介者が確定的に決定した評価額として示し、交渉の基準価格とするよう求める。", "簡易的なものであるため、算定の前提条件は説明しなくてよい。", "契約獲得のため、根拠なく相場を大きく上回る評価額を確定値として提示する。"], "a": 0, "k": 3, "ex": "過大なバリュエーションの提示は、誤認を招く行ってはならない広告・営業の例として挙げられ、仲介者が実施する場合は確定的でない旨、セカンド・オピニオンを求められる旨等を明示する必要がある。両当事者を依頼者とする仲介者は確定的なバリュエーションを実施すべきではない。", "cn": ["正しい。仲介者が実施する場合は確定的でない旨、セカンド・オピニオンを求められる旨等を明示する必要がある。", "誤り。仲介者は確定的なバリュエーションを実施すべきではない。", "誤り。評価手法・前提条件は事前に説明し納得を得る必要がある。", "誤り（禁忌肢）。過大なバリュエーションの提示で誤認を招く営業（GL Ⅱ-4(1)②）。"], "src": "GL p.85, p.93", "ref": "n1-18", "lv": 2}, {"id": "ETH-020", "sub": "倫理・行動規範", "top": "品位", "typ": "正しい", "stem": "倫理・行動規範の「品位」に関する記述として、正しいものはどれか。", "ch": ["関係者の誹謗・中傷は、事実に基づく内容であれば禁止されない。", "関係者への不当な要求は、依頼者の利益を守る目的であれば許容される。", "品位を損なう事業であっても、M&A業務とは別法人で営むのであれば制限はない。", "品位を損なう事業を営んではならず、自己の名義を他人に利用させてはならない。"], "a": 3, "k": null, "ex": "品位の保持（#26）として見識と品位の保持・向上に努め、品位を損なう行為の禁止（#27〜31）として、品位を損なう事業の営み・参入や名義貸し、公序良俗違反、誹謗・中傷、欺罔・脅迫・不当な要求、業務妨害を禁じる。", "cn": ["誤り。関係者を誹謗・中傷してはならない（#29）。事実に基づくか否かで許容する定めはない。", "誤り。欺罔・脅迫・不当な要求は目的を問わず禁止（#30）。", "誤り。品位を損なう事業を営み・参入してはならない（#27）。", "正しい。#27の内容。"], "src": "SM p.11〜12 #26〜#31", "ref": "n1-8", "lv": 1}, {"id": "ETH-021", "sub": "倫理・行動規範", "top": "品位", "typ": "最も適切", "stem": "あなたは仲介者である。クロージング後、譲り受け側が最終契約で定めた残代金の支払を渋っていると譲り渡し側から相談を受けた。あなたの対応として最も適切なものはどれか。", "ch": ["あなたが譲り渡し側の代理人として、譲り受け側と法的な請求交渉を行う。", "最終契約の該当条項を確認して状況を整理し、弁護士等の専門家に相談するよう譲り渡し側に勧める。", "譲り受け側に「支払わなければ業界に悪評を流す」と告げ、支払を迫る。", "当事者間の問題であるため、報告も助言もせず関与しない。"], "a": 1, "k": 2, "ex": "関係者を欺罔・脅迫し、不当な要求をする行為は禁止される（#30）。また、紛争解決に向けた支援は非弁行為（弁護士法第72条）に該当しうるおそれがあるため、弁護士等の意見を求めるよう伝えるのが適切である。", "cn": ["誤り。紛争解決に向けた支援は非弁行為（弁護士法第72条）に該当しうる。", "正しい。紛争解決は弁護士等の意見を求めるよう伝えるのが適切。", "誤り（禁忌肢）。関係者を脅迫する行為で品位を損なう（#30）。", "誤り。必要な情報提供や専門家への橋渡しは求められる。"], "src": "SM p.12 #30／GL p.87", "ref": "n1-8", "lv": 2}, {"id": "ETH-022", "sub": "倫理・行動規範", "top": "法令等の遵守", "typ": "正しい", "stem": "倫理・行動規範の「法令等の遵守」に関する記述として、正しいものはどれか。", "ch": ["業界団体の自主規程は法令ではないため、遵守の対象外である。", "顧客のプライバシーに関わる情報も、成約に必要であれば本人の承諾なく第三者に開示できる。", "契約上の義務は、支援者が合理的と判断すれば正当な理由がなくても履行を延期できる。", "公的機関・所属業界団体等が制定するM&A関連のガイドライン・指針等を遵守する。"], "a": 3, "k": null, "ex": "法令等の遵守として、社会規範・法令の遵守（#32）、義務の正当な理由なき不履行の禁止（#33）、権利・プライバシー・名誉・信用等の侵害禁止（#34）、公的機関・業界団体等のガイドライン・指針等の遵守（#35）、顧客の法令違反等判明時の対応（#36）が定められている。", "cn": ["誤り。所属業界団体等が制定するガイドライン・指針等も遵守対象（#35）。", "誤り。顧客等のプライバシー等を侵害してはならない（#34）。", "誤り。法令上・契約上の義務を正当な理由なく履行しない行為は禁止（#33）。", "正しい。#35の内容。"], "src": "SM p.12 #32〜#35", "ref": "n1-9", "lv": 1}, {"id": "ETH-023", "sub": "倫理・行動規範", "top": "法令等の遵守", "typ": "最も適切", "stem": "あなたは仲介者である。譲り渡し側C社について、必要な許認可を得ないまま一部事業を営んでいた疑いが判明した。あなたの対応として最も適切なものはどれか。", "ch": ["自己や顧客の利益を優先せず、士業等専門家への相談も含めて対応策を検討する。", "あなた自身が法的評価を確定させ、問題はないとC社に断言する。", "法令違反の有無は顧客の責任であり、支援者は関与しないのが適切である。", "成約に支障が出るため、事実を伏せたまま手続を進めるようC社に勧める。"], "a": 0, "k": 3, "ex": "第36条は、顧客の法令違反・不適切な目的・懸念点が判明したら、自己や顧客の利益を優先するのではなく、専門機関・士業等への相談も含め対応策を検討することを求める。事実を伏せて進めることは相手方の利益を害し、トラブルに繋がる確度が高い。", "cn": ["正しい。#36の内容。", "誤り。法的判断は士業等専門家への相談が必要で、断定的判断の提供にも当たる。", "誤り。判明した懸念点について対応策を検討することが求められる（#36）。", "誤り（禁忌肢）。法令違反の疑いを隠して取引を進める行為（#8, #36、GL Ⅱ-5）。"], "src": "SM p.12 #36", "ref": "n1-9", "lv": 2}, {"id": "ETH-024", "sub": "倫理・行動規範", "top": "法令等の遵守", "typ": "全て選べ", "stem": "次のうち、A社とアドバイザリー契約を締結して報酬を得ているM&A支援機関に所属する私が行う行為について、適法に行えないものを全て選べ。ただし、私は弁護士、税理士、弁理士等の資格保有者ではないものとする。\n（ア）A社の代表者が過去に会社の不動産を第三者Xに譲渡していたが、必要な株主総会決議を経ていなかった。当該譲渡は会社法に照らして無効なので、私が代わりにXと交渉した。\n（イ）今回の株式譲渡において、株主が支払うことになる税金の金額を、私がアドバイザリー契約外の税務相談として、無償で試算した。\n（ウ）A社のマスコットキャラクターの商標登録が未了だったため、私がA社と契約して報酬を受領して、その一部を弁理士に支払って、私に代わって商標申請を行ってもらった。\n（エ）A社の代表者から、問題のある従業員を退職させたいとの相談を受けたため、私は、当該従業員の行為が懲戒事由に該当するため本件では懲戒処分が可能との見解を伝えた。", "ch": ["イ", "ア、ウ", "ア、ウ、エ", "ア、イ、ウ、エ"], "a": 3, "k": null, "ex": "公式サンプル問題（資料2 p.16、小項目：法令遵守行為（独占業務違反））。公式の正答は④「ア、イ、ウ、エ」で、資料には正答表示のみで解説文はない。仲介・FA業務は弁護士法第72条、税理士法第52条等の士業の独占業務に抵触しないことが前提であり、「無償」「契約外」であっても適法にならない点が要注意である。", "cn": ["誤り。イ以外（ア・ウ・エ）も適法に行えない。", "誤り。イ・エも適法に行えない。", "誤り。イ（無償・契約外の税額試算）も適法に行えない。", "正しい。ア〜エのすべてが適法に行えない（公式正答）。"], "src": "資料2 p.16（公式サンプル問題）／資料2 p.3, p.5", "ref": "n1-12", "lv": 2}, {"id": "ETH-025", "sub": "倫理・行動規範", "top": "法令等の遵守", "typ": "正しい", "stem": "中小M&A資格試験と士業の独占業務の関係に関する記述として、正しいものはどれか。", "ch": ["本資格試験の想定水準は、士業専門家に代わって法務・税務の結論を出せる水準である。", "仲介・FA業務は、弁護士法第72条、税理士法第52条等の各士業の独占業務に抵触しないことが前提である。", "本資格試験に合格すれば、M&Aに付随する範囲で税務相談を有償で行うことができる。", "無償で行う税額の試算であれば、税理士の独占業務に抵触することはない。"], "a": 1, "k": null, "ex": "仲介・FA業務は各士業の独占業務（弁護士法第72条、税理士法第52条等）に抵触しないことが前提であり、本資格試験の合格は独占業務の実施を可能とするものではない。想定水準は士業専門家と連携できる水準で、財務・税務、法務の基礎知識で論点を見極めることが求められる。", "cn": ["誤り。想定水準は「士業専門家と連携できる水準」。", "正しい。独占業務に抵触しないことが前提とされる。", "誤り。合格は既存の業法に基づく独占業務の実施を可能とするものではない。", "誤り。公式サンプル問題では無償・契約外の税額試算も「適法に行えない」とされる。"], "src": "資料2 p.3, p.5, p.16", "ref": "n1-11", "lv": 1}, {"id": "ETH-026", "sub": "倫理・行動規範", "top": "法令等の遵守", "typ": "組合せ", "stem": "重要事項説明における「提供する業務の範囲・内容」について、GLは「役務の範囲に関わらず、紛争解決に向けた支援は（A）に該当しうるおそれがある旨も説明（B）、弁護士等の意見を求める必要がある旨の説明が（C）」とする。A〜Cの組合せとして正しいものはどれか。", "ch": ["A 税理士法第52条違反　B しなければならず　C 望ましい", "A 非弁行為（弁護士法第72条）　B することが望ましく　C 必要である", "A 非弁行為（弁護士法第72条）　B しなければならず　C 望ましい", "A 非弁行為（弁護士法第72条）　B しなければならず　C 義務付けられる"], "a": 2, "k": null, "ex": "GLは、範囲に関わらず紛争解決に向けた支援は非弁行為（弁護士法第72条）に該当しうるおそれがある旨も説明しなければならず、弁護士等の意見を求める必要がある旨の説明が望ましいとする。義務（しなければならない）と推奨（望ましい）の区別が問われやすい。", "cn": ["誤り。紛争解決支援は弁護士法第72条の非弁行為の問題。", "誤り。非弁のおそれの説明は「しなければならない」で、弁護士等の意見の説明が「望ましい」。", "正しい。GLの記載どおり。", "誤り。弁護士等の意見を求める必要がある旨の説明は「望ましい」にとどまる。"], "src": "GL p.87", "ref": "n1-11", "lv": 3}, {"id": "ETH-027", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "最も適切", "stem": "あなたは中小企業のM&Aを支援する仲介業者である。譲り渡し側（A社社長）は、後継者不在のため第三者承継を検討している。候補となる譲り受け側（B社）からは、「買収後すぐに資金を投入して事業を拡大する。」「経営者保証も引き継ぐ方向で検討する。」等前向きな発言がある一方、社内では過去にB社と同種の買い手によるトラブル事例も見聞きしており、A社社長は「本当に大丈夫か。」「最終契約・クロージング後に揉めないか。」等の不安を感じている。\nあなたは、A社社長に対して、譲り受け側の適格性（履行能力・コンプライアンス等）や、最終契約・クロージング後に当事者間でトラブルとなり得るリスク事項について、適切な説明を行う必要がある。\nこのような状況で、仲介者としての善管注意義務の観点から、次の対応のうち最も適切なものはどれか。", "ch": ["譲り受け側（B社）の調査結果をA社へ報告するとともに、最終契約締結前に、契約締結後・クロージング後にトラブルとなり得るリスクを説明する。", "譲り受け側（B社）の社長と反社会組織との交友関係を確認していたが、成約や手続進行を優先するため、A社社長には説明せずに取引を進める。", "譲り受け側の適格性については、B社からの提供情報や会社案内資料を踏まえて判断すれば足りるとして、更なる追加調査・検証までは行わない。", "依頼者への説明は、仲介手数料の算定方法や金額を中心に行うこととし、M&Aプロセスごとの業務内容や想定されるリスク事項についての詳細説明までは行わない。"], "a": 0, "k": 1, "ex": "公式サンプル問題（資料2 p.8、禁忌肢に関するサンプル問題・善管注意義務に関する出題）。公式正答は①。②は中小M&Aガイドラインに明らかに抵触する内容（GL第2章Ⅱ.5に抵触）として禁忌肢に設定されている。③④は誤答（資料に個別の解説はない）。", "cn": ["正しい（公式正答）。調査結果の報告と最終契約締結前のリスク説明。", "誤り（公式の禁忌肢）。GL第2章Ⅱ.5「仲介者における利益相反のリスクと現実的な対応策」に明らかに抵触する。", "誤り（公式の誤答）。譲り受け側の調査は税務申告書・商業登記簿の確認やコンプライアンスチェック等で行い、最終契約締結までに十分確認する。", "誤り（公式の誤答）。業務はプロセスごとに整理して書面で説明しなければならず、リスクの説明も求められる。"], "src": "資料2 p.8（公式サンプル問題）／GL p.99〜102", "ref": "n1-34", "lv": 2}, {"id": "ETH-028", "sub": "倫理・行動規範", "top": "不適切な個人・組織、反社等との関係", "typ": "最も適切", "stem": "あなたは仲介会社の担当者である。初めて取引する法人から、譲り受け希望の登録申込みがあった。あなたの対応として最も適切なものはどれか。", "ch": ["取引開始前に、反社会的勢力等の不適切な者でないかを確認する。", "取引実績のある会社からの紹介であれば、確認は省略してよい。", "確認の結果に懸念があっても、担当者限りで判断して登録を進める。", "反社会的勢力等の確認は、最終契約締結の直前に一度行えば足りる。"], "a": 0, "k": null, "ex": "第38条は、反社等不適切な顧客・関係者でないかを取引開始前に確認することを求める。GLでも譲り受け側の調査は仲介契約・FA契約の締結前（プラットフォーマーは登録前）に加え、進捗過程でも実施し最終契約締結までに十分確認するとされる。", "cn": ["正しい。取引開始前に確認する（#38）。", "誤り。紹介の有無で確認を省略できるとの定めはない。", "誤り。不適切な者の情報は組織内で共有する（#39）。", "誤り。取引開始前に確認し、進捗過程でも最終契約締結までに十分確認する。"], "src": "SM p.12 #38／GL p.100", "ref": "n1-9", "lv": 1}, {"id": "ETH-029", "sub": "倫理・行動規範", "top": "不適切な個人・組織、反社等との関係", "typ": "最も適切", "stem": "あなたは仲介者である。担当案件の譲り受け候補D社について、過去のM&Aで最終契約の義務を履行せずトラブルになったとの情報を同業者から得た。あなたの対応として最も適切なものはどれか。", "ch": ["情報を担当者レベルに留めず組織的に共有し、支援の可否を慎重に検討するとともに、譲り渡し側に開示する。", "情報の真偽が確定するまでは、記録も共有もしないでおく。", "担当案件の成約を優先し、情報を社内で共有せず、譲り渡し側にも伝えずに進める。", "D社への支援を継続するかどうかは、担当者個人の判断で決める。"], "a": 0, "k": 2, "ex": "不適切な行為に係る情報を取得した場合は、担当者レベルに留めず組織的に共有し、支援を慎重に検討する体制を構築しなければならない。新たな支援は組織的な判断によらなければならず、仲介者は譲り受け側の不適切行為の情報を譲り渡し側に開示することが求められる。", "cn": ["正しい。組織的共有・慎重な検討体制と、仲介者の譲り渡し側への開示（GL Ⅱ-6(2)）。", "誤り。情報は組織的に共有し慎重に検討する体制が求められる。", "誤り（禁忌肢）。不適切行為の情報の秘匿で、GL Ⅱ-5・Ⅱ-6に明らかに反する。", "誤り。新たな支援は組織的な判断によらなければならない。"], "src": "GL p.102〜103／SM p.12 #39", "ref": "n1-24", "lv": 2}, {"id": "ETH-030", "sub": "倫理・行動規範", "top": "情報管理", "typ": "最も適切", "stem": "あなたは仲介者である。担当案件で上場会社E社が譲り受け候補となっており、E社による買収はまだ公表されていない。あなたの行動として最も適切なものはどれか。", "ch": ["過失による伝達であれば、行動規範上は問題とならない。", "親しい知人に「E社から近く大きな発表がある」と伝え、E社株の購入を勧める。", "未公表の重要事実にあたり得る情報として、顧客・関係者以外には一切伝達しない。", "社内であれば、案件に関与していない役職員にも自由に共有してよい。"], "a": 2, "k": 1, "ex": "第42条は、インサイダー取引防止のため、未公表の重要事実にあたり得る情報を顧客・関係者以外に一切伝達せず、故意・過失を問わず行わないことを求める。業務上知り得た情報を自ら・関係者の利益に利用することも禁じられる。", "cn": ["誤り。故意・過失を問わず行わないとされる（#42②）。", "誤り（禁忌肢）。インサイダー取引に繋がる情報伝達・取引推奨で明らかに不適切。", "正しい。インサイダー取引防止のため顧客・関係者以外に一切伝達しない（#42②）。", "誤り。顧客・関係者以外には一切伝達しない。"], "src": "SM p.12〜13 #42", "ref": "n1-10", "lv": 1}, {"id": "ETH-031", "sub": "倫理・行動規範", "top": "情報管理", "typ": "最も適切", "stem": "あなたは仲介者として譲り渡し側F社を支援している。関心を示した候補先に企業情報を開示しようとしている。あなたの対応として最も適切なものはどれか。", "ch": ["開示の可否・範囲・期間等を事前にF社と話し合い、秘密保持契約に違反しないか確認したうえで開示する。", "候補先の関心を高めるため、秘密保持契約の締結前に詳細な企業概要書を送付する。", "秘密保持契約を締結済みであれば、開示範囲についてF社と話し合う必要はない。", "開示範囲は支援者が判断し、F社には開示後に報告すれば足りる。"], "a": 0, "k": null, "ex": "第43条は、情報開示時は顧客・関係者と必ず事前に開示および範囲・期間等を話し合い、NDAがあれば違反がないか確認することを求める。GLもNDA締結前に詳細情報が漏えいしないよう注意する必要があるとする。", "cn": ["正しい。#43の内容。", "誤り。NDA締結前に詳細情報が漏えいしないよう注意する必要がある。", "誤り。NDAの有無にかかわらず開示および範囲・期間等を事前に話し合う。", "誤り。必ず事前に顧客・関係者と話し合う（#43）。"], "src": "SM p.13 #43／GL p.94", "ref": "n1-10", "lv": 1}, {"id": "ETH-032", "sub": "倫理・行動規範", "top": "情報管理", "typ": "最も適切", "stem": "あなたは仲介者である。譲り受け候補G社から「当社が過去に買収先で大規模な人員削減を行った事実は、譲り渡し側には言わないでほしい」と頼まれた。譲り渡し側は従業員の雇用維持を最重視している。あなたの対応として最も適切なものはどれか。", "ch": ["G社の依頼に従って秘匿し、譲り渡し側には伝えずに手続を進める。", "譲り渡し側の不利益につながるリスクを含む情報として開示が求められ、開示が難しい場合は支援の打ち切り等で善管注意義務を果たす。", "譲り渡し側から具体的に質問された場合に限り、回答すればよい。", "G社から得た情報である以上、仲介者は譲り渡し側に開示してはならない。"], "a": 1, "k": 0, "ex": "第44条は、仲介者は一方依頼者の不利益につながるリスクを含む情報を、善管注意義務の観点から当該依頼者に開示することが求められ、開示が難しい場合も支援の打ち切り等で善管注意義務を果たさなければならないとする。一方にのみ不利な情報の秘匿はGLが禁止する利益相反行為である。", "cn": ["誤り（禁忌肢）。一方に不利な情報の秘匿で、禁止される利益相反行為（GL Ⅱ-5⑤）。", "正しい。#44の内容。", "誤り。対立に係る情報を認識したら適時に明示的に開示する（GL Ⅱ-5）。", "誤り。仲介者には一方依頼者の不利益につながる情報の開示が求められる（#44）。"], "src": "SM p.13 #44／GL p.99〜100", "ref": "n1-10", "lv": 2}, {"id": "ETH-033", "sub": "倫理・行動規範", "top": "情報管理", "typ": "正しい", "stem": "取引終了後の情報管理および関係者の指導・監督に関する記述として、正しいものはどれか。", "ch": ["職務に関与させた外部の者については、情報の取扱いを指導・監督する必要はない。", "取引終了後は、過去の顧客情報を他案件の営業資料に転用してよい。", "取引終了後も書類等の使用を停止し、一定期間の保存やアクセス制限等により適切に管理する。", "取引が終了すれば、関連書類は取り決めにかかわらず直ちに自由に処分してよい。"], "a": 2, "k": null, "ex": "第45条は取引終了後も書類等の使用停止・適切な管理（一定期間の保存、アクセス制限等）を求め、取り決めにより破棄・破棄証明が必要な場合もあるとする。第46条は職務に関与させた者にも情報の取扱いについて適切な指導・監督を行うことを求める。", "cn": ["誤り。職務に関与させた者にも適切な指導・監督を行う（#46）。", "誤り。承諾なき流用は禁止（#42）。", "正しい。#45の内容。", "誤り。一定期間の保存が必要で、取り決めにより破棄・破棄証明が必要な場合もある。"], "src": "SM p.13 #45, #46", "ref": "n1-10", "lv": 1}, {"id": "ETH-034", "sub": "倫理・行動規範", "top": "その他禁止行為", "typ": "最も適切", "stem": "あなたは仲介者である。税理士が作成した株式価値算定書の評価額が、譲り渡し側の希望額を下回っていた。あなたの対応として最も適切なものはどれか。", "ch": ["第三者が作成した書類であるため、内容の確認は一切行わない。", "譲り渡し側の希望額に合うよう、算定書の数値を書き換えて譲り受け側に提示する。", "仲介者として算定結果を修正し、確定した評価額として両当事者に示す。", "算定書は改変せずに提示し、前提条件等に疑問があれば作成者である税理士に確認を依頼する。"], "a": 3, "k": 1, "ex": "第47条は、第三者作成の書類・情報を正当な権限なく違法・不当に偽造・変造・改変等をしてはならないとする。また、取得した情報の正しさを自ら確認するよう努めること（#41）、仲介者はバリュエーションの結論を決定しないこと（#18）も求められる。", "cn": ["誤り。取得した情報の正しさを自ら確認するよう努める（#41）。", "誤り（禁忌肢）。第三者作成書類の不当な改変（#47）。", "誤り。仲介者はバリュエーションの結論を決定しない（#18）。", "正しい。第三者作成書類を改変せず、疑問は作成者に確認する。"], "src": "SM p.13 #41, #47／SM p.11 #18", "ref": "n1-10", "lv": 2}, {"id": "ETH-035", "sub": "倫理・行動規範", "top": "その他禁止行為", "typ": "最も適切", "stem": "あなたは仲介会社のチームリーダーである。部下が、譲り受け側に対し譲り渡し側の業績見通しを実際より良く誤認させる説明をしようとしていることを知った。あなたの対応として最も適切なものはどれか。", "ch": ["自分の行為ではないので黙認し、成約後に問題が生じたら対応する。", "部下の担当案件であるため、上司として関与する必要はない。", "依頼者から苦情が寄せられた場合に限り、対応を検討する。", "部下に説明をやめさせ、正確な情報に基づく説明となるよう指導するなど停止等の措置を講じる。"], "a": 3, "k": 0, "ex": "第48条は、善管注意義務・職業倫理上不適切な行為をしてはならず、関係者の不適切行為を予見・認識しながら停止等の措置を講じない行為をしてはならないとする。財務状況・見通し等を実際より優良と誤認させる説明は、GLでも行ってはならない行為に当たる。", "cn": ["誤り（禁忌肢）。関係者の不適切行為を認識しながら措置を講じない行為（#48）。", "誤り。予見・認識しながら措置を講じないことは禁止（#48）。", "誤り。苦情の有無にかかわらず停止等の措置を講じる。", "正しい。#48の内容。"], "src": "SM p.13 #48／GL p.85", "ref": "n1-10", "lv": 2}, {"id": "ETH-036", "sub": "倫理・行動規範", "top": "支援機関向けの基本姿勢", "typ": "全て選べ", "stem": "GL第2章で示される「支援機関としての基本姿勢」に該当するものを全て選べ。\nア 依頼者（顧客）の利益の最大化\nイ それぞれの役割に応じた適切な支援\nウ 支援機関間の連携\nエ M&A成立件数の最大化", "ch": ["ア、イ", "ア、ウ、エ", "ア、イ、ウ", "イ、ウ"], "a": 2, "k": null, "ex": "支援機関としての基本姿勢は、①依頼者（顧客）の利益の最大化、②それぞれの役割に応じた適切な支援、③支援機関間の連携の3点である。成立件数の最大化は掲げられておらず、M&Aの成立の目的化はむしろ懸念点とされる。", "cn": ["誤り。ウも基本姿勢に含まれる。", "誤り。エは基本姿勢ではなく、イが含まれる。", "正しい。基本姿勢はア・イ・ウの3点。", "誤り。アも基本姿勢に含まれる。"], "src": "GL p.78〜79", "ref": "n1-14", "lv": 1}, {"id": "ETH-037", "sub": "倫理・行動規範", "top": "支援機関向けの基本姿勢", "typ": "誤り", "stem": "GLで示される支援機関と期待される役割の組合せとして、誤っているものはどれか。", "ch": ["M&Aプラットフォーマー ― マッチングやその後の手続の進捗管理等の総合的な支援", "商工団体 ― 身近な相談相手として、適切な支援機関に紹介する等", "事業承継・引継ぎ支援センター ― 公的機関としての中小M&A支援", "金融機関 ― 融資で把握した経営状況やネットワークを生かした積極的な働き掛け"], "a": 0, "k": null, "ex": "GLは、M&A専門業者にマッチングやその後の手続の進捗管理等の総合的な支援、金融機関に積極的な働き掛け、商工団体に身近な相談相手としての紹介等、士業等専門家に専門的知見を生かした手続支援、プラットフォーマーにプラットフォームの運営、センターに公的機関としての支援を期待している。", "cn": ["誤り（本問の正答）。総合的な支援はM&A専門業者の役割。プラットフォーマーはインターネットを活用したM&Aプラットフォームの運営。", "正しい組合せ。", "正しい組合せ。", "正しい組合せ。"], "src": "GL p.78", "ref": "n1-14", "lv": 1}, {"id": "ETH-038", "sub": "倫理・行動規範", "top": "支援機関向けの基本姿勢", "typ": "最も適切", "stem": "あなたは商工団体の経営指導員である。会員企業の社長から、後継者がいないので会社を第三者に引き継ぎたいと初めて相談を受けた。あなたの対応として最も適切なものはどれか。", "ch": ["M&Aは専門業者の領域なので、相談には応じず自分で業者を探すよう伝える。", "身近な相談相手として状況を聞き取り、事業承継・引継ぎ支援センター等の適切な支援機関につなぐ。", "商工団体として、マッチングから最終契約書の作成まで全工程を自ら担う。", "相談内容は機密性が高いため、他の支援機関には一切つながず自ら判断を示す。"], "a": 1, "k": null, "ex": "商工団体には身近な相談相手として適切な支援機関に紹介する等の役割が期待され、円滑なケースでは商工団体からセンターへつなぐなど支援機関同士が連携している例が多い。自ら全てを抱え込まず、他の支援機関と積極的に連携することが望まれる。", "cn": ["誤り。身近な相談相手としての役割を放棄している。", "正しい。商工団体は身近な相談相手として適切な支援機関に紹介する役割。", "誤り。各支援機関は自ら全てを抱え込むのではなく、必要に応じ他の支援機関と積極的に連携することが望まれる。", "誤り。支援機関間の連携が基本姿勢の一つ。"], "src": "GL p.78〜79", "ref": "n1-13", "lv": 1}, {"id": "ETH-039", "sub": "倫理・行動規範", "top": "支援機関向けの基本姿勢", "typ": "正しい", "stem": "GLにおけるM&A専門業者による支援の特色に関する記述として、正しいものはどれか。", "ch": ["許可制等がないため、M&A専門業者には契約上の義務以外の職業倫理は求められない。", "M&A専門業者には許可制・免許制等はないが、契約に基づき善管注意義務と忠実義務を負う。", "M&A専門業者は、宅地建物取引業法と同様の業法により免許制とされている。", "忠実義務とは、依頼者の指示にすべて従い、異議を述べない義務をいう。"], "a": 1, "k": null, "ex": "M&A専門業者には許可制・免許制等はなく業界全体の一般的な法規制もないが、契約に基づき善管注意義務と忠実義務（依頼者の利益を犠牲に自己・第三者の利益を図ってはならない義務）を負う。さらに契約上の義務に限られない職業倫理の遵守が求められる。", "cn": ["誤り。専門性・情報の非対称性・構造的な利益相反から、契約上の義務に限られない職業倫理が求められる。", "正しい。許可制・免許制はないが、契約に基づく善管注意義務・忠実義務を負う。", "誤り。宅地建物取引業法のような業界全体の法規制はない。", "誤り。忠実義務は依頼者の利益を犠牲に自己・第三者の利益を図ってはならない義務。"], "src": "GL p.79", "ref": "n1-15", "lv": 1}, {"id": "ETH-040", "sub": "倫理・行動規範", "top": "支援機関向けの基本姿勢", "typ": "全て選べ", "stem": "GLが、M&A専門業者に「契約上の義務に限られない職業倫理の遵守」を求める理由として挙げているものを全て選べ。\nア 取扱業務の専門性\nイ 知識・情報や候補先情報が業者に偏在する情報の非対称性\nウ 仲介業務における構造的な利益相反のリスク\nエ 業界全体の手数料水準の高さ", "ch": ["ア、イ、ウ", "ア、ウ", "イ、ウ、エ", "ア、イ、ウ、エ"], "a": 0, "k": null, "ex": "GLは、①取扱業務の専門性、②知識・情報や候補先情報が業者に偏在する情報の非対称性、③仲介業務における構造的な利益相反のリスクの3点から、契約上の義務に限られない職業倫理の遵守が求められるとする。経済的利益と成立が結びつき成立が目的化するおそれも指摘されている。", "cn": ["正しい。3点はア・イ・ウ。", "誤り。イも理由に含まれる。", "誤り。アは含まれ、エは挙げられていない。", "誤り。エは挙げられていない。"], "src": "GL p.79〜80", "ref": "n1-15", "lv": 2}, {"id": "ETH-041", "sub": "倫理・行動規範", "top": "支援機関向けの基本姿勢", "typ": "正しい", "stem": "GL第2章の行動指針の適用範囲等に関する記述として、正しいものはどれか。", "ch": ["金融機関・士業等・M&Aプラットフォーマー等が仲介・FA業務を行う場合も、業務の性質が共通する限り準拠が想定されている。", "行動指針の主たる目的は、業界の手数料水準を統一することにある。", "行動指針はM&A専門業者のみを対象とし、金融機関が行う仲介業務には適用が想定されていない。", "市場の透明性・公正性は各社の業務方針に委ねれば足りるとして、指針は参考情報にとどめられている。"], "a": 0, "k": null, "ex": "GLは、業務方針に委ねるだけでなく市場の透明性・公正性確保のため一定の指針が示される必要があるとし、金融機関・士業等・プラットフォーマー等が仲介・FA業務を行う場合も、業務の性質が共通する限り準拠を想定している。", "cn": ["正しい。業務の性質が共通する限り準拠を想定。", "誤り。目的は市場の透明性・公正性の確保。", "誤り。金融機関・士業等・プラットフォーマー等も準拠が想定される。", "誤り。業務方針に委ねるだけでなく一定の指針が示される必要があるとされる。"], "src": "GL p.80", "ref": "n1-16", "lv": 2}, {"id": "ETH-042", "sub": "倫理・行動規範", "top": "支援機関向けの基本姿勢", "typ": "最も適切", "stem": "あなたの所属する仲介会社は、見込み客への架電営業を営業専門会社に委託することにした。委託に関する対応として最も適切なものはどれか。", "ch": ["情報の取扱いは委託先に一任し、依頼者への説明や了承は不要とする。", "委託業務の最終的な責任を免れないため、選定基準による選定、監督・指導を行い、委託業務の苦情も自社で受け付ける。", "委託業務に関する苦情は委託先が受け付けるため、自社は関与しない。", "委託した業務の責任は、委託契約の締結により委託先に移転する。"], "a": 1, "k": null, "ex": "M&A専門業者は委託業務に係る最終的な責任を免れないため、選定基準による選定、情報の適切な取扱いと依頼者への説明・了承、委託契約での業務の明確化、監督・指導、委託業務の苦情の委託元での受付を行うべきとされる。架電の営業専門会社への依頼も例に挙がっている。", "cn": ["誤り。情報の取扱いを適切にし、依頼者に説明した上で了承を得る。", "正しい。外部委託先について行うべき取組。", "誤り。委託業務の苦情等は委託元のM&A専門業者が受け付ける。", "誤り。委託業務に係る最終的な責任を免れない。"], "src": "GL p.82〜83", "ref": "n1-17", "lv": 2}, {"id": "ETH-043", "sub": "倫理・行動規範", "top": "支援機関向けの基本姿勢", "typ": "誤り", "stem": "一般社団法人M&A仲介協会が令和5年12月に策定・公表した4規程に含まれないものはどれか。", "ch": ["契約重要事項説明規程", "倫理規程", "手数料上限規程", "広告・営業規程"], "a": 2, "k": null, "ex": "自主規制団体として令和3年10月に設立された一般社団法人M&A仲介協会は、令和5年12月に①倫理規程、②コンプライアンス規程、③広告・営業規程、④契約重要事項説明規程の4規程を策定・公表した。GLは業界として統一的なルールを作り遵守する取組を期待している。", "cn": ["含まれる。", "含まれる。", "含まれない（本問の正答）。4規程に手数料上限に関する規程はない。", "含まれる。"], "src": "GL p.83", "ref": "n1-17", "lv": 2}, {"id": "ETH-044", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "正しい", "stem": "仲介者における利益相反に関するGLの記述として、正しいものはどれか。", "ch": ["利益相反が直ちに違法となるものではないが、仲介者は最低限の措置を講じる必要がある。", "利益相反のおそれがある場合、仲介者は仲介契約を締結することができない。", "構造的な利益相反があるため、GLは仲介者の利用を不適切と断じている。", "仲介者には、譲り渡し側の利益を優先する動機のみが指摘されている。"], "a": 0, "k": null, "ex": "仲介者は両当事者から依頼を受けるため一方の利益を優先・害するリスクがあるが、利益相反が直ちに違法となるものではない。リピーターになり得る譲り受け側、あるいは譲渡額連動の手数料では譲り渡し側を優先する動機が指摘され、仲介者を不適切と断ずるのではなく最低限の措置を講じることが必要とされる。", "cn": ["正しい。利益相反は直ちに違法ではなく、最低限の措置が必要とされる。", "誤り。契約締結自体を禁じるのではなく、措置を講じることを求める。", "誤り。実務では仲介者が多く用いられ、不適切と断ずることは現実的でないとされる。", "誤り。リピーターになり得る譲り受け側を優先する動機も指摘されている。"], "src": "GL p.98〜99", "ref": "n1-20", "lv": 2}, {"id": "ETH-045", "sub": "倫理・行動規範", "top": "善管注意義務・職業倫理", "typ": "全て選べ", "stem": "GLが、仲介者が利益相反に関し「最低限講じるべき措置」として示しているものを全て選べ。\nア 両当事者と仲介契約を締結する仲介者であること（両当事者から手数料を受領する定めがあればその旨）を両当事者に伝える\nイ バリュエーション、DDといった一方の意向を踏まえやすい工程の結論を決定しない\nウ 契約締結時に予め利益の対立が想定される事項を明示的に説明し、対立に係る情報を認識したら適時に明示的に開示する\nエ 相手方の手数料は、依頼者に説明せず仲介者の内部で管理する", "ch": ["ア、ウ", "イ、ウ、エ", "ア、イ、エ", "ア、イ、ウ"], "a": 3, "k": null, "ex": "仲介者が最低限講じるべき措置は、①両当事者と仲介契約を締結する仲介者であること（両当事者から手数料を受領する定めがあればその旨
